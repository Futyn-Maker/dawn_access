; Dawn Access — screen-reader accessibility mod for Until Dawn.
; This file lives in <game>\Windows\Bates\Binaries\Win64\ue4ss\Mods\DawnAccess\DawnAccess.ini
; Lines starting with ';' are comments. Values are read once at game start.

[General]
; The verbosity level: Full | Brief — how much the mod says of its own, such as the place of an
; item in a list, the kind of a control, which option a choice was settled on, or whether a
; mechanic was passed. What the game itself shows is read at either level. Switched on the fly
; with the Verbosity key below, and saved here.
Verbosity=Full
; auto = follow the game's text language; or a language code such as ru_RU, en_US.
Language=auto
; Say a greeting with the detected screen reader and language at startup.
SpeakOnLoad=1
; Error | Info | Verbose | Trace. The DevLogLevel key cycles it during play and saves the
; choice here.
LogLevel=Info
; Also write Mods\DawnAccess\DawnAccess.log (in addition to UE4SS.log).
LogFile=1

[Hotkeys]
; Keyboard keys. Modifiers: Ctrl+, Alt+, Shift+ (e.g. Ctrl+F9). Empty disables a hotkey.
; Leave F10, F11 and F12 alone: F10 is the Windows menu-bar key and freezes the game until Escape,
; F11 switches the game between full screen and a window, F12 is the Steam screenshot key.
Repeat=F5
ReadScreen=F6
Stop=F7
Help=F8
Subtitles=F9
LastSubtitle=F4
; Speech through the screen reader or through SAPI, switched on the fly; the choice is saved
; under [Speech] PreferSapi.
Speech=F3
; The verbosity level of the mod's own messages, switched on the fly; saved under [General] Verbosity.
Verbosity=F2
; The mod itself, switched off and on. Off, it says nothing and plays no sound, and the keys it
; takes only while you walk or aim go back to the game; switched on again, it reads the current
; screen. This is not saved: the mod starts switched on.
ModOnOff=F1
; Exploration: the next and the previous thing to walk to, where the target is now, walking
; there by itself, and the beacon on or off.
NextTarget=N
PreviousTarget=P
Where=H
Walk=G
Beacon=T
DevDumpTree=Ctrl+F9
DevTrace=Ctrl+F10
DevLogLevel=Ctrl+F11
; Gamepad chords: hold ChordHold and press one of the buttons below. While ChordHold is down
; the game sees no button, so a chord is never also a press for the game. Hold ChordHold with
; one thumb and press the second button with the other. On a DualSense or DualShock 4 the
; game calls the click of the touchpad Gamepad_Special_Left and Options Gamepad_Special_Right.
ChordHold=Gamepad_Special_Left
ChordRepeat=Gamepad_FaceButton_Bottom
ChordReadScreen=Gamepad_FaceButton_Left
ChordStop=Gamepad_FaceButton_Right
ChordHelp=Gamepad_FaceButton_Top
ChordSubtitles=Gamepad_RightTrigger
ChordLastSubtitle=Gamepad_RightShoulder
ChordSpeech=Gamepad_RightThumbstick
ChordVerbosity=Gamepad_LeftThumbstick
ChordModOnOff=Gamepad_Special_Right
; The developer keys as chords: the screen dump, and the log level (cycled, and saved under
; [General] LogLevel).
ChordDevDumpTree=Gamepad_LeftShoulder
ChordDevLogLevel=Gamepad_LeftTrigger

; While the player walks the character freely the game leaves these buttons unused, so the
; exploration keys answer them there without the chord.
ExploreNext=Gamepad_DPad_Right
ExplorePrevious=Gamepad_DPad_Left
ExploreWhere=Gamepad_DPad_Up
ExploreWalk=Gamepad_FaceButton_Left
ExploreBeacon=Gamepad_DPad_Down

[Speech]
; How long the same text is ignored when focus lands on it again.
FocusDedupeMs=150
; 1 makes SAPI speak even while a screen reader is running; 0 leaves the speech to the screen
; reader. Without a screen reader SAPI speaks either way. The Speech hotkey switches this
; during play and saves the switch here.
PreferSapi=0

[Sounds]
; Volume of the cues the mod plays itself, 0 to 100; 0 turns them off. A rising two-note tone
; marks a choice committing or a challenge won, a falling one a challenge lost or the time of a
; choice run out; a tick-tock marks a choice or a stage with a time limit; three quick taps
; mark an interruption; a quick-time event plays its direction (notes climbing for up, falling
; for down, a note in the left or the right ear for the sides); blips of rising or falling pitch
; follow a bar that fills or empties; a soft tone sliding up marks the game giving you control
; of the character, and one sliding down its taking control away.
Volume=80

[Subtitles]
; Read subtitle lines as they appear. The Subtitles hotkey switches this during play and
; saves the switch here, so a new start begins the way the last one ended.
Read=1

[Exploration]
; The beacon that leads to the chosen target along the walkable route: it sounds on the side
; of the next turn, rises in pitch as the target comes closer and drops an octave when the
; way is behind. The Beacon hotkey switches it during play and saves the switch here.
Beacon=1
; Milliseconds between two beacon sounds.
BeaconIntervalMs=500
; The look beacon: the aim sound that leads every turn to a point the game waits for: a look
; once the thing to use is at hand but the camera or the character does not look at it, the
; turn of a totem towards its vision, the view resting on a framing (a telescope, a selfie), and
; an item in hand turned until it reveals. While it leads, the Beacon hotkey switches it (instead
; of the beacon while walking), and saves the switch here.
LookSound=1
; How far, in metres, the places of a scene are listed: everything the character can reach
; on foot within this distance, so that what one space holds is listed at once and not as
; she walks toward it.
Range=200
; Target the nearest thing by itself when exploration begins.
AutoTarget=1
; Milliseconds between the word that the walk has begun and the character's first step,
; so the screen reader is heard before anything moves.
WalkDelayMs=500

[Shooting]
; The aim sound while aiming: a blip in the ear on the side of the target, higher when the
; target is above the aim and lower when below, faster as the aim nears it, and a quick double
; ping while the aim is on the target. The Beacon hotkey switches it while aiming.
AimSound=1

[Features]
; 1 enables, 0 disables an area of the mod.
Menus=1
Subtitles=1
Hud=1
Prompts=1
Choices=1
Qte=1
DontMove=1
Exploration=1
Totems=1

[Diag]
TraceClassPrefixes=WBP_,BMUI
; 1 shows the game's first-launch screens once more (the splash, the privacy choice and the
; first-time settings): the game's own "completed" flags are cleared in memory as it starts,
; nothing on disk is touched, and the game saves them again when the screens are done. Set it
; back to 0 afterwards.
FirstLaunch=0
