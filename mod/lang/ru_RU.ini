help.gesture=Полукруг левым стиком: по часовой стрелке — толкните стик до упора вверх, затем вправо, затем вниз; против часовой — вверх, затем влево, затем вниз; каждый шаг не позже чем через полсекунды после предыдущего. На клавиатуре клавиша из подсказки делает это сразу.
help.walk={0} ведёт персонажа к выбранной цели; повторное нажатие останавливает.
help.looksound=Пока цель ждёт взгляда, {0} включает и выключает маяк взгляда, а не основной маяк.
help.lookturn.pad=Чтобы развернуть персонажа к цели на месте, слегка, меньше чем наполовину, толкните {0} в сторону звука и отпустите в течение секунды; если толкнуть сильнее и держать, персонаж пойдёт. Когда на цель должна смотреть камера, поверните её в сторону звука: {1}.
help.lookturn=Чтобы развернуть персонажа к цели на месте, коротко нажмите клавишу движения в сторону звука; если клавишу держать, персонаж пойдёт.
help.where={0} повторяет цель с расстоянием по пути и направлением.
