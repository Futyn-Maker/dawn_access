turn.left=Поворачивайте влево, осталось {0}%.
turn.up=Поворачивайте вверх, осталось {0}%.
turn.down=Поворачивайте вниз, осталось {0}%.
help.nudge=Сигналы ведут взгляд к кадру, которого ждёт сцена: звучат с его стороны, выше или ниже. Поворачивайте взгляд мышью или клавишами со стрелками; двойной сигнал означает, что взгляд на кадре. {0} говорит, где кадр, {1} выключает и включает маяк взгляда.
help.nudge.pad=Сигналы ведут взгляд к кадру, которого ждёт сцена: звучат с его стороны, выше или ниже. Поворачивайте взгляд правым стиком; двойной сигнал означает, что взгляд на кадре. {0} говорит, где кадр, {1} выключает и включает маяк взгляда.
help.turn=Сигналы ведут поворот предмета в руках до места, где он раскрывается: справа или слева, а для поворота вверх или вниз выше или ниже, и чем ближе, тем чаще. Двойной сигнал означает, что предмет раскрыт. {0} говорит, куда поворачивать и сколько осталось, {1} выключает и включает маяк взгляда.
help.boiler=Когда загорается лампа давления, звучит двойной сигнал: сразу нажмите {0}, пока она горит, около двух секунд; нажатие при погасшей лампе — неудача, и всё начинается сначала. После поворота отпустите {0}: кнопка, удержанная с захвата, засчитывается сразу, пока лампа ещё не горит.
help.shake=Снежный шар можно встряхнуть: нажмите W или S. Игра не показывает для этого подсказки.
help.shake.pad=Снежный шар можно встряхнуть: толкните левый стик вверх или вниз. Игра не показывает для этого подсказки.
help.shake.ps=Снежный шар можно встряхнуть: встряхните сам контроллер; игра чувствует это датчиком движения. Игра не показывает для этого подсказки.
help.shake.ps.off=Снежный шар можно встряхнуть, но не этим контроллером, пока в настройках управления игры выключен параметр «{0}»: нажмите W или S на клавиатуре или включите этот параметр. Игра не показывает для этого подсказки.
help.gesture=Полукруг левым стиком: по часовой стрелке — толкните стик до упора вверх, затем вправо, затем вниз; против часовой — вверх, затем влево, затем вниз; каждый шаг не позже чем через полсекунды после предыдущего. На клавиатуре клавиша из подсказки делает это сразу.
help.gesture.held=Здесь полукруг делается с зажатой кнопкой {0}: если отпустить её, предмет упадёт.
help.steprun=Удерживайте {0}: пока он нажат, шаг идёт за шагом, и каждый шаг звучит тоном выше.
help.swipe.held=Здесь движение делается с зажатой кнопкой {0}: сначала зажмите {0} и держите, затем сделайте движение один раз; оно засчитывается в тот миг, когда сделано, а удерживать его не нужно.
