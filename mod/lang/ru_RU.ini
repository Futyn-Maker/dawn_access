help.dilemma.pad=Поверните прицел правым стиком: влево — {0}, вправо — {1}. Звук прицела звучит с той стороны, куда он повёрнут; двойной сигнал значит, что сторона выбрана. Затем {2} — выстрел. Если ничего не делать, время выйдет, и это тоже выбор.
help.dilemma=Поверните прицел мышью или клавишами движения: влево — {0}, вправо — {1}. Звук прицела звучит с той стороны, куда он повёрнут; двойной сигнал значит, что сторона выбрана. Затем {2} — выстрел. Если ничего не делать, время выйдет, и это тоже выбор.
shoot.unnamed=Цель
shoot.sound.on=Звук прицела включён.
shoot.sound.off=Звук прицела выключен.
help.shoot=Цельтесь мышью или клавишами движения. Сигналы звучат в ухе со стороны цели, выше, когда цель выше прицела, и ниже, когда ниже, и учащаются по мере приближения прицела к ней; быстрый двойной сигнал означает, что игра сейчас засчитает выстрел по цели. {0} — выстрел. {1} и {2} переключают цели, {3} говорит, где цель, {4} выключает и включает звук прицела.
help.shoot.pad=Цельтесь правым стиком. Сигналы звучат в ухе со стороны цели, выше, когда цель выше прицела, и ниже, когда ниже, и учащаются по мере приближения прицела к ней; быстрый двойной сигнал означает, что игра сейчас засчитает выстрел по цели. {0} — выстрел. {1} и {2} переключают цели, {3} говорит, где цель, {4} выключает и включает звук прицела. На DualSense с включёнными адаптивными триггерами выстрел засчитывается, только когда курок дожат за точку сопротивления.
help.shoot.snap={0} наводит прицел на цель и держит его на ней, даже на движущейся, пока вы не начнёте целиться сами; выстрела не делает: стреляет {1}.
shoot.snap.release=Сначала отпустите {0}.
