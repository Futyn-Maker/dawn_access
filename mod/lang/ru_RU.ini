help.qte=Нажмите названную клавишу, пока не вышло время. Звук идёт вместе с ней, и за ним успеть легче, когда времени мало: три восходящие ноты просят вверх, W, три нисходящие вниз, S, две ноты в левом ухе влево, A, в правом ухе вправо, D, если вы их не переназначали.
help.qte.pad=Нажмите названную кнопку или отклоните стик в названную сторону, пока не вышло время. Звук идёт вместе со словами, и за ним успеть легче, когда времени мало: три восходящие ноты значат вверх, три нисходящие вниз, две ноты в левом ухе влево, в правом ухе вправо; направление кнопки — её место среди четырёх: вверх — треугольник или Y, вниз — крестик или A, влево — квадрат или X, вправо — кружок или B.
dontmove.steer=Отвечайте на каждый сигнал одним коротким нажатием: {0}; двойной сигнал означает, что метка вернулась.
dontmove.passive=Держите контроллер неподвижно.
dontmove.clock.half=Время уходит.
dontmove.clock.most=Время почти вышло.
dontmove.active.start=Спокойно!
help.dontmove.dynamic=Настройка игры «{0}» — «{1}»: вариант зависит от устройства, которым вы пользовались последним перед началом: пад PlayStation даёт пассивный, клавиатура или другой пад — активный; в активном варианте любое касание пада PlayStation заставляет игру не принимать ни стик, ни клавиши. Выберите там «{2}» или «{3}», чтобы вариант не менялся.
help.dontmove.active=Считайте ноты. Двойной сигнал каждые полсекунды означает, что метка внутри и делать ничего не нужно. Две одинаковые ноты в одном ухе означают: коротко нажмите {0} в ту сторону, сейчас. Три ноты вверх — нажмите вверх, три ноты вниз — вниз. Глухой удар перед сигналом означает, что метка уже за краем; тогда сигнал указывает путь назад к центру. Отвечайте одним коротким нажатием, как щелчком, как только услышали сигнал, и слушайте: двойной сигнал — метка вернулась; тот же удар с сигналом снова — нажмите ещё раз; сигнал с противоположной стороны — вы перелетели, один раз нажмите обратно. Удержание проносит метку через всю зону за десятую долю секунды. Игра дёргает метку рывками, по одному направлению за раз, с промежутком в несколько секунд; рывок, отвеченный примерно за три четверти секунды, ничего не стоит, дальше каждое мгновение за краем тратит запас, который не восполняется, и сигнал часов звучит, когда потрачена половина и три четверти. Настройки игры «Чувствительность клавиш» и «Чувствительность джойстика» для «Не двигаться» делают нажатия мягче.
help.dontmove.passive=Держите контроллер неподвижно. В этом варианте игра следит только за тем, движется ли контроллер, а не за тем, где метка: глухой удар пять раз в секунду означает, что она видит движение, и после короткой отсрочки в начале каждое мгновение движения тратит запас, который не восполняется; двойной сигнал каждые полсекунды означает, что контроллер неподвижен. Сигнал часов звучит, когда потрачена половина и три четверти запаса.
