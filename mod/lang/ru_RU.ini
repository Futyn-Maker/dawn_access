help.totem=Сигналы ведут к предзнаменованию на тотеме: с той стороны, где оно от центра обзора, выше или ниже. Наклоните левый стик в его сторону. Двойной сигнал означает, что взгляд на нём: не двигайтесь, пока не начнётся видение.
help.swipe=Телефон разблокируется после нескольких быстрых свайпов подряд: повторяйте {0} снова и снова, быстро. Каждый свайп немного продвигает ползунок, а через мгновение после последнего он откатывается назад. Сигналы повышаются, когда он заполняется, и понижаются, когда откатывается.
