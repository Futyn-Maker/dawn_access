help.explore={0} и {1} выбирают, к чему идти, {2} включает и выключает маяк. Маяк звучит с той стороны, где цель, и повышается по мере приближения; когда цель позади, он звучит на октаву ниже. Идите на звук клавишами движения.
help.explore.pad=На геймпаде во время ходьбы они работают без сочетаний: {0} — следующая цель, {1} — предыдущая, {2} — где цель, {3} — маяк, {4} — идти к цели.
