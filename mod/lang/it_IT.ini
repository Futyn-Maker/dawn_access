help.nudge=I segnali guidano lo sguardo verso l'inquadratura che la scena aspetta: dal suo lato, più in alto o più in basso. Gira lo sguardo con il mouse o con i tasti freccia; il doppio segnale significa che lo sguardo è sull'inquadratura. {0} dice dov'è l'inquadratura, {1} disattiva e riattiva il segnale dello sguardo.
help.nudge.pad=I segnali guidano lo sguardo verso l'inquadratura che la scena aspetta: dal suo lato, più in alto o più in basso. Gira lo sguardo con la levetta destra; il doppio segnale significa che lo sguardo è sull'inquadratura. {0} dice dov'è l'inquadratura, {1} disattiva e riattiva il segnale dello sguardo.
help.turn=I segnali guidano la rotazione dell'oggetto in mano fino al punto in cui si rivela: a destra o a sinistra, oppure più acuti o più gravi per una rotazione verso l'alto o il basso, e più rapidi quanto più è vicino. Il doppio segnale significa che si è rivelato. {0} dice da che parte girare e quanto manca, {1} disattiva e riattiva il segnale dello sguardo.
help.boiler=Quando la spia della pressione si accende, suona il doppio segnale: premi subito {0}, finché è accesa, circa due secondi; premere a spia spenta fallisce e tutto ricomincia. Dopo la rotazione, rilascia {0}: un tasto ancora premuto dalla presa conta subito, prima che la spia si accenda.
help.shake=La palla di neve si può scuotere: premi W o S. Il gioco non mostra alcun suggerimento per questo.
help.shake.pad=La palla di neve si può scuotere: spingi la levetta sinistra in su o in giù. Il gioco non mostra alcun suggerimento per questo.
help.shake.ps=La palla di neve si può scuotere: scuoti il controller stesso; il gioco lo rileva con il sensore di movimento. Il gioco non mostra alcun suggerimento per questo.
help.shake.ps.off=La palla di neve si può scuotere, ma non con questo controller finché l’impostazione “{0}” è disattivata nei comandi del gioco: premi W o S sulla tastiera oppure attiva l’impostazione. Il gioco non mostra alcun suggerimento per questo.
help.gesture=Un semicerchio con la levetta sinistra: in senso orario spingila del tutto in alto, poi a destra, poi in basso; in senso antiorario in alto, poi a sinistra, poi in basso; ogni passo entro mezzo secondo dal precedente. Sulla tastiera il tasto indicato lo fa subito.
help.gesture.held=Qui il semicerchio si fa tenendo premuto {0}: se lo rilasci, ciò che tieni cade.
help.steprun=Tieni {0}: finché è tenuto, un passo segue l'altro, ognuno con un tono più alto.
help.swipe.held=Qui il movimento si fa tenendo premuto {0}: premi prima {0} e tienilo premuto, poi fai il movimento una volta; conta nel momento in cui lo fai, e mantenerlo non fa altro.
