help.totem=I bip seguono la premonizione sul totem: dal lato in cui si trova rispetto al centro della visuale, più in alto o più in basso. Spingi la levetta sinistra verso di essa. Il doppio bip significa che la visuale è su di essa: resta fermo fino alla visione. {0} disattiva e riattiva il segnale dello sguardo.
help.swipe=Il telefono si sblocca dopo diversi scorrimenti rapidi di seguito: ripeti {0} più e più volte, velocemente. Ogni scorrimento fa avanzare un po' il cursore, che un attimo dopo l'ultimo torna indietro. I bip salgono mentre si riempie e scendono quando torna indietro.
hud.objective=Obiettivo: {0}
