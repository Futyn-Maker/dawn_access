help.dilemma.pad=Gira la mira con la levetta destra: a sinistra c'è {0}, a destra {1}. Il suono della mira arriva dal lato verso cui punta; un doppio segnale indica che quel lato è scelto. Poi {2} spara. Se non fai nulla il tempo scade, e anche questa è una scelta.
help.dilemma=Gira la mira con il mouse o i tasti di movimento: a sinistra c'è {0}, a destra {1}. Il suono della mira arriva dal lato verso cui punta; un doppio segnale indica che quel lato è scelto. Poi {2} spara. Se non fai nulla il tempo scade, e anche questa è una scelta.
shoot.unnamed=Bersaglio
shoot.sound.on=Suono di mira attivo.
shoot.sound.off=Suono di mira disattivato.
help.shoot=Mira con il mouse o con i tasti di movimento. I segnali suonano nell'orecchio dal lato del bersaglio, più acuti quando è sopra il mirino e più gravi quando è sotto, e si fanno più rapidi man mano che il mirino si avvicina; un doppio segnale rapido significa che il gioco conterebbe ora un colpo sul bersaglio. {0} spara. {1} e {2} passano da un bersaglio all'altro, {3} dice dov'è il bersaglio, {4} disattiva e riattiva il suono di mira.
help.shoot.pad=Mira con la levetta destra. I segnali suonano nell'orecchio dal lato del bersaglio, più acuti quando è sopra il mirino e più gravi quando è sotto, e si fanno più rapidi man mano che il mirino si avvicina; un doppio segnale rapido significa che il gioco conterebbe ora un colpo sul bersaglio. {0} spara. {1} e {2} passano da un bersaglio all'altro, {3} dice dov'è il bersaglio, {4} disattiva e riattiva il suono di mira. Su un DualSense con i grilletti adattivi attivi, il colpo conta solo quando il grilletto viene premuto oltre la resistenza.
help.shoot.snap={0} porta la mira sul bersaglio e ve la tiene, anche su uno che si muove, finché non miri tu; non spara: {1} spara.
shoot.snap.release=Prima rilascia {0}.
