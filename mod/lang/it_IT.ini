dontmove.steer=Rispondi a ogni segnale con un breve tocco di {0}; il doppio segnale dice che il segnalino è tornato.
dontmove.passive=Tieni fermo il controller.
help.dontmove.active=Conta le note. Il doppio segnale ogni mezzo secondo significa che il segnalino è dentro e non è richiesto nulla. Due note uguali in un orecchio significano: un breve tocco di {0} da quel lato, ora. Tre note ascendenti, in alto; tre discendenti, in basso. Un colpo sordo prima del segnale significa che il segnalino ha già superato il bordo; il segnale indica allora la via del ritorno al centro. Rispondi con un solo tocco breve, come un clic, appena senti il segnale, poi ascolta: il doppio segnale significa che il segnalino è tornato; lo stesso colpo con segnale di nuovo, un altro tocco; un segnale dal lato opposto, sei andato oltre, un tocco indietro. Una pressione tenuta attraversa tutta la zona in un decimo di secondo. Il gioco tira il segnalino a strappi, una direzione alla volta, a qualche secondo di distanza; uno strappo a cui rispondi entro circa tre quarti di secondo non costa nulla, poi ogni istante oltre il bordo consuma una riserva che non si ricarica mai, e il segnale dell'orologio suona quando se ne sono andati metà e tre quarti. Le impostazioni del gioco per la sensibilità di tasti e levetta in Non muoverti rendono i tocchi più delicati.
help.dontmove.passive=Tieni fermo il controller. Il doppio segnale ogni mezzo secondo significa che il segnalino è al centro. Un segnale suona dove il segnalino si è spostato, dal suo lato e più acuto se è in alto, più rapido quanto più lontano; un colpo sordo prima del segnale significa che ha superato il bordo e il tempo può scorrere.
