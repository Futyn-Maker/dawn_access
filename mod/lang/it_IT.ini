help.qte=Premi il tasto annunciato prima che scada il tempo. Il suono arriva insieme e si segue più in fretta quando il tempo è poco: tre note ascendenti chiedono su, W, tre discendenti giù, S, due note nell'orecchio sinistro sinistra, A, in quello destro destra, D, a meno che tu non li abbia riassegnati.
help.qte.pad=Premi il pulsante o spingi la levetta nella direzione annunciata prima che scada il tempo. Il suono arriva con le parole e si segue più in fretta quando il tempo è poco: tre note ascendenti significano su, tre discendenti giù, due note nell'orecchio sinistro sinistra, in quello destro destra; la direzione di un pulsante è il suo posto fra i quattro: su è triangolo o Y, giù croce o A, sinistra quadrato o X, destra cerchio o B.
dontmove.steer=Rispondi a ogni segnale con un breve tocco di {0}; il doppio segnale dice che il segnalino è tornato.
dontmove.passive=Tieni fermo il controller.
dontmove.clock.half=Il tempo sta per scadere.
dontmove.clock.most=Il tempo è quasi scaduto.
dontmove.active.start=Stai calmo!
help.dontmove.dynamic=L'impostazione del gioco «{0}» è su {1}: la versione segue il dispositivo usato per ultimo prima dell'inizio, il controller PlayStation dà quella passiva, la tastiera o un altro controller quella attiva; in una versione attiva, qualsiasi uso del controller PlayStation fa ignorare al gioco la levetta e i tasti. Scegli lì {2} o {3} per tenere una sola versione.
help.dontmove.active=Conta le note. Il doppio segnale ogni mezzo secondo significa che il segnalino è dentro e non è richiesto nulla. Due note uguali in un orecchio significano: un breve tocco di {0} da quel lato, ora. Tre note ascendenti, in alto; tre discendenti, in basso. Un colpo sordo prima del segnale significa che il segnalino ha già superato il bordo; il segnale indica allora la via del ritorno al centro. Rispondi con un solo tocco breve, come un clic, appena senti il segnale, poi ascolta: il doppio segnale significa che il segnalino è tornato; lo stesso colpo con segnale di nuovo, un altro tocco; un segnale dal lato opposto, sei andato oltre, un tocco indietro. Una pressione tenuta attraversa tutta la zona in un decimo di secondo. Il gioco tira il segnalino a strappi, una direzione alla volta, a qualche secondo di distanza; uno strappo a cui rispondi entro circa tre quarti di secondo non costa nulla, poi ogni istante oltre il bordo consuma una riserva che non si ricarica mai, e il segnale dell'orologio suona quando se ne sono andati metà e tre quarti. Le impostazioni del gioco per la sensibilità di tasti e levetta in Non muoverti rendono i tocchi più delicati.
help.dontmove.passive=Tieni fermo il controller. In questa versione il gioco controlla solo se il controller si muove, non dove si trova l’indicatore: un colpo sordo cinque volte al secondo significa che vede il controller muoversi, e dopo un breve margine all’inizio ogni istante di movimento consuma una riserva che non si ricarica mai; il doppio bip ogni mezzo secondo significa che è fermo. Il segnale dell’orologio suona quando è stata consumata metà e tre quarti della riserva.
