help.walk={0} porta il personaggio all'obiettivo; premi di nuovo per fermarti.
help.looksound=Finché il bersaglio attende uno sguardo, {0} attiva e disattiva il segnale dello sguardo invece del segnale acustico.
help.beam=Su una trave la levetta muove il personaggio solo nella direzione in cui guarda; spingerla indietro lo fa girare. Il segnale acustico guida la levetta lungo la trave e {0} la percorre.
help.lookturn.pad=Per girare il personaggio verso l'obiettivo sul posto, spingi leggermente la {0} verso il suono, meno di metà corsa, e rilasciala entro un secondo; spinta di più e tenuta, il personaggio cammina. Quando la telecamera deve guardare l'obiettivo, girala verso il suono con la {1}.
help.lookturn=Per girare il personaggio verso l'obiettivo sul posto, premi brevemente un tasto di movimento verso il suono; se lo tieni premuto, il personaggio cammina.
help.where={0} ripete l'obiettivo con la distanza lungo il percorso e la direzione.
