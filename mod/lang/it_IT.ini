help.totem=I bip seguono la premonizione sul totem: dal lato in cui si trova rispetto al centro della visuale, più in alto o più in basso. Spingi la levetta sinistra verso di essa. Il doppio bip significa che la visuale è su di essa: resta fermo fino alla visione.
