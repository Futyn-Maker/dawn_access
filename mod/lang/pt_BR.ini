help.nudge=Os bipes levam o olhar ao enquadramento que a cena espera: do lado dele, mais agudos ou mais graves. Gire o olhar com o mouse ou as setas; o bipe duplo significa que o olhar está nele. {0} diz onde está o enquadramento, {1} desliga e liga o sinal sonoro do olhar.
help.nudge.pad=Os bipes levam o olhar ao enquadramento que a cena espera: do lado dele, mais agudos ou mais graves. Gire o olhar com o analógico direito; o bipe duplo significa que o olhar está nele. {0} diz onde está o enquadramento, {1} desliga e liga o sinal sonoro do olhar.
help.turn=Os bipes guiam o giro do objeto nas mãos até o ponto em que ele se revela: à direita ou à esquerda, ou mais agudos ou mais graves para um giro para cima ou para baixo, e mais rápidos quanto mais perto. O bipe duplo significa que ele se revelou. {0} diz para onde girar e quanto falta, {1} desliga e liga o sinal sonoro do olhar.
help.boiler=Quando a lâmpada de pressão acende, soa o bipe duplo: aperte {0} na hora, enquanto ela está acesa, por cerca de dois segundos; apertar com a lâmpada apagada falha e tudo recomeça. Depois de girar, solte {0}: um botão ainda segurado desde a pegada conta na hora, antes de a lâmpada acender.
help.shake=O globo de neve pode ser sacudido: pressione W ou S. O jogo não mostra nenhum aviso para isso.
help.shake.pad=O globo de neve pode ser sacudido: empurre o direcional esquerdo para cima ou para baixo. O jogo não mostra nenhum aviso para isso.
help.shake.ps=O globo de neve pode ser sacudido: sacuda o próprio controle; o jogo percebe isso pelo sensor de movimento. O jogo não mostra nenhum aviso para isso.
help.shake.ps.off=O globo de neve pode ser sacudido, mas não com este controle enquanto a opção “{0}” estiver desativada nos controles do jogo: pressione W ou S no teclado ou ative essa opção. O jogo não mostra nenhum aviso para isso.
help.gesture=Um semicírculo com o analógico esquerdo: no sentido horário, empurre-o até o fim para cima, depois para a direita, depois para baixo; no anti-horário, para cima, depois para a esquerda, depois para baixo; cada passo em até meio segundo após o anterior. No teclado, a tecla do aviso faz isso na hora.
help.gesture.held=Aqui o semicírculo é feito com {0} pressionado: se soltar, você deixa cair o que segura.
help.steprun=Mantenha {0}: enquanto estiver pressionado, um passo segue o outro, cada um com um tom mais alto.
help.swipe.held=Aqui o movimento é feito com {0} pressionado: pressione {0} primeiro e mantenha, depois faça o movimento uma vez; ele conta no momento em que é feito, e mantê-lo não faz mais nada.
