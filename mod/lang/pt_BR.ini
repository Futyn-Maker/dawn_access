help.walk={0} leva o personagem até o alvo; pressione de novo para parar.
help.looksound=Enquanto o alvo espera um olhar, {0} liga e desliga o sinal sonoro do olhar em vez do sinal sonoro.
help.beam=Sobre uma viga, o analógico só move o personagem para onde ele olha; empurrar para trás o faz virar. O sinal sonoro guia o analógico ao longo da viga, e {0} anda por ela.
help.lookturn.pad=Para virar o personagem para o alvo sem sair do lugar, empurre o {0} levemente na direção do som, menos da metade, e solte em até um segundo; se empurrar mais e segurar, o personagem começa a andar. Quando a câmera precisar olhar para o alvo, gire-a na direção do som com o {1}.
help.lookturn=Para virar o personagem para o alvo sem sair do lugar, toque rapidamente uma tecla de movimento na direção do som; se segurar, o personagem começa a andar.
help.where={0} repete o alvo com a distância pelo caminho e a direção.
