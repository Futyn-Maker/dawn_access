help.totem=Os bipes seguem a premonição no totem: do lado em que ela está em relação ao centro da visão, mais acima ou mais abaixo. Empurre o analógico esquerdo na direção dela. O bipe duplo significa que a visão está sobre ela: fique parado até a visão aparecer. {0} desliga e liga o sinal sonoro do olhar.
help.swipe=O celular é desbloqueado depois de vários deslizes rápidos seguidos: repita {0} várias vezes, rápido. Cada deslize avança um pouco o controle, e um instante depois do último ele volta. Os bipes sobem enquanto ele enche e descem quando ele volta.
hud.objective=Objetivo: {0}
