help.dilemma.pad=Gire a mira com o direcional direito: à esquerda está {0}, à direita {1}. O som da mira vem do lado para onde ela aponta; um bipe duplo significa que esse lado foi escolhido. Depois, {2} atira. Se não fizer nada, o tempo acaba, e isso também é uma escolha.
help.dilemma=Gire a mira com o mouse ou as teclas de movimento: à esquerda está {0}, à direita {1}. O som da mira vem do lado para onde ela aponta; um bipe duplo significa que esse lado foi escolhido. Depois, {2} atira. Se não fizer nada, o tempo acaba, e isso também é uma escolha.
shoot.unnamed=Alvo
shoot.sound.on=Som de mira ligado.
shoot.sound.off=Som de mira desligado.
help.shoot=Mire com o mouse ou com as teclas de movimento. Os bipes soam no ouvido do lado do alvo, mais agudos quando ele está acima da mira e mais graves quando está abaixo, e ficam mais rápidos à medida que a mira se aproxima; um bipe duplo rápido significa que o jogo contaria agora um tiro no alvo. {0} atira. {1} e {2} trocam de alvo, {3} diz onde está o alvo, {4} desliga e liga o som de mira.
help.shoot.pad=Mire com o analógico direito. Os bipes soam no ouvido do lado do alvo, mais agudos quando ele está acima da mira e mais graves quando está abaixo, e ficam mais rápidos à medida que a mira se aproxima; um bipe duplo rápido significa que o jogo contaria agora um tiro no alvo. {0} atira. {1} e {2} trocam de alvo, {3} diz onde está o alvo, {4} desliga e liga o som de mira. Em um DualSense com os gatilhos adaptáveis ligados, o tiro só conta quando o gatilho é apertado além da resistência.
help.shoot.snap={0} põe a mira no alvo e a mantém ali, também num alvo que se move, até você mirar por conta própria; não atira: {1} atira.
shoot.snap.release=Solte {0} primeiro.
