help.qte=Aperte a tecla anunciada antes de o tempo acabar. O som vem junto e é mais rápido de seguir quando o tempo é curto: três notas subindo pedem para cima, W, três descendo para baixo, S, duas notas no ouvido esquerdo para a esquerda, A, no ouvido direito para a direita, D, a menos que você as tenha remapeado.
help.qte.pad=Aperte o botão ou mova o analógico na direção anunciada antes de o tempo acabar. O som vem junto com as palavras e é mais rápido de seguir quando o tempo é curto: três notas subindo significam para cima, três descendo para baixo, duas notas no ouvido esquerdo esquerda, no ouvido direito direita; a direção de um botão é o lugar dele entre os quatro: cima é triângulo ou Y, baixo xis ou A, esquerda quadrado ou X, direita círculo ou B.
help.qte.demo={0} inicia ou para a demonstração: o exemplo de QTE que o jogo mostra para estas configurações, narrado como no jogo. Ela para quando o foco sai da linha ou o valor muda.
qte.demo.key=Demonstração: {0}.
qte.demo.on=Demonstração ligada.
qte.demo.off=Demonstração desligada.
dontmove.steer=Responda a cada sinal com um toque breve de {0}; o bipe duplo diz que o marcador voltou.
dontmove.passive=Mantenha o controle parado.
dontmove.clock.half=O tempo está acabando.
dontmove.clock.most=O tempo está quase esgotado.
dontmove.active.start=Fique calmo!
help.dontmove.dynamic=A configuração do jogo “{0}” está em {1}: a versão segue o dispositivo que você usou por último antes do início; o controle PlayStation dá a passiva, e o teclado ou outro controle, a ativa. Numa versão ativa, qualquer uso do controle PlayStation faz o jogo ignorar o analógico e as teclas. Escolha ali {2} ou {3} para manter uma só versão.
help.dontmove.active=Conte as notas. O bipe duplo a cada meio segundo significa que o marcador está dentro e nada é pedido. Duas notas iguais em um ouvido significam: dê um toque breve de {0} para esse lado, agora. Três notas subindo, para cima; três descendo, para baixo. Uma batida grave antes do sinal significa que o marcador já passou da borda; o sinal então aponta o caminho de volta ao centro. Responda com um único toque breve, como um clique, assim que ouvir o sinal, e escute: o bipe duplo significa que o marcador voltou; a mesma batida com sinal de novo, mais um toque; um sinal do lado oposto, você passou do ponto, um toque de volta. Um pressionar mantido cruza a zona inteira em um décimo de segundo. O jogo puxa o marcador em arrancos, uma direção de cada vez, com alguns segundos entre eles; um arranco respondido em cerca de três quartos de segundo não custa nada, depois cada instante além da borda gasta uma reserva que nunca se enche de novo, e o sinal do relógio soa quando metade e três quartos se foram. Os ajustes do próprio jogo de sensibilidade das teclas e do analógico para Não se mova deixam os toques mais suaves.
help.dontmove.passive=Mantenha o controle parado. Nesta versão o jogo observa apenas se o controle se move, não onde está o marcador: uma batida grave cinco vezes por segundo significa que ele vê o controle se mexer, e depois de uma breve tolerância no início cada instante de movimento gasta uma reserva que nunca se recupera; o bipe duplo a cada meio segundo significa que ele está parado. O sinal do relógio soa quando metade e três quartos da reserva se foram.
