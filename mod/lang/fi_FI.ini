help.dilemma.pad=Käännä tähtäintä oikealla tikulla: vasemmalla on {0}, oikealla {1}. Tähtäimen ääni kuuluu siltä puolelta, jota kohti se osoittaa; kaksoisääni tarkoittaa, että puoli on valittu. Sen jälkeen {2} ampuu. Jos et tee mitään, aika loppuu, ja sekin on valinta.
help.dilemma=Käännä tähtäintä hiirellä tai liikenäppäimillä: vasemmalla on {0}, oikealla {1}. Tähtäimen ääni kuuluu siltä puolelta, jota kohti se osoittaa; kaksoisääni tarkoittaa, että puoli on valittu. Sen jälkeen {2} ampuu. Jos et tee mitään, aika loppuu, ja sekin on valinta.
