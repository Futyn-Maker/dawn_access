help.qte=Paina ilmoitettua näppäintä ennen kuin aika loppuu. Ääni tulee sen mukana ja on nopeampi seurata, kun aikaa on vähän: kolme nousevaa säveltä pyytää ylös, W, kolme laskevaa alas, S, kaksi säveltä vasemmassa korvassa vasemmalle, A, oikeassa korvassa oikealle, D, ellet ole sitonut niitä toisin.
help.qte.pad=Paina ilmoitettua painiketta tai työnnä sauvaa ilmoitettuun suuntaan ennen kuin aika loppuu. Ääni tulee sanojen mukana ja on nopeampi seurata, kun aikaa on vähän: kolme nousevaa säveltä tarkoittaa ylös, kolme laskevaa alas, kaksi säveltä vasemmassa korvassa vasemmalle, oikeassa korvassa oikealle; painikkeen suunta on sen paikka neljän joukossa: ylös on kolmio tai Y, alas risti tai A, vasemmalle neliö tai X, oikealle ympyrä tai B.
help.qte.demo={0} käynnistää tai pysäyttää esittelyn: QTE-esimerkin, jonka peli näyttää näille asetuksille, luettuna kuten pelissä. Se pysähtyy, kun kohdistus siirtyy riviltä tai sen arvo muuttuu.
