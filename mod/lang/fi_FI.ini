help.totem=Piippaukset seuraavat toteemin ennettä: sillä puolella, jolla se on näkymän keskeltä katsoen, ylempänä tai alempana. Työnnä vasenta tattia sitä kohti. Kaksoispiippaus tarkoittaa, että katse on siinä: pysy paikallasi, kunnes näky tulee. {0} kytkee katseen opasäänen pois ja päälle.
help.swipe=Puhelin avautuu usean nopean pyyhkäisyn jälkeen peräkkäin: toista {0} yhä uudelleen, nopeasti. Jokainen pyyhkäisy siirtää liukusäädintä hieman eteenpäin, ja hetki viimeisen jälkeen se liukuu takaisin. Piippaukset nousevat, kun se täyttyy, ja laskevat, kun se liukuu takaisin.
