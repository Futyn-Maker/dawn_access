help.shoot=Tähtää hiirellä tai liikenäppäimillä. Piippaukset kuuluvat siinä korvassa, jonka puolella kohde on, korkeampina kun se on tähtäimen yläpuolella ja matalampina kun alapuolella, ja tihenevät tähtäimen lähestyessä sitä; nopea kaksoispiippaus tarkoittaa, että peli hyväksyisi laukauksen kohteeseen nyt. {0} ampuu. {1} ja {2} vaihtavat kohdetta, {3} kertoo, missä kohde on, {4} kytkee tähtäysäänen pois ja päälle.
help.shoot.pad=Tähtää oikealla sauvalla. Piippaukset kuuluvat siinä korvassa, jonka puolella kohde on, korkeampina kun se on tähtäimen yläpuolella ja matalampina kun alapuolella, ja tihenevät tähtäimen lähestyessä sitä; nopea kaksoispiippaus tarkoittaa, että peli hyväksyisi laukauksen kohteeseen nyt. {0} ampuu. {1} ja {2} vaihtavat kohdetta, {3} kertoo, missä kohde on, {4} kytkee tähtäysäänen pois ja päälle. DualSense-ohjaimella, jossa mukautuvat liipaisimet ovat päällä, laukaus lasketaan vasta, kun liipaisin painetaan vastuskohdan ohi.
help.shoot.snap={0} kohdistaa tähtäimen kohteeseen ja pitää sen siinä, myös liikkuvassa kohteessa, kunnes tähtäät itse; se ei ammu: {1} ampuu.
shoot.snap.release=Päästä ensin irti: {0}.
