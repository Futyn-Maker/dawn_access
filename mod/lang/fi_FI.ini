help.nudge=Piippaukset ohjaavat katseen rajaukseen, jota kohtaus odottaa: sen puolelta, korkeammalta tai matalammalta. Käännä katsetta hiirellä tai nuolinäppäimillä; kaksoispiippaus tarkoittaa, että katse on rajauksessa. {0} kertoo, missä rajaus on, {1} kytkee katseen opasäänen pois ja päälle.
help.nudge.pad=Piippaukset ohjaavat katseen rajaukseen, jota kohtaus odottaa: sen puolelta, korkeammalta tai matalammalta. Käännä katsetta oikealla sauvalla; kaksoispiippaus tarkoittaa, että katse on rajauksessa. {0} kertoo, missä rajaus on, {1} kytkee katseen opasäänen pois ja päälle.
help.turn=Piippaukset ohjaavat käsissä olevan esineen kääntämisen kohtaan, jossa se paljastuu: oikealta tai vasemmalta, tai ylös tai alas käännettäessä korkeampina tai matalampina, ja sitä tiheämmin, mitä lähempänä se on. Kaksoispiippaus tarkoittaa, että esine on paljastunut. {0} kertoo, mihin suuntaan kääntää ja paljonko on jäljellä, {1} kytkee katseen opasäänen pois ja päälle.
help.boiler=Kun painemittarin lamppu syttyy, kuuluu kaksoispiippaus: paina heti {0}, kun se palaa, noin kahden sekunnin ajan; painallus lampun ollessa sammuksissa epäonnistuu, ja kaikki alkaa alusta. Päästä {0} irti kääntämisen jälkeen: tarttumisesta yhä pohjassa oleva painike lasketaan heti, ennen kuin lamppu syttyy.
help.shake=Lumisadepalloa voi ravistaa: paina W tai S. Peli ei näytä siitä kehotetta.
help.shake.pad=Lumisadepalloa voi ravistaa: työnnä vasenta tikkua ylös tai alas. Peli ei näytä siitä kehotetta.
help.shake.ps=Lumisadepalloa voi ravistaa: ravista itse ohjainta; peli tunnistaa sen liiketunnistimella. Peli ei näytä siitä kehotetta.
help.shake.ps.off=Lumisadepalloa voi ravistaa, mutta ei tällä ohjaimella, kun asetus ”{0}” on pois päältä pelin ohjausasetuksissa: paina näppäimistön W- tai S-näppäintä tai kytke asetus päälle. Peli ei näytä siitä kehotetta.
help.gesture=Puoliympyrä vasemmalla sauvalla: myötäpäivään sauva työnnetään ensin täysin ylös, sitten oikealle, sitten alas; vastapäivään ylös, sitten vasemmalle, sitten alas; kukin vaihe puolen sekunnin sisällä edellisestä. Näppäimistöllä vihjeen näppäin tekee sen heti.
help.gesture.held=Tässä puoliympyrä tehdään {0} pohjassa: jos päästät irti, pitelemäsi esine putoaa.
help.steprun=Pidä {0}: niin kauan kuin sitä pidetään, askel seuraa toista, ja jokainen soi korkeampana sävelenä.
help.swipe.held=Tässä liike tehdään {0} pohjassa: paina ensin {0} ja pidä se pohjassa, tee sitten liike kerran; se lasketaan sillä hetkellä, kun teet sen, eikä sen pitäminen tee enempää.
