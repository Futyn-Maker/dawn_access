dontmove.steer=Vastaa jokaiseen signaaliin yhdellä lyhyellä painalluksella käyttäen {0}; kaksoispiippaus kertoo, että merkki on palannut.
dontmove.passive=Pidä ohjain paikallaan.
dontmove.clock.half=Aika käy vähiin.
dontmove.clock.most=Aika on melkein lopussa.
dontmove.active.start=Pysy rauhallisena!
help.dontmove.dynamic=Pelin asetus ”{0}” on {1}: versio määräytyy laitteesta, jota käytit viimeksi ennen alkua; PlayStation-ohjain antaa passiivisen, näppäimistö tai muu ohjain aktiivisen. Aktiivisessa versiossa mikä tahansa PlayStation-ohjaimen käyttö saa pelin jättämään sauvan ja näppäimet huomiotta. Valitse siellä {2} tai {3}, niin versio pysyy samana.
help.dontmove.active=Laske sävelet. Kaksoispiippaus puolen sekunnin välein tarkoittaa, että merkki on sisällä eikä mitään pyydetä. Kaksi samaa säveltä yhdessä korvassa tarkoittaa: paina lyhyesti {0} sille puolelle, nyt. Kolme nousevaa säveltä tarkoittaa ylös, kolme laskevaa alas. Matala tömähdys ennen signaalia tarkoittaa, että merkki on jo reunan yli; signaali osoittaa silloin tien takaisin keskelle. Vastaa yhdellä lyhyellä painalluksella, kuin napsautuksella, heti kun kuulet signaalin, ja kuuntele: kaksoispiippaus tarkoittaa, että merkki on palannut; sama tömähdys ja signaali uudelleen, että painat vielä kerran; signaali vastakkaiselta puolelta, että menit yli, yksi painallus takaisin. Pidetty painallus ylittää koko alueen sekunnin kymmenesosassa. Peli vetää merkkiä nykäyksittäin, yhteen suuntaan kerrallaan, muutaman sekunnin välein; noin kolmessa neljäsosasekunnissa vastattu nykäys ei maksa mitään, sen jälkeen jokainen hetki reunan takana kuluttaa varantoa, joka ei koskaan täyty, ja kellon merkki kuuluu, kun puolet ja kolme neljäsosaa on mennyt. Pelin omat Älä liiku -asetukset näppäinten ja sauvan herkkyydelle tekevät painalluksista pehmeämpiä.
help.dontmove.passive=Pidä ohjain täysin paikallaan. Tässä versiossa peli seuraa vain, liikkuuko ohjain, ei sitä, missä merkki on: matala tömähdys viisi kertaa sekunnissa tarkoittaa, että peli näkee ohjaimen liikkuvan, ja lyhyen alun armonajan jälkeen jokainen liikkeen hetki kuluttaa varantoa, joka ei koskaan täyty uudelleen; kaksoispiippaus puolen sekunnin välein tarkoittaa, että ohjain on paikallaan. Kellomerkki kuuluu, kun puolet ja kolme neljäsosaa varannosta on käytetty.
