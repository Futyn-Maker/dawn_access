help.walk={0} vie hahmon kohteeseen; uusi painallus pysäyttää.
help.looksound=Kun kohde odottaa katsetta, {0} kytkee katseen opasäänen opasäänen sijaan.
help.beam=Palkilla tatti liikuttaa hahmoa vain sinne, minne se katsoo; taaksepäin työntäminen kääntää sen ympäri. Opasääni ohjaa tattia palkkia pitkin, ja {0} kävelee sitä pitkin.
help.lookturn.pad=Käännä hahmo kohdetta kohti paikallaan: työnnä liikesauvaa ({0}) kevyesti äänen suuntaan, alle puoliväliin, ja päästä irti sekunnin sisällä; pidemmälle työnnettynä ja pidettynä hahmo lähtee kävelemään. Kun kameran on katsottava kohdetta, käännä se äänen suuntaan ({1}).
help.lookturn=Käännä hahmo kohdetta kohti paikallaan painamalla lyhyesti liikenäppäintä äänen suuntaan; pidettynä hahmo lähtee kävelemään.
help.where={0} sanoo kohteen uudelleen reitin pituuden ja suunnan kanssa.
