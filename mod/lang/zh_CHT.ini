help.explore=用 {0} 和 {1} 選擇要前往的目標，用 {2} 開啟或關閉導航音。導航音從目標所在的一側發出，越靠近音調越高；目標在身後時降低一個八度。用移動鍵朝聲音走去。
help.explore.pad=在手把上行走時無需組合鍵：{0} 下一個目標，{1} 上一個，{2} 目標位置，{3} 信標，{4} 走過去。
