help.dilemma.pad=用右搖桿轉動準星：左邊是{0}，右邊是{1}。準星的聲音從它所指的一側傳來；雙響表示已選中那一側。然後按{2}射擊。什麼都不做，時間就會耗盡，這也是一種選擇。
help.dilemma=用滑鼠或移動鍵轉動準星：左邊是{0}，右邊是{1}。準星的聲音從它所指的一側傳來；雙響表示已選中那一側。然後按{2}射擊。什麼都不做，時間就會耗盡，這也是一種選擇。
shoot.unnamed=目標
shoot.sound.on=瞄準提示音已開啟。
shoot.sound.off=瞄準提示音已關閉。
help.shoot=請用滑鼠或移動鍵瞄準。提示音在目標所在一側的耳朵中響起，目標高於準星時音調較高，低於準星時較低，準星越接近目標，提示音越快；快速的雙響表示此時開槍，遊戲會判定擊中目標。{0}：射擊。{1} 和 {2}：切換目標。{3}：目標位置。{4}：關閉和開啟瞄準提示音。
help.shoot.pad=請用右類比搖桿瞄準。提示音在目標所在一側的耳朵中響起，目標高於準星時音調較高，低於準星時較低，準星越接近目標，提示音越快；快速的雙響表示此時開槍，遊戲會判定擊中目標。{0}：射擊。{1} 和 {2}：切換目標。{3}：目標位置。{4}：關閉和開啟瞄準提示音。在開啟自適應扳機的DualSense上，只有把扳機扣過阻力點，射擊才會生效。
help.shoot.snap={0}會把準星對準目標並一直保持，移動的目標也一樣，直到你自己瞄準為止；它不會開槍，開槍用{1}。
shoot.snap.release=請先放開{0}。
nudge.on=已在畫面中。
nudge.where=畫面：{0}。
turn.right=向右轉，還剩{0}%。
turn.left=向左轉，還剩{0}%。
turn.up=向上轉，還剩{0}%。
turn.down=向下轉，還剩{0}%。
help.nudge=提示音引導視線到場景等待的畫面：從畫面所在的一側響起，音調高低表示上下。請用滑鼠或方向鍵轉動視線；雙響表示視線已落在畫面上。{0}：畫面位置。{1}：關閉和開啟視線導航音。
help.nudge.pad=提示音引導視線到場景等待的畫面：從畫面所在的一側響起，音調高低表示上下。請用右類比搖桿轉動視線；雙響表示視線已落在畫面上。{0}：畫面位置。{1}：關閉和開啟視線導航音。
help.turn=提示音引導你轉動手中的物品，直到它顯露出來的位置：在右側或左側響起，向上或向下轉時用音調高低表示，越接近越快。雙響表示已經顯露。{0}：轉動方向和剩餘多少。{1}：關閉和開啟視線導航音。
help.boiler=壓力燈亮起時會響起雙響：趁燈亮著（約兩秒）立即按下{0}；燈滅時按下會失敗，並且一切重新開始。轉動之後請放開{0}：從抓握時一直按住的按鈕會在燈亮之前立即被判定。
help.shake=可以搖晃雪花球：按 W 或 S。遊戲不會為此顯示提示。
help.shake.pad=可以搖晃雪花球：將左搖桿向上或向下推。遊戲不會為此顯示提示。
help.shake.ps=可以搖晃雪花球：搖晃控制器本身；遊戲會透過動作感應器感知到。遊戲不會為此顯示提示。
help.shake.ps.off=可以搖晃雪花球，但在遊戲的控制設定中關閉「{0}」時，無法用這個控制器搖晃：請按鍵盤上的 W 或 S，或開啟該設定。遊戲不會為此顯示提示。
help.gesture=用左搖桿畫半圓：順時針時把搖桿推到底向上，然後向右，然後向下；逆時針時向上，然後向左，然後向下；每一步都要在上一步之後半秒內完成。使用鍵盤時，按提示中的鍵即可立即完成。
help.gesture.held=這裡要按住{0}畫半圓：鬆開它，手裡的東西就會掉落。
help.swipe.held=這裡要按住{0}做動作：先按住{0}不放，然後做一次動作；動作做出的那一刻就會生效，保持不動不會再有作用。
interact.nomatches=沒有火柴。
interact.lamp=指示燈亮了。
interact.now=現在。
interact.linear.forward=前進方向：{0}。
interact.linear.back=返回方向：{0}。
interact.dial.position=位置 {0}。
help.walk={0} 讓角色走向目標，再按一次停止。
help.looksound=目標等待注視時，{0}開關視線導航音，而不是導航音。
help.beam=在橫樑上，搖桿只能讓角色朝面對的方向移動；向後推會讓角色轉身。導航音引導搖桿沿橫樑方向，{0} 沿橫樑行走。
help.lookturn.pad=要讓角色原地轉向目標，請將{0}朝聲音方向輕推不到一半，並在一秒內放開；推得更深並按住會讓角色走動。需要鏡頭看向目標時，請用{1}把鏡頭轉向聲音方向。
help.lookturn=要讓角色原地轉向目標，請朝聲音方向短按一下移動鍵；按住不放會讓角色走動。
help.where={0} 再次報出目標，附帶沿路線的距離和方向。
explore.place=地點
explore.face=轉向它。
explore.look=看向它。
explore.noglint=遊戲在這裡沒有顯示閃光。
totem.vision=幻象。
totem.found=已經找到過。
help.totem=提示音跟隨圖騰上的預兆：它在視野中心的哪一側，就在哪一側響起，偏高或偏低。把左搖桿推向它。雙響表示視線正落在它上面：保持不動，直到幻象出現。{0}：關閉和開啟視線導航音。
help.swipe=連續快速滑動幾次後手機才會解鎖：快速地反覆執行{0}。每次滑動都會讓滑塊前進一點，最後一次滑動後片刻，它就會退回去。提示音隨著滑塊填滿而升高，隨著它退回而降低。
hud.objective=目標：{0}
