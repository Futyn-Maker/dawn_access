help.dontmove.active=數音的個數。每半秒一次雙響表示標記在區域內，無需操作。一隻耳朵裡的兩個相同音表示：立即朝那一側短按{0}。上行的三個音表示向上，下行的三個音表示向下。信號前的低沉一擊表示標記已經越過邊緣，此時信號指向回到中心的方向。一聽到信號就像點擊一樣短按一次，然後聽：雙響表示標記已經回來；同樣的一擊和信號再次響起表示再短按一次；來自相反一側的信號表示推過頭了，朝回短按一次。按住不放會在十分之一秒內穿過整個區域。遊戲每隔幾秒把標記朝一個方向猛拉一次；在大約四分之三秒內應對的猛拉不會有任何損失，之後標記在邊緣之外的每一刻都會消耗一個不會回滿的儲備，用掉一半和四分之三時會響起時鐘信號。遊戲自帶的「別動」按鍵靈敏度和搖桿靈敏度設定可以讓按壓更柔和。
help.dontmove.passive=保持手把不動。在這個版本裡，遊戲只看手把是否在動，而不看標記在哪裡：每秒五次的低沉撞擊聲表示遊戲看到手把在動，開頭的短暫寬限過後，每一刻的移動都會消耗一份永不恢復的餘量；每半秒一次的雙響提示表示手把是靜止的。餘量用掉一半和四分之三時會響起計時提示音。
