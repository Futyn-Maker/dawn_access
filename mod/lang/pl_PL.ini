help.qte=Naciśnij podany klawisz, zanim skończy się czas. Dźwięk pojawia się razem z nim i szybciej da się za nim podążyć, gdy czasu jest mało: trzy rosnące dźwięki oznaczają górę, W, trzy opadające dół, S, dwa dźwięki w lewym uchu lewo, A, w prawym uchu prawo, D, chyba że zmieniłeś ich przypisanie.
help.qte.pad=Naciśnij podany przycisk lub wychyl gałkę w podanym kierunku, zanim skończy się czas. Dźwięk pojawia się razem ze słowami i szybciej da się za nim podążyć, gdy czasu jest mało: trzy rosnące dźwięki oznaczają górę, trzy opadające dół, dwa dźwięki w lewym uchu lewo, w prawym uchu prawo; kierunek przycisku to jego miejsce wśród czterech: góra to trójkąt lub Y, dół krzyżyk lub A, lewo kwadrat lub X, prawo kółko lub B.
dontmove.steer=Na każdy sygnał odpowiadaj jednym krótkim naciśnięciem, używając {0}; podwójny sygnał mówi, że znacznik wrócił.
dontmove.passive=Trzymaj kontroler nieruchomo.
dontmove.clock.half=Czas ucieka.
dontmove.clock.most=Czas prawie minął.
dontmove.active.start=Spokojnie!
help.dontmove.dynamic=Ustawienie gry „{0}” ma wartość {1}: wersja zależy od urządzenia użytego jako ostatnie przed początkiem; pad PlayStation daje bierną, klawiatura lub inny pad aktywną. W wersji aktywnej każde użycie pada PlayStation sprawia, że gra ignoruje gałkę i klawisze. Wybierz tam {2} lub {3}, aby wersja się nie zmieniała.
help.dontmove.active=Licz dźwięki. Podwójny sygnał co pół sekundy znaczy, że znacznik jest w środku i nic nie trzeba robić. Dwa równe dźwięki w jednym uchu znaczą: naciśnij krótko {0} w tę stronę, teraz. Trzy dźwięki wznoszące znaczą w górę, trzy opadające w dół. Głuche uderzenie przed sygnałem znaczy, że znacznik już wyszedł poza krawędź; sygnał wskazuje wtedy drogę z powrotem do środka. Odpowiadaj jednym krótkim naciśnięciem, jak kliknięciem, gdy tylko usłyszysz sygnał, i słuchaj: podwójny sygnał znaczy, że znacznik wrócił; to samo uderzenie z sygnałem znów znaczy jeszcze jedno naciśnięcie; sygnał z przeciwnej strony znaczy, że przestrzeliłeś, jedno naciśnięcie z powrotem. Przytrzymanie przenosi znacznik przez całą strefę w jedną dziesiątą sekundy. Gra szarpie znacznikiem zrywami, po jednym kierunku naraz, co kilka sekund; zryw, na który odpowiesz w około trzy czwarte sekundy, nic nie kosztuje, potem każda chwila poza krawędzią zużywa zapas, który nigdy się nie odnawia, a sygnał zegara brzmi, gdy ubyła połowa i trzy czwarte. Własne ustawienia gry czułości klawiszy i gałki dla Nie ruszaj się łagodzą naciśnięcia.
help.dontmove.passive=Trzymaj kontroler nieruchomo. W tej wersji gra sprawdza tylko, czy kontroler się porusza, a nie gdzie jest znacznik: niski stuk pięć razy na sekundę oznacza, że gra widzi ruch kontrolera, a po krótkiej chwili ulgi na początku każda chwila ruchu uszczupla zapas, który nigdy się nie odnawia; podwójny sygnał co pół sekundy oznacza, że kontroler jest nieruchomy. Sygnał zegara rozlega się, gdy zużyta jest połowa i trzy czwarte zapasu.
