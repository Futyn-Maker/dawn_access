help.explore={0} i {1} wybierają, dokąd iść, {2} włącza lub wyłącza sygnał. Sygnał brzmi po stronie celu i rośnie w miarę zbliżania się; opada o oktawę, gdy cel jest za tobą. Idź w stronę dźwięku klawiszami ruchu.
help.explore.pad=Na padzie podczas chodzenia nie trzeba kombinacji: {0} następny cel, {1} poprzedni, {2} gdzie jest, {3} sygnał, {4} podejść.
