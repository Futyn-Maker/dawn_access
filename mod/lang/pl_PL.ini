help.dilemma.pad=Obróć celownik prawą gałką: w lewo — {0}, w prawo — {1}. Dźwięk celownika dochodzi z tej strony, w którą jest zwrócony; podwójny sygnał oznacza, że strona została wybrana. Potem {2} strzela. Jeśli nic nie zrobisz, czas minie, i to też jest wybór.
help.dilemma=Obróć celownik myszą lub klawiszami ruchu: w lewo — {0}, w prawo — {1}. Dźwięk celownika dochodzi z tej strony, w którą jest zwrócony; podwójny sygnał oznacza, że strona została wybrana. Potem {2} strzela. Jeśli nic nie zrobisz, czas minie, i to też jest wybór.
shoot.unnamed=Cel
shoot.sound.on=Dźwięk celowania włączony.
shoot.sound.off=Dźwięk celowania wyłączony.
help.shoot=Celuj myszą lub klawiszami ruchu. Sygnały brzmią w uchu po stronie celu, wyżej, gdy cel jest nad celownikiem, i niżej, gdy jest pod nim, i przyspieszają, gdy celownik się do niego zbliża; szybki podwójny sygnał oznacza, że gra zaliczyłaby teraz strzał w cel. {0} strzela. {1} i {2} przełączają cele, {3} mówi, gdzie jest cel, {4} wyłącza i włącza dźwięk celowania.
help.shoot.pad=Celuj prawą gałką. Sygnały brzmią w uchu po stronie celu, wyżej, gdy cel jest nad celownikiem, i niżej, gdy jest pod nim, i przyspieszają, gdy celownik się do niego zbliża; szybki podwójny sygnał oznacza, że gra zaliczyłaby teraz strzał w cel. {0} strzela. {1} i {2} przełączają cele, {3} mówi, gdzie jest cel, {4} wyłącza i włącza dźwięk celowania. Na DualSense z włączonymi adaptacyjnymi spustami strzał liczy się dopiero wtedy, gdy spust zostanie wciśnięty poza punkt oporu.
help.shoot.snap={0} nakierowuje celownik na cel i trzyma go na nim, także na ruchomym, dopóki nie zaczniesz celować sam; nie strzela: strzela {1}.
shoot.snap.release=Najpierw puść {0}.
