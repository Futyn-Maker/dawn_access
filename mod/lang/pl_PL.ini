turn.down=Obracaj w dół, zostało {0}%.
help.nudge=Sygnały prowadzą wzrok do kadru, na który czeka scena: brzmią z jego strony, wyżej lub niżej. Obracaj wzrok myszą lub strzałkami; podwójny sygnał oznacza, że wzrok jest na kadrze. {0} mówi, gdzie jest kadr, {1} wyłącza i włącza sygnał spojrzenia.
help.nudge.pad=Sygnały prowadzą wzrok do kadru, na który czeka scena: brzmią z jego strony, wyżej lub niżej. Obracaj wzrok prawą gałką; podwójny sygnał oznacza, że wzrok jest na kadrze. {0} mówi, gdzie jest kadr, {1} wyłącza i włącza sygnał spojrzenia.
help.turn=Sygnały prowadzą obrót przedmiotu w dłoniach do miejsca, w którym się odsłania: z prawej lub z lewej, a przy obrocie w górę lub w dół wyżej lub niżej, i tym częściej, im bliżej. Podwójny sygnał oznacza, że przedmiot się odsłonił. {0} mówi, w którą stronę obracać i ile zostało, {1} wyłącza i włącza sygnał spojrzenia.
help.boiler=Gdy zapala się lampka ciśnienia, rozlega się podwójny sygnał: od razu naciśnij {0}, póki się świeci, przez około dwie sekundy; naciśnięcie przy zgaszonej lampce kończy się porażką i wszystko zaczyna się od nowa. Po obrocie puść {0}: przycisk wciąż trzymany od chwytu liczy się od razu, zanim lampka się zapali.
help.shake=Kulą śnieżną można potrząsnąć: naciśnij W lub S. Gra nie pokazuje do tego podpowiedzi.
help.shake.pad=Kulą śnieżną można potrząsnąć: wychyl lewą gałkę w górę lub w dół. Gra nie pokazuje do tego podpowiedzi.
help.shake.ps=Kulą śnieżną można potrząsnąć: potrząśnij samym kontrolerem; gra wyczuje to czujnikiem ruchu. Gra nie pokazuje do tego podpowiedzi.
help.shake.ps.off=Kulą śnieżną można potrząsnąć, ale nie tym kontrolerem, dopóki opcja „{0}” jest wyłączona w ustawieniach sterowania gry: naciśnij W lub S na klawiaturze albo włącz tę opcję. Gra nie pokazuje do tego podpowiedzi.
help.gesture=Półkole lewą gałką: zgodnie z ruchem wskazówek zegara pchnij ją do oporu w górę, potem w prawo, potem w dół; przeciwnie do ruchu wskazówek w górę, potem w lewo, potem w dół; każdy krok w ciągu pół sekundy od poprzedniego. Na klawiaturze klawisz z podpowiedzi robi to od razu.
help.gesture.held=Tutaj półkole wykonuje się z wciśniętym {0}: jeśli go puścisz, upuścisz to, co trzymasz.
help.steprun=Przytrzymaj {0}: dopóki jest wciśnięte, krok następuje po kroku, każdy o ton wyżej.
help.swipe.held=Tutaj ruch wykonuje się z wciśniętym {0}: najpierw wciśnij {0} i trzymaj, potem wykonaj ruch raz; liczy się w chwili wykonania, a przytrzymanie nic więcej nie daje.
interact.nomatches=Brak zapałek.
interact.lamp=Lampka się świeci.
interact.now=Teraz.
interact.linear.forward=Dalej: {0}.
interact.linear.back=Wstecz: {0}.
interact.dial.position=Pozycja {0}.
help.walk={0} prowadzi postać do celu; ponowne naciśnięcie zatrzymuje.
help.looksound=Gdy cel czeka na spojrzenie, {0} włącza i wyłącza sygnał spojrzenia zamiast zwykłego sygnału.
help.beam=Na belce drążek porusza postać tylko w stronę, w którą patrzy; pchnięcie do tyłu ją obraca. Sygnał prowadzi drążek wzdłuż belki, a {0} idzie po niej.
help.lookturn.pad=Aby obrócić postać w miejscu w stronę celu, lekko, mniej niż do połowy, pchnij gałkę ruchu ({0}) w stronę dźwięku i puść w ciągu sekundy; pchnięta mocniej i przytrzymana sprawia, że postać idzie. Gdy na cel musi patrzeć kamera, obróć ją w stronę dźwięku ({1}).
help.lookturn=Aby obrócić postać w miejscu w stronę celu, krótko naciśnij klawisz ruchu w stronę dźwięku; przytrzymany sprawia, że postać idzie.
help.where={0} powtarza cel z odległością wzdłuż trasy i kierunkiem.
explore.place=miejsce
explore.face=Odwróć się w jego stronę.
explore.look=Spójrz na niego.
explore.noglint=Gra nie pokazuje tu błysku.
totem.vision=Wizja.
totem.found=Już znaleziony.
help.totem=Sygnały podążają za przepowiednią na totemie: po tej stronie, po której leży względem środka widoku, wyżej lub niżej. Przechyl lewy drążek w jej stronę. Podwójny sygnał oznacza, że widok jest na niej: nie ruszaj się, aż pojawi się wizja. {0} wyłącza i włącza sygnał spojrzenia.
help.swipe=Telefon odblokowuje się po kilku szybkich przesunięciach z rzędu: powtarzaj {0} raz za razem, szybko. Każde przesunięcie trochę przesuwa suwak, a chwilę po ostatnim cofa się on z powrotem. Sygnały rosną, gdy się zapełnia, i opadają, gdy się cofa.
