dontmove.steer=Svar på hvert signal med ett kort trykk på {0}; det doble pipet sier at kapselen er tilbake.
dontmove.passive=Hold kontrolleren stille.
help.dontmove.active=Tell tonene. Det doble pipet hvert halve sekund betyr at kapselen er innenfor grensen og ingenting kreves. To like toner i ett øre betyr: trykk kort på {0} mot den siden, nå. Tre stigende toner betyr opp, tre fallende ned. Et dumpt dunk før signalet betyr at kapselen allerede er utenfor grensen; signalet peker da tilbake mot midten. Svar med ett kort trykk, som et klikk, så snart du hører signalet, og lytt så: det doble pipet betyr at kapselen er tilbake; det samme dunket med signal igjen betyr ett trykk til; et signal fra motsatt side betyr at du skjøt over, ett trykk tilbake. Et holdt trykk krysser hele sonen på et tidels sekund. Spillet rykker kapselen én retning om gangen, med noen sekunder imellom; et rykk besvart innen omtrent tre kvart sekund koster ingenting, etterpå tærer hvert øyeblikk utenfor grensen på et forråd som aldri fylles opp, og klokkesignalet høres når halvparten og tre fjerdedeler er borte. Spillets egne innstillinger for følsomheten til bevegelsesknappene og spaken i «Stå stille» gjør trykkene mykere.
help.dontmove.passive=Hold kontrolleren stille. Det doble pipet hvert halve sekund betyr at kapselen er i midten. Et pip høres der kapselen har drevet, på dens side og høyere når den er oppe, raskere jo lenger; et dumpt dunk før pipet betyr at den er utenfor grensen og klokken kan gå.
