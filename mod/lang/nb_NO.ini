help.shoot=Sikt med musen eller bevegelsestastene. Pipene høres i øret på den siden målet er, lysere når det er over siktet og dypere når det er under, og kommer raskere jo nærmere siktet kommer; et raskt dobbelt ping betyr at spillet ville godta et skudd mot målet nå. {0} skyter. {1} og {2} bytter mellom målene, {3} sier hvor målet er, {4} slår siktelyden av og på.
help.shoot.pad=Sikt med høyre spak. Pipene høres i øret på den siden målet er, lysere når det er over siktet og dypere når det er under, og kommer raskere jo nærmere siktet kommer; et raskt dobbelt ping betyr at spillet ville godta et skudd mot målet nå. {0} skyter. {1} og {2} bytter mellom målene, {3} sier hvor målet er, {4} slår siktelyden av og på. På en DualSense med adaptive avtrekkere slått på teller skuddet først når avtrekkeren trykkes forbi motstanden.
help.gesture=En halvsirkel med venstre spak: med klokka skyver du spaken helt opp, så til høyre, så ned; mot klokka opp, så til venstre, så ned; hvert trinn innen et halvt sekund etter det forrige. På tastaturet gjør tasten i ledeteksten det med en gang.
help.walk={0} går med figuren til målet; trykk igjen for å stoppe.
help.looksound=Mens målet venter på et blikk, slår {0} ledetonen for blikket på og av i stedet for ledetonen.
help.lookturn.pad=For å snu figuren mot målet på stedet, skyv bevegelsesspaken ({0}) lett mot lyden, mindre enn halvveis, og slipp innen ett sekund; skjøvet lenger og holdt, går figuren. Når kameraet skal se på målet, snu det mot lyden ({1}).
help.lookturn=For å snu figuren mot målet på stedet, trykk kort på en bevegelsesknapp mot lyden; holder du knappen nede, går figuren.
help.where={0} sier målet igjen med avstanden langs ruten og retningen.
