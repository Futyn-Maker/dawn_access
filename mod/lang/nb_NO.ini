turn.down=Drei nedover, {0} % igjen.
help.nudge=Pipene leder blikket til utsnittet scenen venter på: på dets side, høyere eller lavere. Snu blikket med musen eller piltastene; det doble pinget betyr at blikket hviler på det. {0} sier hvor utsnittet er, {1} slår ledetonen for blikket av og på.
help.nudge.pad=Pipene leder blikket til utsnittet scenen venter på: på dets side, høyere eller lavere. Snu blikket med høyre spak; det doble pinget betyr at blikket hviler på det. {0} sier hvor utsnittet er, {1} slår ledetonen for blikket av og på.
help.turn=Pipene leder dreiingen av tingen i hendene fram til stedet der den avsløres: til høyre eller venstre, eller høyere eller lavere for en dreiing opp eller ned, raskere jo nærmere den er. Det doble pinget betyr at den er avslørt. {0} sier hvilken vei du skal dreie og hvor mye som er igjen, {1} slår ledetonen for blikket av og på.
help.boiler=Når trykklampen tennes, høres det doble pinget: trykk {0} straks, mens den lyser, i omtrent to sekunder; et trykk mens den er slukket, mislykkes, og alt begynner på nytt. Slipp {0} etter vridningen: en knapp som fortsatt holdes fra grepet, teller med en gang, før lampen lyser.
help.shake=Snøkula kan ristes: trykk W eller S. Spillet viser ingen ledetekst for det.
help.shake.pad=Snøkula kan ristes: skyv venstre spak opp eller ned. Spillet viser ingen ledetekst for det.
help.shake.ps=Snøkula kan ristes: rist selve kontrolleren; spillet merker det med bevegelsessensoren. Spillet viser ingen ledetekst for det.
help.shake.ps.off=Snøkula kan ristes, men ikke med denne kontrolleren så lenge innstillingen «{0}» er slått av i spillets kontroller: trykk W eller S på tastaturet, eller slå innstillingen på. Spillet viser ingen ledetekst for det.
help.gesture=En halvsirkel med venstre spak: med klokka skyver du spaken helt opp, så til høyre, så ned; mot klokka opp, så til venstre, så ned; hvert trinn innen et halvt sekund etter det forrige. På tastaturet gjør tasten i ledeteksten det med en gang.
help.gesture.held=Her lages halvsirkelen med {0} holdt inne: slipper du den, mister du det du holder.
help.steprun=Hold {0}: så lenge det holdes, følger det ene steget det andre, og hvert steg lyder en tone høyere.
help.swipe.held=Her gjøres bevegelsen med {0} holdt inne: trykk først på {0} og hold den, og gjør så bevegelsen én gang; den teller i det øyeblikket den gjøres, og å holde den gjør ikke mer.
