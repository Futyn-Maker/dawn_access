help.qte=Trykk på tasten som blir sagt, før tiden går ut. Lyden kommer sammen med den og er raskere å følge når tiden er knapp: tre stigende toner ber om opp, W, tre fallende om ned, S, to toner i venstre øre om venstre, A, i høyre øre om høyre, D, med mindre du har bundet dem om.
help.qte.pad=Trykk på knappen som blir sagt, eller skyv spaken i retningen som blir sagt, før tiden går ut. Lyden kommer sammen med ordene og er raskere å følge når tiden er knapp: tre stigende toner betyr opp, tre fallende ned, to toner i venstre øre venstre, i høyre øre høyre; en knapps retning er plassen dens blant de fire: opp er trekant eller Y, ned kryss eller A, venstre firkant eller X, høyre sirkel eller B.
dontmove.steer=Svar på hvert signal med ett kort trykk på {0}; det doble pipet sier at kapselen er tilbake.
dontmove.passive=Hold kontrolleren stille.
dontmove.clock.half=Tiden renner ut.
dontmove.clock.most=Tiden er nesten ute.
dontmove.active.start=Hold deg rolig!
help.dontmove.dynamic=Spillets innstilling «{0}» står på {1}: utgaven følger enheten du brukte sist før den begynner; PlayStation-kontrolleren gir den passive, tastaturet eller en annen kontroller den aktive. I en aktiv runde får all bruk av PlayStation-kontrolleren spillet til å overse både spaken og tastene. Velg {2} eller {3} der for å beholde én utgave.
help.dontmove.active=Tell tonene. Det doble pipet hvert halve sekund betyr at kapselen er innenfor grensen og ingenting kreves. To like toner i ett øre betyr: trykk kort på {0} mot den siden, nå. Tre stigende toner betyr opp, tre fallende ned. Et dumpt dunk før signalet betyr at kapselen allerede er utenfor grensen; signalet peker da tilbake mot midten. Svar med ett kort trykk, som et klikk, så snart du hører signalet, og lytt så: det doble pipet betyr at kapselen er tilbake; det samme dunket med signal igjen betyr ett trykk til; et signal fra motsatt side betyr at du skjøt over, ett trykk tilbake. Et holdt trykk krysser hele sonen på et tidels sekund. Spillet rykker kapselen én retning om gangen, med noen sekunder imellom; et rykk besvart innen omtrent tre kvart sekund koster ingenting, etterpå tærer hvert øyeblikk utenfor grensen på et forråd som aldri fylles opp, og klokkesignalet høres når halvparten og tre fjerdedeler er borte. Spillets egne innstillinger for følsomheten til bevegelsesknappene og spaken i «Stå stille» gjør trykkene mykere.
help.dontmove.passive=Hold kontrolleren helt i ro. I denne versjonen ser spillet bare etter om kontrolleren beveger seg, ikke hvor markøren er: et dypt dunk fem ganger i sekundet betyr at spillet ser kontrolleren bevege seg, og etter en kort frist i starten tærer hvert øyeblikk av det på en pott som aldri fylles opp igjen; det doble pinget hvert halve sekund betyr at den er i ro. Klokkesignalet lyder når halvparten og tre fjerdedeler av potten er brukt.
