help.totem=Pipene følger visjonen på totemet: på den siden den ligger fra midten av synsfeltet, høyere eller lavere. Skyv venstre spak mot den. Det doble pinget betyr at blikket er på den: hold stille til visjonen kommer. {0} slår ledetonen for blikket av og på.
help.swipe=Telefonen låses opp etter flere raske sveip etter hverandre: gjenta {0} igjen og igjen, raskt. Hvert sveip flytter glidebryteren litt frem, og en liten stund etter det siste glir den tilbake. Pipene stiger mens den fylles, og synker når den glir tilbake.
