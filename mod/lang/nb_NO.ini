help.dilemma.pad=Drei siktet med høyre spak: til venstre er {0}, til høyre er {1}. Siktets lyd kommer fra siden det peker mot; et dobbelt pip betyr at den siden er valgt. Deretter skyter {2}. Gjør du ingenting, går tiden ut, og det er også et valg.
help.dilemma=Drei siktet med musen eller bevegelsestastene: til venstre er {0}, til høyre er {1}. Siktets lyd kommer fra siden det peker mot; et dobbelt pip betyr at den siden er valgt. Deretter skyter {2}. Gjør du ingenting, går tiden ut, og det er også et valg.
