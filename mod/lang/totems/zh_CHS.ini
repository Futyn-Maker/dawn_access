; Dawn Access totem visions — Chinese (Simplified). One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=夜晚，岩石间：穿着灰色针织毛衣的贝丝背部朝下重重砸在一块巨石上，鲜血从嘴里喷出；随后汉娜一动不动地躺在石头上，满脸是血，双眼睁着。
totem.totem_guidance_1=一只知更鸟落在白桦树间的雪地上。
totem.totem_tragedy_1=一个身影在火焰爆炸的映衬下被向后掀飞；随后，烟雾中躺着一张烧焦的脸，露出牙齿。
totem.totem_guidance_2=裹着浴巾的萨曼莎拿着手电筒跑过黑暗的走廊，来到标着ELEVATOR的电梯栅门前，随后下到电梯井里，蹲在里面向外张望。
totem.totem_danger_1=雾蒙蒙的森林里，鹿群步步逼近；领头那头长着角的雄鹿径直走到跟前，大声吼叫。
totem.totem_fortune_1=浑身擦伤、只穿着内衣的杰西卡在一个损毁的电梯厢地板上苏醒过来，撑起身子。
totem.totem_tragedy_2=杰西卡坠下一道木架支撑的竖井，重重摔在一块金属格栅上；她仰面躺着，头朝向我们，下巴已被撕掉。
totem.totem_tragedy_2_ja=只穿着内衣的杰西卡坠下一道木架支撑的竖井，重重摔在一块金属格栅上；她仰面躺着，头朝向我们，嘴巴张着，浑身擦伤淤青。
totem.totem_death_2=马修在黑暗中坠落；随后他一动不动地躺着，嘴边有血。
totem.totem_hunger_1=透过某人的眼睛，贴近地面，在一片冰冷的蓝色模糊中：一只苍白的手向前伸出，朝一堆石头爬去，石堆上有一个写着BETH的小木十字架。
totem.totem_guidance_3=在朦胧的蓝光中，一个浑身湿透的男人四肢着地，沿着岩架爬过一根木桩；在他身后，萨曼莎从水里撑起身子，爬上岩架。
totem.totem_guidance_4=特写：一只手轻抚一只安静的灰狼的头。
totem.totem_fortune_3=矿井中，俯视角度：额头上戴着灯的马修蹲在一支燃烧的红色信号棒旁，抬头向上看。
totem.totem_hunger_2=透过某人的眼睛，在一条木架支撑的矿井隧道里：视野猛烈摇晃，闪着红光和黄光，一只手抓挠着地面，视野随之沉落到地上。
totem.totem_death_4=在矿井隧道里，某人被向上吊起，双腿在半空中乱蹬；鲜血往下流淌。
totem.totem_danger_2=围着浴巾的萨曼莎站在一个黑暗大房间另一头亮着灯的门口，用手电筒四处照着；紧挨着镜头，有人的一条腿迈进了画面。
totem.totem_guidance_5=心神大乱的克里斯多夫把手枪抵在自己的下巴底下。
totem.totem_danger_4=在一座木平台下方，一只手向下伸去，够向一只向上伸来的戴手套的手；两只手错开了。
totem.totem_guidance_6=脖子上带着血的迈克用力推一个高高的绿色金属储物柜；柜子沿着墙滑动。
totem.totem_danger_3=在矿井里，杰西卡重重摔倒在马修身旁的地上；马修跪倒在她身边，俯身向她。
totem.totem_tragedy_5=火焰轰然爆开；随后有人趴在地上，头转向我们，身后火焰熊熊：浅色外套烧焦了，脸被烧得血肉模糊，牙齿龇露。
totem.totem_hunger_3=透过某人的眼睛，视野染成红色：经过一架梯子向上，朝一处明亮的开口而去，沿着矿井的铁轨前行，随后进入刺眼的光芒中。
totem.totem_tragedy_3=夜晚的雪林中燃着火：拿着喷火器的男人站着，画面里只有他肩膀以下的背影，鲜血淌落到他脚下的雪地上；随后他跪倒在地。克里斯多夫手里拿着枪，在远处看着。
totem.totem_death_5=龇着牙的艾米丽眼睛中弹：她的头猛地向后一仰，嘴巴大张，原本是眼睛的地方成了一个血洞，另一只眼睛向上翻起。
totem.totem_death_5_ja=视线越过一个悬挂的白色灯罩，俯视昏暗的碎石地面：一道强光闪过，画面一震，随后一切静止。
totem.totem_fortune_4=满脸痛苦的迈克举枪直指镜头，随后把枪移开，没有开枪，转向一旁。
totem.totem_danger_6=在狭窄的岩石通道里，惊恐的艾米丽举起一支燃烧的红色信号棒；信号棒噼啪几下熄灭了，她把熄灭的信号棒伸到身前。随后一片黑暗。
totem.totem_tragedy_4=一只雪怪在一个躺在地上的人上方直起身子，猛力砸下；一张被砸烂、鲜血淋漓的脸占满了整个画面。
totem.totem_tragedy_4_ja=黑暗中，一只雪怪细长、瘦骨嶙峋、长着利爪的四肢在一个躺在地上的人上方猛烈挥舞；碎屑四溅，随后一片黑暗，接着是一件印着大字母M的深色外套的静止特写。
totem.totem_death_3=迈克咧嘴笑着，打了一下打火机；火星迸溅。
totem.totem_hunger_4=透过某人的眼睛，在血红色的森林中：追逐一头发光的白色雄鹿，越追越近。
totem.totem_tragedy_6=一双长着利爪的长手紧紧扣住约书亚的头，他放声尖叫。
totem.totem_fortune_2=夜里，雪地中，手提一盏亮着的提灯的马修站在一扇钉着木板、从下方被照亮的木门旁，回头瞥了那扇门一眼，又把目光移开。
totem.totem_death_6=额头上戴着灯的萨曼莎尖叫着，一只长着利爪的长手掐住她的下巴；鲜血从她嘴里流出。
totem.totem_hunger_5=透过某人的眼睛，视野染成红色：视线朝地上一个发着白光的长发女人猛扑下去；她手脚并用地想要爬开，随后蜷缩在视线正下方，一只手臂护着头，另一只手臂伸了出去。
totem.totem_danger_5=一间昏暗的房间，摆着一排排皮质影院座椅：正前方，一只苍白的雪怪蹲在椅背上；门口那边的远处，另一只四肢着地在地上爬行，第三只从门框后探出头来。画面猛地一转，其中一只一跃穿过房间；随后陷入黑暗。
totem.totem_fortune_5=夜里山庄在燃烧；山庄前的雪地上，阿什莉弓着身子坐着。
totem.totem_fortune_6=山庄昏暗的客厅里，一只雪怪四肢着地，悄悄爬向近处背对镜头的萨曼莎，直到它的脸就在她的脸旁；她纹丝不动。更远处，有人一动不动地站在一盏灯旁。
totem.totem_hunger_6=透过某人的眼睛，视野染成红色：一只长着利爪的长手掐住约书亚的喉咙，把挣扎的他提了起来。
