; Dawn Access totem visions — Russian. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Ночь, камни: Бет в сером вязаном свитере с размаху падает спиной на валун, изо рта брызжет кровь; затем на камнях неподвижно лежит Ханна, лицо в крови, глаза открыты.
totem.totem_guidance_1=Малиновка садится на снег среди берёз.
totem.totem_tragedy_1=Фигуру отбрасывает на фоне огненного взрыва; затем в дыму — обугленное лицо с оскаленными зубами.
totem.totem_guidance_2=Сэм, завёрнутая в полотенце, с фонариком бежит по тёмному коридору к решётке лифта с табличкой ELEVATOR, затем спускается в шахту и, пригнувшись, выглядывает оттуда.
totem.totem_danger_1=В туманном лесу надвигается стадо оленей; рогатый вожак подходит вплотную и ревёт.
totem.totem_fortune_1=Джессика, исцарапанная, в нижнем белье, приходит в себя на полу разбитой клети лифта и приподнимается.
totem.totem_tragedy_2=Джессика падает в шахту с деревянной крепью и разбивается о металлическую решётку; она лежит на спине головой к нам, нижняя челюсть оторвана.
totem.totem_tragedy_2_ja=Джессика в нижнем белье падает в шахту с деревянной крепью и разбивается о металлическую решётку; она лежит на спине головой к нам, рот открыт, вся в царапинах и синяках.
totem.totem_death_2=Мэтт падает в темноту; затем лежит неподвижно, у рта кровь.
totem.totem_hunger_1=Чьими-то глазами, у самой земли, в холодной синей дымке: бледная рука тянется вперёд, ползком к груде камней с маленьким деревянным крестом с надписью BETH.
totem.totem_guidance_3=В туманном синем свете промокший мужчина ползёт на четвереньках по каменному уступу мимо деревянного столба; позади него Сэм выбирается из воды на уступ.
totem.totem_guidance_4=Крупно: чья-то рука гладит голову спокойного серого волка.
totem.totem_fortune_3=Шахта, вид сверху: Мэтт с фонарём на лбу сидит на корточках у горящего красного фальшфейера и смотрит вверх.
totem.totem_hunger_2=Чьими-то глазами в шахтном туннеле с деревянной крепью: взгляд шатается, вспыхивает красным и жёлтым, рука скребёт по полу, и взгляд опускается к земле.
totem.totem_death_4=В шахтном туннеле чьи-то ноги дёргаются в воздухе — человека вздёргивают вверх; вниз течёт кровь.
totem.totem_danger_2=Сэм в полотенце стоит в освещённом дверном проёме в другом конце большой тёмной комнаты и светит фонариком по сторонам; совсем близко в кадр шагает чья-то нога.
totem.totem_guidance_5=Крис в отчаянии приставляет пистолет себе под челюсть.
totem.totem_danger_4=Под деревянным настилом рука тянется вниз к руке в перчатке, тянущейся вверх; они не успевают схватиться.
totem.totem_guidance_6=Майк с кровью на шее толкает высокий зелёный металлический шкафчик; тот скользит вдоль стены.
totem.totem_danger_3=В шахте Джессика тяжело падает на землю рядом с Мэттом; он опускается на колени и склоняется над ней.
totem.totem_tragedy_5=Вспышка пламени; затем кто-то лежит на полу на животе, повернув голову к нам, позади пламя: светлая куртка опалена, лицо обожжено до мяса, зубы оскалены.
totem.totem_hunger_3=Чьими-то глазами, в красном свете: вверх мимо лестницы к светлому проёму, вдоль рельсов шахты, а затем в ослепительный свет.
totem.totem_tragedy_3=Ночь, заснеженный лес, горит огонь: человек с огнемётом, видный со спины и только до плеч, стоит, а под ним на снег льётся кровь; затем он падает на колени. Издали смотрит Крис с оружием в руках.
totem.totem_death_5=Эмили с оскаленными зубами получает пулю в глаз: голова запрокидывается, рот широко открыт, на месте глаза кровавая дыра, другой глаз закатился.
totem.totem_death_5_ja=Взгляд сверху мимо висящего белого абажура на тёмный гравийный пол: яркая вспышка, кадр вздрагивает, затем всё неподвижно.
totem.totem_fortune_4=Майк с мукой на лице целится из пистолета прямо в зрителя, затем отводит его в сторону и отворачивается, не выстрелив.
totem.totem_danger_6=В узком каменном проходе перепуганная Эмили держит горящий красный фальшфейер; он гаснет, и она выставляет перед собой потухшую шашку. Затем темнота.
totem.totem_tragedy_4=Вендиго нависает над кем-то лежащим на земле и обрушивает удар; весь кадр занимает раздавленное окровавленное лицо.
totem.totem_tragedy_4_ja=В темноте длинные костлявые когтистые конечности вендиго мелькают над кем-то, лежащим на земле; летят обломки, затем темнота и неподвижный крупный план тёмной куртки с большой буквой M.
totem.totem_death_3=Майк, ухмыляясь, щёлкает зажигалкой; разлетаются искры.
totem.totem_hunger_4=Чьими-то глазами, в кроваво-красном лесу: погоня за светящимся белым оленем, всё ближе и ближе.
totem.totem_tragedy_6=Длинные когтистые руки сжимают голову Джоша; он кричит.
totem.totem_fortune_2=Ночь, снег: Мэтт с зажжённым фонарём в руке стоит у заколоченной деревянной двери, подсвеченной снизу, оглядывается на неё и отворачивается.
totem.totem_death_6=Сэм с фонарём на лбу кричит: длинная когтистая рука сжимает ей челюсть, изо рта течёт кровь.
totem.totem_hunger_5=Чьими-то глазами, в красном свете: взгляд стремительно снижается к светящейся белым длинноволосой девушке на земле; она пытается уползти на четвереньках, затем сжимается прямо под взглядом, закрыв голову одной рукой и выбросив вперёд другую.
totem.totem_danger_5=Тёмная комната с рядами кожаных кинокресел: прямо впереди на спинке кресла пригнулся бледный вендиго; за дверным проёмом по полу на четвереньках ползёт другой, а из-за косяка выглядывает третий. Кадр резко поворачивается, один из них прыгает через комнату; затем темнота.
totem.totem_fortune_5=Ночью горит дом; перед ним, сгорбившись, сидит на снегу Эшли.
totem.totem_fortune_6=В полутёмной гостиной дома вендиго на четвереньках подкрадывается к Сэм, которую видно вблизи со спины, пока его морда не оказывается рядом с её лицом; она не шевелится. Дальше у лампы неподвижно стоит человек.
totem.totem_hunger_6=Чьими-то глазами, в красном свете: длинная когтистая рука хватает Джоша за горло и поднимает, он вырывается.
