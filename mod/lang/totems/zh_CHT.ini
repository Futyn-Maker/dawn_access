; Dawn Access totem visions — Chinese (Traditional). One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=夜晚，岩石間：穿著灰色針織毛衣的貝絲背部朝下重重砸在一塊巨石上，鮮血從嘴裡噴出；接著漢娜一動也不動地躺在石頭上，滿臉是血，雙眼睜著。
totem.totem_guidance_1=一隻知更鳥落在白樺樹間的雪地上。
totem.totem_tragedy_1=一個身影在火焰爆炸的映襯下被向後掀飛；接著，煙霧中躺著一張燒焦的臉，露出牙齒。
totem.totem_guidance_2=裹著浴巾的薩曼莎拿著手電筒跑過黑暗的走廊，來到標著ELEVATOR的電梯柵門前，接著下到電梯井裡，蹲在裡面往外張望。
totem.totem_danger_1=霧濛濛的森林裡，鹿群步步逼近；領頭那頭長著角的雄鹿徑直走到跟前，大聲吼叫。
totem.totem_fortune_1=渾身擦傷、只穿著內衣的潔西卡在一個毀損的電梯廂地板上醒來，撐起身子。
totem.totem_tragedy_2=潔西卡墜下一道木架支撐的豎井，重重摔在一塊金屬格柵上；她仰面躺著，頭朝向我們，下巴已被扯掉。
totem.totem_tragedy_2_ja=只穿著內衣的潔西卡墜下一道木架支撐的豎井，重重摔在一塊金屬格柵上；她仰面躺著，頭朝向我們，嘴巴張著，渾身擦傷瘀青。
totem.totem_death_2=馬修在黑暗中墜落；接著他一動也不動地躺著，嘴邊有血。
totem.totem_hunger_1=透過某人的雙眼，貼近地面，在一片冰冷的藍色模糊中：一隻蒼白的手向前伸出，朝一堆石頭爬去，石堆上有一個寫著BETH的小木十字架。
totem.totem_guidance_3=在朦朧的藍光中，一個渾身濕透的男人四肢著地，沿著岩架爬過一根木樁；在他身後，薩曼莎從水裡撐起身子，爬上岩架。
totem.totem_guidance_4=特寫：一隻手輕撫一隻安靜的灰狼的頭。
totem.totem_fortune_3=礦坑中，俯視角度：額頭上戴著燈的馬修蹲在一支燃燒的紅色信號棒旁，抬頭往上看。
totem.totem_hunger_2=透過某人的雙眼，在一條木架支撐的礦坑隧道裡：視野猛烈搖晃，閃著紅光和黃光，一隻手抓撓著地面，視野隨之沉落到地上。
totem.totem_death_4=在礦坑隧道裡，某人被往上吊起，雙腿在半空中亂蹬；鮮血往下流淌。
totem.totem_danger_2=圍著浴巾的薩曼莎站在一個黑暗大房間另一頭亮著燈的門口，用手電筒四處照著；緊挨著鏡頭，有人的一條腿跨進了畫面。
totem.totem_guidance_5=心神大亂的克里斯多福把手槍抵在自己的下巴底下。
totem.totem_danger_4=在一座木平台下方，一隻手往下伸去，搆向一隻往上伸來的戴手套的手；兩隻手錯開了。
totem.totem_guidance_6=脖子上帶著血的麥可用力推一個高高的綠色金屬置物櫃；櫃子沿著牆滑動。
totem.totem_danger_3=在礦坑裡，潔西卡重重摔倒在馬修身旁的地上；馬修跪倒在她身邊，俯身向她。
totem.totem_tragedy_5=火焰轟然爆開；接著有人趴在地上，頭轉向我們，身後火焰熊熊：淺色外套燒焦了，臉被燒得血肉模糊，牙齒齜露。
totem.totem_hunger_3=透過某人的雙眼，視野染成紅色：經過一架梯子往上，朝一處明亮的開口而去，沿著礦坑的鐵軌前行，接著進入刺眼的光芒中。
totem.totem_tragedy_3=夜晚的雪林中燃著火：拿著噴火器的男人站著，畫面裡只有他肩膀以下的背影，鮮血淌落到他腳下的雪地上；接著他跪倒在地。克里斯多福手裡拿著槍，在遠處看著。
totem.totem_death_5=齜著牙的艾蜜莉眼睛中彈：她的頭猛地往後一仰，嘴巴大張，原本是眼睛的地方成了一個血洞，另一隻眼睛往上翻起。
totem.totem_death_5_ja=視線越過一個懸掛的白色燈罩，俯視昏暗的碎石地面：一道強光閃過，畫面一震，接著一切靜止。
totem.totem_fortune_4=滿臉痛苦的麥可舉槍直指鏡頭，接著把槍移開，沒有開槍，轉向一旁。
totem.totem_danger_6=在狹窄的岩石通道裡，驚恐的艾蜜莉舉起一支燃燒的紅色信號棒；信號棒劈啪幾下熄滅了，她把熄滅的信號棒伸到身前。接著一片黑暗。
totem.totem_tragedy_4=一隻溫迪戈在一個躺在地上的人上方直起身子，猛力砸下；一張被砸爛、鮮血淋漓的臉佔滿了整個畫面。
totem.totem_tragedy_4_ja=黑暗中，一隻溫迪戈細長、瘦骨嶙峋、長著利爪的四肢在一個躺在地上的人上方猛烈揮舞；碎屑四濺，接著一片黑暗，然後是一件印著大字母M的深色外套的靜止特寫。
totem.totem_death_3=麥可咧嘴笑著，按了一下打火機；火星迸濺。
totem.totem_hunger_4=透過某人的雙眼，在血紅色的森林中：追逐一頭發光的白色雄鹿，越追越近。
totem.totem_tragedy_6=一雙長著利爪的長手緊緊扣住約書亞的頭，他放聲尖叫。
totem.totem_fortune_2=夜裡，雪地中，手提一盞亮著的提燈的馬修站在一扇釘著木板、從下方被照亮的木門旁，回頭瞥了那扇門一眼，又把目光移開。
totem.totem_death_6=額頭上戴著燈的薩曼莎尖叫著，一隻長著利爪的長手掐住她的下巴；鮮血從她嘴裡流出。
totem.totem_hunger_5=透過某人的雙眼，視野染成紅色：視線朝地上一個發著白光的長髮女人猛撲下去；她手腳並用地想要爬開，接著蜷縮在視線正下方，一隻手臂護著頭，另一隻手臂伸了出去。
totem.totem_danger_5=一間昏暗的房間，擺著一排排皮質影院座椅：正前方，一隻蒼白的溫迪戈蹲在椅背上；門口那邊的遠處，另一隻四肢著地在地上爬行，第三隻從門框後探出頭來。畫面猛地一轉，其中一隻一躍穿過房間；隨後陷入黑暗。
totem.totem_fortune_5=夜裡山莊在燃燒；山莊前的雪地上，艾希莉弓著身子坐著。
totem.totem_fortune_6=山莊昏暗的客廳裡，一隻溫迪戈四肢著地，悄悄爬向近處背對鏡頭的薩曼莎，直到牠的臉就在她的臉旁；她紋絲不動。更遠處，有人一動也不動地站在一盞燈旁。
totem.totem_hunger_6=透過某人的雙眼，視野染成紅色：一隻長著利爪的長手掐住約書亞的喉嚨，把掙扎的他提了起來。
