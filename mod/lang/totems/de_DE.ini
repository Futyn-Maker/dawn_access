; Dawn Access totem visions — German. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Nacht, zwischen Felsen: Beth in einem grauen Strickpullover prallt mit dem Rücken auf einen Felsbrocken, Blut spritzt ihr aus dem Mund; dann liegt Hannah reglos auf den Steinen, das Gesicht blutverschmiert, die Augen offen.
totem.totem_guidance_1=Ein Rotkehlchen landet zwischen Birken im Schnee.
totem.totem_tragedy_1=Eine Gestalt wird vor einem Feuerball zurückgeschleudert; dann im Rauch ein verkohltes Gesicht, die Zähne gebleckt.
totem.totem_guidance_2=Sam, in ein Handtuch gewickelt, rennt mit einer Taschenlampe einen dunklen Gang entlang zu einem Aufzugsgitter mit der Aufschrift ELEVATOR, lässt sich dann in den Schacht hinab, kauert sich dort hin und späht hinaus.
totem.totem_danger_1=In einem nebligen Wald rückt ein Rudel Hirsche vor; der vorderste, ein Hirsch mit Geweih, kommt ganz nah heran und röhrt.
totem.totem_fortune_1=Jessica, zerkratzt und in Unterwäsche, kommt auf dem Boden eines zertrümmerten Aufzugskorbs zu sich und richtet sich auf.
totem.totem_tragedy_2=Jessica stürzt einen mit Holz abgestützten Schacht hinab und schlägt auf einem Metallgitter auf; sie liegt auf dem Rücken, mit dem Kopf zum Betrachter, der Unterkiefer abgerissen.
totem.totem_tragedy_2_ja=Jessica in Unterwäsche stürzt einen mit Holz abgestützten Schacht hinab und schlägt auf einem Metallgitter auf; sie liegt auf dem Rücken, mit dem Kopf zum Betrachter, den Mund offen, zerkratzt und voller blauer Flecken.
totem.totem_death_2=Matt stürzt durch die Dunkelheit; dann liegt er reglos da, Blut am Mund.
totem.totem_hunger_1=Durch jemandes Augen, dicht am Boden, in kaltem Blau verschwommen: Eine bleiche Hand streckt sich vor, kriechend geht es auf einen Steinhaufen mit einem kleinen Holzkreuz zu, auf dem BETH steht.
totem.totem_guidance_3=In nebligem blauem Licht kriecht ein durchnässter Mann auf allen vieren einen Felsvorsprung entlang an einem Holzpfosten vorbei; hinter ihm zieht sich Sam aus dem Wasser auf den Vorsprung.
totem.totem_guidance_4=Nahaufnahme: Eine Hand streichelt den Kopf eines ruhigen grauen Wolfs.
totem.totem_fortune_3=In einer Mine, von oben gesehen: Matt mit Stirnlampe hockt neben einer brennenden roten Signalfackel und blickt nach oben.
totem.totem_hunger_2=Durch jemandes Augen in einem mit Holz abgestützten Minentunnel: Der Blick schwankt und blitzt rot und gelb auf, eine Hand krallt sich in die Erde, und der Blick sackt zu Boden.
totem.totem_death_4=In einem Minentunnel strampeln jemandes Beine in der Luft, während er hochgezogen wird; Blut strömt herab.
totem.totem_danger_2=Sam im Handtuch steht in einer erleuchteten Türöffnung am anderen Ende eines großen dunklen Raums und leuchtet mit einer Taschenlampe umher; dicht vor dem Betrachter tritt jemandes Bein ins Bild.
totem.totem_guidance_5=Chris drückt sich verzweifelt eine Pistole unter den Kiefer.
totem.totem_danger_4=Unter einer Holzplattform greift eine Hand hinab nach einer behandschuhten Hand, die sich nach oben streckt; sie greifen aneinander vorbei.
totem.totem_guidance_6=Mike, mit Blut am Hals, schiebt einen hohen grünen Metallspind kräftig an; er rutscht an der Wand entlang.
totem.totem_danger_3=In einer Mine stürzt Jessica hart neben Matt zu Boden; er sinkt auf die Knie und beugt sich über sie.
totem.totem_tragedy_5=Ein Feuerball; dann liegt jemand bäuchlings auf dem Boden, den Kopf uns zugewandt, dahinter Flammen: eine helle Jacke versengt, das Gesicht bis aufs rohe Fleisch verbrannt, die Zähne gebleckt.
totem.totem_hunger_3=Durch jemandes Augen, rot getönt: an einer Leiter vorbei hinauf zu einer hellen Öffnung, die Minengleise entlang, dann in blendendes Licht.
totem.totem_tragedy_3=Verschneiter Wald bei Nacht, es brennen Feuer: Der Mann mit dem Flammenwerfer, von hinten und nur bis zu den Schultern zu sehen, steht da, während unter ihm Blut in den Schnee strömt, und sinkt dann auf die Knie; Chris, die Waffe in der Hand, sieht aus der Ferne zu.
totem.totem_death_5=Emily, die Zähne gebleckt, bekommt einen Schuss ins Auge: Ihr Kopf schnellt zurück, der Mund weit aufgerissen, an der Stelle des Auges ein blutiges Loch, das andere Auge nach oben verdreht.
totem.totem_death_5_ja=Der Blick geht von oben an einem hängenden weißen Lampenschirm vorbei auf einen dunklen Kiesboden: ein greller Blitz, das Bild zuckt, dann bewegt sich nichts mehr.
totem.totem_fortune_4=Mike richtet mit gequälter Miene eine Pistole direkt auf den Betrachter, schwenkt sie dann weg und wendet sich ab, ohne zu schießen.
totem.totem_danger_6=In einem schmalen Felsgang hält eine verängstigte Emily eine brennende rote Signalfackel hoch; sie flackert und erlischt, und Emily hält die erloschene Fackel vor sich ausgestreckt. Dann Dunkelheit.
totem.totem_tragedy_4=Ein Wendigo bäumt sich über jemandem auf, der am Boden liegt, und schlägt mit Wucht zu; ein zerquetschtes, blutiges Gesicht füllt das Bild.
totem.totem_tragedy_4_ja=In der Dunkelheit peitschen die langen, knochigen Gliedmaßen eines Wendigos mit ihren Klauen über jemanden hinweg, der am Boden liegt; Trümmer fliegen, dann Dunkelheit, dann eine unbewegte Nahaufnahme einer dunklen Jacke mit einem großen Buchstaben M.
totem.totem_death_3=Mike betätigt grinsend ein Feuerzeug; Funken sprühen.
totem.totem_hunger_4=Durch jemandes Augen, in einem blutroten Wald: die Jagd auf einen weiß leuchtenden Hirsch, dem man immer näher kommt.
totem.totem_tragedy_6=Lange Hände mit Klauen umklammern Joshs Kopf, während er schreit.
totem.totem_fortune_2=Nachts im Schnee steht Matt mit einer brennenden Laterne in der Hand an einer vernagelten, von unten beleuchteten Holztür, blickt sich nach ihr um und wendet dann den Blick ab.
totem.totem_death_6=Sam mit Stirnlampe schreit, während eine lange Hand mit Klauen ihr den Kiefer umklammert; Blut läuft ihr aus dem Mund.
totem.totem_hunger_5=Durch jemandes Augen, in Rot: Der Blick stößt auf eine langhaarige, weiß leuchtende Frau am Boden herab; sie krabbelt hastig auf allen vieren davon, dann duckt sie sich unter dem Blick zusammen, einen Arm über dem Kopf, den anderen von sich gestreckt.
totem.totem_danger_5=Ein dunkler Raum mit Reihen lederner Kinosessel: direkt vorn hockt ein bleicher Wendigo auf einer Rückenlehne; hinter einer Türöffnung kriecht ein zweiter auf allen vieren über den Boden, und ein dritter späht um den Türrahmen. Das Bild schwenkt herum, als einer quer durch den Raum springt; dann Dunkelheit.
totem.totem_fortune_5=Nachts brennt die Lodge; davor sitzt Ashley zusammengekauert im Schnee.
totem.totem_fortune_6=Im dämmrigen Wohnzimmer der Lodge schleicht ein Wendigo auf allen vieren auf Sam zu, die aus der Nähe von hinten zu sehen ist, bis sein Gesicht direkt neben ihrem ist; sie rührt sich nicht. Weiter hinten steht jemand reglos neben einer Lampe.
totem.totem_hunger_6=Durch jemandes Augen, in Rot: Eine lange Hand mit Klauen packt Josh an der Kehle und hebt ihn hoch, während er sich wehrt.
