; Dawn Access totem visions — Dutch. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Nacht, tussen rotsen: Beth, in een grijze gebreide trui, smakt met haar rug op een rotsblok, terwijl er bloed uit haar mond spuit; dan ligt Hannah roerloos op de stenen, haar gezicht bebloed, haar ogen open.
totem.totem_guidance_1=Een roodborstje landt in de sneeuw tussen berkenbomen.
totem.totem_tragedy_1=Een gestalte wordt achteruitgeslingerd, afgetekend tegen een vuurexplosie; dan ligt er een verkoold gezicht in de rook, de tanden ontbloot.
totem.totem_guidance_2=Sam, in een handdoek gewikkeld, rent met een zaklamp door een donkere gang naar het traliehek van een lift met het bordje ELEVATOR, laat zich dan in de schacht zakken en hurkt daar neer, naar buiten turend.
totem.totem_danger_1=In een mistig bos rukt een roedel herten op; het voorste hert, met gewei, komt tot vlakbij en burlt.
totem.totem_fortune_1=Jessica, vol schrammen en in haar ondergoed, komt bij op de vloer van een vernielde liftkooi en richt zich op.
totem.totem_tragedy_2=Jessica valt door een met hout gestutte schacht omlaag en smakt op een metalen rooster; ze ligt op haar rug, met haar hoofd naar ons toe, haar onderkaak afgerukt.
totem.totem_tragedy_2_ja=Jessica, in haar ondergoed, valt door een met hout gestutte schacht omlaag en smakt op een metalen rooster; ze ligt op haar rug, met haar hoofd naar ons toe, haar mond open, vol schrammen en blauwe plekken.
totem.totem_death_2=Matt valt door het donker; dan ligt hij roerloos, met bloed bij zijn mond.
totem.totem_hunger_1=Door iemands ogen, laag bij de grond in een koude blauwe waas: een bleke hand reikt naar voren, kruipend naar een hoop stenen met een klein houten kruis waarop BETH staat.
totem.totem_guidance_3=In een mistig blauw licht kruipt een doorweekte man op handen en voeten over een rotsrichel langs een houten paal; achter hem hijst Sam zich uit het water op de richel.
totem.totem_guidance_4=Close-up: een hand aait de kop van een rustige grijze wolf.
totem.totem_fortune_3=In een mijn, van bovenaf gezien: Matt, met een lamp op zijn voorhoofd, zit gehurkt bij een brandende rode handfakkel en kijkt omhoog.
totem.totem_hunger_2=Door iemands ogen in een met hout gestutte mijngang: het beeld slingert en flitst rood en geel, een hand klauwt over de vloer en het beeld zakt naar de grond.
totem.totem_death_4=In een mijngang trappen iemands benen in de lucht terwijl die persoon omhoog wordt gehesen; er stroomt bloed omlaag.
totem.totem_danger_2=Sam, in een handdoek, staat in een verlichte deuropening aan de overkant van een grote donkere kamer en schijnt met een zaklamp in het rond; vlak bij de kijker stapt iemands been in beeld.
totem.totem_guidance_5=Chris, radeloos, drukt een pistool onder zijn eigen kaak.
totem.totem_danger_4=Onder een houten platform reikt een hand omlaag naar een hand met een handschoen die zich omhoog uitstrekt; ze missen elkaar.
totem.totem_guidance_6=Mike, met bloed op zijn nek, duwt tegen een hoge groene metalen lockerkast; die schuift langs de muur.
totem.totem_danger_3=In een mijn valt Jessica hard op de grond naast Matt; hij zakt op zijn knieën en buigt zich over haar heen.
totem.totem_tragedy_5=Een vuurexplosie; dan ligt iemand op de buik op de vloer, het hoofd naar ons toe, met vlammen erachter: een lichtgekleurde jas verschroeid, het gezicht tot op het rauwe vlees verbrand, de tanden ontbloot.
totem.totem_hunger_3=Door iemands ogen, rood getint: omhoog langs een ladder naar een lichte opening, langs mijnrails en dan een verblindend licht in.
totem.totem_tragedy_3=Besneeuwd bos 's nachts, er branden vuren: de man met de vlammenwerper, van achteren gezien en alleen tot aan zijn schouders, staat terwijl er bloed onder hem op de sneeuw stroomt, en zakt dan op zijn knieën; Chris kijkt van een afstand toe, met een wapen in zijn hand.
totem.totem_death_5=Emily, met ontblote tanden, wordt in het oog geschoten: haar hoofd slaat naar achteren, haar mond gaapt, een bloedig gat waar het oog zat, het andere oog weggedraaid.
totem.totem_death_5_ja=Blik omlaag, langs een hangende witte lampenkap, op een donkere grindvloer: een felle flits, het beeld schokt, dan is alles stil.
totem.totem_fortune_4=Mike, gekweld, richt een pistool recht op de kijker, zwaait het dan weg en draait zich af zonder te schieten.
totem.totem_danger_6=In een smalle rotsgang houdt een angstige Emily een brandende rode handfakkel omhoog; die sputtert en dooft, en ze houdt de gedoofde fakkel voor zich uit. Dan duisternis.
totem.totem_tragedy_4=Een Wendigo rijst op boven iemand die op de grond ligt en slaat met kracht toe; een verbrijzeld, bebloed gezicht vult het beeld.
totem.totem_tragedy_4_ja=In het donker zwiepen de lange, knokige ledematen met klauwen van een Wendigo over iemand die op de grond ligt; er vliegt puin in het rond, dan duisternis, dan een stilstaande close-up van een donkere jas met een grote letter M.
totem.totem_death_3=Mike klikt grijnzend een aansteker aan; er spatten vonken op.
totem.totem_hunger_4=Door iemands ogen, in een bloedrood bos: jagend op een gloeiend wit hert en het steeds dichter naderend.
totem.totem_tragedy_6=Lange handen met klauwen klemmen zich om het hoofd van Josh terwijl hij schreeuwt.
totem.totem_fortune_2='s Nachts in de sneeuw staat Matt, met een brandende lantaarn in zijn hand, bij een dichtgetimmerde houten deur die van onderaf verlicht is, kijkt er even naar om en kijkt dan weg.
totem.totem_death_6=Sam, met een lamp op haar voorhoofd, schreeuwt terwijl een lange hand met klauwen haar kaak vastgrijpt; er loopt bloed uit haar mond.
totem.totem_hunger_5=Door iemands ogen, in rood: het beeld duikt omlaag op een vrouw met lang haar die wit oplicht op de grond; ze krabbelt op handen en voeten weg en duikt dan vlak eronder in elkaar, één arm over haar hoofd, de andere uitgestrekt.
totem.totem_danger_5=Een donkere ruimte met rijen leren bioscoopstoelen: vlak vooraan zit een bleke Wendigo gehurkt op een rugleuning; achter een deuropening kruipt een tweede op handen en voeten over de vloer, en een derde gluurt om de deurpost. Het beeld zwenkt terwijl een van hen dwars door de kamer springt; dan duisternis.
totem.totem_fortune_5=Het huis brandt 's nachts; ervoor zit Ashley ineengedoken in de sneeuw.
totem.totem_fortune_6=In de schemerige woonkamer van het huis sluipt een Wendigo op handen en voeten naar Sam, van dichtbij en van achteren gezien, tot zijn gezicht vlak naast het hare is; ze beweegt niet. Verder naar achteren staat iemand roerloos bij een lamp.
totem.totem_hunger_6=Door iemands ogen, in rood: een lange hand met klauwen grijpt Josh bij de keel en tilt hem op terwijl hij tegenspartelt.
