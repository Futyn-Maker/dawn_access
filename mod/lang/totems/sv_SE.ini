; Dawn Access totem visions — Swedish. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Natt, bland klippor: Beth, i en grå stickad tröja, slår med ryggen före ner mot ett stenblock, och blod sprutar ur hennes mun; sedan ligger Hannah stilla på stenarna med blodigt ansikte och öppna ögon.
totem.totem_guidance_1=En rödhake landar i snön bland björkar.
totem.totem_tragedy_1=En gestalt slungas bakåt, avtecknad mot en explosion av eld; sedan ligger ett förkolnat ansikte i röken, med blottade tänder.
totem.totem_guidance_2=Sam, insvept i en handduk, springer med en ficklampa längs en mörk korridor fram till en hissgrind märkt ELEVATOR, sänker sig sedan ner i schaktet och hukar sig där och kikar ut.
totem.totem_danger_1=I en dimmig skog närmar sig en flock rådjur; den hornprydda bocken i täten kommer alldeles nära och brölar.
totem.totem_fortune_1=Jessica, full av rivsår och i underkläder, kvicknar till på golvet i en krossad hisskorg och häver sig upp.
totem.totem_tragedy_2=Jessica faller ner genom ett timmerförstärkt schakt och brakar ner på ett metallgaller; hon ligger på rygg med huvudet mot oss och underkäken avsliten.
totem.totem_tragedy_2_ja=Jessica, i underkläder, faller ner genom ett timmerförstärkt schakt och brakar ner på ett metallgaller; hon ligger på rygg med huvudet mot oss, full av rivsår och blåmärken, med munnen öppen.
totem.totem_death_2=Matt faller genom mörkret; sedan ligger han stilla, med blod vid munnen.
totem.totem_hunger_1=Genom någons ögon, tätt intill marken i ett kallt blått dis: en blek hand sträcker sig fram, krypande mot en stenhög med ett litet träkors märkt BETH.
totem.totem_guidance_3=I ett disigt blått ljus kryper en genomblöt man på alla fyra längs en klippavsats förbi en trästolpe; bakom honom häver sig Sam upp ur vattnet och upp på avsatsen.
totem.totem_guidance_4=Närbild: en hand stryker en lugn grå varg över huvudet.
totem.totem_fortune_3=I en gruva, sett ovanifrån: Matt, med en lampa i pannan, sitter på huk vid ett brinnande rött handbloss och tittar upp.
totem.totem_hunger_2=Genom någons ögon i en timmerförstärkt gruvgång: bilden kränger och blinkar rött och gult, en hand klöser i golvet, och bilden sjunker mot marken.
totem.totem_death_4=I en gruvgång sprattlar någons ben i luften medan hen hissas upp; blod strömmar ner.
totem.totem_danger_2=Sam, i handduk, står i en upplyst dörröppning på andra sidan ett stort mörkt rum och lyser omkring sig med en ficklampa; nära betraktaren kliver någons ben in i bilden.
totem.totem_guidance_5=Chris, förtvivlad, trycker en pistol under sin egen käke.
totem.totem_danger_4=Under en träplattform sträcker sig en hand ner mot en hand i handske som sträcker sig upp; de missar varandra.
totem.totem_guidance_6=Mike, med blod på halsen, knuffar på ett högt grönt metallskåp; det glider längs väggen.
totem.totem_danger_3=I en gruva faller Jessica hårt till marken bredvid Matt; han sjunker ner på knä över henne.
totem.totem_tragedy_5=En explosion av eld; sedan ligger någon på mage på golvet med huvudet vänt mot oss och lågor bakom: den ljusa jackan svedd, ansiktet bränt till rått kött, tänderna blottade.
totem.totem_hunger_3=Genom någons ögon, i rött sken: uppåt förbi en stege mot en ljus öppning, längs gruvräls och sedan in i ett bländande ljus.
totem.totem_tragedy_3=Snöig skog om natten, eldar brinner: mannen med eldkastaren, sedd bakifrån och bara upp till axlarna, står medan blod strömmar ner på snön under honom och faller sedan på knä; Chris, med vapnet i handen, tittar på från avstånd.
totem.totem_death_5=Emily, med blottade tänder, blir skjuten i ögat: huvudet kastas bakåt, munnen gapar, ett blodigt hål där ögat satt, det andra ögat uppåtvänt.
totem.totem_death_5_ja=Blicken går ner förbi en hängande vit lampskärm mot ett mörkt grusgolv: en skarp ljusblixt, bilden rycker till, sedan är allt stilla.
totem.totem_fortune_4=Mike, plågad, siktar med en pistol rakt mot betraktaren, svänger sedan undan den och vänder sig bort utan att skjuta.
totem.totem_danger_6=I en smal passage i klippan håller en rädd Emily upp ett brinnande rött handbloss; det fräser och slocknar, och hon håller ut det slocknade blosset framför sig. Sedan mörker.
totem.totem_tragedy_4=En wendigo reser sig över någon som ligger på marken och slår ner med full kraft; ett krossat, blodigt ansikte fyller bilden.
totem.totem_tragedy_4_ja=I mörkret piskar en wendigos långa, beniga lemmar med klor över någon som ligger på marken; bråte flyger, sedan mörker, sedan en stillastående närbild av en mörk jacka med ett stort M.
totem.totem_death_3=Mike, flinande, knäpper på en tändare; gnistor sprutar.
totem.totem_hunger_4=Genom någons ögon, i en blodröd skog: hen jagar en glödande vit hjort och kommer allt närmare den.
totem.totem_tragedy_6=Långa händer med klor sluter sig om Joshs huvud medan han skriker.
totem.totem_fortune_2=På natten i snön står Matt, med en tänd lykta i handen, vid en igenspikad trädörr upplyst underifrån, kastar en blick tillbaka på den och tittar sedan bort.
totem.totem_death_6=Sam, med en lampa i pannan, skriker när en lång hand med klor griper om hennes käke; blod rinner ur hennes mun.
totem.totem_hunger_5=Genom någons ögon, i rött: bilden dyker ner mot en långhårig kvinna som glöder vitt på marken; hon kravlar hastigt undan på alla fyra och kryper sedan ihop under den, med ena armen över huvudet och den andra utslängd.
totem.totem_danger_5=Ett mörkt rum med rader av biofåtöljer i läder: rakt framför sitter en blek wendigo på huk på ett ryggstöd; bortom en dörröppning kryper en annan på alla fyra över golvet, och en tredje tittar fram bakom dörrkarmen. Bilden svänger runt när en av dem hoppar tvärs över rummet; sedan mörker.
totem.totem_fortune_5=Stugan brinner i natten; framför den sitter Ashley hopkrupen i snön.
totem.totem_fortune_6=I stugans dunkla vardagsrum smyger en wendigo på alla fyra fram mot Sam, sedd nära bakifrån, tills dess ansikte är alldeles intill hennes; hon rör sig inte. Längre bak står någon stilla vid en lampa.
totem.totem_hunger_6=Genom någons ögon, i rött: en lång hand med klor griper Josh om strupen och lyfter honom medan han kämpar emot.
