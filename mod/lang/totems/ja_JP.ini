; Dawn Access totem visions — Japanese. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=夜の岩場：灰色のニットのセーターを着たベスが、背中から大きな岩に激しく叩きつけられ、口から血が噴き出す。続いて、ハンナが石の上で動かずに横たわっている。顔は血まみれで、目は開いたまま。
totem.totem_guidance_1=白樺の木々の間で、コマツグミが雪の上に降り立つ。
totem.totem_tragedy_1=炎の爆発を背に、人影が後ろへ吹き飛ばされる。続いて、煙の中に横たわる黒焦げの顔。歯がむき出しになっている。
totem.totem_guidance_2=タオルを巻いたサムが、懐中電灯を手に暗い廊下を走って、ELEVATORと書かれたエレベーターの格子扉へ向かう。続いてシャフトの中へ降り、そこにしゃがみ込んで外をうかがう。
totem.totem_danger_1=霧深い森で、シカの群れが迫ってくる。先頭の角のある牡鹿がすぐ目の前まで来て、雄叫びを上げる。
totem.totem_fortune_1=傷だらけで下着姿のジェスが、壊れたエレベーターのかごの床で意識を取り戻し、身を起こす。
totem.totem_tragedy_2=ジェスが木組みのシャフトを落ち、金属の格子の上に叩きつけられる。頭をこちらに向けてあおむけに横たわり、下あごがもぎ取られている。
totem.totem_tragedy_2_ja=下着姿のジェスが木組みのシャフトを落ち、金属の格子の上に叩きつけられる。頭をこちらに向けてあおむけに横たわり、口を開けている。体は擦り傷とあざだらけ。
totem.totem_death_2=マットが暗闇の中を落ちていく。続いて、口元に血をつけたまま動かずに横たわっている。
totem.totem_hunger_1=誰かの目を通して、地面すれすれ、冷たく青くぼやけた視界：青白い手が前へ伸び、BETHと書かれた小さな木の十字架が立つ石の山へと這い進む。
totem.totem_guidance_3=霧がかった青い光の中、ずぶ濡れの男が四つんばいで岩棚を這い、木の柱の脇を通り過ぎる。その後ろで、サムが水から岩棚へと体を引き上げる。
totem.totem_guidance_4=クローズアップ：手が、落ち着いた灰色の狼の頭をなでる。
totem.totem_fortune_3=炭坑の中、上からの眺め：額にランプをつけたマットが、燃える赤い発炎筒のそばにしゃがみ込み、上を見上げる。
totem.totem_hunger_2=誰かの目を通して、木組みの炭坑トンネルの中：視界が大きく揺れて赤と黄色に光り、手が床をかきむしり、視界は地面へと沈んでいく。
totem.totem_death_4=炭坑のトンネルで、上へ引き上げられていく誰かの脚が宙でばたつく。血が流れ落ちる。
totem.totem_danger_2=タオル姿のサムが、暗く広い部屋の向こう側にある明るい戸口に立ち、懐中電灯であたりを照らす。こちらのすぐそばで、誰かの脚が画面に踏み込んでくる。
totem.totem_guidance_5=取り乱したクリスが、自分のあごの下に拳銃を押し当てる。
totem.totem_danger_4=木の足場の下で、下へ伸びた手が、上へ伸ばされた手袋の手に届こうとする。二つの手はすれ違う。
totem.totem_guidance_6=首に血のついたマイクが、背の高い緑色の金属ロッカーをぐいと押す。ロッカーは壁に沿って滑っていく。
totem.totem_danger_3=炭坑で、ジェスがマットのそばの地面に激しく倒れ込む。マットはひざをつき、彼女の上にかがみ込む。
totem.totem_tragedy_5=炎の爆発。続いて、誰かが頭をこちらに向けてうつ伏せに床に倒れている。背後には炎。明るい色の上着は焦げ、顔は焼けただれて生々しい肉がのぞき、歯がむき出しになっている。
totem.totem_hunger_3=誰かの目を通して、赤く染まった視界：はしごの脇を上へ、明るい開口部へ向かい、炭坑のレールに沿って進み、やがてまばゆい光の中へ。
totem.totem_tragedy_3=夜の雪の森、火が燃えている：火炎放射器を持った男が、後ろ姿で肩から下だけが映った状態で立っており、足元の雪に血が流れ落ちる。続いて男はひざをつく。銃を手にしたクリスが、離れた所から見ている。
totem.totem_death_5=歯をむき出しにしたエミリーが目を撃たれる。頭が後ろへのけぞり、口は大きく開き、目のあった所には血まみれの穴。もう片方の目は白目をむいている。
totem.totem_death_5_ja=吊り下がった白いランプシェードの脇から、暗い砂利の床を見下ろす視界：まばゆい閃光が走り、画面が揺れ、やがてすべてが静止する。
totem.totem_fortune_4=苦悶の表情のマイクが、拳銃をまっすぐこちらに向ける。やがて銃をそらし、撃たずに顔を背ける。
totem.totem_danger_6=狭い岩の通路で、おびえたエミリーが燃える赤い発炎筒を掲げる。発炎筒の火はちらついて消え、彼女は消えた発炎筒を前に突き出す。そして暗闇。
totem.totem_tragedy_4=ウェンディゴが、地面に倒れている誰かの上で伸び上がり、激しく打ち下ろす。潰れた血まみれの顔が画面いっぱいに映る。
totem.totem_tragedy_4_ja=暗闇の中、ウェンディゴの長く骨ばった、鉤爪のある手足が、地面に倒れている誰かの上で激しく振るわれる。破片が飛び散り、続いて暗闇。そして、大きなMの文字が入った暗い色の上着の、静止したクローズアップ。
totem.totem_death_3=にやりと笑ったマイクがライターを擦る。火花が弾け散る。
totem.totem_hunger_4=誰かの目を通して、血のように赤い森の中：光る白い牡鹿を追いかけ、じりじりと距離を詰めていく。
totem.totem_tragedy_6=鉤爪のある長い両手が、悲鳴を上げるジョッシュの頭をわしづかみにする。
totem.totem_fortune_2=夜の雪の中、火のともったランタンを手にしたマットが、板でふさがれた木の扉のそばに立つ。扉は下から照らされている。マットは扉をちらりと振り返り、それから目をそらす。
totem.totem_death_6=額にランプをつけたサムが、鉤爪のある長い手にあごをつかまれ、悲鳴を上げる。口から血が流れている。
totem.totem_hunger_5=誰かの目を通して、赤く染まった視界：視界が、地面で白く光る長い髪の女性へと急降下する。女性は四つんばいで逃げようとし、やがて視界の真下で身を縮める。片腕で頭をかばい、もう片方の腕を投げ出している。
totem.totem_danger_5=革張りの映画館の座席が並ぶ暗い部屋。すぐ手前では、青白いウェンディゴが座席の背もたれの上にうずくまっている。奥の戸口の向こうでは別の一体が四つん這いで床を這い、三体目が戸枠の陰からのぞいている。視界が大きく振れ、一体が部屋を跳び越える。そして暗転。
totem.totem_fortune_5=夜、ロッジが燃えている。その前で、アシュリーが雪の上に背を丸めて座っている。
totem.totem_fortune_6=ロッジの薄暗いラウンジで、ウェンディゴが四つんばいでサムにじりじりと迫り、やがてその顔がサムの顔のすぐ横に来る。サムは間近から後ろ姿で映っており、身動きしない。奥では、ランプのそばに誰かがじっと立っている。
totem.totem_hunger_6=誰かの目を通して、赤く染まった視界：鉤爪のある長い手がジョッシュの喉をつかみ、もがく彼を持ち上げる。
