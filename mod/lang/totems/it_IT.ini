; Dawn Access totem visions — Italian. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Notte, tra le rocce: Beth, con un maglione grigio lavorato a maglia, si schianta di schiena su un masso, il sangue che le schizza dalla bocca; poi Hannah giace immobile sulle pietre, il volto insanguinato, gli occhi aperti.
totem.totem_guidance_1=Un pettirosso si posa sulla neve tra le betulle.
totem.totem_tragedy_1=Una figura viene sbalzata all'indietro davanti a una vampata di fuoco; poi, nel fumo, un volto carbonizzato con i denti scoperti.
totem.totem_guidance_2=Sam, avvolta in un asciugamano, corre con una torcia lungo un corridoio buio fino alla grata di un ascensore con la scritta ELEVATOR, poi si cala nel pozzo e vi si accovaccia, sbirciando fuori.
totem.totem_danger_1=In una foresta nebbiosa avanza un branco di cervi; il primo, un maschio con le corna, arriva vicinissimo e bramisce.
totem.totem_fortune_1=Jessica, graffiata e in biancheria intima, riprende i sensi sul pavimento di una gabbia d'ascensore distrutta e si solleva.
totem.totem_tragedy_2=Jessica precipita in un pozzo puntellato di legno e si schianta su una grata metallica; giace sulla schiena, con la testa verso lo spettatore, la mascella inferiore strappata via.
totem.totem_tragedy_2_ja=Jessica, in biancheria intima, precipita in un pozzo puntellato di legno e si schianta su una grata metallica; giace sulla schiena, con la testa verso lo spettatore, la bocca aperta, piena di graffi e lividi.
totem.totem_death_2=Matt precipita nel buio; poi giace immobile, con del sangue sulla bocca.
totem.totem_hunger_1=Attraverso gli occhi di qualcuno, rasoterra, in un blu freddo e sfocato: una mano pallida si protende in avanti, strisciando verso un cumulo di pietre su cui sta una piccola croce di legno con la scritta BETH.
totem.totem_guidance_3=In una luce blu e nebbiosa, un uomo fradicio avanza carponi lungo una sporgenza rocciosa, oltre un palo di legno; dietro di lui, Sam si issa fuori dall'acqua sulla sporgenza.
totem.totem_guidance_4=Primo piano: una mano accarezza la testa di un lupo grigio tranquillo.
totem.totem_fortune_3=In una miniera, vista dall'alto: Matt, con una lampada frontale, è accovacciato accanto a un bengala rosso acceso e alza lo sguardo.
totem.totem_hunger_2=Attraverso gli occhi di qualcuno, in una galleria di miniera puntellata di legno: la visuale sbanda e lampeggia di rosso e di giallo, una mano graffia il suolo, e la visuale cala fino a terra.
totem.totem_death_4=In una galleria di miniera, le gambe di qualcuno scalciano nell'aria mentre viene issato verso l'alto; il sangue cola giù.
totem.totem_danger_2=Sam, in asciugamano, sta sulla soglia illuminata di una porta dall'altra parte di una grande stanza buia e fa luce intorno con una torcia; vicinissimo allo spettatore, la gamba di qualcuno entra nell'inquadratura.
totem.totem_guidance_5=Chris, disperato, si preme una pistola sotto la mascella.
totem.totem_danger_4=Sotto una piattaforma di legno, una mano scende verso una mano guantata protesa verso l'alto; non riescono ad afferrarsi.
totem.totem_guidance_6=Mike, con del sangue sul collo, spinge con forza un alto armadietto di metallo verde; scivola lungo la parete.
totem.totem_danger_3=In una miniera, Jessica cade pesantemente a terra accanto a Matt; lui si inginocchia e si china su di lei.
totem.totem_tragedy_5=Una vampata di fuoco; poi qualcuno giace a pancia in giù sul pavimento, la testa girata verso di noi, le fiamme alle spalle: la giacca chiara bruciacchiata, il volto ustionato fino alla carne viva, i denti scoperti.
totem.totem_hunger_3=Attraverso gli occhi di qualcuno, tutto tinto di rosso: si sale oltre una scala a pioli verso un'apertura luminosa, si percorrono dei binari di miniera, poi si entra in una luce accecante.
totem.totem_tragedy_3=Bosco innevato di notte, fuochi accesi: l'uomo col lanciafiamme, visto da dietro e solo fino alle spalle, sta in piedi mentre sotto di lui il sangue si riversa sulla neve, poi cade in ginocchio; Chris, con l'arma in mano, guarda da lontano.
totem.totem_death_5=Emily, a denti scoperti, viene colpita a un occhio da uno sparo: la testa scatta all'indietro, la bocca spalancata, un foro insanguinato al posto dell'occhio, l'altro occhio rivoltato verso l'alto.
totem.totem_death_5_ja=Lo sguardo scende dall'alto, oltre un paralume bianco appeso, su un pavimento di ghiaia scura: un lampo intenso, l'immagine sobbalza, poi tutto è immobile.
totem.totem_fortune_4=Mike, angosciato, punta una pistola dritto verso lo spettatore, poi la sposta di lato e si volta senza sparare.
totem.totem_danger_6=In uno stretto passaggio tra le rocce, un'Emily spaventata solleva un bengala rosso acceso; si spegne scoppiettando, e lei protende davanti a sé il bengala spento. Poi il buio.
totem.totem_tragedy_4=Un Wendigo si erge sopra qualcuno a terra e si abbatte su di lui; un volto schiacciato e insanguinato riempie l'inquadratura.
totem.totem_tragedy_4_ja=Nel buio, i lunghi arti ossuti e artigliati di un Wendigo sferzano l'aria sopra qualcuno a terra; volano detriti, poi il buio, poi un primo piano fisso di una giacca scura con una grande lettera M.
totem.totem_death_3=Mike, sogghignando, fa scattare un accendino; sprizzano scintille.
totem.totem_hunger_4=Attraverso gli occhi di qualcuno, in una foresta rosso sangue: insegue un cervo di un bianco luminoso, guadagnando terreno.
totem.totem_tragedy_6=Lunghe mani artigliate si serrano sulla testa di Josh, che urla.
totem.totem_fortune_2=Di notte, nella neve, Matt, con una lanterna accesa in mano, sta accanto a una porta di legno sbarrata con assi, illuminata dal basso, si volta a guardarla, poi distoglie lo sguardo.
totem.totem_death_6=Sam, con una lampada frontale, urla mentre una lunga mano artigliata le stringe la mascella; il sangue le cola dalla bocca.
totem.totem_hunger_5=Attraverso gli occhi di qualcuno, in rosso: la visuale piomba su una donna dai capelli lunghi, di un bianco luminoso, a terra; lei cerca di fuggire carponi, poi si rannicchia proprio sotto la visuale, un braccio sopra la testa, l'altro proteso.
totem.totem_danger_5=Una stanza buia con file di poltrone da cinema in pelle: proprio davanti, un Wendigo pallido è accovacciato su uno schienale; oltre una porta, un altro striscia carponi sul pavimento e un terzo sbircia da dietro lo stipite. L'inquadratura ruota mentre uno di loro balza attraverso la stanza; poi il buio.
totem.totem_fortune_5=La baita brucia nella notte; lì davanti, Ashley siede rannicchiata nella neve.
totem.totem_fortune_6=Nel salotto in penombra della baita, un Wendigo avanza carponi verso Sam, vista da vicino e di spalle, finché il suo volto non è proprio accanto a quello di lei; Sam non si muove. Più indietro, qualcuno sta immobile accanto a una lampada.
totem.totem_hunger_6=Attraverso gli occhi di qualcuno, in rosso: una lunga mano artigliata afferra Josh per la gola e lo solleva mentre si dibatte.
