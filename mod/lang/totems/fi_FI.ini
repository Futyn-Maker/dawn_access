; Dawn Access totem visions — Finnish. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Yö, kivien keskellä: harmaaseen neulepuseroon pukeutunut Beth iskeytyy selkä edellä lohkareeseen, ja verta suihkuaa hänen suustaan; sitten Hannah makaa liikkumatta kivillä kasvot verisinä, silmät auki.
totem.totem_guidance_1=Punarinta laskeutuu lumelle koivujen keskelle.
totem.totem_tragedy_1=Hahmo sinkoutuu taaksepäin tuliräjähdystä vasten; sitten savussa näkyvät hiiltyneet kasvot, hampaat irvessä.
totem.totem_guidance_2=Pyyhkeeseen kietoutunut Sam juoksee taskulamppu kädessä pimeää käytävää pitkin hissin ristikko-ovelle, jossa lukee ELEVATOR, laskeutuu sitten kuiluun ja kyyristyy sinne kurkistellen ulos.
totem.totem_danger_1=Sumuisessa metsässä peuralauma etenee; edellä kulkeva sarvipäinen uros tulee aivan lähelle ja mylvii.
totem.totem_fortune_1=Naarmuinen, alusvaatteisillaan oleva Jessica virkoaa romuttuneen hissikorin lattialla ja kohottautuu.
totem.totem_tragedy_2=Jessica putoaa puulla tuettua kuilua alas ja rysähtää metalliritilälle; hän makaa selällään pää meitä kohti, alaleuka irti revittynä.
totem.totem_tragedy_2_ja=Alusvaatteisillaan oleva Jessica putoaa puulla tuettua kuilua alas ja rysähtää metalliritilälle; hän makaa selällään pää meitä kohti, suu auki, naarmuisena ja mustelmilla.
totem.totem_death_2=Matt putoaa pimeyden halki; sitten hän makaa liikkumatta, verta suupielessä.
totem.totem_hunger_1=Jonkun silmin, maan rajassa, kylmässä sinisessä usvassa: kalpea käsi kurottaa eteenpäin, kun hän ryömii kohti kivikasaa, jonka pienessä puuristissä lukee BETH.
totem.totem_guidance_3=Usvaisessa sinisessä valossa läpimärkä mies ryömii nelinkontin kalliokielekettä pitkin puupaalun ohi; hänen takanaan Sam kiskoo itsensä vedestä kielekkeelle.
totem.totem_guidance_4=Lähikuva: käsi silittää rauhallisen harmaan suden päätä.
totem.totem_fortune_3=Kaivoksessa, ylhäältä nähtynä: Matt, otsalamppu päässään, kyykkii palavan punaisen käsisoihdun vieressä ja katsoo ylös.
totem.totem_hunger_2=Jonkun silmin puulla tuetussa kaivostunnelissa: näkymä horjahtelee ja välähtelee punaisena ja keltaisena, käsi raapii lattiaa, ja näkymä vajoaa maahan.
totem.totem_death_4=Kaivostunnelissa jonkun jalat potkivat ilmassa, kun häntä hilataan ylös; verta valuu alas.
totem.totem_danger_2=Sam, pyyhe yllään, seisoo valaistussa oviaukossa suuren pimeän huoneen toisella puolella ja valaisee taskulampulla ympärilleen; lähellä katsojaa jonkun jalka astuu kuvaan.
totem.totem_guidance_5=Järkyttynyt Chris painaa pistoolia oman leukansa alle.
totem.totem_danger_4=Puulavan alla käsi kurottaa alas kohti ylös ojentuvaa hansikoitua kättä; ne eivät saa toisistaan kiinni.
totem.totem_guidance_6=Mike, verta kaulassaan, työntää korkeaa vihreää metallikaappia; se liukuu seinää pitkin.
totem.totem_danger_3=Kaivoksessa Jessica rojahtaa rajusti maahan Mattin viereen; Matt pudottautuu polvilleen hänen ylleen.
totem.totem_tragedy_5=Tuliräjähdys; sitten joku makaa vatsallaan lattialla pää meihin päin, takanaan liekkejä: vaalea takki kärventyneenä, kasvot pahoin palaneina, raaka liha näkyvissä, hampaat paljaina.
totem.totem_hunger_3=Jonkun silmin, punaisessa sävyssä: ylös tikkaiden ohi kohti valoisaa aukkoa, kaivoskiskoja pitkin ja sitten sokaisevaan valoon.
totem.totem_tragedy_3=Luminen metsä yöllä, tulia palaa: liekinheitintä kantava mies, takaa ja vain hartioihin asti nähtynä, seisoo, kun verta valuu lumelle hänen alleen, ja vajoaa sitten polvilleen; Chris katselee kauempaa ase kädessään.
totem.totem_death_5=Emily, hampaat irvessä, saa luodin silmäänsä: hänen päänsä nytkähtää taaksepäin, suu ammollaan, silmän paikalla verinen reikä, toinen silmä ylöspäin kiertyneenä.
totem.totem_death_5_ja=Katse alas, riippuvan valkoisen lampunvarjostimen ohi, tummaan soralattiaan: kirkas välähdys, kuva nytkähtää, sitten kaikki on liikkumatta.
totem.totem_fortune_4=Tuskainen Mike tähtää pistoolilla suoraan katsojaan, heilauttaa sitten aseen sivuun ja kääntyy pois ampumatta.
totem.totem_danger_6=Kapeassa kalliokäytävässä pelästynyt Emily pitää koholla palavaa punaista käsisoihtua; se sihisee ja sammuu, ja hän pitää sammunutta käsisoihtua ojennettuna edessään. Sitten pimeys.
totem.totem_tragedy_4=Wendigo kohoaa jonkun maassa makaavan ylle ja iskee alas; murskautuneet, veriset kasvot täyttävät kuvan.
totem.totem_tragedy_4_ja=Pimeässä wendigon pitkät, luisevat, kynsikkäät raajat huitovat jonkun maassa makaavan yllä; pirstaleita sinkoilee, sitten pimeys, sitten liikkumaton lähikuva tummasta takista, jossa on iso kirjain M.
totem.totem_death_3=Virnistelevä Mike napsauttaa sytytintä; kipinät sinkoilevat.
totem.totem_hunger_4=Jonkun silmin, verenpunaisessa metsässä: hän jahtaa hehkuvan valkoista peuraa ja pääsee yhä lähemmäs sitä.
totem.totem_tragedy_6=Pitkät, kynsikkäät kädet puristuvat Joshin pään ympärille, kun hän huutaa.
totem.totem_fortune_2=Yöllä lumessa Matt seisoo palava lyhty kädessään alhaalta valaistun, laudoilla tukitun puuoven vieressä, vilkaisee taakseen oveen ja kääntää sitten katseensa pois.
totem.totem_death_6=Sam, otsalamppu päässään, huutaa, kun pitkä, kynsikäs käsi puristaa hänen leukaansa; hänen suustaan valuu verta.
totem.totem_hunger_5=Jonkun silmin, kaikki punaisena: näkymä syöksähtää alas kohti maassa olevaa pitkähiuksista, valkoisena hehkuvaa naista; hän konttaa hätäisesti pakoon ja kyyristyy sitten sen alla, toinen käsivarsi päänsä päällä, toinen sivulle heitettynä.
totem.totem_danger_5=Pimeä huone, jossa on rivittäin nahkaisia elokuvateatterin istuimia: aivan edessä kalpea wendigo kyykkii istuimen selkänojalla; oviaukon takana toinen ryömii nelinkontin lattian poikki, ja kolmas kurkistaa ovenkarmin takaa. Kuva heilahtaa, kun yksi niistä loikkaa huoneen poikki; sitten pimeys.
totem.totem_fortune_5=Mökki palaa yöllä; sen edessä Ashley istuu kyyryssä lumessa.
totem.totem_fortune_6=Mökin hämärässä olohuoneessa wendigo hiipii nelinkontin kohti Samia, joka näkyy läheltä takaapäin, kunnes sen kasvot ovat aivan hänen kasvojensa vieressä; hän ei liikahda. Kauempana joku seisoo liikkumatta lampun vieressä.
totem.totem_hunger_6=Jonkun silmin, kaikki punaisena: pitkä, kynsikäs käsi tarttuu Joshia kurkusta ja nostaa hänet ilmaan, kun hän rimpuilee.
