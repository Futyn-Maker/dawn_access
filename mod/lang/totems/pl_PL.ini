; Dawn Access totem visions — Polish. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Noc, wśród skał: Beth w szarym dzierganym swetrze z impetem uderza plecami o głaz, z ust tryska jej krew; potem Hannah leży nieruchomo na kamieniach, z zakrwawioną twarzą i otwartymi oczami.
totem.totem_guidance_1=Rudzik siada na śniegu wśród brzóz.
totem.totem_tragedy_1=Postać zostaje odrzucona do tyłu na tle ognistego wybuchu; potem w dymie leży zwęglona twarz z obnażonymi zębami.
totem.totem_guidance_2=Sam, owinięta ręcznikiem, biegnie z latarką ciemnym korytarzem do kraty windy z napisem ELEVATOR, potem opuszcza się do szybu i przykucnięta wygląda z niego.
totem.totem_danger_1=We mglistym lesie nadciąga stado jeleni; idący na przedzie jeleń z porożem podchodzi całkiem blisko i ryczy.
totem.totem_fortune_1=Podrapana Jessica w bieliźnie odzyskuje przytomność na podłodze rozbitej klatki windy i podnosi się.
totem.totem_tragedy_2=Jessica spada szybem obudowanym drewnem i rozbija się o metalową kratę; leży na plecach, głową w naszą stronę, z oderwaną żuchwą.
totem.totem_tragedy_2_ja=Jessica w bieliźnie spada szybem obudowanym drewnem i rozbija się o metalową kratę; leży na plecach, głową w naszą stronę, z otwartymi ustami, podrapana i posiniaczona.
totem.totem_death_2=Matt spada w ciemności; potem leży nieruchomo, z krwią przy ustach.
totem.totem_hunger_1=Czyimiś oczami, tuż przy ziemi, w zimnej niebieskiej mgiełce: blada ręka sięga naprzód, pełznąc ku stercie kamieni z małym drewnianym krzyżem z napisem BETH.
totem.totem_guidance_3=W mglistym niebieskim świetle przemoczony mężczyzna pełznie na czworakach po skalnej półce, mijając drewniany słup; za nim Sam wydostaje się z wody na półkę.
totem.totem_guidance_4=Zbliżenie: dłoń gładzi łeb spokojnego szarego wilka.
totem.totem_fortune_3=W kopalni, widok z góry: Matt z lampą na czole kuca przy płonącej czerwonej racy i patrzy w górę.
totem.totem_hunger_2=Czyimiś oczami, w tunelu kopalni obudowanym drewnem: obraz się chwieje i błyska na czerwono i żółto, ręka drapie podłoże, a obraz osuwa się ku ziemi.
totem.totem_death_4=W tunelu kopalni wierzgają w powietrzu nogi kogoś wciąganego w górę; w dół spływa krew.
totem.totem_danger_2=Sam w ręczniku stoi w oświetlonych drzwiach po drugiej stronie dużego ciemnego pomieszczenia i świeci latarką dookoła; tuż przed widzem w kadr wkracza czyjaś noga.
totem.totem_guidance_5=Zrozpaczony Chris przyciska sobie pistolet pod szczękę.
totem.totem_danger_4=Pod drewnianym pomostem dłoń sięga w dół ku wyciągniętej w górę dłoni w rękawiczce; mijają się.
totem.totem_guidance_6=Mike z krwią na szyi popycha wysoką zieloną metalową szafkę; szafka sunie wzdłuż ściany.
totem.totem_danger_3=W kopalni Jessica ciężko pada na ziemię obok Matta; on opada nad nią na kolana.
totem.totem_tragedy_5=Wybuch płomieni; potem ktoś leży na brzuchu na podłodze, z głową zwróconą ku nam, a za nim płomienie: osmalona jasna kurtka, twarz spalona do żywego mięsa, wyszczerzone zęby.
totem.totem_hunger_3=Czyimiś oczami, w czerwonym świetle: w górę obok drabiny ku jasnemu otworowi, wzdłuż szyn w kopalni, a potem w oślepiający blask.
totem.totem_tragedy_3=Nocą w zaśnieżonym lesie płoną ognie: mężczyzna z miotaczem ognia, widoczny od tyłu i tylko do ramion, stoi, a pod nim na śnieg leje się krew; potem pada na kolana. Chris z bronią w ręku patrzy z daleka.
totem.totem_death_5=Emily z obnażonymi zębami dostaje kulę w oko: jej głowa odskakuje do tyłu, usta szeroko otwarte, w miejscu oka krwawa dziura, drugie oko uciekło w górę.
totem.totem_death_5_ja=Widok z góry, obok wiszącego białego abażuru, na ciemną żwirową podłogę: jasny błysk, obraz drga, potem wszystko zamiera.
totem.totem_fortune_4=Udręczony Mike celuje z pistoletu prosto w widza, potem odwodzi broń w bok i odwraca się, nie strzelając.
totem.totem_danger_6=W wąskim skalnym przejściu przestraszona Emily unosi płonącą czerwoną racę; raca prycha i gaśnie, a Emily wyciąga zgasłą racę przed siebie. Potem ciemność.
totem.totem_tragedy_4=Wendigo wznosi się nad kimś leżącym na ziemi i z impetem uderza w dół; zmiażdżona, zakrwawiona twarz wypełnia cały obraz.
totem.totem_tragedy_4_ja=W ciemności długie, kościste, szponiaste kończyny wendigo miotają się nad kimś leżącym na ziemi; lecą odłamki, potem ciemność, a potem nieruchome zbliżenie ciemnej kurtki z dużą literą M.
totem.totem_death_3=Szczerzący się Mike pstryka zapalniczką; pryskają iskry.
totem.totem_hunger_4=Czyimiś oczami, w krwistoczerwonym lesie: goni świecącego białego jelenia i coraz bardziej się do niego zbliża.
totem.totem_tragedy_6=Długie, szponiaste dłonie zaciskają się na głowie krzyczącego Josha.
totem.totem_fortune_2=Nocą, na śniegu, Matt z zapaloną latarnią w ręku stoi przy zabitych deskami drewnianych drzwiach, oświetlonych od dołu, ogląda się na nie, a potem odwraca wzrok.
totem.totem_death_6=Sam z lampą na czole krzyczy, gdy długa, szponiasta dłoń ściska jej szczękę; z ust cieknie jej krew.
totem.totem_hunger_5=Czyimiś oczami, w czerwonym świetle: obraz gwałtownie opada ku długowłosej kobiecie, świecącej na biało na ziemi; ona próbuje odczołgać się na czworakach, a potem kuli się tuż pod nim, jedną ręką osłaniając głowę, drugą wyrzuciwszy przed siebie.
totem.totem_danger_5=Ciemne pomieszczenie z rzędami skórzanych foteli kinowych: tuż z przodu na oparciu fotela kuca blady wendigo; za drzwiami drugi pełznie na czworakach po podłodze, a trzeci wygląda zza framugi. Obraz gwałtownie się obraca, gdy jeden z nich przeskakuje przez pokój; potem ciemność.
totem.totem_fortune_5=Nocą płonie schronisko; przed nim Ashley siedzi skulona na śniegu.
totem.totem_fortune_6=W słabo oświetlonym salonie schroniska wendigo podkrada się na czworakach do Sam, widocznej z bliska od tyłu, aż jego twarz znajduje się tuż przy jej twarzy; ona się nie rusza. Dalej, przy lampie, ktoś stoi nieruchomo.
totem.totem_hunger_6=Czyimiś oczami, w czerwonym świetle: długa, szponiasta dłoń chwyta Josha za gardło i unosi go, a on się szarpie.
