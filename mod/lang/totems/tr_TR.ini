; Dawn Access totem visions — Turkish. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Gece, kayaların arasında: gri örgü kazaklı Beth sırtüstü iri bir kayaya sertçe çarpıyor, ağzından kan fışkırıyor; ardından Hannah taşların üzerinde hareketsiz yatıyor, yüzü kanlı, gözleri açık.
totem.totem_guidance_1=Bir ardıç kuşu, huş ağaçlarının arasında karın üstüne konuyor.
totem.totem_tragedy_1=Bir figür, alevli bir patlamanın önünde geriye savruluyor; ardından dumanın içinde, dişleri açıkta, kömürleşmiş bir yüz yatıyor.
totem.totem_guidance_2=Havluya sarınmış Sam, elinde bir el feneriyle karanlık bir koridordan geçip üzerinde ELEVATOR yazan parmaklıklı bir asansör kapısına koşuyor; ardından kuyuya iniyor ve orada çömelip dışarıyı gözetliyor.
totem.totem_danger_1=Sisli bir ormanda bir geyik sürüsü ilerliyor; öndeki boynuzlu erkek geyik iyice yaklaşıp böğürüyor.
totem.totem_fortune_1=Üstü başı çizik içinde, iç çamaşırlı Jessica, parçalanmış bir asansör kafesinin zemininde kendine geliyor ve doğruluyor.
totem.totem_tragedy_2=Jessica ahşap destekli bir kuyudan düşüp metal bir ızgaranın üstüne çakılıyor; sırtüstü yatıyor, başı bize doğru, alt çenesi kopmuş.
totem.totem_tragedy_2_ja=İç çamaşırlı Jessica ahşap destekli bir kuyudan düşüp metal bir ızgaranın üstüne çakılıyor; sırtüstü yatıyor, başı bize doğru, ağzı açık, her yeri çizik ve morluk içinde.
totem.totem_death_2=Matt karanlığın içinden düşüyor; ardından hareketsiz yatıyor, ağzının kenarında kan var.
totem.totem_hunger_1=Birinin gözlerinden, yere yakın, soğuk mavi bir bulanıklık içinde: solgun bir el öne uzanıyor; sürünerek, üzerinde BETH yazan küçük tahta bir haç bulunan bir taş yığınına doğru ilerliyor.
totem.totem_guidance_3=Puslu mavi bir ışıkta sırılsıklam bir adam, kayalık bir çıkıntı boyunca dört ayak üstünde sürünerek tahta bir direğin yanından geçiyor; arkasında Sam sudan çıkıp kendini çıkıntıya çekiyor.
totem.totem_guidance_4=Yakın plan: bir el, sakin, gri bir kurdun başını okşuyor.
totem.totem_fortune_3=Bir madende, yukarıdan bakış: alnında lamba olan Matt, yanan kırmızı bir el fişeğinin yanında çömelmiş, yukarı bakıyor.
totem.totem_hunger_2=Birinin gözlerinden, ahşap destekli bir maden tünelinde: görüntü yalpalıyor, kırmızı ve sarı yanıp sönüyor, bir el zemini tırmalıyor ve görüntü yere doğru iniyor.
totem.totem_death_4=Bir maden tünelinde, yukarı çekilen birinin bacakları havada çırpınıyor; aşağı kan akıyor.
totem.totem_danger_2=Havlulu Sam, büyük, karanlık bir odanın öbür ucunda, aydınlık bir kapı boşluğunda duruyor ve el feneriyle etrafa ışık tutuyor; izleyicinin hemen yakınında birinin bacağı görüntüye giriyor.
totem.totem_guidance_5=Perişan haldeki Chris, bir tabancayı kendi çenesinin altına dayıyor.
totem.totem_danger_4=Ahşap bir platformun altında bir el, yukarı uzanan eldivenli bir ele doğru aşağı uzanıyor; eller buluşamıyor.
totem.totem_guidance_6=Boynunda kan olan Mike uzun, yeşil, metal bir dolabı itiyor; dolap duvar boyunca kayıyor.
totem.totem_danger_3=Bir madende Jessica, Matt'in yanında sertçe yere düşüyor; Matt dizlerinin üstüne çöküp onun üzerine eğiliyor.
totem.totem_tragedy_5=Bir alev patlaması; ardından biri yüzüstü yerde yatıyor, başı bize dönük, arkasında alevler: açık renkli ceketi kavrulmuş, yüzü yanıp çiğ ete dönmüş, dişleri açıkta.
totem.totem_hunger_3=Birinin gözlerinden, kırmızı bir ışıkta: bir merdivenin yanından yukarı, aydınlık bir açıklığa doğru, maden rayları boyunca, ardından göz kamaştırıcı bir ışığın içine.
totem.totem_tragedy_3=Gece, karlı bir orman, ateşler yanıyor: arkadan ve yalnızca omuzlarına kadar görünen alev silahlı adam ayakta duruyor, altındaki karın üstüne kan dökülüyor, ardından dizlerinin üstüne çöküyor; elinde silahıyla Chris uzaktan izliyor.
totem.totem_death_5=Dişlerini göstermiş Emily gözünden vuruluyor: başı geriye savruluyor, ağzı ardına kadar açık, gözünün yerinde kanlı bir delik, öbür gözü yukarı kaymış.
totem.totem_death_5_ja=Asılı beyaz bir abajurun yanından karanlık, çakıllı bir zemine yukarıdan bakış: parlak bir parlama, görüntü sarsılıyor, ardından her şey hareketsiz kalıyor.
totem.totem_fortune_4=Acı içindeki Mike bir tabancayı doğrudan izleyiciye doğrultuyor, sonra namluyu yana çekiyor ve ateş etmeden başka tarafa dönüyor.
totem.totem_danger_6=Dar bir kaya geçidinde korku içindeki Emily, yanan kırmızı bir el fişeğini kaldırıyor; el fişeği cızırdayıp sönüyor ve Emily sönmüş el fişeğini önüne uzatıyor. Ardından karanlık.
totem.totem_tragedy_4=Bir Vendigo yerde yatan birinin üzerinde yükseliyor ve tüm gücüyle aşağı vuruyor; ezilmiş, kanlı bir yüz bütün görüntüyü kaplıyor.
totem.totem_tragedy_4_ja=Karanlıkta bir Vendigonun uzun, kemikli, pençeli uzuvları yerde yatan birinin üzerinde savruluyor; parçalar uçuşuyor, ardından karanlık, sonra da üzerinde büyük bir M harfi olan koyu renk bir ceketin hareketsiz yakın planı.
totem.totem_death_3=Sırıtan Mike bir çakmağı çakıyor; kıvılcımlar saçılıyor.
totem.totem_hunger_4=Birinin gözlerinden, kan kırmızısı bir ormanda: ışıldayan beyaz bir erkek geyiği kovalıyor ve ona giderek yaklaşıyor.
totem.totem_tragedy_6=Uzun, pençeli eller, çığlık atan Josh'un kafasına kenetleniyor.
totem.totem_fortune_2=Gece, karda, elinde yanan bir fenerle Matt, alttan aydınlatılmış, tahtalarla çakılmış ahşap bir kapının yanında duruyor; dönüp kapıya bir göz atıyor, sonra başını çeviriyor.
totem.totem_death_6=Alnında bir lamba olan Sam, uzun, pençeli bir el çenesini kavrarken çığlık atıyor; ağzından kan akıyor.
totem.totem_hunger_5=Birinin gözlerinden, kırmızı bir ışıkta: görüntü, yerde beyaz ışıldayan uzun saçlı bir kadının üzerine hızla iniyor; kadın dört ayak üstünde kaçmaya çalışıyor, ardından görüntünün hemen altında büzülüyor, bir kolu başının üstünde, öbürü öne savrulmuş.
totem.totem_danger_5=Sıra sıra deri sinema koltuklarının olduğu karanlık bir oda: hemen önde solgun bir Vendigo bir koltuğun arkalığına çömelmiş; ileride bir kapının ardında bir diğeri yerde dört ayak üstünde sürünüyor, üçüncüsü de kapı pervazının arkasından bakıyor. Görüntü dönerken içlerinden biri odanın karşı tarafına atlıyor; ardından karanlık.
totem.totem_fortune_5=Gece dağ evi yanıyor; önünde Ashley karın üstünde büzülmüş oturuyor.
totem.totem_fortune_6=Dağ evinin loş salonunda bir Vendigo, yakından ve arkadan görünen Sam'e, yüzü onun yüzünün hemen yanına gelene dek dört ayak üstünde sinsice yaklaşıyor; Sam kıpırdamıyor. Daha geride, bir lambanın yanında biri hareketsiz duruyor.
totem.totem_hunger_6=Birinin gözlerinden, kırmızı bir ışıkta: uzun, pençeli bir el Josh'u boğazından yakalayıp kaldırıyor; Josh çırpınıyor.
