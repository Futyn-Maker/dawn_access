; Dawn Access totem visions — Danish. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Nat, mellem klipper: Beth, i en grå strikket sweater, braser med ryggen ned på en kampesten, og blod sprøjter ud af hendes mund; så ligger Hannah ubevægelig på stenene med blodigt ansigt og åbne øjne.
totem.totem_guidance_1=En rødkælk lander i sneen mellem birketræer.
totem.totem_tragedy_1=En skikkelse kastes bagud, aftegnet mod en eksplosion af ild; så ligger et forkullet ansigt i røgen med blottede tænder.
totem.totem_guidance_2=Sam, svøbt i et håndklæde, løber med en lommelygte ned ad en mørk gang hen til en elevators gitterlåge med skiltet ELEVATOR, sænker sig så ned i skakten og sidder på hug dernede og kigger ud.
totem.totem_danger_1=I en tåget skov rykker en flok hjorte frem; den forreste hjort, med gevir, kommer helt tæt på og brøler.
totem.totem_fortune_1=Jessica, fuld af rifter og i undertøj, kommer til sig selv på gulvet i et smadret elevatorbur og løfter sig op.
totem.totem_tragedy_2=Jessica falder ned gennem en træafstivet skakt og braser ned på en metalrist; hun ligger på ryggen med hovedet mod os, underkæben revet af.
totem.totem_tragedy_2_ja=Jessica, i undertøj, falder ned gennem en træafstivet skakt og braser ned på en metalrist; hun ligger på ryggen med hovedet mod os, fuld af rifter og blå mærker, munden åben.
totem.totem_death_2=Matt falder gennem mørket; så ligger han stille med blod ved munden.
totem.totem_hunger_1=Gennem nogens øjne, tæt ved jorden i en kold, blå dis: en bleg hånd rækker frem, kravlende hen mod en stendynge med et lille trækors med påskriften BETH.
totem.totem_guidance_3=I et diset blåt lys kravler en gennemblødt mand på alle fire hen ad en klippeafsats forbi en træpæl; bag ham hiver Sam sig op af vandet og op på afsatsen.
totem.totem_guidance_4=Nærbillede: en hånd stryger en rolig grå ulv over hovedet.
totem.totem_fortune_3=I en mine, set ovenfra: Matt, med en lampe i panden, sidder på hug ved et brændende rødt håndblus og kigger op.
totem.totem_hunger_2=Gennem nogens øjne i en træafstivet minegang: billedet slingrer og blinker rødt og gult, en hånd kradser i gulvet, og billedet synker mod jorden.
totem.totem_death_4=I en minegang sparker nogens ben i luften, mens vedkommende hejses op; blodet strømmer ned.
totem.totem_danger_2=Sam, i håndklæde, står i en oplyst døråbning på den anden side af et stort, mørkt rum og lyser rundt med en lommelygte; tæt på beskueren træder nogens ben ind i billedet.
totem.totem_guidance_5=Chris, fortvivlet, presser en pistol ind under sin egen kæbe.
totem.totem_danger_4=Under en træplatform rækker en hånd ned mod en hånd i handske, der strækker sig op; de når ikke hinanden.
totem.totem_guidance_6=Mike, med blod på halsen, skubber til et højt, grønt metalskab; det glider hen langs væggen.
totem.totem_danger_3=I en mine falder Jessica hårdt om på jorden ved siden af Matt; han falder på knæ og bøjer sig over hende.
totem.totem_tragedy_5=En eksplosion af ild; så ligger nogen på maven på gulvet med hovedet vendt mod os og flammer bagved: den lyse jakke svedet, ansigtet forbrændt til råt kød, tænderne blottet.
totem.totem_hunger_3=Gennem nogens øjne, i et rødt skær: op forbi en stige mod en lys åbning, langs minespor og så ind i et blændende lys.
totem.totem_tragedy_3=Snedækket skov om natten, der brænder ild: manden med flammekasteren, set bagfra og kun op til skuldrene, står, mens blodet strømmer ned på sneen under ham, og falder så på knæ; Chris, med et våben i hånden, ser til på afstand.
totem.totem_death_5=Emily, med blottede tænder, bliver skudt i øjet: hovedet slynges bagover, munden gaber, et blodigt hul, hvor øjet var, det andet øje rullet op.
totem.totem_death_5_ja=Blikket går ned forbi en hængende hvid lampeskærm mod et mørkt grusgulv: et skarpt glimt, billedet rykker, så er alt stille.
totem.totem_fortune_4=Mike, forpint, sigter med en pistol direkte mod beskueren, svinger den så væk og vender sig bort uden at skyde.
totem.totem_danger_6=I en smal klippepassage holder en skræmt Emily et brændende rødt håndblus i vejret; det sprutter og går ud, og hun holder det slukkede blus frem foran sig. Så mørke.
totem.totem_tragedy_4=En wendigo rejser sig over nogen, der ligger på jorden, og hamrer ned; et knust, blodigt ansigt fylder billedet.
totem.totem_tragedy_4_ja=I mørket pisker en wendigos lange, knoklede lemmer med kløer hen over nogen, der ligger på jorden; stumper flyver omkring, så mørke, så et stillestående nærbillede af en mørk jakke med et stort bogstav M.
totem.totem_death_3=Mike, med et bredt smil, tænder en lighter; gnister sprøjter ud.
totem.totem_hunger_4=Gennem nogens øjne, i en blodrød skov: vedkommende jager en lysende hvid hjort og kommer tættere og tættere på den.
totem.totem_tragedy_6=Lange hænder med kløer klemmer sig om Joshs hoved, mens han skriger.
totem.totem_fortune_2=Om natten i sneen står Matt, med en tændt lygte i hånden, ved en tilsømmet trædør, der er oplyst nedefra, kaster et blik tilbage på den og ser så væk.
totem.totem_death_6=Sam, med en lampe i panden, skriger, mens en lang hånd med kløer griber om hendes kæbe; blodet løber fra hendes mund.
totem.totem_hunger_5=Gennem nogens øjne, i rødt: billedet dykker ned mod en langhåret, hvidt lysende kvinde på jorden; hun kravler hastigt væk på alle fire og kryber så sammen lige under det, med den ene arm over hovedet og den anden slynget ud.
totem.totem_danger_5=Et mørkt rum med rækker af biografsæder i læder: lige foran sidder en bleg wendigo på hug på et ryglæn; bag en døråbning kravler en anden hen over gulvet på alle fire, og en tredje kigger frem bag dørkarmen. Billedet svinger rundt, idet en af dem springer tværs gennem rummet; så mørke.
totem.totem_fortune_5=Huset brænder om natten; foran det sidder Ashley sammenkrøbet i sneen.
totem.totem_fortune_6=I husets dunkle dagligstue sniger en wendigo sig på alle fire hen mod Sam, set tæt på bagfra, indtil dens ansigt er lige ved siden af hendes; hun rører sig ikke. Længere tilbage står nogen helt stille ved en lampe.
totem.totem_hunger_6=Gennem nogens øjne, i rødt: en lang hånd med kløer griber Josh om halsen og løfter ham, mens han kæmper imod.
