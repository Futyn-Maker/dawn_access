; Dawn Access totem visions — Portuguese. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Noite, entre rochas: a Beth, de camisola de malha cinzenta, embate de costas com força num pedregulho, com sangue a jorrar-lhe da boca; depois, a Hannah jaz imóvel sobre as pedras, com o rosto ensanguentado e os olhos abertos.
totem.totem_guidance_1=Um pisco-de-peito-ruivo pousa na neve entre bétulas.
totem.totem_tragedy_1=Uma figura é projetada para trás, recortada contra uma explosão de fogo; depois, um rosto carbonizado jaz no fumo, de dentes à mostra.
totem.totem_guidance_2=A Sam, enrolada numa toalha, corre com uma lanterna por um corredor escuro até à porta gradeada de um elevador com a placa ELEVATOR, depois desce para dentro do poço e fica lá agachada, a espreitar para fora.
totem.totem_danger_1=Numa floresta enevoada, avança uma manada de veados; o veado de hastes que vai à frente aproxima-se até bem perto e brama.
totem.totem_fortune_1=A Jessica, arranhada e em roupa interior, volta a si no chão da cabina destruída de um elevador e soergue-se.
totem.totem_tragedy_2=A Jessica cai por um poço escorado com madeira e embate numa grelha de metal; jaz de costas, de cabeça virada para nós, com o maxilar inferior arrancado.
totem.totem_tragedy_2_ja=A Jessica, em roupa interior, cai por um poço escorado com madeira e embate numa grelha de metal; jaz de costas, de cabeça virada para nós, de boca aberta, arranhada e cheia de nódoas negras.
totem.totem_death_2=O Matt cai pela escuridão; depois, jaz imóvel, com sangue junto à boca.
totem.totem_hunger_1=Pelos olhos de alguém, rente ao chão, numa névoa azul e fria: uma mão pálida estende-se, a rastejar em direção a um monte de pedras com uma pequena cruz de madeira onde se lê BETH.
totem.totem_guidance_3=Numa luz azul e enevoada, um homem encharcado avança de gatas por uma saliência rochosa, passando por um poste de madeira; atrás dele, a Sam iça-se da água para a saliência.
totem.totem_guidance_4=Em grande plano: uma mão acaricia a cabeça de um lobo cinzento e calmo.
totem.totem_fortune_3=Numa mina, vista de cima: o Matt, com uma lanterna na testa, está agachado junto a uma tocha de sinalização vermelha acesa e olha para cima.
totem.totem_hunger_2=Pelos olhos de alguém, num túnel de mina escorado com madeira: a visão cambaleia e lampeja a vermelho e amarelo, uma mão arranha o chão e a visão afunda-se até ao solo.
totem.totem_death_4=Num túnel de mina, as pernas de alguém agitam-se no ar enquanto é içado; o sangue escorre.
totem.totem_danger_2=A Sam, de toalha, está de pé num vão de porta iluminado, do outro lado de uma sala grande e escura, e ilumina em redor com uma lanterna; perto do espectador, a perna de alguém entra no enquadramento.
totem.totem_guidance_5=O Chris, desesperado, encosta uma pistola por baixo do próprio maxilar.
totem.totem_danger_4=Por baixo de uma plataforma de madeira, uma mão estende-se para baixo em direção a uma mão enluvada que se estica para cima; não se chegam a agarrar.
totem.totem_guidance_6=O Mike, com sangue no pescoço, empurra um cacifo alto, de metal verde; o cacifo desliza ao longo da parede.
totem.totem_danger_3=Numa mina, a Jessica cai com força no chão ao lado do Matt; ele põe-se de joelhos, debruçado sobre ela.
totem.totem_tragedy_5=Uma explosão de fogo; depois, alguém jaz de bruços no chão, com a cabeça virada para nós e chamas atrás: um casaco claro chamuscado, o rosto queimado até à carne viva, os dentes à mostra.
totem.totem_hunger_3=Pelos olhos de alguém, tudo tingido de vermelho: para cima, passando por uma escada, rumo a uma abertura luminosa, ao longo de carris de mina e depois para dentro de uma luz ofuscante.
totem.totem_tragedy_3=Floresta coberta de neve, de noite, com fogo a arder: o homem do lança-chamas, visto de costas e só até aos ombros, está de pé enquanto o sangue jorra para a neve por baixo dele, e depois cai de joelhos; o Chris, de arma na mão, observa ao longe.
totem.totem_death_5=A Emily, de dentes à mostra, leva um tiro no olho: a cabeça é projetada para trás, a boca escancarada, um buraco ensanguentado no lugar do olho, o outro olho revirado.
totem.totem_death_5_ja=Vista de cima, passando por um abajur branco pendurado, sobre um chão escuro de gravilha: um clarão intenso, a imagem estremece e depois fica tudo imóvel.
totem.totem_fortune_4=O Mike, angustiado, aponta uma pistola diretamente ao espectador, depois desvia-a e vira-se para o lado sem disparar.
totem.totem_danger_6=Numa passagem estreita na rocha, a Emily, assustada, ergue uma tocha de sinalização vermelha acesa; a tocha crepita até se apagar, e ela estende-a à sua frente, já apagada. Depois, escuridão.
totem.totem_tragedy_4=Um Wendigo ergue-se sobre alguém deitado no chão e abate-se com força; um rosto esmagado e ensanguentado enche a imagem.
totem.totem_tragedy_4_ja=No escuro, os membros compridos, ossudos e com garras de um Wendigo desferem golpes por cima de alguém deitado no chão; voam detritos, depois escuridão, depois um grande plano fixo de um casaco escuro com uma grande letra M.
totem.totem_death_3=O Mike, de sorriso rasgado, acende um isqueiro; saltam faíscas.
totem.totem_hunger_4=Pelos olhos de alguém, numa floresta vermelho-sangue: persegue um veado branco e luminoso e fica cada vez mais perto dele.
totem.totem_tragedy_6=Mãos compridas e com garras fecham-se sobre a cabeça do Josh, que grita.
totem.totem_fortune_2=De noite, na neve, o Matt, com um lampião aceso na mão, está junto a uma porta de madeira tapada com tábuas, iluminada por baixo, olha de relance para trás, para ela, e depois desvia o olhar.
totem.totem_death_6=A Sam, com uma lanterna na testa, grita enquanto uma mão comprida e com garras lhe agarra o maxilar; o sangue escorre-lhe da boca.
totem.totem_hunger_5=Pelos olhos de alguém, em vermelho: a visão desce a pique sobre uma mulher de cabelo comprido, de um branco luminoso, no chão; ela foge de gatas e depois encolhe-se por baixo da visão, com um braço sobre a cabeça e o outro estendido.
totem.totem_danger_5=Uma sala escura com filas de cadeirões de cinema em pele: mesmo à frente, um Wendigo pálido está agachado no encosto de um cadeirão; para lá de uma porta, outro rasteja de gatas pelo chão, e um terceiro espreita pela ombreira. A imagem roda enquanto um deles salta pela sala; depois, escuridão.
totem.totem_fortune_5=A cabana arde de noite; diante dela, a Ashley está sentada na neve, encolhida.
totem.totem_fortune_6=Na sala de estar mal iluminada da cabana, um Wendigo avança de gatas, sorrateiro, em direção à Sam, vista de perto e de costas, até a cara dele ficar mesmo ao lado da dela; ela não se mexe. Mais atrás, alguém está de pé, imóvel, junto a um candeeiro.
totem.totem_hunger_6=Pelos olhos de alguém, em vermelho: uma mão comprida e com garras agarra o Josh pela garganta e levanta-o, enquanto ele se debate.
