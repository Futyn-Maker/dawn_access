; Dawn Access totem visions — Portuguese (Brazil). One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Noite, entre rochas: Beth, de suéter cinza de tricô, despenca de costas sobre um rochedo, com sangue espirrando da boca; depois Hannah jaz imóvel sobre as pedras, o rosto ensanguentado, os olhos abertos.
totem.totem_guidance_1=Um tordo pousa na neve entre bétulas.
totem.totem_tragedy_1=Uma figura é arremessada para trás diante de uma explosão de fogo; depois, em meio à fumaça, um rosto carbonizado, de dentes à mostra.
totem.totem_guidance_2=Sam, enrolada em uma toalha, corre com uma lanterna por um corredor escuro até a grade de um elevador com a placa ELEVATOR, depois desce para dentro do poço e se agacha ali, espiando para fora.
totem.totem_danger_1=Em uma floresta enevoada, uma manada de cervos avança; o cervo com galhada que vai à frente chega bem perto e brama.
totem.totem_fortune_1=Jessica, arranhada e de roupa íntima, volta a si no chão de uma gaiola de elevador destruída e ergue o corpo.
totem.totem_tragedy_2=Jessica cai por um poço escorado com madeira e se espatifa sobre uma grade de metal; jaz de costas, com a cabeça voltada para o espectador, a mandíbula inferior arrancada.
totem.totem_tragedy_2_ja=Jessica, de roupa íntima, cai por um poço escorado com madeira e se espatifa sobre uma grade de metal; jaz de costas, com a cabeça voltada para o espectador, a boca aberta, cheia de arranhões e hematomas.
totem.totem_death_2=Matt cai na escuridão; depois jaz imóvel, com sangue na boca.
totem.totem_hunger_1=Pelos olhos de alguém, rente ao chão, em um borrão azul e frio: uma mão pálida se estende à frente, rastejando em direção a um monte de pedras com uma pequena cruz de madeira onde está escrito BETH.
totem.totem_guidance_3=Em uma luz azul e enevoada, um homem encharcado avança de quatro por uma saliência rochosa, passando por um poste de madeira; atrás dele, Sam se puxa para fora da água e sobe na saliência.
totem.totem_guidance_4=De perto: uma mão acaricia a cabeça de um lobo cinzento e calmo.
totem.totem_fortune_3=Em uma mina, vista de cima: Matt, com uma lanterna na testa, está agachado junto a um sinalizador de mão vermelho aceso e olha para cima.
totem.totem_hunger_2=Pelos olhos de alguém, em um túnel de mina escorado com madeira: a visão cambaleia e lampeja em vermelho e amarelo, uma mão arranha a terra, e a visão desaba até o chão.
totem.totem_death_4=Em um túnel de mina, as pernas de alguém chutam o ar enquanto a pessoa é içada; o sangue escorre.
totem.totem_danger_2=Sam, de toalha, está parada no vão iluminado de uma porta do outro lado de uma grande sala escura e passa o facho de uma lanterna ao redor; bem perto do espectador, a perna de alguém entra em cena.
totem.totem_guidance_5=Chris, transtornado, pressiona uma pistola sob o próprio queixo.
totem.totem_danger_4=Sob uma plataforma de madeira, uma mão desce em direção a uma mão enluvada que se estica para cima; elas não se alcançam.
totem.totem_guidance_6=Mike, com sangue no pescoço, empurra com força um armário de metal alto e verde; ele desliza ao longo da parede.
totem.totem_danger_3=Em uma mina, Jessica cai com força no chão ao lado de Matt; ele cai de joelhos e se debruça sobre ela.
totem.totem_tragedy_5=Uma explosão de fogo; depois alguém jaz de bruços no chão, a cabeça virada para nós, chamas atrás: a jaqueta clara chamuscada, o rosto queimado até a carne viva, os dentes à mostra.
totem.totem_hunger_3=Pelos olhos de alguém, em tons de vermelho: subindo, passando por uma escada de mão, rumo a uma abertura iluminada, seguindo trilhos de mina e depois entrando em uma luz ofuscante.
totem.totem_tragedy_3=Floresta nevada à noite, chamas ardendo: o homem do lança-chamas, visto de costas e só até os ombros, está de pé enquanto o sangue escorre na neve sob ele, e então cai de joelhos; Chris, de arma na mão, observa de longe.
totem.totem_death_5=Emily, de dentes à mostra, leva um tiro no olho: a cabeça é jogada para trás, a boca escancarada, um buraco ensanguentado no lugar do olho, o outro olho revirado.
totem.totem_death_5_ja=Olhando para baixo, passando por uma cúpula de luminária branca pendurada, para um chão escuro de cascalho: um clarão forte, a imagem dá um solavanco e depois tudo fica imóvel.
totem.totem_fortune_4=Mike, angustiado, aponta uma pistola diretamente para o espectador, depois a desvia e se vira para o lado sem atirar.
totem.totem_danger_6=Em uma passagem estreita na rocha, uma Emily assustada ergue um sinalizador de mão vermelho aceso; ele crepita e se apaga, e ela estende à sua frente o sinalizador apagado. Depois, escuridão.
totem.totem_tragedy_4=Um wendigo se ergue sobre alguém caído no chão e desfere um golpe; um rosto esmagado e ensanguentado ocupa toda a imagem.
totem.totem_tragedy_4_ja=No escuro, os membros longos, ossudos e com garras de um wendigo chicoteiam o ar sobre alguém caído no chão; destroços voam, depois escuridão, depois um primeiro plano fixo de uma jaqueta escura com uma grande letra M.
totem.totem_death_3=Mike, com um sorriso largo, aciona um isqueiro; saltam faíscas.
totem.totem_hunger_4=Pelos olhos de alguém, em uma floresta vermelho-sangue: perseguindo um cervo de um branco luminoso e chegando cada vez mais perto dele.
totem.totem_tragedy_6=Mãos compridas, com garras, se fecham sobre a cabeça de Josh enquanto ele grita.
totem.totem_fortune_2=À noite, na neve, Matt, com um lampião aceso na mão, está junto a uma porta de madeira com tábuas pregadas, iluminada de baixo, se vira para olhá-la e depois desvia o olhar.
totem.totem_death_6=Sam, com uma lanterna na testa, grita enquanto uma mão comprida, com garras, lhe agarra a mandíbula; sangue escorre da boca dela.
totem.totem_hunger_5=Pelos olhos de alguém, em vermelho: a visão mergulha sobre uma mulher de cabelos longos, de um branco luminoso, no chão; ela tenta fugir de quatro, depois se encolhe logo abaixo da visão, um braço sobre a cabeça, o outro estendido.
totem.totem_danger_5=Uma sala escura com fileiras de poltronas de cinema de couro: bem à frente, um wendigo pálido está agachado no encosto de uma poltrona; além de uma porta, outro rasteja de quatro pelo chão, e um terceiro espia pelo batente. A imagem gira enquanto um deles salta pela sala; depois, escuridão.
totem.totem_fortune_5=O chalé arde à noite; diante dele, Ashley está sentada na neve, encolhida.
totem.totem_fortune_6=Na penumbra da sala de estar do chalé, um wendigo avança de quatro em direção a Sam, vista de perto e de costas, até que o rosto dele fica bem ao lado do dela; ela não se mexe. Mais atrás, alguém está parado, imóvel, junto a uma luminária.
totem.totem_hunger_6=Pelos olhos de alguém, em vermelho: uma mão comprida, com garras, agarra Josh pela garganta e o ergue enquanto ele se debate.
