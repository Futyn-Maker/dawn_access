; Dawn Access totem visions — Norwegian. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Natt, blant steiner: Beth, i en grå strikkegenser, smeller ned på en kampestein med ryggen først, og blod spruter fra munnen hennes; så ligger Hannah urørlig på steinene med blodig ansikt og åpne øyne.
totem.totem_guidance_1=En rødstrupe lander i snøen blant bjørketrær.
totem.totem_tragedy_1=En skikkelse kastes bakover, avtegnet mot en eksplosjon av ild; så ligger et forkullet ansikt i røyken, med blottede tenner.
totem.totem_guidance_2=Sam, svøpt i et håndkle, løper med en lommelykt bortover en mørk korridor til en heisgrind merket ELEVATOR, senker seg så ned i sjakten, der hun sitter på huk og kikker ut.
totem.totem_danger_1=I en tåkete skog rykker en hjorteflokk fram; den fremste hjorten, med gevir, kommer helt nær og brøler.
totem.totem_fortune_1=Jessica, full av riper og i undertøyet, kommer til seg selv på gulvet i et knust heisbur og løfter seg opp.
totem.totem_tragedy_2=Jessica faller ned gjennom en tømmeravstivet sjakt og smeller ned på en metallrist; hun ligger på ryggen, med hodet mot oss og underkjeven revet av.
totem.totem_tragedy_2_ja=Jessica, i undertøyet, faller ned gjennom en tømmeravstivet sjakt og smeller ned på en metallrist; hun ligger på ryggen med hodet mot oss, full av riper og blåmerker, med munnen åpen.
totem.totem_death_2=Matt faller gjennom mørket; så ligger han urørlig, med blod ved munnen.
totem.totem_hunger_1=Gjennom noens øyne, lavt ved bakken i et kaldt, blått slør: en blek hånd strekker seg fram, krypende mot en steinhaug med et lite trekors merket BETH.
totem.totem_guidance_3=I et disig blått lys kryper en gjennomvåt mann på alle fire langs en steinete avsats forbi en trestolpe; bak ham drar Sam seg opp av vannet og opp på avsatsen.
totem.totem_guidance_4=Nærbilde: en hånd stryker en rolig grå ulv over hodet.
totem.totem_fortune_3=I en gruve, sett ovenfra: Matt, med en lykt i pannen, sitter på huk ved et brennende rødt håndbluss og ser opp.
totem.totem_hunger_2=Gjennom noens øyne i en tømmeravstivet gruvegang: bildet krenger og blinker rødt og gult, en hånd klorer i gulvet, og bildet synker mot bakken.
totem.totem_death_4=I en gruvegang spreller noens bein i luften mens vedkommende heises opp; blod strømmer ned.
totem.totem_danger_2=Sam, i håndkle, står i en opplyst døråpning i den andre enden av et stort, mørkt rom og lyser rundt med en lommelykt; tett ved betrakteren trer noens bein inn i bildet.
totem.totem_guidance_5=Chris, fortvilet, presser en pistol inn under sin egen kjeve.
totem.totem_danger_4=Under en treplattform strekker en hånd seg ned mot en hånd i hanske som strekker seg opp; de når ikke hverandre.
totem.totem_guidance_6=Mike, med blod på halsen, dytter et høyt, grønt metallskap; det glir langs veggen.
totem.totem_danger_3=I en gruve faller Jessica hardt i bakken ved siden av Matt; han kaster seg ned på kne over henne.
totem.totem_tragedy_5=En eksplosjon av ild; så ligger noen på magen på gulvet med hodet vendt mot oss og flammer bak: den lyse jakken svidd, ansiktet brent til rått kjøtt, tennene blottet.
totem.totem_hunger_3=Gjennom noens øyne, i et rødt skjær: opp forbi en stige mot en lys åpning, langs gruveskinner og så inn i et blendende lys.
totem.totem_tragedy_3=Snødekt skog om natten, ild brenner: mannen med flammekasteren, sett bakfra og bare opp til skuldrene, står mens blod strømmer ned på snøen under ham, og faller så på kne; Chris, med et våpen i hånden, ser på fra avstand.
totem.totem_death_5=Emily, med blottede tenner, blir skutt i øyet: hodet hennes kastes bakover, munnen på vidt gap, et blodig hull der øyet var, det andre øyet rullet oppover.
totem.totem_death_5_ja=Et blikk ned forbi en hengende hvit lampeskjerm mot et mørkt grusgulv: et sterkt glimt, bildet rykker til, så er alt stille.
totem.totem_fortune_4=Mike, forpint, sikter med en pistol rett mot betrakteren, svinger den så bort og snur seg vekk uten å skyte.
totem.totem_danger_6=I en smal passasje i fjellet holder en redd Emily opp et brennende rødt håndbluss; det freser og slokner, og hun holder det sloknede blusset fram foran seg. Så mørke.
totem.totem_tragedy_4=En wendigo reiser seg over noen som ligger på bakken, og slår ned med full kraft; et knust, blodig ansikt fyller bildet.
totem.totem_tragedy_4_ja=I mørket pisker en wendigos lange, knoklete lemmer med klør over noen som ligger på bakken; rusk fyker, så mørke, så et stillestående nærbilde av en mørk jakke med en stor bokstav M.
totem.totem_death_3=Mike, glisende, knipser på en lighter; gnister spruter.
totem.totem_hunger_4=Gjennom noens øyne, i en blodrød skog: vedkommende jager en lysende hvit hjort og kommer stadig nærmere den.
totem.totem_tragedy_6=Lange hender med klør klemmer seg om hodet til Josh mens han skriker.
totem.totem_fortune_2=Om natten i snøen står Matt, med en tent lanterne i hånden, ved en gjenspikret tredør som er opplyst nedenfra, kaster et blikk tilbake på den og ser så bort.
totem.totem_death_6=Sam, med en lykt i pannen, skriker mens en lang hånd med klør griper henne om kjeven; blodet renner fra munnen hennes.
totem.totem_hunger_5=Gjennom noens øyne, i rødt: bildet stuper ned mot en hvitt lysende, langhåret kvinne på bakken; hun kravler fort unna på alle fire og kryper så sammen under det, med den ene armen over hodet og den andre slengt ut.
totem.totem_danger_5=Et mørkt rom med rader av kinostoler i skinn: rett foran sitter en blek wendigo på huk på en stolrygg; bak en døråpning kryper en annen på alle fire over gulvet, og en tredje titter fram bak dørkarmen. Bildet svinger rundt idet en av dem hopper tvers over rommet; så mørke.
totem.totem_fortune_5=Hytta brenner om natten; foran den sitter Ashley sammenkrøket i snøen.
totem.totem_fortune_6=I den dunkle stuen i hytta sniker en wendigo seg på alle fire mot Sam, sett tett på bakfra, til ansiktet dens er rett ved siden av hennes; hun rører seg ikke. Lenger bak står noen stille ved en lampe.
totem.totem_hunger_6=Gjennom noens øyne, i rødt: en lang hånd med klør griper Josh om strupen og løfter ham mens han spreller.
