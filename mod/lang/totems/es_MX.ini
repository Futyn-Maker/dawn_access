; Dawn Access totem visions — Spanish (Latin America). One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Noche, entre rocas: Beth, con un suéter gris tejido, se estrella de espaldas contra un peñasco, con la sangre saliéndole a chorros de la boca; luego Hannah yace inmóvil sobre las piedras, la cara ensangrentada, los ojos abiertos.
totem.totem_guidance_1=Un petirrojo se posa en la nieve entre abedules.
totem.totem_tragedy_1=Una figura sale despedida hacia atrás frente a una explosión de llamas; luego, entre el humo, un rostro calcinado con los dientes al descubierto.
totem.totem_guidance_2=Sam, envuelta en una toalla, corre con una linterna por un pasillo oscuro hasta la reja de un elevador con el letrero ELEVATOR, luego se descuelga al cubo y se agacha ahí, asomándose.
totem.totem_danger_1=En un bosque con neblina avanza una manada de ciervos; el ciervo con cornamenta que va al frente se acerca muchísimo y brama.
totem.totem_fortune_1=Jessica, arañada y en ropa interior, vuelve en sí en el piso de una jaula de elevador destrozada y se incorpora.
totem.totem_tragedy_2=Jessica cae por un pozo apuntalado con madera y se estrella contra una rejilla metálica; yace boca arriba, la cabeza hacia el espectador, la mandíbula inferior arrancada.
totem.totem_tragedy_2_ja=Jessica, en ropa interior, cae por un pozo apuntalado con madera y se estrella contra una rejilla metálica; yace boca arriba, la cabeza hacia el espectador, la boca abierta, llena de rasguños y moretones.
totem.totem_death_2=Matt cae en la oscuridad; luego yace inmóvil, con sangre en la boca.
totem.totem_hunger_1=A través de los ojos de alguien, a ras del suelo, en un azul frío y borroso: una mano pálida se estira hacia adelante, arrastrándose hacia un montón de piedras coronado por una pequeña cruz de madera con la inscripción BETH.
totem.totem_guidance_3=Bajo una luz azul neblinosa, un hombre empapado avanza a gatas por una cornisa rocosa, pasando junto a un poste de madera; detrás de él, Sam sale del agua y se sube a la cornisa.
totem.totem_guidance_4=Primer plano: una mano acaricia la cabeza de un lobo gris tranquilo.
totem.totem_fortune_3=En una mina, visto desde arriba: Matt, con una linterna en la frente, está en cuclillas junto a una bengala roja encendida y mira hacia arriba.
totem.totem_hunger_2=A través de los ojos de alguien, en un túnel de mina apuntalado con madera: la vista se tambalea y destella en rojo y amarillo, una mano araña la tierra y la vista se desploma hasta el suelo.
totem.totem_death_4=En un túnel de mina, las piernas de alguien patalean en el aire mientras lo izan; la sangre chorrea.
totem.totem_danger_2=Sam, en toalla, está en el umbral iluminado de una puerta al otro lado de una gran habitación a oscuras y alumbra a su alrededor con una linterna; muy cerca del espectador, la pierna de alguien entra en cuadro.
totem.totem_guidance_5=Chris, desesperado, se presiona una pistola bajo la mandíbula.
totem.totem_danger_4=Bajo una plataforma de madera, una mano baja hacia una mano enguantada que se estira hacia arriba; no alcanzan a agarrarse.
totem.totem_guidance_6=Mike, con sangre en el cuello, empuja con fuerza un casillero metálico, alto y verde; se desliza a lo largo de la pared.
totem.totem_danger_3=En una mina, Jessica cae pesadamente al suelo junto a Matt; él se arrodilla y se inclina sobre ella.
totem.totem_tragedy_5=Una explosión de llamas; luego alguien yace boca abajo en el piso, con la cabeza vuelta hacia nosotros y llamas detrás: una chamarra clara chamuscada, la cara quemada hasta la carne viva, los dientes al descubierto.
totem.totem_hunger_3=A través de los ojos de alguien, todo teñido de rojo: sube dejando atrás una escalera de mano hacia una abertura luminosa, recorre unos rieles de mina y luego entra en una luz cegadora.
totem.totem_tragedy_3=Bosque nevado de noche, con fuegos encendidos: el hombre del lanzallamas, visto de espaldas y solo hasta los hombros, permanece de pie mientras la sangre se derrama sobre la nieve bajo él, y luego cae de rodillas; Chris, con el arma en la mano, observa desde lejos.
totem.totem_death_5=Emily, con los dientes al descubierto, recibe un disparo en el ojo: la cabeza se le va hacia atrás de golpe, la boca abierta de par en par, un agujero ensangrentado en lugar del ojo, el otro ojo en blanco.
totem.totem_death_5_ja=La mirada baja, pasando junto a una pantalla de lámpara blanca que cuelga, hasta un piso oscuro de grava: un destello intenso, la imagen se sacude y luego todo queda inmóvil.
totem.totem_fortune_4=Mike, angustiado, apunta con una pistola directamente al espectador, luego la aparta y voltea hacia otro lado sin disparar.
totem.totem_danger_6=En un estrecho pasadizo de roca, una Emily asustada sostiene en alto una bengala roja encendida; chisporrotea y se apaga, y ella extiende frente a sí la bengala apagada. Luego, oscuridad.
totem.totem_tragedy_4=Un Wendigo se yergue sobre alguien tendido en el suelo y descarga un golpe; un rostro aplastado y ensangrentado llena la imagen.
totem.totem_tragedy_4_ja=En la oscuridad, las extremidades largas, huesudas y con garras de un Wendigo azotan el aire sobre alguien tendido en el suelo; vuelan escombros, luego oscuridad y luego un primer plano fijo de una chamarra oscura con una gran letra M.
totem.totem_death_3=Mike, con una amplia sonrisa, enciende un mechero; saltan chispas.
totem.totem_hunger_4=A través de los ojos de alguien, en un bosque rojo sangre: persigue a un ciervo de un blanco luminoso y se le acerca cada vez más.
totem.totem_tragedy_6=Unas largas manos con garras se cierran sobre la cabeza de Josh mientras él grita.
totem.totem_fortune_2=De noche, en la nieve, Matt, con un farol encendido en la mano, está junto a una puerta de madera cerrada con tablones, iluminada desde abajo, voltea a mirarla y luego desvía la mirada.
totem.totem_death_6=Sam, con una linterna en la frente, grita mientras una larga mano con garras le agarra la mandíbula; le sale sangre de la boca.
totem.totem_hunger_5=A través de los ojos de alguien, en rojo: la vista se abalanza en picada sobre una mujer de cabello largo, de un blanco luminoso, en el suelo; ella se escabulle a gatas y luego se acurruca justo bajo la mirada, con un brazo sobre la cabeza y el otro extendido.
totem.totem_danger_5=Una sala oscura con filas de butacas de cine de cuero: justo enfrente, un Wendigo pálido está agazapado sobre un respaldo; tras una puerta, otro se arrastra a gatas por el piso y un tercero se asoma por el marco. La imagen gira mientras uno de ellos cruza la sala de un salto; luego, oscuridad.
totem.totem_fortune_5=El refugio arde de noche; frente a él, Ashley está sentada en la nieve, encorvada.
totem.totem_fortune_6=En la sala en penumbra del refugio, un Wendigo avanza a gatas hacia Sam, vista de cerca y de espaldas, hasta que su cara queda justo al lado de la de ella; Sam no se mueve. Más atrás, alguien permanece inmóvil junto a una lámpara.
totem.totem_hunger_6=A través de los ojos de alguien, en rojo: una larga mano con garras agarra a Josh por la garganta y lo levanta mientras forcejea.
