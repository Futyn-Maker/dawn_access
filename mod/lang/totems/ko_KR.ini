; Dawn Access totem visions — Korean. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=밤, 바위 사이: 회색 니트 스웨터를 입은 베스가 등부터 큰 바위에 세차게 부딪히고, 입에서 피가 뿜어져 나온다. 이어서 해나가 돌 위에 꼼짝 않고 누워 있다. 얼굴은 피투성이, 눈은 뜬 채다.
totem.totem_guidance_1=울새 한 마리가 자작나무 사이의 눈 위에 내려앉는다.
totem.totem_tragedy_1=화염 폭발을 배경으로 한 형체가 뒤로 튕겨 나간다. 이어서 연기 속에 새까맣게 탄 얼굴이 이를 드러낸 채 누워 있다.
totem.totem_guidance_2=타월을 두른 샘이 손전등을 들고 어두운 복도를 달려 ELEVATOR라고 적힌 승강기 철창문으로 간다. 그러고는 승강기 통로 안으로 내려가 웅크린 채 밖을 내다본다.
totem.totem_danger_1=안개 낀 숲에서 사슴 무리가 다가온다. 맨 앞의 뿔 달린 수사슴이 바로 앞까지 와서 울부짖는다.
totem.totem_fortune_1=긁힌 자국투성이에 속옷 차림인 제시카가 부서진 승강기 칸 바닥에서 정신을 차리고 몸을 일으킨다.
totem.totem_tragedy_2=제시카가 나무 버팀목을 댄 수직 갱도로 떨어져 금속 격자 위에 처박힌다. 머리를 이쪽으로 둔 채 등을 대고 누워 있고, 아래턱이 뜯겨 나가 있다.
totem.totem_tragedy_2_ja=속옷 차림의 제시카가 나무 버팀목을 댄 수직 갱도로 떨어져 금속 격자 위에 처박힌다. 머리를 이쪽으로 둔 채 등을 대고 누워 있다. 입은 벌어져 있고, 온몸이 긁히고 멍들어 있다.
totem.totem_death_2=매트가 어둠 속으로 떨어진다. 이어서 입가에 피를 묻힌 채 꼼짝 않고 누워 있다.
totem.totem_hunger_1=누군가의 눈으로, 땅바닥 가까이, 차갑고 푸르게 흐릿한 시야 속에서: 창백한 손이 앞으로 뻗으며, BETH라고 적힌 작은 나무 십자가가 꽂힌 돌무더기를 향해 기어간다.
totem.totem_guidance_3=안개 낀 푸른 빛 속에서 흠뻑 젖은 남자가 바위 턱을 따라 네 발로 기어 나무 기둥 옆을 지나간다. 그 뒤에서 샘이 물에서 바위 턱 위로 몸을 끌어 올린다.
totem.totem_guidance_4=클로즈업: 한 손이 차분한 회색 늑대의 머리를 쓰다듬는다.
totem.totem_fortune_3=광산, 위에서 내려다본 모습: 이마에 램프를 단 매트가 타오르는 빨간 조명탄 옆에 쪼그려 앉아 위를 올려다본다.
totem.totem_hunger_2=누군가의 눈으로, 나무 버팀목을 댄 광산 터널에서: 시야가 휘청이며 빨갛고 노랗게 번쩍이고, 한 손이 바닥을 할퀴고, 시야가 땅으로 가라앉는다.
totem.totem_death_4=광산 터널에서 위로 끌려 올라가는 누군가의 다리가 허공에서 버둥거린다. 피가 줄줄 흘러내린다.
totem.totem_danger_2=타월을 두른 샘이 크고 어두운 방 건너편의 불 켜진 출입구에 서서 손전등으로 주위를 비춘다. 이쪽 바로 가까이에서 누군가의 다리가 화면 안으로 들어선다.
totem.totem_guidance_5=절망에 빠진 크리스가 권총을 자기 턱 밑에 갖다 댄다.
totem.totem_danger_4=나무 발판 아래에서 한 손이 아래로 뻗어, 위로 뻗은 장갑 낀 손을 향한다. 두 손은 엇갈린다.
totem.totem_guidance_6=목에 피가 묻은 마이크가 키 큰 초록색 금속 사물함을 민다. 사물함이 벽을 따라 미끄러진다.
totem.totem_danger_3=광산에서 제시카가 매트 옆 바닥에 털썩 쓰러진다. 매트가 무릎을 꿇고 그녀 위로 몸을 숙인다.
totem.totem_tragedy_5=화염 폭발. 이어서 누군가 머리를 이쪽으로 돌린 채 바닥에 엎드려 누워 있고, 뒤에서는 불길이 치솟는다. 밝은색 재킷은 그을렸고, 얼굴은 벌겋게 타서 살이 드러났으며, 이가 드러나 있다.
totem.totem_hunger_3=누군가의 눈으로, 붉게 물든 채: 사다리 옆을 지나 환하게 뚫린 곳을 향해 위로, 광산 레일을 따라, 그리고 눈부신 빛 속으로.
totem.totem_tragedy_3=밤의 눈 덮인 숲, 불길이 타오른다: 뒷모습으로 어깨 아래만 보이는 화염방사기를 든 남자가 서 있고, 그 발밑 눈 위로 피가 쏟아진다. 이어서 남자는 무릎을 꿇는다. 총을 든 크리스가 멀리서 지켜본다.
totem.totem_death_5=이를 드러낸 에밀리가 눈에 총을 맞는다. 고개가 뒤로 확 젖혀지고, 입은 쩍 벌어져 있다. 눈이 있던 자리에는 피투성이 구멍이 뚫려 있고, 다른 쪽 눈은 위로 뒤집혀 있다.
totem.totem_death_5_ja=매달린 하얀 전등갓 옆으로 어두운 자갈 바닥을 내려다보는 시점: 밝은 섬광이 번쩍이고, 화면이 흔들린 뒤, 모든 것이 멈춘다.
totem.totem_fortune_4=괴로운 얼굴의 마이크가 권총을 이쪽으로 똑바로 겨누다가, 총을 옆으로 돌리고 쏘지 않은 채 외면한다.
totem.totem_danger_6=좁은 바위 통로에서 겁에 질린 에밀리가 타오르는 빨간 조명탄을 들어 올린다. 조명탄이 지직거리다 꺼지고, 그녀는 꺼진 조명탄을 앞으로 내민다. 이어서 어둠.
totem.totem_tragedy_4=웬디고가 땅에 누워 있는 누군가 위로 몸을 치켜세우고 세게 내리친다. 짓뭉개진 피투성이 얼굴이 화면을 가득 채운다.
totem.totem_tragedy_4_ja=어둠 속에서 웬디고의 길고 앙상한, 갈고리 발톱이 달린 팔다리가 땅에 누운 누군가의 위에서 마구 휘둘러진다. 파편이 튀고, 이어서 어둠, 그다음 커다란 M 글자가 있는 어두운 색 재킷의 정지된 클로즈업.
totem.totem_death_3=씩 웃는 마이크가 라이터를 딸깍 켠다. 불꽃이 확 튄다.
totem.totem_hunger_4=누군가의 눈으로, 핏빛 숲에서: 빛나는 하얀 수사슴을 쫓으며 점점 거리를 좁힌다.
totem.totem_tragedy_6=갈고리 발톱이 달린 긴 두 손이 비명을 지르는 조쉬의 머리를 움켜쥔다.
totem.totem_fortune_2=밤, 눈 속에서 불 켜진 랜턴을 손에 든 매트가 아래에서 빛이 비치는, 판자로 막은 나무 문 옆에 서 있다. 그 문을 힐끗 돌아보고는 시선을 돌린다.
totem.totem_death_6=이마에 램프를 단 샘이 갈고리 발톱이 달린 긴 손에 턱을 붙잡힌 채 비명을 지른다. 입에서 피가 흐른다.
totem.totem_hunger_5=누군가의 눈으로, 붉게 물든 채: 시야가 땅 위에서 하얗게 빛나는 긴 머리의 여자를 향해 급강하한다. 여자는 네 발로 기어 달아나려다가, 시야 바로 아래에서 몸을 웅크린다. 한 팔로 머리를 감싸고, 다른 팔은 내뻗은 채다.
totem.totem_danger_5=가죽 영화관 좌석이 줄지어 놓인 어두운 방. 바로 앞에서 창백한 웬디고가 좌석 등받이 위에 웅크리고 있다. 안쪽 문 너머로 또 한 마리가 네 발로 바닥을 기어가고, 세 번째가 문틀 뒤에서 내다본다. 시야가 휙 돌며 그중 하나가 방을 가로질러 도약한다. 이어서 어둠.
totem.totem_fortune_5=밤에 산장이 불타고 있다. 그 앞 눈밭에 애슐리가 웅크린 채 앉아 있다.
totem.totem_fortune_6=산장의 어둑한 거실에서 웬디고가 네 발로 샘에게 살금살금 다가가, 마침내 그 얼굴이 샘의 얼굴 바로 옆까지 온다. 샘은 가까이서 뒷모습으로 보이며, 꼼짝하지 않는다. 더 뒤쪽에서는 누군가 램프 옆에 가만히 서 있다.
totem.totem_hunger_6=누군가의 눈으로, 붉게 물든 채: 갈고리 발톱이 달린 긴 손이 조쉬의 목을 움켜쥐고, 몸부림치는 그를 들어 올린다.
