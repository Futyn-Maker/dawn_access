; Dawn Access totem visions — French. One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Nuit, parmi les rochers : Beth, en pull tricoté gris, s'écrase de dos sur un bloc rocheux, le sang giclant de sa bouche ; puis Hannah gît immobile sur les pierres, le visage ensanglanté, les yeux ouverts.
totem.totem_guidance_1=Un rouge-gorge se pose dans la neige parmi des bouleaux.
totem.totem_tragedy_1=Une silhouette est projetée en arrière devant une explosion de flammes ; puis, dans la fumée, un visage carbonisé, les dents à nu.
totem.totem_guidance_2=Sam, enroulée dans une serviette, court avec une lampe torche le long d'un couloir sombre jusqu'à une grille d'ascenseur marquée ELEVATOR, puis se laisse descendre dans la cage et s'y accroupit en regardant au-dehors.
totem.totem_danger_1=Dans une forêt brumeuse, un troupeau de cerfs avance ; le cerf de tête, avec ses bois, s'approche tout près et brame.
totem.totem_fortune_1=Jessica, couverte d'égratignures et en sous-vêtements, reprend connaissance sur le plancher d'une cabine d'ascenseur détruite et se redresse.
totem.totem_tragedy_2=Jessica tombe dans un puits étayé de bois et s'écrase sur une grille métallique ; elle gît sur le dos, la tête vers le spectateur, la mâchoire inférieure arrachée.
totem.totem_tragedy_2_ja=Jessica, en sous-vêtements, tombe dans un puits étayé de bois et s'écrase sur une grille métallique ; elle gît sur le dos, la tête vers le spectateur, la bouche ouverte, couverte d'égratignures et d'ecchymoses.
totem.totem_death_2=Matt chute dans l'obscurité ; puis il gît immobile, du sang à la bouche.
totem.totem_hunger_1=À travers les yeux de quelqu'un, au ras du sol, dans un flou d'un bleu froid : une main pâle se tend en avant, on rampe vers un tas de pierres où se dresse une petite croix de bois marquée BETH.
totem.totem_guidance_3=Dans une lumière bleue et brumeuse, un homme trempé avance à quatre pattes sur une corniche rocheuse et passe devant un poteau en bois ; derrière lui, Sam se hisse hors de l'eau sur la corniche.
totem.totem_guidance_4=En gros plan : une main caresse la tête d'un loup gris paisible.
totem.totem_fortune_3=Dans une mine, vu d'en haut : Matt, une lampe au front, est accroupi près d'un feu de Bengale rouge allumé et lève les yeux.
totem.totem_hunger_2=À travers les yeux de quelqu'un, dans un tunnel de mine étayé de bois : la vue tangue, traversée d'éclairs rouges et jaunes, une main griffe le sol, et la vue s'affaisse jusqu'à terre.
totem.totem_death_4=Dans un tunnel de mine, les jambes de quelqu'un battent l'air tandis qu'il est hissé vers le haut ; du sang ruisselle.
totem.totem_danger_2=Sam, en serviette, se tient dans l'embrasure éclairée d'une porte, de l'autre côté d'une grande pièce obscure, et balaie les alentours de sa lampe torche ; tout près du spectateur, la jambe de quelqu'un entre dans le champ.
totem.totem_guidance_5=Chris, désespéré, appuie un pistolet sous sa propre mâchoire.
totem.totem_danger_4=Sous une plateforme en bois, une main descend vers une main gantée tendue vers le haut ; elles se manquent.
totem.totem_guidance_6=Mike, du sang sur le cou, pousse brusquement un haut casier métallique vert ; il glisse le long du mur.
totem.totem_danger_3=Dans une mine, Jessica tombe lourdement au sol à côté de Matt ; il tombe à genoux et se penche sur elle.
totem.totem_tragedy_5=Une explosion de flammes ; puis quelqu'un gît à plat ventre sur le sol, la tête tournée vers nous, des flammes derrière : une veste claire roussie, le visage brûlé à vif, les dents à nu.
totem.totem_hunger_3=À travers les yeux de quelqu'un, tout teinté de rouge : on monte en dépassant une échelle, vers une ouverture lumineuse, on longe des rails de mine, puis on entre dans une lumière aveuglante.
totem.totem_tragedy_3=Forêt enneigée, la nuit, des feux brûlent : l'homme au lance-flammes, vu de dos et seulement jusqu'aux épaules, se tient debout tandis que du sang se déverse sur la neige sous lui, puis tombe à genoux ; Chris, arme à la main, regarde de loin.
totem.totem_death_5=Emily, les dents à nu, reçoit une balle dans l'œil : sa tête part en arrière, la bouche béante, un trou sanglant à la place de l'œil, l'autre œil révulsé.
totem.totem_death_5_ja=Vue plongeante, au-delà d'un abat-jour blanc suspendu, sur un sol de gravier sombre : un éclair vif, l'image tressaute, puis plus rien ne bouge.
totem.totem_fortune_4=Mike, l'air tourmenté, braque un pistolet droit sur le spectateur, puis l'écarte et se détourne sans tirer.
totem.totem_danger_6=Dans un étroit passage rocheux, Emily, effrayée, brandit un feu de Bengale rouge allumé ; il crachote et s'éteint, et elle tend devant elle le feu de Bengale éteint. Puis le noir.
totem.totem_tragedy_4=Un wendigo se dresse au-dessus de quelqu'un étendu au sol et s'abat sur lui ; un visage écrasé et ensanglanté emplit l'image.
totem.totem_tragedy_4_ja=Dans l'obscurité, les longs membres osseux et griffus d'un wendigo fouettent l'air au-dessus de quelqu'un étendu au sol ; des débris volent, puis le noir, puis un gros plan fixe sur une veste sombre portant une grande lettre M.
totem.totem_death_3=Mike, avec un grand sourire, actionne un briquet ; des étincelles jaillissent.
totem.totem_hunger_4=À travers les yeux de quelqu'un, dans une forêt rouge sang : on poursuit un cerf d'un blanc lumineux et on s'en rapproche.
totem.totem_tragedy_6=De longues mains griffues se referment sur la tête de Josh, qui hurle.
totem.totem_fortune_2=La nuit, dans la neige, Matt, une lanterne allumée à la main, se tient près d'une porte en bois barrée de planches, éclairée par en dessous, jette un regard en arrière vers elle, puis détourne les yeux.
totem.totem_death_6=Sam, une lampe au front, hurle tandis qu'une longue main griffue lui serre la mâchoire ; du sang lui coule de la bouche.
totem.totem_hunger_5=À travers les yeux de quelqu'un, en rouge : la vue fond sur une femme aux longs cheveux, d'un blanc lumineux, au sol ; elle s'enfuit à quatre pattes, puis se recroqueville juste sous le regard, un bras sur la tête, l'autre tendu en avant.
totem.totem_danger_5=Une pièce sombre aux rangées de fauteuils de cinéma en cuir : juste devant, un wendigo pâle est accroupi sur un dossier ; au-delà d'une porte, un autre traverse le sol à quatre pattes, et un troisième passe la tête par l'encadrement. Le plan pivote tandis que l'un d'eux bondit à travers la pièce ; puis l'obscurité.
totem.totem_fortune_5=Le chalet brûle dans la nuit ; devant lui, Ashley est assise dans la neige, recroquevillée.
totem.totem_fortune_6=Dans la pénombre du salon du chalet, un wendigo s'approche à quatre pattes de Sam, vue de près et de dos, jusqu'à ce que sa face soit juste à côté du visage de Sam ; elle ne bouge pas. Plus loin, quelqu'un se tient immobile près d'une lampe.
totem.totem_hunger_6=À travers les yeux de quelqu'un, en rouge : une longue main griffue saisit Josh à la gorge et le soulève tandis qu'il se débat.
