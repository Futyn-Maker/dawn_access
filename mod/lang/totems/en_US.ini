; Dawn Access totem visions — English (master table). One entry per vision film a totem plays (features/Totems,
; picture::VisionKeys): the key is the film's name; the fifth hunger totem's three cuts share one entry;
; a censored cut (<film>_ja, played with Extreme Content Censoring on) takes the film's entry unless it has its own.
; Each says what the vision shows, no more, in the words the player knows by the chapter the totem is
; found in. Every language file must contain the same keys.
[strings]
totem.totem_death_1=Night, among rocks: Beth, in a grey knit jumper, slams back-first onto a boulder, blood spurting from her mouth; then Hannah lies still on the stones, her face bloodied, eyes open.
totem.totem_guidance_1=A robin lands in the snow among birch trees.
totem.totem_tragedy_1=A figure is thrown back against a blast of fire; then a charred face lies in the smoke, teeth bared.
totem.totem_guidance_2=Sam, wrapped in a towel, runs with a flashlight down a dark corridor to a lift gate marked ELEVATOR, then lowers herself into the shaft and crouches there, peering out.
totem.totem_danger_1=In a foggy forest, a herd of deer advances; the antlered stag in front comes right up and bellows.
totem.totem_fortune_1=Jessica, scratched and in her underwear, comes to on the floor of a wrecked lift cage and raises herself up.
totem.totem_tragedy_2=Jessica falls down a timbered shaft and crashes onto a metal grate; she lies on her back, head toward us, her lower jaw torn away.
totem.totem_tragedy_2_ja=Jessica, in her underwear, falls down a timbered shaft and crashes onto a metal grate; she lies on her back, head toward us, mouth open, scratched and bruised.
totem.totem_death_2=Matt falls through the dark; then he lies still, blood at his mouth.
totem.totem_hunger_1=Through someone's eyes, low to the ground in a cold blue blur: a pale hand reaches out, crawling toward a heap of stones with a small wooden cross marked BETH.
totem.totem_guidance_3=In a misty blue light, a drenched man crawls on all fours along a rocky ledge past a wooden post; behind him, Sam hauls herself out of the water onto the ledge.
totem.totem_guidance_4=Close up: a hand strokes the head of a calm grey wolf.
totem.totem_fortune_3=In a mine, seen from above: Matt, a lamp on his forehead, crouches by a burning red flare and looks up.
totem.totem_hunger_2=Through someone's eyes in a timbered mine tunnel: the view lurches and flashes red and yellow, a hand claws at the floor, and the view sinks to the ground.
totem.totem_death_4=In a mine tunnel, someone's legs kick in the air as they are hoisted up; blood streams down.
totem.totem_danger_2=Sam, in a towel, stands in a lit doorway across a large dark room and shines a flashlight around; close to the viewer, someone's leg steps into view.
totem.totem_guidance_5=Chris, distraught, presses a pistol under his own jaw.
totem.totem_danger_4=Below a wooden platform, a hand reaches down to a gloved hand stretching up; they miss each other.
totem.totem_guidance_6=Mike, blood on his neck, shoves a tall green metal locker; it slides along the wall.
totem.totem_danger_3=In a mine, Jessica falls hard to the ground beside Matt; he drops to his knees over her.
totem.totem_tragedy_5=A blast of fire; then someone lies on their front on the floor, head turned toward us, flames behind: a light jacket scorched, the face burned raw, teeth bared.
totem.totem_hunger_3=Through someone's eyes, tinted red: up past a ladder toward a bright opening, along mine rails, then into blinding light.
totem.totem_tragedy_3=Snowy forest at night, fires burning: the man with the flamethrower, seen from behind and only up to his shoulders, stands as blood pours onto the snow beneath him, then drops to his knees; Chris, gun in hand, watches from a distance.
totem.totem_death_5=Emily, teeth bared, is shot in the eye: her head snaps back, mouth gaping, a bloody hole where the eye was, the other eye rolled up.
totem.totem_death_5_ja=Looking down past a hanging white lampshade at a dark gravel floor: a bright flash, the view jolts, then everything is still.
totem.totem_fortune_4=Mike, anguished, aims a pistol straight at the viewer, then swings it away and turns aside without firing.
totem.totem_danger_6=In a narrow rock passage, a frightened Emily holds up a burning red flare; it sputters out, and she holds the dead flare out in front of her. Then darkness.
totem.totem_tragedy_4=A wendigo rears over someone lying on the ground and smashes down; a crushed, bloody face fills the view.
totem.totem_tragedy_4_ja=In the dark, a wendigo's long, bony, clawed limbs lash over someone lying on the ground; debris flies, then darkness, then a still close-up of a dark jacket with a large letter M.
totem.totem_death_3=Mike, grinning, flicks a lighter; sparks burst.
totem.totem_hunger_4=Through someone's eyes, in a blood-red forest: chasing a glowing white stag and closing in on it.
totem.totem_tragedy_6=Long clawed hands clamp over Josh's head as he screams.
totem.totem_fortune_2=At night in the snow, Matt, a lit lantern in his hand, stands by a boarded wooden door lit from below, glances back at it, then looks away.
totem.totem_death_6=Sam, a lamp on her forehead, screams as a long clawed hand grips her jaw; blood runs from her mouth.
totem.totem_hunger_5=Through someone's eyes, in red: the view swoops down on a long-haired woman glowing white on the ground; she scrambles away on all fours, then cowers beneath it, one arm over her head, the other flung out.
totem.totem_danger_5=A dark room with rows of leather cinema seats: right in front, a pale wendigo crouches on a seat back; through a doorway beyond, another crawls across the floor on all fours, and a third peers round the door frame. The view swings as one leaps across the room; then darkness.
totem.totem_fortune_5=The lodge burns at night; in front of it, Ashley sits hunched in the snow.
totem.totem_fortune_6=In the lodge's dim lounge, a wendigo creeps on all fours toward Sam, seen close from behind, until its face is right beside hers; she does not move. Further back, someone stands still by a lamp.
totem.totem_hunger_6=Through someone's eyes, in red: a long clawed hand seizes Josh by the throat and lifts him as he struggles.
