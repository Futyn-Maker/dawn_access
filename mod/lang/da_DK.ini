help.shoot=Sigt med musen eller bevægelsestasterne. Biplydene lyder i øret på målets side, lysere når det er over sigtet og dybere når det er under, og kommer hurtigere, jo nærmere sigtet kommer; et hurtigt dobbelt ping betyder, at spillet ville tælle et skud mod målet nu. {0} skyder. {1} og {2} skifter mellem målene, {3} siger, hvor målet er, {4} slår sigtelyden fra og til.
help.shoot.pad=Sigt med højre stik. Biplydene lyder i øret på målets side, lysere når det er over sigtet og dybere når det er under, og kommer hurtigere, jo nærmere sigtet kommer; et hurtigt dobbelt ping betyder, at spillet ville tælle et skud mod målet nu. {0} skyder. {1} og {2} skifter mellem målene, {3} siger, hvor målet er, {4} slår sigtelyden fra og til. På en DualSense med adaptive udløsere slået til tæller skuddet først, når udløseren trykkes forbi modstanden.
