help.explore={0} og {1} vælger, hvad du går hen til, {2} slår pejletonen til eller fra. Pejletonen lyder på målets side og stiger, jo tættere du kommer; den falder en oktav, når målet er bag dig. Gå mod lyden med bevægelsestasterne.
