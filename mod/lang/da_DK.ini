help.walk={0} går med figuren hen til målet; tryk igen for at stoppe.
help.looksound=Mens målet venter på et blik, slår {0} blikpejletonen til og fra i stedet for pejletonen.
help.beam=På en bjælke flytter pinden kun figuren den vej, den vender; et skub bagud vender den om. Pejletonen leder pinden langs bjælken, og {0} går hen ad den.
help.lookturn.pad=For at vende figuren mod målet på stedet skal du skubbe bevægelsespinden ({0}) let mod lyden, mindre end halvvejs, og slippe inden for et sekund; skubbes den længere og holdes, går figuren. Når kameraet skal se på målet, så drej det mod lyden ({1}).
help.lookturn=For at vende figuren mod målet på stedet skal du trykke kort på en bevægelsestast mod lyden; holdes tasten, går figuren.
help.where={0} siger målet igen med afstanden langs ruten og retningen.
