totem.found=Allerede fundet.
help.totem=Bippene følger varslet på totemet: på den side, det ligger fra midten af synsfeltet, højere eller lavere. Skub venstre pind mod det. Det dobbelte ping betyder, at blikket er på det: hold stille, indtil synet kommer. {0} slår blikpejletonen fra og til.
help.swipe=Telefonen låses op efter flere hurtige swipes i træk: gentag {0} igen og igen, hurtigt. Hvert swipe flytter skyderen lidt frem, og et øjeblik efter det sidste glider den tilbage. Bippene stiger, mens den fyldes, og falder, når den glider tilbage.
