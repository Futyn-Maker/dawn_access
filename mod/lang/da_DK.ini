dontmove.steer=Besvar hvert signal med ét kort tryk på {0}; det dobbelte bip siger, at markøren er tilbage.
dontmove.passive=Hold controlleren stille.
help.dontmove.active=Tæl tonerne. Det dobbelte bip hvert halve sekund betyder, at markøren er inde, og at intet kræves. To ens toner i ét øre betyder: tryk kort på {0} mod den side, nu. Tre stigende toner betyder op, tre faldende ned. Et dumpt slag før signalet betyder, at markøren allerede er ude over kanten; signalet peger da tilbage mod midten. Svar med ét kort tryk, som et klik, så snart du hører signalet, og lyt så: det dobbelte bip betyder, at markøren er tilbage; det samme slag med signal igen betyder ét tryk mere; et signal fra den modsatte side betyder, at du skød over, ét tryk tilbage. Et holdt tryk krydser hele zonen på en tiendedel sekund. Spillet trækker markøren i ryk, én retning ad gangen, med nogle sekunders mellemrum; et ryk besvaret inden for omkring trefjerdedele sekund koster intet, derefter tærer hvert øjeblik ude over kanten på et forråd, der aldrig fyldes op igen, og ursignalet lyder, når halvdelen og tre fjerdedele er brugt. Spillets egne indstillinger for taste- og stikfølsomhed til Stå stille gør trykkene blidere.
help.dontmove.passive=Hold controlleren stille. Det dobbelte bip hvert halve sekund betyder, at markøren er i midten. Et bip lyder dér, hvor markøren er drevet hen, i dens side og højere, når den er oppe, hurtigere jo længere; et dumpt slag før bippet betyder, at den er ude over kanten, og at uret kan tælle.
