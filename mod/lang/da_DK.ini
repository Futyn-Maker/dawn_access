help.nudge=Biplydene fører blikket hen til det udsnit, scenen venter på: på dets side, højere eller lavere. Drej blikket med musen eller piletasterne; det dobbelte ping betyder, at blikket hviler på det. {0} siger, hvor udsnittet er, {1} slår blikpejletonen fra og til.
help.nudge.pad=Biplydene fører blikket hen til det udsnit, scenen venter på: på dets side, højere eller lavere. Drej blikket med højre stik; det dobbelte ping betyder, at blikket hviler på det. {0} siger, hvor udsnittet er, {1} slår blikpejletonen fra og til.
help.turn=Bippene fører drejningen af tingen i hænderne hen til det sted, hvor den afsløres: til højre eller venstre, eller højere eller lavere for en drejning op eller ned, hurtigere jo nærmere den er. Det dobbelte ping betyder, at den er afsløret. {0} siger, hvilken vej der skal drejes, og hvor meget der er tilbage, {1} slår blikpejletonen fra og til.
help.boiler=Når trykmålerens lampe tændes, lyder det dobbelte ping: tryk straks på {0}, mens den lyser, i omkring to sekunder; et tryk, mens den er slukket, mislykkes, og det hele begynder forfra. Slip {0} efter drejningen: en knap, der stadig holdes fra grebet, tæller med det samme, før lampen lyser.
help.gesture=En halvcirkel med venstre stik: med uret skubbes stikket helt op, så til højre, så ned; mod uret op, så til venstre, så ned; hvert trin inden for et halvt sekund efter det forrige. På tastaturet klarer tasten fra prompten det med det samme.
help.gesture.held=Her laves halvcirklen med {0} holdt nede: slipper du den, taber du det, du holder.
interact.nomatches=Ingen tændstikker.
interact.lamp=Lampen lyser.
interact.now=Nu.
