; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=木製のバーで笑い合う5人の友人：眼鏡のクリスが缶を持ち、ジョッシュはバースツールで瓶を手に笑い、赤い柄のセーターを着たサムはカウンターに座っている。右ではマットとマイクが身を乗り出している。
picture.t_camera_chris_01_clr_up=ケーブルカーでの自撮り：ニット帽のジョッシュが、眼鏡のハンナとピンクのジャケットを着たベスの間でVサインをしている。
picture.t_camera_ashley_01_clr_up=マットがアシュリーの肩に腕を回している。アシュリーはしま模様のニット帽をかぶり、携帯電話を持っている。二人とも笑顔。
picture.t_camera_hannah_01_clr_up=寝室、壁にはHとWの文字：ジェスとエミリーが赤いカップを手にベッドのそばに座り、アシュリーはニット帽をかぶって立ち、眼鏡のハンナは電話で話している。
picture.t_camera_mike_01_clr_up=いたずら：にやりと笑うエミリーが、ソファで眠っているクリスの顔に落書きをしている。その顔にはすでに落書きがあり、後ろではジェスがにやにや笑っている。
look.i_psychsession_1_interaction=晴れた日のトウモロコシ畑：左に赤い納屋、右には麦わら帽子をかぶったカカシ。にやりと笑う顔で、赤いネッカチーフを巻き、片手は鉤になっている。左下の暗いトウモロコシの中に、小さな黄色い目が二つ。
look.i_sams_sketchbook.1=鉛筆の肖像画。左：サム。髪をゆるく後ろでまとめ、首にスカーフを巻き、横を見ている。右：ジェス。笑顔で、長い三つ編みを肩に垂らし、毛皮のフード付きのパーカを着ている。
look.i_sams_sketchbook.2=鉛筆の肖像画。左：マイク。髪をかき上げ、無精ひげを生やし、横を見ている。チェックのシャツにフード付きのジャケット。右：ジョッシュ。ニット帽をかぶり、かすかにほほえみ、まっすぐ前を見ている。
look.i_sams_sketchbook.3=鉛筆の肖像画。左：エミリー。真ん中で分けたまっすぐな黒髪、すぼめた唇、タートルネックに毛皮の襟。右：クリス。つんつんと立った髪に四角い眼鏡、キルティングのジャケット姿で、何か言いかけたように口を開けている。
look.i_sams_sketchbook.4=鉛筆の肖像画。左：アシュリー。リブ編みのニット帽、まっすぐな長い髪、穏やかにほほえんでいる。右：マット。短い巻き毛、笑顔で、タートルネックのセーターを着ている。
look.i_map=山の地図。場所にはLODGE、SANATORIUM、CABLE CARと書かれている。赤い点線の道がケーブルカーからロッジへ、さらに上の療養所へと続き、RANGER PATHに沿って無線マークのある塔にも延びている。下にはTO LOWER CABLE CAR。
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=壁一面に、赤い文字で何度も何度も：DIE。
look.i_security_monitor=画面に映る暗い浴室と大きな浴槽が、監視カメラの俯瞰映像に切り替わる：雪をかぶった木造の建物、長いポーチのベンチの上に灯る明かり、奥には霧の中の針葉樹。下の雪の上、裸の枝の影のあいだに、黒い人影が立っている。ノイズが走り、人影は消えている。
look.i_family_portrait=重厚な彫刻の額縁に入った肖像画で、下に銘板がある：THE WASHINGTON FAMILY。左に、眼鏡をかけハートのペンダントを着けたハンナと、前髪のあるベス。ハンナの手は、手前で微笑む短い黒髪の女性の肩に置かれている。後ろでは口ひげの男性がジョッシュの肩に腕を回し、ジョッシュは右側で、白い襟の上に濃い色のセーターを着て微笑んでいる。
look.i_car_lookat=車の中、座席には物が山積みになっている。ピンクの紙の買い物袋が2つ、柄物の旅行かばん、マニキュアやローションの瓶、雑誌、そしてバナナ。
look.i_hotel_poster=色あせたポスター。ぎざぎざの峰と星空の下に、長いベランダと急な切妻屋根のある大きな木造ホテル。
look.i_prom_night_photo=写真のハンナの二の腕には、小さな黒い蝶のタトゥーがある。
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=写真のハンナの二の腕には、小さな蝶のタトゥーがある。
look.i_mysticalsymbols=板に暗い赤で殴り描かれている。大きく枝分かれした角の下に、歯をむき出した頭蓋骨のような顔。絵の具は垂れて筋になっている。そばには羽根のついた鹿の頭蓋骨が下がっている。
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=招待状の下には、タキシードに蝶ネクタイ姿のマイクの白黒写真。その周りのコルクボード（凝った装飾の黒っぽい額入り）には、サムの写真、エミリーとハンナとベスが一緒に写った写真、犬と猫たち、タワーブリッジ、風景の写真。馬の描かれた「1ST」「SPECIAL」のロゼット、HARRY VOGUEのコンサートチケット2枚、「JOSH」とサインされた落書きの顔、そしてメモ：「Finals start APRIL 22nd!!」「It's up to you to find BEAUTY in the ugliest days!」「Dad's new P.A Cheryl 558-714-1132」。
look.i_look_at_dollshouse=整理だんすの上に置かれた古い2階建ての木製ドールハウス。灰色のこけら葺き屋根、切妻には丸窓、鎧戸のついた窓、正面にはポーチ。2階の窓には金髪の青白い裸の人形。1階の窓からは他の人形がぼんやり見え、ポーチには人形の頭が転がっている。そばの開いたスーツケースには、マゼンタのドレスを着た黒髪の人形と十字架のついた暗い色の本。手前には積み木が3つ積まれ、どれも6の面を向けている。
look.i_snowybench=払いのけた雪の下、板にハートが彫られ、その中に文字が刻まれている。
look.i_headlessdoll=頭のない裸の赤ちゃん人形。プラスチックは汚れてしみがつき、ひび割れていて、首の部分には黒い穴があり、小さな爪は赤く塗られている。背中には3匹の蝶と飾り文字の「Hannah」のシール、胸には小さな穴が丸く集まっている。
look.i_controls_lookat=使い古されて傷だらけの灰色の金属製操作卓。奥にはA、V、Hzと書かれた計器が並び、黄・緑・白のランプの列、ロータリースイッチ、丸い押しボタン、テンキーがある。右側にはSTOP、NEUTRAL、RUNと書かれたレバー溝のある青いプレート、中央には鍵穴のある赤いスイッチ。その上に赤い文字で何度も何度も：DIE。
look.a_telescope=望遠鏡の中は夜。岩と松の雪の斜面、真ん中には背の高い白っぽい木の幹が弓なりに伸びている。左下、大きな岩のそばの雪道で、エミリーとマイクが向き合って寄り添っている。彼の手は彼女の頬に、彼女の手は彼の腰に。ずっと右、葉の落ちた枝越しに、明かりのついた小屋の下のベンチに誰かが一人で座っている。
look.i_telescope.act2_2=望遠鏡の中は夜。雪をかぶった岩の向こうに、つららの下がる屋根の丸太小屋の角。軒下で灯りがともり、その下に金網で覆われた換気扇。人影はない。
look.i_telescope.act2_3=望遠鏡の中は夜。木々に囲まれた雪の空き地に、2本の長いロープで板のブランコが吊るされている。その奥には雪の積もった岩棚と葉の落ちた茂み、左にはシダとツタに覆われた木の幹。
look.i_death_whistle=広く枝分かれした角を持つ頭蓋骨の形に彫られた笛。回すと顔が見える。白い塗料で縁取られた深い二つの眼窩と丸く開いた口、額には白い輪をつないだ鎖の模様が描かれている。
look.i_smashed_vase=濃い赤の花瓶の破片が床に散らばっている。アシュリーがそのひとつを持ち上げると、割れた縁はざらざらとして白っぽい。
look.i_sams_bracelet=編んだ紐のブレスレット。青地に黄・赤・紫のひし形の模様があり、ピンクがかった金属の留め具で閉じてある。
look.i_picture_lookat=黒っぽい、ひび割れた額縁の絵。嵐の空の下、夜の二階建ての木造家屋が濃い青と灰色だけで描かれている。切妻の高いところに丸窓、二階には鎧戸のついた窓、下には手すりのある長いポーチ。
look.i_dollhouse_complete=ドールハウスの窓越しに、中の人形たちが見える。次に間近に、身を寄せ合う裸の人形が四体。顔はどれも同じ人形の顔で、赤毛、黒髪、おさげの金髪、そして小さなビデオカメラを手にした褐色の肌の人形。アシュリー、エミリー、ジェス、マットに似ている。目は黒い穴で、頬には暗い赤の筋が流れ落ちている。
look.i_dollhouse_complete.open=ドールハウスの正面が開き、屋根が持ち上がる。中は二階建ての小さな部屋で、裸の人形たちが場面のように並べられている。顔はどれも同じ人形の顔だが、髪は仲間たちと同じだ。二階では何本かの瓶とグラスの載ったテーブルのそばで、黒髪の人形がソファにぐったりと横たわり、その隣に眼鏡をかけた金髪の人形がいる。ジョッシュとクリスに似ている。一階では四体の人形が赤い敷物の上でベッドに向かってひざまずいている。小さなビデオカメラで撮影している褐色の肌の人形、おさげの金髪、黒髪、赤毛で、マット、ジェス、エミリー、アシュリーに似ている。もう一体の人形が少し離れて立っている。
look.i_doll_house_lookat_keyhole=ドールハウスの切妻の高いところで、小さな丸窓がふたのように横へずらされている。その奥には、赤い縁取りのある、鍵穴の開いた丸い真鍮の板。
look.i_doll_house_key=小さな古い鉄の鍵。持ち手はハート形で、軸にはらせん状の溝がある。絵の裏に隠されて、小さな真鍮のフックに掛かっていた。
look.i_wine_rack=鉄の帯をひし形に組んだ格子の奥に、背の高い木製のワインラック。上のほうの板は打ち破られて裂け、黒い穴がいくつも開いている。
look.i_wine_cellar_door=鉄の帯で補強された板張りの扉。錆びた錠前の金具には取っ手がなく、小さな四角い穴が開いているだけだ。
look.i_doll_head=こちらへ向けられた、はげた人形の頭。描かれたまつげに縁取られた空っぽの黒い目の穴、ばら色の頬、赤い唇。塗料はひび割れてはがれかけ、片目から口の脇を通って黒いひびが走っている。
look.i_doll_head.roaches=人形の頭からゴキブリがわらわらと這い出してくる。
look.i_sams_sack=袋の下にいたのはサムだった。バスタオル姿で、古い木の回転椅子に身じろぎもせず座っている。
look.crossedout=1枚の写真にばつ印がつけられている：{0}。
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=木の柱の隙間から、錆びた金網越しに見下ろすと、坑道の床を横切るトロッコのレールが見える。床には岩くず、坑木、折れた板が散らばっている。
look.i_torn_miner_clothes=石の上に古い鉱夫のヘルメットが転がっている。盛り上がった筋のある黒っぽい金属の丸い帽体は一面に錆び、つばは広く、正面には丸い反射板のついた小さな真鍮のランプがある。
look.i_sign=石の上に、白く塗られた木の看板の割れた破片が落ちている。左端はささくれている。そこには色あせた赤いステンシルの大文字で、ある単語の終わりの GER、その下に EDGE とある。
look.i_peer_at_head=錆びた金網越しに、粗い縦板の板塀。板の隙間から向こうの通路の石だらけの床が見え、塀のすぐ後ろには樽にかぶせた黒っぽい防水シートがある。
look.i_peer_at_wheel=二本の柱の間の錆びた金網越しに、奥の洞窟。そこには壊れた足場に囲まれた大きな古い木の水車がある。その下で暗がりから炎が噴き出し、消えていく。
look.i_scarecrow_lookat=杭に立てられたかかし。腕は先が小枝に分かれた裸の枝で、胴体は血で汚れた黒いビニール袋だ。頭は白っぽい布で包まれ、首のところで縄で縛られている。布越しに腐った顔が透けて見え、鼻は穴が空き、開いた口には腐った歯が並び、片側は血に染まっている。くたびれた茶色の帽子の下から長い黒髪が垂れている。
look.i_scarecrow_lookat.clown=杭に立てられたかかし。腕は先が小枝に分かれた裸の枝で、胴体は血で汚れた黒いビニール袋だ。頭はピエロのマスクだ。白い顔に紫に描いた眉、片目のそばに赤い星、赤い鼻、鋭い歯の並ぶ大きな赤いにやけた口から血が垂れている。
look.i_scarecrow_lookat.zombie=杭に立てられたかかし。腕は先が小枝に分かれた裸の枝で、胴体は血で汚れた黒いビニール袋だ。頭は腐りかけたゾンビの頭だ。はげ頭で、灰緑色のまだらな肌、瞳のない白い目、歯をむき出した大きく開いた口。
look.i_dead_crow_lookat=血に染まった雪の上に、二羽のカラスの死骸が横たわっている。引き裂かれて血まみれで、翼は広がり、内臓がはみ出している。周りには黒い羽根が散らばっている。
look.i_chair_and_blood=コンクリートの床に、脚の折れた木の丸椅子が倒れている。その横には鎖につながれた開いた鉄の枷。床には血が飛び散り、したたっていて、ランタンが横倒しのまま、まだ灯っている。
look.i_fake_torso=グレーのチェックのシャツを着た胴体の上半分が、両腕を頭上に伸ばした格好でぶら下がっている。腰から下はなく、ぎざぎざの血まみれの切り口があるだけだ。その後ろには、穴をくり抜いた板が立っている。
look.i_saw_blades=巨大な丸のこの刃が平らに置かれ、錆びた鋼に黒ずんだ血がこびりついている。その奥には金網のフェンス。
look.i_dead_wolf_inspect=独房の扉の鉄格子に、オオカミの死骸が掛かっている。胸と腹は大きく引き裂かれて空っぽで、頭はだらりと垂れ、顎は開いたまま。その下には血だまりの中に内臓が落ちている。
look.i_damaged_doors=パネルのへこんだ重い鋼鉄の独房の扉。大きな黒ずんだ血の跡が流れ落ち、上の小窓の下からも血がしたたっている。金属には深い爪痕が何本も刻まれている。
look.i_sanlookat=鉄の支柱に錆びた金網のパネルを張った高いフェンス。上には有刺鉄線の束が絡み合っている。
look.i_oilflask=取っ手と注ぎ口のついた錆びた赤い金属缶。片面には色あせた楕円のラベルに North West、NWM、Mining とあり、もう片面にはひし形の標示に FLAMMABLE LIQUID とある。
look.i_oilflask.roaches=缶からゴキブリがどっとあふれ出し、彼女はそれを放り投げる。
