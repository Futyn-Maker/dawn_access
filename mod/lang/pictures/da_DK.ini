picture.mi_padlock=@SMG013_64519
; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Fem venner griner ved en bar af træ: Chris, med briller, holder en dåse; Josh griner på en barstol med en flaske; Sam, i en rød mønstret sweater, sidder på disken; til højre læner Matt og Mike sig ind mod de andre.
picture.t_camera_chris_01_clr_up=En selfie i en svævebanekabine: Josh, med hue, laver et V-tegn mellem Hannah, med briller, og Beth, i en lyserød jakke.
picture.t_camera_ashley_01_clr_up=Matt med armen om Ashley, der har en stribet hue på og holder en telefon; begge smiler.
picture.t_camera_hannah_01_clr_up=Et soveværelse, bogstaverne H og W på væggen: Jessica og Emily sidder ved sengen med røde krus, Ashley står med hue på, og Hannah, med briller, taler i telefon.
picture.t_camera_mike_01_clr_up=En spøg: Emily, med et bredt smil, tegner i ansigtet på Chris, der sover på en sofa med ansigtet allerede fuld af kruseduller, mens Jessica smiler bredt bag ham.
look.i_psychsession_1_interaction=En majsmark på en solrig dag: en rød lade til venstre og til højre et fugleskræmsel med stråhat, et bredt grin, et rødt halstørklæde og en krog i stedet for den ene hånd. I den mørke majs nederst til venstre, to små gule øjne.
look.i_sams_sketchbook.1=Blyantsportrætter. Til venstre: Sam, håret løst samlet bagpå, et halstørklæde om halsen, kigger til siden. Til højre: Jessica, smilende, en lang fletning over skulderen, i en parka med pelshætte.
look.i_sams_sketchbook.2=Blyantsportrætter. Til venstre: Mike, håret strøget op, skægstubbe, kigger til siden, i ternet skjorte og en jakke med hætte. Til højre: Josh, i en strikhue, et svagt smil, kigger lige frem.
look.i_sams_sketchbook.3=Blyantsportrætter. Til venstre: Emily, glat mørkt hår med midterskilning, sammenknebne læber, i rullekravesweater og pelskrave. Til højre: Chris, strittende hår og rektangulære briller, i en vatteret jakke, munden åben, som midt i et ord.
look.i_sams_sketchbook.4=Blyantsportrætter. Til venstre: Ashley, i en ribstrikket hue, langt glat hår, smiler blidt. Til højre: Matt, kort krøllet hår, smilende, i en rullekravesweater.
look.i_map=Et kort over bjerget med stederne mærket LODGE, SANATORIUM og CABLE CAR. Røde prikkede stier fører fra svævebanen til huset og videre op til sanatoriet, og ad RANGER PATH til et tårn med et radiosymbol; nederst TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Røde bogstaver smurt ud over væggene, igen og igen: DIE.
look.i_security_monitor=På skærmen afløses et mørkt badeværelse med et stort badekar af et overvågningskameras udsyn ovenfra: en snedækket træbygning, en tændt lampe over en bænk på den lange veranda, grantræer i tågen bagved. Nede i sneen, mellem skyggerne af nøgne grene, står en mørk skikkelse. Billedstøj, og skikkelsen er væk.
look.i_family_portrait=Et malet portræt i en tung udskåret ramme med en plade nedenunder: THE WASHINGTON FAMILY. Til venstre Hannah, med briller og et hjertevedhæng, og Beth, med pandehår; Hannahs hånd hviler på skulderen af en smilende kvinde forrest, med kort mørkt hår. Bagved har en mand med overskæg armen om Josh, der smiler til højre i en mørk sweater over en hvid krave.
look.i_car_lookat=I bilen ligger sæderne fulde af ting: to lyserøde papirsposer, en mønstret rejsetaske, flasker med neglelak og lotion, blade og en banan.
look.i_hotel_poster=En falmet plakat: et stort træhotel med lange verandaer og stejle gavle under en takket tinde og en stjernehimmel.
look.i_prom_night_photo=På fotoet har Hannah en lille sort sommerfugl tatoveret på overarmen.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=På fotoet har Hannah en lille sommerfugl tatoveret på overarmen.
look.i_mysticalsymbols=Smurt på plankerne i mørkerødt: et kraniumagtigt ansigt med blottede tænder under et bredt, forgrenet gevir, malingen løbet i dråber. Ved siden af hænger et hjortekranium med fjer.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Under invitationen et sort-hvidt foto af Mike i smoking og butterfly. Rundt om på opslagstavlen af kork, i en snirklet mørk ramme: fotos af Sam, af Emily, Hannah og Beth sammen, af en hund og katte, af Tower Bridge og landskaber; rosetter med heste, mærket 1ST og SPECIAL; to koncertbilletter til HARRY VOGUE; et kruset ansigt signeret JOSH; og sedler: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Et gammelt toetagers dukkehus af træ på en kommode: et gråt spåntag med et rundt vindue i gavlen, vinduer med skodder, en veranda langs facaden. I et vindue ovenpå en bleg nøgen dukke med lyst hår; gennem et vindue nedenunder ses svagt flere dukker, og på verandaen ligger et dukkehoved. Ved siden af, i en åben kuffert, en mørkhåret dukke i en magentafarvet kjole og en mørk bog med et kors; foran tre stablede legeklodser, der alle viser 6.
look.i_snowybench=Under den fejede sne er et hjerte skåret ind i plankerne, med bogstaver ridset ind i det.
look.i_headlessdoll=En nøgen babydukke uden hoved, plastikken snavset, plettet og revnet, et mørkt hul ved halsen, bittesmå negle malet røde. På ryggen et klistermærke med tre sommerfugle og navnet Hannah i snirklet skrift; på brystet en rund plet af små huller.
look.i_controls_lookat=Et gråt kontrolpanel af metal, slidt og ridset: bagerst måleinstrumenter mærket A, V og Hz, rækker af gule, grønne og hvide lamper, drejeomskiftere, runde trykknapper og et tastatur; til højre en blå plade med en håndtagsrille mærket STOP, NEUTRAL, RUN, og i midten en rød kontakt med nøglehul. Igen og igen smurt hen over det med røde bogstaver: DIE.
look.a_telescope=Gennem teleskopet, om natten: en snedækket skråning med klipper og fyrretræer, en høj, lys træstamme, der bøjer sig opad i midten. Nede til venstre, på en snedækket sti ved en stor klippe, står Emily og Mike tæt sammen, ansigt til ansigt: hans hånd ved hendes kind, hendes hænder ved hans talje. Langt til højre, gennem nøgne grene, sidder nogen alene på en bænk under et oplyst skur.
look.i_telescope.act2_2=Gennem teleskopet, om natten: snedækkede kampesten og bag dem hjørnet af en bjælkehytte under et tag fuldt af istapper; under tagskægget lyser en lampe over en ventilator bag tremmer. Der er ingen at se.
look.i_telescope.act2_3=Gennem teleskopet, om natten: en snedækket lysning mellem træer, hvor en gynge af en træplanke hænger i to lange reb. Bagved snedækkede klippeafsatser og nøgne buske; til venstre bregner og en vedbendklædt træstamme.
look.i_death_whistle=En udskåret fløjte formet som et kranium med brede, forgrenede gevirer. Vendt om viser den sit ansigt: to dybe øjenhuler og en rund, åben mund, kranset af hvid maling, og en kæde af hvide løkker malet ned ad panden.
look.i_smashed_vase=Skår af en mørkerød vase ligger spredt ud over gulvet; Ashley holder et af dem op, med ru, lyse brudkanter.
look.i_sams_bracelet=Et flettet snorarmbånd, blåt med et mønster af gule, røde og violette romber, lukket med en lyserød metallås.
look.i_picture_lookat=Et maleri i en mørk, revnet ramme: et træhus i to etager om natten under en stormfuld himmel, helt i mørkeblå og grå toner, med et rundt vindue højt oppe i gavlen, vinduer med skodder ovenpå og en lang veranda med rækværk nedenunder.
look.i_dollhouse_complete=Gennem dukkehusets vinduer ses dukker derinde; så, helt tæt på, fire nøgne dukker klemt sammen, alle med det samme dukkeansigt: en rødhåret, en mørkhåret, en blond med to hestehaler og en mørkhudet, der holder et lille videokamera, ligesom Ashley, Emily, Jessica og Matt. Deres øjne er sorte huller, og mørkerøde striber løber ned ad kinderne.
look.i_dollhouse_complete.open=Dukkehusets forside svinger op, og taget løftes: to etager med bittesmå værelser, hvor nøgne dukker er stillet op, alle med det samme dukkeansigt, men med vennernes hår. Ovenpå, ved et bord med flasker og et glas, ligger en mørkhåret dukke henslængt på en sofa ved siden af en blond med briller, ligesom Josh og Chris. Nedenunder knæler fire dukker på et rødt tæppe med front mod en seng: en mørkhudet, der filmer med et lille videokamera, en blond med to hestehaler, en mørkhåret og en rødhåret, ligesom Matt, Jessica, Emily og Ashley; endnu en dukke står for sig selv.
look.i_doll_house_lookat_keyhole=Højt oppe i dukkehusets gavl er det lille runde vindue drejet til side som et låg: bag det en rund messingplade med et nøglehul, kantet med rødt.
look.i_doll_house_key=En lille gammel jernnøgle med et hjerteformet greb og en spiralrillet skaft. Den hang på en lille messingkrog, gemt bag maleriet.
look.i_wine_rack=Et højt vinreol af træ bag et rombeformet gitter af jernbånd; de øverste brædder er slået ind og splintret, med mørke huller revet igennem dem.
look.i_wine_cellar_door.act5_3=En plankedør forstærket med jernbånd; på den rustne låseplade er der intet håndtag, kun et lille firkantet hul.
look.i_doll_head=Vendt mod hende, det skaldede dukkehoved: sorte, tomme øjenhuller kranset af malede øjenvipper, rosenrøde kinder, røde læber, malingen revnet og skallende, og en mørk revne, der løber fra det ene øje ned forbi munden.
look.i_doll_head.roaches=Kakerlakker myldrer ud af dukkehovedet.
look.i_sams_sack=Under sækken er Sam, i et badehåndklæde, og sidder ubevægelig i en gammel drejestol af træ.
look.crossedout=Ét foto er streget over: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Rustent trådnet spændt ud mellem to træstolper, Emilys hånd om den højre; gennem det, nedenfor, i svagt blåligt lys, en tunnelbund fyldt med stenbrokker og en mørk bjælke, der ligger på tværs af den.
look.i_torn_miner_clothes=På stenene ligger en gammel minearbejderhjelm: en mørk metalkuppel med ophøjede ribber, en bred, rusten skygge og foran en lille messinglampe med en rund reflektor.
look.i_broken_ladder=En knækket stige ligger på tværs over stenbrokkerne: en lang vange af træ med tre rustne jerntrin, der stikker ud af den, deres yderste ender knækket af, og på to af dem sidder der stadig splintrede træstumper.
look.i_sign=Et afbrækket stykke af et vejrbidt træskilt ligger i støvet, dets kanter takkede og flækkede; på det står med falmede røde stencilerede versaler slutningen af et ord, GER, og under det EDGE.
look.i_peer_at_head=Gennem mørkt trådnet, mellem grove planker: bag dem, på et stenet gulv, en tønde med en presenning over toppen, og længere tilbage et rækværk af træ og bunker af stenbrokker.
look.i_peer_at_wheel=Gennem rustent trådnet mellem to stolper: en hule bagved, og i den et stort gammelt vandhjul af træ mellem ødelagte stilladser; ved dets fod blusser en flamme op af mørket og dør hen.
look.i_scarecrow_lookat=Et fugleskræmsel, armene nøgne grene, der ender i kviste, kroppen en sort plastikpose tilsmurt med blod. Hovedet er svøbt i lyst stof, bundet om halsen med reb; igennem det ses et rådnende ansigt, en hul næse og en åben mund med rådne tænder, den ene side gennemvædet af blod. Under en medtaget brun hat hænger langt sort hår.
look.i_scarecrow_lookat.clown=Et fugleskræmsel, armene nøgne grene, der ender i kviste, kroppen en sort plastikpose tilsmurt med blod. Hovedet er en klovnemaske: et hvidt, rynket ansigt, lilla bryn malet i høje buer op ad panden, mørke øjenhuller kantet med lilla, en rød næse og et bredt grin med lange, skarpe tænder, rødt i mundvigene, hagen mørk af blod.
look.i_scarecrow_lookat.zombie=Et fugleskræmsel, armene nøgne grene, der ender i kviste, kroppen en sort plastikpose tilsmurt med blod. Hovedet er et rådnende zombiehoved: skaldet, gråligt grøn plettet hud, tomme hvide øjne og en gabende mund fuld af tænder.
look.i_dead_crow_lookat=To døde krager ligger i blodig sne, flænset op og blodige, med udspilede vinger og indvoldene væltende ud; løse sorte fjer ligger spredt omkring dem.
look.i_chair_and_blood=På betongulvet ligger en træskammel væltet med knækkede ben; ved siden af den en åben jernlænke på en kæde. Blod er sprøjtet og dryppet ud over gulvet, og en lygte ligger på siden, stadig tændt.
look.i_fake_torso=Overdelen af en krop i en grå ternet skjorte hænger med armene strakt op over sig; under livet er der intet andet end et laset, blodigt snit. Bag den står en plade med et hul skåret i.
look.i_saw_blades=En kæmpe rundsavsklinge ligger fladt, dens rustne stål indsmurt i mørkt blod; bag den et trådhegn.
look.i_dead_wolf_inspect=En død ulv hænger på tremmerne i en celledør: brystet og bugen er flået vidt op og tomme, hovedet hænger med gabende kæber, og under den ligger indvoldene i en pøl af blod.
look.i_damaged_doors=En tung celledør af stål med bulede paneler: en stor mørk stribe blod løber ned ad den, blod er dryppet ned fra under den lille luge foroven, og dybe kloridser er skåret ind i metallet.
look.i_sanlookat=Et trådhegn: til venstre en mørk stolpe, på tværs en rusten stang. Gennem nettet, i sneen bagved, en kort betontrappe med et metalgelænder.
look.i_oilflask=Holdt helt tæt op foran øjnene, en høj rusten rød metaldunk. På siden står der på et falmet ovalt emblem North West rundt om bogstaverne NWM, med Mining nedenunder; på den smalle side står der på et rødt rombeformet skilt FLAMMABLE LIQUID.
look.i_oilflask.roaches=Kakerlakker kravler ud og hen over dunken, og hun slynger den fra sig.
look.i_admin_area_jacksdoor_lookat_reader=En sort kortlæser på væggen ved siden af en trædør, på dens lille røde display står LOCKED; på døren, under et lille vindue, et rustent grønt skilt: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=På den udtrukne bakke i lighuset ligger et rådnende lig på ryggen: et gråt, indskrumpet ansigt med gabende mund, mørkt hår klistret rundt om det; den grå skjorte og den rustne bakke er plettet af gammelt blod.
look.i_jackslair_exit_lock_lookat=En jernlåge med rombeformet net er låst: en stor, rusten hængelås hænger i overfaldet ved dørkarmen af træ.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=To MISSING-plakater: HANNAH WASHINGTON og BETH WASHINGTON; på Hannahs står der: She has glasses, and has a tattoo of a butterfly on her right shoulder. En gul seddel: NEVER FORGET. Avisudklip: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. På et foto af fire piger er Hannah indkredset med rødt.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_snowwipe_tractor_revisit=Bag den snavsede, plettede rude i den gamle lastbils førerhus er der en hvid hockeymaske malet som et kranium: skrå øjenhuller, en næse som på et kranium og et bredt grin med lange tænder, to mørke streger over det ene øje, et stykke slået af øverst.
look.i_joshsbaseball=En gammel, snavset baseballbold, læderet skrammet og brunplettet, den røde syning falmet; på den står med sort håndskrift: Josh.
look.i_loveheart=Et hjerte er skåret ind i den lyse bark på en træstamme, og inde i det står M+E.
look.i_rifle_lookat=I en træbod ligger en riffel på plankedisken. Ude i sneen bagved står gamle tønder med flasker ovenpå, og fra grenene hænger sække i reb, en af dem mærket med et X.
look.i_look_at_picture==look.i_picture_lookat
look.i_wine_cellar_door.act2_4=En plankedør forstærket med jernbånd; på den rustne låseplade sidder en rund dørknop.
look.i_rush_of_blood_snowglobe=En snekugle på en sokkel malet med røde og blå zigzagstriber. Inde i glasset, over en lille snedækket høj, snor træsporet på en rutsjebane sig i loops på spinkle stylter, med små vogne på; røde balloner med hvide stjerner og røde pileskilte besat med lys rejser sig mellem loopene.
look.i_chess_piece=Taget op fra et skakbræt, en lille figur af en mand, omtrent en finger lang: han står med armene ned langs siden, i T-shirt og bukser, og ansigtet er glat, uden ansigtstræk.
look.i_fallen_beams=På jorden ligger et panel af svejset jerngitter i en rusten ramme, nogle af tremmerne knækket, med to store stenklumper ovenpå; fra en ring i det ene hjørne hænger en tung kæde.
look.i_lookatmineexit=Tæt på: en dør af vejrbidte planker med et stort, takket hul slået igennem; gennem hullet ses kun bleggrå dis.
look.i_matts_shoe=En stor vinterstøvle, samlet op fra jorden: en mørkeblå overdel af læder snøret gennem løkker, et filtfor, der stikker frem foroven, og en mørk gummifod med hvide striber, tilsmurt med mudder.
look.i_ashleys_purse=Chris holder en lille, mørk strikket taske op; på forsiden er lyse bogstaver strikket ind: ASH.
look.i_investigate_blood_kitchen=Blod er sprøjtet ud over en lys væg over en bordplade af træ: én stor, mørk plamage og en regn af stænk omkring den, med dryp, der løber ned til bordpladen.
look.i_hospital_the_chair=Ovenfra ses en gammel træstol mellem klumper af murbrokker: læderremme med spænder på armlænene, det høje ryglæn og benene, og mørkt blod trukket ind i sædet.
look.i_morgue_security_gate_lookat=En sort kortlæser på en bleggrøn flisebelagt væg ved en mørk dørkarm af træ, på dens lille røde display står LOCKED; ved siden af den et slidt grønt skilt: CHAPEL SECURITY PASS REQUIRED.
look.i_jackslair_look_into_church=Gennem en sprække mellem brædder: en stor, dunkel sal, diset af støv, et rækværk højt oppe langs den bageste væg; nede på gulvet til venstre brænder en lampe mellem nogle få møbler og noget skrammel.
look.i_warningsign=Et afbrækket stykke af et vejrbidt træskilt ligger i sneen, dets kanter takkede; på det står med falmede røde stencilerede versaler begyndelsen af et ord, DAN, og under det CLIFF.
look.i_sams_sock=Sam holder en enkelt grå ribstrikket sok op ved siden af en tom lænestol med udskåret træstel; et stearinlys brænder på gulvet.
look.i_cooling_equipment=Et mørkt køleaggregat af metal med en rund trykmåler; foran det en rød ventil med endnu en måler og et rødt håndhjul, og riflede sorte slanger, der snor sig ned til gulvet i en hvid dis.
look.i_boilerroom_lookat=Gennem en smadret vinduesramme med tremmer: et stort, dunkelt rum bagved, diset af støv, trådhegn og metalstolper bagest, murbrokker strøet ud over gulvet.
look.i_jackslair_storagechest=Mike holder en lang knogle fra kisten op, blodig i den knudrede ende, med stumper af kød på.
