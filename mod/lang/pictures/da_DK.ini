; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Fem venner griner ved en bar af træ: Chris, med briller, holder en dåse; Josh griner på en barstol med en flaske; Sam, i en rød mønstret sweater, sidder på disken; til højre læner Matt og Mike sig ind mod de andre.
picture.t_camera_chris_01_clr_up=En selfie i en svævebanekabine: Josh, med hue, laver et V-tegn mellem Hannah, med briller, og Beth, i en lyserød jakke.
picture.t_camera_ashley_01_clr_up=Matt med armen om Ashley, der har en stribet hue på og holder en telefon; begge smiler.
picture.t_camera_hannah_01_clr_up=Et soveværelse, bogstaverne H og W på væggen: Jessica og Emily sidder ved sengen med røde krus, Ashley står med hue på, og Hannah, med briller, taler i telefon.
picture.t_camera_mike_01_clr_up=En spøg: Emily, med et bredt smil, tegner i ansigtet på Chris, der sover på en sofa med ansigtet allerede fuld af kruseduller, mens Jessica smiler bredt bag ham.
look.i_psychsession_1_interaction=En majsmark på en solrig dag: en rød lade til venstre og til højre et fugleskræmsel med stråhat, et bredt grin, et rødt halstørklæde og en krog i stedet for den ene hånd. I den mørke majs nederst til venstre, to små gule øjne.
look.i_sams_sketchbook.1=Blyantsportrætter. Til venstre: Sam, håret løst samlet bagpå, et halstørklæde om halsen, kigger til siden. Til højre: Jessica, smilende, en lang fletning over skulderen, i en parka med pelshætte.
look.i_sams_sketchbook.2=Blyantsportrætter. Til venstre: Mike, håret strøget op, skægstubbe, kigger til siden, i ternet skjorte og en jakke med hætte. Til højre: Josh, i en strikhue, et svagt smil, kigger lige frem.
look.i_sams_sketchbook.3=Blyantsportrætter. Til venstre: Emily, glat mørkt hår med midterskilning, sammenknebne læber, i rullekravesweater og pelskrave. Til højre: Chris, strittende hår og rektangulære briller, i en vatteret jakke, munden åben, som midt i et ord.
look.i_sams_sketchbook.4=Blyantsportrætter. Til venstre: Ashley, i en ribstrikket hue, langt glat hår, smiler blidt. Til højre: Matt, kort krøllet hår, smilende, i en rullekravesweater.
look.i_map=Et kort over bjerget med stederne mærket LODGE, SANATORIUM og CABLE CAR. Røde prikkede stier fører fra svævebanen til huset og videre op til sanatoriet, og ad RANGER PATH til et tårn med et radiosymbol; nederst TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Røde bogstaver smurt ud over væggene, igen og igen: DIE.
look.i_security_monitor=På skærmen afløses et mørkt badeværelse med et stort badekar af et overvågningskameras udsyn ovenfra: en snedækket træbygning, en tændt lampe over en bænk på den lange veranda, grantræer i tågen bagved. Nede i sneen, mellem skyggerne af nøgne grene, står en mørk skikkelse. Billedstøj, og skikkelsen er væk.
look.i_family_portrait=Et malet portræt i en tung udskåret ramme med en plade nedenunder: THE WASHINGTON FAMILY. Til venstre Hannah, med briller og et hjertevedhæng, og Beth, med pandehår; Hannahs hånd hviler på skulderen af en smilende kvinde forrest, med kort mørkt hår. Bagved har en mand med overskæg armen om Josh, der smiler til højre i en mørk sweater over en hvid krave.
look.i_car_lookat=I bilen ligger sæderne fulde af ting: to lyserøde papirsposer, en mønstret rejsetaske, flasker med neglelak og lotion, blade og en banan.
look.i_hotel_poster=En falmet plakat: et stort træhotel med lange verandaer og stejle gavle under en takket tinde og en stjernehimmel.
look.i_wanted_poster_lookat_new=Toppen af plakaten er revet af, og med den ansigtet på fotoet; over WANTED er der kun en mørk stump af fotoet tilbage.
look.i_missing_axe=På bjælkevæggen hænger et langt træskrin til en økse, tomt bortset fra de to holdere, der holdt den.
look.i_prom_night_photo=Et foto under grønne træer. Fra venstre: Hannah med briller, en lille sort sommerfugl tatoveret på overarmen; Sam, blond, i en blomstret kjole, rækker en hånd mod kameraet; Mike i smoking og butterfly med armen om Emily, der smiler til højre i en blå kjole.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Et falmet foto på en strand med havet og et næs bagved. Josh i midten har armene om Hannah, til venstre med briller og en lille sommerfugl tatoveret på overarmen, og om Beth, til højre, med pandehår.
look.i_minemap=Et gammelt opmålingskort over minens gange. I feltet: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Røde stempler, AREAS AT RISK DANGER og DANGER igen og igen, markerer rødt skraverede områder med håndskrevne røde noter: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). I hjørnet: BLACKWOOD MINES.
look.i_cigarstub=En skoddet cigarstump, enden brændt til aske. Det cremefarvede bånd har CLASSIC på begge sider af et mørkerødt skjold med en fjerprydelse.
look.i_mysticalsymbols=Smurt på plankerne i mørkerødt: et kraniumagtigt ansigt med blottede tænder under et bredt, forgrenet gevir, malingen løbet i dråber. Ved siden af hænger et hjortekranium med fjer.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Under invitationen et sort-hvidt foto af Mike i smoking og butterfly. Rundt om på opslagstavlen af kork, i en snirklet mørk ramme: fotos af Sam, af Emily, Hannah og Beth sammen, af en hund og katte, af Tower Bridge og landskaber; rosetter med heste, mærket 1ST og SPECIAL; to koncertbilletter til HARRY VOGUE; et kruset ansigt signeret JOSH; og sedler: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Et gammelt toetagers dukkehus af træ på en kommode: et gråt spåntag med et rundt vindue i gavlen, vinduer med skodder, en veranda langs facaden. I et vindue ovenpå en bleg nøgen dukke med lyst hår; gennem et vindue nedenunder ses svagt flere dukker, og på verandaen ligger et dukkehoved. Ved siden af, i en åben kuffert, en mørkhåret dukke i en magentafarvet kjole og en mørk bog med et kors; foran tre stablede legeklodser, der alle viser 6.
look.i_snowybench=Under den fejede sne er et hjerte skåret ind i plankerne, med bogstaver ridset ind i det.
look.i_headlessdoll=En nøgen babydukke uden hoved, plastikken snavset, plettet og revnet, et mørkt hul ved halsen, bittesmå negle malet røde. På ryggen et klistermærke med tre sommerfugle og navnet Hannah i snirklet skrift; på brystet en rund plet af små huller.
look.i_readnote=De røde bogstaver er løbet i dråber. På bagsiden et trykt brevhoved, NORTHERN PROVINCES PENITENTIARY, ved siden af et rundt segl med en vægt; det røde skinner spejlvendt igennem.
look.i_controls_lookat=Et gråt kontrolpanel af metal, slidt og ridset: bagerst måleinstrumenter mærket A, V og Hz, rækker af gule, grønne og hvide lamper, drejeomskiftere, runde trykknapper og et tastatur; til højre en blå plade med en håndtagsrille mærket STOP, NEUTRAL, RUN, og i midten en rød kontakt med nøglehul. Igen og igen smurt hen over det med røde bogstaver: DIE.
look.a_telescope=Gennem teleskopet, om natten: en snedækket skråning med klipper og fyrretræer, en høj, lys træstamme, der bøjer sig opad i midten. Nede til venstre, på en snedækket sti ved en stor klippe, står Emily og Mike tæt sammen, ansigt til ansigt: hans hånd ved hendes kind, hendes hænder ved hans talje. Langt til højre, gennem nøgne grene, sidder nogen alene på en bænk under et oplyst skur.
look.i_telescope.act2_2=Gennem teleskopet, om natten: snedækkede kampesten og bag dem hjørnet af en bjælkehytte under et tag fuldt af istapper; under tagskægget lyser en lampe over en ventilator bag tremmer. Der er ingen at se.
look.i_telescope.act2_3=Gennem teleskopet, om natten: en snedækket lysning mellem træer, hvor en gynge af en træplanke hænger i to lange reb. Bagved snedækkede klippeafsatser og nøgne buske; til venstre bregner og en vedbendklædt træstamme.
look.i_death_whistle=En udskåret fløjte formet som et kranium med brede, forgrenede gevirer. Vendt om viser den sit ansigt: to dybe øjenhuler og en rund, åben mund, kranset af hvid maling, og en kæde af hvide løkker malet ned ad panden.
look.i_view_hannah_poster_part2=Plakaten hænger på indersiden af skabslågen, plettet og krøllet; på fotoet smiler Hannah, med langt mørkt hår og mørke briller, og i hjørnet er der trykt et rundt politisegl.
look.i_smashed_vase=Skår af en mørkerød vase ligger spredt ud over gulvet; Ashley holder et af dem op, med ru, lyse brudkanter.
look.i_sams_bracelet=Et flettet snorarmbånd, blåt med et mønster af gule, røde og violette romber, lukket med en lyserød metallås.
look.i_picture_lookat=Et maleri i en mørk, revnet ramme: et træhus i to etager om natten under en stormfuld himmel, helt i mørkeblå og grå toner, med et rundt vindue højt oppe i gavlen, vinduer med skodder ovenpå og en lang veranda med rækværk nedenunder.
look.i_dollhouse_complete=Gennem dukkehusets vinduer ses dukker derinde; så, helt tæt på, fire nøgne dukker klemt sammen: en rødhåret, en mørkhåret, en blond med to hestehaler og en mørkhudet, der holder et lille videokamera. Deres øjne er sorte huller, og mørkerøde striber løber ned ad kinderne.
look.i_dollhouse_complete.open=Dukkehusets forside svinger op, og taget løftes: to etager med bittesmå værelser, hvor nøgne dukker er stillet op. Ovenpå ligger en mørkhåret dukke og en blond med briller henslængt på en sofa ved et bord med en flaske og et glas. Nedenunder knæler fire dukker sammen på et rødt tæppe, én af dem holder et lille videokamera, og endnu en dukke står for sig selv.
look.i_doll_house_lookat_keyhole=Højt oppe i dukkehusets gavl er det lille runde vindue drejet til side som et låg: bag det en rund messingplade med et nøglehul, kantet med rødt.
look.i_doll_house_key=En lille gammel jernnøgle med et hjerteformet greb og en spiralrillet skaft. Den hang på en lille messingkrog, gemt bag maleriet.
look.i_wine_rack=Et højt vinreol af træ bag et rombeformet gitter af jernbånd; de øverste brædder er slået ind og splintret, med mørke huller revet igennem dem.
look.i_wine_cellar_door=En plankedør forstærket med jernbånd; på den rustne låseplade er der intet håndtag, kun et lille firkantet hul.
look.i_secret_camera=Et lille sølvfarvet videokamera, der var gemt mellem papkasserne; dets lille røde optagelampe blinker.
look.i_doll_head=Vendt mod hende, det skaldede dukkehoved: sorte, tomme øjenhuller kranset af malede øjenvipper, rosenrøde kinder, røde læber, malingen revnet og skallende, og en mørk revne, der løber fra det ene øje ned forbi munden.
look.i_doll_head.roaches=Kakerlakker myldrer ud af dukkehovedet.
look.i_sams_sack=Under sækken er Sam, i et badehåndklæde, og sidder ubevægelig i en gammel drejestol af træ.
look.i_dead_pig_lookat=@SMG013_65747
