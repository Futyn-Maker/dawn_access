; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Ahşap bir barda gülüşen beş arkadaş: gözlüklü Chris elinde bir içecek kutusu tutuyor; Josh elinde bir şişeyle bar taburesinde gülüyor; kırmızı desenli kazaklı Sam tezgâhta oturuyor; sağda Matt ve Mike onlara doğru eğiliyor.
picture.t_camera_chris_01_clr_up=Teleferikte bir selfie: bereli Josh, gözlüklü Hannah ile pembe montlu Beth'in arasında V işareti yapıyor.
picture.t_camera_ashley_01_clr_up=Matt kolunu, çizgili bere takmış ve elinde telefon tutan Ashley'ye dolamış; ikisi de gülümsüyor.
picture.t_camera_hannah_01_clr_up=Bir yatak odası, duvarda H ve W harfleri: Jessica ve Emily ellerinde kırmızı bardaklarla yatağın yanında oturuyor, bereli Ashley ayakta duruyor, gözlüklü Hannah ise telefonla konuşuyor.
picture.t_camera_mike_01_clr_up=Bir şaka: sırıtan Emily, kanepede uyuyan ve yüzü çoktan karalanmış Chris'in yüzüne çizim yapıyor; arkasında da Jessica sırıtıyor.
look.i_psychsession_1_interaction=Güneşli bir günde bir mısır tarlası: solda kırmızı bir ahır, sağda ise hasır şapkalı, sırıtan yüzlü, boynunda kırmızı bir fular olan ve bir eli kanca olan bir korkuluk. Sol altta, karanlık mısırların arasında iki küçük sarı göz.
look.i_sams_sketchbook.1=Kurşun kalem portreler. Solda: Sam, saçları gevşekçe arkada toplanmış, boynunda bir atkı, yana bakıyor. Sağda: Jessica, gülümsüyor, omzunda uzun bir saç örgüsü, kürk kapüşonlu bir parka giymiş.
look.i_sams_sketchbook.2=Kurşun kalem portreler. Solda: Mike, saçları yukarı taranmış, kirli sakallı, yana bakıyor, ekose bir gömlek ve kapüşonlu bir ceket giymiş. Sağda: Josh, örgü bir bere takmış, belli belirsiz gülümsüyor, tam karşıya bakıyor.
look.i_sams_sketchbook.3=Kurşun kalem portreler. Solda: Emily, ortadan ayrılmış düz, koyu renk saçlar, büzülmüş dudaklar, balıkçı yaka bir kazak ve kürk bir yaka. Sağda: Chris, diken diken saçlar ve dikdörtgen gözlükler, kapitone bir ceket giymiş, ağzı sanki konuşmanın ortasındaymış gibi açık.
look.i_sams_sketchbook.4=Kurşun kalem portreler. Solda: Ashley, fitilli bir bere takmış, uzun düz saçlar, yumuşacık gülümsüyor. Sağda: Matt, kısa kıvırcık saçlar, gülümsüyor, balıkçı yaka bir kazak giymiş.
look.i_map=Dağın bir haritası; yerler LODGE, SANATORIUM ve CABLE CAR olarak etiketlenmiş. Kırmızı noktalı patikalar teleferikten dağ evine ve oradan yukarı sanatoryuma, ayrıca RANGER PATH boyunca radyo işaretli bir kuleye uzanıyor; altta TO LOWER CABLE CAR yazıyor.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Duvarlara kırmızı harflerle tekrar tekrar karalanmış: DIE.
look.i_security_monitor=Ekranda büyük küvetli karanlık bir banyonun yerini bir güvenlik kamerasının yukarıdan görüntüsü alıyor: karla kaplı ahşap bir bina, uzun verandasında bir bankın üstünde yanan bir lamba, arkada sisin içinde çam ağaçları. Aşağıda karda, çıplak dalların gölgeleri arasında karanlık bir figür duruyor. Parazit, ve figür kayboluyor.
look.i_family_portrait=Ağır, oymalı bir çerçeve içinde bir portre tablosu; altında bir levha: THE WASHINGTON FAMILY. Solda gözlüklü, kalp kolyeli Hannah ve kâküllü Beth; Hannah'nın eli önde gülümseyen, kısa koyu saçlı bir kadının omzunda duruyor. Arkada bıyıklı bir adam kolunu Josh'un omzuna atmış; Josh sağda, beyaz yakanın üstüne giydiği koyu renk kazağıyla gülümsüyor.
look.i_car_lookat=Arabanın içinde koltuklar eşyayla dolu: iki pembe kâğıt alışveriş torbası, desenli bir seyahat çantası, oje ve losyon şişeleri, dergiler ve bir muz.
look.i_hotel_poster=Solmuş bir afiş: sivri bir zirvenin ve yıldızlı bir gökyüzünün altında uzun verandaları ve dik çatı üçgenleri olan büyük, ahşap bir otel.
look.i_wanted_poster_lookat_new=Afişin üst kısmı yırtılmış, fotoğraftaki yüz de onunla birlikte gitmiş; WANTED yazısının üstünde fotoğraftan yalnızca koyu bir parça kalmış.
look.i_missing_axe=Kütük duvarda bir balta için uzun ahşap bir kutu asılı; içi boş, yalnızca onu tutan iki kelepçe duruyor.
look.i_prom_night_photo=Yeşil ağaçların altında çekilmiş bir fotoğraf. Soldan: gözlüklü Hannah, üst kolunda küçük siyah bir kelebek dövmesi; sarışın Sam, çiçekli bir elbiseyle, elini kameraya uzatıyor; smokinli, papyonlu Mike kolunu sağda mavi elbisesiyle gülümseyen Emily'ye dolamış.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Bir kumsalda çekilmiş solgun bir fotoğraf, arkada deniz ve bir burun. Ortadaki Josh kollarını soldaki gözlüklü, üst kolunda küçük bir kelebek dövmesi olan Hannah'ya ve sağdaki kâküllü Beth'e dolamış.
look.i_minemap=Madenin tünellerine ait eski bir ölçüm planı. Kutusunda: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Kırmızı damgalar, AREAS AT RISK DANGER ve tekrar tekrar DANGER, kırmızıyla taranmış alanları işaretliyor; yanlarında kırmızı el yazısıyla notlar: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). Köşede: BLACKWOOD MINES.
look.i_cigarstub=Söndürülmüş bir puro izmariti, ucu küle dönmüş. Krem rengi bandında, tüylü bir başlık resmedilmiş koyu kırmızı bir kalkanın iki yanında CLASSIC yazıyor.
look.i_mysticalsymbols=Tahtalara koyu kırmızıyla karalanmış: geniş, dallı boynuzların altında dişlerini göstermiş, kafatasına benzer bir yüz; boya damla damla akmış. Yanında tüylerle süslü bir geyik kafatası asılı.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Davetiyenin altında, smokin ve papyonlu Mike'ın siyah beyaz bir fotoğrafı. Çevresinde, süslü koyu bir çerçevedeki mantar panoda: Sam'in, birlikte Emily, Hannah ve Beth'in, bir köpekle kedilerin, Tower Bridge'in ve manzaraların fotoğrafları; üzerinde at bulunan, 1ST ve SPECIAL yazılı rozetler; iki HARRY VOGUE konser bileti; JOSH imzalı karalanmış bir surat; ve notlar: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Bir şifonyerin üstünde eski, iki katlı ahşap bir oyuncak bebek evi: alınlığında yuvarlak bir pencere olan gri kiremitli bir çatı, panjurlu pencereler, önü boyunca bir veranda. Üst kattaki bir pencerede sarı saçlı, solgun, çıplak bir bebek; alttaki bir pencereden başka bebekler belli belirsiz görünüyor, verandada da bir bebek kafası duruyor. Yanında, açık bir valizde koyu saçlı, eflatun elbiseli bir bebek ve üzerinde haç olan koyu renkli bir kitap; önünde üst üste dizilmiş, her biri 6 gösteren üç oyuncak küp.
look.i_snowybench=Süpürülen karın altında tahtalara bir kalp oyulmuş, içine harfler kazınmış.
look.i_headlessdoll=Başı olmayan çıplak bir bebek oyuncak; plastiği kirli, lekeli ve çatlak, boynunda karanlık bir delik, minicik tırnakları kırmızıya boyanmış. Sırtında üç kelebekli ve kıvrımlı harflerle Hannah yazan bir çıkartma; göğsünde küçük deliklerden oluşan yuvarlak bir alan.
look.i_readnote=Kırmızı harfler damla damla akmış. Arkasında basılı bir antet, NORTHERN PROVINCES PENITENTIARY, yanında terazili yuvarlak bir mühür; kırmızı yazı tersten görünüyor.
look.i_controls_lookat=Gri, metal bir kontrol masası, aşınmış ve çizik: arkada A, V ve Hz işaretli göstergeler; sıra sıra sarı, yeşil ve beyaz lambalar, döner şalterler, yuvarlak düğmeler ve bir tuş takımı; sağda STOP, NEUTRAL, RUN yazan, kol yuvalı mavi bir plaka, ortada anahtar yuvalı kırmızı bir şalter. Üzerine tekrar tekrar kırmızı harflerle karalanmış: DIE.
look.a_telescope=Teleskoptan, gece: kayalarla ve çamlarla kaplı karlı bir yamaç, ortada kıvrılarak yükselen uzun, açık renkli bir ağaç gövdesi. Aşağıda solda, büyük bir kayanın yanındaki karlı patikada Emily ile Mike yüz yüze, birbirlerine çok yakın duruyor: adamın eli kızın yanağında, kızın elleri adamın belinde. Uzakta sağda, çıplak dalların arasından, ışıklı bir sundurmanın altında bankta tek başına oturan biri görülüyor.
look.i_telescope.act2_2=Teleskoptan, gece: karlı kaya parçaları, arkalarında saçağından buz sarkıtları sarkan bir kütük kulübenin köşesi; saçağın altında, kafesli bir pervanenin üstünde bir lamba yanıyor. Görünürde kimse yok.
look.i_telescope.act2_3=Teleskoptan, gece: ağaçların arasında karlı bir açıklık; orada iki uzun ipe asılı tahta bir salıncak var. Arkasında karlı kaya çıkıntıları ve çıplak çalılar; solda eğrelti otları ve sarmaşıkla sarılı bir ağaç gövdesi.
