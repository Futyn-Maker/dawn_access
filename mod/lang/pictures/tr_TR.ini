picture.t_camera_sam_01_clr_up=Ahşap bir barda gülüşen beş arkadaş: gözlüklü Chris elinde bir içecek kutusu tutuyor; Josh elinde bir şişeyle bar taburesinde gülüyor; kırmızı desenli kazaklı Sam tezgâhta oturuyor; sağda Matt ve Mike onlara doğru eğiliyor.
picture.t_camera_chris_01_clr_up=Teleferikte bir selfie: bereli Josh, gözlüklü Hannah ile pembe montlu Beth'in arasında V işareti yapıyor.
picture.t_camera_ashley_01_clr_up=Matt kolunu, çizgili bere takmış ve elinde telefon tutan Ashley'ye dolamış; ikisi de gülümsüyor.
picture.t_camera_hannah_01_clr_up=Bir yatak odası, duvarda H ve W harfleri: Jessica ve Emily ellerinde kırmızı bardaklarla yatağın yanında oturuyor, bereli Ashley ayakta duruyor, gözlüklü Hannah ise telefonla konuşuyor.
picture.t_camera_mike_01_clr_up=Bir şaka: sırıtan Emily, kanepede uyuyan ve yüzü çoktan karalanmış Chris'in yüzüne çizim yapıyor; arkasında da Jessica sırıtıyor.
look.i_psychsession_1_interaction=Güneşli bir günde bir mısır tarlası: solda kırmızı bir ahır, sağda ise hasır şapkalı, sırıtan yüzlü, boynunda kırmızı bir fular olan ve bir eli kanca olan bir korkuluk. Sol altta, karanlık mısırların arasında iki küçük sarı göz.
look.i_sams_sketchbook.1=Kurşun kalem portreler. Solda: Sam, saçları gevşekçe arkada toplanmış, boynunda bir atkı, yana bakıyor. Sağda: Jessica, gülümsüyor, omzunda uzun bir saç örgüsü, kürk kapüşonlu bir parka giymiş.
look.i_sams_sketchbook.2=Kurşun kalem portreler. Solda: Mike, saçları yukarı taranmış, kirli sakallı, yana bakıyor, ekose bir gömlek ve kapüşonlu bir ceket giymiş. Sağda: Josh, örgü bir bere takmış, belli belirsiz gülümsüyor, tam karşıya bakıyor.
look.i_sams_sketchbook.3=Kurşun kalem portreler. Solda: Emily, ortadan ayrılmış düz, koyu renk saçlar, büzülmüş dudaklar, balıkçı yaka bir kazak ve kürk bir yaka. Sağda: Chris, diken diken saçlar ve dikdörtgen gözlükler, kapitone bir ceket giymiş, ağzı sanki konuşmanın ortasındaymış gibi açık.
look.i_sams_sketchbook.4=Kurşun kalem portreler. Solda: Ashley, fitilli bir bere takmış, uzun düz saçlar, yumuşacık gülümsüyor. Sağda: Matt, kısa kıvırcık saçlar, gülümsüyor, balıkçı yaka bir kazak giymiş.
look.i_map=Dağın bir haritası; yerler LODGE, SANATORIUM ve CABLE CAR olarak etiketlenmiş. Kırmızı noktalı patikalar teleferikten dağ evine ve oradan yukarı sanatoryuma, ayrıca RANGER PATH boyunca radyo işaretli bir kuleye uzanıyor; altta TO LOWER CABLE CAR yazıyor.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Duvarlara kırmızı harflerle tekrar tekrar karalanmış: DIE.
look.i_security_monitor=Ekranda büyük küvetli karanlık bir banyonun yerini bir güvenlik kamerasının yukarıdan görüntüsü alıyor: karla kaplı ahşap bir bina, uzun verandasında bir bankın üstünde yanan bir lamba, arkada sisin içinde çam ağaçları. Aşağıda karda, çıplak dalların gölgeleri arasında karanlık bir figür duruyor. Parazit, ve figür kayboluyor.
look.i_family_portrait=Ağır, oymalı bir çerçeve içinde bir portre tablosu; altında bir levha: THE WASHINGTON FAMILY. Solda gözlüklü, kalp kolyeli Hannah ve kâküllü Beth; Hannah'nın eli önde gülümseyen, kısa koyu saçlı bir kadının omzunda duruyor. Arkada bıyıklı bir adam kolunu Josh'un omzuna atmış; Josh sağda, beyaz yakanın üstüne giydiği koyu renk kazağıyla gülümsüyor.
look.i_car_lookat=Arabanın içinde koltuklar eşyayla dolu: iki pembe kâğıt alışveriş torbası, desenli bir seyahat çantası, oje ve losyon şişeleri, dergiler ve bir muz.
look.i_hotel_poster=Solmuş bir afiş: sivri bir zirvenin ve yıldızlı bir gökyüzünün altında uzun verandaları ve dik çatı üçgenleri olan büyük, ahşap bir otel.
look.i_prom_night_photo=Fotoğrafta Hannah'nın üst kolunda küçük, siyah bir kelebek dövmesi var.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Fotoğrafta Hannah'nın üst kolunda küçük bir kelebek dövmesi var.
look.i_mysticalsymbols=Tahtalara koyu kırmızıyla karalanmış: geniş, dallı boynuzların altında dişlerini göstermiş, kafatasına benzer bir yüz; boya damla damla akmış. Yanında tüylerle süslü bir geyik kafatası asılı.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Davetiyenin altında, smokin ve papyonlu Mike'ın siyah beyaz bir fotoğrafı. Çevresinde, süslü koyu bir çerçevedeki mantar panoda: Sam'in, birlikte Emily, Hannah ve Beth'in, bir köpekle kedilerin, Tower Bridge'in ve manzaraların fotoğrafları; üzerinde at bulunan, 1ST ve SPECIAL yazılı rozetler; iki HARRY VOGUE konser bileti; JOSH imzalı karalanmış bir surat; ve notlar: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Bir şifonyerin üstünde eski, iki katlı ahşap bir oyuncak bebek evi: alınlığında yuvarlak bir pencere olan gri kiremitli bir çatı, panjurlu pencereler, önü boyunca bir veranda. Üst kattaki bir pencerede sarı saçlı, solgun, çıplak bir bebek; alttaki bir pencereden başka bebekler belli belirsiz görünüyor, verandada da bir bebek kafası duruyor. Yanında, açık bir valizde koyu saçlı, eflatun elbiseli bir bebek ve üzerinde haç olan koyu renkli bir kitap; önünde üst üste dizilmiş, her biri 6 gösteren üç oyuncak küp.
look.i_snowybench=Süpürülen karın altında tahtalara bir kalp oyulmuş, içine harfler kazınmış.
look.i_headlessdoll=Başı olmayan çıplak bir bebek oyuncak; plastiği kirli, lekeli ve çatlak, boynunda karanlık bir delik, minicik tırnakları kırmızıya boyanmış. Sırtında üç kelebekli ve kıvrımlı harflerle Hannah yazan bir çıkartma; göğsünde küçük deliklerden oluşan yuvarlak bir alan.
look.i_controls_lookat=Gri, metal bir kontrol masası, aşınmış ve çizik: arkada A, V ve Hz işaretli göstergeler; sıra sıra sarı, yeşil ve beyaz lambalar, döner şalterler, yuvarlak düğmeler ve bir tuş takımı; sağda STOP, NEUTRAL, RUN yazan, kol yuvalı mavi bir plaka, ortada anahtar yuvalı kırmızı bir şalter. Üzerine tekrar tekrar kırmızı harflerle karalanmış: DIE.
look.a_telescope=Teleskoptan, gece: kayalarla ve çamlarla kaplı karlı bir yamaç, ortada kıvrılarak yükselen uzun, açık renkli bir ağaç gövdesi. Aşağıda solda, büyük bir kayanın yanındaki karlı patikada Emily ile Mike yüz yüze, birbirlerine çok yakın duruyor: adamın eli kızın yanağında, kızın elleri adamın belinde. Uzakta sağda, çıplak dalların arasından, ışıklı bir sundurmanın altında bankta tek başına oturan biri görülüyor.
look.i_telescope.act2_2=Teleskoptan, gece: karlı kaya parçaları, arkalarında saçağından buz sarkıtları sarkan bir kütük kulübenin köşesi; saçağın altında, kafesli bir pervanenin üstünde bir lamba yanıyor. Görünürde kimse yok.
look.i_telescope.act2_3=Teleskoptan, gece: ağaçların arasında karlı bir açıklık; orada iki uzun ipe asılı tahta bir salıncak var. Arkasında karlı kaya çıkıntıları ve çıplak çalılar; solda eğrelti otları ve sarmaşıkla sarılı bir ağaç gövdesi.
look.i_death_whistle=Geniş, dallı boynuzları olan kafatası biçiminde oyma bir düdük. Çevrilince yüzünü gösteriyor: beyaz boyayla çevrelenmiş iki derin göz çukuru ve yuvarlak, açık bir ağız; alnından aşağı boyanmış beyaz halkalardan bir zincir.
look.i_smashed_vase=Koyu kırmızı bir vazonun kırıkları yere saçılmış; Ashley birini kaldırmış, kırık kenarları pürüzlü ve açık renkli.
look.i_sams_bracelet=Örgü ipten bir bileklik: mavi, sarı, kırmızı ve mor eşkenar dörtgen desenli, pembemsi metal bir tokayla kapanıyor.
look.i_picture_lookat=Koyu, çatlak bir çerçevede bir tablo: fırtınalı bir gökyüzünün altında gece vakti iki katlı ahşap bir ev, baştan sona koyu mavi ve gri tonlarda; alınlığının yükseğinde yuvarlak bir pencere, üst katta panjurlu pencereler, altta korkuluklu uzun bir veranda.
look.i_dollhouse_complete=Bebek evinin pencerelerinden içerideki bebekler görünüyor; sonra yakından, birbirine sokulmuş dört çıplak bebek, hepsinin yüzü aynı bebek yüzü: kızıl saçlı, koyu saçlı, iki yandan toplu saçlı sarışın ve elinde küçük bir video kamera tutan esmer tenli bir bebek; Ashley, Emily, Jessica ve Matt gibi. Gözleri kara delikler, yanaklarından aşağı koyu kırmızı izler akıyor.
look.i_dollhouse_complete.open=Bebek evinin ön yüzü açılıyor, çatısı kalkıyor: içeride çıplak bebeklerle sahnelenmiş, iki katlı minicik odalar; hepsinin yüzü aynı bebek yüzü ama saçları arkadaşlarınki gibi. Üst katta, üzerinde şişeler ve bir bardak duran masanın yanında, koyu saçlı bir bebek kanepeye yayılmış yatıyor, yanında gözlüklü sarışın bir bebek var; Josh ve Chris gibi. Alt katta dört bebek kırmızı bir halının üstünde bir yatağa dönük diz çökmüş: küçük bir video kamerayla çekim yapan esmer tenli bir bebek, iki yandan toplu saçlı bir sarışın, koyu saçlı ve kızıl saçlı birer bebek; Matt, Jessica, Emily ve Ashley gibi. Bir bebek de bir kenarda ayakta duruyor.
look.i_doll_house_lookat_keyhole=Bebek evinin alınlığının yükseğindeki küçük yuvarlak pencere bir kapak gibi yana çevrilmiş: arkasında, kırmızıyla çevrelenmiş, anahtar deliği olan yuvarlak pirinç bir plaka.
look.i_doll_house_key=Kalp biçiminde halkası ve sarmal oluklu gövdesi olan küçük, eski bir demir anahtar. Tablonun arkasına gizlenmiş, küçük pirinç bir kancada asılıydı.
look.i_wine_rack=Demir şeritlerden eşkenar dörtgen bir kafesin arkasında uzun, ahşap bir şarap rafı; üst tahtaları kırılıp içeri göçmüş, kıymık kıymık, aralarında karanlık delikler açılmış.
look.i_wine_cellar_door=Demir kuşaklarla sağlamlaştırılmış tahta bir kapı; paslı kilit plakasında kol yok, yalnızca küçük, kare bir delik var.
look.i_doll_head=Yüzü ona dönük, kel bir bebek başı: boyalı kirpiklerle çevrili, kapkara, boş göz delikleri, pembe yanaklar, kırmızı dudaklar; boyası çatlamış, pul pul dökülüyor ve bir gözünden ağzının yanından aşağı inen koyu bir çatlak var.
look.i_doll_head.roaches=Bebeğin başından hamamböcekleri kaynaşarak çıkıyor.
look.i_sams_sack=Çuvalın altında, banyo havlusuna sarılı Sam var; eski, ahşap, döner bir sandalyede kıpırdamadan oturuyor.
look.crossedout=Bir fotoğrafın üstü çizilmiş: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=İki ahşap direğin arasına gerilmiş paslı tel örgü, Emily'nin eli sağdakini kavramış; örgünün arasından, aşağıda, loş, mavimsi bir ışıkta, molozla dolu bir tünel zemini ve üzerinde enlemesine yatan koyu renkli bir kiriş.
look.i_torn_miner_clothes=Taşların üzerinde eski bir madenci kaskı duruyor: kabarık kaburgalı, koyu renkli metal bir kubbe, geniş, paslı bir siper ve önünde yuvarlak reflektörlü küçük, pirinç bir lamba.
look.i_broken_ladder=Molozların üzerinde kırık bir merdiven enlemesine yatıyor: uzun ahşap bir yan direk ve ondan dışarı uzanan, uçları kopmuş üç paslı demir basamak; ikisinde hâlâ kıymık kıymık tahta parçaları duruyor.
look.i_sign=Tozun içinde, yıpranmış ahşap bir tabelanın kırılıp kopmuş bir parçası duruyor, kenarları pürüzlü ve kıymık kıymık; üzerinde solmuş kırmızı şablon büyük harflerle bir kelimenin sonu, GER, ve altında EDGE.
look.i_peer_at_head=Koyu renkli tel örgünün ardından, kaba tahtaların arasından: ötede, taşlı bir zeminde, üstü brandayla örtülü bir varil, daha geride ise ahşap bir korkuluk ve moloz yığınları.
look.i_peer_at_wheel=İki direğin arasındaki paslı tel örgünün ardından: ötede bir mağara, içinde kırık iskeleler arasında büyük, eski, ahşap bir su çarkı; dibinde karanlıktan bir alev parlıyor ve sönüyor.
look.i_scarecrow_lookat=Bir korkuluk: kolları uçları ince dallara ayrılan çıplak dallar, gövdesi kana bulanmış siyah bir plastik torba. Başı, boynundan iple bağlanmış açık renkli bir beze sarılı; bezin arasından çürüyen bir yüz görünüyor: çökük bir burun ve çürük dişli açık bir ağız, bir yanı kana bulanmış. Yıpranmış kahverengi bir şapkanın altından uzun siyah saçlar sarkıyor.
look.i_scarecrow_lookat.clown=Bir korkuluk: kolları uçları ince dallara ayrılan çıplak dallar, gövdesi kana bulanmış siyah bir plastik torba. Başı bir palyaço maskesi: beyaz, buruşuk bir yüz, alnın yukarısına doğru yüksek kemerler halinde boyanmış mor kaşlar, çevresi morla çizilmiş koyu göz delikleri, kırmızı bir burun ve uzun sivri dişlerden oluşan, köşeleri kırmızı geniş bir sırıtış; çenesi kandan kararmış.
look.i_scarecrow_lookat.zombie=Bir korkuluk: kolları uçları ince dallara ayrılan çıplak dallar, gövdesi kana bulanmış siyah bir plastik torba. Başı çürüyen bir zombi kafası: kel, gri-yeşil benekli bir deri, boş beyaz gözler ve dişleri görünen ardına kadar açık bir ağız.
look.i_dead_crow_lookat=Kana bulanmış karın üzerinde iki ölü karga yatıyor; parçalanmış ve kanlar içinde, kanatları açılmış, bağırsakları dışarı taşmış; çevrelerine siyah tüyler saçılmış.
look.i_chair_and_blood=Beton zeminde ayakları kırılmış ahşap bir tabure devrilmiş yatıyor; yanında zincire bağlı, açık bir demir pranga. Zemine kan sıçramış ve damlamış; yan yatmış bir fener hâlâ yanıyor.
look.i_fake_torso=Gri ekoseli gömlekli bir bedenin üst yarısı, kolları yukarı uzanmış hâlde asılı duruyor; belden aşağısı yok, yalnızca kanlı, yırtık bir kesik var. Arkasında ortasından delik açılmış bir tahta duruyor.
look.i_saw_blades=Kocaman bir daire testere bıçağı yere yatık duruyor, paslı çeliği koyu renkli kana bulanmış; arkasında tel örgü bir çit.
look.i_dead_wolf_inspect=Bir hücre kapısının parmaklıklarında ölü bir kurt asılı: göğsü ve karnı boydan boya yarılmış ve boşalmış, başı sarkmış, çenesi açık; altında, bir kan gölünün içinde bağırsakları yatıyor.
look.i_damaged_doors=Panelleri göçmüş ağır, çelik bir hücre kapısı: üzerinden aşağı büyük, koyu renkli bir kan lekesi akıyor, üstteki küçük kapağın altından kan damlamış, metale derin pençe izleri kazınmış.
look.i_sanlookat=Tel örgü bir çit: solda koyu renkli bir direk, üzerinden enine geçen paslı bir demir çubuk. Örgünün arasından, ötedeki karda, metal tırabzanlı kısa bir beton merdiven.
look.i_oilflask=Gözlerin hemen önüne kaldırılmış, uzun, paslı, kırmızı bir metal bidon. Yan yüzündeki solmuş oval amblemde NWM harflerinin çevresinde North West, altında Mining yazıyor; dar yüzündeki kırmızı, baklava biçimli işarette FLAMMABLE LIQUID yazıyor.
look.i_oilflask.roaches=Hamamböcekleri bidondan çıkıp üzerinde dolaşıyor ve Sam onu fırlatıp atıyor.
