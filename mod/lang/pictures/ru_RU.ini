; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Пятеро друзей смеются у деревянной барной стойки: Крис в очках держит банку; Джош хохочет на барном стуле с бутылкой; Сэм в красном свитере с узором сидит на стойке; справа к ним склонились Мэтт и Майк.
picture.t_camera_chris_01_clr_up=Селфи в кабинке канатной дороги: Джош в шапке показывает знак «V» между Ханной в очках и Бет в розовой куртке.
picture.t_camera_ashley_01_clr_up=Мэтт обнимает Эшли; на ней полосатая шапка, в руке телефон; оба улыбаются.
picture.t_camera_hannah_01_clr_up=Спальня, на стене буквы H и W: Джессика и Эмили сидят у кровати с красными стаканчиками, Эшли стоит в шапке, а Ханна в очках говорит по телефону.
picture.t_camera_mike_01_clr_up=Розыгрыш: Эмили с ухмылкой рисует на лице Криса, который спит на диване, лицо уже изрисовано; за ним ухмыляется Джессика.
look.i_psychsession_1_interaction=Кукурузное поле в солнечный день: слева красный амбар, справа пугало в соломенной шляпе, с ухмыляющимся лицом, красным платком на шее и крюком вместо руки. Внизу слева, в тёмной кукурузе, два маленьких жёлтых глаза.
look.i_sams_sketchbook.1=Карандашные портреты. Слева: Сэм — волосы небрежно собраны, на шее шарф, взгляд в сторону. Справа: Джессика — улыбается, длинная коса на плече, парка с меховым капюшоном.
look.i_sams_sketchbook.2=Карандашные портреты. Слева: Майк — зачёсанные вверх волосы, щетина, взгляд в сторону, клетчатая рубашка и куртка с капюшоном. Справа: Джош — вязаная шапка, лёгкая улыбка, смотрит прямо.
look.i_sams_sketchbook.3=Карандашные портреты. Слева: Эмили — прямые тёмные волосы на прямой пробор, поджатые губы, водолазка и меховой воротник. Справа: Крис — торчащие волосы, прямоугольные очки, стёганая куртка, рот приоткрыт, будто на полуслове.
look.i_sams_sketchbook.4=Карандашные портреты. Слева: Эшли — шапка в рубчик, длинные прямые волосы, мягкая улыбка. Справа: Мэтт — короткие кудрявые волосы, улыбается, свитер с высоким воротом.
look.i_map=Карта горы с подписями LODGE, SANATORIUM и CABLE CAR. Красные пунктиры ведут от канатной дороги к дому и выше к лечебнице, а по тропе RANGER PATH — к вышке со значком радио; внизу надпись TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=На стенах красными буквами снова и снова: DIE.
look.i_security_monitor=На экране тёмная комната с большой ванной сменяется видом с камеры наблюдения сверху: деревянное здание под снегом, на длинном крыльце над скамейкой горит лампа, позади ели в тумане. Внизу на снегу, среди теней голых ветвей, стоит тёмная фигура. Помехи — и фигура исчезла.
look.i_family_portrait=Живописный портрет в тяжёлой резной раме, под ним табличка: THE WASHINGTON FAMILY. Слева Ханна в очках, с кулоном-сердечком, и Бет с чёлкой; рука Ханны лежит на плече улыбающейся женщины впереди, темноволосой, с короткой стрижкой. Позади мужчина с усами обнимает за плечи Джоша, который улыбается справа, в тёмном свитере поверх белого воротника.
look.i_car_lookat=В машине на сиденьях свалены вещи: два розовых бумажных пакета из магазина, дорожная сумка в узорах, флаконы лака для ногтей и лосьона, журналы и банан.
look.i_hotel_poster=Выцветший плакат: большой деревянный отель с длинными верандами и островерхими фронтонами под зубчатой вершиной и звёздным небом.
look.i_wanted_poster_lookat_new=Верх плаката оторван, а с ним и лицо на фотографии; над словом WANTED остался только тёмный клочок снимка.
look.i_missing_axe=На бревенчатой стене висит длинный деревянный футляр для топора — пустой, только два крепления, на которых он держался.
look.i_prom_night_photo=Фотография под зелёными деревьями. Слева направо: Ханна в очках, на плече маленькая чёрная татуировка-бабочка; светловолосая Сэм в платье в цветочек тянет руку к камере; Майк в смокинге и галстуке-бабочке обнимает Эмили, она улыбается справа, в синем платье.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Выцветшая фотография на пляже, позади море и мыс. Джош посередине обнимает Ханну — слева, в очках, с маленькой татуировкой-бабочкой на плече — и Бет справа, с чёлкой.
look.i_minemap=Старый план выработок шахты. В рамке: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Красные штампы, AREAS AT RISK DANGER и снова и снова DANGER, отмечают закрашенные красным участки, рядом красные пометки от руки: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). В углу: BLACKWOOD MINES.
look.i_cigarstub=Окурок сигары, кончик выгорел до пепла. На кремовом колечке по обе стороны от тёмно-красного щита с головным убором из перьев написано CLASSIC.
look.i_mysticalsymbols=На досках тёмно-красной краской намалёвано лицо, похожее на череп, с оскаленными зубами, под широкими ветвистыми рогами; краска стекает потёками. Рядом висит олений череп с перьями.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Под приглашением — чёрно-белое фото Майка в смокинге и с галстуком-бабочкой. Вокруг на пробковой доске в резной тёмной раме: фото Сэм; Эмили, Ханны и Бет вместе; собаки и кошек, Тауэрского моста и пейзажей; наградные розетки с лошадьми и надписями 1ST и SPECIAL; два билета на концерт HARRY VOGUE; рожица с подписью JOSH; записки: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Старый двухэтажный деревянный кукольный дом на комоде: серая черепичная крыша с круглым окошком во фронтоне, окна со ставнями, крыльцо во всю ширину. В окне второго этажа — бледная голая кукла со светлыми волосами; в окне внизу смутно видны другие куклы, на крыльце лежит кукольная голова. Рядом в открытом чемодане — темноволосая кукла в малиновом платье и тёмная книга с крестом; перед ним три кубика один на другом, на каждом 6.
look.i_snowybench=Под сметённым снегом на досках вырезано сердце, внутри нацарапаны буквы.
look.i_headlessdoll=Голая кукла-младенец без головы: пластик грязный, в пятнах и трещинах, на шее тёмная дыра, крошечные ногти накрашены красным. На спине — наклейка с тремя бабочками и именем Hannah, выведенным с завитками; на груди — круглая россыпь мелких отверстий.
look.i_readnote=Красные буквы растеклись потёками. На обороте — печатный бланк: NORTHERN PROVINCES PENITENTIARY, рядом круглая печать с весами; красная надпись просвечивает задом наперёд.
look.i_controls_lookat=Серый металлический пульт управления, потёртый и исцарапанный: вдоль задней кромки циферблаты с отметками A, V и Hz, ряды жёлтых, зелёных и белых лампочек, поворотные переключатели, круглые кнопки и цифровая клавиатура; справа синяя пластина с прорезью для рычага и надписями STOP, NEUTRAL, RUN, посередине красный переключатель с прорезью для ключа. По пульту снова и снова намалёвано красными буквами: DIE.
look.a_telescope=В телескопе — ночь, заснеженный склон, скалы и ели, посередине вверх изгибается высокий светлый ствол. Внизу слева, на снежной тропе у большой скалы, вплотную друг к другу стоят Эмили и Майк: его рука у её щеки, её руки у него на поясе. Далеко справа, за голыми ветками, под освещённым навесом одиноко сидит на скамейке кто-то.
look.i_telescope.act2_2=В телескопе — ночь, заснеженные валуны, за ними угол бревенчатой хижины под крышей с сосульками; под карнизом горит лампа, под ней вентилятор за решёткой. Никого не видно.
look.i_telescope.act2_3=В телескопе — ночная заснеженная поляна среди деревьев, на двух длинных верёвках висят деревянные качели-доска. За ними заснеженные каменные уступы и голые кусты, слева папоротник и ствол дерева, увитый плющом.
look.i_death_whistle=Резной свисток в форме черепа с широкими ветвистыми рогами. Повёрнутый, он показывает лицо: две глубокие глазницы и круглый открытый рот, обведённые белой краской, и цепочку белых петель, нарисованную по лбу.
look.i_view_hannah_poster_part2=Плакат висит на внутренней стороне дверцы шкафчика, мятый, в пятнах; на фото улыбается Ханна — длинные тёмные волосы, очки в тёмной оправе, — в углу напечатана круглая полицейская печать.
look.i_smashed_vase=По полу разбросаны осколки тёмно-красной вазы; Эшли подняла один из них — края скола шершавые и светлые.
look.i_sams_bracelet=Плетёный браслет из шнура: синий, с узором из жёлтых, красных и фиолетовых ромбиков, с розоватой металлической застёжкой.
look.i_picture_lookat=Картина в тёмной потрескавшейся раме: ночью под грозовым небом двухэтажный деревянный дом в тёмно-синих и серых тонах — круглое окошко высоко во фронтоне, окна со ставнями наверху, внизу длинное крыльцо с перилами.
look.i_dollhouse_complete=В окнах кукольного дома видны куклы; потом вблизи: четыре голые куклы сбились в кучку — рыжая, темноволосая, светлая с хвостиками и смуглая с маленькой видеокамерой в руках. Глаза у них — чёрные дыры, по щекам тянутся тёмно-красные потёки.
look.i_dollhouse_complete.open=Фасад кукольного дома распахивается, крыша приподнимается: внутри два этажа крошечных комнат, где расставлены голые куклы. Наверху темноволосая кукла и светловолосая в очках развалились на диване у столика с бутылкой и стаканом. Внизу четыре куклы стоят на коленях на красном ковре, одна держит маленькую видеокамеру, ещё одна кукла стоит поодаль.
look.i_doll_house_lookat_keyhole=Высоко во фронтоне кукольного дома круглое окошко отведено в сторону, как крышка: за ним — круглая латунная пластинка с замочной скважиной в красном ободке.
look.i_doll_house_key=Маленький старый железный ключ: кольцо в форме сердечка, стержень с витыми бороздками. Он висел на маленьком латунном крючке, спрятанный за картиной.
look.i_wine_rack=Высокий деревянный винный стеллаж за решёткой из железных полос ромбами; верхние доски проломлены и расщеплены, сквозь них зияют тёмные дыры.
look.i_wine_cellar_door=Дощатая дверь, скреплённая железными полосами; на ржавой накладке замка нет ручки — только маленькое квадратное отверстие.
look.i_secret_camera=Небольшая серебристая видеокамера, спрятанная между картонными коробками; на ней мигает красный огонёк записи.
look.i_doll_head=Повёрнутая лицом лысая кукольная голова: пустые чёрные глазницы с нарисованными ресницами, румяные щёки, красные губы, краска потрескалась и облезает, от одного глаза мимо рта тянется тёмная трещина.
look.i_doll_head.roaches=Из кукольной головы полезли тараканы.
look.i_sams_sack=Под мешком — Сэм в банном полотенце, она неподвижно сидит в старом деревянном вращающемся кресле.
look.i_dead_pig_lookat=@SMG013_65747
