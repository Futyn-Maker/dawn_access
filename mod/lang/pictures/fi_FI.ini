; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Viisi ystävää nauraa puisen baaritiskin ääressä: silmälasipäinen Chris pitelee tölkkiä; Josh nauraa baarijakkaralla pullo kädessään; punaiseen kuviolliseen villapaitaan pukeutunut Sam istuu tiskillä; oikealla Matt ja Mike nojautuvat lähemmäs.
picture.t_camera_chris_01_clr_up=Selfie köysiradan vaunussa: pipopäinen Josh näyttää V-merkkiä silmälasipäisen Hannahin ja vaaleanpunaiseen takkiin pukeutuneen Bethin välissä.
picture.t_camera_ashley_01_clr_up=Matt pitää kättään Ashleyn ympärillä; Ashleyllä on raidallinen pipo ja kädessään puhelin; molemmat hymyilevät.
picture.t_camera_hannah_01_clr_up=Makuuhuone, seinällä kirjaimet H ja W: Jessica ja Emily istuvat sängyn vieressä punaiset mukit käsissään, Ashley seisoo pipo päässä, ja silmälasipäinen Hannah puhuu puhelimessa.
picture.t_camera_mike_01_clr_up=Jekku: virnistävä Emily piirtää sohvalla nukkuvan Chrisin kasvoihin, jotka on jo töherretty täyteen, ja Jessica virnistää hänen takanaan.
look.i_psychsession_1_interaction=Maissipelto aurinkoisena päivänä: vasemmalla punainen lato ja oikealla linnunpelätti, jolla on olkihattu, virnistävät kasvot, punainen kaulahuivi ja toisen käden paikalla koukku. Pimeässä maississa vasemmassa alakulmassa kaksi pientä keltaista silmää.
look.i_sams_sketchbook.1=Lyijykynämuotokuvia. Vasemmalla: Sam, hiukset löyhästi taakse sidottuina, kaulassa huivi, katse sivulle. Oikealla: Jessica, hymyilevä, pitkä letti olalla, turkishuppuisessa parkatakissa.
look.i_sams_sketchbook.2=Lyijykynämuotokuvia. Vasemmalla: Mike, hiukset ylös kammattuina, sänkinen, katse sivulle, ruutupaidassa ja hupullisessa takissa. Oikealla: Josh, neulottu pipo päässä, heikko hymy, katse suoraan eteenpäin.
look.i_sams_sketchbook.3=Lyijykynämuotokuvia. Vasemmalla: Emily, suorat tummat hiukset keskijakauksella, huulet supussa, poolopaidassa ja turkiskauluksessa. Oikealla: Chris, piikikkäät hiukset ja suorakulmaiset silmälasit, tikkitakissa, suu auki kuin kesken sanan.
look.i_sams_sketchbook.4=Lyijykynämuotokuvia. Vasemmalla: Ashley, ribbineulottu pipo päässä, pitkät suorat hiukset, lempeä hymy. Oikealla: Matt, lyhyet kiharat hiukset, hymyilevä, poolokauluksisessa villapaidassa.
look.i_map=Vuoren kartta, johon on merkitty paikat LODGE, SANATORIUM ja CABLE CAR. Punaiset pisteviivapolut johtavat köysiradalta mökille ja edelleen ylös parantolaan sekä RANGER PATH -polkua pitkin torniin, jossa on radiosymboli; alareunassa TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Punaisia kirjaimia töhrittynä seinille yhä uudelleen: DIE.
look.i_security_monitor=Ruudulla pimeä kylpyhuone suurine ammeineen vaihtuu valvontakameran kuvaan ylhäältä: lumen peittämä puurakennus, pitkällä kuistilla palaa lamppu penkin yllä, taustalla kuusia sumussa. Alhaalla lumessa, paljaiden oksien varjojen keskellä, seisoo tumma hahmo. Kuva rätisee, ja hahmo on poissa.
look.i_family_portrait=Maalattu muotokuva raskaissa kaiverretuissa kehyksissä, alla laatta: THE WASHINGTON FAMILY. Vasemmalla silmälasipäinen Hannah sydänriipus kaulassaan ja otsatukkainen Beth; Hannahin käsi lepää edessä hymyilevän lyhyt- ja tummatukkaisen naisen olalla. Takana viiksekäs mies pitää kättään Joshin olkapäillä; Josh hymyilee oikealla tummassa neuleessa, jonka alta näkyy valkoinen kaulus.
look.i_car_lookat=Auton istuimille on kasattu tavaraa: kaksi vaaleanpunaista paperista ostoskassia, kuviollinen matkalaukku, kynsilakka- ja voidepulloja, lehtiä ja banaani.
look.i_hotel_poster=Haalistunut juliste: suuri puinen hotelli pitkine verantoineen ja jyrkkine päätykolmioineen rosoisen huipun ja tähtitaivaan alla.
look.i_prom_night_photo=Kuvassa Hannahilla on olkavarressaan pieni musta perhostatuointi.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Kuvassa Hannahilla on olkavarressaan pieni perhostatuointi.
look.i_mysticalsymbols=Lankkuihin töhritty tummanpunaisella: kallomaiset kasvot irvessä hampain leveiden, haarautuvien sarvien alla, maali valunut noroiksi. Vieressä riippuu sulin koristeltu peuran kallo.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Kutsun alla mustavalkoinen valokuva Mikesta smokissa ja rusetissa. Sen ympärillä korkkitaululla, koristeellisessa tummassa kehyksessä: kuvia Samista, Emilystä, Hannahista ja Bethistä yhdessä, koirasta ja kissoista, Tower Bridgestä ja maisemista; ruusukkeita, joissa on hevosia ja tekstit 1ST ja SPECIAL; kaksi HARRY VOGUE -konserttilippua; JOSH-nimellä allekirjoitettu töherretty naama; ja lappuja: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Vanha kaksikerroksinen puinen nukkekoti lipaston päällä: harmaa paanukatto, jonka päätykolmiossa on pyöreä ikkuna, ikkunaluukulliset ikkunat ja kuisti talon edustalla. Yläkerran ikkunassa kalpea, alaston, vaaleatukkainen nukke; alakerran ikkunasta näkyy hämärästi lisää nukkeja, ja kuistilla on nuken pää. Vieressä avoimessa matkalaukussa tummatukkainen nukke magentanvärisessä mekossa ja tumma kirja, jossa on risti; edessä kolme päällekkäin pinottua palikkaa, joissa jokaisessa näkyy 6.
look.i_snowybench=Pyyhityn lumen alla lankkuihin on kaiverrettu sydän, ja sen sisään on raaputettu kirjaimia.
look.i_headlessdoll=Alaston, päätön vauvanukke: muovi likaista, tahraista ja haljennutta, kaulassa tumma reikä ja pikkuruiset kynnet maalattu punaisiksi. Selässä tarra, jossa on kolme perhosta ja kiemuraisin kirjaimin nimi Hannah; rinnassa pyöreä alue pieniä reikiä.
look.i_controls_lookat=Harmaa metallinen ohjauspöytä, kulunut ja naarmuinen: takareunassa mittareita, joissa lukee A, V ja Hz, rivit keltaisia, vihreitä ja valkoisia merkkivaloja, kiertokytkimiä, pyöreitä painonappeja ja numeronäppäimistö; oikealla sininen levy, jossa on vivun ura ja tekstit STOP, NEUTRAL, RUN, ja keskellä punainen kytkin, jossa on avaimenreikä. Sen yli on töhritty yhä uudelleen punaisin kirjaimin: DIE.
look.a_telescope=Kaukoputkessa yö: luminen rinne kallioineen ja mäntyineen, keskellä kaartuu ylös korkea, vaalea puunrunko. Alhaalla vasemmalla, lumisella polulla ison kiven vieressä, Emily ja Mike seisovat tiiviisti kasvokkain: miehen käsi naisen poskella, naisen kädet miehen vyötäröllä. Kaukana oikealla, paljaiden oksien takana, joku istuu yksin penkillä valaistun katoksen alla.
look.i_telescope.act2_2=Kaukoputkessa yö: lumisia kivenjärkäleitä, ja niiden takana hirsimökin nurkka jääpuikkojen reunustaman katon alla; räystään alla palaa lamppu ristikon takana olevan tuulettimen yläpuolella. Ketään ei näy.
look.i_telescope.act2_3=Kaukoputkessa yö: luminen aukio puiden keskellä, ja siellä kahdesta pitkästä köydestä roikkuu lautakeinu. Sen takana lumisia kallionkielekkeitä ja paljaita pensaita; vasemmalla saniaisia ja muratin peittämä puunrunko.
look.i_death_whistle=Kaiverrettu pilli, joka on kallon muotoinen ja jolla on leveät, haarautuvat sarvet. Käännettynä se näyttää kasvonsa: kaksi syvää silmäkuoppaa ja pyöreä avoin suu valkoisella maalilla reunustettuina sekä otsaan maalattu valkoisten silmukoiden ketju.
look.i_smashed_vase=Tummanpunaisen maljakon sirpaleita on levällään lattialla; Ashley nostaa yhden ylös, sen murtuneet reunat karheat ja vaaleat.
look.i_sams_bracelet=Punottu nyörirannekoru: sininen, keltaisin, punaisin ja violetein vinoneliöin kuvioitu, kiinni vaaleanpunertavalla metallilukolla.
look.i_picture_lookat=Maalaus tummissa, halkeilleissa kehyksissä: kaksikerroksinen puutalo yöllä myrskyisen taivaan alla, kokonaan tummansinisin ja harmain sävyin, päätykolmion korkealla pyöreä ikkuna, yläkerrassa luukulliset ikkunat ja alhaalla pitkä kaiteellinen kuisti.
look.i_dollhouse_complete=Nukkekodin ikkunoista näkyy nukkeja sisällä; sitten läheltä neljä alastonta nukkea tiiviisti yhdessä, kaikilla samat nuken kasvot: punatukkainen, tummatukkainen, saparopäinen vaalea ja tummaihoinen, jolla on kädessään pieni videokamera, kuin Ashley, Emily, Jessica ja Matt. Niiden silmät ovat mustia aukkoja, ja poskille valuu tummanpunaisia juovia.
look.i_dollhouse_complete.open=Nukkekodin etuseinä aukeaa ja katto nousee: kaksi kerrosta pikkuruisia huoneita, joihin on aseteltu alastomia nukkeja, kaikilla samat nuken kasvot mutta ystävien hiukset. Yläkerrassa, pöydän vieressä, jolla on pulloja ja lasi, tummatukkainen nukke lojuu sohvalla silmälasipäisen vaalean nuken vieressä, kuin Josh ja Chris. Alakerrassa neljä nukkea polvistuu punaisella matolla sänkyyn päin: tummaihoinen, joka kuvaa pienellä videokameralla, saparopäinen vaalea, tummatukkainen ja punatukkainen, kuin Matt, Jessica, Emily ja Ashley; vielä yksi nukke seisoo erillään.
look.i_doll_house_lookat_keyhole=Nukkekodin päätykolmion korkealla pieni pyöreä ikkuna on käännetty sivuun kuin kansi: sen takana pyöreä messinkilevy, jossa on avaimenreikä punaisen reunuksen sisällä.
look.i_doll_house_key=Pieni vanha rautainen avain, jonka kädensija on sydämen muotoinen ja varressa kierteiset urat. Se roikkui pienessä messinkikoukussa maalauksen taakse piilotettuna.
look.i_wine_rack=Korkea puinen viiniteline rautanauhoista tehdyn vinoneliöristikon takana; sen ylälaudat on lyöty sisään ja säleiksi, ja niiden läpi ammottaa tummia reikiä.
look.i_wine_cellar_door.act5_3=Lankkuovi, jota tukevat rautavanteet; sen ruosteisessa lukkolevyssä ei ole kahvaa, vain pieni neliönmuotoinen reikä.
look.i_doll_head=Häntä kohti käännettynä kalju nuken pää: mustat, tyhjät silmäaukot maalattujen ripsien ympäröiminä, punakat posket, punaiset huulet, maali halkeillut ja hilseilevä, ja tumma halkeama, joka kulkee toisesta silmästä alas suun ohi.
look.i_doll_head.roaches=Nuken päästä vyöryy torakoita.
look.i_sams_sack=Säkin alla on Sam kylpypyyhkeeseen kääriytyneenä, liikkumatta istumassa vanhassa puisessa pyörivässä tuolissa.
look.crossedout=Yksi kuva on yliviivattu: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Ruosteinen metalliverkko pingotettuna kahden puupylvään väliin, Emilyn käsi puristaa oikeanpuoleista; sen läpi alhaalla, himmeässä sinertävässä valossa, kivenmurikoiden peittämä tunnelin pohja ja sen poikki makaava tumma palkki.
look.i_torn_miner_clothes=Kivillä lojuu vanha kaivosmiehen kypärä: tumma metallikupu, jossa on koholla olevat rivat, leveä ruosteinen lieri ja edessä pieni messinkilamppu, jossa on pyöreä heijastin.
look.i_broken_ladder=Rikkinäiset tikkaat makaavat poikittain kivenmurikoiden päällä: pitkä puinen sivupuu, josta törröttää kolme ruosteista rautapuolaa, niiden päät katkenneina; kahdessa niistä on yhä sälöisiä puunkappaleita.
look.i_sign=Pölyssä lojuu irti lohjennut pala sään kuluttamaa puukylttiä, sen reunat rosoiset ja sälöillä; siinä on haalistunein punaisin sabluunakirjaimin sanan loppu, GER, ja sen alla EDGE.
look.i_peer_at_head=Tumman metalliverkon läpi, karkeiden lankkujen välistä: niiden takana kivisellä lattialla tynnyri, jonka päällä on pressu, ja kauempana puinen kaide ja kivenmurikakasoja.
look.i_peer_at_wheel=Ruosteisen metalliverkon läpi kahden pylvään välistä: taustalla luola ja siellä suuri vanha puinen vesiratas rikkinäisten rakennustelineiden keskellä; sen juurella pimeydestä leimahtaa liekki ja sammuu.
look.i_scarecrow_lookat=Variksenpelätin: kädet paljaita oksia, jotka päättyvät risuihin, vartalo verellä tahrittu musta muovipussi. Pää on kääritty vaaleaan kankaaseen, joka on sidottu kaulasta köydellä; sen läpi kuultavat mätänevät kasvot, ontto nenä ja avoin suu täynnä lahonneita hampaita, toinen puoli veren kyllästämä. Kuluneen ruskean hatun alta roikkuu pitkä musta tukka.
look.i_scarecrow_lookat.clown=Variksenpelätin: kädet paljaita oksia, jotka päättyvät risuihin, vartalo verellä tahrittu musta muovipussi. Pää on klovnin naamari: valkoiset, ryppyiset kasvot, violetit kulmakarvat maalattuina korkeiksi kaariksi ylös otsalle, tummat violetilla rajatut silmäaukot, punainen nenä ja leveä virne pitkine terävine hampaineen, suupielistä punainen, leuka tumma verestä.
look.i_scarecrow_lookat.zombie=Variksenpelätin: kädet paljaita oksia, jotka päättyvät risuihin, vartalo verellä tahrittu musta muovipussi. Pää on mätänevän zombin pää: kalju, harmaanvihreä laikukas iho, tyhjät valkoiset silmät ja ammottava hampainen suu.
look.i_dead_crow_lookat=Kaksi kuollutta varista makaa verisellä lumella revittyinä ja verisinä, siivet levällään, sisälmykset pursuamassa ulos; niiden ympärillä on irtonaisia mustia sulkia.
look.i_chair_and_blood=Betonilattialla lojuu kumoon kaatunut puujakkara, sen jalat katkenneet; vieressä avoin rautakahle ketjussa. Lattialla on roiskeita ja tippoja verta, ja lyhty makaa kyljellään yhä palaen.
look.i_fake_torso=Harmaaseen ruutupaitaan pukeutuneen ruumiin yläpuolisko roikkuu kädet ojennettuina ylös; vyötärön alapuolella ei ole muuta kuin repaleinen, verinen leikkaus. Sen takana on lauta, johon on sahattu reikä.
look.i_saw_blades=Valtava pyörösahanterä lojuu lappeellaan, sen ruosteinen teräs tumman veren tahrima; sen takana verkkoaita.
look.i_dead_wolf_inspect=Kuollut susi roikkuu sellin oven kaltereissa: sen rinta ja vatsa on revitty auki ja tyhjiksi, pää riippuu leuat ammollaan, ja sen alla sisälmykset lojuvat verilammikossa.
look.i_damaged_doors=Raskas teräksinen sellin ovi lommoisine paneeleineen: sitä pitkin valuu suuri tumma veritahra, ylhäällä olevan pienen luukun alta on tihkunut verta, ja metalliin on raapittu syviä kynnenjälkiä.
look.i_sanlookat=Verkkoaita: vasemmalla tumma pylväs, poikki kulkee ruosteinen tanko. Verkon läpi, takana lumessa, lyhyt betoniporras, jossa on metallikaide.
look.i_oilflask=Aivan silmien eteen nostettuna korkea ruosteinen punainen metallikanisteri. Kyljessä haalistuneessa soikeassa tunnuksessa lukee North West kirjainten NWM ympärillä ja alla Mining; kapeassa kyljessä punaisessa vinoneliön muotoisessa kyltissä lukee FLAMMABLE LIQUID.
look.i_oilflask.roaches=Torakoita kömpii ulos ja pitkin kanisteria, ja hän heittää sen kauemmas.
look.i_admin_area_jacksdoor_lookat_reader=Musta kortinlukija seinällä puuoven vieressä, sen pienessä punaisessa näytössä lukee LOCKED; ovessa pienen ikkunan alla ruosteinen vihreä kyltti: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=Ruumishuoneen ulos vedetyllä tasolla makaa selällään mätänevä ruumis: harmaat, kutistuneet kasvot ja ammottava suu, ympärillä kiinni liimautunutta tummaa tukkaa; harmaa paita ja ruosteinen taso ovat vanhan veren tahrimia.
look.i_jackslair_exit_lock_lookat=Vinoneliöverkkoinen rautaportti on lukittu: iso, ruosteinen riippulukko roikkuu haassa puisen ovenkarmin vieressä.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Kaksi MISSING-julistetta: HANNAH WASHINGTON ja BETH WASHINGTON; Hannahin julisteessa lukee: She has glasses, and has a tattoo of a butterfly on her right shoulder. Keltainen lappu: NEVER FORGET. Lehtileikkeitä: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. Neljän tytön valokuvassa Hannah on ympyröity punaisella.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_wine_cellar_door.act2_4=Lankkuovi, jota tukevat rautavanteet; sen ruosteisessa lukkolevyssä on pyöreä ovennuppi.
