; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=五个朋友在木制吧台边欢笑：戴眼镜的克里斯多夫拿着一罐饮料；约书亚拿着一个瓶子，坐在吧台凳上大笑；穿红色花纹毛衣的萨曼莎坐在台面上；马修和迈克在右边探过身来。
picture.t_camera_chris_01_clr_up=缆车里的自拍：戴毛线帽的约书亚在戴眼镜的汉娜和穿粉色外套的贝丝之间比出V字手势。
picture.t_camera_ashley_01_clr_up=马修搂着阿什莉，阿什莉戴着条纹毛线帽，拿着手机；两人都在微笑。
picture.t_camera_hannah_01_clr_up=一间卧室，墙上有字母H和W：杰西卡和艾米丽拿着红色杯子坐在床边，阿什莉戴着毛线帽站着，戴眼镜的汉娜在打电话。
picture.t_camera_mike_01_clr_up=恶作剧：艾米丽咧嘴笑着，在克里斯多夫脸上涂画；他睡在沙发上，脸上已被画过，杰西卡在他身后咧嘴笑着。
look.i_psychsession_1_interaction=晴天里的一片玉米地：左边是一座红色谷仓，右边是一个戴草帽的稻草人，脸上咧嘴笑着，系着红色围巾，一只手是钩子。左下角的黑暗玉米丛中，有两只小小的黄色眼睛。
look.i_sams_sketchbook.1=铅笔肖像画。左边：萨曼莎，头发松松地束在脑后，脖子上围着围巾，目光望向一旁。右边：杰西卡，面带微笑，一条长辫子搭在肩上，穿着带毛皮兜帽的派克大衣。
look.i_sams_sketchbook.2=铅笔肖像画。左边：迈克，头发向上梳起，留着胡茬，目光望向一旁，穿着格子衬衫和连帽夹克。右边：约书亚，戴着针织毛线帽，带着淡淡的微笑，直视前方。
look.i_sams_sketchbook.3=铅笔肖像画。左边：艾米丽，深色直发中分，抿着嘴唇，身穿高领毛衣，配毛皮衣领。右边：克里斯多夫，头发根根竖起，戴着长方形眼镜，穿着绗缝夹克，嘴巴张着，像是话说到一半。
look.i_sams_sketchbook.4=铅笔肖像画。左边：阿什莉，戴着罗纹毛线帽，一头长直发，温柔地微笑着。右边：马修，一头短卷发，面带微笑，穿着高领毛衣。
look.i_map=一幅山地地图，各处标着LODGE、SANATORIUM和CABLE CAR。红色虚线小径从缆车通往山庄，再向上通往疗养院，另有一条沿RANGER PATH通往一座带无线电标志的塔；底部写着TO LOWER CABLE CAR。
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=墙上满是一再涂写的红字：DIE。
look.i_security_monitor=屏幕上，一间带大浴缸的昏暗浴室切换成监控摄像头的俯视画面：一座积雪的木造建筑，长长的门廊上，长椅上方亮着一盏灯，后面是雾中的针叶树。下方雪地上，光秃树枝的阴影间，站着一个黑色人影。画面一阵雪花干扰，人影不见了。
look.i_family_portrait=厚重雕花画框中的一幅肖像画，下方有一块铭牌：THE WASHINGTON FAMILY。左边是戴眼镜、挂着心形吊坠的汉娜和留着刘海的贝丝；汉娜的手搭在前面一位微笑的短黑发女人肩上。后面，一个留着小胡子的男人搂着约书亚的肩膀，约书亚在右边微笑，深色毛衣里露出白色衣领。
look.i_car_lookat=车里的座位上堆满了东西：两个粉色纸质购物袋、一个带花纹的旅行包、几瓶指甲油和乳液、杂志，还有一根香蕉。
look.i_hotel_poster=一张褪色的海报：嶙峋的山峰和星空下，一座有长长的游廊和陡峭山墙的大型木结构酒店。
look.i_wanted_poster_lookat_new=海报上半部分被撕掉了，照片上的脸也随之不见；WANTED上方只剩一小片深色的照片残片。
look.i_missing_axe=原木墙上挂着一个放斧头的长木匣，里面空空的，只剩下两个原本固定斧头的卡扣。
look.i_prom_night_photo=一张在绿树下拍的照片。从左起：戴眼镜的汉娜，上臂文着一只小小的黑蝴蝶；金发的萨曼莎穿着碎花裙，朝镜头伸出一只手；穿燕尾服、打领结的迈克搂着艾米丽，她在右边穿着蓝裙子微笑。
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=一张在海滩上拍的褪色照片，背后是大海和一处岬角。中间的约书亚搂着左边戴眼镜、上臂文着一只小蝴蝶的汉娜，和右边留着刘海的贝丝。
look.i_minemap=一张旧的矿井巷道测绘图。图框里写着：Maple Leaf Surveyors；Location: Blackwood Mines 7A-3；Surveyor: Charles Scott (MIRCS)；Date: 07/10/1951。红色印章AREAS AT RISK DANGER和一再出现的DANGER标出涂成红色的区域，旁边有红色手写批注：Flood Risk、Extreme Rockfall Danger、Collapsed Supports (Rust)。角落里写着BLACKWOOD MINES。
look.i_cigarstub=一截掐灭的雪茄烟头，末端已烧成灰。米色的雪茄环上，一面饰有羽毛头饰的暗红色盾牌两侧都写着CLASSIC。
look.i_mysticalsymbols=木板上用暗红色胡乱画着：宽大分叉的鹿角下，一张龇着牙的骷髅般的脸，颜料流淌成道道痕迹。旁边挂着一个饰有羽毛的鹿头骨。
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=邀请函下面是一张黑白照片，迈克穿着燕尾服、打着领结。周围的软木板装在华丽的深色画框里，上面有：萨曼莎的照片，艾米丽、汉娜和贝丝的合影，一只狗和几只猫，伦敦塔桥和风景的照片；印着马的奖章花结，写着1ST和SPECIAL；两张HARRY VOGUE演唱会门票；一张署名JOSH的涂鸦笑脸；还有便条：Finals start APRIL 22nd!!；It's up to you to find BEAUTY in the ugliest days!；Dad's new P.A Cheryl 558-714-1132。
look.i_look_at_dollshouse=五斗柜上放着一座旧的两层木制娃娃屋：灰色木瓦屋顶，山墙上开着一扇圆窗，窗户带百叶窗，正面有一道门廊。楼上的一扇窗里有一个金发、苍白、赤裸的娃娃；从楼下的一扇窗里隐约能看到更多娃娃，门廊上躺着一个娃娃头。旁边打开的手提箱里有一个穿洋红色裙子的黑发娃娃和一本带十字架的深色书；前面摞着三块玩具积木，每块都露出6。
look.i_snowybench=扫开积雪，木板上刻着一颗心，里面划着几个字母。
look.i_headlessdoll=一个没有头的赤裸婴儿娃娃，塑料又脏又有污渍、满是裂纹，脖子处有个黑洞，小小的指甲涂成了红色。背上贴着一张贴纸，有三只蝴蝶和花体字的名字Hannah；胸口有一圈细小的孔。
look.i_readnote=红色的字迹流淌成道道痕迹。背面是印好的信头NORTHERN PROVINCES PENITENTIARY，旁边是一枚带天平图案的圆形印章；红字从背面反着透过来。
look.i_controls_lookat=一张灰色的金属控制台，磨损严重、满是划痕：后部是标着A、V和Hz的仪表，一排排黄、绿、白色的指示灯，旋钮开关，圆形按钮和一个数字键盘；右边是一块带操纵杆槽的蓝色面板，标着STOP、NEUTRAL、RUN，中间是一个带钥匙孔的红色开关。上面用红字一遍又一遍地涂着：DIE。
