picture.t_camera_sam_01_clr_up=五个朋友在木制吧台边欢笑：戴眼镜的克里斯多夫拿着一罐饮料；约书亚拿着一个瓶子，坐在吧台凳上大笑；穿红色花纹毛衣的萨曼莎坐在台面上；马修和迈克在右边探过身来。
picture.t_camera_chris_01_clr_up=缆车里的自拍：戴毛线帽的约书亚在戴眼镜的汉娜和穿粉色外套的贝丝之间比出V字手势。
picture.t_camera_ashley_01_clr_up=马修搂着阿什莉，阿什莉戴着条纹毛线帽，拿着手机；两人都在微笑。
picture.t_camera_hannah_01_clr_up=一间卧室，墙上有字母H和W：杰西卡和艾米丽拿着红色杯子坐在床边，阿什莉戴着毛线帽站着，戴眼镜的汉娜在打电话。
picture.t_camera_mike_01_clr_up=恶作剧：艾米丽咧嘴笑着，在克里斯多夫脸上涂画；他睡在沙发上，脸上已被画过，杰西卡在他身后咧嘴笑着。
look.i_psychsession_1_interaction=晴天里的一片玉米地：左边是一座红色谷仓，右边是一个戴草帽的稻草人，脸上咧嘴笑着，系着红色围巾，一只手是钩子。左下角的黑暗玉米丛中，有两只小小的黄色眼睛。
look.i_sams_sketchbook.1=铅笔肖像画。左边：萨曼莎，头发松松地束在脑后，脖子上围着围巾，目光望向一旁。右边：杰西卡，面带微笑，一条长辫子搭在肩上，穿着带毛皮兜帽的派克大衣。
look.i_sams_sketchbook.2=铅笔肖像画。左边：迈克，头发向上梳起，留着胡茬，目光望向一旁，穿着格子衬衫和连帽夹克。右边：约书亚，戴着针织毛线帽，带着淡淡的微笑，直视前方。
look.i_sams_sketchbook.3=铅笔肖像画。左边：艾米丽，深色直发中分，抿着嘴唇，身穿高领毛衣，配毛皮衣领。右边：克里斯多夫，头发根根竖起，戴着长方形眼镜，穿着绗缝夹克，嘴巴张着，像是话说到一半。
look.i_sams_sketchbook.4=铅笔肖像画。左边：阿什莉，戴着罗纹毛线帽，一头长直发，温柔地微笑着。右边：马修，一头短卷发，面带微笑，穿着高领毛衣。
look.i_map=一幅山地地图，各处标着LODGE、SANATORIUM和CABLE CAR。红色虚线小径从缆车通往山庄，再向上通往疗养院，另有一条沿RANGER PATH通往一座带无线电标志的塔；底部写着TO LOWER CABLE CAR。
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=墙上满是一再涂写的红字：DIE。
look.i_security_monitor=屏幕上，一间带大浴缸的昏暗浴室切换成监控摄像头的俯视画面：一座积雪的木造建筑，长长的门廊上，长椅上方亮着一盏灯，后面是雾中的针叶树。下方雪地上，光秃树枝的阴影间，站着一个黑色人影。画面一阵雪花干扰，人影不见了。
