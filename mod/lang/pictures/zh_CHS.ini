; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=五个朋友在木制吧台边欢笑：戴眼镜的克里斯多夫拿着一罐饮料；约书亚拿着一个瓶子，坐在吧台凳上大笑；穿红色花纹毛衣的萨曼莎坐在台面上；马修和迈克在右边探过身来。
picture.t_camera_chris_01_clr_up=缆车里的自拍：戴毛线帽的约书亚在戴眼镜的汉娜和穿粉色外套的贝丝之间比出V字手势。
picture.t_camera_ashley_01_clr_up=马修搂着阿什莉，阿什莉戴着条纹毛线帽，拿着手机；两人都在微笑。
picture.t_camera_hannah_01_clr_up=一间卧室，墙上有字母H和W：杰西卡和艾米丽拿着红色杯子坐在床边，阿什莉戴着毛线帽站着，戴眼镜的汉娜在打电话。
picture.t_camera_mike_01_clr_up=恶作剧：艾米丽咧嘴笑着，在克里斯多夫脸上涂画；他睡在沙发上，脸上已被画过，杰西卡在他身后咧嘴笑着。
look.i_psychsession_1_interaction=晴天里的一片玉米地：左边是一座红色谷仓，右边是一个戴草帽的稻草人，脸上咧嘴笑着，系着红色围巾，一只手是钩子。左下角的黑暗玉米丛中，有两只小小的黄色眼睛。
look.i_sams_sketchbook.1=铅笔肖像画。左边：萨曼莎，头发松松地束在脑后，脖子上围着围巾，目光望向一旁。右边：杰西卡，面带微笑，一条长辫子搭在肩上，穿着带毛皮兜帽的派克大衣。
look.i_sams_sketchbook.2=铅笔肖像画。左边：迈克，头发向上梳起，留着胡茬，目光望向一旁，穿着格子衬衫和连帽夹克。右边：约书亚，戴着针织毛线帽，带着淡淡的微笑，直视前方。
look.i_sams_sketchbook.3=铅笔肖像画。左边：艾米丽，深色直发中分，抿着嘴唇，身穿高领毛衣，配毛皮衣领。右边：克里斯多夫，头发根根竖起，戴着长方形眼镜，穿着绗缝夹克，嘴巴张着，像是话说到一半。
look.i_sams_sketchbook.4=铅笔肖像画。左边：阿什莉，戴着罗纹毛线帽，一头长直发，温柔地微笑着。右边：马修，一头短卷发，面带微笑，穿着高领毛衣。
look.i_map=一幅山地地图，各处标着LODGE、SANATORIUM和CABLE CAR。红色虚线小径从缆车通往山庄，再向上通往疗养院，另有一条沿RANGER PATH通往一座带无线电标志的塔；底部写着TO LOWER CABLE CAR。
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=墙上满是一再涂写的红字：DIE。
look.i_security_monitor=屏幕上，一间带大浴缸的昏暗浴室切换成监控摄像头的俯视画面：一座积雪的木造建筑，长长的门廊上，长椅上方亮着一盏灯，后面是雾中的针叶树。下方雪地上，光秃树枝的阴影间，站着一个黑色人影。画面一阵雪花干扰，人影不见了。
look.i_family_portrait=厚重雕花画框中的一幅肖像画，下方有一块铭牌：THE WASHINGTON FAMILY。左边是戴眼镜、挂着心形吊坠的汉娜和留着刘海的贝丝；汉娜的手搭在前面一位微笑的短黑发女人肩上。后面，一个留着小胡子的男人搂着约书亚的肩膀，约书亚在右边微笑，深色毛衣里露出白色衣领。
look.i_car_lookat=车里的座位上堆满了东西：两个粉色纸质购物袋、一个带花纹的旅行包、几瓶指甲油和乳液、杂志，还有一根香蕉。
look.i_hotel_poster=一张褪色的海报：嶙峋的山峰和星空下，一座有长长的游廊和陡峭山墙的大型木结构酒店。
look.i_prom_night_photo=照片上，汉娜的上臂文着一只小小的黑蝴蝶。
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=照片上，汉娜的上臂文着一只小小的蝴蝶。
look.i_mysticalsymbols=木板上用暗红色胡乱画着：宽大分叉的鹿角下，一张龇着牙的骷髅般的脸，颜料流淌成道道痕迹。旁边挂着一个饰有羽毛的鹿头骨。
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=邀请函下面是一张黑白照片，迈克穿着燕尾服、打着领结。周围的软木板装在华丽的深色画框里，上面有：萨曼莎的照片，艾米丽、汉娜和贝丝的合影，一只狗和几只猫，伦敦塔桥和风景的照片；印着马的奖章花结，写着1ST和SPECIAL；两张HARRY VOGUE演唱会门票；一张署名JOSH的涂鸦笑脸；还有便条：Finals start APRIL 22nd!!；It's up to you to find BEAUTY in the ugliest days!；Dad's new P.A Cheryl 558-714-1132。
look.i_look_at_dollshouse=五斗柜上放着一座旧的两层木制娃娃屋：灰色木瓦屋顶，山墙上开着一扇圆窗，窗户带百叶窗，正面有一道门廊。楼上的一扇窗里有一个金发、苍白、赤裸的娃娃；从楼下的一扇窗里隐约能看到更多娃娃，门廊上躺着一个娃娃头。旁边打开的手提箱里有一个穿洋红色裙子的黑发娃娃和一本带十字架的深色书；前面摞着三块玩具积木，每块都露出6。
look.i_snowybench=扫开积雪，木板上刻着一颗心，里面划着几个字母。
look.i_headlessdoll=一个没有头的赤裸婴儿娃娃，塑料又脏又有污渍、满是裂纹，脖子处有个黑洞，小小的指甲涂成了红色。背上贴着一张贴纸，有三只蝴蝶和花体字的名字Hannah；胸口有一圈细小的孔。
look.i_controls_lookat=一张灰色的金属控制台，磨损严重、满是划痕：后部是标着A、V和Hz的仪表，一排排黄、绿、白色的指示灯，旋钮开关，圆形按钮和一个数字键盘；右边是一块带操纵杆槽的蓝色面板，标着STOP、NEUTRAL、RUN，中间是一个带钥匙孔的红色开关。上面用红字一遍又一遍地涂着：DIE。
look.a_telescope=望远镜里是夜晚：积雪的山坡上有岩石和松树，中间一根高高的浅色树干弯曲着向上伸展。左下方，大岩石旁的雪径上，艾米丽和迈克面对面紧挨着站着：他的手贴在她脸颊上，她的手搭在他腰间。远处右边，透过光秃的树枝，有人独自坐在一个亮着灯的棚子下的长椅上。
look.i_telescope.act2_2=望远镜里是夜晚：积雪的巨石后面，是一座木屋的一角，屋顶挂满冰柱；屋檐下亮着一盏灯，灯下是一个罩着铁丝网的排风扇。看不到人。
look.i_telescope.act2_3=望远镜里是夜晚：树林间一片积雪的空地，一架木板秋千挂在两根长绳上。后面是积雪的岩架和光秃的灌木丛；左边是蕨类植物和一根爬满常春藤的树干。
look.i_death_whistle=一只雕刻的哨子，形状像一颗长着宽大分叉鹿角的头骨。转过来便露出它的脸：两个深深的眼窝和一张圆圆张开的嘴，都用白漆描了边，额头上画着一串白色的圈环。
look.i_smashed_vase=一只深红色花瓶的碎片散落在地板上；阿什莉拿起其中一片，断口粗糙而发白。
look.i_sams_bracelet=一条编织绳手链，蓝色，带黄、红、紫三色菱形花纹，用一个粉色调的金属扣扣住。
look.i_picture_lookat=一幅装在暗色龟裂画框里的画：暴风雨般的夜空下，一栋两层的木屋，通体是深蓝和灰色；山墙高处有一扇圆窗，楼上是带百叶护窗的窗户，楼下是一条带栏杆的长门廊。
look.i_dollhouse_complete=透过娃娃屋的窗户，能看到里面的娃娃；接着是近景：四个赤裸的娃娃挤作一团，长着同一张娃娃脸——一个红发的、一个深色头发的、一个扎着两束辫子的金发娃娃，还有一个褐色皮肤、手拿小摄像机的，像阿什莉、艾米丽、杰西卡和马修。她们的眼睛是黑洞，脸颊上淌着暗红色的痕迹。
look.i_dollhouse_complete.open=娃娃屋的正面向外打开，屋顶抬起：里面是两层小小的房间，摆着赤裸的娃娃，脸都是同一张娃娃脸，头发却和朋友们的一样。楼上，一张放着几个瓶子和一只杯子的桌子旁，一个深色头发的娃娃瘫躺在沙发上，旁边是一个戴眼镜的金发娃娃，像约书亚和克里斯多夫。楼下，四个娃娃跪在红地毯上，面朝一张床：一个褐色皮肤、正拿小摄像机拍摄的，一个扎着两束辫子的金发娃娃，一个深色头发的和一个红发的，像马修、杰西卡、艾米丽和阿什莉；还有一个娃娃独自站在一旁。
look.i_doll_house_lookat_keyhole=娃娃屋山墙高处，那扇小圆窗像盖子一样被转到一旁：后面是一块带钥匙孔的圆形黄铜板，镶着红边。
look.i_doll_house_key=一把小小的旧铁钥匙，柄是心形的，杆上有螺旋状的凹槽。它挂在一个小小的黄铜钩上，藏在那幅画后面。
look.i_wine_rack=一个高高的木制酒架，前面是铁条交织成的菱形格栅；上部的木板被砸破、裂成碎片，透出一个个黑洞。
look.i_wine_cellar_door.act5_3=一扇用铁条加固的木板门；生锈的锁板上没有把手，只有一个方形的小孔。
look.i_doll_head=转过来正对着她的，是那颗秃头的娃娃头：画着睫毛的眼眶里是空洞的黑孔，脸颊红润，嘴唇鲜红，漆面龟裂剥落，一道暗色的裂缝从一只眼睛往下经过嘴边。
look.i_doll_head.roaches=蟑螂从娃娃头里成群地爬了出来。
look.i_sams_sack=麻袋下面是萨曼莎，裹着浴巾，一动不动地坐在一把旧木转椅上。
look.crossedout=有一张照片被划掉了：{0}。
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=两根木桩之间拉着生锈的铁丝网，艾米丽的手抓着右边那根；透过铁丝网往下看，在昏暗的泛蓝光线中，坑道地面上散落着碎石，一根深色的木梁横躺在上面。
look.i_torn_miner_clothes=石头上躺着一顶旧矿工头盔：深色的金属圆顶上有凸起的棱，宽宽的帽檐锈迹斑斑，正面有一盏带圆形反光罩的小黄铜灯。
look.i_broken_ladder=一架断梯横躺在碎石堆上：一根长长的木梯梁，上面伸出三根生锈的铁横档，末端都已折断，其中两根上还挂着劈裂的碎木片。
look.i_sign=尘土里躺着一块饱经风吹日晒的木牌的断片，边缘参差不齐、已经劈裂；上面用褪色的红色模板大写字母写着一个词的结尾 GER，下面是 EDGE。
look.i_peer_at_head=隔着深色的铁丝网，从粗糙的木板之间望去：后面的石头地面上有一只桶，桶顶盖着防水布；再往后是一道木栏杆和几堆碎石。
look.i_peer_at_wheel=隔着两根柱子之间生锈的铁丝网：后面是一个洞穴，里面破损的脚手架中间立着一架巨大的旧木水车；水车脚下，一团火焰从黑暗中蹿起，又熄灭了。
look.i_scarecrow_lookat=一个稻草人：手臂是末端分出细枝的光秃树枝，身体是一只沾满血的黑色塑料袋。它的头裹在浅色布里，脖子处用绳子扎住；布下透出一张腐烂的脸，鼻子只剩空洞，张开的嘴里满是烂牙，一侧浸透了血。破旧的棕色帽子下垂着长长的黑发。
look.i_scarecrow_lookat.clown=一个稻草人：手臂是末端分出细枝的光秃树枝，身体是一只沾满血的黑色塑料袋。它的头是一张小丑面具：满是皱纹的白脸上，紫色的眉毛画成高高的弧形，一直延伸到额头上方；黑洞洞的眼孔描着紫边，红鼻子，一张满是长长尖牙的大嘴咧开笑着，嘴角发红，下巴被血染得发黑。
look.i_scarecrow_lookat.zombie=一个稻草人：手臂是末端分出细枝的光秃树枝，身体是一只沾满血的黑色塑料袋。它的头是一颗腐烂的僵尸头：光秃秃的，灰绿色斑驳的皮肤，一双没有瞳孔的白眼，张着一张满是牙齿的大嘴。
look.i_dead_crow_lookat=两只死乌鸦躺在血迹斑斑的雪地上，被撕开了，浑身是血，翅膀摊开，内脏流了出来；周围散落着黑色的羽毛。
look.i_chair_and_blood=水泥地上翻倒着一张木凳，凳腿断了；旁边是一副连着铁链、敞开的铁镣。地上溅满了血迹和血滴，一盏提灯侧倒在地上，还亮着。
look.i_fake_torso=一具穿灰色格子衬衫的躯体的上半截挂着，双臂向上伸直；腰以下什么都没有，只有一道参差不齐、血淋淋的断口。后面立着一块开了个洞的木板。
look.i_saw_blades=一片巨大的圆锯片平躺着，生锈的钢面上抹满了暗红的血；后面是一道铁丝网围栏。
look.i_dead_wolf_inspect=一只死狼挂在牢房门的铁栏上：胸口和肚子被大大地撕开，掏空了，头耷拉着，嘴张着，下方的血泊里摊着它的内脏。
look.i_damaged_doors=一扇面板凹陷的厚重钢制牢门：一大片暗色的血迹顺着门流下来，顶上小窗口下也淌下了血，金属上刻着一道道很深的爪痕。
look.i_sanlookat=一道铁丝网围栏：左边是一根深色的柱子，一根生锈的横杆横贯其上。透过铁丝网，在另一边的雪地里，是一段带金属扶手的短短的水泥台阶。
look.i_oilflask=一只高高的生锈红色铁罐，被举到眼前；侧面褪色的椭圆徽标上，North West 环绕着字母 NWM，下方写着 Mining；窄的那一面，红色菱形标志上写着 FLAMMABLE LIQUID。
look.i_oilflask.roaches=一群蟑螂从罐子里爬出来，爬满了罐身，她把罐子甩开了。
look.i_admin_area_jacksdoor_lookat_reader=木门旁的墙上有一台黑色读卡器，小小的红色显示屏上显示着 LOCKED；门上的小窗下方是一块生锈的绿色标牌：CHAPEL SECURITY PASS REQUIRED。
look.i_morgue_open_morgue_drawer_lookat=停尸间里一个拉出来的托盘上，仰面躺着一具腐烂的尸体：灰色干瘪的脸，嘴巴大张，周围粘着深色的头发；灰色的衬衫和生锈的托盘上满是陈旧的血迹。
look.i_jackslair_exit_lock_lookat=一扇菱形网格的铁门紧紧锁着：木门框旁的搭扣上挂着一把生锈的大挂锁。
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=两张 MISSING 海报：HANNAH WASHINGTON 和 BETH WASHINGTON；汉娜那张上写着：She has glasses, and has a tattoo of a butterfly on her right shoulder. 一张黄色便条：NEVER FORGET。剪报：No new evidence in girls' disappearance；2 youths missing in wilderness remain untraced。一张四个女孩的合影里，汉娜被红圈圈了起来。
look.i_motivation_board_lookat==look.i_motivation_board
look.i_wine_cellar_door.act2_4=一扇用铁条加固的木板门；生锈的锁板上有一个圆形门把手。
