; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinq amis rient à un bar en bois : Chris, à lunettes, tient une canette ; Josh rit sur un tabouret de bar, une bouteille à la main ; Sam, en pull rouge à motifs, est assise sur le comptoir ; à droite, Matt et Mike se penchent vers eux.
picture.t_camera_chris_01_clr_up=Un selfie dans une cabine de téléphérique : Josh, en bonnet, fait le signe V entre Hannah, à lunettes, et Beth, en veste rose.
picture.t_camera_ashley_01_clr_up=Matt passe le bras autour d'Ashley, qui porte un bonnet rayé et tient un téléphone ; tous deux sourient.
picture.t_camera_hannah_01_clr_up=Une chambre, les lettres H et W au mur : Jessica et Emily sont assises près du lit avec des gobelets rouges, Ashley se tient debout en bonnet, et Hannah, à lunettes, parle au téléphone.
picture.t_camera_mike_01_clr_up=Une farce : Emily, avec un grand sourire, dessine sur le visage de Chris, endormi sur un canapé, le visage déjà couvert de gribouillis, tandis que Jessica sourit de toutes ses dents derrière lui.
look.i_psychsession_1_interaction=Un champ de maïs par une journée ensoleillée : une grange rouge à gauche et, à droite, un épouvantail au chapeau de paille, au large sourire, avec un foulard rouge au cou et un crochet à la place d'une main. Dans le maïs sombre, en bas à gauche, deux petits yeux jaunes.
look.i_sams_sketchbook.1=Portraits au crayon. À gauche : Sam, les cheveux noués lâchement, une écharpe au cou, le regard de côté. À droite : Jessica, souriante, une longue tresse sur l'épaule, en parka à capuche de fourrure.
look.i_sams_sketchbook.2=Portraits au crayon. À gauche : Mike, les cheveux relevés, mal rasé, le regard de côté, en chemise à carreaux et veste à capuche. À droite : Josh, en bonnet tricoté, un léger sourire, le regard droit devant lui.
look.i_sams_sketchbook.3=Portraits au crayon. À gauche : Emily, les cheveux raides et foncés séparés par une raie au milieu, les lèvres pincées, en col roulé et col de fourrure. À droite : Chris, les cheveux hérissés et des lunettes rectangulaires, en veste matelassée, la bouche ouverte comme en pleine phrase.
look.i_sams_sketchbook.4=Portraits au crayon. À gauche : Ashley, en bonnet à côtes, les cheveux longs et raides, avec un doux sourire. À droite : Matt, les cheveux courts et bouclés, souriant, en pull à col roulé.
look.i_map=Une carte de la montagne, dont les lieux portent les noms LODGE, SANATORIUM et CABLE CAR. Des sentiers en pointillés rouges mènent du téléphérique au chalet, puis plus haut jusqu'au sanatorium, et par RANGER PATH jusqu'à une tour marquée d'un symbole radio ; en bas, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Des lettres rouges barbouillées sur les murs, encore et encore : DIE.
look.i_security_monitor=À l'écran, une salle de bains plongée dans le noir, avec une grande baignoire, cède la place à la vue d'une caméra de surveillance, d'en haut : un bâtiment en bois sous la neige, une lampe allumée au-dessus d'un banc sur son long porche, des sapins dans la brume derrière. En bas, dans la neige, parmi les ombres de branches nues, se tient une silhouette sombre. Des parasites, et la silhouette a disparu.
look.i_family_portrait=Un portrait peint dans un lourd cadre sculpté, une plaque en dessous : THE WASHINGTON FAMILY. À gauche, Hannah, à lunettes, un pendentif en cœur au cou, et Beth, avec une frange ; la main de Hannah repose sur l'épaule d'une femme souriante au premier plan, aux cheveux courts et bruns. Derrière, un homme moustachu passe le bras autour de Josh, qui sourit à droite, en pull sombre sur un col blanc.
look.i_car_lookat=Dans la voiture, des affaires s'entassent sur les sièges : deux sacs de courses roses en papier, un sac de voyage à motifs, des flacons de vernis à ongles et de lotion, des magazines et une banane.
look.i_hotel_poster=Une affiche délavée : un grand hôtel en bois aux longues vérandas et aux pignons pointus, sous un pic déchiqueté et un ciel étoilé.
look.i_wanted_poster_lookat_new=Le haut de l'affiche est arraché, et avec lui le visage de la photo ; il ne reste au-dessus de WANTED qu'un lambeau sombre du cliché.
look.i_missing_axe=Au mur de rondins est accroché un long coffret en bois pour une hache, vide, hormis les deux attaches qui la tenaient.
look.i_prom_night_photo=Une photo sous des arbres verts. De gauche à droite : Hannah, à lunettes, un petit papillon noir tatoué sur le haut du bras ; Sam, blonde, en robe à fleurs, tend la main vers l'objectif ; Mike, en smoking et nœud papillon, le bras autour d'Emily, qui sourit à droite en robe bleue.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Une photo délavée sur une plage, la mer et un promontoire derrière. Josh, au milieu, entoure de ses bras Hannah, à gauche, à lunettes, un petit papillon tatoué sur le haut du bras, et Beth, à droite, avec une frange.
look.i_minemap=Un vieux plan des galeries de la mine. Dans son cartouche : Maple Leaf Surveyors ; Location: Blackwood Mines 7A-3 ; Surveyor: Charles Scott (MIRCS) ; Date: 07/10/1951. Des tampons rouges, AREAS AT RISK DANGER et DANGER encore et encore, marquent des zones hachurées de rouge, avec des notes manuscrites en rouge : Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). Dans le coin : BLACKWOOD MINES.
look.i_cigarstub=Un mégot de cigare écrasé, le bout réduit en cendres. Sa bague crème porte CLASSIC de part et d'autre d'un écusson rouge sombre orné d'une coiffe de plumes.
look.i_mysticalsymbols=Barbouillé en rouge sombre sur les planches : un visage de crâne aux dents découvertes sous de larges bois ramifiés, la peinture coulant en traînées. À côté pend un crâne de cerf orné de plumes.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Sous l'invitation, une photo en noir et blanc de Mike en smoking et nœud papillon. Autour, sur le panneau de liège, dans un cadre sombre ouvragé : des photos de Sam, d'Emily, Hannah et Beth ensemble, d'un chien et de chats, de Tower Bridge et de paysages ; des cocardes à cheval marquées 1ST et SPECIAL ; deux billets de concert HARRY VOGUE ; un visage griffonné signé JOSH ; et des notes : Finals start APRIL 22nd!! ; It's up to you to find BEAUTY in the ugliest days! ; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Une vieille maison de poupée en bois à deux étages, sur une commode : un toit de bardeaux gris avec une fenêtre ronde dans le pignon, des fenêtres à volets, un porche sur toute la façade. À une fenêtre de l'étage, une poupée nue et pâle aux cheveux blonds ; d'autres poupées se devinent par une fenêtre du bas, et une tête de poupée gît sur le porche. À côté, dans une valise ouverte, une poupée brune en robe magenta et un livre sombre orné d'une croix ; devant, trois cubes empilés, chacun montrant un 6.
look.i_snowybench=Sous la neige balayée, un cœur est gravé dans les planches, des lettres griffonnées à l'intérieur.
look.i_headlessdoll=Un poupon nu sans tête, le plastique crasseux, taché et fendillé, un trou sombre au cou, de minuscules ongles peints en rouge. Dans le dos, un autocollant avec trois papillons et le prénom Hannah en lettres bouclées ; sur la poitrine, une plaque ronde de petits trous.
look.i_readnote=Les lettres rouges ont coulé en traînées. Au dos, un en-tête imprimé, NORTHERN PROVINCES PENITENTIARY, à côté d'un sceau rond orné d'une balance ; le rouge transparaît à l'envers.
look.i_controls_lookat=Un pupitre de commande en métal gris, usé et rayé : au fond, des cadrans marqués A, V et Hz, des rangées de voyants jaunes, verts et blancs, des commutateurs rotatifs, des boutons-poussoirs ronds et un clavier ; à droite, une plaque bleue avec une fente de levier marquée STOP, NEUTRAL, RUN, et au milieu un interrupteur rouge à fente de clé. Des lettres rouges barbouillées dessus, encore et encore : DIE.
look.a_telescope=Dans le télescope, de nuit : une pente enneigée, des rochers et des pins, un haut tronc pâle qui s'élève en courbe au milieu. En bas à gauche, sur un sentier enneigé près d'un gros rocher, Emily et Mike se tiennent tout près l'un de l'autre, face à face : sa main à lui sur sa joue, ses mains à elle à sa taille. Loin à droite, à travers des branches nues, quelqu'un est assis seul sur un banc sous un abri éclairé.
look.i_telescope.act2_2=Dans le télescope, de nuit : des rochers enneigés, et derrière eux l'angle d'une cabane en rondins sous un toit hérissé de stalactites de glace ; une lampe brille sous l'avant-toit, au-dessus d'un ventilateur grillagé. Personne en vue.
look.i_telescope.act2_3=Dans le télescope, de nuit : une clairière enneigée entre les arbres, où une balançoire en planche pend à deux longues cordes. Derrière, des corniches rocheuses enneigées et des buissons nus ; à gauche, des fougères et un tronc couvert de lierre.
look.i_death_whistle=Un sifflet sculpté en forme de crâne aux larges bois ramifiés. Retourné, il montre son visage : deux orbites profondes et une bouche ronde ouverte, cerclées de peinture blanche, et une chaîne de boucles blanches peinte sur le front.
look.i_view_hannah_poster_part2=L'affiche est accrochée à l'intérieur de la porte du casier, tachée et froissée ; sa photo montre Hannah souriante, aux longs cheveux sombres et aux lunettes à monture sombre, et un sceau rond de la police est imprimé dans le coin.
look.i_smashed_vase=Les éclats d'un vase rouge sombre jonchent le sol ; Ashley en tient un, aux bords cassés rugueux et pâles.
look.i_sams_bracelet=Un bracelet en cordon tressé, bleu à motif de losanges jaunes, rouges et violets, fermé par un fermoir en métal rosé.
look.i_picture_lookat=Un tableau dans un cadre sombre et craquelé : une maison en bois à un étage, la nuit, sous un ciel d'orage, tout en bleus et gris sombres, avec une fenêtre ronde haut dans le pignon, des fenêtres à volets à l'étage et une longue véranda à rambarde en bas.
look.i_dollhouse_complete=Par les fenêtres de la maison de poupée, des poupées à l'intérieur ; puis, de près, quatre poupées nues blotties les unes contre les autres : une rousse, une brune, une blonde à couettes et une à la peau brune qui tient une petite caméra vidéo. Leurs yeux sont des trous noirs, et des traînées rouge sombre leur coulent sur les joues.
look.i_dollhouse_complete.open=La façade de la maison de poupée s'ouvre et son toit se soulève : deux étages de pièces minuscules où sont mises en scène des poupées nues. En haut, une poupée brune et une blonde à lunettes sont avachies sur un canapé, près d'une table avec une bouteille et un verre. En bas, quatre poupées sont agenouillées ensemble sur un tapis rouge, l'une tient une petite caméra vidéo, et une autre poupée se tient à l'écart.
look.i_doll_house_lookat_keyhole=En haut du pignon de la maison de poupée, la petite fenêtre ronde a pivoté comme un couvercle : derrière, une plaque ronde en laiton percée d'un trou de serrure, cerclée de rouge.
look.i_doll_house_key=Une petite clé ancienne en fer, à l'anneau en forme de cœur et à la tige rainurée en spirale. Elle pendait à un petit crochet en laiton, cachée derrière le tableau.
look.i_wine_rack=Un haut casier à vin en bois derrière un treillis de bandes de fer en losanges ; ses planches du haut sont défoncées et éclatées, percées de trous sombres.
look.i_wine_cellar_door=Une porte en planches renforcée de pentures en fer ; sur sa plaque de serrure rouillée, pas de poignée, seulement un petit trou carré.
look.i_secret_camera=Un petit caméscope argenté qui était caché entre les cartons ; son petit voyant rouge d'enregistrement clignote.
look.i_doll_head=Tournée vers elle, la tête chauve de la poupée : des orbites noires et vides cerclées de cils peints, des joues roses, des lèvres rouges, la peinture craquelée qui s'écaille, et une fissure sombre qui descend d'un œil en passant près de la bouche.
look.i_doll_head.roaches=Des cafards grouillent hors de la tête de la poupée.
look.i_sams_sack=Sous le sac, c'est Sam, enveloppée d'une serviette de bain, assise immobile dans un vieux fauteuil pivotant en bois.
look.i_dead_pig_lookat=@SMG013_65747
