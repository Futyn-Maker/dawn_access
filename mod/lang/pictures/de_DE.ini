; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Fünf lachende Freunde an einer Holztheke: Chris mit Brille hält eine Dose; Josh lacht auf einem Barhocker, eine Flasche in der Hand; Sam in einem roten, gemusterten Pullover sitzt auf der Theke; rechts beugen sich Matt und Mike heran.
picture.t_camera_chris_01_clr_up=Ein Selfie in einer Seilbahngondel: Josh mit Mütze macht das V-Zeichen zwischen Hannah mit Brille und Beth in einer pinkfarbenen Jacke.
picture.t_camera_ashley_01_clr_up=Matt hat den Arm um Ashley gelegt, die eine gestreifte Mütze trägt und ein Handy hält; beide lächeln.
picture.t_camera_hannah_01_clr_up=Ein Schlafzimmer, an der Wand die Buchstaben H und W: Jessica und Emily sitzen mit roten Bechern am Bett, Ashley steht mit Mütze da, und Hannah mit Brille telefoniert.
picture.t_camera_mike_01_clr_up=Ein Streich: Emily bemalt grinsend das Gesicht von Chris, der auf einem Sofa schläft, das Gesicht schon bekritzelt, während Jessica hinter ihm grinst.
look.i_psychsession_1_interaction=Ein Maisfeld an einem sonnigen Tag: links eine rote Scheune und rechts eine Vogelscheuche mit Strohhut, grinsendem Gesicht, rotem Halstuch und einem Haken statt einer Hand. Unten links im dunklen Mais zwei kleine gelbe Augen.
look.i_sams_sketchbook.1=Bleistiftporträts. Links: Sam, das Haar locker zurückgebunden, einen Schal um den Hals, den Blick zur Seite gewandt. Rechts: Jessica, lächelnd, einen langen Zopf über der Schulter, in einem Parka mit Fellkapuze.
look.i_sams_sketchbook.2=Bleistiftporträts. Links: Mike, das Haar hochgekämmt, mit Bartstoppeln, den Blick zur Seite gewandt, in kariertem Hemd und Kapuzenjacke. Rechts: Josh, mit Strickmütze, leicht lächelnd, den Blick geradeaus.
look.i_sams_sketchbook.3=Bleistiftporträts. Links: Emily, glattes dunkles Haar mit Mittelscheitel, die Lippen geschürzt, in Rollkragenpullover und Pelzkragen. Rechts: Chris, stacheliges Haar und rechteckige Brille, in einer Steppjacke, den Mund offen, als spräche er gerade.
look.i_sams_sketchbook.4=Bleistiftporträts. Links: Ashley, mit gerippter Strickmütze, langes glattes Haar, sanft lächelnd. Rechts: Matt, kurzes lockiges Haar, lächelnd, im Rollkragenpullover.
look.i_map=Eine Karte des Berges, die Orte beschriftet mit LODGE, SANATORIUM und CABLE CAR. Rote gepunktete Wege führen von der Seilbahn zur Lodge und weiter hinauf zum Sanatorium sowie den RANGER PATH entlang zu einem Turm mit einem Funksymbol; unten steht TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Rote Buchstaben, immer wieder an die Wände geschmiert: DIE.
look.i_security_monitor=Auf dem Bildschirm weicht ein dunkles Badezimmer mit einer großen Wanne dem Blick einer Überwachungskamera von oben: ein verschneites Holzgebäude, auf der langen Veranda brennt eine Lampe über einer Bank, dahinter Tannen im Nebel. Unten im Schnee, zwischen den Schatten kahler Äste, steht eine dunkle Gestalt. Bildrauschen, und die Gestalt ist verschwunden.
look.i_family_portrait=Ein gemaltes Porträt in einem schweren geschnitzten Rahmen, darunter ein Schild: THE WASHINGTON FAMILY. Links Hannah mit Brille und Herzanhänger und Beth mit Pony; Hannahs Hand ruht auf der Schulter einer lächelnden Frau vorn, mit kurzen dunklen Haaren. Dahinter legt ein Mann mit Schnurrbart den Arm um Josh, der rechts lächelt, in einem dunklen Pullover über einem weißen Kragen.
look.i_car_lookat=Im Auto türmen sich Sachen auf den Sitzen: zwei rosa Einkaufstüten aus Papier, eine gemusterte Reisetasche, Fläschchen mit Nagellack und Lotion, Zeitschriften und eine Banane.
look.i_hotel_poster=Ein verblichenes Plakat: ein großes Holzhotel mit langen Veranden und steilen Giebeln unter einem zackigen Gipfel und einem Sternenhimmel.
look.i_prom_night_photo=Auf dem Foto hat Hannah einen kleinen schwarzen Schmetterling auf den Oberarm tätowiert.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Auf dem Foto hat Hannah einen kleinen Schmetterling auf den Oberarm tätowiert.
look.i_mysticalsymbols=Mit dunkelroter Farbe auf die Bretter geschmiert: ein schädelartiges Gesicht mit gebleckten Zähnen unter einem weit verzweigten Geweih, die Farbe zu Tropfen verlaufen. Daneben hängt ein Hirschschädel mit Federn.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Unter der Einladung ein Schwarzweißfoto von Mike in Smoking und Fliege. Ringsum auf der Korkwand, in einem verschnörkelten dunklen Rahmen: Fotos von Sam, von Emily, Hannah und Beth zusammen, von einem Hund und Katzen, der Tower Bridge und Landschaften; Rosetten mit Pferden, beschriftet 1ST und SPECIAL; zwei Konzertkarten für HARRY VOGUE; ein gekritzeltes Gesicht, signiert JOSH; und Zettel: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Ein altes zweistöckiges Puppenhaus aus Holz auf einer Kommode: ein graues Schindeldach mit einem runden Fenster im Giebel, Fenster mit Läden, eine Veranda an der Front. In einem Fenster oben eine bleiche nackte Puppe mit blondem Haar; durch ein Fenster unten sieht man undeutlich weitere Puppen, und auf der Veranda liegt ein Puppenkopf. Daneben in einem offenen Koffer eine dunkelhaarige Puppe in einem magentafarbenen Kleid und ein dunkles Buch mit einem Kreuz; davor drei gestapelte Spielwürfel, jeder mit einer 6.
look.i_snowybench=Unter dem weggewischten Schnee ist ein Herz in die Bretter geschnitzt, darin eingeritzte Buchstaben.
look.i_headlessdoll=Eine nackte Babypuppe ohne Kopf, ihr Plastik schmutzig, fleckig und rissig, ein dunkles Loch am Hals, winzige rot lackierte Nägel. Auf dem Rücken ein Aufkleber mit drei Schmetterlingen und dem Namen Hannah in verschnörkelter Schrift; auf der Brust eine runde Stelle mit kleinen Löchern.
look.i_controls_lookat=Ein graues Steuerpult aus Metall, abgenutzt und zerkratzt: hinten Anzeigen mit A, V und Hz, Reihen gelber, grüner und weißer Lampen, Drehschalter, runde Drucktaster und ein Tastenfeld; rechts eine blaue Platte mit einem Hebelschlitz, beschriftet STOP, NEUTRAL, RUN, und in der Mitte ein roter Schalter mit einem Schlüsselschlitz. Immer wieder rote Buchstaben darübergeschmiert: DIE.
look.a_telescope=Durch das Teleskop, bei Nacht: ein verschneiter Hang mit Felsen und Kiefern, in der Mitte biegt sich ein hoher, heller Baumstamm nach oben. Unten links, auf einem verschneiten Pfad neben einem großen Felsen, stehen Emily und Mike dicht beieinander, einander zugewandt: seine Hand an ihrer Wange, ihre Hände an seiner Taille. Weit rechts, hinter kahlen Zweigen, sitzt jemand allein auf einer Bank unter einem beleuchteten Unterstand.
look.i_telescope.act2_2=Durch das Teleskop, bei Nacht: verschneite Felsbrocken, dahinter die Ecke einer Blockhütte unter einem Dach voller Eiszapfen; unter der Traufe leuchtet eine Lampe über einem vergitterten Ventilator. Niemand ist zu sehen.
look.i_telescope.act2_3=Durch das Teleskop, bei Nacht: eine verschneite Lichtung zwischen Bäumen, an der eine Holzbrettschaukel an zwei langen Seilen hängt. Dahinter verschneite Felsstufen und kahle Büsche; links Farne und ein efeuumrankter Baumstamm.
look.i_death_whistle=Eine geschnitzte Pfeife in Form eines Schädels mit breitem, verzweigtem Geweih. Umgedreht zeigt sie ihr Gesicht: zwei tiefe Augenhöhlen und einen runden, offenen Mund, weiß umrandet, und eine Kette weißer Schlaufen, die über die Stirn gemalt ist.
look.i_smashed_vase=Scherben einer dunkelroten Vase liegen über den Boden verstreut; Ashley hält eine davon hoch, ihre Bruchkanten rau und hell.
look.i_sams_bracelet=Ein geflochtenes Kordelarmband, blau mit einem Muster aus gelben, roten und violetten Rauten, mit einem rosafarbenen Metallverschluss.
look.i_picture_lookat=Ein Gemälde in einem dunklen, rissigen Rahmen: ein zweistöckiges Holzhaus bei Nacht unter einem Gewitterhimmel, ganz in dunklen Blau- und Grautönen, mit einem runden Fenster hoch im Giebel, Fenstern mit Läden oben und einer langen Veranda mit Geländer unten.
look.i_dollhouse_complete=Durch die Fenster des Puppenhauses Puppen darin; dann aus der Nähe vier nackte Puppen, eng zusammengedrängt, alle mit demselben Puppengesicht: eine rothaarige, eine dunkelhaarige, eine Blonde mit Zöpfchen und eine dunkelhäutige mit einer kleinen Videokamera in der Hand, wie Ashley, Emily, Jessica und Matt. Ihre Augen sind schwarze Löcher, dunkelrote Schlieren laufen ihnen über die Wangen.
look.i_dollhouse_complete.open=Die Vorderseite des Puppenhauses schwingt auf, das Dach hebt sich: zwei Stockwerke winziger Zimmer, in denen nackte Puppen arrangiert sind, alle mit demselben Puppengesicht, aber mit dem Haar der Freunde. Oben, an einem Tisch mit Flaschen und einem Glas, liegt eine dunkelhaarige Puppe hingefläzt auf einem Sofa neben einer blonden mit Brille, wie Josh und Chris. Unten knien vier Puppen auf einem roten Teppich, einem Bett zugewandt: eine dunkelhäutige, die mit einer kleinen Videokamera filmt, eine Blonde mit Zöpfchen, eine dunkelhaarige und eine rothaarige, wie Matt, Jessica, Emily und Ashley; eine weitere Puppe steht abseits.
look.i_doll_house_lookat_keyhole=Hoch im Giebel des Puppenhauses ist das kleine runde Fenster wie ein Deckel zur Seite geschwenkt: dahinter eine runde Messingplatte mit einem Schlüsselloch, rot umrandet.
look.i_doll_house_key=Ein kleiner alter Eisenschlüssel mit einer herzförmigen Reide und einem spiralig gerillten Schaft. Er hing an einem kleinen Messinghaken, versteckt hinter dem Gemälde.
look.i_wine_rack=Ein hohes hölzernes Weinregal hinter einem rautenförmigen Gitter aus Eisenstreifen; seine oberen Bretter sind eingeschlagen und zersplittert, dunkle Löcher klaffen darin.
look.i_wine_cellar_door.act5_3=Eine Brettertür, mit Eisenbändern verstärkt; an ihrem rostigen Schlossblech ist keine Klinke, nur ein kleines viereckiges Loch.
look.i_doll_head=Ihr zugewandt der kahle Puppenkopf: schwarze, leere Augenlöcher mit aufgemalten Wimpern, rosige Wangen, rote Lippen, die Farbe rissig und abblätternd, und ein dunkler Riss, der von einem Auge am Mund vorbei nach unten läuft.
look.i_doll_head.roaches=Kakerlaken wimmeln aus dem Puppenkopf.
look.i_sams_sack=Unter dem Sack ist Sam, in ein Badetuch gehüllt, reglos in einem alten hölzernen Drehstuhl sitzend.
look.crossedout=Ein Foto ist durchgestrichen: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Rostiger Maschendraht, zwischen zwei Holzpfosten gespannt, Emilys Hand umklammert den rechten; durch ihn hindurch, unten, in trübem bläulichem Licht, ein Stollenboden voller Geröll, quer darüber ein dunkler Balken.
look.i_torn_miner_clothes=Auf den Steinen liegt ein alter Grubenhelm: eine dunkle Metallkuppel mit erhabenen Rippen, eine breite, verrostete Krempe und vorn eine kleine Messinglampe mit rundem Reflektor.
look.i_broken_ladder=Eine zerbrochene Leiter liegt quer über dem Geröll: ein langer hölzerner Holm, aus dem drei rostige Eisensprossen ragen, ihre äußeren Enden abgebrochen, an zweien noch gesplitterte Holzreste.
look.i_sign=Ein abgebrochenes Stück eines verwitterten Holzschilds liegt im Staub, die Kanten zackig und zersplittert; darauf in verblichenen roten Schablonen-Großbuchstaben das Ende eines Wortes, GER, und darunter EDGE.
look.i_peer_at_head=Durch dunkles Drahtgitter, zwischen groben Brettern: dahinter auf steinigem Boden ein Fass, oben mit einer Plane abgedeckt, und weiter hinten ein Holzgeländer und Geröllhaufen.
look.i_peer_at_wheel=Durch rostiges Drahtgitter zwischen zwei Pfosten: dahinter eine Höhle und darin ein großes altes hölzernes Wasserrad zwischen zerbrochenen Gerüsten; an seinem Fuß lodert ein Feuerstoß aus dem Dunkel auf und erlischt.
look.i_scarecrow_lookat=Eine Vogelscheuche, die Arme kahle Äste, die in Zweigen enden, der Körper ein schwarzer, blutverschmierter Plastiksack. Der Kopf ist in helles Tuch gewickelt, am Hals mit einem Strick zugebunden; ein verwesendes Gesicht schimmert hindurch, eine hohle Nase und ein offener Mund mit faulen Zähnen, eine Seite blutgetränkt. Unter einem ramponierten braunen Hut hängt langes schwarzes Haar hervor.
look.i_scarecrow_lookat.clown=Eine Vogelscheuche, die Arme kahle Äste, die in Zweigen enden, der Körper ein schwarzer, blutverschmierter Plastiksack. Der Kopf ist eine Clownsmaske: ein weißes, runzliges Gesicht, lila Brauen, in hohen Bögen die Stirn hinauf gemalt, dunkle, lila umrandete Augenlöcher, eine rote Nase und ein breites Grinsen mit langen spitzen Zähnen, rot in den Mundwinkeln, das Kinn dunkel von Blut.
look.i_scarecrow_lookat.zombie=Eine Vogelscheuche, die Arme kahle Äste, die in Zweigen enden, der Körper ein schwarzer, blutverschmierter Plastiksack. Der Kopf ist ein verwesender Zombiekopf: kahl, graugrün gefleckte Haut, leere weiße Augen und ein aufgerissener Mund voller Zähne.
look.i_dead_crow_lookat=Zwei tote Krähen liegen im blutbefleckten Schnee, aufgerissen und blutig, die Flügel gespreizt, die Eingeweide quellen heraus; lose schwarze Federn liegen um sie verstreut.
look.i_chair_and_blood=Auf dem Betonboden liegt ein umgekippter Holzschemel mit gebrochenen Beinen; daneben eine offene eiserne Schelle an einer Kette. Blut ist über den Boden gespritzt und getropft, und eine Laterne liegt auf der Seite, noch brennend.
look.i_fake_torso=Die obere Hälfte eines Körpers in einem grauen karierten Hemd hängt mit nach oben gestreckten Armen; unterhalb der Taille ist nichts als ein ausgefranster, blutiger Schnitt. Dahinter steht ein Brett mit einem ausgesägten Loch.
look.i_saw_blades=Ein riesiges Kreissägeblatt liegt flach da, sein rostiger Stahl mit dunklem Blut verschmiert; dahinter ein Maschendrahtzaun.
look.i_dead_wolf_inspect=Ein toter Wolf hängt an den Gitterstäben einer Zellentür: Brust und Bauch sind weit aufgerissen und leer, der Kopf hängt herab, das Maul klafft, und unter ihm liegen seine Eingeweide in einer Blutlache.
look.i_damaged_doors=Eine schwere Zellentür aus Stahl mit verbeulten Feldern: ein großer dunkler Blutschmier zieht sich daran herab, unter der kleinen Klappe oben ist Blut heruntergetropft, und tiefe Krallenspuren sind ins Metall gegraben.
look.i_sanlookat=Ein Maschendrahtzaun: links ein dunkler Pfosten, quer darüber eine rostige Stange. Durch das Geflecht, dahinter im Schnee, eine kurze Betontreppe mit einem Metallgeländer.
look.i_oilflask=Dicht vor die Augen gehalten, ein hoher rostiger roter Metallkanister. Auf der Seite steht auf einem verblichenen ovalen Emblem North West um die Buchstaben NWM herum, darunter Mining; auf der Schmalseite steht auf einem roten rautenförmigen Schild FLAMMABLE LIQUID.
look.i_oilflask.roaches=Kakerlaken krabbeln heraus und über den Kanister, und sie schleudert ihn weg.
look.i_admin_area_jacksdoor_lookat_reader=Ein schwarzer Kartenleser an der Wand neben einer Holztür, auf seiner kleinen roten Anzeige steht LOCKED; an der Tür, unter einem kleinen Fenster, ein rostiges grünes Schild: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=Auf der herausgezogenen Bahre der Leichenhalle liegt eine verwesende Leiche auf dem Rücken: ein graues, eingefallenes Gesicht mit aufgerissenem Mund, ringsum verklebtes dunkles Haar; das graue Hemd und die rostige Bahre sind mit altem Blut befleckt.
look.i_jackslair_exit_lock_lookat=Ein eisernes Gittertor mit Rautengeflecht ist fest verschlossen: Ein großes, rostiges Vorhängeschloss hängt an der Überfalle neben dem hölzernen Türrahmen.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Zwei MISSING-Plakate: HANNAH WASHINGTON und BETH WASHINGTON; auf Hannahs steht: She has glasses, and has a tattoo of a butterfly on her right shoulder. Ein gelber Zettel: NEVER FORGET. Zeitungsausschnitte: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. Auf einem Foto von vier Mädchen ist Hannah rot eingekreist.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_wine_cellar_door.act2_4=Eine Brettertür, mit Eisenbändern verstärkt; an ihrem rostigen Schlossblech sitzt ein runder Türknauf.
