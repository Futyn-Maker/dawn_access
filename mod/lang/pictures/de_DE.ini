; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Fünf lachende Freunde an einer Holztheke: Chris mit Brille hält eine Dose; Josh lacht auf einem Barhocker, eine Flasche in der Hand; Sam in einem roten, gemusterten Pullover sitzt auf der Theke; rechts beugen sich Matt und Mike heran.
picture.t_camera_chris_01_clr_up=Ein Selfie in einer Seilbahngondel: Josh mit Mütze macht das V-Zeichen zwischen Hannah mit Brille und Beth in einer pinkfarbenen Jacke.
picture.t_camera_ashley_01_clr_up=Matt hat den Arm um Ashley gelegt, die eine gestreifte Mütze trägt und ein Handy hält; beide lächeln.
picture.t_camera_hannah_01_clr_up=Ein Schlafzimmer, an der Wand die Buchstaben H und W: Jessica und Emily sitzen mit roten Bechern am Bett, Ashley steht mit Mütze da, und Hannah mit Brille telefoniert.
picture.t_camera_mike_01_clr_up=Ein Streich: Emily bemalt grinsend das Gesicht von Chris, der auf einem Sofa schläft, das Gesicht schon bekritzelt, während Jessica hinter ihm grinst.
look.i_psychsession_1_interaction=Ein Maisfeld an einem sonnigen Tag: links eine rote Scheune und rechts eine Vogelscheuche mit Strohhut, grinsendem Gesicht, rotem Halstuch und einem Haken statt einer Hand. Unten links im dunklen Mais zwei kleine gelbe Augen.
look.i_sams_sketchbook.1=Bleistiftporträts. Links: Sam, das Haar locker zurückgebunden, einen Schal um den Hals, den Blick zur Seite gewandt. Rechts: Jessica, lächelnd, einen langen Zopf über der Schulter, in einem Parka mit Fellkapuze.
look.i_sams_sketchbook.2=Bleistiftporträts. Links: Mike, das Haar hochgekämmt, mit Bartstoppeln, den Blick zur Seite gewandt, in kariertem Hemd und Kapuzenjacke. Rechts: Josh, mit Strickmütze, leicht lächelnd, den Blick geradeaus.
look.i_sams_sketchbook.3=Bleistiftporträts. Links: Emily, glattes dunkles Haar mit Mittelscheitel, die Lippen geschürzt, in Rollkragenpullover und Pelzkragen. Rechts: Chris, stacheliges Haar und rechteckige Brille, in einer Steppjacke, den Mund offen, als spräche er gerade.
look.i_sams_sketchbook.4=Bleistiftporträts. Links: Ashley, mit gerippter Strickmütze, langes glattes Haar, sanft lächelnd. Rechts: Matt, kurzes lockiges Haar, lächelnd, im Rollkragenpullover.
look.i_map=Eine Karte des Berges, die Orte beschriftet mit LODGE, SANATORIUM und CABLE CAR. Rote gepunktete Wege führen von der Seilbahn zur Lodge und weiter hinauf zum Sanatorium sowie den RANGER PATH entlang zu einem Turm mit einem Funksymbol; unten steht TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Rote Buchstaben, immer wieder an die Wände geschmiert: DIE.
look.i_security_monitor=Auf dem Bildschirm weicht ein dunkles Badezimmer mit einer großen Wanne dem Blick einer Überwachungskamera von oben: ein verschneites Holzgebäude, auf der langen Veranda brennt eine Lampe über einer Bank, dahinter Tannen im Nebel. Unten im Schnee, zwischen den Schatten kahler Äste, steht eine dunkle Gestalt. Bildrauschen, und die Gestalt ist verschwunden.
look.i_family_portrait=Ein gemaltes Porträt in einem schweren geschnitzten Rahmen, darunter ein Schild: THE WASHINGTON FAMILY. Links Hannah mit Brille und Herzanhänger und Beth mit Pony; Hannahs Hand ruht auf der Schulter einer lächelnden Frau vorn, mit kurzen dunklen Haaren. Dahinter legt ein Mann mit Schnurrbart den Arm um Josh, der rechts lächelt, in einem dunklen Pullover über einem weißen Kragen.
look.i_car_lookat=Im Auto türmen sich Sachen auf den Sitzen: zwei rosa Einkaufstüten aus Papier, eine gemusterte Reisetasche, Fläschchen mit Nagellack und Lotion, Zeitschriften und eine Banane.
look.i_hotel_poster=Ein verblichenes Plakat: ein großes Holzhotel mit langen Veranden und steilen Giebeln unter einem zackigen Gipfel und einem Sternenhimmel.
look.i_wanted_poster_lookat_new=Der obere Teil des Plakats ist abgerissen und mit ihm das Gesicht auf dem Foto; über WANTED ist nur ein dunkler Fetzen des Fotos übrig.
look.i_missing_axe=An der Blockwand hängt ein langer Holzkasten für eine Axt, leer bis auf die zwei Klammern, die sie hielten.
look.i_prom_night_photo=Ein Foto unter grünen Bäumen. Von links: Hannah mit Brille, ein kleiner schwarzer Schmetterling auf den Oberarm tätowiert; Sam, blond, in einem geblümten Kleid, streckt eine Hand zur Kamera; Mike in Smoking und Fliege, den Arm um Emily gelegt, die rechts in einem blauen Kleid lächelt.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Ein verblichenes Foto an einem Strand, dahinter das Meer und eine Landzunge. Josh in der Mitte hat die Arme um Hannah gelegt, links mit Brille, ein kleiner Schmetterling auf den Oberarm tätowiert, und um Beth rechts, mit Pony.
look.i_minemap=Ein alter Vermessungsplan der Stollen. Im Kasten steht: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Rote Stempel, AREAS AT RISK DANGER und immer wieder DANGER, markieren rot schraffierte Stellen, daneben rote handschriftliche Notizen: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). In der Ecke: BLACKWOOD MINES.
look.i_cigarstub=Ein ausgedrückter Zigarrenstummel, das Ende zu Asche verbrannt. Auf seiner cremefarbenen Banderole steht CLASSIC zu beiden Seiten eines dunkelroten Wappens mit einem Federkopfschmuck.
look.i_mysticalsymbols=Mit dunkelroter Farbe auf die Bretter geschmiert: ein schädelartiges Gesicht mit gebleckten Zähnen unter einem weit verzweigten Geweih, die Farbe zu Tropfen verlaufen. Daneben hängt ein Hirschschädel mit Federn.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Unter der Einladung ein Schwarzweißfoto von Mike in Smoking und Fliege. Ringsum auf der Korkwand, in einem verschnörkelten dunklen Rahmen: Fotos von Sam, von Emily, Hannah und Beth zusammen, von einem Hund und Katzen, der Tower Bridge und Landschaften; Rosetten mit Pferden, beschriftet 1ST und SPECIAL; zwei Konzertkarten für HARRY VOGUE; ein gekritzeltes Gesicht, signiert JOSH; und Zettel: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Ein altes zweistöckiges Puppenhaus aus Holz auf einer Kommode: ein graues Schindeldach mit einem runden Fenster im Giebel, Fenster mit Läden, eine Veranda an der Front. In einem Fenster oben eine bleiche nackte Puppe mit blondem Haar; durch ein Fenster unten sieht man undeutlich weitere Puppen, und auf der Veranda liegt ein Puppenkopf. Daneben in einem offenen Koffer eine dunkelhaarige Puppe in einem magentafarbenen Kleid und ein dunkles Buch mit einem Kreuz; davor drei gestapelte Spielwürfel, jeder mit einer 6.
look.i_snowybench=Unter dem weggewischten Schnee ist ein Herz in die Bretter geschnitzt, darin eingeritzte Buchstaben.
look.i_headlessdoll=Eine nackte Babypuppe ohne Kopf, ihr Plastik schmutzig, fleckig und rissig, ein dunkles Loch am Hals, winzige rot lackierte Nägel. Auf dem Rücken ein Aufkleber mit drei Schmetterlingen und dem Namen Hannah in verschnörkelter Schrift; auf der Brust eine runde Stelle mit kleinen Löchern.
look.i_readnote=Die roten Buchstaben sind in Tropfen verlaufen. Auf der Rückseite ein gedruckter Briefkopf, NORTHERN PROVINCES PENITENTIARY, neben einem runden Siegel mit einer Waage; das Rot scheint spiegelverkehrt durch.
look.i_controls_lookat=Ein graues Steuerpult aus Metall, abgenutzt und zerkratzt: hinten Anzeigen mit A, V und Hz, Reihen gelber, grüner und weißer Lampen, Drehschalter, runde Drucktaster und ein Tastenfeld; rechts eine blaue Platte mit einem Hebelschlitz, beschriftet STOP, NEUTRAL, RUN, und in der Mitte ein roter Schalter mit einem Schlüsselschlitz. Immer wieder rote Buchstaben darübergeschmiert: DIE.
