; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinco amigos rindo junto a um balcão de madeira: Chris, de óculos, segura uma lata; Josh ri sentado em uma banqueta, com uma garrafa; Sam, de suéter vermelho estampado, está sentada no balcão; à direita, Matt e Mike se inclinam para perto.
picture.t_camera_chris_01_clr_up=Uma selfie em uma cabine de teleférico: Josh, de gorro, faz o sinal de V entre Hannah, de óculos, e Beth, de jaqueta rosa.
picture.t_camera_ashley_01_clr_up=Matt com o braço em volta de Ashley, que usa um gorro listrado e segura um celular; os dois sorriem.
picture.t_camera_hannah_01_clr_up=Um quarto, com as letras H e W na parede: Jessica e Emily estão sentadas junto à cama com copos vermelhos, Ashley está de pé, de gorro, e Hannah, de óculos, fala ao telefone.
picture.t_camera_mike_01_clr_up=Uma pegadinha: Emily, com um sorriso largo, desenha no rosto de Chris, que dorme em um sofá com o rosto já rabiscado, enquanto Jessica sorri de orelha a orelha atrás dele.
look.i_psychsession_1_interaction=Um milharal em um dia ensolarado: um celeiro vermelho à esquerda e, à direita, um espantalho de chapéu de palha, com um sorriso arreganhado, um lenço vermelho no pescoço e um gancho no lugar de uma das mãos. No milho escuro, no canto inferior esquerdo, dois pequenos olhos amarelos.
look.i_sams_sketchbook.1=Retratos a lápis. À esquerda: Sam, com o cabelo preso frouxo para trás, um cachecol no pescoço, olhando para o lado. À direita: Jessica, sorrindo, com uma longa trança sobre o ombro, de parka com capuz de pele.
look.i_sams_sketchbook.2=Retratos a lápis. À esquerda: Mike, de cabelo penteado para cima, barba por fazer, olhando para o lado, de camisa xadrez e jaqueta com capuz. À direita: Josh, de gorro de tricô, com um leve sorriso, olhando direto para a frente.
look.i_sams_sketchbook.3=Retratos a lápis. À esquerda: Emily, cabelo escuro e liso repartido ao meio, lábios franzidos, de blusa de gola alta e gola de pele. À direita: Chris, cabelo espetado e óculos retangulares, de jaqueta acolchoada, a boca aberta como se estivesse falando.
look.i_sams_sketchbook.4=Retratos a lápis. À esquerda: Ashley, de gorro canelado, cabelo longo e liso, sorrindo suavemente. À direita: Matt, cabelo curto e cacheado, sorrindo, de suéter de gola alta.
look.i_map=Um mapa da montanha, com os lugares marcados LODGE, SANATORIUM e CABLE CAR. Trilhas pontilhadas vermelhas levam do teleférico ao chalé e, mais acima, ao sanatório, e pela trilha RANGER PATH até uma torre com um símbolo de rádio; embaixo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras vermelhas pintadas toscamente nas paredes, repetidas sem parar: DIE.
look.i_security_monitor=Na tela, um banheiro escuro com uma banheira grande dá lugar à imagem de uma câmera de segurança vista de cima: um prédio de madeira coberto de neve, uma lâmpada acesa sobre um banco na varanda comprida, pinheiros na névoa ao fundo. Lá embaixo, na neve, entre as sombras de galhos secos, está parada uma figura escura. Estática, e a figura sumiu.
look.i_family_portrait=Um retrato pintado em uma pesada moldura entalhada, com uma placa embaixo: THE WASHINGTON FAMILY. À esquerda, Hannah, de óculos e com um pingente de coração, e Beth, de franja; a mão de Hannah repousa no ombro de uma mulher sorridente à frente, de cabelo curto e escuro. Atrás, um homem de bigode passa o braço em volta de Josh, que sorri à direita, de suéter escuro sobre uma gola branca.
look.i_car_lookat=Dentro do carro, os bancos estão cheios de coisas: duas sacolas de compras cor-de-rosa de papel, uma bolsa de viagem estampada, frascos de esmalte e de loção, revistas e uma banana.
look.i_hotel_poster=Um cartaz desbotado: um grande hotel de madeira com longas varandas e empenas íngremes, sob um pico recortado e um céu estrelado.
look.i_wanted_poster_lookat_new=A parte de cima do cartaz foi arrancada, e com ela o rosto da foto; acima de WANTED resta só um pedaço escuro da imagem.
look.i_missing_axe=Na parede de toras está pendurada uma longa caixa de madeira para um machado, vazia, a não ser pelos dois suportes que o prendiam.
look.i_prom_night_photo=Uma foto sob árvores verdes. Da esquerda: Hannah, de óculos, uma pequena borboleta preta tatuada no braço; Sam, loira, de vestido florido, estende a mão para a câmera; Mike, de smoking e gravata-borboleta, abraça Emily, que sorri à direita, de vestido azul.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Uma foto desbotada numa praia, com o mar e um promontório atrás. Josh, no meio, abraça Hannah, à esquerda, de óculos, com uma pequena borboleta tatuada no braço, e Beth, à direita, de franja.
look.i_minemap=Uma velha planta dos túneis da mina. No quadro: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Carimbos vermelhos, AREAS AT RISK DANGER e DANGER repetidas vezes, marcam áreas sombreadas de vermelho, com anotações à mão em vermelho: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). No canto: BLACKWOOD MINES.
look.i_cigarstub=Um toco de charuto apagado, a ponta queimada até virar cinza. Seu anel creme diz CLASSIC dos dois lados de um escudo vermelho-escuro com um cocar de penas.
look.i_mysticalsymbols=Borrado em vermelho-escuro nas tábuas: um rosto como uma caveira, de dentes à mostra, sob largos chifres ramificados, a tinta escorrendo. Ao lado pende um crânio de cervo com penas.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Debaixo do convite, uma foto em preto e branco de Mike de smoking e gravata-borboleta. Em volta, no quadro de cortiça, numa moldura escura e rebuscada: fotos de Sam, de Emily, Hannah e Beth juntas, de um cachorro e de gatos, da Tower Bridge e de paisagens; rosetas com cavalos, marcadas 1ST e SPECIAL; dois ingressos para um show de HARRY VOGUE; um rosto rabiscado assinado JOSH; e bilhetes: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Uma velha casa de bonecas de madeira de dois andares sobre uma cômoda: telhado cinza de telhas de madeira com uma janela redonda no frontão, janelas com venezianas e uma varanda ao longo da frente. Numa janela de cima, uma boneca nua e pálida de cabelo loiro; por uma janela de baixo veem-se vagamente outras bonecas, e na varanda há uma cabeça de boneca. Ao lado, numa mala aberta, uma boneca de cabelo escuro com vestido magenta e um livro escuro com uma cruz; na frente, três cubos de brinquedo empilhados, cada um mostrando um 6.
look.i_snowybench=Sob a neve varrida, há um coração entalhado nas tábuas, com letras riscadas dentro.
look.i_headlessdoll=Uma boneca bebê nua e sem cabeça, de plástico encardido, manchado e rachado, com um buraco escuro no pescoço e unhas minúsculas pintadas de vermelho. Nas costas, um adesivo com três borboletas e o nome Hannah em letra rebuscada; no peito, uma área redonda de furinhos.
look.i_readnote=As letras vermelhas escorreram. No verso, um timbre impresso, NORTHERN PROVINCES PENITENTIARY, ao lado de um selo redondo com uma balança; o vermelho transparece invertido.
look.i_controls_lookat=Uma mesa de controle de metal cinza, gasta e arranhada: ao fundo, mostradores marcados A, V e Hz; fileiras de lâmpadas amarelas, verdes e brancas, chaves giratórias, botões redondos e um teclado; à direita, uma placa azul com uma fenda de alavanca marcada STOP, NEUTRAL, RUN, e no meio um interruptor vermelho com fenda para chave. Por cima, letras vermelhas borradas de novo e de novo: DIE.
