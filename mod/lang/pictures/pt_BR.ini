; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinco amigos rindo junto a um balcão de madeira: Chris, de óculos, segura uma lata; Josh ri sentado em uma banqueta, com uma garrafa; Sam, de suéter vermelho estampado, está sentada no balcão; à direita, Matt e Mike se inclinam para perto.
picture.t_camera_chris_01_clr_up=Uma selfie em uma cabine de teleférico: Josh, de gorro, faz o sinal de V entre Hannah, de óculos, e Beth, de jaqueta rosa.
picture.t_camera_ashley_01_clr_up=Matt com o braço em volta de Ashley, que usa um gorro listrado e segura um celular; os dois sorriem.
picture.t_camera_hannah_01_clr_up=Um quarto, com as letras H e W na parede: Jessica e Emily estão sentadas junto à cama com copos vermelhos, Ashley está de pé, de gorro, e Hannah, de óculos, fala ao telefone.
picture.t_camera_mike_01_clr_up=Uma pegadinha: Emily, com um sorriso largo, desenha no rosto de Chris, que dorme em um sofá com o rosto já rabiscado, enquanto Jessica sorri de orelha a orelha atrás dele.
look.i_psychsession_1_interaction=Um milharal em um dia ensolarado: um celeiro vermelho à esquerda e, à direita, um espantalho de chapéu de palha, com um sorriso arreganhado, um lenço vermelho no pescoço e um gancho no lugar de uma das mãos. No milho escuro, no canto inferior esquerdo, dois pequenos olhos amarelos.
look.i_sams_sketchbook.1=Retratos a lápis. À esquerda: Sam, com o cabelo preso frouxo para trás, um cachecol no pescoço, olhando para o lado. À direita: Jessica, sorrindo, com uma longa trança sobre o ombro, de parka com capuz de pele.
look.i_sams_sketchbook.2=Retratos a lápis. À esquerda: Mike, de cabelo penteado para cima, barba por fazer, olhando para o lado, de camisa xadrez e jaqueta com capuz. À direita: Josh, de gorro de tricô, com um leve sorriso, olhando direto para a frente.
look.i_sams_sketchbook.3=Retratos a lápis. À esquerda: Emily, cabelo escuro e liso repartido ao meio, lábios franzidos, de blusa de gola alta e gola de pele. À direita: Chris, cabelo espetado e óculos retangulares, de jaqueta acolchoada, a boca aberta como se estivesse falando.
look.i_sams_sketchbook.4=Retratos a lápis. À esquerda: Ashley, de gorro canelado, cabelo longo e liso, sorrindo suavemente. À direita: Matt, cabelo curto e cacheado, sorrindo, de suéter de gola alta.
look.i_map=Um mapa da montanha, com os lugares marcados LODGE, SANATORIUM e CABLE CAR. Trilhas pontilhadas vermelhas levam do teleférico ao chalé e, mais acima, ao sanatório, e pela trilha RANGER PATH até uma torre com um símbolo de rádio; embaixo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras vermelhas pintadas toscamente nas paredes, repetidas sem parar: DIE.
look.i_security_monitor=Na tela, um banheiro escuro com uma banheira grande dá lugar à imagem de uma câmera de segurança vista de cima: um prédio de madeira coberto de neve, uma lâmpada acesa sobre um banco na varanda comprida, pinheiros na névoa ao fundo. Lá embaixo, na neve, entre as sombras de galhos secos, está parada uma figura escura. Estática, e a figura sumiu.
look.i_family_portrait=Um retrato pintado em uma pesada moldura entalhada, com uma placa embaixo: THE WASHINGTON FAMILY. À esquerda, Hannah, de óculos e com um pingente de coração, e Beth, de franja; a mão de Hannah repousa no ombro de uma mulher sorridente à frente, de cabelo curto e escuro. Atrás, um homem de bigode passa o braço em volta de Josh, que sorri à direita, de suéter escuro sobre uma gola branca.
look.i_car_lookat=Dentro do carro, os bancos estão cheios de coisas: duas sacolas de compras cor-de-rosa de papel, uma bolsa de viagem estampada, frascos de esmalte e de loção, revistas e uma banana.
look.i_hotel_poster=Um cartaz desbotado: um grande hotel de madeira com longas varandas e empenas íngremes, sob um pico recortado e um céu estrelado.
look.i_prom_night_photo=Na foto, Hannah tem uma pequena borboleta preta tatuada na parte de cima do braço.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Na foto, Hannah tem uma pequena borboleta tatuada na parte de cima do braço.
look.i_mysticalsymbols=Borrado em vermelho-escuro nas tábuas: um rosto como uma caveira, de dentes à mostra, sob largos chifres ramificados, a tinta escorrendo. Ao lado pende um crânio de cervo com penas.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Debaixo do convite, uma foto em preto e branco de Mike de smoking e gravata-borboleta. Em volta, no quadro de cortiça, numa moldura escura e rebuscada: fotos de Sam, de Emily, Hannah e Beth juntas, de um cachorro e de gatos, da Tower Bridge e de paisagens; rosetas com cavalos, marcadas 1ST e SPECIAL; dois ingressos para um show de HARRY VOGUE; um rosto rabiscado assinado JOSH; e bilhetes: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Uma velha casa de bonecas de madeira de dois andares sobre uma cômoda: telhado cinza de telhas de madeira com uma janela redonda no frontão, janelas com venezianas e uma varanda ao longo da frente. Numa janela de cima, uma boneca nua e pálida de cabelo loiro; por uma janela de baixo veem-se vagamente outras bonecas, e na varanda há uma cabeça de boneca. Ao lado, numa mala aberta, uma boneca de cabelo escuro com vestido magenta e um livro escuro com uma cruz; na frente, três cubos de brinquedo empilhados, cada um mostrando um 6.
look.i_snowybench=Sob a neve varrida, há um coração entalhado nas tábuas, com letras riscadas dentro.
look.i_headlessdoll=Uma boneca bebê nua e sem cabeça, de plástico encardido, manchado e rachado, com um buraco escuro no pescoço e unhas minúsculas pintadas de vermelho. Nas costas, um adesivo com três borboletas e o nome Hannah em letra rebuscada; no peito, uma área redonda de furinhos.
look.i_controls_lookat=Uma mesa de controle de metal cinza, gasta e arranhada: ao fundo, mostradores marcados A, V e Hz; fileiras de lâmpadas amarelas, verdes e brancas, chaves giratórias, botões redondos e um teclado; à direita, uma placa azul com uma fenda de alavanca marcada STOP, NEUTRAL, RUN, e no meio um interruptor vermelho com fenda para chave. Por cima, letras vermelhas borradas de novo e de novo: DIE.
look.a_telescope=Pelo telescópio, à noite: uma encosta nevada com rochas e pinheiros, um tronco alto e claro subindo em curva no meio. Embaixo, à esquerda, numa trilha nevada junto a uma grande rocha, Emily e Mike estão bem juntos, frente a frente: a mão dele no rosto dela, as mãos dela na cintura dele. Bem à direita, entre galhos nus, alguém está sentado sozinho num banco sob um abrigo iluminado.
look.i_telescope.act2_2=Pelo telescópio, à noite: pedras cobertas de neve e, atrás delas, o canto de uma cabana de toras sob um telhado cheio de pingentes de gelo; uma lâmpada brilha sob o beiral, acima de um ventilador gradeado. Não há ninguém à vista.
look.i_telescope.act2_3=Pelo telescópio, à noite: uma clareira nevada entre árvores, onde um balanço de tábua pende de duas cordas compridas. Atrás, saliências de rocha cobertas de neve e arbustos nus; à esquerda, samambaias e um tronco coberto de hera.
look.i_death_whistle=Um apito entalhado em forma de caveira com chifres largos e ramificados. Virado, mostra o rosto: duas órbitas fundas e uma boca redonda aberta, contornadas de tinta branca, e uma corrente de laços brancos pintada pela testa.
look.i_smashed_vase=Cacos de um vaso vermelho-escuro estão espalhados pelo chão; Ashley segura um deles, de bordas quebradas ásperas e claras.
look.i_sams_bracelet=Uma pulseira de cordão trançado, azul com uma estampa de losangos amarelos, vermelhos e roxos, com um fecho de metal rosado.
look.i_picture_lookat=Um quadro numa moldura escura e rachada: uma casa de madeira de dois andares à noite sob um céu de tempestade, toda em azuis e cinzas escuros, com uma janela redonda no alto da empena, janelas com venezianas em cima e uma longa varanda com corrimão embaixo.
look.i_dollhouse_complete=Pelas janelas da casa de bonecas, bonecas lá dentro; depois, de perto, quatro bonecas nuas amontoadas, todas com o mesmo rosto de boneca: uma ruiva, uma morena, uma loira de maria-chiquinha e uma de pele escura segurando uma pequena câmera de vídeo, como Ashley, Emily, Jessica e Matt. Os olhos delas são buracos pretos, com escorridos vermelho-escuros descendo pelas bochechas.
look.i_dollhouse_complete.open=A fachada da casa de bonecas se abre e o telhado se ergue: dois andares de cômodos minúsculos com bonecas nuas encenadas, todas com o mesmo rosto de boneca, mas com o cabelo dos amigos. Em cima, junto a uma mesa com garrafas e um copo, uma boneca morena está esparramada num sofá ao lado de uma loira de óculos, como Josh e Chris. Embaixo, quatro bonecas estão ajoelhadas num tapete vermelho, de frente para uma cama: uma de pele escura filmando com uma pequena câmera de vídeo, uma loira de maria-chiquinha, uma morena e uma ruiva, como Matt, Jessica, Emily e Ashley; outra boneca está de pé à parte.
look.i_doll_house_lookat_keyhole=No alto da empena da casa de bonecas, a janelinha redonda foi girada para o lado como uma tampa: atrás dela, uma placa redonda de latão com um buraco de fechadura, contornada de vermelho.
look.i_doll_house_key=Uma pequena chave antiga de ferro, com a argola em forma de coração e a haste com sulcos em espiral. Estava pendurada num ganchinho de latão, escondida atrás do quadro.
look.i_wine_rack=Uma adega alta de madeira atrás de uma grade de tiras de ferro em losangos; as tábuas de cima estão quebradas e lascadas, com buracos escuros abertos nelas.
look.i_wine_cellar_door.act5_3=Uma porta de tábuas reforçada com tiras de ferro; na placa enferrujada da fechadura não há maçaneta, só um pequeno buraco quadrado.
look.i_doll_head=Virada para ela, a cabeça careca da boneca: órbitas pretas e vazias rodeadas de cílios pintados, bochechas rosadas, lábios vermelhos, a tinta rachada e descascando, e uma rachadura escura que desce de um olho passando pela boca.
look.i_doll_head.roaches=Baratas saem em enxame da cabeça da boneca.
look.i_sams_sack=Debaixo do saco está Sam, de toalha de banho, sentada imóvel numa velha cadeira giratória de madeira.
look.crossedout=Uma foto está riscada: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Uma tela de arame enferrujada esticada entre dois postes de madeira, a mão de Emily agarrada ao da direita; através dela, lá embaixo, sob uma luz fraca e azulada, o chão de um túnel coberto de entulho, com uma viga escura atravessada.
look.i_torn_miner_clothes=Sobre as pedras há um velho capacete de mineiro: uma cúpula de metal escuro com nervuras em relevo, uma aba larga e enferrujada e, na frente, uma pequena lâmpada de latão com um refletor redondo.
look.i_broken_ladder=Uma escada de mão quebrada está atravessada sobre o entulho: uma longa haste de madeira da qual saem três degraus de ferro enferrujados, com as pontas quebradas, e restos lascados de madeira ainda presos a dois deles.
look.i_sign=Na poeira há um pedaço quebrado de uma placa de madeira desgastada pelo tempo, com as bordas irregulares e lascadas; nele, em maiúsculas vermelhas desbotadas feitas com estêncil, o fim de uma palavra, GER, e embaixo EDGE.
look.i_peer_at_head=Através de uma tela de arame escura, entre tábuas brutas: além delas, sobre um chão pedregoso, um barril coberto por uma lona e, mais atrás, um corrimão de madeira e montes de entulho.
look.i_peer_at_wheel=Através de uma tela de arame enferrujada entre dois postes: uma caverna do outro lado e, nela, uma grande e velha roda-d'água de madeira entre andaimes quebrados; ao pé dela, uma labareda irrompe do escuro e se apaga.
look.i_scarecrow_lookat=Um espantalho, os braços de galhos nus que terminam em gravetos, o corpo um saco plástico preto sujo de sangue. A cabeça está envolta num pano claro amarrado no pescoço com uma corda; por ele transparece um rosto apodrecido, um nariz oco e uma boca aberta de dentes podres, um dos lados encharcado de sangue. Sob um chapéu marrom surrado pendem longos cabelos pretos.
look.i_scarecrow_lookat.clown=Um espantalho, os braços de galhos nus que terminam em gravetos, o corpo um saco plástico preto sujo de sangue. A cabeça é uma máscara de palhaço: um rosto branco e enrugado, sobrancelhas roxas pintadas em arcos altos testa acima, buracos escuros nos olhos contornados de roxo, um nariz vermelho e um largo sorriso de dentes longos e afiados, vermelho nos cantos, o queixo escuro de sangue.
look.i_scarecrow_lookat.zombie=Um espantalho, os braços de galhos nus que terminam em gravetos, o corpo um saco plástico preto sujo de sangue. A cabeça é a de um zumbi apodrecido: careca, pele manchada de cinza-esverdeado, olhos brancos vazios e uma boca escancarada cheia de dentes.
look.i_dead_crow_lookat=Dois corvos mortos jazem na neve manchada de sangue, dilacerados e ensanguentados, de asas abertas e com as entranhas para fora; penas pretas soltas estão espalhadas ao redor.
look.i_chair_and_blood=No chão de concreto, um banquinho de madeira tombado, com as pernas quebradas; ao lado, uma algema de ferro aberta presa a uma corrente. Há sangue respingado e pingado pelo chão, e um lampião caído de lado, ainda aceso.
look.i_fake_torso=A metade de cima de um corpo de camisa xadrez cinza está pendurada com os braços esticados para cima; abaixo da cintura não há nada além de um corte irregular e ensanguentado. Atrás, uma tábua com um buraco recortado.
look.i_saw_blades=Uma enorme lâmina de serra circular está deitada, o aço enferrujado sujo de sangue escuro; atrás, uma cerca de tela de arame.
look.i_dead_wolf_inspect=Um lobo morto está pendurado nas grades da porta de uma cela: o peito e a barriga rasgados de ponta a ponta e vazios, a cabeça caída com as mandíbulas escancaradas, e embaixo dele as entranhas jazem numa poça de sangue.
look.i_damaged_doors=Uma pesada porta de cela de aço com painéis amassados: uma grande mancha escura de sangue escorre por ela, o sangue pingou de baixo da pequena portinhola no alto, e marcas fundas de garras estão cravadas no metal.
look.i_sanlookat=Uma cerca de tela de arame: à esquerda, um poste escuro e, atravessando-a, uma barra enferrujada. Através da tela, na neve do outro lado, um lance curto de degraus de concreto com um corrimão de metal.
look.i_oilflask=Erguida bem diante dos olhos, uma lata alta de metal vermelha e enferrujada. De um lado, um emblema oval desbotado diz North West em volta das letras NWM, com Mining embaixo; no lado estreito, um losango vermelho diz FLAMMABLE LIQUID.
look.i_oilflask.roaches=Baratas saem rastejando por cima da lata, e ela a arremessa longe.
look.i_admin_area_jacksdoor_lookat_reader=Um leitor de cartões preto na parede ao lado de uma porta de madeira, com um pequeno painel vermelho onde se lê LOCKED; na porta, sob uma janelinha, uma placa verde enferrujada: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=Na bandeja do necrotério, puxada para fora, jaz de costas um cadáver em decomposição: um rosto cinzento e encolhido, de boca escancarada, cercado de cabelos escuros grudados; a camisa cinza e a bandeja enferrujada estão manchadas de sangue velho.
look.i_jackslair_exit_lock_lookat=Um portão de ferro de tela em losangos está trancado: um cadeado grande e enferrujado pende do porta-cadeado, junto ao batente de madeira.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Dois cartazes de MISSING: HANNAH WASHINGTON e BETH WASHINGTON; o de Hannah diz: She has glasses, and has a tattoo of a butterfly on her right shoulder. Um bilhete amarelo: NEVER FORGET. Recortes de jornal: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. Em uma foto de quatro garotas, Hannah está circulada em vermelho.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_snowwipe_tractor_revisit=Atrás do vidro sujo e salpicado da cabine do velho caminhão há uma máscara de hóquei branca pintada como uma caveira: buracos oblíquos nos olhos, um nariz de caveira e um largo sorriso de dentes longos, dois traços escuros acima de um olho, uma lasca faltando no topo.
look.i_joshsbaseball=Uma bola de beisebol velha e suja, o couro arranhado e manchado de marrom, a costura de um vermelho desbotado; nela, escrito à mão em preto: Josh.
look.i_loveheart=Há um coração entalhado na casca clara de um tronco de árvore e, dentro dele, M+E.
look.i_rifle_lookat=Numa barraca de madeira, um rifle está deitado sobre o balcão de tábuas. Lá fora, mais adiante na neve, há barris velhos com garrafas em cima, e dos galhos pendem sacos presos a cordas, um deles marcado com um X.
look.i_look_at_picture==look.i_picture_lookat
look.i_wine_cellar_door.act2_4=Uma porta de tábuas reforçada com tiras de ferro; na placa enferrujada da fechadura há uma maçaneta redonda.
look.i_rush_of_blood_snowglobe=Um globo de neve sobre uma base pintada com ziguezagues vermelhos e azuis. Dentro do vidro, sobre um montículo nevado, o trilho de madeira de uma montanha-russa se retorce em loopings sobre estacas finas, com pequenos carrinhos em cima; balões vermelhos com estrelas brancas e placas vermelhas em forma de seta, salpicadas de luzes, se erguem entre os loopings.
look.i_chess_piece=Tirada de um tabuleiro de xadrez, uma pequena estatueta de um homem, mais ou menos do comprimento de um dedo: ele está de pé com os braços ao lado do corpo, de camiseta e calça, e o rosto é liso, sem feições.
look.i_fallen_beams=No chão há um painel de grade de ferro soldada numa armação enferrujada, com algumas barras quebradas e dois grandes pedaços de rocha em cima; uma corrente pesada pende de uma argola num dos cantos.
look.i_lookatmineexit=De perto, uma porta de tábuas desgastadas pelo tempo com um grande buraco de bordas irregulares aberto nela; pelo buraco, só há uma névoa cinza-clara.
look.i_matts_shoe=Uma bota de inverno grande, apanhada do chão: o cano de couro azul-escuro com o cadarço passado por presilhas, um forro de feltro aparecendo em cima e um pé de borracha escura com listras brancas, sujo de lama.
