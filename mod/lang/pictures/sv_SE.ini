; The padlock drawn over a locked collectible: the game's own word for a locked item.
picture.mi_padlock=@SMG013_64519
; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Fem vänner skrattar vid en bardisk i trä: Chris, i glasögon, håller en burk; Josh skrattar på en barstol med en flaska; Sam, i en röd mönstrad tröja, sitter på disken; till höger lutar sig Matt och Mike in mot de andra.
picture.t_camera_chris_01_clr_up=En selfie i en linbanevagn: Josh, i mössa, gör ett V-tecken mellan Hannah, i glasögon, och Beth, i en rosa jacka.
picture.t_camera_ashley_01_clr_up=Matt med armen om Ashley, som har en randig mössa och håller i en telefon; båda ler.
picture.t_camera_hannah_01_clr_up=Ett sovrum, bokstäverna H och W på väggen: Jessica och Emily sitter vid sängen med röda muggar, Ashley står i mössa, och Hannah, i glasögon, pratar i telefon.
picture.t_camera_mike_01_clr_up=Ett spratt: Emily ritar flinande i ansiktet på Chris, som sover på en soffa med ansiktet redan nedklottrat, medan Jessica flinar bakom honom.
look.i_psychsession_1_interaction=Ett majsfält en solig dag: en röd lada till vänster och till höger en fågelskrämma med halmhatt, ett flinande ansikte, en röd halsduk och en krok i stället för ena handen. I den mörka majsen nere till vänster, två små gula ögon.
look.i_sams_sketchbook.1=Blyertsporträtt. Till vänster: Sam, håret löst bakbundet, en halsduk om halsen, tittar åt sidan. Till höger: Jessica, leende, en lång fläta över axeln, i en parkas med pälshuva.
look.i_sams_sketchbook.2=Blyertsporträtt. Till vänster: Mike, håret uppborstat, skäggstubb, tittar åt sidan, i rutig skjorta och en jacka med huva. Till höger: Josh, i en stickad mössa, ett svagt leende, tittar rakt fram.
look.i_sams_sketchbook.3=Blyertsporträtt. Till vänster: Emily, rakt mörkt hår med mittbena, snörpt mun, i polotröja och pälskrage. Till höger: Chris, spretigt hår och rektangulära glasögon, i en quiltad jacka, munnen öppen som mitt i ett ord.
look.i_sams_sketchbook.4=Blyertsporträtt. Till vänster: Ashley, i en ribbstickad mössa, långt rakt hår, ler milt. Till höger: Matt, kort lockigt hår, leende, i en polotröja.
look.i_map=En karta över berget med platserna märkta LODGE, SANATORIUM och CABLE CAR. Röda prickade stigar leder från linbanan till stugan och vidare upp till vårdhemmet, och längs RANGER PATH till ett torn med en radiosymbol; längst ner TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Röda bokstäver kladdade över väggarna, om och om igen: DIE.
look.i_security_monitor=På skärmen avlöses ett mörkt badrum med ett stort badkar av en övervakningskameras bild uppifrån: en snötäckt träbyggnad, en tänd lampa över en bänk på den långa verandan, granar i dimman bakom. Nere i snön, bland skuggorna av kala grenar, står en mörk gestalt. Brus i bilden, och gestalten är borta.
look.i_family_portrait=Ett målat porträtt i en tung, snidad ram, med en skylt under: THE WASHINGTON FAMILY. Till vänster Hannah, i glasögon och med ett hjärthänge, och Beth, med lugg; Hannahs hand vilar på axeln hos en leende kvinna längst fram, med kort mörkt hår. Bakom håller en man med mustasch armen om Josh, som ler till höger i en mörk tröja över en vit krage.
look.i_car_lookat=I bilen ligger sätena fulla av saker: två rosa papperskassar, en mönstrad resväska, flaskor med nagellack och lotion, tidningar och en banan.
look.i_hotel_poster=En blekt affisch: ett stort trähotell med långa verandor och branta gavlar under en taggig topp och en stjärnhimmel.
look.i_prom_night_photo=På fotot har Hannah en liten svart fjäril tatuerad på överarmen.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=På fotot har Hannah en liten fjäril tatuerad på överarmen.
look.i_mysticalsymbols=Kladdat på plankorna i mörkrött: ett dödskalleliknande ansikte med blottade tänder under vida, grenade horn, färgen rinner i droppar. Bredvid hänger ett hjortkranium med fjädrar.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Under inbjudan ett svartvitt foto av Mike i smoking och fluga. Runt omkring på korktavlan, i en snirklig mörk ram: foton av Sam, av Emily, Hannah och Beth tillsammans, av en hund och katter, av Tower Bridge och landskap; rosetter med hästar, märkta 1ST och SPECIAL; två konsertbiljetter till HARRY VOGUE; ett klottrat ansikte signerat JOSH; och lappar: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Ett gammalt tvåvånings dockskåp i trä på en byrå: ett grått spåntak med ett runt fönster i gaveln, fönster med luckor, en veranda längs framsidan. I ett fönster på övervåningen en blek naken docka med blont hår; genom ett fönster nedtill skymtar fler dockor, och på verandan ligger ett dockhuvud. Bredvid, i en öppen resväska, en mörkhårig docka i magentafärgad klänning och en mörk bok med ett kors; framför tre staplade leksaksklossar som alla visar en 6:a.
look.i_snowybench=Under den bortsopade snön är ett hjärta inristat i plankorna, med bokstäver inristade i det.
look.i_headlessdoll=En naken babydocka utan huvud, plasten smutsig, fläckig och sprucken, ett mörkt hål vid halsen, pyttesmå naglar målade röda. På ryggen ett klistermärke med tre fjärilar och namnet Hannah i snirklig skrift; på bröstet en rund fläck med små hål.
look.i_controls_lookat=Ett grått manöverbord av metall, slitet och repigt: längst bak mätare märkta A, V och Hz, rader av gula, gröna och vita lampor, vridomkopplare, runda tryckknappar och en knappsats; till höger en blå platta med en spakskåra märkt STOP, NEUTRAL, RUN, och i mitten en röd strömbrytare med nyckelhål. Om och om igen kladdat över det med röda bokstäver: DIE.
look.a_telescope=Genom teleskopet, på natten: en snöig sluttning med klippor och tallar, en hög, ljus trädstam som böjer sig uppåt i mitten. Nere till vänster, på en snöig stig vid ett stort klippblock, står Emily och Mike tätt intill varandra, ansikte mot ansikte: hans hand vid hennes kind, hennes händer vid hans midja. Långt till höger, genom kala grenar, sitter någon ensam på en bänk under ett upplyst skjul.
look.i_telescope.act2_2=Genom teleskopet, på natten: snöiga stenblock, och bakom dem hörnet av en timmerstuga under ett tak fullt av istappar; under takfoten lyser en lampa ovanför en fläkt bakom galler. Ingen syns till.
look.i_telescope.act2_3=Genom teleskopet, på natten: en snöig glänta bland träd, där en gunga av en träplanka hänger i två långa rep. Bakom den snöiga klipphyllor och kala buskar; till vänster ormbunkar och en murgrönsklädd trädstam.
look.i_death_whistle=En snidad visselpipa formad som en dödskalle med breda, grenade horn. Vänd mot henne visar den sitt ansikte: två djupa ögonhålor och en rund öppen mun, inringade med vit färg, och en kedja av vita öglor målad nedför pannan.
look.i_smashed_vase=Skärvor av en mörkröd vas ligger utspridda på golvet; Ashley håller upp en av dem, med sträva, ljusa brottkanter.
look.i_sams_bracelet=Ett flätat snörarmband, blått med ett mönster av gula, röda och violetta romber, stängt med ett rosaaktigt metallås.
look.i_picture_lookat=En målning i en mörk, sprucken ram: ett tvåvåningshus av trä om natten under en stormig himmel, helt i mörkblått och grått, med ett runt fönster högt upp i gaveln, fönster med fönsterluckor på övervåningen och en lång veranda med räcke nedanför.
look.i_dollhouse_complete=Genom dockskåpets fönster syns dockor därinne; sedan, på nära håll, fyra nakna dockor tätt ihop, alla med samma dockansikte: en rödhårig, en mörkhårig, en blond med tofsar och en mörkhyad som håller en liten videokamera, som Ashley, Emily, Jessica och Matt. Deras ögon är svarta hål, med mörkröda strimmor nedför kinderna.
look.i_dollhouse_complete.open=Dockskåpets framsida svänger upp och taket lyfts: två våningar med pyttesmå rum där nakna dockor ställts upp, alla med samma dockansikte, men med vännernas hår. På övervåningen, vid ett bord med flaskor och ett glas, ligger en mörkhårig docka utsträckt i en soffa bredvid en blond med glasögon, som Josh och Chris. På nedervåningen knäböjer fyra dockor på en röd matta vända mot en säng: en mörkhyad som filmar med en liten videokamera, en blond med tofsar, en mörkhårig och en rödhårig, som Matt, Jessica, Emily och Ashley; ytterligare en docka står för sig själv.
look.i_doll_house_lookat_keyhole=Högt upp i dockskåpets gavel har det lilla runda fönstret vridits åt sidan som ett lock: bakom det en rund mässingsplatta med ett nyckelhål, inramad i rött.
look.i_doll_house_key=En liten gammal järnnyckel med ett hjärtformat grepp och ett spiralräfflat skaft. Den hängde på en liten mässingskrok, gömd bakom målningen.
look.i_wine_rack=Ett högt vinställ av trä bakom ett rutmönstrat galler av järnband; de övre brädorna är inslagna och splittrade, med mörka hål rivna genom dem.
look.i_wine_cellar_door=En plankdörr förstärkt med järnband; på den rostiga låsplåten finns inget handtag, bara ett litet fyrkantigt hål.
look.i_doll_head=Vänt mot henne, det skalliga dockhuvudet: svarta, tomma ögonhål kantade av målade fransar, rosiga kinder, röda läppar, färgen sprucken och flagnande, och en mörk spricka som löper från ena ögat ned förbi munnen.
look.i_doll_head.roaches=Kackerlackor väller ut ur dockhuvudet.
look.i_sams_sack=Under säcken är Sam, i en badhandduk, och sitter orörlig i en gammal snurrstol av trä.
look.crossedout=Ett foto är överstruket: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Rostigt metallnät spänt mellan två trästolpar, Emilys hand om den högra; genom det, nedanför, i svagt blåaktigt ljus, ett tunnelgolv fullt av sten, med en mörk bjälke liggande tvärs över.
look.i_torn_miner_clothes=På stenarna ligger en gammal gruvarbetarhjälm: en mörk metallkupol med upphöjda ribbor, ett brett rostigt brätte och framtill en liten mässingslampa med en rund reflektor.
look.i_broken_ladder=En trasig stege ligger tvärs över stenbråten: ett långt sidostycke av trä med tre rostiga järnpinnar som sticker ut ur det, de yttre ändarna avbrutna, och på två av dem sitter det fortfarande flisiga träbitar kvar.
look.i_sign=En avbruten bit av en väderbiten träskylt ligger i dammet, kanterna ojämna och flisiga; på den står med bleka röda schablonversaler slutet av ett ord, GER, och under det EDGE.
look.i_peer_at_head=Genom mörkt metallnät, mellan grova plankor: bortom dem, på ett stenigt golv, en tunna med en presenning över toppen, och längre bort ett träräcke och högar av stenbråte.
look.i_peer_at_wheel=Genom rostigt metallnät mellan två stolpar: en grotta bortom, och i den ett stort gammalt vattenhjul av trä bland trasiga byggnadsställningar; vid dess fot blossar eld upp ur mörkret och dör bort.
look.i_scarecrow_lookat=En fågelskrämma, armarna kala grenar som slutar i kvistar, kroppen en svart plastpåse insmord med blod. Huvudet är lindat i ljust tyg, knutet om halsen med rep; genom det skymtar ett ruttnande ansikte, en ihålig näsa och en öppen mun med ruttna tänder, ena sidan genomdränkt av blod. Under en sliten brun hatt hänger långt svart hår.
look.i_scarecrow_lookat.clown=En fågelskrämma, armarna kala grenar som slutar i kvistar, kroppen en svart plastpåse insmord med blod. Huvudet är en clownmask: ett vitt, rynkigt ansikte, lila ögonbryn målade i höga bågar uppför pannan, mörka ögonhål kantade med lila, en röd näsa och ett brett flin med långa vassa tänder, rött i mungiporna, hakan mörk av blod.
look.i_scarecrow_lookat.zombie=En fågelskrämma, armarna kala grenar som slutar i kvistar, kroppen en svart plastpåse insmord med blod. Huvudet är ett ruttnande zombiehuvud: skalligt, gråaktigt grön fläckig hud, tomma vita ögon och en gapande mun full av tänder.
look.i_dead_crow_lookat=Två döda kråkor ligger i blodfläckad snö, uppslitna och blodiga, med utbredda vingar och inälvorna vällande ut; lösa svarta fjädrar ligger strödda runt dem.
look.i_chair_and_blood=På betonggolvet ligger en träpall vält, med brutna ben; bredvid den en öppen järnboja i en kedja. Blod har stänkt och droppat över golvet, och en lykta ligger på sidan, fortfarande tänd.
look.i_fake_torso=Överdelen av en kropp i grårutig skjorta hänger med armarna sträckta uppåt; nedanför midjan finns inget annat än ett trasigt, blodigt snitt. Bakom den står en skiva med ett hål urskuret.
look.i_saw_blades=Ett enormt cirkelsågblad ligger platt, dess rostiga stål insmort med mörkt blod; bakom det ett nätstängsel.
look.i_dead_wolf_inspect=En död varg hänger på gallret i en celldörr: bröstet och buken är vitt uppslitna och tomma, huvudet hänger med käftarna på vid gavel, och under den ligger inälvorna i en blodpöl.
look.i_damaged_doors=En tung celldörr av stål med bucklade paneler: en stor mörk blodstrimma rinner nedför den, blod har droppat ner under den lilla luckan upptill, och djupa klomärken är rivna in i metallen.
look.i_sanlookat=Ett nätstängsel: till vänster en mörk stolpe, tvärs över en rostig stång. Genom nätet, i snön bortom, en kort betongtrappa med ett metallräcke.
look.i_oilflask=Hållen tätt framför ögonen, en hög rostig röd metalldunk. På sidan står det på ett blekt ovalt emblem North West runt bokstäverna NWM, med Mining under; på kortsidan står det på en röd romb FLAMMABLE LIQUID.
look.i_oilflask.roaches=Kackerlackor kryper ut och över dunken, och hon slänger iväg den.
look.i_admin_area_jacksdoor_lookat_reader=En svart kortläsare på väggen bredvid en trädörr, på dess lilla röda display står det LOCKED; på dörren, under ett litet fönster, en rostig grön skylt: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=På den utdragna brickan i bårhuset ligger ett ruttnande lik på rygg: ett grått, hopskrumpet ansikte med gapande mun, mörkt hår klistrat runt omkring; den grå skjortan och den rostiga brickan är fläckade av gammalt blod.
look.i_jackslair_exit_lock_lookat=En järngrind med rombformat nät är låst: ett stort, rostigt hänglås hänger i överfallet vid dörrkarmen av trä.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Två MISSING-affischer: HANNAH WASHINGTON och BETH WASHINGTON; på Hannahs står det: She has glasses, and has a tattoo of a butterfly on her right shoulder. En gul lapp: NEVER FORGET. Tidningsurklipp: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. På ett foto av fyra tjejer är Hannah inringad med rött.
look.i_motivation_board_lookat==look.i_motivation_board
