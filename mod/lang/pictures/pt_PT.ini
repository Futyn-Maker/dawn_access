picture.t_camera_sam_01_clr_up=Cinco amigos a rir num balcão de bar de madeira: o Chris, de óculos, segura uma lata; o Josh ri-se num banco de bar, com uma garrafa; a Sam, de camisola vermelha com padrões, está sentada no balcão; o Matt e o Mike inclinam-se para o grupo, à direita.
picture.t_camera_chris_01_clr_up=Uma selfie num teleférico: o Josh, de gorro, faz o sinal de V entre a Hannah, de óculos, e a Beth, de casaco cor-de-rosa.
picture.t_camera_ashley_01_clr_up=O Matt com o braço à volta da Ashley, que usa um gorro às riscas e segura um telemóvel; ambos sorriem.
picture.t_camera_hannah_01_clr_up=Um quarto, com as letras H e W na parede: a Jessica e a Emily estão sentadas junto à cama com copos vermelhos, a Ashley está de pé, de gorro, e a Hannah, de óculos, fala ao telefone.
picture.t_camera_mike_01_clr_up=Uma partida: a Emily, de sorriso rasgado, desenha na cara do Chris, que dorme num sofá com o rosto já rabiscado, enquanto a Jessica sorri de orelha a orelha atrás dele.
look.i_psychsession_1_interaction=Um campo de milho num dia soalheiro: um celeiro vermelho à esquerda e, à direita, um espantalho com chapéu de palha, um sorriso rasgado, um lenço vermelho ao pescoço e um gancho no lugar de uma mão. No milho escuro, em baixo à esquerda, dois pequenos olhos amarelos.
look.i_sams_sketchbook.1=Retratos a lápis. À esquerda: a Sam, com o cabelo frouxamente apanhado, um cachecol ao pescoço, a olhar para o lado. À direita: a Jessica, a sorrir, com uma longa trança sobre o ombro, de parka com capuz de pelo.
look.i_sams_sketchbook.2=Retratos a lápis. À esquerda: o Mike, com o cabelo penteado para cima, barba por fazer, a olhar para o lado, de camisa aos quadrados e casaco com capuz. À direita: o Josh, de gorro de malha, com um leve sorriso, a olhar de frente.
look.i_sams_sketchbook.3=Retratos a lápis. À esquerda: a Emily, com cabelo escuro e liso, risca ao meio, lábios franzidos, de camisola de gola alta e com uma gola de pelo. À direita: o Chris, com cabelo espetado e óculos retangulares, de casaco acolchoado, de boca aberta, como se estivesse a meio de uma palavra.
look.i_sams_sketchbook.4=Retratos a lápis. À esquerda: a Ashley, de gorro canelado, com cabelo comprido e liso e um sorriso suave. À direita: o Matt, com cabelo curto e encaracolado, a sorrir, de camisola de gola alta.
look.i_map=Um mapa da montanha, com os locais assinalados como LODGE, SANATORIUM e CABLE CAR. Trilhos ponteados a vermelho vão do teleférico à cabana e mais acima até ao sanatório, e pelo RANGER PATH até uma torre com um símbolo de rádio; em baixo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras vermelhas pintadas toscamente nas paredes, vezes sem conta: DIE.
look.i_security_monitor=No ecrã, uma casa de banho às escuras com uma banheira grande dá lugar à imagem de uma câmara de vigilância vista de cima: um edifício de madeira coberto de neve, um candeeiro aceso sobre um banco no longo alpendre, pinheiros no nevoeiro ao fundo. Lá em baixo, na neve, entre as sombras de ramos despidos, está uma figura escura. Interferência, e a figura desapareceu.
look.i_family_portrait=Um retrato pintado numa pesada moldura entalhada, com uma placa por baixo: THE WASHINGTON FAMILY. À esquerda, a Hannah, de óculos e com um pendente em forma de coração, e a Beth, de franja; a mão da Hannah pousa no ombro de uma mulher sorridente à frente, de cabelo curto e escuro. Atrás, um homem de bigode passa o braço à volta do Josh, que sorri à direita, de camisola escura sobre uma gola branca.
