; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinco amigos a rir num balcão de bar de madeira: o Chris, de óculos, segura uma lata; o Josh ri-se num banco de bar, com uma garrafa; a Sam, de camisola vermelha com padrões, está sentada no balcão; o Matt e o Mike inclinam-se para o grupo, à direita.
picture.t_camera_chris_01_clr_up=Uma selfie num teleférico: o Josh, de gorro, faz o sinal de V entre a Hannah, de óculos, e a Beth, de casaco cor-de-rosa.
picture.t_camera_ashley_01_clr_up=O Matt com o braço à volta da Ashley, que usa um gorro às riscas e segura um telemóvel; ambos sorriem.
picture.t_camera_hannah_01_clr_up=Um quarto, com as letras H e W na parede: a Jessica e a Emily estão sentadas junto à cama com copos vermelhos, a Ashley está de pé, de gorro, e a Hannah, de óculos, fala ao telefone.
picture.t_camera_mike_01_clr_up=Uma partida: a Emily, de sorriso rasgado, desenha na cara do Chris, que dorme num sofá com o rosto já rabiscado, enquanto a Jessica sorri de orelha a orelha atrás dele.
look.i_psychsession_1_interaction=Um campo de milho num dia soalheiro: um celeiro vermelho à esquerda e, à direita, um espantalho com chapéu de palha, um sorriso rasgado, um lenço vermelho ao pescoço e um gancho no lugar de uma mão. No milho escuro, em baixo à esquerda, dois pequenos olhos amarelos.
look.i_sams_sketchbook.1=Retratos a lápis. À esquerda: a Sam, com o cabelo frouxamente apanhado, um cachecol ao pescoço, a olhar para o lado. À direita: a Jessica, a sorrir, com uma longa trança sobre o ombro, de parka com capuz de pelo.
look.i_sams_sketchbook.2=Retratos a lápis. À esquerda: o Mike, com o cabelo penteado para cima, barba por fazer, a olhar para o lado, de camisa aos quadrados e casaco com capuz. À direita: o Josh, de gorro de malha, com um leve sorriso, a olhar de frente.
look.i_sams_sketchbook.3=Retratos a lápis. À esquerda: a Emily, com cabelo escuro e liso, risca ao meio, lábios franzidos, de camisola de gola alta e com uma gola de pelo. À direita: o Chris, com cabelo espetado e óculos retangulares, de casaco acolchoado, de boca aberta, como se estivesse a meio de uma palavra.
look.i_sams_sketchbook.4=Retratos a lápis. À esquerda: a Ashley, de gorro canelado, com cabelo comprido e liso e um sorriso suave. À direita: o Matt, com cabelo curto e encaracolado, a sorrir, de camisola de gola alta.
look.i_map=Um mapa da montanha, com os locais assinalados como LODGE, SANATORIUM e CABLE CAR. Trilhos ponteados a vermelho vão do teleférico à cabana e mais acima até ao sanatório, e pelo RANGER PATH até uma torre com um símbolo de rádio; em baixo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras vermelhas pintadas toscamente nas paredes, vezes sem conta: DIE.
look.i_security_monitor=No ecrã, uma casa de banho às escuras com uma banheira grande dá lugar à imagem de uma câmara de vigilância vista de cima: um edifício de madeira coberto de neve, um candeeiro aceso sobre um banco no longo alpendre, pinheiros no nevoeiro ao fundo. Lá em baixo, na neve, entre as sombras de ramos despidos, está uma figura escura. Interferência, e a figura desapareceu.
look.i_family_portrait=Um retrato pintado numa pesada moldura entalhada, com uma placa por baixo: THE WASHINGTON FAMILY. À esquerda, a Hannah, de óculos e com um pendente em forma de coração, e a Beth, de franja; a mão da Hannah pousa no ombro de uma mulher sorridente à frente, de cabelo curto e escuro. Atrás, um homem de bigode passa o braço à volta do Josh, que sorri à direita, de camisola escura sobre uma gola branca.
look.i_car_lookat=Dentro do carro, os bancos estão cheios de coisas: dois sacos de compras cor-de-rosa de papel, um saco de viagem estampado, frascos de verniz e de loção, revistas e uma banana.
look.i_hotel_poster=Um cartaz desbotado: um grande hotel de madeira com longas varandas e empenas íngremes, sob um pico recortado e um céu estrelado.
look.i_wanted_poster_lookat_new=A parte de cima do cartaz foi arrancada, e com ela o rosto da fotografia; acima de WANTED resta só um pedaço escuro da imagem.
look.i_missing_axe=Na parede de troncos está pendurada uma longa caixa de madeira para um machado, vazia, a não ser pelos dois suportes que o prendiam.
look.i_prom_night_photo=Uma fotografia sob árvores verdes. Da esquerda: Hannah, de óculos, uma pequena borboleta preta tatuada no braço; Sam, loura, de vestido florido, estende a mão para a câmara; Mike, de smoking e laço, abraça Emily, que sorri à direita, de vestido azul.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Uma fotografia desbotada numa praia, com o mar e um promontório atrás. Josh, ao meio, abraça Hannah, à esquerda, de óculos, com uma pequena borboleta tatuada no braço, e Beth, à direita, de franja.
look.i_minemap=Uma velha planta dos túneis da mina. No quadro: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Carimbos vermelhos, AREAS AT RISK DANGER e DANGER repetidas vezes, marcam zonas sombreadas a vermelho, com notas à mão a vermelho: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). No canto: BLACKWOOD MINES.
look.i_cigarstub=Uma ponta de charuto apagada, a ponta queimada até às cinzas. O seu anel creme diz CLASSIC de ambos os lados de um escudo vermelho-escuro com um cocar de penas.
look.i_mysticalsymbols=Borratado a vermelho-escuro nas tábuas: um rosto como uma caveira, de dentes à mostra, sob largas hastes ramificadas, a tinta a escorrer. Ao lado pende um crânio de veado com penas.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Debaixo do convite, uma fotografia a preto e branco de Mike de smoking e laço. À volta, no quadro de cortiça, numa moldura escura e trabalhada: fotografias de Sam, de Emily, Hannah e Beth juntas, de um cão e de gatos, da Tower Bridge e de paisagens; rosetas com cavalos, marcadas 1ST e SPECIAL; dois bilhetes para um concerto de HARRY VOGUE; uma cara rabiscada assinada JOSH; e notas: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Uma velha casa de bonecas de madeira de dois pisos sobre uma cómoda: telhado cinzento de telhas de madeira com uma janela redonda no frontão, janelas com portadas e um alpendre ao longo da frente. Numa janela de cima, uma boneca nua e pálida de cabelo louro; por uma janela de baixo veem-se vagamente outras bonecas, e no alpendre está uma cabeça de boneca. Ao lado, numa mala aberta, uma boneca de cabelo escuro com vestido magenta e um livro escuro com uma cruz; à frente, três cubos de brincar empilhados, cada um a mostrar um 6.
look.i_snowybench=Sob a neve varrida, há um coração entalhado nas tábuas, com letras riscadas dentro.
look.i_headlessdoll=Uma boneca bebé nua e sem cabeça, de plástico encardido, manchado e rachado, com um buraco escuro no pescoço e unhas minúsculas pintadas de vermelho. Nas costas, um autocolante com três borboletas e o nome Hannah em letra floreada; no peito, uma zona redonda de pequenos furos.
look.i_readnote=As letras vermelhas escorreram. No verso, um cabeçalho impresso, NORTHERN PROVINCES PENITENTIARY, ao lado de um selo redondo com uma balança; o vermelho transparece invertido.
look.i_controls_lookat=Uma mesa de comando de metal cinzento, gasta e riscada: ao fundo, mostradores marcados A, V e Hz; filas de luzes amarelas, verdes e brancas, comutadores rotativos, botões redondos e um teclado; à direita, uma placa azul com uma ranhura de alavanca marcada STOP, NEUTRAL, RUN, e ao meio um interruptor vermelho com ranhura para chave. Por cima, letras vermelhas borratadas vezes sem conta: DIE.
look.a_telescope=Pelo telescópio, à noite: uma encosta nevada com rochas e pinheiros, um tronco alto e claro a subir em curva ao meio. Em baixo, à esquerda, num trilho nevado junto a uma grande rocha, Emily e Mike estão muito juntos, frente a frente: a mão dele na cara dela, as mãos dela na cintura dele. Bem à direita, por entre ramos nus, alguém está sentado sozinho num banco sob um abrigo iluminado.
look.i_telescope.act2_2=Pelo telescópio, à noite: pedras cobertas de neve e, atrás delas, o canto de uma cabana de troncos sob um telhado cheio de pingentes de gelo; uma lâmpada brilha sob o beiral, por cima de uma ventoinha gradeada. Não se vê ninguém.
look.i_telescope.act2_3=Pelo telescópio, à noite: uma clareira nevada entre árvores, onde um baloiço de tábua pende de duas cordas compridas. Atrás, saliências de rocha cobertas de neve e arbustos despidos; à esquerda, fetos e um tronco coberto de hera.
look.i_death_whistle=Um apito entalhado em forma de caveira com hastes largas e ramificadas. Virado, mostra o rosto: duas órbitas fundas e uma boca redonda aberta, contornadas a tinta branca, e uma corrente de laços brancos pintada pela testa.
look.i_view_hannah_poster_part2=O cartaz está pendurado do lado de dentro da porta do cacifo, manchado e amarrotado; na fotografia, Hannah sorri, de cabelo comprido e escuro e óculos de armação escura, e no canto está impresso um selo redondo da polícia.
look.i_smashed_vase=Cacos de uma jarra vermelho-escura estão espalhados pelo chão; Ashley segura um deles, de arestas partidas ásperas e claras.
look.i_sams_bracelet=Uma pulseira de cordão entrançado, azul com um padrão de losangos amarelos, vermelhos e violeta, com um fecho de metal rosado.
look.i_picture_lookat=Um quadro numa moldura escura e estalada: uma casa de madeira de dois pisos à noite sob um céu de tempestade, toda em azuis e cinzentos escuros, com uma janela redonda no alto da empena, janelas com portadas em cima e um longo alpendre com corrimão em baixo.
look.i_dollhouse_complete=Pelas janelas da casa de bonecas, bonecas lá dentro; depois, de perto, quatro bonecas nuas encolhidas juntas: uma ruiva, uma morena, uma loira de totós e uma de pele escura que segura uma pequena câmara de vídeo. Os olhos delas são buracos negros, com escorridos vermelho-escuros pelas faces.
look.i_dollhouse_complete.open=A fachada da casa de bonecas abre-se e o telhado levanta-se: dois pisos de divisões minúsculas com bonecas nuas encenadas. Em cima, uma boneca morena e uma loira de óculos estão estendidas num sofá ao lado de uma mesa com uma garrafa e um copo. Em baixo, quatro bonecas estão ajoelhadas juntas num tapete vermelho, uma a segurar uma pequena câmara de vídeo, e outra boneca está de pé à parte.
look.i_doll_house_lookat_keyhole=No alto da empena da casa de bonecas, a janelinha redonda foi rodada para o lado como uma tampa: atrás dela, uma placa redonda de latão com um buraco de fechadura, debruada a vermelho.
look.i_doll_house_key=Uma pequena chave antiga de ferro, com a argola em forma de coração e a haste com sulcos em espiral. Estava pendurada num ganchinho de latão, escondida atrás do quadro.
look.i_wine_rack=Uma garrafeira alta de madeira atrás de uma grade de tiras de ferro em losangos; as tábuas de cima estão partidas e lascadas, com buracos escuros abertos nelas.
look.i_wine_cellar_door=Uma porta de tábuas reforçada com tiras de ferro; na chapa ferrugenta da fechadura não há puxador, só um pequeno buraco quadrado.
look.i_secret_camera=Uma pequena câmara de vídeo prateada que estava escondida entre as caixas de cartão; a luzinha vermelha de gravação está a piscar.
look.i_doll_head=Virada para ela, a cabeça careca da boneca: órbitas negras e vazias rodeadas de pestanas pintadas, faces rosadas, lábios vermelhos, a tinta estalada a descascar, e uma racha escura que desce de um olho passando junto à boca.
look.i_doll_head.roaches=Baratas saem em enxame da cabeça da boneca.
look.i_sams_sack=Debaixo do saco está Sam, de toalha de banho, sentada imóvel numa velha cadeira giratória de madeira.
