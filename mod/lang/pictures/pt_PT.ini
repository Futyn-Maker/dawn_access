; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinco amigos a rir num balcão de bar de madeira: o Chris, de óculos, segura uma lata; o Josh ri-se num banco de bar, com uma garrafa; a Sam, de camisola vermelha com padrões, está sentada no balcão; o Matt e o Mike inclinam-se para o grupo, à direita.
picture.t_camera_chris_01_clr_up=Uma selfie num teleférico: o Josh, de gorro, faz o sinal de V entre a Hannah, de óculos, e a Beth, de casaco cor-de-rosa.
picture.t_camera_ashley_01_clr_up=O Matt com o braço à volta da Ashley, que usa um gorro às riscas e segura um telemóvel; ambos sorriem.
picture.t_camera_hannah_01_clr_up=Um quarto, com as letras H e W na parede: a Jessica e a Emily estão sentadas junto à cama com copos vermelhos, a Ashley está de pé, de gorro, e a Hannah, de óculos, fala ao telefone.
picture.t_camera_mike_01_clr_up=Uma partida: a Emily, de sorriso rasgado, desenha na cara do Chris, que dorme num sofá com o rosto já rabiscado, enquanto a Jessica sorri de orelha a orelha atrás dele.
look.i_psychsession_1_interaction=Um campo de milho num dia soalheiro: um celeiro vermelho à esquerda e, à direita, um espantalho com chapéu de palha, um sorriso rasgado, um lenço vermelho ao pescoço e um gancho no lugar de uma mão. No milho escuro, em baixo à esquerda, dois pequenos olhos amarelos.
look.i_sams_sketchbook.1=Retratos a lápis. À esquerda: a Sam, com o cabelo frouxamente apanhado, um cachecol ao pescoço, a olhar para o lado. À direita: a Jessica, a sorrir, com uma longa trança sobre o ombro, de parka com capuz de pelo.
look.i_sams_sketchbook.2=Retratos a lápis. À esquerda: o Mike, com o cabelo penteado para cima, barba por fazer, a olhar para o lado, de camisa aos quadrados e casaco com capuz. À direita: o Josh, de gorro de malha, com um leve sorriso, a olhar de frente.
look.i_sams_sketchbook.3=Retratos a lápis. À esquerda: a Emily, com cabelo escuro e liso, risca ao meio, lábios franzidos, de camisola de gola alta e com uma gola de pelo. À direita: o Chris, com cabelo espetado e óculos retangulares, de casaco acolchoado, de boca aberta, como se estivesse a meio de uma palavra.
look.i_sams_sketchbook.4=Retratos a lápis. À esquerda: a Ashley, de gorro canelado, com cabelo comprido e liso e um sorriso suave. À direita: o Matt, com cabelo curto e encaracolado, a sorrir, de camisola de gola alta.
look.i_map=Um mapa da montanha, com os locais assinalados como LODGE, SANATORIUM e CABLE CAR. Trilhos ponteados a vermelho vão do teleférico à cabana e mais acima até ao sanatório, e pelo RANGER PATH até uma torre com um símbolo de rádio; em baixo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras vermelhas pintadas toscamente nas paredes, vezes sem conta: DIE.
look.i_security_monitor=No ecrã, uma casa de banho às escuras com uma banheira grande dá lugar à imagem de uma câmara de vigilância vista de cima: um edifício de madeira coberto de neve, um candeeiro aceso sobre um banco no longo alpendre, pinheiros no nevoeiro ao fundo. Lá em baixo, na neve, entre as sombras de ramos despidos, está uma figura escura. Interferência, e a figura desapareceu.
look.i_family_portrait=Um retrato pintado numa pesada moldura entalhada, com uma placa por baixo: THE WASHINGTON FAMILY. À esquerda, a Hannah, de óculos e com um pendente em forma de coração, e a Beth, de franja; a mão da Hannah pousa no ombro de uma mulher sorridente à frente, de cabelo curto e escuro. Atrás, um homem de bigode passa o braço à volta do Josh, que sorri à direita, de camisola escura sobre uma gola branca.
look.i_car_lookat=Dentro do carro, os bancos estão cheios de coisas: dois sacos de compras cor-de-rosa de papel, um saco de viagem estampado, frascos de verniz e de loção, revistas e uma banana.
look.i_hotel_poster=Um cartaz desbotado: um grande hotel de madeira com longas varandas e empenas íngremes, sob um pico recortado e um céu estrelado.
look.i_prom_night_photo=Na fotografia, a Hannah tem uma pequena borboleta preta tatuada na parte de cima do braço.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Na fotografia, a Hannah tem uma pequena borboleta tatuada na parte de cima do braço.
look.i_mysticalsymbols=Borratado a vermelho-escuro nas tábuas: um rosto como uma caveira, de dentes à mostra, sob largas hastes ramificadas, a tinta a escorrer. Ao lado pende um crânio de veado com penas.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Debaixo do convite, uma fotografia a preto e branco de Mike de smoking e laço. À volta, no quadro de cortiça, numa moldura escura e trabalhada: fotografias de Sam, de Emily, Hannah e Beth juntas, de um cão e de gatos, da Tower Bridge e de paisagens; rosetas com cavalos, marcadas 1ST e SPECIAL; dois bilhetes para um concerto de HARRY VOGUE; uma cara rabiscada assinada JOSH; e notas: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Uma velha casa de bonecas de madeira de dois pisos sobre uma cómoda: telhado cinzento de telhas de madeira com uma janela redonda no frontão, janelas com portadas e um alpendre ao longo da frente. Numa janela de cima, uma boneca nua e pálida de cabelo louro; por uma janela de baixo veem-se vagamente outras bonecas, e no alpendre está uma cabeça de boneca. Ao lado, numa mala aberta, uma boneca de cabelo escuro com vestido magenta e um livro escuro com uma cruz; à frente, três cubos de brincar empilhados, cada um a mostrar um 6.
look.i_snowybench=Sob a neve varrida, há um coração entalhado nas tábuas, com letras riscadas dentro.
look.i_headlessdoll=Uma boneca bebé nua e sem cabeça, de plástico encardido, manchado e rachado, com um buraco escuro no pescoço e unhas minúsculas pintadas de vermelho. Nas costas, um autocolante com três borboletas e o nome Hannah em letra floreada; no peito, uma zona redonda de pequenos furos.
look.i_controls_lookat=Uma mesa de comando de metal cinzento, gasta e riscada: ao fundo, mostradores marcados A, V e Hz; filas de luzes amarelas, verdes e brancas, comutadores rotativos, botões redondos e um teclado; à direita, uma placa azul com uma ranhura de alavanca marcada STOP, NEUTRAL, RUN, e ao meio um interruptor vermelho com ranhura para chave. Por cima, letras vermelhas borratadas vezes sem conta: DIE.
look.a_telescope=Pelo telescópio, à noite: uma encosta nevada com rochas e pinheiros, um tronco alto e claro a subir em curva ao meio. Em baixo, à esquerda, num trilho nevado junto a uma grande rocha, Emily e Mike estão muito juntos, frente a frente: a mão dele na cara dela, as mãos dela na cintura dele. Bem à direita, por entre ramos nus, alguém está sentado sozinho num banco sob um abrigo iluminado.
look.i_telescope.act2_2=Pelo telescópio, à noite: pedras cobertas de neve e, atrás delas, o canto de uma cabana de troncos sob um telhado cheio de pingentes de gelo; uma lâmpada brilha sob o beiral, por cima de uma ventoinha gradeada. Não se vê ninguém.
look.i_telescope.act2_3=Pelo telescópio, à noite: uma clareira nevada entre árvores, onde um baloiço de tábua pende de duas cordas compridas. Atrás, saliências de rocha cobertas de neve e arbustos despidos; à esquerda, fetos e um tronco coberto de hera.
look.i_death_whistle=Um apito entalhado em forma de caveira com hastes largas e ramificadas. Virado, mostra o rosto: duas órbitas fundas e uma boca redonda aberta, contornadas a tinta branca, e uma corrente de laços brancos pintada pela testa.
look.i_smashed_vase=Cacos de uma jarra vermelho-escura estão espalhados pelo chão; Ashley segura um deles, de arestas partidas ásperas e claras.
look.i_sams_bracelet=Uma pulseira de cordão entrançado, azul com um padrão de losangos amarelos, vermelhos e violeta, com um fecho de metal rosado.
look.i_picture_lookat=Um quadro numa moldura escura e estalada: uma casa de madeira de dois pisos à noite sob um céu de tempestade, toda em azuis e cinzentos escuros, com uma janela redonda no alto da empena, janelas com portadas em cima e um longo alpendre com corrimão em baixo.
look.i_dollhouse_complete=Pelas janelas da casa de bonecas, bonecas lá dentro; depois, de perto, quatro bonecas nuas encolhidas juntas, todas com o mesmo rosto de boneca: uma ruiva, uma morena, uma loira de totós e uma de pele escura que segura uma pequena câmara de vídeo, como a Ashley, a Emily, a Jessica e o Matt. Os olhos delas são buracos negros, com escorridos vermelho-escuros pelas faces.
look.i_dollhouse_complete.open=A fachada da casa de bonecas abre-se e o telhado levanta-se: dois pisos de divisões minúsculas com bonecas nuas encenadas, todas com o mesmo rosto de boneca, mas com o cabelo dos amigos. Em cima, junto a uma mesa com garrafas e um copo, uma boneca morena está estendida num sofá ao lado de uma loira de óculos, como o Josh e o Chris. Em baixo, quatro bonecas estão ajoelhadas num tapete vermelho, viradas para uma cama: uma de pele escura a filmar com uma pequena câmara de vídeo, uma loira de totós, uma morena e uma ruiva, como o Matt, a Jessica, a Emily e a Ashley; outra boneca está de pé à parte.
look.i_doll_house_lookat_keyhole=No alto da empena da casa de bonecas, a janelinha redonda foi rodada para o lado como uma tampa: atrás dela, uma placa redonda de latão com um buraco de fechadura, debruada a vermelho.
look.i_doll_house_key=Uma pequena chave antiga de ferro, com a argola em forma de coração e a haste com sulcos em espiral. Estava pendurada num ganchinho de latão, escondida atrás do quadro.
look.i_wine_rack=Uma garrafeira alta de madeira atrás de uma grade de tiras de ferro em losangos; as tábuas de cima estão partidas e lascadas, com buracos escuros abertos nelas.
look.i_wine_cellar_door.act5_3=Uma porta de tábuas reforçada com tiras de ferro; na chapa ferrugenta da fechadura não há puxador, só um pequeno buraco quadrado.
look.i_doll_head=Virada para ela, a cabeça careca da boneca: órbitas negras e vazias rodeadas de pestanas pintadas, faces rosadas, lábios vermelhos, a tinta estalada a descascar, e uma racha escura que desce de um olho passando junto à boca.
look.i_doll_head.roaches=Baratas saem em enxame da cabeça da boneca.
look.i_sams_sack=Debaixo do saco está Sam, de toalha de banho, sentada imóvel numa velha cadeira giratória de madeira.
look.crossedout=Uma fotografia está riscada: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Uma rede de arame ferrugenta esticada entre dois postes de madeira, a mão da Emily agarrada ao da direita; através dela, lá em baixo, sob uma luz fraca e azulada, o chão de um túnel coberto de entulho, com uma trave escura atravessada.
look.i_torn_miner_clothes=Sobre as pedras está um velho capacete de mineiro: uma cúpula de metal escuro com nervuras em relevo, uma aba larga e ferrugenta e, à frente, uma pequena lanterna de latão com um refletor redondo.
look.i_broken_ladder=Uma escada de mão partida está atravessada sobre o entulho: uma longa trave de madeira de onde saem três degraus de ferro ferrugentos, com as pontas partidas, e restos lascados de madeira ainda presos a dois deles.
look.i_sign=Na poeira está um pedaço partido de uma placa de madeira gasta pelo tempo, com as bordas irregulares e lascadas; nele, em maiúsculas vermelhas desbotadas a stencil, o fim de uma palavra, GER, e por baixo EDGE.
look.i_peer_at_head=Através de uma rede de arame escura, entre tábuas toscas: para lá delas, sobre um chão pedregoso, um barril com uma lona por cima e, mais atrás, um corrimão de madeira e montes de entulho.
look.i_peer_at_wheel=Através de uma rede de arame ferrugenta entre dois postes: uma gruta do outro lado e, nela, uma grande e velha roda de água de madeira entre andaimes partidos; ao pé dela, uma labareda irrompe da escuridão e apaga-se.
look.i_scarecrow_lookat=Um espantalho, os braços de ramos nus que terminam em raminhos, o corpo um saco de plástico preto sujo de sangue. A cabeça está envolta num pano claro atado ao pescoço com uma corda; através dele vê-se um rosto em decomposição, um nariz oco e uma boca aberta de dentes podres, um dos lados empapado em sangue. Sob um chapéu castanho surrado pendem longos cabelos pretos.
look.i_scarecrow_lookat.clown=Um espantalho, os braços de ramos nus que terminam em raminhos, o corpo um saco de plástico preto sujo de sangue. A cabeça é uma máscara de palhaço: um rosto branco e enrugado, sobrancelhas roxas pintadas em arcos altos testa acima, orifícios escuros nos olhos contornados de roxo, um nariz vermelho e um largo sorriso de dentes longos e afiados, vermelho nos cantos, o queixo escuro de sangue.
look.i_scarecrow_lookat.zombie=Um espantalho, os braços de ramos nus que terminam em raminhos, o corpo um saco de plástico preto sujo de sangue. A cabeça é a de um zombie em decomposição: careca, pele manchada de cinzento-esverdeado, olhos brancos vazios e uma boca escancarada cheia de dentes.
look.i_dead_crow_lookat=Dois corvos mortos jazem na neve manchada de sangue, dilacerados e ensanguentados, de asas abertas e com as entranhas de fora; penas pretas soltas estão espalhadas à volta.
look.i_chair_and_blood=No chão de betão, um banco de madeira tombado, com as pernas partidas; ao lado, uma grilheta de ferro aberta presa a uma corrente. Há sangue salpicado e pingado pelo chão, e uma lanterna caída de lado, ainda acesa.
look.i_fake_torso=A metade de cima de um corpo de camisa cinzenta aos quadrados está pendurada com os braços esticados para cima; abaixo da cintura não há nada além de um corte irregular e ensanguentado. Atrás, uma tábua com um buraco recortado.
look.i_saw_blades=Uma enorme lâmina de serra circular está deitada, o aço ferrugento sujo de sangue escuro; atrás, uma vedação de rede de arame.
look.i_dead_wolf_inspect=Um lobo morto está pendurado nas grades da porta de uma cela: o peito e a barriga rasgados de ponta a ponta e vazios, a cabeça caída com as mandíbulas escancaradas, e por baixo dele as entranhas jazem numa poça de sangue.
look.i_damaged_doors=Uma pesada porta de cela de aço com painéis amolgados: uma grande mancha escura de sangue escorre por ela, o sangue pingou de baixo do pequeno postigo no topo, e marcas fundas de garras estão cravadas no metal.
look.i_sanlookat=Uma vedação de rede de arame: à esquerda, um poste escuro e, atravessando-a, uma barra ferrugenta. Através da rede, na neve do outro lado, um lanço curto de degraus de betão com um corrimão de metal.
look.i_oilflask=Erguida mesmo diante dos olhos, uma lata alta de metal vermelha e ferrugenta. De um lado, um emblema oval desbotado diz North West à volta das letras NWM, com Mining por baixo; no lado estreito, um losango vermelho diz FLAMMABLE LIQUID.
look.i_oilflask.roaches=Baratas saem a rastejar por cima da lata, e ela atira-a para longe.
look.i_admin_area_jacksdoor_lookat_reader=Um leitor de cartões preto na parede, ao lado de uma porta de madeira, com um pequeno painel vermelho onde se lê LOCKED; na porta, por baixo de uma janelinha, uma placa verde ferrugenta: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=No tabuleiro da morgue, puxado para fora, jaz de costas um cadáver em decomposição: um rosto cinzento e mirrado, de boca escancarada, rodeado de cabelo escuro colado; a camisa cinzenta e o tabuleiro ferrugento estão manchados de sangue velho.
look.i_jackslair_exit_lock_lookat=Um portão de ferro de rede em losangos está trancado: um cadeado grande e ferrugento pende do porta-cadeado, junto à ombreira de madeira.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Dois cartazes de MISSING: HANNAH WASHINGTON e BETH WASHINGTON; o da Hannah diz: She has glasses, and has a tattoo of a butterfly on her right shoulder. Um bilhete amarelo: NEVER FORGET. Recortes de jornal: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. Numa fotografia de quatro raparigas, a Hannah está assinalada com um círculo vermelho.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_snowwipe_tractor_revisit=Atrás do vidro sujo e salpicado da cabina do velho camião está uma máscara de hóquei branca pintada como uma caveira: orifícios oblíquos nos olhos, um nariz de caveira e um largo sorriso de dentes longos, dois traços escuros por cima de um olho, uma lasca em falta no topo.
look.i_joshsbaseball=Uma bola de basebol velha e suja, o couro esfolado e manchado de castanho, a costura de um vermelho desbotado; nela, escrito à mão a preto: Josh.
look.i_loveheart=Há um coração entalhado na casca clara de um tronco de árvore e, dentro dele, M+E.
look.i_rifle_lookat=Numa barraca de madeira, uma espingarda está pousada no balcão de tábuas. Lá fora, mais adiante na neve, estão barris velhos com garrafas em cima, e dos ramos pendem sacos presos a cordas, um deles marcado com um X.
look.i_look_at_picture==look.i_picture_lookat
look.i_wine_cellar_door.act2_4=Uma porta de tábuas reforçada com tiras de ferro; na chapa ferrugenta da fechadura há uma maçaneta redonda.
look.i_rush_of_blood_snowglobe=Um globo de neve sobre uma base pintada com ziguezagues vermelhos e azuis. Dentro do vidro, sobre um montículo nevado, o percurso de madeira de uma montanha-russa retorce-se em loopings sobre estacas finas, com pequenos carrinhos em cima; balões vermelhos com estrelas brancas e placas vermelhas em forma de seta, salpicadas de luzes, erguem-se entre os loopings.
look.i_chess_piece=Tirada de um tabuleiro de xadrez, uma pequena estatueta de um homem, mais ou menos do comprimento de um dedo: está de pé com os braços ao longo do corpo, de t-shirt e calças, e tem o rosto liso, sem feições.
look.i_fallen_beams=No chão está um painel de grade de ferro soldada numa armação ferrugenta, com algumas barras partidas e dois grandes pedaços de rocha em cima; uma corrente pesada pende de uma argola num dos cantos.
look.i_lookatmineexit=De perto, uma porta de tábuas gastas pelo tempo com um grande buraco de bordas irregulares aberto nela; pelo buraco, só há uma névoa cinzento-clara.
look.i_matts_shoe=Uma bota de inverno grande, apanhada do chão: o cano de couro azul-escuro com os atacadores passados por presilhas, um forro de feltro à vista em cima e um pé de borracha escura com riscas brancas, sujo de lama.
