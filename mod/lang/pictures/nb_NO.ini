picture.t_bc_thescore=@bts_video_title_003
picture.t_bc_theinstruments=@bts_video_title_004
picture.t_bc_meetthecast=@SMG013_66306
picture.t_bc_athousandpages=@SMG013_66309
; The padlock drawn over a locked collectible: the game's own word for a locked item.
picture.mi_padlock=@SMG013_64519
; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Fem venner ler ved en bardisk av tre: Chris, med briller, holder en boks; Josh ler på en barkrakk med en flaske; Sam, i en rød mønstret genser, sitter på disken; til høyre lener Matt og Mike seg inn mot de andre.
picture.t_camera_chris_01_clr_up=En selfie i en gondol: Josh, med lue, lager et V-tegn mellom Hannah, med briller, og Beth, i en rosa jakke.
picture.t_camera_ashley_01_clr_up=Matt med armen rundt Ashley, som har på seg en stripete lue og holder en telefon; begge smiler.
picture.t_camera_hannah_01_clr_up=Et soverom, bokstavene H og W på veggen: Jessica og Emily sitter ved sengen med røde kopper, Ashley står med lue, og Hannah, med briller, snakker i telefonen.
picture.t_camera_mike_01_clr_up=En spøk: Emily, glisende, tegner i ansiktet til Chris, som sover på en sofa med ansiktet allerede tegnet på, mens Jessica gliser bak ham.
look.i_psychsession_1_interaction=En maisåker på en solrik dag: en rød låve til venstre og til høyre et fugleskremsel med stråhatt, et glisende ansikt, et rødt halstørkle og en krok i stedet for den ene hånden. I den mørke maisen nederst til venstre, to små gule øyne.
look.i_sams_sketchbook.1=Blyantportretter. Til venstre: Sam, håret løst samlet bak, et skjerf rundt halsen, ser til siden. Til høyre: Jessica, smilende, en lang flette over skulderen, i en parkas med pelshette.
look.i_sams_sketchbook.2=Blyantportretter. Til venstre: Mike, håret strøket opp, skjeggstubb, ser til siden, i rutete skjorte og en jakke med hette. Til høyre: Josh, i en strikkelue, et svakt smil, ser rett fram.
look.i_sams_sketchbook.3=Blyantportretter. Til venstre: Emily, glatt mørkt hår med midtskill, snurpet munn, i en høyhalset genser og en pelskrage. Til høyre: Chris, strittende hår og rektangulære briller, i en vattert jakke, munnen åpen som midt i et ord.
look.i_sams_sketchbook.4=Blyantportretter. Til venstre: Ashley, i en ribbestrikket lue, langt glatt hår, smiler mildt. Til høyre: Matt, kort krøllete hår, smilende, i en høyhalset genser.
look.i_map=Et kart over fjellet med stedene merket LODGE, SANATORIUM og CABLE CAR. Røde prikkede stier går fra taubanen til hytta og videre opp til sanatoriet, og langs RANGER PATH til et tårn med et radiosymbol; nederst TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Røde bokstaver smurt utover veggene, igjen og igjen: DIE.
look.i_security_monitor=På skjermen avløses et mørkt bad med et stort badekar av et overvåkingskameras blikk ovenfra: en snødekt trebygning, en tent lampe over en benk på den lange verandaen, grantrær i tåken bak. Nede i snøen, blant skyggene av nakne greiner, står en mørk skikkelse. Bildestøy, og skikkelsen er borte.
look.i_family_portrait=Et malt portrett i en tung utskåret ramme, med en plate under: THE WASHINGTON FAMILY. Til venstre Hannah, med briller og et hjertesmykke, og Beth, med pannelugg; Hannahs hånd hviler på skulderen til en smilende kvinne foran, med kort mørkt hår. Bak har en mann med bart armen rundt Josh, som smiler til høyre i en mørk genser over en hvit krage.
look.i_car_lookat=I bilen ligger setene fulle av ting: to rosa papirposer, en mønstret reiseveske, flasker med neglelakk og lotion, blader og en banan.
look.i_hotel_poster=En falmet plakat: et stort trehotell med lange verandaer og bratte gavler under en takket tind og en stjernehimmel.
look.i_prom_night_photo=På bildet har Hannah en liten svart sommerfugl tatovert på overarmen.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=På bildet har Hannah en liten sommerfugl tatovert på overarmen.
look.i_mysticalsymbols=Smurt på plankene i mørkerødt: et hodeskallelignende ansikt med blottede tenner under et bredt, forgrenet gevir, malingen rent i dråper. Ved siden av henger en hjorteskalle med fjær.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Under invitasjonen et svart-hvitt bilde av Mike i smoking og sløyfe. Rundt det på korktavlen, i en snirklete mørk ramme: bilder av Sam, av Emily, Hannah og Beth sammen, av en hund og katter, av Tower Bridge og landskap; rosetter med hester, merket 1ST og SPECIAL; to konsertbilletter til HARRY VOGUE; et rablete ansikt signert JOSH; og lapper: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Et gammelt dukkehus av tre i to etasjer på en kommode: et grått spontak med et rundt vindu i gavlen, vinduer med skodder, en veranda langs fasaden. I et vindu oppe en blek naken dukke med lyst hår; gjennom et vindu nede skimtes flere dukker, og på verandaen ligger et dukkehode. Ved siden av, i en åpen koffert, en mørkhåret dukke i magentafarget kjole og en mørk bok med et kors; foran tre stablede lekeklosser som alle viser 6.
look.i_snowybench=Under den feide snøen er et hjerte skåret inn i plankene, med bokstaver risset inn i det.
look.i_headlessdoll=En naken babydukke uten hode, plasten skitten, flekket og sprukket, et mørkt hull ved halsen, bitte små negler malt røde. På ryggen et klistremerke med tre sommerfugler og navnet Hannah i snirklete bokstaver; på brystet en rund flekk med små hull.
look.i_controls_lookat=Et grått kontrollpanel av metall, slitt og oppripet: bakerst måleinstrumenter merket A, V og Hz, rader med gule, grønne og hvite lamper, dreiebrytere, runde trykknapper og et tastatur; til høyre en blå plate med en spakspalte merket STOP, NEUTRAL, RUN, og i midten en rød bryter med nøkkelhull. Igjen og igjen smurt over det med røde bokstaver: DIE.
look.a_telescope=Gjennom teleskopet, om natten: en snødekt skråning med fjell og furu, en høy, lys trestamme som bøyer seg oppover i midten. Nede til venstre, på en snødekt sti ved en stor stein, står Emily og Mike tett sammen, ansikt til ansikt: hånden hans ved kinnet hennes, hendene hennes ved midjen hans. Langt til høyre, gjennom nakne greiner, sitter noen alene på en benk under et opplyst skur.
look.i_telescope.act2_2=Gjennom teleskopet, om natten: snødekte steinblokker, og bak dem hjørnet av en tømmerhytte under et tak fullt av istapper; under takskjegget lyser en lampe over en vifte bak gitter. Ingen er å se.
look.i_telescope.act2_3=Gjennom teleskopet, om natten: en snødekt lysning mellom trær, der en huske av en treplanke henger i to lange tau. Bak den snødekte fjellhyller og nakne busker; til venstre bregner og en eføykledd trestamme.
look.i_death_whistle=En utskåret fløyte formet som en hodeskalle med brede, forgreinede horn. Snudd rundt viser den ansiktet: to dype øyehuler og en rund, åpen munn, omkranset av hvit maling, og en kjede av hvite løkker malt nedover pannen.
look.i_smashed_vase=Skår av en mørkerød vase ligger strødd utover gulvet; Ashley holder opp ett av dem, med ru, lyse bruddkanter.
look.i_sams_bracelet=Et flettet snorarmbånd, blått med et mønster av gule, røde og fiolette romber, lukket med en rosa metallås.
look.i_picture_lookat=Et maleri i en mørk, sprukken ramme: et trehus i to etasjer om natten under en stormfull himmel, helt i mørkeblått og grått, med et rundt vindu høyt oppe i gavlen, vinduer med skodder oppe og en lang veranda med rekkverk nede.
look.i_dollhouse_complete=Gjennom dukkehusets vinduer ses dukker der inne; så, helt nært, fire nakne dukker tett sammen, alle med det samme dukkeansiktet: en rødhåret, en mørkhåret, en blond med musefletter og en mørkhudet som holder et lite videokamera, som Ashley, Emily, Jessica og Matt. Øynene deres er svarte hull, og mørkerøde striper renner nedover kinnene.
look.i_dollhouse_complete.open=Dukkehusets forside svinger opp, og taket løftes: to etasjer med bitte små rom der nakne dukker er stilt opp, alle med det samme dukkeansiktet, men med vennenes hår. Oppe, ved et bord med flasker og et glass, ligger en mørkhåret dukke henslengt på en sofa ved siden av en blond med briller, som Josh og Chris. Nede kneler fire dukker på et rødt teppe vendt mot en seng: en mørkhudet som filmer med et lite videokamera, en blond med musefletter, en mørkhåret og en rødhåret, som Matt, Jessica, Emily og Ashley; enda en dukke står for seg selv.
look.i_doll_house_lookat_keyhole=Høyt oppe i dukkehusets gavl er det lille runde vinduet dreid til side som et lokk: bak det en rund messingplate med et nøkkelhull, kantet med rødt.
look.i_doll_house_key=En liten gammel jernnøkkel med et hjerteformet grep og et spiralriflet skaft. Den hang på en liten messingkrok, gjemt bak maleriet.
look.i_wine_rack=Et høyt vinstativ av tre bak et rutemønstret gitter av jernbånd; de øverste bordene er slått inn og splintret, med mørke hull revet gjennom dem.
look.i_wine_cellar_door.act5_3=En plankedør forsterket med jernbånd; på den rustne låseplata er det ikke noe håndtak, bare et lite firkantet hull.
look.i_doll_head=Snudd mot henne, det skallete dukkehodet: svarte, tomme øyehull omkranset av malte øyevipper, rosenrøde kinn, røde lepper, malingen sprukket og flassende, og en mørk sprekk som løper fra det ene øyet ned forbi munnen.
look.i_doll_head.roaches=Kakerlakker myldrer ut av dukkehodet.
look.i_sams_sack=Under sekken er Sam, i et badehåndkle, og sitter ubevegelig i en gammel dreiestol av tre.
look.crossedout=Ett bilde er strøket over: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Rustent trådnett spent ut mellom to trestolper, Emilys hånd griper om den høyre; gjennom det, nedenfor, i svakt blålig lys, et tunnelgulv fullt av steinrester, med en mørk bjelke liggende på tvers.
look.i_torn_miner_clothes=På steinene ligger en gammel gruvearbeiderhjelm: en mørk metallkuppel med opphøyde ribber, et bredt, rustent brem og foran en liten messinglampe med en rund reflektor.
look.i_broken_ladder=En knekt stige ligger på tvers over steinrestene: en lang vange av tre med tre rustne jerntrinn som stikker ut av den, de ytterste endene knekt av, og på to av dem sitter det fortsatt flisete trebiter.
look.i_sign=Et avbrukket stykke av et værbitt treskilt ligger i støvet, kantene ujevne og flisete; på det står med falmede røde sjablongbokstaver slutten av et ord, GER, og under det EDGE.
look.i_peer_at_head=Gjennom mørkt trådnett, mellom grove planker: bak dem, på et steinete gulv, en tønne med en presenning over toppen, og lenger bak et rekkverk av tre og hauger med steinrester.
look.i_peer_at_wheel=Gjennom rustent trådnett mellom to stolper: en hule bak, og i den et stort, gammelt vannhjul av tre blant ødelagte stillaser; ved foten av det blusser en flamme opp av mørket og dør bort.
look.i_scarecrow_lookat=Et fugleskremsel, armene nakne greiner som ender i kvister, kroppen en svart plastpose innsmurt med blod. Hodet er surret inn i lyst tøy, knyttet rundt halsen med tau; gjennom det skimtes et råtnende ansikt, en hul nese og en åpen munn med råtne tenner, den ene siden gjennomtrukket av blod. Under en medtatt brun hatt henger langt svart hår.
look.i_scarecrow_lookat.clown=Et fugleskremsel, armene nakne greiner som ender i kvister, kroppen en svart plastpose innsmurt med blod. Hodet er en klovnemaske: et hvitt, rynkete ansikt, lilla bryn malt i høye buer oppover pannen, mørke øyehull med lilla kanter, en rød nese og et bredt glis med lange, skarpe tenner, rødt i munnvikene, haken mørk av blod.
look.i_scarecrow_lookat.zombie=Et fugleskremsel, armene nakne greiner som ender i kvister, kroppen en svart plastpose innsmurt med blod. Hodet er et råtnende zombiehode: skallet, gråaktig grønn flekkete hud, tomme hvite øyne og en gapende munn full av tenner.
look.i_dead_crow_lookat=To døde kråker ligger i blodig snø, flerret opp og blodige, med vingene utspilt og innvollene veltende ut; løse svarte fjær ligger strødd rundt dem.
look.i_chair_and_blood=På betonggulvet ligger en krakk av tre veltet, med knekte bein; ved siden av den en åpen jernlenke i en kjetting. Blod er sprutet og dryppet utover gulvet, og en lykt ligger på siden, fortsatt tent.
look.i_fake_torso=Overdelen av en kropp i grå rutete skjorte henger med armene strukket opp over seg; nedenfor livet er det bare et fillete, blodig snitt. Bak den står en plate med et hull skåret i.
look.i_saw_blades=Et enormt sirkelsagblad ligger flatt, det rustne stålet innsmurt med mørkt blod; bak det et nettinggjerde.
look.i_dead_wolf_inspect=En død ulv henger på sprinklene i en celledør: brystet og buken er flerret vidt opp og tomme, hodet henger med kjevene på vidt gap, og under den ligger innvollene i en blodpøl.
look.i_damaged_doors=En tung celledør av stål med bulkete paneler: en stor, mørk stripe av blod renner nedover den, blod har dryppet fra under den lille luken øverst, og dype klørmerker er rispet inn i metallet.
look.i_sanlookat=Et nettinggjerde: til venstre en mørk stolpe, på tvers en rusten stang. Gjennom nettingen, i snøen bak, en kort betongtrapp med et rekkverk av metall.
look.i_oilflask=Holdt helt opp foran øynene, en høy rusten rød metallkanne. På siden står det på et falmet ovalt emblem North West rundt bokstavene NWM, med Mining under; på smalsiden står det på et rødt rombeformet skilt FLAMMABLE LIQUID.
look.i_oilflask.roaches=Kakerlakker kryper ut og over kanna, og hun slenger den fra seg.
look.i_admin_area_jacksdoor_lookat_reader=En svart kortleser på veggen ved siden av en tredør, på det lille røde displayet står det LOCKED; på døren, under et lite vindu, et rustent grønt skilt: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=På den uttrukne skuffen i likhuset ligger et råtnende lik på ryggen: et grått, innskrumpet ansikt med gapende munn, mørkt hår klistret rundt det; den grå skjorten og den rustne skuffen er flekket av gammelt blod.
look.i_jackslair_exit_lock_lookat=En jerngrind med rombeformet netting er låst: en stor, rusten hengelås henger i overfallet ved dørkarmen av tre.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=To MISSING-plakater: HANNAH WASHINGTON og BETH WASHINGTON; på Hannahs står det: She has glasses, and has a tattoo of a butterfly on her right shoulder. En gul lapp: NEVER FORGET. Avisutklipp: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. På et bilde av fire jenter er Hannah ringet inn med rødt.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_snowwipe_tractor_revisit=Bak den skitne, flekkete ruta i førerhuset på den gamle lastebilen er det en hvit hockeymaske malt som en hodeskalle: skrå øyehull, en nese som på en hodeskalle og et bredt glis med lange tenner, to mørke streker over det ene øyet, et stykke slått av øverst.
look.i_joshsbaseball=En gammel, skitten baseball, læret skrapet og brunflekket, den røde sømmen falmet; på den står med svart håndskrift: Josh.
look.i_loveheart=Et hjerte er skåret inn i den lyse barken på en trestamme, og inni det står M+E.
look.i_rifle_lookat=I en trebu ligger en rifle på plankedisken. Ute i snøen bortenfor står gamle tønner med flasker oppå, og fra greinene henger sekker i tau, én av dem merket med en X.
look.i_look_at_picture==look.i_picture_lookat
look.i_wine_cellar_door.act2_4=En plankedør forsterket med jernbånd; på den rustne låseplata sitter en rund dørknott.
look.i_rush_of_blood_snowglobe=En snøkule på en sokkel malt med røde og blå sikksakkstriper. Inne i glasset, over en liten snødekt haug, snor tresporet til en berg-og-dal-bane seg i looper på spinkle stylter, med små vogner på; røde ballonger med hvite stjerner og røde pilskilt besatt med lys reiser seg mellom loopene.
look.i_chess_piece=Tatt opp fra et sjakkbrett, en liten figur av en mann, omtrent en finger lang: han står med armene langs sidene, i T-skjorte og bukse, og ansiktet er glatt, uten ansiktstrekk.
look.i_fallen_beams=På bakken ligger et panel av sveiset jerngitter i en rusten ramme, noen av stengene knekt, med to store steinklumper oppå; fra en ring i det ene hjørnet henger en tung kjetting.
look.i_lookatmineexit=På nært hold: en dør av værbitte planker med et stort, taggete hull slått gjennom; gjennom hullet ses bare blekgrå dis.
look.i_matts_shoe=En stor vinterstøvel, plukket opp fra bakken: et mørkeblått overlær snørt gjennom løkker, et filtfôr som stikker fram øverst, og en mørk gummifot med hvite striper, innsmurt med gjørme.
look.i_ashleys_purse=Chris holder opp en liten, mørk strikket veske; på forsiden er lyse bokstaver strikket inn: ASH.
look.i_investigate_blood_kitchen=Blod er sprutet utover en lys vegg over en benkeplate av tre: én stor, mørk flekk og et regn av sprut rundt den, med drypp som renner ned til benkeplaten.
look.i_hospital_the_chair=Ovenfra ses en gammel trestol blant klumper av murbrokker: lærreimer med spenner på armlenene, den høye ryggen og beina, og mørkt blod trukket inn i setet.
look.i_morgue_security_gate_lookat=En svart kortleser på en blekgrønn flislagt vegg ved en mørk dørkarm av tre, på det lille røde displayet står det LOCKED; ved siden av den et slitt grønt skilt: CHAPEL SECURITY PASS REQUIRED.
look.i_jackslair_look_into_church=Gjennom en sprekk mellom planker: en stor, dunkel sal, disig av støv, et rekkverk høyt oppe langs bakveggen; nede på gulvet til venstre brenner en lampe blant noen få møbler og litt skrot.
look.i_warningsign=Et avbrukket stykke av et værbitt treskilt ligger i snøen, kantene ujevne; på det står med falmede røde sjablongbokstaver begynnelsen av et ord, DAN, og under det CLIFF.
look.i_sams_sock=Sam holder opp en enkelt grå ribbestrikket sokk ved siden av en tom lenestol med utskåret treramme; et stearinlys brenner på gulvet.
look.i_cooling_equipment=Et mørkt kjøleaggregat av metall med en rund trykkmåler; foran det en rød ventil med enda en måler og et rødt håndhjul, og riflede svarte slanger som snor seg ned mot gulvet i en hvit dis.
look.i_boilerroom_lookat=Gjennom en knust vindusramme med sprinkler: et stort, dunkelt rom bak, disig av støv, nettinggjerde og metallstolper innerst, murbrokker strødd utover gulvet.
look.i_jackslair_storagechest=Mike holder opp en lang knokkel fra kisten, blodig i den knudrete enden, med kjøttrester på.
