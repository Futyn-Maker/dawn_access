; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Fem venner ler ved en bardisk av tre: Chris, med briller, holder en boks; Josh ler på en barkrakk med en flaske; Sam, i en rød mønstret genser, sitter på disken; til høyre lener Matt og Mike seg inn mot de andre.
picture.t_camera_chris_01_clr_up=En selfie i en gondol: Josh, med lue, lager et V-tegn mellom Hannah, med briller, og Beth, i en rosa jakke.
picture.t_camera_ashley_01_clr_up=Matt med armen rundt Ashley, som har på seg en stripete lue og holder en telefon; begge smiler.
picture.t_camera_hannah_01_clr_up=Et soverom, bokstavene H og W på veggen: Jessica og Emily sitter ved sengen med røde kopper, Ashley står med lue, og Hannah, med briller, snakker i telefonen.
picture.t_camera_mike_01_clr_up=En spøk: Emily, glisende, tegner i ansiktet til Chris, som sover på en sofa med ansiktet allerede tegnet på, mens Jessica gliser bak ham.
look.i_psychsession_1_interaction=En maisåker på en solrik dag: en rød låve til venstre og til høyre et fugleskremsel med stråhatt, et glisende ansikt, et rødt halstørkle og en krok i stedet for den ene hånden. I den mørke maisen nederst til venstre, to små gule øyne.
look.i_sams_sketchbook.1=Blyantportretter. Til venstre: Sam, håret løst samlet bak, et skjerf rundt halsen, ser til siden. Til høyre: Jessica, smilende, en lang flette over skulderen, i en parkas med pelshette.
look.i_sams_sketchbook.2=Blyantportretter. Til venstre: Mike, håret strøket opp, skjeggstubb, ser til siden, i rutete skjorte og en jakke med hette. Til høyre: Josh, i en strikkelue, et svakt smil, ser rett fram.
look.i_sams_sketchbook.3=Blyantportretter. Til venstre: Emily, glatt mørkt hår med midtskill, snurpet munn, i en høyhalset genser og en pelskrage. Til høyre: Chris, strittende hår og rektangulære briller, i en vattert jakke, munnen åpen som midt i et ord.
look.i_sams_sketchbook.4=Blyantportretter. Til venstre: Ashley, i en ribbestrikket lue, langt glatt hår, smiler mildt. Til høyre: Matt, kort krøllete hår, smilende, i en høyhalset genser.
look.i_map=Et kart over fjellet med stedene merket LODGE, SANATORIUM og CABLE CAR. Røde prikkede stier går fra taubanen til hytta og videre opp til sanatoriet, og langs RANGER PATH til et tårn med et radiosymbol; nederst TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Røde bokstaver smurt utover veggene, igjen og igjen: DIE.
look.i_security_monitor=På skjermen avløses et mørkt bad med et stort badekar av et overvåkingskameras blikk ovenfra: en snødekt trebygning, en tent lampe over en benk på den lange verandaen, grantrær i tåken bak. Nede i snøen, blant skyggene av nakne greiner, står en mørk skikkelse. Bildestøy, og skikkelsen er borte.
look.i_family_portrait=Et malt portrett i en tung utskåret ramme, med en plate under: THE WASHINGTON FAMILY. Til venstre Hannah, med briller og et hjertesmykke, og Beth, med pannelugg; Hannahs hånd hviler på skulderen til en smilende kvinne foran, med kort mørkt hår. Bak har en mann med bart armen rundt Josh, som smiler til høyre i en mørk genser over en hvit krage.
look.i_car_lookat=I bilen ligger setene fulle av ting: to rosa papirposer, en mønstret reiseveske, flasker med neglelakk og lotion, blader og en banan.
look.i_hotel_poster=En falmet plakat: et stort trehotell med lange verandaer og bratte gavler under en takket tind og en stjernehimmel.
look.i_wanted_poster_lookat_new=Toppen av plakaten er revet av, og med den ansiktet på bildet; over WANTED er det bare en mørk bit av bildet igjen.
look.i_missing_axe=På tømmerveggen henger et langt treskrin til en øks, tomt bortsett fra de to holderne som holdt den.
look.i_prom_night_photo=Et bilde under grønne trær. Fra venstre: Hannah med briller, en liten svart sommerfugl tatovert på overarmen; Sam, blond, i blomstret kjole, rekker en hånd mot kameraet; Mike i smoking og sløyfe med armen rundt Emily, som smiler til høyre i en blå kjole.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Et falmet bilde på en strand med havet og et nes bak. Josh i midten har armene rundt Hannah, til venstre med briller og en liten sommerfugl tatovert på overarmen, og rundt Beth, til høyre, med pannelugg.
look.i_minemap=Et gammelt oppmålingskart over gruvegangene. I feltet: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Røde stempler, AREAS AT RISK DANGER og DANGER igjen og igjen, markerer rødt skraverte områder med håndskrevne røde notater: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). I hjørnet: BLACKWOOD MINES.
look.i_cigarstub=En stumpet sigar, enden brent til aske. Det kremfargede båndet har CLASSIC på hver side av et mørkerødt skjold med en fjærpryd.
look.i_mysticalsymbols=Smurt på plankene i mørkerødt: et hodeskallelignende ansikt med blottede tenner under et bredt, forgrenet gevir, malingen rent i dråper. Ved siden av henger en hjorteskalle med fjær.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Under invitasjonen et svart-hvitt bilde av Mike i smoking og sløyfe. Rundt det på korktavlen, i en snirklete mørk ramme: bilder av Sam, av Emily, Hannah og Beth sammen, av en hund og katter, av Tower Bridge og landskap; rosetter med hester, merket 1ST og SPECIAL; to konsertbilletter til HARRY VOGUE; et rablete ansikt signert JOSH; og lapper: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Et gammelt dukkehus av tre i to etasjer på en kommode: et grått spontak med et rundt vindu i gavlen, vinduer med skodder, en veranda langs fasaden. I et vindu oppe en blek naken dukke med lyst hår; gjennom et vindu nede skimtes flere dukker, og på verandaen ligger et dukkehode. Ved siden av, i en åpen koffert, en mørkhåret dukke i magentafarget kjole og en mørk bok med et kors; foran tre stablede lekeklosser som alle viser 6.
look.i_snowybench=Under den feide snøen er et hjerte skåret inn i plankene, med bokstaver risset inn i det.
look.i_headlessdoll=En naken babydukke uten hode, plasten skitten, flekket og sprukket, et mørkt hull ved halsen, bitte små negler malt røde. På ryggen et klistremerke med tre sommerfugler og navnet Hannah i snirklete bokstaver; på brystet en rund flekk med små hull.
look.i_readnote=De røde bokstavene har rent i dråper. På baksiden et trykt brevhode, NORTHERN PROVINCES PENITENTIARY, ved siden av et rundt segl med en vekt; det røde skinner speilvendt gjennom.
look.i_controls_lookat=Et grått kontrollpanel av metall, slitt og oppripet: bakerst måleinstrumenter merket A, V og Hz, rader med gule, grønne og hvite lamper, dreiebrytere, runde trykknapper og et tastatur; til høyre en blå plate med en spakspalte merket STOP, NEUTRAL, RUN, og i midten en rød bryter med nøkkelhull. Igjen og igjen smurt over det med røde bokstaver: DIE.
