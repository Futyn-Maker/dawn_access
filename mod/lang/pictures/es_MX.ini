; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinco amigos ríen en una barra de madera: Chris, de lentes, sostiene una lata; Josh ríe en un banco de bar con una botella; Sam, con un suéter rojo estampado, está sentada en la barra; a la derecha, Matt y Mike se inclinan hacia ellos.
picture.t_camera_chris_01_clr_up=Una selfie en una cabina del teleférico: Josh, con gorro, hace la señal de la V entre Hannah, de lentes, y Beth, con una chamarra rosa.
picture.t_camera_ashley_01_clr_up=Matt rodea con el brazo a Ashley, que lleva un gorro de rayas y sostiene un celular; ambos sonríen.
picture.t_camera_hannah_01_clr_up=Una habitación, con las letras H y W en la pared: Jessica y Emily están sentadas junto a la cama con vasos rojos, Ashley está de pie con un gorro, y Hannah, de lentes, habla por teléfono.
picture.t_camera_mike_01_clr_up=Una broma: Emily, con una amplia sonrisa, pinta en la cara de Chris, dormido en un sofá con la cara ya garabateada, mientras Jessica sonríe de oreja a oreja detrás de él.
look.i_psychsession_1_interaction=Un maizal en un día soleado: un granero rojo a la izquierda y, a la derecha, un espantapájaros con sombrero de paja, una amplia sonrisa, un pañuelo rojo al cuello y un garfio en lugar de una mano. En el maíz oscuro, abajo a la izquierda, dos pequeños ojos amarillos.
look.i_sams_sketchbook.1=Retratos a lápiz. A la izquierda: Sam, con el cabello recogido sin apretar, una bufanda al cuello, mirando hacia un lado. A la derecha: Jessica, sonriente, con una larga trenza sobre el hombro y una parka con capucha de piel.
look.i_sams_sketchbook.2=Retratos a lápiz. A la izquierda: Mike, con el cabello peinado hacia arriba, barba de varios días, mirando hacia un lado, con camisa a cuadros y chamarra con capucha. A la derecha: Josh, con un gorro tejido, una leve sonrisa, mirando de frente.
look.i_sams_sketchbook.3=Retratos a lápiz. A la izquierda: Emily, cabello oscuro y lacio con raya en medio, los labios fruncidos, con un suéter de cuello de tortuga y un cuello de piel. A la derecha: Chris, cabello de punta y lentes rectangulares, con una chamarra acolchada, la boca abierta como si estuviera hablando.
look.i_sams_sketchbook.4=Retratos a lápiz. A la izquierda: Ashley, con un gorro acanalado, cabello largo y lacio, sonriendo con dulzura. A la derecha: Matt, cabello corto y rizado, sonriente, con un suéter de cuello de tortuga.
look.i_map=Un mapa de la montaña, con los lugares rotulados LODGE, SANATORIUM y CABLE CAR. Unos senderos rojos punteados van del teleférico al refugio y suben hasta el manicomio, y por RANGER PATH hasta una torre con un símbolo de radio; abajo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras rojas pintarrajeadas en las paredes, una y otra vez: DIE.
look.i_security_monitor=En la pantalla, un baño a oscuras con una gran tina da paso a la vista de una cámara de seguridad desde arriba: un edificio de madera cubierto de nieve, una lámpara encendida sobre una banca en su largo porche y pinos entre la neblina al fondo. Abajo, en la nieve, entre las sombras de ramas desnudas, hay una figura oscura. Estática, y la figura desapareció.
look.i_family_portrait=Un retrato pintado en un pesado marco tallado, con una placa debajo: THE WASHINGTON FAMILY. A la izquierda, Hannah, de lentes y con un dije de corazón, y Beth, de fleco; la mano de Hannah descansa en el hombro de una mujer sonriente adelante, de cabello corto y oscuro. Atrás, un hombre de bigote abraza por los hombros a Josh, que sonríe a la derecha con un suéter oscuro sobre un cuello blanco.
look.i_car_lookat=Dentro del auto, los asientos están llenos de cosas: dos bolsas de compras rosas de papel, una bolsa de viaje estampada, frascos de esmalte de uñas y de loción, revistas y un plátano.
look.i_hotel_poster=Un cartel desvaído: un gran hotel de madera con largas galerías y hastiales empinados bajo un pico escarpado y un cielo estrellado.
look.i_wanted_poster_lookat_new=La parte superior del cartel está arrancada, y con ella la cara de la foto; sobre WANTED solo queda un trozo oscuro de la imagen.
look.i_missing_axe=En la pared de troncos cuelga una larga caja de madera para un hacha, vacía salvo por los dos soportes que la sujetaban.
look.i_prom_night_photo=Una foto bajo árboles verdes. Desde la izquierda: Hannah, con lentes, una pequeña mariposa negra tatuada en la parte alta del brazo; Sam, rubia, con un vestido de flores, tiende una mano hacia la cámara; Mike, de esmoquin y moño, rodea con el brazo a Emily, que sonríe a la derecha con un vestido azul.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Una foto desvaída en una playa, con el mar y un cabo detrás. Josh, en el centro, rodea con los brazos a Hannah, a la izquierda, con lentes y una pequeña mariposa tatuada en la parte alta del brazo, y a Beth, a la derecha, con fleco.
look.i_minemap=Un viejo plano de las galerías de la mina. En su recuadro: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Sellos rojos, AREAS AT RISK DANGER y DANGER una y otra vez, marcan zonas sombreadas de rojo, con notas a mano en rojo: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). En la esquina: BLACKWOOD MINES.
look.i_cigarstub=Una colilla de puro apagada, la punta reducida a ceniza. Su anillo color crema dice CLASSIC a ambos lados de un escudo rojo oscuro con un penacho de plumas.
look.i_mysticalsymbols=Pintarrajeado en rojo oscuro sobre los tablones: una cara como de calavera, con los dientes al descubierto, bajo una ancha cornamenta ramificada, la pintura chorreando. Al lado cuelga un cráneo de venado con plumas.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Bajo la invitación, una foto en blanco y negro de Mike con esmoquin y moño. Alrededor, en el tablero de corcho, dentro de un marco oscuro y recargado: fotos de Sam, de Emily, Hannah y Beth juntas, de un perro y de gatos, del Tower Bridge y de paisajes; escarapelas con caballos que dicen 1ST y SPECIAL; dos boletos para un concierto de HARRY VOGUE; una cara garabateada firmada JOSH; y notas: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Una vieja casa de muñecas de madera de dos pisos sobre una cómoda: techo gris de tejamanil con una ventana redonda en el frontón, ventanas con postigos y un porche a lo largo del frente. En una ventana de arriba, una muñeca desnuda y pálida de cabello rubio; por una ventana de abajo se ven vagamente más muñecas, y en el porche hay una cabeza de muñeca. Al lado, en una maleta abierta, una muñeca de cabello oscuro con vestido magenta y un libro oscuro con una cruz; enfrente, tres cubos de juguete apilados, cada uno con un 6.
look.i_snowybench=Bajo la nieve barrida, hay un corazón tallado en los tablones, con letras rayadas dentro.
look.i_headlessdoll=Un muñeco bebé desnudo y sin cabeza, de plástico mugriento, manchado y agrietado, con un agujero oscuro en el cuello y unas diminutas uñas pintadas de rojo. En la espalda, una calcomanía con tres mariposas y el nombre Hannah en letra con florituras; en el pecho, una zona redonda de pequeños agujeros.
look.i_readnote=Las letras rojas han chorreado. Al reverso, un membrete impreso, NORTHERN PROVINCES PENITENTIARY, junto a un sello redondo con una balanza; el rojo se transparenta al revés.
look.i_controls_lookat=Un pupitre de control de metal gris, gastado y rayado: al fondo, carátulas marcadas A, V y Hz; hileras de luces amarillas, verdes y blancas, interruptores giratorios, botones redondos y un teclado; a la derecha, una placa azul con una ranura para palanca marcada STOP, NEUTRAL, RUN, y en el centro un interruptor rojo con ranura para llave. Encima, letras rojas pintarrajeadas una y otra vez: DIE.
look.a_telescope=Por el telescopio, de noche: una ladera nevada con rocas y pinos, y un tronco alto y pálido que se curva hacia arriba en el centro. Abajo a la izquierda, en un sendero nevado junto a una gran roca, Emily y Mike están muy juntos, frente a frente: la mano de él en la mejilla de ella, las manos de ella en su cintura. Muy a la derecha, entre ramas desnudas, alguien está sentado solo en una banca bajo un refugio iluminado.
look.i_telescope.act2_2=Por el telescopio, de noche: rocas nevadas y, detrás, la esquina de una cabaña de troncos bajo un techo lleno de carámbanos; una lámpara brilla bajo el alero, sobre un ventilador enrejado. No se ve a nadie.
look.i_telescope.act2_3=Por el telescopio, de noche: un claro nevado entre árboles, donde un columpio de tabla cuelga de dos largas cuerdas. Detrás, salientes de roca nevados y arbustos desnudos; a la izquierda, helechos y un tronco cubierto de hiedra.
look.i_death_whistle=Un silbato tallado con forma de calavera de cornamenta ancha y ramificada. Al girarlo muestra su cara: dos cuencas profundas y una boca redonda abierta, rodeadas de pintura blanca, y una cadena de lazos blancos pintada por la frente.
look.i_view_hannah_poster_part2=El cartel cuelga por dentro de la puerta del casillero, manchado y arrugado; en la foto sonríe Hannah, con el cabello largo y oscuro y lentes de armazón oscuro, y en la esquina hay impreso un sello redondo de la policía.
look.i_smashed_vase=Los fragmentos de un jarrón rojo oscuro están esparcidos por el piso; Ashley sostiene uno, de bordes rotos ásperos y pálidos.
look.i_sams_bracelet=Una pulsera de cordón trenzado, azul con un diseño de rombos amarillos, rojos y violetas, con un broche de metal rosado.
look.i_picture_lookat=Un cuadro en un marco oscuro y agrietado: una casa de madera de dos pisos de noche bajo un cielo de tormenta, toda en azules y grises oscuros, con una ventana redonda en lo alto del frontón, ventanas con postigos arriba y un largo porche con barandal abajo.
look.i_dollhouse_complete=Por las ventanas de la casa de muñecas se ven muñecas adentro; luego, de cerca, cuatro muñecas desnudas apiñadas: una pelirroja, una morena, una rubia con coletas y una de piel oscura que sostiene una pequeña cámara de video. Sus ojos son agujeros negros, y les bajan por las mejillas chorreones rojo oscuro.
look.i_dollhouse_complete.open=La fachada de la casa de muñecas se abre y el techo se levanta: dos pisos de cuartos diminutos con muñecas desnudas colocadas en escena. Arriba, una muñeca morena y una rubia con lentes están echadas en un sofá junto a una mesa con una botella y un vaso. Abajo, cuatro muñecas están hincadas juntas sobre un tapete rojo, una sostiene una pequeña cámara de video, y otra muñeca está de pie aparte.
look.i_doll_house_lookat_keyhole=En lo alto del frontón de la casa de muñecas, la ventanita redonda se ha girado a un lado como una tapa: detrás, una placa redonda de latón con una cerradura, bordeada de rojo.
look.i_doll_house_key=Una pequeña llave antigua de hierro, con el ojo en forma de corazón y la caña con estrías en espiral. Colgaba de un ganchito de latón, escondida detrás del cuadro.
look.i_wine_rack=Un botellero alto de madera tras una celosía de tiras de hierro en rombos; sus tablas superiores están hundidas y astilladas, con agujeros oscuros abiertos en ellas.
look.i_wine_cellar_door=Una puerta de tablones reforzada con flejes de hierro; en su placa de cerradura oxidada no hay manija, solo un pequeño agujero cuadrado.
look.i_secret_camera=Una pequeña videocámara plateada que estaba escondida entre las cajas de cartón; su lucecita roja de grabación parpadea.
look.i_doll_head=Girada hacia ella, la cabeza calva de la muñeca: cuencas negras y vacías rodeadas de pestañas pintadas, mejillas sonrosadas, labios rojos, la pintura agrietada y descarapelada, y una grieta oscura que baja de un ojo pasando junto a la boca.
look.i_doll_head.roaches=De la cabeza de la muñeca salen cucarachas en tropel.
look.i_sams_sack=Bajo el costal está Sam, envuelta en una toalla de baño, sentada inmóvil en una vieja silla giratoria de madera.
look.crossedout=Una foto está tachada: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
