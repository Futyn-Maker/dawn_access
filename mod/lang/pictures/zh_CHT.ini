picture.t_camera_sam_01_clr_up=五個朋友在木製吧檯邊歡笑：戴眼鏡的克里斯多福拿著一罐飲料；約書亞拿著一個瓶子，坐在吧檯凳上大笑；穿紅色花紋毛衣的薩曼莎坐在檯面上；馬修和麥可在右邊探過身來。
picture.t_camera_chris_01_clr_up=纜車裡的自拍：戴毛帽的約書亞在戴眼鏡的漢娜和穿粉紅色外套的貝絲之間比出V字手勢。
picture.t_camera_ashley_01_clr_up=馬修摟著艾希莉，艾希莉戴著條紋毛帽，拿著手機；兩人都在微笑。
picture.t_camera_hannah_01_clr_up=一間臥室，牆上有字母H和W：潔西卡和艾蜜莉拿著紅色杯子坐在床邊，艾希莉戴著毛帽站著，戴眼鏡的漢娜在講電話。
picture.t_camera_mike_01_clr_up=惡作劇：艾蜜莉咧嘴笑著，在克里斯多福臉上塗鴉；他睡在沙發上，臉上已經被畫過了，潔西卡在他身後咧嘴笑著。
look.i_psychsession_1_interaction=晴天裡的一片玉米田：左邊是一座紅色穀倉，右邊是一個戴草帽的稻草人，臉上咧嘴笑著，繫著紅色領巾，一隻手是鉤子。左下角的黑暗玉米叢中，有兩隻小小的黃色眼睛。
look.i_sams_sketchbook.1=鉛筆肖像畫。左邊：薩曼莎，頭髮鬆鬆地束在腦後，脖子上圍著圍巾，目光望向一旁。右邊：潔西卡，面帶微笑，一條長辮子垂在肩上，穿著帶毛皮連帽的派克大衣。
look.i_sams_sketchbook.2=鉛筆肖像畫。左邊：麥可，頭髮往上梳起，留著鬍渣，目光望向一旁，穿著格子襯衫和連帽夾克。右邊：約書亞，戴著針織毛帽，帶著淡淡的微笑，直視前方。
look.i_sams_sketchbook.3=鉛筆肖像畫。左邊：艾蜜莉，深色直髮中分，抿著嘴唇，身穿高領毛衣，配毛皮衣領。右邊：克里斯多福，頭髮根根豎起，戴著長方形眼鏡，穿著鋪棉夾克，嘴巴張著，像是話說到一半。
look.i_sams_sketchbook.4=鉛筆肖像畫。左邊：艾希莉，戴著羅紋毛帽，一頭長直髮，溫柔地微笑著。右邊：馬修，一頭短捲髮，面帶微笑，穿著高領毛衣。
look.i_map=一幅山區地圖，各處標示著LODGE、SANATORIUM和CABLE CAR。紅色虛線小徑從纜車通往山莊，再往上通往療養度假中心，另有一條沿RANGER PATH通往一座帶有無線電標誌的塔；底部寫著TO LOWER CABLE CAR。
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=牆上滿是一再塗寫的紅字：DIE。
