; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=五個朋友在木製吧檯邊歡笑：戴眼鏡的克里斯多福拿著一罐飲料；約書亞拿著一個瓶子，坐在吧檯凳上大笑；穿紅色花紋毛衣的薩曼莎坐在檯面上；馬修和麥可在右邊探過身來。
picture.t_camera_chris_01_clr_up=纜車裡的自拍：戴毛帽的約書亞在戴眼鏡的漢娜和穿粉紅色外套的貝絲之間比出V字手勢。
picture.t_camera_ashley_01_clr_up=馬修摟著艾希莉，艾希莉戴著條紋毛帽，拿著手機；兩人都在微笑。
picture.t_camera_hannah_01_clr_up=一間臥室，牆上有字母H和W：潔西卡和艾蜜莉拿著紅色杯子坐在床邊，艾希莉戴著毛帽站著，戴眼鏡的漢娜在講電話。
picture.t_camera_mike_01_clr_up=惡作劇：艾蜜莉咧嘴笑著，在克里斯多福臉上塗鴉；他睡在沙發上，臉上已經被畫過了，潔西卡在他身後咧嘴笑著。
look.i_psychsession_1_interaction=晴天裡的一片玉米田：左邊是一座紅色穀倉，右邊是一個戴草帽的稻草人，臉上咧嘴笑著，繫著紅色領巾，一隻手是鉤子。左下角的黑暗玉米叢中，有兩隻小小的黃色眼睛。
look.i_sams_sketchbook.1=鉛筆肖像畫。左邊：薩曼莎，頭髮鬆鬆地束在腦後，脖子上圍著圍巾，目光望向一旁。右邊：潔西卡，面帶微笑，一條長辮子垂在肩上，穿著帶毛皮連帽的派克大衣。
look.i_sams_sketchbook.2=鉛筆肖像畫。左邊：麥可，頭髮往上梳起，留著鬍渣，目光望向一旁，穿著格子襯衫和連帽夾克。右邊：約書亞，戴著針織毛帽，帶著淡淡的微笑，直視前方。
look.i_sams_sketchbook.3=鉛筆肖像畫。左邊：艾蜜莉，深色直髮中分，抿著嘴唇，身穿高領毛衣，配毛皮衣領。右邊：克里斯多福，頭髮根根豎起，戴著長方形眼鏡，穿著鋪棉夾克，嘴巴張著，像是話說到一半。
look.i_sams_sketchbook.4=鉛筆肖像畫。左邊：艾希莉，戴著羅紋毛帽，一頭長直髮，溫柔地微笑著。右邊：馬修，一頭短捲髮，面帶微笑，穿著高領毛衣。
look.i_map=一幅山區地圖，各處標示著LODGE、SANATORIUM和CABLE CAR。紅色虛線小徑從纜車通往山莊，再往上通往療養度假中心，另有一條沿RANGER PATH通往一座帶有無線電標誌的塔；底部寫著TO LOWER CABLE CAR。
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=牆上滿是一再塗寫的紅字：DIE。
look.i_security_monitor=螢幕上，一間有大浴缸的昏暗浴室切換成監視攝影機的俯視畫面：一座積雪的木造建築，長長的門廊上，長椅上方亮著一盞燈，後面是霧中的針葉樹。下方雪地上，光禿樹枝的陰影間，站著一個黑色人影。畫面一陣雜訊干擾，人影不見了。
look.i_family_portrait=厚重雕花畫框中的一幅肖像畫，下方有一塊銘牌：THE WASHINGTON FAMILY。左邊是戴眼鏡、掛著心形墜子的漢娜和留著瀏海的貝絲；漢娜的手搭在前面一位微笑的短黑髮女人肩上。後面，一個留著小鬍子的男人摟著約書亞的肩膀，約書亞在右邊微笑，深色毛衣裡露出白色衣領。
look.i_car_lookat=車裡的座位上堆滿了東西：兩個粉紅色紙質購物袋、一個帶花紋的旅行包、幾瓶指甲油和乳液、雜誌，還有一根香蕉。
look.i_hotel_poster=一張褪色的海報：嶙峋的山峰和星空下，一座有長長的遊廊和陡峭山牆的大型木造飯店。
look.i_wanted_poster_lookat_new=海報上半部被撕掉了，照片上的臉也隨之不見；WANTED上方只剩一小片深色的照片殘片。
look.i_missing_axe=原木牆上掛著一個放斧頭的長木匣，裡面空空的，只剩下兩個原本固定斧頭的卡扣。
look.i_prom_night_photo=一張在綠樹下拍的照片。從左起：戴眼鏡的漢娜，上臂刺著一隻小小的黑蝴蝶；金髮的薩曼莎穿著碎花裙，朝鏡頭伸出一隻手；穿燕尾服、打領結的麥可摟著艾蜜莉，她在右邊穿著藍裙子微笑。
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=一張在海灘上拍的褪色照片，背後是大海和一處岬角。中間的約書亞摟著左邊戴眼鏡、上臂刺著一隻小蝴蝶的漢娜，和右邊留著瀏海的貝絲。
look.i_minemap=一張舊的礦井巷道測繪圖。圖框裡寫著：Maple Leaf Surveyors；Location: Blackwood Mines 7A-3；Surveyor: Charles Scott (MIRCS)；Date: 07/10/1951。紅色印章AREAS AT RISK DANGER和一再出現的DANGER標出塗成紅色的區域，旁邊有紅色手寫批註：Flood Risk、Extreme Rockfall Danger、Collapsed Supports (Rust)。角落裡寫著BLACKWOOD MINES。
look.i_cigarstub=一截掐滅的雪茄菸頭，末端已燒成灰。米色的雪茄環上，一面飾有羽毛頭飾的暗紅色盾牌兩側都寫著CLASSIC。
look.i_mysticalsymbols=木板上用暗紅色胡亂畫著：寬大分叉的鹿角下，一張齜著牙的骷髏般的臉，顏料流淌成道道痕跡。旁邊掛著一個飾有羽毛的鹿頭骨。
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=邀請函下面是一張黑白照片，麥可穿著燕尾服、打著領結。周圍的軟木板裝在華麗的深色畫框裡，上面有：薩曼莎的照片，艾蜜莉、漢娜和貝絲的合照，一隻狗和幾隻貓，倫敦塔橋和風景的照片；印著馬的獎章花結，寫著1ST和SPECIAL；兩張HARRY VOGUE演唱會門票；一張署名JOSH的塗鴉笑臉；還有便條：Finals start APRIL 22nd!!；It's up to you to find BEAUTY in the ugliest days!；Dad's new P.A Cheryl 558-714-1132。
look.i_look_at_dollshouse=五斗櫃上放著一座舊的兩層木製娃娃屋：灰色木瓦屋頂，山牆上開著一扇圓窗，窗戶帶百葉窗，正面有一道門廊。樓上的一扇窗裡有一個金髮、蒼白、赤裸的娃娃；從樓下的一扇窗裡隱約能看到更多娃娃，門廊上躺著一個娃娃頭。旁邊打開的手提箱裡有一個穿洋紅色裙子的黑髮娃娃和一本帶十字架的深色書；前面疊著三塊玩具積木，每塊都露出6。
look.i_snowybench=掃開積雪，木板上刻著一顆心，裡面劃著幾個字母。
look.i_headlessdoll=一個沒有頭的赤裸嬰兒娃娃，塑膠又髒又有汙漬、滿是裂紋，脖子處有個黑洞，小小的指甲塗成了紅色。背上貼著一張貼紙，有三隻蝴蝶和花體字的名字Hannah；胸口有一圈細小的孔。
look.i_readnote=紅色的字跡流淌成道道痕跡。背面是印好的信頭NORTHERN PROVINCES PENITENTIARY，旁邊是一枚帶天平圖案的圓形印章；紅字從背面反著透過來。
look.i_controls_lookat=一張灰色的金屬控制台，磨損嚴重、滿是刮痕：後部是標著A、V和Hz的儀表，一排排黃、綠、白色的指示燈，旋鈕開關，圓形按鈕和一個數字鍵盤；右邊是一塊帶操縱桿槽的藍色面板，標著STOP、NEUTRAL、RUN，中間是一個帶鑰匙孔的紅色開關。上面用紅字一遍又一遍地塗著：DIE。
