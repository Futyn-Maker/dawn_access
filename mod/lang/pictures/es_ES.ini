picture.mi_padlock=@SMG013_64519
; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinco amigos ríen en una barra de madera: Chris, con gafas, sostiene una lata; Josh ríe en un taburete de bar con una botella; Sam, con un jersey rojo estampado, está sentada en la barra; a la derecha, Matt y Mike se inclinan hacia ellos.
picture.t_camera_chris_01_clr_up=Un selfie en una cabina del teleférico: Josh, con gorro, hace el signo de la V entre Hannah, con gafas, y Beth, con una chaqueta rosa.
picture.t_camera_ashley_01_clr_up=Matt rodea con el brazo a Ashley, que lleva un gorro de rayas y sostiene un móvil; ambos sonríen.
picture.t_camera_hannah_01_clr_up=Un dormitorio, con las letras H y W en la pared: Jessica y Emily están sentadas junto a la cama con vasos rojos, Ashley está de pie con un gorro, y Hannah, con gafas, habla por teléfono.
picture.t_camera_mike_01_clr_up=Una broma: Emily, con una amplia sonrisa, pinta en la cara de Chris, dormido en un sofá con la cara ya garabateada, mientras Jessica sonríe de oreja a oreja detrás de él.
look.i_psychsession_1_interaction=Un maizal en un día soleado: un granero rojo a la izquierda y, a la derecha, un espantapájaros con sombrero de paja, una amplia sonrisa, un pañuelo rojo al cuello y un garfio en lugar de una mano. En el maíz oscuro, abajo a la izquierda, dos pequeños ojos amarillos.
look.i_sams_sketchbook.1=Retratos a lápiz. A la izquierda: Sam, con el pelo recogido sin apretar, una bufanda al cuello, mirando a un lado. A la derecha: Jessica, sonriente, con una larga trenza sobre el hombro y una parka con capucha de piel.
look.i_sams_sketchbook.2=Retratos a lápiz. A la izquierda: Mike, con el pelo peinado hacia arriba, barba de varios días, mirando a un lado, con camisa de cuadros y chaqueta con capucha. A la derecha: Josh, con un gorro de punto, una leve sonrisa, mirando de frente.
look.i_sams_sketchbook.3=Retratos a lápiz. A la izquierda: Emily, pelo oscuro y liso con raya en medio, los labios fruncidos, con un jersey de cuello alto y un cuello de piel. A la derecha: Chris, pelo de punta y gafas rectangulares, con una chaqueta acolchada, la boca abierta como si estuviera hablando.
look.i_sams_sketchbook.4=Retratos a lápiz. A la izquierda: Ashley, con un gorro de canalé, pelo largo y liso, sonriendo con dulzura. A la derecha: Matt, pelo corto y rizado, sonriente, con un jersey de cuello alto.
look.i_map=Un mapa de la montaña, con los lugares rotulados LODGE, SANATORIUM y CABLE CAR. Unos senderos rojos de puntos van del teleférico al refugio y suben hasta el manicomio, y por RANGER PATH hasta una torre con un símbolo de radio; abajo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras rojas pintarrajeadas en las paredes, una y otra vez: DIE.
look.i_security_monitor=En la pantalla, un baño a oscuras con una gran bañera da paso a la vista de una cámara de seguridad desde arriba: un edificio de madera cubierto de nieve, una lámpara encendida sobre un banco en su largo porche y abetos entre la niebla al fondo. Abajo, en la nieve, entre las sombras de ramas desnudas, hay una figura oscura. Interferencias, y la figura ha desaparecido.
look.i_family_portrait=Un retrato pintado en un pesado marco tallado, con una placa debajo: THE WASHINGTON FAMILY. A la izquierda, Hannah, con gafas y un colgante de corazón, y Beth, con flequillo; la mano de Hannah descansa en el hombro de una mujer sonriente delante, de pelo corto y oscuro. Detrás, un hombre con bigote rodea con el brazo a Josh, que sonríe a la derecha con un jersey oscuro sobre un cuello blanco.
look.i_car_lookat=Dentro del coche, los asientos están llenos de cosas: dos bolsas de compras rosas de papel, una bolsa de viaje estampada, frascos de esmalte de uñas y de loción, revistas y un plátano.
look.i_hotel_poster=Un cartel desvaído: un gran hotel de madera con largas galerías y hastiales empinados bajo un pico escarpado y un cielo estrellado.
look.i_prom_night_photo=En la foto, Hannah tiene una pequeña mariposa negra tatuada en la parte superior del brazo.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=En la foto, Hannah tiene una pequeña mariposa tatuada en la parte superior del brazo.
look.i_mysticalsymbols=Pintarrajeado en rojo oscuro sobre los tablones: una cara como de calavera, con los dientes al descubierto, bajo una ancha cornamenta ramificada, la pintura chorreando. Al lado cuelga un cráneo de ciervo con plumas.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Bajo la invitación, una foto en blanco y negro de Mike con esmoquin y pajarita. Alrededor, en el tablero de corcho, dentro de un marco oscuro y recargado: fotos de Sam, de Emily, Hannah y Beth juntas, de un perro y de gatos, del Tower Bridge y de paisajes; escarapelas con caballos que dicen 1ST y SPECIAL; dos entradas para un concierto de HARRY VOGUE; una cara garabateada firmada JOSH; y notas: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Una vieja casa de muñecas de madera de dos plantas sobre una cómoda: tejado gris de tablillas con una ventana redonda en el frontón, ventanas con contraventanas y un porche a lo largo de la fachada. En una ventana de arriba, una muñeca desnuda y pálida de pelo rubio; por una ventana de abajo se ven vagamente más muñecas, y en el porche hay una cabeza de muñeca. Al lado, en una maleta abierta, una muñeca morena con vestido magenta y un libro oscuro con una cruz; delante, tres cubos de juguete apilados, cada uno con un 6.
look.i_snowybench=Bajo la nieve barrida, hay un corazón tallado en los tablones, con letras rayadas dentro.
look.i_headlessdoll=Un muñeco bebé desnudo y sin cabeza, de plástico mugriento, manchado y agrietado, con un agujero oscuro en el cuello y unas diminutas uñas pintadas de rojo. En la espalda, una pegatina con tres mariposas y el nombre Hannah en letra con florituras; en el pecho, una zona redonda de pequeños agujeros.
look.i_controls_lookat=Un pupitre de control de metal gris, gastado y rayado: al fondo, esferas marcadas A, V y Hz; hileras de pilotos amarillos, verdes y blancos, interruptores giratorios, pulsadores redondos y un teclado; a la derecha, una placa azul con una ranura para palanca marcada STOP, NEUTRAL, RUN, y en el centro un interruptor rojo con ranura para llave. Encima, letras rojas pintarrajeadas una y otra vez: DIE.
look.a_telescope=Por el telescopio, de noche: una ladera nevada con rocas y pinos, y un tronco alto y pálido que se curva hacia arriba en el centro. Abajo a la izquierda, en un sendero nevado junto a una gran roca, Emily y Mike están muy juntos, frente a frente: la mano de él en la mejilla de ella, las manos de ella en su cintura. Muy a la derecha, entre ramas desnudas, alguien está sentado solo en un banco bajo un refugio iluminado.
look.i_telescope.act2_2=Por el telescopio, de noche: rocas nevadas y, detrás, la esquina de una cabaña de troncos bajo un tejado lleno de carámbanos; una lámpara brilla bajo el alero, sobre un ventilador enrejado. No se ve a nadie.
look.i_telescope.act2_3=Por el telescopio, de noche: un claro nevado entre árboles, donde un columpio de tabla cuelga de dos largas cuerdas. Detrás, repisas de roca nevadas y arbustos desnudos; a la izquierda, helechos y un tronco cubierto de hiedra.
look.i_death_whistle=Un silbato tallado con forma de calavera de cornamenta ancha y ramificada. Al girarlo muestra su cara: dos cuencas profundas y una boca redonda abierta, rodeadas de pintura blanca, y una cadena de lazos blancos pintada por la frente.
look.i_smashed_vase=Los fragmentos de un jarrón rojo oscuro están esparcidos por el suelo; Ashley sostiene uno, de bordes rotos ásperos y pálidos.
look.i_sams_bracelet=Una pulsera de cordón trenzado, azul con un dibujo de rombos amarillos, rojos y violetas, con un cierre de metal rosado.
look.i_picture_lookat=Un cuadro en un marco oscuro y agrietado: una casa de madera de dos plantas de noche bajo un cielo de tormenta, toda en azules y grises oscuros, con una ventana redonda en lo alto del hastial, ventanas con contraventanas arriba y un largo porche con barandilla abajo.
look.i_dollhouse_complete=Por las ventanas de la casa de muñecas se ven muñecas dentro; luego, de cerca, cuatro muñecas desnudas apiñadas, todas con la misma cara de muñeca: una pelirroja, una morena, una rubia con coletas y una de piel oscura que sostiene una pequeña cámara de vídeo, como Ashley, Emily, Jessica y Matt. Sus ojos son agujeros negros, y les bajan por las mejillas regueros rojo oscuro.
look.i_dollhouse_complete.open=La fachada de la casa de muñecas se abre y el tejado se levanta: dos plantas de habitaciones diminutas con muñecas desnudas colocadas en escena, todas con la misma cara de muñeca, pero con el pelo de los amigos. Arriba, junto a una mesa con botellas y un vaso, una muñeca morena está repantigada en un sofá al lado de una rubia con gafas, como Josh y Chris. Abajo, cuatro muñecas están arrodilladas sobre una alfombra roja frente a una cama: una de piel oscura que graba con una pequeña cámara de vídeo, una rubia con coletas, una morena y una pelirroja, como Matt, Jessica, Emily y Ashley; otra muñeca está de pie aparte.
look.i_doll_house_lookat_keyhole=En lo alto del hastial de la casa de muñecas, la ventanita redonda se ha girado a un lado como una tapa: detrás, una placa redonda de latón con una cerradura, bordeada de rojo.
look.i_doll_house_key=Una pequeña llave antigua de hierro, con el ojo en forma de corazón y la caña con estrías en espiral. Colgaba de un ganchito de latón, escondida detrás del cuadro.
look.i_wine_rack=Un botellero alto de madera tras una celosía de tiras de hierro en rombos; sus tablas superiores están hundidas y astilladas, con agujeros oscuros abiertos en ellas.
look.i_wine_cellar_door.act5_3=Una puerta de tablones reforzada con flejes de hierro; en su placa de cerradura oxidada no hay manija, solo un pequeño agujero cuadrado.
look.i_doll_head=Girada hacia ella, la cabeza calva de la muñeca: cuencas negras y vacías rodeadas de pestañas pintadas, mejillas sonrosadas, labios rojos, la pintura agrietada y descascarillada, y una grieta oscura que baja de un ojo pasando junto a la boca.
look.i_doll_head.roaches=De la cabeza de la muñeca salen cucarachas en tropel.
look.i_sams_sack=Bajo el saco está Sam, envuelta en una toalla de baño, sentada inmóvil en una vieja silla giratoria de madera.
look.crossedout=Una foto está tachada: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Una malla metálica oxidada tendida entre dos postes de madera, con la mano de Emily agarrada al de la derecha; a través de ella, abajo, en una tenue luz azulada, el suelo de una galería sembrado de escombros, con una viga oscura atravesada.
look.i_torn_miner_clothes=Sobre las piedras hay un viejo casco de minero: una cúpula de metal oscuro con nervios en relieve, un ala ancha oxidada y, delante, una pequeña lámpara de latón con un reflector redondo.
look.i_broken_ladder=Una escalera de mano rota yace atravesada sobre los escombros: un largo larguero de madera del que sobresalen tres travesaños de hierro oxidados, con los extremos partidos; en dos de ellos aún quedan restos astillados de madera.
look.i_sign=En el polvo hay un trozo roto de un letrero de madera desgastado por la intemperie, con los bordes irregulares y astillados; en él, en mayúsculas rojas desvaídas de plantilla, el final de una palabra, GER, y debajo EDGE.
look.i_peer_at_head=A través de una malla metálica oscura, entre tablones toscos: al otro lado, sobre un suelo pedregoso, un barril tapado con una lona y, más atrás, una barandilla de madera y montones de escombros.
look.i_peer_at_wheel=A través de una malla metálica oxidada entre dos postes: una cueva al otro lado y, en ella, una gran rueda hidráulica de madera, vieja, entre andamios rotos; a su pie, una llamarada brota de la oscuridad y se apaga.
look.i_scarecrow_lookat=Un espantapájaros, con brazos de ramas desnudas que acaban en ramitas y el cuerpo de una bolsa de plástico negra manchada de sangre. La cabeza está envuelta en una tela clara atada al cuello con una cuerda; a través de ella asoma una cara podrida, una nariz hueca y una boca abierta de dientes cariados, con un lado empapado de sangre. Bajo un sombrero marrón maltrecho cuelga un largo pelo negro.
look.i_scarecrow_lookat.clown=Un espantapájaros, con brazos de ramas desnudas que acaban en ramitas y el cuerpo de una bolsa de plástico negra manchada de sangre. La cabeza es una máscara de payaso: una cara blanca y arrugada, cejas moradas pintadas en altos arcos que suben por la frente, oscuros huecos de los ojos rodeados de morado, nariz roja y una ancha sonrisa de dientes largos y afilados, roja en las comisuras, con la barbilla oscura de sangre.
look.i_scarecrow_lookat.zombie=Un espantapájaros, con brazos de ramas desnudas que acaban en ramitas y el cuerpo de una bolsa de plástico negra manchada de sangre. La cabeza es la de un zombi podrido: calva, piel moteada de gris verdoso, ojos blancos vacíos y una boca abierta llena de dientes.
look.i_dead_crow_lookat=Dos cuervos muertos yacen en la nieve manchada de sangre, despedazados y ensangrentados, con las alas abiertas y las entrañas fuera; alrededor hay plumas negras sueltas esparcidas.
look.i_chair_and_blood=Sobre el suelo de hormigón hay un taburete de madera volcado, con las patas rotas; a su lado, un grillete de hierro abierto con su cadena. Hay sangre salpicada y goteada por el suelo, y un farol tirado de lado, todavía encendido.
look.i_fake_torso=La mitad superior de un cuerpo con una camisa gris de cuadros cuelga con los brazos estirados hacia arriba; bajo la cintura no hay más que un corte desgarrado y sangriento. Detrás hay una tabla con un agujero recortado.
look.i_saw_blades=Una enorme hoja de sierra circular yace plana, con el acero oxidado manchado de sangre oscura; detrás, una alambrada.
look.i_dead_wolf_inspect=Un lobo muerto cuelga de los barrotes de la puerta de una celda: el pecho y el vientre abiertos de par en par y vacíos, la cabeza caída con las fauces abiertas, y bajo él sus entrañas yacen en un charco de sangre.
look.i_damaged_doors=Una pesada puerta de celda de acero con paneles abollados: por ella baja una gran mancha oscura de sangre, la sangre ha goteado desde debajo de la pequeña trampilla de arriba, y en el metal hay hondos zarpazos.
look.i_sanlookat=Una alambrada: a la izquierda, un poste oscuro y, cruzándola, una barra oxidada. A través de la malla, en la nieve al otro lado, un corto tramo de escalones de hormigón con una barandilla de metal.
look.i_oilflask=Sostenida ante los ojos, una lata alta de metal roja y oxidada. En un costado, un emblema ovalado desvaído dice North West alrededor de las letras NWM, con Mining debajo; en el lado estrecho, un rombo rojo dice FLAMMABLE LIQUID.
look.i_oilflask.roaches=Salen cucarachas que corretean por la lata, y ella la arroja lejos.
look.i_admin_area_jacksdoor_lookat_reader=Un lector de tarjetas negro en la pared, junto a una puerta de madera, con un pequeño panel rojo que dice LOCKED; en la puerta, bajo una ventanita, un letrero verde oxidado: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=En la bandeja extraída de la morgue yace boca arriba un cadáver putrefacto: una cara gris y consumida con la boca abierta de par en par, rodeada de pelo oscuro apelmazado; su camisa gris y la bandeja oxidada están manchadas de sangre vieja.
look.i_jackslair_exit_lock_lookat=Una verja de hierro de malla romboidal está cerrada a cal y canto: un candado grande y oxidado cuelga del portacandado, junto al marco de madera de la puerta.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Dos carteles de MISSING: HANNAH WASHINGTON y BETH WASHINGTON; el de Hannah dice: She has glasses, and has a tattoo of a butterfly on her right shoulder. Una nota amarilla: NEVER FORGET. Recortes de periódico: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. En una foto de cuatro chicas, Hannah está encerrada en un círculo rojo.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_snowwipe_tractor_revisit=Detrás del cristal sucio y moteado de la cabina del viejo camión hay una máscara de hockey blanca pintada como una calavera: huecos de los ojos rasgados, una nariz de calavera y una ancha sonrisa de dientes largos, dos trazos oscuros sobre un ojo, y en lo alto le falta un trozo.
look.i_joshsbaseball=Una vieja pelota de béisbol sucia, con el cuero raspado y manchado de marrón y las costuras de un rojo desvaído; en ella, escrito a mano en negro: Josh.
look.i_loveheart=Hay un corazón tallado en la corteza clara del tronco de un árbol y, dentro, M+E.
look.i_rifle_lookat=En una caseta de madera, un rifle descansa sobre el mostrador de tablones. Fuera, más allá, en la nieve, hay viejos barriles con botellas encima, y de las ramas cuelgan sacos atados a cuerdas, uno de ellos marcado con una X.
look.i_look_at_picture==look.i_picture_lookat
look.i_wine_cellar_door.act2_4=Una puerta de tablones reforzada con flejes de hierro; en su placa de cerradura oxidada hay un pomo redondo.
look.i_rush_of_blood_snowglobe=Una bola de nieve sobre una base pintada con zigzags rojos y azules. Dentro del cristal, sobre un montículo nevado, la vía de madera de una montaña rusa se retuerce en bucles sobre finos pilotes, con pequeños vagones encima; globos rojos con estrellas blancas y carteles rojos en forma de flecha salpicados de luces se alzan entre los bucles.
look.i_chess_piece=Cogida de un tablero de ajedrez, una pequeña figura de un hombre, más o menos del largo de un dedo: está de pie con los brazos a los costados, en camiseta y pantalón, y tiene la cara lisa, sin rasgos.
look.i_fallen_beams=En el suelo yace un panel de rejilla de hierro soldada en un marco oxidado, con algunas barras partidas y dos grandes trozos de roca encima; de una argolla en su esquina cuelga una pesada cadena.
look.i_lookatmineexit=De cerca, una puerta de tablones desgastados por la intemperie con un gran agujero de bordes irregulares que la atraviesa; a través del agujero solo hay una niebla gris pálida.
look.i_matts_shoe=Una bota grande de invierno, recogida del suelo: una caña de cuero azul oscuro con los cordones pasados por presillas, un forro de fieltro que asoma por arriba y un pie de goma oscura con rayas blancas, manchado de barro.
look.i_ashleys_purse=Chris sostiene en alto un pequeño bolso oscuro de punto; en la parte delantera lleva tejidas unas letras claras: ASH.
look.i_investigate_blood_kitchen=Hay sangre rociada por una pared clara, sobre una encimera de madera: una gran mancha oscura y una lluvia de salpicaduras a su alrededor, con regueros que bajan hasta la encimera.
look.i_hospital_the_chair=Vista desde arriba, una vieja silla de madera entre trozos de escombro: correas de cuero con hebillas en los brazos, el alto respaldo y las patas, y sangre oscura impregnada en el asiento.
look.i_morgue_security_gate_lookat=Un lector de tarjetas negro en una pared de azulejos verde pálido, junto a un marco de puerta de madera oscura, con un pequeño panel rojo que dice LOCKED; al lado, un letrero verde desgastado: CHAPEL SECURITY PASS REQUIRED.
look.i_jackslair_look_into_church=Por un hueco entre tablas: una gran sala en penumbra, envuelta en una bruma de polvo, con una barandilla en lo alto a lo largo de la pared del fondo; abajo, en el suelo, a la izquierda, arde una lámpara entre unos cuantos muebles y trastos.
look.i_warningsign=En la nieve hay un trozo roto de un letrero de madera desgastado por la intemperie, con los bordes irregulares; en él, en mayúsculas rojas desvaídas de plantilla, el principio de una palabra, DAN, y debajo CLIFF.
look.i_sams_sock=Sam sostiene en alto un único calcetín gris de canalé junto a un sillón vacío con armazón de madera tallada; en el suelo arde una vela.
look.i_cooling_equipment=Una unidad de refrigeración de metal oscuro con un manómetro redondo; delante, una válvula roja con un segundo manómetro y un volante rojo, y mangueras negras corrugadas que bajan enroscándose hasta el suelo, envuelto en una bruma blanca.
look.i_boilerroom_lookat=A través del marco roto de una ventana con barrotes: al otro lado, una gran sala en penumbra, envuelta en una bruma de polvo, alambradas y postes metálicos al fondo, escombros esparcidos por el suelo.
look.i_jackslair_storagechest=Mike sostiene en alto un hueso largo sacado del baúl, ensangrentado en su extremo nudoso, con jirones de carne pegados.
