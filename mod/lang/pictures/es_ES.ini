picture.t_camera_sam_01_clr_up=Cinco amigos ríen en una barra de madera: Chris, con gafas, sostiene una lata; Josh ríe en un taburete de bar con una botella; Sam, con un jersey rojo estampado, está sentada en la barra; a la derecha, Matt y Mike se inclinan hacia ellos.
picture.t_camera_chris_01_clr_up=Un selfie en una cabina del teleférico: Josh, con gorro, hace el signo de la V entre Hannah, con gafas, y Beth, con una chaqueta rosa.
picture.t_camera_ashley_01_clr_up=Matt rodea con el brazo a Ashley, que lleva un gorro de rayas y sostiene un móvil; ambos sonríen.
picture.t_camera_hannah_01_clr_up=Un dormitorio, con las letras H y W en la pared: Jessica y Emily están sentadas junto a la cama con vasos rojos, Ashley está de pie con un gorro, y Hannah, con gafas, habla por teléfono.
picture.t_camera_mike_01_clr_up=Una broma: Emily, con una amplia sonrisa, pinta en la cara de Chris, dormido en un sofá con la cara ya garabateada, mientras Jessica sonríe de oreja a oreja detrás de él.
look.i_psychsession_1_interaction=Un maizal en un día soleado: un granero rojo a la izquierda y, a la derecha, un espantapájaros con sombrero de paja, una amplia sonrisa, un pañuelo rojo al cuello y un garfio en lugar de una mano. En el maíz oscuro, abajo a la izquierda, dos pequeños ojos amarillos.
look.i_sams_sketchbook.1=Retratos a lápiz. A la izquierda: Sam, con el pelo recogido sin apretar, una bufanda al cuello, mirando a un lado. A la derecha: Jessica, sonriente, con una larga trenza sobre el hombro y una parka con capucha de piel.
look.i_sams_sketchbook.2=Retratos a lápiz. A la izquierda: Mike, con el pelo peinado hacia arriba, barba de varios días, mirando a un lado, con camisa de cuadros y chaqueta con capucha. A la derecha: Josh, con un gorro de punto, una leve sonrisa, mirando de frente.
look.i_sams_sketchbook.3=Retratos a lápiz. A la izquierda: Emily, pelo oscuro y liso con raya en medio, los labios fruncidos, con un jersey de cuello alto y un cuello de piel. A la derecha: Chris, pelo de punta y gafas rectangulares, con una chaqueta acolchada, la boca abierta como si estuviera hablando.
look.i_sams_sketchbook.4=Retratos a lápiz. A la izquierda: Ashley, con un gorro de canalé, pelo largo y liso, sonriendo con dulzura. A la derecha: Matt, pelo corto y rizado, sonriente, con un jersey de cuello alto.
look.i_map=Un mapa de la montaña, con los lugares rotulados LODGE, SANATORIUM y CABLE CAR. Unos senderos rojos de puntos van del teleférico al refugio y suben hasta el manicomio, y por RANGER PATH hasta una torre con un símbolo de radio; abajo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras rojas pintarrajeadas en las paredes, una y otra vez: DIE.
look.i_security_monitor=En la pantalla, un baño a oscuras con una gran bañera da paso a la vista de una cámara de seguridad desde arriba: un edificio de madera cubierto de nieve, una lámpara encendida sobre un banco en su largo porche y abetos entre la niebla al fondo. Abajo, en la nieve, entre las sombras de ramas desnudas, hay una figura oscura. Interferencias, y la figura ha desaparecido.
