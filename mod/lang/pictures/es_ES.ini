; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinco amigos ríen en una barra de madera: Chris, con gafas, sostiene una lata; Josh ríe en un taburete de bar con una botella; Sam, con un jersey rojo estampado, está sentada en la barra; a la derecha, Matt y Mike se inclinan hacia ellos.
picture.t_camera_chris_01_clr_up=Un selfie en una cabina del teleférico: Josh, con gorro, hace el signo de la V entre Hannah, con gafas, y Beth, con una chaqueta rosa.
picture.t_camera_ashley_01_clr_up=Matt rodea con el brazo a Ashley, que lleva un gorro de rayas y sostiene un móvil; ambos sonríen.
picture.t_camera_hannah_01_clr_up=Un dormitorio, con las letras H y W en la pared: Jessica y Emily están sentadas junto a la cama con vasos rojos, Ashley está de pie con un gorro, y Hannah, con gafas, habla por teléfono.
picture.t_camera_mike_01_clr_up=Una broma: Emily, con una amplia sonrisa, pinta en la cara de Chris, dormido en un sofá con la cara ya garabateada, mientras Jessica sonríe de oreja a oreja detrás de él.
look.i_psychsession_1_interaction=Un maizal en un día soleado: un granero rojo a la izquierda y, a la derecha, un espantapájaros con sombrero de paja, una amplia sonrisa, un pañuelo rojo al cuello y un garfio en lugar de una mano. En el maíz oscuro, abajo a la izquierda, dos pequeños ojos amarillos.
look.i_sams_sketchbook.1=Retratos a lápiz. A la izquierda: Sam, con el pelo recogido sin apretar, una bufanda al cuello, mirando a un lado. A la derecha: Jessica, sonriente, con una larga trenza sobre el hombro y una parka con capucha de piel.
look.i_sams_sketchbook.2=Retratos a lápiz. A la izquierda: Mike, con el pelo peinado hacia arriba, barba de varios días, mirando a un lado, con camisa de cuadros y chaqueta con capucha. A la derecha: Josh, con un gorro de punto, una leve sonrisa, mirando de frente.
look.i_sams_sketchbook.3=Retratos a lápiz. A la izquierda: Emily, pelo oscuro y liso con raya en medio, los labios fruncidos, con un jersey de cuello alto y un cuello de piel. A la derecha: Chris, pelo de punta y gafas rectangulares, con una chaqueta acolchada, la boca abierta como si estuviera hablando.
look.i_sams_sketchbook.4=Retratos a lápiz. A la izquierda: Ashley, con un gorro de canalé, pelo largo y liso, sonriendo con dulzura. A la derecha: Matt, pelo corto y rizado, sonriente, con un jersey de cuello alto.
look.i_map=Un mapa de la montaña, con los lugares rotulados LODGE, SANATORIUM y CABLE CAR. Unos senderos rojos de puntos van del teleférico al refugio y suben hasta el manicomio, y por RANGER PATH hasta una torre con un símbolo de radio; abajo, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Letras rojas pintarrajeadas en las paredes, una y otra vez: DIE.
look.i_security_monitor=En la pantalla, un baño a oscuras con una gran bañera da paso a la vista de una cámara de seguridad desde arriba: un edificio de madera cubierto de nieve, una lámpara encendida sobre un banco en su largo porche y abetos entre la niebla al fondo. Abajo, en la nieve, entre las sombras de ramas desnudas, hay una figura oscura. Interferencias, y la figura ha desaparecido.
look.i_family_portrait=Un retrato pintado en un pesado marco tallado, con una placa debajo: THE WASHINGTON FAMILY. A la izquierda, Hannah, con gafas y un colgante de corazón, y Beth, con flequillo; la mano de Hannah descansa en el hombro de una mujer sonriente delante, de pelo corto y oscuro. Detrás, un hombre con bigote rodea con el brazo a Josh, que sonríe a la derecha con un jersey oscuro sobre un cuello blanco.
look.i_car_lookat=Dentro del coche, los asientos están llenos de cosas: dos bolsas de compras rosas de papel, una bolsa de viaje estampada, frascos de esmalte de uñas y de loción, revistas y un plátano.
look.i_hotel_poster=Un cartel desvaído: un gran hotel de madera con largas galerías y hastiales empinados bajo un pico escarpado y un cielo estrellado.
look.i_wanted_poster_lookat_new=La parte superior del cartel está arrancada, y con ella la cara de la foto; sobre WANTED solo queda un trozo oscuro de la imagen.
look.i_missing_axe=En la pared de troncos cuelga una larga caja de madera para un hacha, vacía salvo por los dos soportes que la sujetaban.
look.i_prom_night_photo=Una foto bajo árboles verdes. Desde la izquierda: Hannah, con gafas, una pequeña mariposa negra tatuada en la parte alta del brazo; Sam, rubia, con un vestido de flores, tiende una mano hacia la cámara; Mike, de esmoquin y pajarita, rodea con el brazo a Emily, que sonríe a la derecha con un vestido azul.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Una foto desvaída en una playa, con el mar y un cabo detrás. Josh, en el centro, rodea con los brazos a Hannah, a la izquierda, con gafas y una pequeña mariposa tatuada en la parte alta del brazo, y a Beth, a la derecha, con flequillo.
look.i_minemap=Un viejo plano de las galerías de la mina. En su recuadro: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Sellos rojos, AREAS AT RISK DANGER y DANGER una y otra vez, marcan zonas sombreadas de rojo, con notas a mano en rojo: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). En la esquina: BLACKWOOD MINES.
look.i_cigarstub=Una colilla de puro apagada, la punta reducida a ceniza. Su anilla color crema dice CLASSIC a ambos lados de un escudo rojo oscuro con un tocado de plumas.
look.i_mysticalsymbols=Pintarrajeado en rojo oscuro sobre los tablones: una cara como de calavera, con los dientes al descubierto, bajo una ancha cornamenta ramificada, la pintura chorreando. Al lado cuelga un cráneo de ciervo con plumas.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Bajo la invitación, una foto en blanco y negro de Mike con esmoquin y pajarita. Alrededor, en el tablero de corcho, dentro de un marco oscuro y recargado: fotos de Sam, de Emily, Hannah y Beth juntas, de un perro y de gatos, del Tower Bridge y de paisajes; escarapelas con caballos que dicen 1ST y SPECIAL; dos entradas para un concierto de HARRY VOGUE; una cara garabateada firmada JOSH; y notas: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Una vieja casa de muñecas de madera de dos plantas sobre una cómoda: tejado gris de tablillas con una ventana redonda en el frontón, ventanas con contraventanas y un porche a lo largo de la fachada. En una ventana de arriba, una muñeca desnuda y pálida de pelo rubio; por una ventana de abajo se ven vagamente más muñecas, y en el porche hay una cabeza de muñeca. Al lado, en una maleta abierta, una muñeca morena con vestido magenta y un libro oscuro con una cruz; delante, tres cubos de juguete apilados, cada uno con un 6.
look.i_snowybench=Bajo la nieve barrida, hay un corazón tallado en los tablones, con letras rayadas dentro.
look.i_headlessdoll=Un muñeco bebé desnudo y sin cabeza, de plástico mugriento, manchado y agrietado, con un agujero oscuro en el cuello y unas diminutas uñas pintadas de rojo. En la espalda, una pegatina con tres mariposas y el nombre Hannah en letra con florituras; en el pecho, una zona redonda de pequeños agujeros.
look.i_readnote=Las letras rojas han chorreado. Al dorso, un membrete impreso, NORTHERN PROVINCES PENITENTIARY, junto a un sello redondo con una balanza; el rojo se transparenta al revés.
look.i_controls_lookat=Un pupitre de control de metal gris, gastado y rayado: al fondo, esferas marcadas A, V y Hz; hileras de pilotos amarillos, verdes y blancos, interruptores giratorios, pulsadores redondos y un teclado; a la derecha, una placa azul con una ranura para palanca marcada STOP, NEUTRAL, RUN, y en el centro un interruptor rojo con ranura para llave. Encima, letras rojas pintarrajeadas una y otra vez: DIE.
