; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Five friends laughing at a wooden bar: Chris, in glasses, holds a can; Josh laughs on a bar stool with a bottle; Sam, in a red patterned sweater, sits on the counter; Matt and Mike lean in on the right.
picture.t_camera_chris_01_clr_up=A selfie in a cable car: Josh, in a beanie, makes a V sign between Hannah, in glasses, and Beth, in a pink jacket.
picture.t_camera_ashley_01_clr_up=Matt with his arm around Ashley, who wears a striped beanie and holds a phone; both smile.
picture.t_camera_hannah_01_clr_up=A bedroom, the letters H and W on the wall: Jessica and Emily sit by the bed with red cups, Ashley stands in a beanie, and Hannah, in glasses, talks on the phone.
picture.t_camera_mike_01_clr_up=A prank: Emily, grinning, draws on the face of Chris, asleep on a sofa with his face already doodled on, while Jessica grins behind him.
look.i_psychsession_1_interaction=A cornfield on a sunny day: a red barn on the left, and on the right a scarecrow in a straw hat with a grinning face, a red neckerchief and a hook for one hand. In the dark corn at the bottom left, two small yellow eyes.
look.i_sams_sketchbook.1=Pencil portraits. Left: Sam, hair loosely tied back, a scarf at her neck, looking aside. Right: Jessica, smiling, a long braid over her shoulder, in a fur-hooded parka.
look.i_sams_sketchbook.2=Pencil portraits. Left: Mike, hair swept up, stubbled, looking aside, in a plaid shirt and a hooded jacket. Right: Josh, in a knitted beanie, a faint smile, looking straight out.
look.i_sams_sketchbook.3=Pencil portraits. Left: Emily, straight dark hair parted in the middle, lips pursed, in a turtleneck and a fur collar. Right: Chris, spiky hair and rectangular glasses, in a quilted jacket, mouth open as if mid-word.
look.i_sams_sketchbook.4=Pencil portraits. Left: Ashley, in a ribbed beanie, long straight hair, smiling gently. Right: Matt, short curly hair, smiling, in a turtleneck sweater.
look.i_map=A map of the mountain, its places labelled LODGE, SANATORIUM and CABLE CAR. Red dotted trails lead from the cable car to the lodge and on up to the sanatorium, and along RANGER PATH to a tower with a radio sign; at the bottom, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Red letters daubed over the walls, again and again: DIE.
look.i_security_monitor=On the screen, a dark bathroom with a big tub gives way to a security camera's view from above: a wooden building under snow, a lamp lit over a bench on its long porch, pines in the fog behind. In the snow below, among the shadows of bare branches, stands a dark figure. Static, and the figure is gone.
look.i_family_portrait=A painted portrait in a heavy carved frame, a plate beneath it: THE WASHINGTON FAMILY. On the left Hannah, in glasses and a heart pendant, and Beth, with a fringe; Hannah's hand rests on the shoulder of a smiling woman in front, with short dark hair. Behind, a man with a moustache has his arm around Josh, who smiles on the right in a dark sweater over a white collar.
look.i_car_lookat=Inside the car the seats are heaped with things: two pink paper shopping bags, a patterned travel bag, bottles of nail polish and lotion, magazines and a banana.
look.i_hotel_poster=A faded poster: a big wooden hotel with long verandas and steep gables under a jagged peak and a starry sky.
look.i_prom_night_photo=In the photo, Hannah has a small black butterfly tattooed on her upper arm.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=In the photo, Hannah has a small butterfly tattooed on her upper arm.
look.i_mysticalsymbols=Daubed on the planks in dark red: a skull-like face with bared teeth under wide branching antlers, the paint run into drips. Beside it hangs a deer's skull with feathers.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Under the invitation, a black-and-white photo of Mike in a tuxedo and bow tie. Around it on the cork board, in an ornate dark frame: photos of Sam, of Emily, Hannah and Beth together, of a dog and cats, Tower Bridge and landscapes; rosettes with horses, marked 1ST and SPECIAL; two HARRY VOGUE concert tickets; a doodled face signed JOSH; and notes: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=An old two-storey wooden dollhouse on a chest of drawers: a grey shingle roof with a round window in the gable, shuttered windows, a porch along the front. In an upstairs window, a pale naked doll with blond hair; more dolls show dimly through a window below, and a doll's head lies on the porch. Beside it, in an open suitcase, a dark-haired doll in a magenta dress and a dark book with a cross; in front, three stacked toy blocks, each showing 6.
look.i_snowybench=Under the swept snow, a heart is carved into the planks, letters scratched inside it.
look.i_headlessdoll=A naked baby doll with no head, its plastic grimy, stained and cracked, a dark hole at the neck, tiny nails painted red. On its back, a sticker with three butterflies and the name Hannah in curly script; on its chest, a round patch of small holes.
look.i_controls_lookat=A grey metal control desk, worn and scratched: dials marked A, V and Hz along the back, rows of yellow, green and white lamps, rotary switches, round push buttons and a keypad; on the right, a blue plate with a lever slot marked STOP, NEUTRAL, RUN, and in the middle a red switch with a key slot. Red letters daubed across it again and again: DIE.
look.a_telescope=Through the telescope, at night: a snowy slope of rocks and pines, a tall pale tree trunk curving up through the middle. Down to the left, on a snowy path beside a big rock, Emily and Mike stand close together, face to face: his hand at her cheek, her hands at his waist. Far to the right, through bare branches, someone sits alone on a bench under a lit shelter.
look.i_telescope.act2_2=Through the telescope, at night: snowy boulders, and behind them the corner of a log cabin under a roof hung with icicles; a lamp shines under the eaves above a caged fan. No one is in sight.
look.i_telescope.act2_3=Through the telescope, at night: a snowy clearing among trees, where a wooden plank swing hangs on two long ropes. Behind it, snowy rock ledges and bare bushes; to the left, ferns and an ivy-covered tree trunk.
look.i_death_whistle=A carved whistle shaped like a skull with wide branching antlers. Turned round, it shows its face: two deep eye sockets and a round open mouth, ringed with white paint, and a chain of white loops painted down its brow.
look.i_smashed_vase=Shards of a dark red vase lie scattered on the floor; Ashley holds up one of them, its broken edges rough and pale.
look.i_sams_bracelet=A braided cord bracelet, blue with a pattern of yellow, red and violet diamonds, closed with a pinkish metal clasp.
look.i_picture_lookat=A painting in a dark, cracked frame: a two-storey wooden house at night under a stormy sky, all in dark blues and greys, with a round window high in its gable, shuttered windows upstairs and a long porch with railings below.
look.i_dollhouse_complete=Through the dollhouse's windows, dolls inside; then, up close, four naked dolls huddled together, the same doll face on each: a red-haired one, a dark-haired one, a blonde with bunches, and a brown-skinned one holding a little video camera, like Ashley, Emily, Jessica and Matt. Their eyes are black holes, with dark red streaks running down their cheeks.
look.i_dollhouse_complete.open=The dollhouse's front swings open and its roof lifts: two floors of tiny rooms staged with naked dolls, all with the same doll face, but with the friends' hair. Upstairs, by a table with bottles and a glass, a dark-haired doll lies slumped on a sofa beside a blond one in glasses, like Josh and Chris. Downstairs, four dolls kneel on a red rug facing a bed: a brown-skinned one filming with a little video camera, a blonde with bunches, a dark-haired one and a red-haired one, like Matt, Jessica, Emily and Ashley; another doll stands apart.
look.i_doll_house_lookat_keyhole=High in the dollhouse's gable, the little round window has been swung aside like a lid: behind it, a round brass plate with a keyhole, rimmed in red.
look.i_doll_house_key=A small old iron key with a heart-shaped bow and a spirally grooved shank. It hung on a little brass hook, hidden behind the painting.
look.i_wine_rack=A tall wooden wine rack behind a diamond lattice of iron strips; its upper boards are smashed in and splintered, with dark holes torn through them.
look.i_wine_cellar_door.act5_3=A plank door braced with iron straps; on its rusty lock plate there is no handle, only a small square hole.
look.i_doll_head=Turned to face her, the bald doll's head: black empty eye holes ringed with painted lashes, rosy cheeks, red lips, the paint cracked and flaking, and a dark crack running from one eye down past the mouth.
look.i_doll_head.roaches=Cockroaches swarm out of the doll's head.
look.i_sams_sack=Under the sack is Sam, in a bath towel, sitting motionless in an old wooden swivel chair.
look.crossedout=One photo is crossed out: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Rusty chain-link stretched between two timber posts, Emily's hand gripping the right one; through it, below, in dim bluish light, a rubble-strewn tunnel floor with a dark beam lying across it.
look.i_torn_miner_clothes=On the stones lies an old miner's helmet: a dark metal dome with raised ribs, a wide rusted brim, and on its front a small brass lamp with a round reflector.
look.i_broken_ladder=A broken ladder lies across the rubble: a long wooden rail with three rusty iron rungs sticking out of it, their far ends snapped off, splintered scraps of wood still on two of them.
look.i_sign=A broken-off piece of a weathered wooden sign lies in the dust, its edges jagged and splintered; on it, in faded red stencilled capitals, the end of one word, GER, and under it EDGE.
look.i_peer_at_head=Through dark wire mesh, between rough planks: beyond them, on a stony floor, a barrel with a tarpaulin over its top, and further back a wooden railing and heaps of rubble.
look.i_peer_at_wheel=Through rusty wire mesh between two posts: a cave beyond, and in it a big old wooden waterwheel among broken scaffolding; at its foot a burst of fire flares out of the dark and dies away.
look.i_scarecrow_lookat=A scarecrow, its arms bare branches ending in twigs, its body a black plastic bag smeared with blood. Its head is wrapped in pale cloth tied at the neck with rope; a rotting face shows through it, a hollow nose and an open mouth of decayed teeth, blood soaked down one side. Long black hair hangs from under a battered brown hat.
look.i_scarecrow_lookat.clown=A scarecrow, its arms bare branches ending in twigs, its body a black plastic bag smeared with blood. Its head is a clown mask: a white, wrinkled face, purple brows painted in high arches up the forehead, dark eye holes ringed with purple, a red nose and a wide grin of long sharp teeth, red at the corners, the chin dark with blood.
look.i_scarecrow_lookat.zombie=A scarecrow, its arms bare branches ending in twigs, its body a black plastic bag smeared with blood. Its head is a rotting zombie's head: bald, grey-green mottled skin, blank white eyes and a gaping mouth of teeth.
look.i_dead_crow_lookat=Two dead crows lie in bloodstained snow, torn open and bloodied, wings splayed, their insides spilling out; loose black feathers are scattered around them.
look.i_chair_and_blood=On the concrete floor a wooden stool lies tipped over, its legs broken; beside it, an open iron shackle on a chain. Blood is spattered and dripped across the floor, and a lantern lies on its side, still lit.
look.i_fake_torso=The upper half of a body in a grey plaid shirt hangs with its arms stretched up above it; below the waist there is nothing but a ragged, bloody cut. Behind it stands a board with a hole cut in it.
look.i_saw_blades=A huge circular saw blade lies flat, its rusted steel smeared with dark blood; behind it, a chain-link fence.
look.i_dead_wolf_inspect=A dead wolf hangs on the bars of a cell door: its chest and belly are ripped wide open and empty, its head droops with the jaws gaping, and beneath it its entrails lie in a pool of blood.
look.i_damaged_doors=A heavy steel cell door with dented panels: a large dark smear of blood runs down it, blood has dripped from under the small hatch at the top, and sets of deep claw marks are gouged into the metal.
look.i_sanlookat=A chain-link fence: a dark post on the left, a rusty bar running across it. Through the mesh, in the snow beyond, a short flight of concrete steps with a metal handrail.
look.i_oilflask=Held up close, a tall rusty red metal can. A faded oval emblem on its side reads North West around the letters NWM, with Mining below; on its narrow side, a red diamond sign reads FLAMMABLE LIQUID.
look.i_oilflask.roaches=Cockroaches crawl out over the can, and she flings it away.
look.i_admin_area_jacksdoor_lookat_reader=A black card reader on the wall beside a wooden door, its small red panel reading LOCKED; on the door, under a little window, a rusty green sign: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=The pulled-out morgue tray holds a rotting corpse on its back: a grey, shrunken face with a gaping mouth, dark hair stuck around it; its grey shirt and the rusty tray are stained with old blood.
look.i_jackslair_exit_lock_lookat=A diamond-mesh iron gate is locked shut: a big, rusty padlock hangs on the hasp by the wooden door frame.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Two MISSING posters, HANNAH WASHINGTON and BETH WASHINGTON; Hannah's reads: She has glasses, and has a tattoo of a butterfly on her right shoulder. A yellow note: NEVER FORGET. Clippings: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. In a photo of four girls, Hannah is circled in red.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_snowwipe_tractor_revisit=Behind the dirty, speckled glass of the old truck's cab is a white hockey mask painted as a skull: slanted eye holes, a skull's nose and a wide grin of long teeth, two dark slashes above one eye, a chip broken out of its top.
look.i_joshsbaseball=An old, dirty baseball, its leather scuffed and stained brown, the stitching faded red; on it, handwritten in black: Josh.
look.i_loveheart=A heart is carved into the pale bark of a tree trunk, and inside it, M+E.
look.i_rifle_lookat=In a wooden booth, a rifle lies on the plank counter. Out in the snow beyond, old barrels stand with bottles on top, and sacks hang on ropes from the branches, one marked with an X.
look.i_look_at_picture==look.i_picture_lookat
look.i_wine_cellar_door.act2_4=A plank door braced with iron straps; on its rusty lock plate, a round doorknob.
look.i_rush_of_blood_snowglobe=A snow globe on a base painted with red and blue zigzags. Inside the glass, over a snowy mound, the wooden track of a roller coaster twists in loops on spindly stilts, with small cars on it; red balloons marked with white stars and red arrow signs dotted with lights rise among the loops.
look.i_chess_piece=Picked up from a chessboard, a small figurine of a man, about a finger long: he stands with his arms at his sides, in a T-shirt and trousers, and his face is blank, without features.
look.i_fallen_beams=On the floor lies a panel of welded iron grid in a rusty frame, a few of its bars snapped, two big lumps of rock on top of it; a heavy chain hangs from a ring at its corner.
look.i_lookatmineexit=Close up, a door of weathered planks with a big jagged hole broken through it; through the hole there is only pale grey mist.
look.i_matts_shoe=A big winter boot, picked up from the ground: a dark blue leather upper laced through loops, a felt lining showing at the top, and a dark rubber foot with white stripes, smeared with mud.
look.i_ashleys_purse=Chris holds up a small dark knitted purse; pale letters are knitted into its front: ASH.
look.i_investigate_blood_kitchen=Blood is sprayed across a pale wall above a wooden counter: one big dark splash and a spray of spatters around it, with drips running down to the counter.
look.i_hospital_the_chair=Looking down on an old wooden chair among lumps of rubble: leather straps with buckles on its arms, its high back and its legs, and dark blood soaked into the seat.
look.i_morgue_security_gate_lookat=A black card reader on a pale green tiled wall beside a dark wooden door frame, its small red panel reading LOCKED; next to it, a weathered green sign: CHAPEL SECURITY PASS REQUIRED.
look.i_jackslair_look_into_church=Through a gap between boards: a big, dim hall, hazy with dust, a railing high along its far wall; down on the floor to the left, a lamp burns among a few pieces of furniture and junk.
look.i_warningsign=A broken-off piece of a weathered wooden sign lies in the snow, its edges jagged; on it, in faded red stencilled capitals, the start of one word, DAN, and under it CLIFF.
look.i_sams_sock=Sam holds up a single grey ribbed sock beside an empty armchair with a carved wooden frame; a candle burns on the floor.
look.i_cooling_equipment=A dark metal cooling unit with a round pressure gauge; in front of it, a red valve with a second gauge and a red handwheel, and ribbed black hoses curling down to the floor in a white haze.
look.i_boilerroom_lookat=Through a broken window frame with bars: a big, dim room beyond, hazy with dust, chain-link fencing and metal posts at the back, rubble strewn over the floor.
look.i_jackslair_storagechest=Mike holds up a long bone from the chest, bloody at its knobbed end, with scraps of flesh on it.
