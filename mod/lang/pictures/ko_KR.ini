picture.t_camera_sam_01_clr_up=나무 바에서 웃고 있는 다섯 친구: 안경 쓴 크리스가 캔을 들고 있고, 조쉬는 병을 든 채 바 의자에 앉아 웃고, 빨간 무늬 스웨터를 입은 샘은 카운터에 앉아 있다. 오른쪽에서는 매트와 마이크가 안쪽으로 몸을 기울이고 있다.
picture.t_camera_chris_01_clr_up=케이블카 안에서 찍은 셀카: 비니를 쓴 조쉬가 안경 쓴 해나와 분홍색 재킷을 입은 베스 사이에서 V 사인을 하고 있다.
picture.t_camera_ashley_01_clr_up=매트가 애슐리의 어깨에 팔을 두르고 있다. 애슐리는 줄무늬 비니를 쓰고 휴대폰을 들고 있다. 둘 다 웃고 있다.
picture.t_camera_hannah_01_clr_up=침실, 벽에는 H와 W 글자: 제시카와 에밀리가 빨간 컵을 들고 침대 옆에 앉아 있고, 애슐리는 비니를 쓰고 서 있으며, 안경 쓴 해나는 전화 통화를 하고 있다.
picture.t_camera_mike_01_clr_up=장난: 히죽 웃는 에밀리가 소파에서 잠든 크리스의 얼굴에 낙서를 하고 있다. 크리스의 얼굴엔 이미 낙서가 되어 있고, 그 뒤에서 제시카가 히죽 웃는다.
look.i_psychsession_1_interaction=화창한 날의 옥수수밭: 왼쪽에 빨간 헛간, 오른쪽에는 밀짚모자를 쓴 허수아비. 허수아비는 히죽 웃는 얼굴에 빨간 스카프를 목에 두르고, 한 손은 갈고리다. 왼쪽 아래 어두운 옥수수 사이로 작고 노란 눈 두 개.
look.i_sams_sketchbook.1=연필 초상화. 왼쪽: 샘. 머리를 느슨하게 뒤로 묶고, 목에 스카프를 두른 채 옆을 보고 있다. 오른쪽: 제시카. 미소를 띠고, 긴 땋은 머리를 어깨 위로 늘어뜨리고, 털 달린 후드 파카를 입고 있다.
look.i_sams_sketchbook.2=연필 초상화. 왼쪽: 마이크. 머리를 위로 넘기고, 수염이 까칠하게 자란 채 옆을 보고 있다. 체크무늬 셔츠에 후드 재킷 차림. 오른쪽: 조쉬. 니트 비니를 쓰고, 옅은 미소를 띤 채 정면을 바라본다.
look.i_sams_sketchbook.3=연필 초상화. 왼쪽: 에밀리. 가운데 가르마를 탄 곧고 짙은 머리, 오므린 입술, 터틀넥에 털 칼라. 오른쪽: 크리스. 삐죽삐죽한 머리에 사각 안경, 퀼팅 재킷 차림, 말을 하다 만 듯 입을 벌리고 있다.
look.i_sams_sketchbook.4=연필 초상화. 왼쪽: 애슐리. 골지 비니를 쓰고, 길고 곧은 머리에, 부드럽게 미소 짓고 있다. 오른쪽: 매트. 짧은 곱슬머리에 미소를 띠고, 터틀넥 스웨터를 입고 있다.
look.i_map=산 지도. 장소마다 LODGE, SANATORIUM, CABLE CAR라고 적혀 있다. 빨간 점선 길이 케이블카에서 산장으로, 다시 위쪽 요양소로 이어지고, RANGER PATH를 따라 무전 표시가 있는 탑으로도 이어진다. 아래쪽에는 TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=벽마다 빨간 글씨로 거듭 휘갈겨 쓰여 있다: DIE.
look.i_security_monitor=화면 속 큰 욕조가 있는 어두운 욕실이 위에서 내려다본 감시 카메라 화면으로 바뀐다: 눈 덮인 목조 건물, 긴 현관의 벤치 위로 켜진 등불, 뒤로는 안개 속 침엽수들. 아래 눈밭, 앙상한 가지 그림자 사이에 검은 형체가 서 있다. 화면이 지직거리더니 형체가 사라진다.
look.i_family_portrait=묵직한 조각 액자에 담긴 초상화로, 아래에 명판이 있다: THE WASHINGTON FAMILY. 왼쪽에는 안경을 쓰고 하트 펜던트를 단 해나와 앞머리가 있는 베스. 해나의 손은 앞쪽에서 미소 짓는 짧은 검은 머리 여성의 어깨에 얹혀 있다. 뒤쪽에서는 콧수염 난 남자가 조쉬의 어깨에 팔을 두르고 있고, 조쉬는 오른쪽에서 흰 칼라 위에 어두운 스웨터를 입고 웃고 있다.
look.i_car_lookat=차 안의 좌석에는 물건이 잔뜩 쌓여 있다. 분홍색 종이 쇼핑백 두 개, 무늬가 있는 여행 가방, 매니큐어와 로션 병, 잡지, 그리고 바나나.
look.i_hotel_poster=빛바랜 포스터. 들쭉날쭉한 봉우리와 별이 뜬 하늘 아래, 긴 베란다와 가파른 박공지붕을 단 커다란 목조 호텔이 있다.
look.i_wanted_poster_lookat_new=포스터 윗부분이 찢겨 나가면서 사진 속 얼굴도 함께 사라졌다. WANTED 위에는 사진의 어두운 조각만 남아 있다.
look.i_missing_axe=통나무 벽에 도끼를 넣어 두는 긴 나무 상자가 걸려 있다. 비어 있고, 도끼를 붙잡던 고정쇠 두 개만 남아 있다.
look.i_prom_night_photo=초록 나무 아래에서 찍은 사진. 왼쪽부터: 안경을 쓴 해나, 위팔에 작은 검은 나비 문신이 있다. 금발의 샘은 꽃무늬 드레스 차림으로 카메라를 향해 손을 뻗고 있다. 턱시도에 나비넥타이를 맨 마이크가 오른쪽에서 파란 드레스를 입고 웃는 에밀리를 팔로 감싸고 있다.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=바닷가에서 찍은 빛바랜 사진으로, 뒤로 바다와 곶이 보인다. 가운데의 조쉬가 왼쪽에 안경을 쓰고 위팔에 작은 나비 문신이 있는 해나와, 오른쪽에 앞머리를 내린 베스를 팔로 감싸고 있다.
look.i_minemap=광산 갱도를 그린 오래된 측량도. 표제란에는 Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. 빨간 도장 AREAS AT RISK DANGER와 거듭 찍힌 DANGER가 빨갛게 칠한 구역을 표시하고, 옆에 빨간 손글씨 메모가 있다: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). 구석에는 BLACKWOOD MINES.
look.i_cigarstub=비벼 끈 시가 꽁초로, 끝이 재가 되어 있다. 크림색 띠에는 깃털 머리장식이 그려진 검붉은 방패 양옆에 CLASSIC이라고 적혀 있다.
look.i_mysticalsymbols=판자에 검붉은 색으로 칠해져 있다. 넓게 갈라진 뿔 아래에 이를 드러낸 해골 같은 얼굴이 있고, 물감이 흘러내려 있다. 옆에는 깃털을 단 사슴 두개골이 걸려 있다.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=초대장 아래에는 턱시도에 나비넥타이를 맨 마이크의 흑백 사진이 있다. 그 둘레의 코르크 게시판(장식이 화려한 어두운 액자 안)에는 샘의 사진, 에밀리와 해나와 베스가 함께 찍은 사진, 개와 고양이들, 타워 브리지와 풍경 사진, 말이 그려진 1ST와 SPECIAL 로제트, HARRY VOGUE 콘서트 티켓 두 장, JOSH라고 서명된 낙서 얼굴, 그리고 메모들: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=서랍장 위에 놓인 낡은 2층 목조 인형의 집. 박공에 둥근 창이 난 회색 너와 지붕, 덧문이 달린 창문들, 정면을 따라 이어진 현관이 있다. 2층 창문에는 금발의 창백한 벌거벗은 인형이 있고, 1층 창문으로는 다른 인형들이 어렴풋이 보이며, 현관에는 인형 머리 하나가 놓여 있다. 옆의 열린 여행 가방 안에는 자홍색 드레스를 입은 검은 머리 인형과 십자가가 그려진 어두운 책이 있고, 앞에는 장난감 블록 세 개가 쌓여 있는데 모두 6이 보인다.
look.i_snowybench=쓸어낸 눈 아래 판자에 하트가 새겨져 있고, 그 안에 글자가 긁혀 있다.
look.i_headlessdoll=머리가 없는 벌거벗은 아기 인형. 플라스틱은 때가 타고 얼룩지고 금이 가 있으며, 목에는 시커먼 구멍이 있고 조그만 손발톱은 빨갛게 칠해져 있다. 등에는 나비 세 마리와 꼬불꼬불한 글씨로 Hannah라고 적힌 스티커가 있고, 가슴에는 작은 구멍들이 동그랗게 모여 있다.
look.i_readnote=빨간 글자가 흘러내려 있다. 뒷면에는 인쇄된 레터헤드 NORTHERN PROVINCES PENITENTIARY와 저울이 그려진 둥근 인장이 있고, 빨간 글씨가 거꾸로 비쳐 보인다.
look.i_controls_lookat=닳고 긁힌 회색 금속 제어반. 뒤쪽에는 A, V, Hz라고 표시된 계기들이 있고, 노랑·초록·흰색 램프 줄, 회전 스위치, 둥근 누름 버튼, 숫자 키패드가 있다. 오른쪽에는 STOP, NEUTRAL, RUN이라고 적힌 레버 홈이 있는 파란 판이, 가운데에는 열쇠 구멍이 있는 빨간 스위치가 있다. 그 위에 빨간 글씨로 몇 번이고 칠해져 있다: DIE.
look.a_telescope=망원경 속은 밤이다. 바위와 소나무가 있는 눈 덮인 비탈, 가운데에 키 큰 하얀 나무줄기가 휘어져 솟아 있다. 왼쪽 아래, 큰 바위 옆 눈 덮인 길에서 에밀리와 마이크가 마주 보고 바짝 붙어 서 있다. 그의 손은 그녀의 뺨에, 그녀의 손은 그의 허리에 있다. 멀리 오른쪽, 앙상한 가지 너머로 불 켜진 쉼터 아래 벤치에 누군가 홀로 앉아 있다.
look.i_telescope.act2_2=망원경 속은 밤이다. 눈 덮인 바위들 뒤로 고드름이 매달린 지붕 아래 통나무 오두막의 모서리가 보인다. 처마 밑에 등이 켜져 있고 그 아래에 철망을 씌운 환풍기가 있다. 아무도 보이지 않는다.
look.i_telescope.act2_3=망원경 속은 밤이다. 나무들 사이의 눈 덮인 빈터에 긴 밧줄 두 가닥으로 나무판 그네가 매달려 있다. 그 뒤로 눈 덮인 바위 턱과 앙상한 덤불이, 왼쪽에는 고사리와 담쟁이로 뒤덮인 나무줄기가 있다.
look.i_death_whistle=넓게 갈라진 뿔이 달린 해골 모양으로 깎은 호루라기. 돌리면 얼굴이 보인다. 흰 물감으로 테두리를 두른 깊은 두 눈구멍과 동그랗게 벌린 입, 이마에는 흰 고리를 이은 사슬 무늬가 그려져 있다.
look.i_view_hannah_poster_part2=사물함 문 안쪽에 얼룩지고 구겨진 포스터가 붙어 있다. 사진 속에는 긴 검은 머리에 검은 테 안경을 쓴 해나가 웃고 있고, 구석에는 둥근 경찰 인장이 찍혀 있다.
look.i_smashed_vase=짙은 붉은색 꽃병 조각들이 바닥에 흩어져 있다. 애슐리가 그중 하나를 들어 올리자, 깨진 가장자리가 거칠고 희끄무레하다.
look.i_sams_bracelet=꼰 끈으로 만든 팔찌. 파란 바탕에 노랑·빨강·보라색 마름모 무늬가 있고, 분홍빛 금속 걸쇠로 채우게 되어 있다.
look.i_picture_lookat=어둡고 금이 간 액자에 든 그림. 폭풍우 치는 하늘 아래 밤의 2층 목조 주택이 온통 짙은 파랑과 회색으로 그려져 있다. 박공 높은 곳에 둥근 창, 위층에는 덧문 달린 창들, 아래에는 난간이 있는 긴 현관이 있다.
look.i_dollhouse_complete=인형의 집 창문 너머로 안에 있는 인형들이 보인다. 이어서 가까이에서, 한데 모여 웅크린 벌거벗은 인형 넷. 빨간 머리, 검은 머리, 양 갈래로 묶은 금발, 그리고 작은 비디오카메라를 든 갈색 피부의 인형이다. 눈은 시커먼 구멍이고, 뺨에는 검붉은 줄이 흘러내린다.
look.i_dollhouse_complete.open=인형의 집 앞면이 활짝 열리고 지붕이 들린다. 안에는 벌거벗은 인형들을 장면처럼 배치한 2층짜리 작은 방들이 있다. 위층에서는 검은 머리 인형과 안경을 쓴 금발 인형이 술병과 잔이 놓인 탁자 옆 소파에 널브러져 있다. 아래층에서는 인형 넷이 빨간 깔개 위에 함께 무릎을 꿇고 있는데, 하나는 작은 비디오카메라를 들고 있고, 또 다른 인형 하나가 따로 떨어져 서 있다.
look.i_doll_house_lookat_keyhole=인형의 집 박공 높은 곳의 작은 둥근 창이 뚜껑처럼 옆으로 돌려져 있다. 그 뒤에는 빨간 테두리를 두른, 열쇠 구멍이 난 둥근 놋쇠판이 있다.
look.i_doll_house_key=작고 낡은 쇠 열쇠. 손잡이는 하트 모양이고, 몸통에는 나선형 홈이 파여 있다. 그림 뒤에 숨겨진 작은 놋쇠 고리에 걸려 있었다.
look.i_wine_rack=쇠띠를 마름모꼴로 엮은 격자 뒤에 있는 키 큰 나무 와인 선반. 위쪽 판자들은 부서져 쪼개졌고, 그 사이로 시커먼 구멍들이 뚫려 있다.
look.i_wine_cellar_door=쇠띠로 보강한 널빤지 문. 녹슨 자물쇠 판에는 손잡이가 없고, 작은 네모난 구멍만 나 있다.
look.i_secret_camera=판지 상자들 사이에 숨겨져 있던 작은 은색 캠코더. 빨간 녹화 표시등이 깜박이고 있다.
look.i_doll_head=이쪽으로 돌려진, 머리카락 없는 인형 머리. 그려 넣은 속눈썹에 둘러싸인 텅 빈 검은 눈구멍, 발그레한 뺨, 빨간 입술. 칠은 갈라져 벗겨지고 있고, 한쪽 눈에서 입 옆을 지나 아래로 검은 금이 나 있다.
look.i_doll_head.roaches=인형 머리에서 바퀴벌레들이 우르르 기어 나온다.
look.i_sams_sack=자루 밑에는 샘이 있다. 목욕 수건 차림으로, 낡은 나무 회전의자에 꼼짝 않고 앉아 있다.
