; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Vijf lachende vrienden aan een houten bar: Chris, met bril, houdt een blikje vast; Josh lacht op een barkruk met een fles; Sam, in een rode trui met een patroon, zit op de bar; Matt en Mike leunen rechts naar de groep toe.
picture.t_camera_chris_01_clr_up=Een selfie in een gondel: Josh, met muts, maakt het V-teken tussen Hannah, met bril, en Beth, in een roze jas.
picture.t_camera_ashley_01_clr_up=Matt met zijn arm om Ashley, die een gestreepte muts draagt en een telefoon vasthoudt; ze glimlachen allebei.
picture.t_camera_hannah_01_clr_up=Een slaapkamer, de letters H en W aan de muur: Jessica en Emily zitten bij het bed met rode bekers, Ashley staat met een muts op, en Hannah, met bril, belt.
picture.t_camera_mike_01_clr_up=Een grap: Emily tekent grijnzend op het gezicht van Chris, die op een bank slaapt, zijn gezicht al vol krabbels, terwijl Jessica achter hem grijnst.
look.i_psychsession_1_interaction=Een maïsveld op een zonnige dag: links een rode schuur en rechts een vogelverschrikker met een strohoed, een grijnzend gezicht, een rode halsdoek en een haak in plaats van één hand. In de donkere maïs linksonder, twee kleine gele ogen.
look.i_sams_sketchbook.1=Potloodportretten. Links: Sam, het haar losjes naar achteren gebonden, een sjaal om haar hals, opzij kijkend. Rechts: Jessica, glimlachend, een lange vlecht over haar schouder, in een parka met een bontcapuchon.
look.i_sams_sketchbook.2=Potloodportretten. Links: Mike, het haar omhooggekamd, een stoppelbaard, opzij kijkend, in een geruit overhemd en een jas met capuchon. Rechts: Josh, met een gebreide muts, een flauwe glimlach, recht vooruit kijkend.
look.i_sams_sketchbook.3=Potloodportretten. Links: Emily, steil donker haar met een middenscheiding, getuite lippen, in een coltrui en met een bontkraag. Rechts: Chris, piekhaar en een rechthoekige bril, in een gewatteerde jas, de mond open alsof hij midden in een woord zit.
look.i_sams_sketchbook.4=Potloodportretten. Links: Ashley, met een geribde muts, lang steil haar, zachtjes glimlachend. Rechts: Matt, kort krullend haar, glimlachend, in een coltrui.
look.i_map=Een kaart van de berg, met de plaatsnamen LODGE, SANATORIUM en CABLE CAR. Rode stippellijnen lopen van de kabelbaan naar het huis en verder omhoog naar het sanatorium, en via RANGER PATH naar een toren met een radiosymbool; onderaan TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Rode letters, steeds weer over de muren gekalkt: DIE.
look.i_security_monitor=Op het scherm maakt een donkere badkamer met een groot bad plaats voor het beeld van een beveiligingscamera van bovenaf: een besneeuwd houten gebouw, een brandende lamp boven een bank op de lange veranda, dennen in de mist erachter. Beneden in de sneeuw, tussen de schaduwen van kale takken, staat een donkere gestalte. Ruis, en de gestalte is verdwenen.
look.i_family_portrait=Een geschilderd portret in een zware, gesneden lijst, met een plaatje eronder: THE WASHINGTON FAMILY. Links Hannah, met bril en een hartvormig hangertje, en Beth, met een pony; Hannahs hand rust op de schouder van een glimlachende vrouw vooraan, met kort donker haar. Achteraan slaat een man met een snor zijn arm om Josh, die rechts glimlacht in een donkere trui over een witte kraag.
look.i_car_lookat=In de auto liggen de stoelen vol spullen: twee roze papieren boodschappentassen, een reistas met motief, flesjes nagellak en lotion, tijdschriften en een banaan.
look.i_hotel_poster=Een verbleekte poster: een groot houten hotel met lange veranda's en steile puntgevels onder een grillige bergtop en een sterrenhemel.
look.i_wanted_poster_lookat_new=De bovenkant van de poster is afgescheurd, en daarmee het gezicht op de foto; boven WANTED is alleen een donker stukje van de foto over.
look.i_missing_axe=Aan de houten wand hangt een lange houten kist voor een bijl, leeg op de twee klemmen na die hem vasthielden.
look.i_prom_night_photo=Een foto onder groene bomen. Van links: Hannah, met bril, een kleine zwarte vlinder op haar bovenarm getatoeëerd; Sam, blond, in een gebloemde jurk, steekt een hand naar de camera uit; Mike, in smoking met vlinderdas, heeft zijn arm om Emily, die rechts lacht in een blauwe jurk.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Een verbleekte foto op een strand, met de zee en een landtong erachter. Josh, in het midden, heeft zijn armen om Hannah, links met bril en een kleine vlinder op haar bovenarm getatoeëerd, en om Beth, rechts, met een pony.
look.i_minemap=Een oud meetplan van de mijngangen. In het kader: Maple Leaf Surveyors; Location: Blackwood Mines 7A-3; Surveyor: Charles Scott (MIRCS); Date: 07/10/1951. Rode stempels, AREAS AT RISK DANGER en telkens weer DANGER, markeren rood gearceerde plekken, met handgeschreven rode notities: Flood Risk, Extreme Rockfall Danger, Collapsed Supports (Rust). In de hoek: BLACKWOOD MINES.
look.i_cigarstub=Een uitgedrukte sigarenpeuk, het puntje tot as verbrand. Op het crèmekleurige bandje staat CLASSIC aan weerszijden van een donkerrood schild met een verentooi.
look.i_mysticalsymbols=In donkerrood op de planken gekladderd: een schedelachtig gezicht met ontblote tanden onder een breed vertakt gewei, de verf in druppels uitgelopen. Ernaast hangt een hertenschedel met veren.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Onder de uitnodiging een zwart-witfoto van Mike in smoking met vlinderdas. Eromheen op het prikbord, in een sierlijke donkere lijst: foto's van Sam, van Emily, Hannah en Beth samen, van een hond en katten, van Tower Bridge en landschappen; rozetten met paarden, met 1ST en SPECIAL; twee concertkaartjes voor HARRY VOGUE; een gekrabbeld gezichtje, ondertekend JOSH; en briefjes: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Een oud houten poppenhuis met twee verdiepingen op een ladekast: een grijs dak van dakspanen met een rond raampje in de puntgevel, ramen met luiken, een veranda langs de voorkant. In een raam boven een bleke naakte pop met blond haar; door een raam beneden zijn vaag meer poppen te zien, en op de veranda ligt een poppenhoofd. Ernaast, in een open koffer, een donkerharige pop in een magenta jurk en een donker boek met een kruis; ervoor drie gestapelde speelblokken, elk met een 6.
look.i_snowybench=Onder de weggeveegde sneeuw is een hart in de planken gekerfd, met letters erin gekrast.
look.i_headlessdoll=Een naakte babypop zonder hoofd, het plastic vuil, vlekkerig en gebarsten, een donker gat bij de hals, piepkleine rood gelakte nagels. Op de rug een sticker met drie vlinders en de naam Hannah in sierlijke letters; op de borst een rond plekje met kleine gaatjes.
look.i_readnote=De rode letters zijn in druppels uitgelopen. Op de achterkant een gedrukt briefhoofd, NORTHERN PROVINCES PENITENTIARY, naast een rond zegel met een weegschaal; het rood schemert in spiegelbeeld door.
look.i_controls_lookat=Een grijze metalen bedieningstafel, versleten en bekrast: achteraan meters met A, V en Hz, rijen gele, groene en witte lampjes, draaischakelaars, ronde drukknoppen en een toetsenblok; rechts een blauwe plaat met een hendelsleuf gemerkt STOP, NEUTRAL, RUN, en in het midden een rode schakelaar met een sleutelgat. Er telkens weer overheen gekladderd in rode letters: DIE.
