; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Vijf lachende vrienden aan een houten bar: Chris, met bril, houdt een blikje vast; Josh lacht op een barkruk met een fles; Sam, in een rode trui met een patroon, zit op de bar; Matt en Mike leunen rechts naar de groep toe.
picture.t_camera_chris_01_clr_up=Een selfie in een gondel: Josh, met muts, maakt het V-teken tussen Hannah, met bril, en Beth, in een roze jas.
picture.t_camera_ashley_01_clr_up=Matt met zijn arm om Ashley, die een gestreepte muts draagt en een telefoon vasthoudt; ze glimlachen allebei.
picture.t_camera_hannah_01_clr_up=Een slaapkamer, de letters H en W aan de muur: Jessica en Emily zitten bij het bed met rode bekers, Ashley staat met een muts op, en Hannah, met bril, belt.
picture.t_camera_mike_01_clr_up=Een grap: Emily tekent grijnzend op het gezicht van Chris, die op een bank slaapt, zijn gezicht al vol krabbels, terwijl Jessica achter hem grijnst.
look.i_psychsession_1_interaction=Een maïsveld op een zonnige dag: links een rode schuur en rechts een vogelverschrikker met een strohoed, een grijnzend gezicht, een rode halsdoek en een haak in plaats van één hand. In de donkere maïs linksonder, twee kleine gele ogen.
look.i_sams_sketchbook.1=Potloodportretten. Links: Sam, het haar losjes naar achteren gebonden, een sjaal om haar hals, opzij kijkend. Rechts: Jessica, glimlachend, een lange vlecht over haar schouder, in een parka met een bontcapuchon.
look.i_sams_sketchbook.2=Potloodportretten. Links: Mike, het haar omhooggekamd, een stoppelbaard, opzij kijkend, in een geruit overhemd en een jas met capuchon. Rechts: Josh, met een gebreide muts, een flauwe glimlach, recht vooruit kijkend.
look.i_sams_sketchbook.3=Potloodportretten. Links: Emily, steil donker haar met een middenscheiding, getuite lippen, in een coltrui en met een bontkraag. Rechts: Chris, piekhaar en een rechthoekige bril, in een gewatteerde jas, de mond open alsof hij midden in een woord zit.
look.i_sams_sketchbook.4=Potloodportretten. Links: Ashley, met een geribde muts, lang steil haar, zachtjes glimlachend. Rechts: Matt, kort krullend haar, glimlachend, in een coltrui.
look.i_map=Een kaart van de berg, met de plaatsnamen LODGE, SANATORIUM en CABLE CAR. Rode stippellijnen lopen van de kabelbaan naar het huis en verder omhoog naar het sanatorium, en via RANGER PATH naar een toren met een radiosymbool; onderaan TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Rode letters, steeds weer over de muren gekalkt: DIE.
look.i_security_monitor=Op het scherm maakt een donkere badkamer met een groot bad plaats voor het beeld van een beveiligingscamera van bovenaf: een besneeuwd houten gebouw, een brandende lamp boven een bank op de lange veranda, dennen in de mist erachter. Beneden in de sneeuw, tussen de schaduwen van kale takken, staat een donkere gestalte. Ruis, en de gestalte is verdwenen.
look.i_family_portrait=Een geschilderd portret in een zware, gesneden lijst, met een plaatje eronder: THE WASHINGTON FAMILY. Links Hannah, met bril en een hartvormig hangertje, en Beth, met een pony; Hannahs hand rust op de schouder van een glimlachende vrouw vooraan, met kort donker haar. Achteraan slaat een man met een snor zijn arm om Josh, die rechts glimlacht in een donkere trui over een witte kraag.
look.i_car_lookat=In de auto liggen de stoelen vol spullen: twee roze papieren boodschappentassen, een reistas met motief, flesjes nagellak en lotion, tijdschriften en een banaan.
look.i_hotel_poster=Een verbleekte poster: een groot houten hotel met lange veranda's en steile puntgevels onder een grillige bergtop en een sterrenhemel.
look.i_prom_night_photo=Op de foto heeft Hannah een kleine zwarte vlinder op haar bovenarm getatoeëerd.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Op de foto heeft Hannah een kleine vlinder op haar bovenarm getatoeëerd.
look.i_mysticalsymbols=In donkerrood op de planken gekladderd: een schedelachtig gezicht met ontblote tanden onder een breed vertakt gewei, de verf in druppels uitgelopen. Ernaast hangt een hertenschedel met veren.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Onder de uitnodiging een zwart-witfoto van Mike in smoking met vlinderdas. Eromheen op het prikbord, in een sierlijke donkere lijst: foto's van Sam, van Emily, Hannah en Beth samen, van een hond en katten, van Tower Bridge en landschappen; rozetten met paarden, met 1ST en SPECIAL; twee concertkaartjes voor HARRY VOGUE; een gekrabbeld gezichtje, ondertekend JOSH; en briefjes: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Een oud houten poppenhuis met twee verdiepingen op een ladekast: een grijs dak van dakspanen met een rond raampje in de puntgevel, ramen met luiken, een veranda langs de voorkant. In een raam boven een bleke naakte pop met blond haar; door een raam beneden zijn vaag meer poppen te zien, en op de veranda ligt een poppenhoofd. Ernaast, in een open koffer, een donkerharige pop in een magenta jurk en een donker boek met een kruis; ervoor drie gestapelde speelblokken, elk met een 6.
look.i_snowybench=Onder de weggeveegde sneeuw is een hart in de planken gekerfd, met letters erin gekrast.
look.i_headlessdoll=Een naakte babypop zonder hoofd, het plastic vuil, vlekkerig en gebarsten, een donker gat bij de hals, piepkleine rood gelakte nagels. Op de rug een sticker met drie vlinders en de naam Hannah in sierlijke letters; op de borst een rond plekje met kleine gaatjes.
look.i_controls_lookat=Een grijze metalen bedieningstafel, versleten en bekrast: achteraan meters met A, V en Hz, rijen gele, groene en witte lampjes, draaischakelaars, ronde drukknoppen en een toetsenblok; rechts een blauwe plaat met een hendelsleuf gemerkt STOP, NEUTRAL, RUN, en in het midden een rode schakelaar met een sleutelgat. Er telkens weer overheen gekladderd in rode letters: DIE.
look.a_telescope=Door de telescoop, 's nachts: een besneeuwde helling met rotsen en dennen, in het midden een hoge, bleke stam die omhoog buigt. Linksonder, op een besneeuwd pad bij een grote rots, staan Emily en Mike dicht tegen elkaar, gezicht naar gezicht: zijn hand bij haar wang, haar handen bij zijn middel. Ver naar rechts, door kale takken, zit iemand alleen op een bank onder een verlicht afdak.
look.i_telescope.act2_2=Door de telescoop, 's nachts: besneeuwde rotsblokken, en daarachter de hoek van een blokhut onder een dak vol ijspegels; onder de dakrand brandt een lamp boven een ventilator achter tralies. Er is niemand te zien.
look.i_telescope.act2_3=Door de telescoop, 's nachts: een besneeuwde open plek tussen de bomen, waar een houten plankschommel aan twee lange touwen hangt. Erachter besneeuwde rotsrichels en kale struiken; links varens en een met klimop begroeide stam.
look.i_death_whistle=Een gesneden fluitje in de vorm van een schedel met een breed, vertakt gewei. Omgedraaid toont het zijn gezicht: twee diepe oogkassen en een ronde open mond, omrand met witte verf, en een ketting van witte lusjes over het voorhoofd geschilderd.
look.i_smashed_vase=Scherven van een donkerrode vaas liggen over de vloer verspreid; Ashley houdt er een omhoog, met ruwe, lichte breukranden.
look.i_sams_bracelet=Een gevlochten koordarmband, blauw met een patroon van gele, rode en paarse ruitjes, met een roze metalen sluiting.
look.i_picture_lookat=Een schilderij in een donkere, gebarsten lijst: een houten huis met twee verdiepingen 's nachts onder een stormachtige hemel, helemaal in donkerblauw en grijs, met een rond raampje hoog in de geveltop, ramen met luiken boven en een lange veranda met reling beneden.
look.i_dollhouse_complete=Door de ramen van het poppenhuis poppen binnen; dan, van dichtbij, vier naakte poppen dicht op elkaar, allemaal met hetzelfde poppengezicht: een roodharige, een donkerharige, een blonde met staartjes en een met een donkere huid die een kleine videocamera vasthoudt, zoals Ashley, Emily, Jessica en Matt. Hun ogen zijn zwarte gaten, met donkerrode strepen over hun wangen.
look.i_dollhouse_complete.open=De voorkant van het poppenhuis zwaait open en het dak gaat omhoog: twee verdiepingen piepkleine kamers waarin naakte poppen zijn neergezet, allemaal met hetzelfde poppengezicht, maar met het haar van de vrienden. Boven, bij een tafel met flessen en een glas, ligt een donkerharige pop onderuitgezakt op een bank naast een blonde met bril, zoals Josh en Chris. Beneden knielen vier poppen op een rood kleed met hun gezicht naar een bed: een met een donkere huid die filmt met een kleine videocamera, een blonde met staartjes, een donkerharige en een roodharige, zoals Matt, Jessica, Emily en Ashley; nog een pop staat apart.
look.i_doll_house_lookat_keyhole=Hoog in de geveltop van het poppenhuis is het ronde raampje als een dekseltje opzij gedraaid: daarachter een rond messing plaatje met een sleutelgat, rood omrand.
look.i_doll_house_key=Een kleine oude ijzeren sleutel met een hartvormige kop en een spiraalvormig gegroefde schacht. Hij hing aan een klein messing haakje, verstopt achter het schilderij.
look.i_wine_rack=Een hoog houten wijnrek achter een ruitvormig traliewerk van ijzeren stroken; de bovenste planken zijn ingeslagen en versplinterd, met donkere gaten erdoorheen.
look.i_wine_cellar_door=Een plankendeur versterkt met ijzeren banden; op het roestige slotplaatje zit geen klink, alleen een klein vierkant gat.
look.i_doll_head=Naar haar toe gedraaid, het kale poppenhoofd: zwarte, lege oogholtes omringd door geschilderde wimpers, roze wangen, rode lippen, de verf gebarsten en afbladderend, en een donkere barst die van één oog langs de mond naar beneden loopt.
look.i_doll_head.roaches=Kakkerlakken krioelen uit het poppenhoofd.
look.i_sams_sack=Onder de zak zit Sam, in een badhanddoek, roerloos op een oude houten draaistoel.
look.crossedout=Eén foto is doorgekrast: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Door een kier tussen houten palen, achter roestig gaas: beneden een stuk mijnkarrails dwars over een gangvloer bezaaid met puin, stutbalken en gebroken planken.
look.i_torn_miner_clothes=Op de stenen ligt een oude mijnwerkershelm: een donkere metalen koepel met uitstekende ribben, helemaal verroest, een brede rand en voorop een kleine koperen lamp met een ronde reflector.
look.i_sign=Een afgebroken stuk van een wit geverfd houten bord ligt op de stenen, de linkerrand versplinterd; erop staat in verbleekte rode sjabloonhoofdletters het eind van een woord, GER, en daaronder EDGE.
look.i_peer_at_head=Door roestig gaas een schutting van ruwe verticale planken; in de kieren ertussen de stenige vloer van een gang erachter, en vlak achter de schutting een donker zeil over een paar vaten.
look.i_peer_at_wheel=Door roestig gaas tussen twee palen: een grot erachter, en daarin een groot oud houten waterrad tussen kapotte steigers; eronder schiet een vuurstraal uit het donker en dooft.
look.i_scarecrow_lookat=Een vogelverschrikker op een paal, de armen kale takken die uitlopen in twijgjes, het lijf een zwarte plastic zak besmeurd met bloed. Het hoofd is in lichte stof gewikkeld, bij de hals dichtgebonden met touw; er schemert een rottend gezicht doorheen, een holle neus en een open mond met rotte tanden, één kant doordrenkt van bloed. Onder een gehavende bruine hoed hangt lang zwart haar.
look.i_scarecrow_lookat.clown=Een vogelverschrikker op een paal, de armen kale takken die uitlopen in twijgjes, het lijf een zwarte plastic zak besmeurd met bloed. Het hoofd is een clownsmasker: een wit gezicht met paars geschilderde wenkbrauwen, een rode ster bij één oog, een rode neus en een brede rode grijns met scherpe tanden, bloed loopt uit de mond.
look.i_scarecrow_lookat.zombie=Een vogelverschrikker op een paal, de armen kale takken die uitlopen in twijgjes, het lijf een zwarte plastic zak besmeurd met bloed. Het hoofd is een rottend zombiehoofd: kaal, grijsgroen gevlekte huid, lege witte ogen en een gapende mond vol tanden.
look.i_dead_crow_lookat=Twee dode kraaien liggen in de met bloed bevlekte sneeuw, opengereten en bebloed, de vleugels gespreid, hun ingewanden puilen eruit; losse zwarte veren liggen om hen heen verspreid.
look.i_chair_and_blood=Op de betonnen vloer ligt een omgevallen houten kruk met gebroken poten; ernaast een open ijzeren boei aan een ketting. Over de vloer is bloed gespat en gedruppeld, en een lantaarn ligt op zijn kant, nog brandend.
look.i_fake_torso=De bovenste helft van een lichaam in een grijs geruit overhemd hangt met de armen omhoog gestrekt; onder de taille is er niets dan een rafelige, bloederige snee. Erachter staat een plank met een uitgezaagd gat.
look.i_saw_blades=Een enorm cirkelzaagblad ligt plat, het roestige staal besmeurd met donker bloed; erachter een gaashek.
look.i_dead_wolf_inspect=Een dode wolf hangt aan de tralies van een celdeur: borst en buik zijn wijd opengereten en leeg, de kop hangt omlaag met opengesperde kaken, en eronder liggen de ingewanden in een plas bloed.
look.i_damaged_doors=Een zware stalen celdeur met gedeukte panelen: een grote donkere bloedveeg loopt erover naar beneden, onder het luikje bovenaan is bloed omlaag gedruppeld, en diepe klauwsporen zijn in het metaal gekerfd.
look.i_sanlookat=Een hoog hek van roestige gaaspanelen aan ijzeren palen, de bovenkant verward met rollen prikkeldraad.
look.i_oilflask=Een roestig rood metalen blik met een handvat en een tuit; aan de ene kant staat op een verbleekt ovaal etiket North West, NWM, Mining, en aan de andere op een ruitvormig bordje FLAMMABLE LIQUID.
look.i_oilflask.roaches=Kakkerlakken stromen uit het blik, en ze smijt het weg.
