; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Vijf lachende vrienden aan een houten bar: Chris, met bril, houdt een blikje vast; Josh lacht op een barkruk met een fles; Sam, in een rode trui met een patroon, zit op de bar; Matt en Mike leunen rechts naar de groep toe.
picture.t_camera_chris_01_clr_up=Een selfie in een gondel: Josh, met muts, maakt het V-teken tussen Hannah, met bril, en Beth, in een roze jas.
picture.t_camera_ashley_01_clr_up=Matt met zijn arm om Ashley, die een gestreepte muts draagt en een telefoon vasthoudt; ze glimlachen allebei.
picture.t_camera_hannah_01_clr_up=Een slaapkamer, de letters H en W aan de muur: Jessica en Emily zitten bij het bed met rode bekers, Ashley staat met een muts op, en Hannah, met bril, belt.
picture.t_camera_mike_01_clr_up=Een grap: Emily tekent grijnzend op het gezicht van Chris, die op een bank slaapt, zijn gezicht al vol krabbels, terwijl Jessica achter hem grijnst.
look.i_psychsession_1_interaction=Een maïsveld op een zonnige dag: links een rode schuur en rechts een vogelverschrikker met een strohoed, een grijnzend gezicht, een rode halsdoek en een haak in plaats van één hand. In de donkere maïs linksonder, twee kleine gele ogen.
look.i_sams_sketchbook.1=Potloodportretten. Links: Sam, het haar losjes naar achteren gebonden, een sjaal om haar hals, opzij kijkend. Rechts: Jessica, glimlachend, een lange vlecht over haar schouder, in een parka met een bontcapuchon.
look.i_sams_sketchbook.2=Potloodportretten. Links: Mike, het haar omhooggekamd, een stoppelbaard, opzij kijkend, in een geruit overhemd en een jas met capuchon. Rechts: Josh, met een gebreide muts, een flauwe glimlach, recht vooruit kijkend.
look.i_sams_sketchbook.3=Potloodportretten. Links: Emily, steil donker haar met een middenscheiding, getuite lippen, in een coltrui en met een bontkraag. Rechts: Chris, piekhaar en een rechthoekige bril, in een gewatteerde jas, de mond open alsof hij midden in een woord zit.
look.i_sams_sketchbook.4=Potloodportretten. Links: Ashley, met een geribde muts, lang steil haar, zachtjes glimlachend. Rechts: Matt, kort krullend haar, glimlachend, in een coltrui.
look.i_map=Een kaart van de berg, met de plaatsnamen LODGE, SANATORIUM en CABLE CAR. Rode stippellijnen lopen van de kabelbaan naar het huis en verder omhoog naar het sanatorium, en via RANGER PATH naar een toren met een radiosymbool; onderaan TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Rode letters, steeds weer over de muren gekalkt: DIE.
look.i_security_monitor=Op het scherm maakt een donkere badkamer met een groot bad plaats voor het beeld van een beveiligingscamera van bovenaf: een besneeuwd houten gebouw, een brandende lamp boven een bank op de lange veranda, dennen in de mist erachter. Beneden in de sneeuw, tussen de schaduwen van kale takken, staat een donkere gestalte. Ruis, en de gestalte is verdwenen.
look.i_family_portrait=Een geschilderd portret in een zware, gesneden lijst, met een plaatje eronder: THE WASHINGTON FAMILY. Links Hannah, met bril en een hartvormig hangertje, en Beth, met een pony; Hannahs hand rust op de schouder van een glimlachende vrouw vooraan, met kort donker haar. Achteraan slaat een man met een snor zijn arm om Josh, die rechts glimlacht in een donkere trui over een witte kraag.
