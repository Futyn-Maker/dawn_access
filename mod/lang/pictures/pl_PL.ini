; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Pięcioro przyjaciół śmieje się przy drewnianym barze: Chris w okularach trzyma puszkę; Josh z butelką śmieje się na stołku barowym; Sam w czerwonym swetrze we wzory siedzi na ladzie; z prawej nachylają się do nich Matt i Mike.
picture.t_camera_chris_01_clr_up=Selfie w wagoniku kolejki linowej: Josh w czapce pokazuje znak „V” między Hannah w okularach a Beth w różowej kurtce.
picture.t_camera_ashley_01_clr_up=Matt obejmuje ramieniem Ashley, która ma na głowie czapkę w paski i trzyma telefon; oboje się uśmiechają.
picture.t_camera_hannah_01_clr_up=Sypialnia, na ścianie litery H i W: Jessica i Emily siedzą przy łóżku z czerwonymi kubkami, Ashley stoi w czapce, a Hannah w okularach rozmawia przez telefon.
picture.t_camera_mike_01_clr_up=Kawał: szczerząca się Emily rysuje po twarzy Chrisa, który śpi na kanapie z już pomazaną twarzą, a za nim szczerzy się Jessica.
look.i_psychsession_1_interaction=Pole kukurydzy w słoneczny dzień: z lewej czerwona stodoła, a z prawej strach na wróble w słomkowym kapeluszu, z wyszczerzoną twarzą, czerwoną chustką na szyi i hakiem zamiast jednej ręki. W ciemnej kukurydzy w lewym dolnym rogu dwoje małych żółtych oczu.
look.i_sams_sketchbook.1=Ołówkowe portrety. Po lewej: Sam, włosy luźno związane z tyłu, szalik na szyi, patrzy w bok. Po prawej: Jessica, uśmiechnięta, długi warkocz przerzucony przez ramię, w parce z futrzanym kapturem.
look.i_sams_sketchbook.2=Ołówkowe portrety. Po lewej: Mike, włosy zaczesane do góry, nieogolony, patrzy w bok, w koszuli w kratę i kurtce z kapturem. Po prawej: Josh, w dzianinowej czapce, z lekkim uśmiechem, patrzy prosto przed siebie.
look.i_sams_sketchbook.3=Ołówkowe portrety. Po lewej: Emily, proste ciemne włosy z przedziałkiem pośrodku, ściągnięte usta, w golfie, z futrzanym kołnierzem. Po prawej: Chris, nastroszone włosy i prostokątne okulary, w pikowanej kurtce, usta otwarte jakby w pół słowa.
look.i_sams_sketchbook.4=Ołówkowe portrety. Po lewej: Ashley, w prążkowanej czapce, długie proste włosy, łagodnie się uśmiecha. Po prawej: Matt, krótkie kręcone włosy, uśmiechnięty, w swetrze z golfem.
look.i_map=Mapa góry z miejscami podpisanymi LODGE, SANATORIUM i CABLE CAR. Czerwone kropkowane szlaki prowadzą od kolejki linowej do schroniska i dalej w górę do sanatorium, a wzdłuż RANGER PATH do wieży ze znakiem radia; na dole TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Czerwone litery wysmarowane na ścianach, raz za razem: DIE.
look.i_security_monitor=Na ekranie ciemną łazienkę z dużą wanną zastępuje widok z kamery monitoringu z góry: drewniany budynek pod śniegiem, na długim ganku nad ławką pali się lampa, w tle świerki we mgle. W dole na śniegu, wśród cieni nagich gałęzi, stoi ciemna postać. Zakłócenia — i postać znika.
look.i_family_portrait=Malowany portret w ciężkiej rzeźbionej ramie, pod nim tabliczka: THE WASHINGTON FAMILY. Po lewej Hannah w okularach, z wisiorkiem w kształcie serca, i Beth z grzywką; dłoń Hannah spoczywa na ramieniu uśmiechniętej kobiety z przodu, o krótkich ciemnych włosach. Z tyłu mężczyzna z wąsami obejmuje ramieniem Josha, który uśmiecha się po prawej, w ciemnym swetrze na białym kołnierzyku.
look.i_car_lookat=W samochodzie na siedzeniach piętrzą się rzeczy: dwie różowe papierowe torby na zakupy, wzorzysta torba podróżna, buteleczki lakieru do paznokci i balsamu, czasopisma i banan.
look.i_hotel_poster=Wyblakły plakat: duży drewniany hotel z długimi werandami i stromymi szczytami pod postrzępionym wierzchołkiem i gwiaździstym niebem.
look.i_prom_night_photo=Na zdjęciu Hannah ma na ramieniu wytatuowanego małego czarnego motyla.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Na zdjęciu Hannah ma na ramieniu wytatuowanego małego motyla.
look.i_mysticalsymbols=Na deskach wymazane ciemnoczerwoną farbą: przypominająca czaszkę twarz z wyszczerzonymi zębami pod szerokim, rozgałęzionym porożem, farba spłynęła zaciekami. Obok wisi czaszka jelenia z piórami.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Pod zaproszeniem czarno-białe zdjęcie Mike'a w smokingu i muszce. Wokół na korkowej tablicy, w ozdobnej ciemnej ramie: zdjęcia Sam, Emily, Hannah i Beth razem, psa i kotów, Tower Bridge i krajobrazów; rozetki z końmi z napisami 1ST i SPECIAL; dwa bilety na koncert HARRY VOGUE; nabazgrana buźka podpisana JOSH; i karteczki: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Stary dwupiętrowy drewniany domek dla lalek na komodzie: szary dach z gontu z okrągłym okienkiem w szczycie, okna z okiennicami, ganek wzdłuż frontu. W oknie na piętrze blada naga lalka o jasnych włosach; przez okno na dole niewyraźnie widać inne lalki, a na ganku leży głowa lalki. Obok, w otwartej walizce, ciemnowłosa lalka w karmazynowej sukience i ciemna książka z krzyżem; z przodu trzy ułożone jedna na drugiej kostki, na każdej 6.
look.i_snowybench=Pod zmiecionym śniegiem w deskach wyryte jest serce, a w nim wydrapane litery.
look.i_headlessdoll=Naga lalka-niemowlę bez głowy, plastik brudny, poplamiony i popękany, ciemna dziura w szyi, maleńkie paznokcie pomalowane na czerwono. Na plecach naklejka z trzema motylami i imieniem Hannah wypisanym ozdobnym pismem; na piersi okrągła plama drobnych dziurek.
look.i_controls_lookat=Szary metalowy pulpit sterowniczy, zużyty i porysowany: z tyłu tarcze oznaczone A, V i Hz, rzędy żółtych, zielonych i białych lampek, przełączniki obrotowe, okrągłe przyciski i klawiatura; z prawej niebieska płytka ze szczeliną na dźwignię i napisami STOP, NEUTRAL, RUN, pośrodku czerwony przełącznik ze szczeliną na kluczyk. Raz po raz wymazane na nim czerwone litery: DIE.
look.a_telescope=Przez teleskop, nocą: zaśnieżone zbocze ze skałami i sosnami, pośrodku wygina się w górę wysoki, jasny pień. Na dole z lewej, na zaśnieżonej ścieżce przy dużej skale, Emily i Mike stoją tuż przy sobie, twarzą w twarz: jego dłoń przy jej policzku, jej dłonie na jego biodrach. Daleko z prawej, za nagimi gałęziami, ktoś siedzi samotnie na ławce pod oświetloną wiatą.
look.i_telescope.act2_2=Przez teleskop, nocą: zaśnieżone głazy, a za nimi narożnik chaty z bali pod dachem obwieszonym soplami; pod okapem świeci lampa nad zakratowanym wentylatorem. Nikogo nie widać.
look.i_telescope.act2_3=Przez teleskop, nocą: zaśnieżona polana wśród drzew, na której na dwóch długich linach wisi huśtawka z deski. Za nią zaśnieżone skalne półki i nagie krzaki; z lewej paprocie i pień obrośnięty bluszczem.
look.i_death_whistle=Rzeźbiony gwizdek w kształcie czaszki z szerokim, rozgałęzionym porożem. Obrócony pokazuje twarz: dwa głębokie oczodoły i okrągłe, otwarte usta, obwiedzione białą farbą, a przez czoło biegnie namalowany łańcuszek białych pętelek.
look.i_smashed_vase=Na podłodze leżą rozrzucone skorupy ciemnoczerwonego wazonu; Ashley podnosi jedną z nich, jej przełamane krawędzie są szorstkie i jasne.
look.i_sams_bracelet=Pleciona bransoletka ze sznurka, niebieska, we wzór z żółtych, czerwonych i fioletowych rombów, zapinana na różowawe metalowe zapięcie.
look.i_picture_lookat=Obraz w ciemnej, popękanej ramie: piętrowy drewniany dom nocą pod burzowym niebem, cały w ciemnych błękitach i szarościach, z okrągłym okienkiem wysoko w szczycie, oknami z okiennicami na piętrze i długim gankiem z balustradą na dole.
look.i_dollhouse_complete=Przez okna domku dla lalek widać w środku lalki; potem z bliska cztery nagie lalki stłoczone razem, wszystkie z tą samą twarzą lalki: ruda, ciemnowłosa, blondynka z kucykami i ciemnoskóra z małą kamerą wideo w rękach – jak Ashley, Emily, Jessica i Matt. Ich oczy to czarne dziury, a po policzkach spływają ciemnoczerwone smugi.
look.i_dollhouse_complete.open=Front domku dla lalek się otwiera, a dach unosi: dwa piętra maleńkich pokoi z ustawionymi w scenkę nagimi lalkami, wszystkie z tą samą twarzą lalki, ale z włosami przyjaciół. Na górze, przy stoliku z butelkami i szklanką, ciemnowłosa lalka leży rozwalona na sofie obok blondyna w okularach – jak Josh i Chris. Na dole cztery lalki klęczą na czerwonym dywanie twarzą do łóżka: ciemnoskóra, która filmuje małą kamerą wideo, blondynka z kucykami, ciemnowłosa i ruda – jak Matt, Jessica, Emily i Ashley; jeszcze jedna lalka stoi z boku.
look.i_doll_house_lookat_keyhole=Wysoko w szczycie domku dla lalek okrągłe okienko odsunięto na bok jak pokrywkę: za nim okrągła mosiężna płytka z dziurką od klucza, w czerwonej obwódce.
look.i_doll_house_key=Mały stary żelazny klucz z uchwytem w kształcie serca i trzonem żłobionym w spiralę. Wisiał na małym mosiężnym haczyku, ukryty za obrazem.
look.i_wine_rack=Wysoki drewniany regał na wino za kratą z żelaznych pasów w romby; jego górne deski są wybite i porozłupywane, ziejąc ciemnymi dziurami.
look.i_wine_cellar_door=Drzwi z desek wzmocnione żelaznymi okuciami; na zardzewiałym szyldzie zamka nie ma klamki, tylko mały kwadratowy otwór.
look.i_doll_head=Obrócona twarzą do niej łysa głowa lalki: puste czarne oczodoły otoczone namalowanymi rzęsami, różowe policzki, czerwone usta, farba popękana i łuszcząca się, a od jednego oka obok ust biegnie w dół ciemna rysa.
look.i_doll_head.roaches=Z głowy lalki wyłażą karaluchy.
look.i_sams_sack=Pod workiem jest Sam, w ręczniku kąpielowym, siedzi bez ruchu na starym drewnianym krześle obrotowym.
look.crossedout=Jedno zdjęcie jest przekreślone: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Przez szparę między drewnianymi słupami, zza zardzewiałej siatki: w dole odcinek torów dla wózków kopalnianych w poprzek chodnika, którego dno zaścielają gruz, stemple i połamane deski.
look.i_torn_miner_clothes=Na kamieniach leży stary górniczy kask: ciemna metalowa kopuła z wypukłymi żebrami, cała zardzewiała, szerokie rondo, a z przodu mała mosiężna lampa z okrągłym reflektorem.
look.i_sign=Na kamieniach leży odłamany kawałek pomalowanej na biało drewnianej tabliczki z rozszczepioną lewą krawędzią; na nim wyblakłymi czerwonymi literami z szablonu koniec jednego słowa, GER, a pod nim EDGE.
look.i_peer_at_head=Przez zardzewiałą siatkę płot z nieheblowanych pionowych desek; w szparach między nimi kamieniste podłoże przejścia za nim, a tuż za płotem ciemna plandeka narzucona na jakieś beczki.
look.i_peer_at_wheel=Przez zardzewiałą siatkę między dwoma słupami: dalej jaskinia, a w niej wielkie stare drewniane koło wodne wśród połamanych rusztowań; pod nim z ciemności bucha strumień ognia i gaśnie.
look.i_scarecrow_lookat=Strach na wróble na palu: ręce z nagich gałęzi zakończonych gałązkami, tułów z czarnego plastikowego worka umazanego krwią. Głowa owinięta jasnym płótnem, przewiązanym na szyi sznurem; prześwituje przez nie gnijąca twarz – zapadnięty nos i otwarte usta z zepsutymi zębami, jedna strona przesiąknięta krwią. Spod sfatygowanego brązowego kapelusza zwisają długie czarne włosy.
look.i_scarecrow_lookat.clown=Strach na wróble na palu: ręce z nagich gałęzi zakończonych gałązkami, tułów z czarnego plastikowego worka umazanego krwią. Zamiast głowy maska klauna: biała twarz z fioletowymi malowanymi brwiami, czerwona gwiazdka przy jednym oku, czerwony nos i szeroki czerwony uśmiech z ostrymi zębami, z ust spływa krew.
look.i_scarecrow_lookat.zombie=Strach na wróble na palu: ręce z nagich gałęzi zakończonych gałązkami, tułów z czarnego plastikowego worka umazanego krwią. Zamiast głowy głowa gnijącego zombie: łysa, szarozielona plamista skóra, puste białe oczy i rozdziawione usta pełne zębów.
look.i_dead_crow_lookat=Na zakrwawionym śniegu leżą dwie martwe wrony, rozszarpane i zakrwawione, z rozpostartymi skrzydłami i wylewającymi się wnętrznościami; wokół rozrzucone są czarne pióra.
look.i_chair_and_blood=Na betonowej podłodze leży przewrócony drewniany taboret ze złamanymi nogami; obok otwarta żelazna obręcz kajdan na łańcuchu. Podłoga jest zachlapana i zakapana krwią, a na boku leży wciąż świecąca latarnia.
look.i_fake_torso=Górna połowa ciała w szarej koszuli w kratę wisi z rękami wyciągniętymi w górę; poniżej pasa jest tylko poszarpane, krwawe cięcie. Za nią stoi deska z wyciętym otworem.
look.i_saw_blades=Płasko leży ogromna tarcza piły, jej zardzewiała stal umazana ciemną krwią; za nią siatkowe ogrodzenie.
look.i_dead_wolf_inspect=Na kratach drzwi celi wisi martwy wilk: klatka piersiowa i brzuch rozdarte na całą szerokość i puste, łeb zwisa z rozwartymi szczękami, a pod nim w kałuży krwi leżą jego wnętrzności.
look.i_damaged_doors=Ciężkie stalowe drzwi celi z powgniatanymi panelami: spływa po nich wielka ciemna smuga krwi, spod małego okienka u góry ściekła krew, a w metalu wyżłobione są głębokie ślady pazurów.
look.i_sanlookat=Wysokie ogrodzenie z zardzewiałych przęseł siatki na żelaznych słupkach, u góry splątane zwoje drutu kolczastego.
look.i_oilflask=Zardzewiały czerwony metalowy kanister z uchwytem i dzióbkiem; z jednej strony na wyblakłej owalnej naklejce napis North West, NWM, Mining, a z drugiej na rombie FLAMMABLE LIQUID.
look.i_oilflask.roaches=Z kanistra wysypują się karaluchy, a ona go odrzuca.
