picture.mi_padlock=@SMG013_64519
; ---- pictures in the world (features/Interactions): the prologue camera's photos, by texture; the things
; in the hand, by their interaction's core name (look.<core>, picture::PlanFor; a book's spreads look.<core>.<n>); "=key" takes another entry's words.
picture.t_camera_sam_01_clr_up=Cinque amici ridono a un bancone di legno: Chris, con gli occhiali, tiene una lattina; Josh ride su uno sgabello da bar con una bottiglia; Sam, con un maglione rosso a motivi, è seduta sul bancone; a destra, Matt e Mike si sporgono verso di loro.
picture.t_camera_chris_01_clr_up=Un selfie in una cabina della funivia: Josh, con il berretto, fa il segno della V tra Hannah, con gli occhiali, e Beth, con una giacca rosa.
picture.t_camera_ashley_01_clr_up=Matt cinge con il braccio Ashley, che porta un berretto a righe e tiene in mano un telefono; entrambi sorridono.
picture.t_camera_hannah_01_clr_up=Una camera da letto, con le lettere H e W sulla parete: Jessica ed Emily sono sedute accanto al letto con bicchieri rossi, Ashley è in piedi con il berretto, e Hannah, con gli occhiali, parla al telefono.
picture.t_camera_mike_01_clr_up=Uno scherzo: Emily, sogghignando, disegna sulla faccia di Chris, addormentato su un divano con la faccia già scarabocchiata, mentre Jessica sogghigna dietro di lui.
look.i_psychsession_1_interaction=Un campo di mais in una giornata di sole: a sinistra un fienile rosso e a destra uno spaventapasseri con un cappello di paglia, un volto ghignante, un fazzoletto rosso al collo e un uncino al posto di una mano. Nel mais scuro, in basso a sinistra, due piccoli occhi gialli.
look.i_sams_sketchbook.1=Ritratti a matita. A sinistra: Sam, i capelli raccolti morbidamente, una sciarpa al collo, lo sguardo di lato. A destra: Jessica, sorridente, una lunga treccia sulla spalla, con un parka dal cappuccio di pelliccia.
look.i_sams_sketchbook.2=Ritratti a matita. A sinistra: Mike, i capelli pettinati all'insù, la barba di qualche giorno, lo sguardo di lato, con una camicia a quadri e una giacca col cappuccio. A destra: Josh, con un berretto a maglia, un lieve sorriso, lo sguardo dritto davanti a sé.
look.i_sams_sketchbook.3=Ritratti a matita. A sinistra: Emily, capelli scuri e lisci con la riga in mezzo, le labbra serrate, con un dolcevita e un collo di pelliccia. A destra: Chris, capelli a punta e occhiali rettangolari, con una giacca trapuntata, la bocca aperta come se stesse parlando.
look.i_sams_sketchbook.4=Ritratti a matita. A sinistra: Ashley, con un berretto a coste, lunghi capelli lisci, un sorriso dolce. A destra: Matt, capelli corti e ricci, sorridente, con un maglione a collo alto.
look.i_map=Una mappa della montagna, con i luoghi indicati come LODGE, SANATORIUM e CABLE CAR. Sentieri a puntini rossi portano dalla funivia alla baita e poi su fino al sanatorio, e lungo RANGER PATH fino a una torre con il simbolo della radio; in basso, TO LOWER CABLE CAR.
look.i_lookatmap_with_emily==look.i_map
look.i_lookatmap_without_emily==look.i_map
look.i_graffiti=Lettere rosse imbrattate sulle pareti, ancora e ancora: DIE.
look.i_security_monitor=Sullo schermo, un bagno buio con una grande vasca lascia il posto alla ripresa di una telecamera di sorveglianza dall'alto: un edificio di legno sotto la neve, una lampada accesa sopra una panca sul lungo portico, abeti nella nebbia sullo sfondo. Giù nella neve, tra le ombre dei rami spogli, c'è una figura scura. Interferenze, e la figura è sparita.
look.i_family_portrait=Un ritratto dipinto in una pesante cornice intagliata, con una targa sotto: THE WASHINGTON FAMILY. A sinistra Hannah, con gli occhiali e un ciondolo a cuore, e Beth, con la frangia; la mano di Hannah è posata sulla spalla di una donna sorridente davanti, dai capelli corti e scuri. Dietro, un uomo con i baffi cinge con il braccio Josh, che sorride a destra con un maglione scuro sopra un colletto bianco.
look.i_car_lookat=Nell'auto i sedili sono ingombri di cose: due sacchetti rosa di carta, una borsa da viaggio fantasia, flaconi di smalto per unghie e di lozione, riviste e una banana.
look.i_hotel_poster=Un manifesto sbiadito: un grande albergo di legno con lunghe verande e timpani aguzzi sotto una vetta frastagliata e un cielo stellato.
look.i_prom_night_photo=Nella foto, Hannah ha una piccola farfalla nera tatuata sulla parte alta del braccio.
look.i_prom_night_photo_female==look.i_prom_night_photo
look.i_hannah_and_beth_beach_photo=Nella foto, Hannah ha una piccola farfalla tatuata sulla parte alta del braccio.
look.i_mysticalsymbols=Imbrattato in rosso scuro sulle assi: un volto simile a un teschio, a denti scoperti, sotto ampie corna ramificate, la vernice colata in rivoli. Accanto pende un teschio di cervo con piume.
look.i_childsdrawing==look.i_psychsession_1_interaction
look.i_pinboard_hannah_room=Sotto l'invito, una foto in bianco e nero di Mike in smoking e papillon. Tutt'intorno sulla bacheca di sughero, in una cornice scura e ornata: foto di Sam, di Emily, Hannah e Beth insieme, di un cane e di gatti, del Tower Bridge e di paesaggi; coccarde con cavalli con le scritte 1ST e SPECIAL; due biglietti per un concerto di HARRY VOGUE; una faccina scarabocchiata firmata JOSH; e foglietti: Finals start APRIL 22nd!!; It's up to you to find BEAUTY in the ugliest days!; Dad's new P.A Cheryl 558-714-1132.
look.i_look_at_dollshouse=Una vecchia casa delle bambole di legno a due piani su un cassettone: un tetto grigio di scandole con una finestra tonda nel timpano, finestre con le imposte, un portico lungo la facciata. A una finestra del piano di sopra, una bambola nuda e pallida dai capelli biondi; da una finestra di sotto si intravedono altre bambole, e sul portico giace una testa di bambola. Accanto, in una valigia aperta, una bambola dai capelli scuri in un abito magenta e un libro scuro con una croce; davanti, tre cubi impilati, ognuno con un 6.
look.i_snowybench=Sotto la neve spazzata, un cuore è inciso nelle assi, con delle lettere graffiate all'interno.
look.i_headlessdoll=Un bambolotto nudo senza testa, la plastica sudicia, macchiata e screpolata, un buco scuro al collo, minuscole unghie dipinte di rosso. Sulla schiena, un adesivo con tre farfalle e il nome Hannah in caratteri svolazzanti; sul petto, una chiazza rotonda di forellini.
look.i_controls_lookat=Un banco di comando di metallo grigio, consumato e graffiato: in fondo quadranti segnati A, V e Hz, file di spie gialle, verdi e bianche, selettori rotanti, pulsanti tondi e un tastierino; a destra una piastra blu con una feritoia per la leva segnata STOP, NEUTRAL, RUN, e al centro un interruttore rosso con la fessura per la chiave. Sopra, lettere rosse imbrattate ancora e ancora: DIE.
look.a_telescope=Nel telescopio, di notte: un pendio innevato con rocce e pini, al centro un alto tronco chiaro che sale curvando. In basso a sinistra, su un sentiero innevato accanto a una grossa roccia, Emily e Mike stanno vicinissimi, l'uno di fronte all'altra: la mano di lui sulla guancia di lei, le mani di lei sui suoi fianchi. Lontano a destra, tra rami spogli, qualcuno siede da solo su una panchina sotto una tettoia illuminata.
look.i_telescope.act2_2=Nel telescopio, di notte: massi innevati e, dietro, l'angolo di una baita di tronchi sotto un tetto carico di ghiaccioli; sotto la gronda una lampada brilla sopra un ventilatore ingabbiato. Non si vede nessuno.
look.i_telescope.act2_3=Nel telescopio, di notte: una radura innevata tra gli alberi, dove un'altalena di legno pende da due lunghe corde. Dietro, sporgenze rocciose innevate e cespugli spogli; a sinistra, felci e un tronco coperto d'edera.
look.i_death_whistle=Un fischietto intagliato a forma di teschio con ampie corna ramificate. Girato, mostra il volto: due orbite profonde e una bocca tonda aperta, cerchiate di vernice bianca, e una catena di anelli bianchi dipinta sulla fronte.
look.i_smashed_vase=I cocci di un vaso rosso scuro sono sparsi sul pavimento; Ashley ne tiene in mano uno, dai bordi spezzati ruvidi e chiari.
look.i_sams_bracelet=Un braccialetto di cordoncino intrecciato, blu con un motivo di rombi gialli, rossi e viola, chiuso da un fermaglio di metallo rosato.
look.i_picture_lookat=Un dipinto in una cornice scura e screpolata: una casa di legno a due piani di notte sotto un cielo in tempesta, tutta in blu e grigi scuri, con una finestra tonda in alto nel timpano, finestre con le imposte al piano di sopra e un lungo portico con ringhiera in basso.
look.i_dollhouse_complete=Dalle finestre della casa delle bambole si vedono bambole all'interno; poi, da vicino, quattro bambole nude strette insieme, tutte con lo stesso viso da bambola: una rossa, una mora, una bionda con i codini e una dalla pelle scura che tiene in mano una piccola videocamera, come Ashley, Emily, Jessica e Matt. I loro occhi sono buchi neri, e colature rosso scuro scendono loro sulle guance.
look.i_dollhouse_complete.open=La facciata della casa delle bambole si apre e il tetto si solleva: due piani di stanzette minuscole con bambole nude messe in scena, tutte con lo stesso viso da bambola, ma con i capelli degli amici. Di sopra, accanto a un tavolino con bottiglie e un bicchiere, una bambola mora è stravaccata su un divano accanto a una bionda con gli occhiali, come Josh e Chris. Di sotto, quattro bambole sono inginocchiate su un tappeto rosso rivolte verso un letto: una dalla pelle scura che riprende con una piccola videocamera, una bionda con i codini, una mora e una rossa, come Matt, Jessica, Emily e Ashley; un'altra bambola sta in piedi in disparte.
look.i_doll_house_lookat_keyhole=In alto nel timpano della casa delle bambole, la finestrella tonda è stata girata di lato come un coperchio: dietro, una piastrina tonda d'ottone con il buco della serratura, bordata di rosso.
look.i_doll_house_key=Una piccola chiave antica di ferro, con l'anello a forma di cuore e il gambo scanalato a spirale. Era appesa a un gancetto d'ottone, nascosta dietro il dipinto.
look.i_wine_rack=Un'alta rastrelliera per vini di legno dietro un graticcio di strisce di ferro a rombi; le assi superiori sono sfondate e scheggiate, squarciate da buchi scuri.
look.i_wine_cellar_door.act5_3=Una porta di assi rinforzata da bandelle di ferro; sulla piastra arrugginita della serratura non c'è maniglia, solo un piccolo foro quadrato.
look.i_doll_head=Girata verso di lei, la testa calva della bambola: orbite nere e vuote cerchiate di ciglia dipinte, guance rosee, labbra rosse, la vernice screpolata che si sfalda, e una crepa scura che scende da un occhio passando accanto alla bocca.
look.i_doll_head.roaches=Dalla testa della bambola sciamano fuori degli scarafaggi.
look.i_sams_sack=Sotto il sacco c'è Sam, avvolta in un asciugamano, seduta immobile su una vecchia sedia girevole di legno.
look.crossedout=Una foto è barrata: {0}.
look.i_hannah_and_beth_beach_photo_female==look.i_hannah_and_beth_beach_photo
look.i_peer_at_cart=Una rete metallica arrugginita tesa tra due pali di legno, la mano di Emily stretta a quello di destra; oltre la rete, sotto, in una fioca luce bluastra, il fondo di una galleria disseminato di detriti, con una trave scura di traverso.
look.i_torn_miner_clothes=Sulle pietre giace un vecchio elmetto da minatore: una cupola di metallo scuro con nervature in rilievo, una tesa larga e arrugginita e, sul davanti, una piccola lampada d'ottone con un riflettore rotondo.
look.i_broken_ladder=Una scala a pioli rotta giace di traverso sui detriti: un lungo montante di legno da cui sporgono tre pioli di ferro arrugginiti, con le estremità spezzate, e su due di essi restano ancora schegge di legno.
look.i_sign=Nella polvere giace un pezzo spezzato di un cartello di legno consumato dalle intemperie, coi bordi irregolari e scheggiati; sopra, in maiuscole rosse sbiadite a stampino, la fine di una parola, GER, e sotto EDGE.
look.i_peer_at_head=Attraverso una rete metallica scura, tra assi grezze: al di là, su un pavimento sassoso, un barile coperto in cima da un telo e, più indietro, una ringhiera di legno e cumuli di detriti.
look.i_peer_at_wheel=Attraverso una rete metallica arrugginita tra due pali: una caverna al di là e, dentro, una grande e vecchia ruota idraulica di legno fra impalcature rotte; ai suoi piedi una fiammata erompe dal buio e si spegne.
look.i_scarecrow_lookat=Uno spaventapasseri, le braccia rami spogli che finiscono in ramoscelli, il corpo un sacco di plastica nera imbrattato di sangue. La testa è avvolta in una stoffa chiara legata al collo con una corda; attraverso si intravede un volto in putrefazione, un naso incavato e una bocca aperta dai denti marci, un lato intriso di sangue. Da sotto un cappello marrone malconcio pendono lunghi capelli neri.
look.i_scarecrow_lookat.clown=Uno spaventapasseri, le braccia rami spogli che finiscono in ramoscelli, il corpo un sacco di plastica nera imbrattato di sangue. La testa è una maschera da clown: un volto bianco e rugoso, sopracciglia viola dipinte ad archi alti su per la fronte, fori scuri per gli occhi cerchiati di viola, un naso rosso e un largo ghigno di lunghi denti aguzzi, rosso agli angoli, il mento scuro di sangue.
look.i_scarecrow_lookat.zombie=Uno spaventapasseri, le braccia rami spogli che finiscono in ramoscelli, il corpo un sacco di plastica nera imbrattato di sangue. La testa è quella di uno zombi in putrefazione: calva, pelle chiazzata grigioverde, occhi bianchi vuoti e una bocca spalancata piena di denti.
look.i_dead_crow_lookat=Due corvi morti giacciono nella neve macchiata di sangue, squarciati e insanguinati, le ali aperte, le interiora che fuoriescono; intorno a loro sono sparse piume nere.
look.i_chair_and_blood=Sul pavimento di cemento uno sgabello di legno rovesciato, con le gambe rotte; accanto, una manetta di ferro aperta su una catena. Il sangue è schizzato e gocciolato sul pavimento, e una lanterna giace su un fianco, ancora accesa.
look.i_fake_torso=La metà superiore di un corpo in una camicia grigia a quadri pende con le braccia tese in alto; sotto la vita non c'è che un taglio sfilacciato e insanguinato. Dietro c'è un'asse con un foro ritagliato.
look.i_saw_blades=Un'enorme lama di sega circolare giace distesa, l'acciaio arrugginito imbrattato di sangue scuro; dietro, una recinzione di rete metallica.
look.i_dead_wolf_inspect=Un lupo morto è appeso alle sbarre della porta di una cella: petto e ventre squarciati e vuoti, la testa penzolante con le fauci spalancate, e sotto di lui le interiora giacciono in una pozza di sangue.
look.i_damaged_doors=Una pesante porta di cella d'acciaio con pannelli ammaccati: una grande striscia scura di sangue cola lungo di essa, il sangue è gocciolato da sotto il piccolo sportello in alto, e nel metallo sono incisi profondi segni di artigli.
look.i_sanlookat=Una recinzione di rete metallica: a sinistra un palo scuro, e una sbarra arrugginita che la attraversa. Attraverso le maglie, nella neve al di là, una breve rampa di gradini di cemento con un corrimano di metallo.
look.i_oilflask=Tenuta vicinissima agli occhi, un'alta tanica di metallo rossa e arrugginita. Sul fianco un emblema ovale sbiadito dice North West intorno alle lettere NWM, con Mining sotto; sul lato stretto, un rombo rosso dice FLAMMABLE LIQUID.
look.i_oilflask.roaches=Degli scarafaggi escono e strisciano sulla tanica, e lei la getta via.
look.i_admin_area_jacksdoor_lookat_reader=Un lettore di tessere nero sulla parete accanto a una porta di legno, con un piccolo display rosso che dice LOCKED; sulla porta, sotto una finestrella, un cartello verde arrugginito: CHAPEL SECURITY PASS REQUIRED.
look.i_morgue_open_morgue_drawer_lookat=Sul ripiano estratto dell'obitorio giace supino un cadavere in putrefazione: un volto grigio e rinsecchito con la bocca spalancata, circondato da capelli scuri appiccicati; la camicia grigia e il ripiano arrugginito sono macchiati di sangue vecchio.
look.i_jackslair_exit_lock_lookat=Un cancelletto di ferro a maglie romboidali è chiuso a chiave: un grosso lucchetto arrugginito pende dal portalucchetto accanto allo stipite di legno.
look.i_telescope_look_only==look.i_telescope.act2_2
look.i_motivation_board=Due manifesti MISSING: HANNAH WASHINGTON e BETH WASHINGTON; quello di Hannah dice: She has glasses, and has a tattoo of a butterfly on her right shoulder. Un biglietto giallo: NEVER FORGET. Ritagli di giornale: No new evidence in girls' disappearance; 2 youths missing in wilderness remain untraced. In una foto di quattro ragazze, Hannah è cerchiata di rosso.
look.i_motivation_board_lookat==look.i_motivation_board
look.i_snowwipe_tractor_revisit=Dietro il vetro sporco e macchiettato della cabina del vecchio camion c'è una maschera da hockey bianca dipinta come un teschio: fori obliqui per gli occhi, un naso da teschio e un largo ghigno di lunghi denti, due tratti scuri sopra un occhio, una scheggiatura in cima.
look.i_joshsbaseball=Una vecchia palla da baseball sporca, il cuoio graffiato e macchiato di marrone, le cuciture di un rosso sbiadito; sopra, scritto a mano in nero: Josh.
look.i_loveheart=Un cuore è inciso nella corteccia chiara di un tronco d'albero e, al suo interno, M+E.
look.i_rifle_lookat=In un casotto di legno, un fucile è posato sul bancone di assi. Fuori, più in là nella neve, ci sono vecchi barili con delle bottiglie sopra, e dai rami pendono sacchi legati a corde, uno segnato con una X.
look.i_look_at_picture==look.i_picture_lookat
look.i_wine_cellar_door.act2_4=Una porta di assi rinforzata da bandelle di ferro; sulla piastra arrugginita della serratura c'è un pomello rotondo.
look.i_rush_of_blood_snowglobe=Una palla di neve su una base dipinta a zigzag rossi e blu. Dentro il vetro, sopra un cumulo innevato, il tracciato di legno di un ottovolante si avvolge in anelli su esili trampoli, con dei vagoncini sopra; palloncini rossi con stelle bianche e frecce segnaletiche rosse punteggiate di luci svettano tra gli anelli.
look.i_chess_piece=Presa da una scacchiera, una piccola statuina di un uomo, lunga più o meno un dito: sta in piedi con le braccia lungo i fianchi, in maglietta e pantaloni, e ha il volto liscio, senza lineamenti.
look.i_fallen_beams=A terra giace un pannello di grata di ferro saldata in un telaio arrugginito, con alcune sbarre spezzate e sopra due grossi blocchi di roccia; da un anello a un suo angolo pende una pesante catena.
look.i_lookatmineexit=Da vicino, una porta di assi consumate dalle intemperie, sfondata da un grosso buco frastagliato; attraverso il buco c'è solo una foschia grigio pallido.
look.i_matts_shoe=Un grosso scarpone invernale, raccolto da terra: una tomaia di pelle blu scuro allacciata attraverso dei passanti, una fodera di feltro che spunta in cima e una parte inferiore di gomma scura a strisce bianche, sporca di fango.
