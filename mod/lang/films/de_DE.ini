; Dawn Access film descriptions — German. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Nacht, am Rand einer Klippe: Hannah, mit Brille und pinkfarbener Jacke, hält sich an Beth in grauer Mütze und Pullover fest. Hannah stolpert rückwärts über die Kante und reißt Beth mit sich; unten prallt Beth mit dem Rücken auf einen Felsbrocken, Blut spritzt.
film.death_act1_1_sisters_cliff.1=Unten liegt Hannah mit blutverschmiertem Gesicht und offenen Augen, hinter ihr Beths blutiger Körper.
film.death_act1_1_sisters_cliff_alone=Nacht, an einer Felswand: Hannahs Hand rutscht aus Beths Griff, und Hannah stürzt die Felsen hinab. Beth streckt sich nach einer behandschuhten Hand, die ihr eine dunkle Gestalt von oben herabreicht, stürzt aber und prallt auf verschneite Felsbrocken; unten liegt Hannah blutüberströmt mit offenen Augen, während Beth hinter ihr aufschlägt.
film.death_act3_2_jessica_liftshaft=Mike hält eine Laterne hoch und blickt einen Schacht hinauf; vor ihm fällt ihr Körper auf den Gitterboden eines Aufzugskorbs, der Unterkiefer abgerissen. Er starrt sie an, greift nach ihr, und der Korb stürzt in einem Funkenregen in die Tiefe.
film.death_act5_2_matt_climb=In einem nebligen Wald weicht er vor einem Rudel Hirsche mit Geweihen zurück, tritt über eine Felskante und stürzt in die Dunkelheit. Er liegt mit dem Gesicht nach unten auf einem Felsen, unter seinem Mund eine Blutlache; in Nahaufnahme glänzt sein offenes Auge vor Tränen.
film.death_act5_2_matt_wendigo=Nahaufnahme seiner verängstigten Augen in der Dunkelheit. Ein Wendigo packt ihn von hinten und drückt ihn auf einen Haken, der zwischen Ketten hängt; der Haken bohrt sich von unten durch seinen Kiefer und tritt aus dem Mund wieder aus, und er hängt da, das Gesicht blutüberströmt.
film.death_act6_3_emily_eyegauge=Ein Wendigo packt ihren Kopf und drückt ihr die Daumen in die Augen; sie schreit, während ihr Blut übers Gesicht strömt, dann hängt sie schlaff in seinem Griff.
film.death_act6_3_emily_oregrinder=Sie rutscht eine verschneite Rinne hinab in den Trichter eines Zerkleinerers und klammert sich an seinen Rand; ihre Finger gleiten ab, und sie stürzt schreiend zwischen Stachelwalzen, Blut strömt ihr aus dem Mund, bis ihr Kopf nach hinten sinkt.
film.death_act6_4_chris_lodgedoor=Drinnen blickt Ashley auf und tritt einen Schritt vor. Draußen im Dunkeln packt ihn ein Wendigo von hinten, die Klauen über seinem Gesicht, und reißt ihm den Kopf ab; der Kopf liegt im Schnee neben seinem Körper.
film.death_act6_4_chris_lodgedoor_ja=Ashley, durch die Glasscheiben einer Tür zu sehen, blickt hinaus und tritt einen Schritt vor. Draußen packt ihn ein Wendigo von hinten, die Klauen über seinem Gesicht, und zieht ihn nach unten aus dem Bild; der Wendigo knurrt in die Kamera und zieht ab, zurück bleibt der dunkle Wald.
film.death_act6_4_chris_runtolodge_ashimpassive=Im dunklen Schnee drückt ihn ein Wendigo nieder und reißt ihm den Kopf ab; der Kopf landet auf der verschneiten Veranda vor Ashleys Füßen. Ashley, mit Blut bespritzt, steht da, blickt nach unten und verzieht das Gesicht.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Vom Boden aus, in einem dunklen Wald: Ein Wendigo kauert über ihm, hebt den Kopf, die Augen funkeln, und zieht ab. Nahaufnahme von Ashley, mit Blut bespritzt und den Tränen nahe, das Gesicht verzogen; dann steht sie da und blickt nach unten.
film.death_act6_4_chris_runtolodge_ashscreams=Im dunklen Schnee drückt ihn ein Wendigo nieder und reißt ihm den Kopf ab; der Kopf fliegt durch die Luft, rollt durch den Schnee und bleibt vor einer verglasten Tür liegen. Hinter der Scheibe presst Ashley die Hände vor den Mund und sinkt weinend auf die Knie.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Vom Boden aus, in einem dunklen Wald: Ein Wendigo kauert über ihm, hebt den Kopf, die Augen funkeln, und zieht ab. Hinter den Glasscheiben einer Tür tritt Ashley heran, presst die Hände vor den Mund und sinkt weinend auf die Knie, während hinter ihr ein Mann auftaucht.
film.death_act7_1_emily_shotbymike=In einem dunklen Raum, erhellt von Überwachungsmonitoren, dreht sich Mike um und kommt mit einer Pistole auf sie zu, während Ashley zusieht, hebt die Waffe mit beiden Händen und schießt; Blut spritzt an die Wand, und in Nahaufnahme ist ihr linkes Auge ein blutiges Loch, der Kopf nach hinten geworfen, der Mund weit aufgerissen.
film.death_act7_1_emily_shotbymike_ja=In einem dunklen Raum, erhellt von Überwachungsmonitoren, dreht sich Mike um und kommt mit einer Pistole auf sie zu, während Ashley zusieht, und hebt die Waffe mit beiden Händen. Beim Schuss wechselt das Bild zu einer Karte an einer Korkpinnwand (BLACKWOOD PINES MOUNTAINS), auf die Blut spritzt; dann gleiten im Dunkeln ihre Beine in Stiefeln zu Boden.
film.death_act7_3_ashley_trapdoor_opened=Sie öffnet eine Falltür im Boden; ein Wendigo springt heraus, richtet sich über ihr auf, während sie kniet, und umklammert ihren Kopf mit seinen langen Händen. Dann fällt auf einem leeren Erdboden ihre schlaffe Hand ins Bild, und ihr abgetrennter Kopf fällt herab, rollt und bleibt liegen, Augen und Mund offen.
film.death_act7_3_ashley_trapdoor_opened_ja=Sie öffnet eine Falltür im Boden; ein Wendigo springt heraus, richtet sich über ihr auf, während sie kniet, und umklammert ihren Kopf mit seinen langen Händen. Dann ist nur noch ein leerer, dunkler Höhlengang zu sehen.
film.death_act7_3_ashley_trapdoor_unbolted=Sie steht ein paar Schritte von einer offenen Falltür entfernt; ein Wendigo klettert heraus und drückt sie am Kopf nach unten, während sie schreit. Dann fällt auf einem leeren Erdboden ihre schlaffe Hand ins Bild, und ihr abgetrennter Kopf fällt herab, rollt und bleibt liegen, Augen und Mund offen.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Sie steht ein paar Schritte von einer offenen Falltür entfernt; ein Wendigo klettert heraus und drückt sie am Kopf nach unten, während sie schreit. Dann ist nur noch ein leerer, dämmriger Minengang zu sehen.
film.death_act7_3_chris_trapdoor1=Er öffnet eine Falltür; ein Wendigo springt heraus, richtet sich über ihm auf, während er kniet, und dreht ihm mit seinen langen Händen den Kopf herum. Dann fällt sein abgetrennter Kopf auf den Boden und bleibt aufrecht stehen, dem Betrachter zugewandt: die Brille verrutscht und gesprungen, der Mund offen.
film.death_act7_3_chris_trapdoor1_ja=Er öffnet eine Falltür; ein Wendigo springt heraus, richtet sich über ihm auf, während er kniet, und packt seinen Kopf. Dann sieht man nur noch dunkle Holzbalken über sich.
film.death_act7_3_chris_trapdoor2=Während er auf eine geschlossene Falltür hinabblickt, lässt sich vor ihm ein Wendigo herabfallen, springt ihn an und drückt ihn auf den Rücken. Der Wendigo schlitzt ihm mit den Klauen die Kehle auf; Blut schießt hervor, und er hebt den abgetrennten Kopf dem Betrachter entgegen, der Mund offen.
film.death_act7_3_chris_trapdoor2_ja=Während er auf eine geschlossene Falltür hinabblickt, lässt sich vor ihm ein Wendigo herabfallen, springt ihn an und drückt ihn auf den Rücken. Dann sieht man nur noch dunkle Holzbalken über sich.
film.death_act7_3_chris_tunnel1=In einem mit Holz abgestützten Minentunnel strampeln seine Beine in der Luft, der Rest von ihm ist oben außer Sicht, während Ströme von Blut herabfließen. Dann fällt vor blutbespritzten Brettern sein kopfloser Körper zu Boden.
film.death_act7_3_chris_tunnel1_ja=In einem mit Holz abgestützten Minentunnel strampeln seine Beine in der Luft, der Rest von ihm ist oben außer Sicht, während Ströme von Blut herabfließen. Dann fällt vor blutbespritzten Brettern sein Körper zu Boden; nur Beine und Rücken sind zu sehen, und eine Hand zuckt.
film.death_act8_4_josh_wendigo=Ein Wendigo bricht aus dunklem Wasser hervor und umklammert mit beiden langen Händen seinen Kopf. Er schreit, während sich die Finger in seinen Schädel drücken; der Wendigo drückt zu, bis Blut hervorbricht und über das Bild spritzt.
film.death_act8_4_josh_wendigo_ja=Ein Wendigo bricht aus dunklem Wasser hervor und umklammert mit beiden langen Händen seinen Kopf. Er schreit, während sich die Finger in seinen Schädel drücken; als der Wendigo zudrückt, hebt sich das Bild von den beiden weg, und dunkle Tropfen spritzen darüber.
film.death_act8_5_jessica_keepstill_timeout1=Nahaufnahme: Sie liegt schreiend auf dem Rücken, während ein Wendigo ihren Kopf packt und ihr seine klauenbewehrten Finger in den Mund zwängt; er reißt ihr den Unterkiefer ab, sein Maul mit den Reißzähnen dicht neben ihrem starren Gesicht. Dann liegt sie regungslos im Feuerschein, der Unterkiefer fehlt.
film.death_act8_5_jessica_keepstill_timeout1_ja=Fast schwarz: Die Kamera gleitet langsam an einem Körper entlang, der reglos am Boden liegt; dann tauchen ganz nah die Rippen und der Kopf eines Wendigos aus der Dunkelheit auf.
film.death_act8_5_jessica_keepstill_timeout2=Nahaufnahme, im fallenden Schnee: Sie liegt schreiend auf dem Rücken, während ein Wendigo ihren Kopf packt und ihr seine klauenbewehrten Finger in den Mund zwängt; er reißt ihr den Unterkiefer ab und bringt sein blutiges Gesicht voller Zähne dicht an ihres. Dann liegt sie regungslos im Schnee, im Feuerschein, der Unterkiefer fehlt.
film.death_act8_5_jessica_keepstill_timeout2_ja=Nacht, zwischen verschneiten Felsen: Ganz nah bewegen sich die langen Gliedmaßen eines Wendigos mit ihren Klauen über jemandes dunkle Silhouette hinweg; dann gleitet die Kamera langsam über leere, schneebedeckte Felsen.
film.death_act8_5_jessica_leftbehind=In einem mit Holz abgestützten Tunnel rennt sie mit einer Laterne; ein Wendigo springt ihr auf den Rücken und reißt sie zu Boden. In Nahaufnahme packt er ihren Kopf, zwängt ihr seine klauenbewehrten Finger in den schreienden Mund und reißt ihr den Unterkiefer ab; dann liegt sie regungslos im Feuerschein, der Unterkiefer fehlt, während sein Kopf voller Zähne über ihr vorbeihuscht.
film.death_act8_5_jessica_leftbehind_ja=Fast schwarz: Die Kamera gleitet langsam an einem Körper entlang, der reglos am Boden liegt; dann kriecht ein knochiger Wendigo auf allen vieren durch die Dunkelheit.
film.death_act8_5_jessica_timeout2=Nahaufnahme: Sie liegt schreiend auf dem Rücken; ein Wendigo packt sie mit einer klauenbewehrten Hand oben am Kopf und zwängt ihr die Finger der anderen in den Mund.
film.death_act8_5_jessica_timeout2_ja=Fast schwarz: Die Kamera gleitet langsam an einem Körper entlang, der reglos am Boden liegt.
film.death_act8_5_matt_gate=Im fallenden Schnee kauert ein Wendigo über einer erleuchteten Türöffnung in einer Holzwand und springt dann auf ihn herab. Über ihm kauernd, richtet er sich mit erhobenen Armen auf und schlägt ihm das Gesicht ein; in Nahaufnahme liegt sein Gesicht zerschmettert und blutig im Schnee.
film.death_act8_5_matt_gate_ja=Im fallenden Schnee kauert ein Wendigo über einer erleuchteten Türöffnung in einer Holzwand und springt dann auf ihn herab. Während er auf dem Rücken liegt, greifen die Klauen nach seinem Gesicht; dann verweilt die Kamera auf seiner Brust, mit dem Buchstaben M auf der Jacke, und er liegt reglos da.
film.death_act8_5_matt_keepstill_timeout1=In einem mit Holz abgestützten Tunnel hält er eine Laterne; ein Wendigo springt ihn an und reißt ihn zu Boden. Über ihm kauernd, richtet er sich mit erhobenen Armen auf und schlägt ihm das Gesicht ein; in Nahaufnahme liegt sein Gesicht zerschmettert und blutig da.
film.death_act8_5_matt_keepstill_timeout1_ja=In einem mit Holz abgestützten Tunnel hält er eine Laterne; ein Wendigo springt ihn an und reißt ihn zu Boden. Der Wendigo kauert über ihm, die Klauen nach seinem Gesicht ausgestreckt; dann verweilt die Kamera auf seiner Brust, mit dem Buchstaben M auf der Jacke, und er liegt reglos da.
film.death_act8_5_matt_keepstill_timeout2=Im fallenden Schnee kauert ein Wendigo über ihm, während er die Hände hebt; der Wendigo richtet sich auf und schlägt ihm das Gesicht ein. In Nahaufnahme liegt sein Gesicht zerschmettert und blutig da.
film.death_act8_5_matt_keepstill_timeout2_ja=Im fallenden Schnee kriecht ein Wendigo über ihn hinweg, als er eine Hand hebt; dann verweilt die Kamera auf seiner Brust, mit dem Buchstaben M auf der Jacke, und er liegt reglos da.
film.death_act8_5_matt_timeout1=Ein Wendigo klettert an Holzbalken herab, stürzt sich auf ihn und reißt ihn zu Boden. Er hebt eine Hand, der Wendigo kauert über ihm, richtet sich auf und schlägt ihm das Gesicht ein; in Nahaufnahme liegt sein Gesicht zerschmettert und blutig da.
film.death_act8_5_matt_timeout1_ja=Ein Wendigo klettert an Holzbalken herab, stürzt sich auf ihn und reißt ihn zu Boden. Der Wendigo kauert über ihm und bleckt die Zähne; dann verweilt die Kamera auf seiner Brust, mit dem Buchstaben M auf der Jacke, und er liegt reglos da.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=In der Lodge, zwischen Möbeln unter Laken, springt ein Wendigo vom Boden an die Wand, während ein gelblicher Dunst den Raum füllt. Eine Feuerexplosion schleudert sie bäuchlings über den Boden; sie liegt reglos da, während hinter ihr die Flammen toben.
film.death_act8_6_ashley_eyegauge=Ein Wendigo mit einer Schmetterlingstätowierung auf der Schulter stürzt sich auf sie und packt ihren Kopf. Er drückt ihr die Daumen in die Augen, Blut strömt ihr übers Gesicht, dann zieht er die Daumen aus den blutigen Augenhöhlen, während sie auf einem Holzboden liegt.
film.death_act8_6_emily_explosion=Inmitten auflodernder Flammen knurrt ein Wendigo hinter Holzpfosten. Die Explosion schleudert sie über einen Holzboden; sie liegt auf dem Bauch, das Gesicht schwer verbrannt.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=In der Lodge brüllt ein Wendigo direkt ins Bild und schreit ihm dann ins Gesicht, während er an einer Wand steht. Der Wendigo packt ihn am Kopf, schlitzt ihm den Bauch auf und schleudert ihn quer durch den Raum; er fällt am Fuß einer Holzsäule zu Boden.
film.death_act8_6_mike_lightbulb_ja=In der Lodge schreit ein Wendigo direkt ins Bild. Der Wendigo packt ihn am Kopf, während er sich gegen dessen Brust stemmt, schreit ihm ins Gesicht und schleudert ihn beiseite; dann breitet der Wendigo, von hinten zu sehen, die langen Arme weit aus.
film.death_act8_6_mike_explosion_unijured=In der Lodge bricht ein Feuerball durch einen Raum mit Möbeln unter Laken und fegt durch die Halle, wobei eine Vase zerspringt. Dann liegt er inmitten der Flammen auf dem Boden, das Gesicht schwer verbrannt.
film.death_act8_6_sam_wendigo1=In der Lodge hält die klauenbewehrte Hand eines Wendigos sie an der Kehle hoch; sie ringt nach Luft, Blut läuft ihr aus dem Mund, ihre Stirnlampe brennt. Er stößt ihr seinen anderen Arm zweimal durch den Bauch und lässt los; sie fällt zu Boden und bleibt reglos liegen.
film.death_act8_6_sam_wendigo1_ja=In der Lodge packt ein Wendigo sie. Von unten gesehen hält er sie mit ausgestrecktem Arm hoch, sie ist nur ein dunkler, verschwommener Fleck am Bildrand, und er schreit mit zurückgeworfenem Kopf; dann stürzt er auf das Bild zu und huscht auf allen vieren davon.
film.4_3_being_watched_emilymatt_cctv_footage=Auf einem Monitor blickt eine feste Kamera nachts von oben auf ein eisernes Tor in einer verschneiten Steinmauer: Emily kommt hindurch, dann Matt, der das Tor hinter sich zuzieht; beide gehen davon, und das Tor steht verlassen im fallenden Schnee.
film.act20_6_cctv_footage=Auf den Monitoren sechs Kamerabilder: Chris und Ashley sitzen einander an einem kleinen Tisch unter hängenden Sägeblättern gegenüber; Chris feuert zweimal mit einer Pistole nach oben, zielt dann über den Tisch auf Ashley und senkt die Waffe. Andere Bilder zeigen eine Frau im Handtuch neben einer von Kerzen beleuchteten Badewanne und zwei Menschen an einer Wand, die Hände über dem Kopf gefesselt, dann einen rot bespritzten Tisch.
film.smg_sting.1=Auf der Kinoleinwand flackert leerer, zerkratzter Film, wirr blitzen Buchstaben und Zahlen auf.
film.smg_sting.2=Aufnahmen von Sam in einer von Kerzen beleuchteten Badewanne: Sie blickt über die Schulter, steigt heraus und steht, in ein Handtuch gewickelt, da und sieht sich um.
film.smg_sting.3=Ein riesiges rotierendes Sägeblatt schneidet in Josh, der mit den Armen über dem Kopf auf einem Tisch liegt; Blut spritzt, er verzieht das Gesicht, Blut schießt ihm aus dem Mund, und Blut und Fleischfetzen strömen unter dem Tisch herab.
film.smg_sting.4=Wieder flackert der leere Film.
film.projectorghost_movie=An der Wand alte, flackernde Aufnahmen: Emily spricht an einem Kamin in die Kamera und schiebt dann Ashley durch eine Tür; Hannah mit Brille lächelt schüchtern; zwei Mädchen und dann Ashley grinsen aus dem Dunkeln; Hannah beginnt, ihre Bluse aufzuknöpfen, und dreht dann den Kopf ruckartig weg.
film.projectorghost_scare=Eine rot beleuchtete Nahaufnahme von Hannah mit Brille, die lächelt und spricht; plötzlich blitzt ein grässliches weißes Gesicht mit dunklen Augenhöhlen und blutigem, aufgerissenem Mund auf, und das Bild wird schwarz.
film.projector_wendigo=An der Wand ein alter Schwarz-Weiß-Film: Eine Krankenschwester geht und lässt einen Patienten auf einem Stuhl sitzend zurück; er reißt sich los, klettert die Wand hinauf und kriecht über die Decke ins Dunkel. Sie kehrt zum leeren Stuhl zurück, ein Arm greift von oben nach ihr, und nach einem Blitz ist sie verschwunden; eine bleiche Gestalt stürzt auf die Kamera zu, und das Bild kippt zur Seite.
film.hannah_wendigo_reveal=Ein Aufblitzen in Sepia: ein Arm mit einer schwarzen Schmetterlingstätowierung, dann Hannah mit Brille, die Hände vor der Brust, mit einem schwachen Lächeln in die Kamera.
film.newghosty_up=Auf dem Fernseher schreit ein bleiches, grausiges Gesicht mit weit aufgerissenem Mund; für einen Augenblick verwandelt es sich flackernd in das bleiche Gesicht einer Frau mit dunklen Ringen um die Augen.
film.sam_end_credits.1=Durch ein Fenster: ein dunkles Schlafzimmer bei Nacht. Ein Handy leuchtet mit einem Wecker auf, 06:00 AM, Work Alarm, als Hintergrundbild Sam, die einen Hund umarmt, neben Tablettendosen und einem Buch, CREATURE MYTHS OF THE GREAT PLAINS. Sam liegt auf dem Bett unter einem sich drehenden Deckenventilator; sie reißt die Augen auf.
film.sam_end_credits.2=Eine Tablettendose fällt herunter und rollt neben ein weiteres Buch, THE WENDIGO LOG. Sam setzt sich auf die Bettkante und schaltet den Wecker mit einem Wisch aus; ihr Daumen verschmiert Blut über den Bildschirm, und Blut läuft ihren Unterarm hinab.
film.sam_end_credits.3=Sie drückt ein Taschentuch auf eine gezackte Schnittwunde an ihrem Unterarm, doch die Wunde blutet wieder. Rotes Licht breitet sich über ihr aus; sie dreht sich mit weit aufgerissenen Augen um.
film.sam_end_credits.4=Dunkelheit, dann der Titel: UNTIL DAWN.
film.totem_events_of_the_past.1=Ein altes Sepiafoto eines Mannes in langem Mantel und Halstuch, daneben ein Zettel: NO ESCAPE. Skizzen einer zotteligen Kreatur mit Reißzähnen und einer Hand mit Klauen; Schlagzeilen: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED und LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Ein Foto von Bergleuten unter der Schlagzeile MIRACLE MINERAL DISCOVERED; RADIUM; dann MINING DISASTER und DEATH TOLL RISES und ein schwarz bekritzeltes Foto von Bergleuten.
film.totem_events_of_the_past.3=Grausige Bilder blitzen auf: blutige Zähne und Zahnfleisch, ein gesprungener Schädel, ein blutüberströmtes Gesicht mit einem blutunterlaufenen Auge, Maden auf rohem Fleisch. HUNGER CRAVING an eine Wand gekritzelt; ein Röntgenbild mit der Aufschrift HUMAN?
film.totem_events_of_the_past.4=Eine handschriftliche Liste: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Ein dunkles Foto einer gebückten, bleichen Gestalt, rot eingekreist: CREATURE REPORTED. Skizzen einer Kreatur mit Reißzähnen, TEETH GROW & SHARPEN WITH AGE, und einer hageren, langgliedrigen Gestalt. THE ONLY WAY, ein Pfeil zu FIRE, eingekreist; die Seite verbrennt.
film.totem_events_of_the_past.5=Nacht: ein erleuchtetes Holzhaus zwischen verschneiten Kiefern. Beth, in grauer Mütze und Pullover, und Hannah, mit Brille und pinkfarbener Steppjacke, rennen voller Entsetzen Hand in Hand durch den Wald hinaus auf eine nebelverhangene Klippe.
film.totem_events_of_the_past.6=An einem Seilzaun neben einem kaputten Schild, CLIFF, blicken sie sich voller Entsetzen um; eine orangefarbene Wärmebildansicht zeigt sie als weiß leuchtende Umrisse zwischen den Bäumen. Hand in Hand an der Kante rutscht Hannah ab; Beth packt sie, und beide stürzen.
film.totem_events_of_the_past.7=Ein Mann mit Tanks auf dem Rücken rennt zur Klippenkante, während eine hagere, langgliedrige Kreatur auf ihn zukriecht; Nahaufnahmen seiner Schutzbrille und ihres aufgerissenen Mauls mit Reißzähnen. Er hüllt sie mit seinem Flammenwerfer in Feuer; sie brennt und schlägt im Schnee um sich, und ein Feuerball schwillt an, bis er das Bild füllt.
film.causaleffect_act1_3_samattackedbycrow=An einem Drahtzaun stößt eine Krähe auf Sam herab; Sam duckt sich, die Hände vor dem Gesicht.
film.causaleffect_act2_1_mattlooksthroughtelescope=Durch ein Teleskop: An einem verschneiten Hang hält Mike jemanden in einem pelzbesetzten Mantel fest umschlungen.
film.causaleffect_act2_2_minetunnel=Im Dunkeln, zwischen gekreuzten Holzbalken, beugt sich Mike ins Bild und sieht sich um, hinter ihm jemand Verschwommenes.
film.causaleffect_act2_4_samfindsbaseballbat=In einem dunklen Raum schwingt Sam lächelnd einen Baseballschläger; dann hält Josh, von einer Taschenlampe angestrahlt, einen Schläger und grinst.
film.causaleffect_act2_5_jessthroughwindow_pants=An einem Fenster im Dunkeln packt eine lange, knochige Hand die schreiende Jessica am Kopf und reißt sie ruckartig aus dem Bild.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Durch ein Teleskop: verschneite Felsen unter einer Felswand; dann, fast im Dunkeln, füllt ein hageres, runzliges Gesicht mit funkelnden Augen das Bild.
film.causaleffect_act3_2_bridgefail=Nachts rennt Mike auf eine kleine verschneite Seilbrücke; eine Planke bricht unter ihm, und er stürzt außer Sicht.
film.causaleffect_act3_2_clifffail=An einem verschneiten Hang rutscht Mike mit hochgehaltener Laterne aus und stürzt sich überschlagend die Felsen hinab.
film.causaleffect_act3_2_cliffsafe=An einem felsigen Hang klettert Mike mit der Laterne in der Hand vorsichtig die Felsen hinab.
film.causaleffect_act3_2_grabfencefail=Von oben gesehen: Mike greift an einem verschneiten Hang nach einem Drahtzaun, rutscht ab und fällt unten auf den Rücken in den Schnee.
film.causaleffect_act3_2_grabrootfail=Von oben gesehen: Mike klammert sich an einem verschneiten Hang an eine dicke Wurzel, rutscht ab und fällt unten auf den Rücken in den Schnee.
film.causaleffect_act3_2_jumpclifffail=Nachts springt Mike mit der Laterne in der Hand in eine felsige Rinne hinab, landet hart und klettert weiter.
film.causaleffect_act3_2_mikefallsover=Mike rennt mit der Laterne in der Hand einen verschneiten, bewaldeten Hang hinab, stolpert und schlägt der Länge nach hin.
film.causaleffect_act3_2_mikeisfast=Mike sprintet mit der Laterne in der Hand durch eine verschneite Rinne zwischen Felsen, direkt auf den Betrachter zu.
film.causaleffect_act3_2_pipefail=Mike balanciert, die Laterne hoch erhoben, über ein dickes, verschneites Rohr, rutscht ab und stürzt in reißendes Wasser.
film.causaleffect_act3_2_shimmy=Von oben gesehen: Mike klettert zwischen dunklen Felsen hinab; dann schiebt er sich seitlich an einer steilen Felswand entlang und hält sich mit einer Hand daran fest.
film.causaleffect_act3_2_takestairs=Mike rennt mit der Laterne in der Hand zu einer Holzhütte und eilt die verschneiten Stufen zur Tür hinauf.
film.causaleffect_act3_2_wendigointower_fast=Durch ein Zielfernrohr: gekreuzte Holzbalken im Schnee; neben dem Fadenkreuz steigt etwas Kleines, Graues ins Bild.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=Im Dunkeln beleuchtet die Flamme eines Feuerzeugs grobe Bretter; durch eine Lücke dazwischen starren zwei weit aufgerissene, glasige Augen heraus.
film.causaleffect_act4_1_chrissavesash=Durch ein Drahtgitter sieht man jemanden unter einer Hängelampe sitzen; dann ein riesiges gezahntes Sägeblatt, daneben im Schatten ein Mann in kariertem Hemd.
film.causaleffect_act4_2_mikebefriendswolf=Mike hockt neben einem zotteligen Wolf und streichelt sein Fell.
film.causaleffect_act4_2_mikekickswolf=In einer Türöffnung tritt Mike nach einem Wolf; dann hält er, verdreckt, mit erhobener Laterne die andere Hand hoch und verzieht das Gesicht.
film.causaleffect_act4_2_mikelooksatswolf=Mike hält einem Wolf die offene Hand entgegen; der Wolf senkt den Kopf, wendet sich ab und geht dann dicht vor ihm vorbei.
film.causaleffect_act4_2_mikestillhasmachete=Hände an den Backen einer Metallfalle; Mike wirft vor Schmerz den Kopf zurück. Dann hebt er in einem gefliesten Raum eine Machete auf.
film.causaleffect_act4_2_wendigoheadinajar=Ein bleicher, fleckiger Kopf mit winzigen funkelnden Augen in einem großen Glasgefäß.
film.causaleffect_act5_2_emgivesflaretomatt=In einer Bretterhütte reicht Emily eine Leuchtpistole an Matt; er nimmt sie und blickt auf sie hinab.
film.causaleffect_act5_3_chrisshotashley=An einem kleinen Holztisch richtet Chris mit Brille eine Pistole auf die weinende Ashley.
film.causaleffect_act7_3_ashley_trapdoor=Von oben gesehen: Eine Hand mit einem Ring und einem gestrickten Pulswärmer zieht den Riegel einer hölzernen Falltür zurück und packt ihren Griff.
film.intro_busride.1=Dunkelheit, dann der Titel: UNTIL DAWN.
film.intro_busride.2=Vorspann über düsteren Nahaufnahmen von Gegenständen, in denen flüchtig Gesichter zu sehen sind: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Über einem Schaukelpferd und einem alten Funkgerät: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=Bei Sonnenuntergang, von oben gesehen: Ein Bus schlängelt sich zwischen Kiefern eine verschneite Bergstraße hinauf.
film.intro_busride.5=Im Bus sitzt Sam am Fenster; auf ihrem Handy: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Auf ihrem Handy läuft ein Video: Josh im karierten Hemd spricht in einem dunklen Raum in die Kamera.
