; Dawn Access film descriptions — Korean. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=밤, 벼랑 끝: 안경을 쓰고 분홍색 재킷을 입은 해나가 회색 비니에 스웨터 차림의 베스를 붙잡고 있다. 해나가 비틀거리며 뒤로 벼랑 끝을 넘어 떨어지고, 베스도 함께 끌려 떨어진다. 아래에서 베스가 등부터 큰 바위에 세차게 부딪히고, 피가 뿜어져 나온다.
film.death_act1_1_sisters_cliff.1=바닥에 해나가 피투성이 얼굴로 눈을 뜬 채 누워 있고, 그 뒤에 베스의 피투성이 몸이 있다.
film.death_act1_1_sisters_cliff_alone=밤, 깎아지른 암벽: 베스가 잡고 있던 해나의 손이 미끄러져 빠지고, 해나는 바위를 따라 굴러떨어진다. 베스는 위에서 어두운 형체가 내밀어 주는 장갑 낀 손을 향해 손을 뻗지만, 떨어져 눈 덮인 바위에 세차게 부딪힌다. 바닥에는 피투성이가 된 해나가 눈을 뜬 채 누워 있고, 그 뒤로 베스가 떨어진다.
film.death_act3_2_jessica_liftshaft=랜턴을 치켜든 마이크가 승강기 통로 위쪽을 올려다본다. 그의 앞, 승강기 칸의 격자 바닥 위로 그녀의 몸이 떨어진다. 아래턱이 뜯겨 나가 있다. 마이크는 그녀를 응시하다가 손을 뻗고, 승강기 칸은 불꽃을 쏟으며 아래로 떨어져 나간다.
film.death_act5_2_matt_climb=안개 낀 숲에서 뿔 달린 사슴 무리를 피해 뒷걸음질하다가, 바위 끝을 헛디뎌 어둠 속으로 떨어진다. 그는 바위 위에 엎드린 채 쓰러져 있고, 입 아래에는 피가 고여 있다. 클로즈업: 뜬 눈이 눈물로 반짝인다.
film.death_act5_2_matt_wendigo=어둠 속, 겁에 질린 그의 눈을 클로즈업. 웬디고가 뒤에서 그를 붙잡아 사슬 사이에 매달린 갈고리에 억지로 꿴다. 갈고리가 턱을 아래에서 뚫고 입 밖으로 튀어나오고, 그는 피범벅이 된 얼굴로 그대로 매달려 있다.
film.death_act6_3_emily_eyegauge=웬디고가 그녀의 머리를 붙잡고 두 엄지를 눈에 쑤셔 넣는다. 얼굴로 피가 줄줄 흘러내리는 가운데 그녀는 비명을 지르다가, 웬디고의 손아귀에서 축 늘어진다.
film.death_act6_3_emily_oregrinder=눈 덮인 미끄럼 통로를 타고 미끄러져 그라인더의 투입구로 떨어지고, 가장자리에 매달린다. 손가락이 미끄러지자 가시 돋친 롤러 사이로 떨어진다. 비명을 지르고, 입에서 피가 쏟아지다가, 마침내 고개가 뒤로 젖혀진다.
film.death_act6_4_chris_lodgedoor=실내에서 애슐리가 고개를 들고 한 걸음 앞으로 나선다. 밖의 어둠 속에서 웬디고가 뒤에서 그를 붙잡아, 발톱으로 얼굴을 덮어 누르고 머리를 뜯어낸다. 머리는 몸 옆의 눈 위에 놓여 있다.
film.death_act6_4_chris_lodgedoor_ja=문 유리창 너머로 보이는 애슐리가 밖을 내다보며 한 걸음 앞으로 나선다. 밖에서 웬디고가 뒤에서 그를 붙잡아, 발톱으로 얼굴을 덮어 누르고 화면 밖 아래로 끌어 내린다. 웬디고는 카메라를 향해 으르렁거리고 사라지며, 어두운 숲만 남는다.
film.death_act6_4_chris_runtolodge_ashimpassive=어두운 눈밭에서 웬디고가 그를 짓눌러 머리를 뜯어낸다. 머리는 눈 덮인 현관 앞, 애슐리의 발치에 떨어진다. 피가 튄 애슐리는 얼굴을 찡그린 채 서서 아래를 내려다본다.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=어두운 숲, 땅바닥에서 올려다본 시점: 웬디고가 그의 위에 웅크리고 있다가, 눈을 번득이며 고개를 들고 떠난다. 피가 튀고 금방이라도 울 것 같은 애슐리의 클로즈업. 얼굴을 찡그리고 있다. 이어서 그녀는 선 채로 아래를 내려다본다.
film.death_act6_4_chris_runtolodge_ashscreams=어두운 눈밭에서 웬디고가 그를 짓눌러 머리를 뜯어낸다. 머리는 공중을 날아 눈 위를 구르다가 유리창이 달린 문 앞에서 멈춘다. 유리 너머에서 애슐리가 두 손으로 입을 틀어막고 울며 무릎을 꿇고 주저앉는다.
film.death_act6_4_chris_runtolodge_ashscreams_ja=어두운 숲, 땅바닥에서 올려다본 시점: 웬디고가 그의 위에 웅크리고 있다가, 눈을 번득이며 고개를 들고 떠난다. 문 유리창 너머로 애슐리가 다가와 두 손으로 입을 틀어막고 울며 무릎을 꿇고 주저앉고, 그녀 뒤로 한 남자가 나타난다.
film.death_act7_1_emily_shotbymike=감시 모니터 불빛만 비치는 어두운 방에서 마이크가 돌아서서 총을 들고 그녀에게 다가오고, 애슐리가 그 모습을 지켜본다. 마이크는 두 손으로 총을 들어 쏜다. 벽에 피가 튀고, 클로즈업으로 보이는 그녀의 왼쪽 눈은 피투성이 구멍이 되어 있다. 고개는 뒤로 젖혀지고, 입은 쩍 벌어져 있다.
film.death_act7_1_emily_shotbymike_ja=감시 모니터 불빛만 비치는 어두운 방에서 마이크가 돌아서서 총을 들고 그녀에게 다가오고, 애슐리가 그 모습을 지켜본다. 마이크는 두 손으로 총을 든다. 총을 쏘는 순간 화면이 코르크 보드의 지도(BLACKWOOD PINES MOUNTAINS)로 바뀌고, 지도에 피가 튄다. 이어서 어둠 속에서 부츠를 신은 그녀의 다리가 바닥으로 미끄러져 내린다.
film.death_act7_3_ashley_trapdoor_opened=그녀가 바닥문을 연다. 웬디고가 튀어나와, 무릎을 꿇은 그녀 위로 몸을 치켜세우고 긴 두 손으로 그녀의 머리를 움켜쥔다. 이어서 텅 빈 흙바닥 위로 축 늘어진 그녀의 손이 떨어지고, 뜯겨 나간 머리가 떨어져 구르다가 눈과 입을 벌린 채 멈춘다.
film.death_act7_3_ashley_trapdoor_opened_ja=그녀가 바닥문을 연다. 웬디고가 튀어나와, 무릎을 꿇은 그녀 위로 몸을 치켜세우고 긴 두 손으로 그녀의 머리를 움켜쥔다. 이어서 텅 빈 어두운 동굴 통로만 보인다.
film.death_act7_3_ashley_trapdoor_unbolted=그녀는 열린 바닥문에서 몇 걸음 떨어진 곳에 서 있다. 웬디고가 기어 나와 비명을 지르는 그녀의 머리를 잡고 바닥으로 짓누른다. 이어서 텅 빈 흙바닥 위로 축 늘어진 그녀의 손이 떨어지고, 뜯겨 나간 머리가 떨어져 구르다가 눈과 입을 벌린 채 멈춘다.
film.death_act7_3_ashley_trapdoor_unbolted_ja=그녀는 열린 바닥문에서 몇 걸음 떨어진 곳에 서 있다. 웬디고가 기어 나와 비명을 지르는 그녀의 머리를 잡고 바닥으로 짓누른다. 이어서 텅 빈 어둑한 광산 통로만 보인다.
film.death_act7_3_chris_trapdoor1=그가 바닥문을 연다. 웬디고가 튀어나와, 무릎을 꿇은 그의 위로 몸을 치켜세우고 긴 두 손으로 그의 머리를 비틀어 돌린다. 이어서 뜯겨 나간 그의 머리가 바닥에 떨어져, 이쪽을 향한 채 똑바로 선다. 안경은 비뚤어지고 금이 갔으며, 입은 벌어져 있다.
film.death_act7_3_chris_trapdoor1_ja=그가 바닥문을 연다. 웬디고가 튀어나와, 무릎을 꿇은 그의 위로 몸을 치켜세우고 그의 머리를 움켜쥔다. 이어서 머리 위의 어두운 나무 서까래만 보인다.
film.death_act7_3_chris_trapdoor2=그가 닫힌 바닥문을 내려다보는 사이, 그의 앞으로 웬디고가 뛰어내려 덮치고 그를 뒤로 넘어뜨려 짓누른다. 웬디고가 발톱으로 그의 목을 찢어 가르자 피가 솟구치고, 웬디고는 뜯겨 나간 그의 머리를 이쪽을 향하게 들어 올린다. 입은 벌어져 있다.
film.death_act7_3_chris_trapdoor2_ja=그가 닫힌 바닥문을 내려다보는 사이, 그의 앞으로 웬디고가 뛰어내려 덮치고 그를 뒤로 넘어뜨려 짓누른다. 이어서 머리 위의 어두운 나무 들보만 보인다.
film.death_act7_3_chris_tunnel1=나무 버팀목을 댄 광산 터널에서 그의 다리가 허공에서 버둥거리고, 나머지 몸은 위쪽 화면 밖에 있다. 피가 줄기를 이루며 쏟아져 내린다. 이어서 피가 튄 판자 앞으로 머리 없는 그의 몸이 바닥에 떨어진다.
film.death_act7_3_chris_tunnel1_ja=나무 버팀목을 댄 광산 터널에서 그의 다리가 허공에서 버둥거리고, 나머지 몸은 위쪽 화면 밖에 있다. 피가 줄기를 이루며 쏟아져 내린다. 이어서 피가 튄 판자 앞으로 그의 몸이 바닥에 떨어진다. 다리와 등만 보이고, 한 손이 움찔거린다.
film.death_act8_4_josh_wendigo=어두운 물속에서 웬디고가 솟구쳐 나와 긴 두 손으로 그의 머리를 움켜쥔다. 웬디고의 손가락이 두개골을 파고들자 그는 비명을 지른다. 웬디고가 계속 조이자 마침내 피가 터져 나와 화면 전체에 튄다.
film.death_act8_4_josh_wendigo_ja=어두운 물속에서 웬디고가 솟구쳐 나와 긴 두 손으로 그의 머리를 움켜쥔다. 웬디고의 손가락이 두개골을 파고들자 그는 비명을 지른다. 웬디고가 조이는 동안 시점이 그들에게서 위로 멀어지고, 어두운 물방울이 화면에 튄다.
film.death_act8_5_jessica_keepstill_timeout1=클로즈업: 등을 대고 누운 그녀가 비명을 지르고, 웬디고가 그녀의 머리를 붙잡고 갈고리 발톱이 달린 손가락을 입안에 억지로 밀어 넣는다. 웬디고가 아래턱을 뜯어내고, 송곳니가 난 그 입이 움직임이 멎은 그녀의 얼굴 바로 옆에 있다. 이어서 그녀는 아래턱이 없는 채로 불빛 속에 꼼짝 않고 누워 있다.
film.death_act8_5_jessica_keepstill_timeout1_ja=거의 새까만 화면: 카메라가 땅바닥에 꼼짝 않고 누운 몸을 따라 천천히 지나간다. 이어서 바로 가까이에서 웬디고의 갈비뼈와 머리가 어둠 속에서 드러난다.
film.death_act8_5_jessica_keepstill_timeout2=눈이 내리는 가운데 클로즈업: 등을 대고 누운 그녀가 비명을 지르고, 웬디고가 그녀의 머리를 붙잡고 갈고리 발톱이 달린 손가락을 입안에 억지로 밀어 넣는다. 웬디고는 아래턱을 뜯어내고, 피투성이에 이빨이 가득한 얼굴을 그녀의 얼굴에 가까이 들이민다. 이어서 그녀는 아래턱이 없는 채로 불빛 속 눈 위에 꼼짝 않고 누워 있다.
film.death_act8_5_jessica_keepstill_timeout2_ja=밤, 눈 덮인 바위 사이: 바로 가까이에서 웬디고의 갈고리 발톱이 달린 긴 팔다리가 누군가의 어두운 실루엣 위로 지나간다. 이어서 카메라가 텅 빈, 눈 덮인 바위 위를 천천히 떠돈다.
film.death_act8_5_jessica_leftbehind=나무 버팀목을 댄 터널에서 그녀가 랜턴을 들고 달린다. 웬디고가 그녀의 등에 뛰어올라 쓰러뜨린다. 클로즈업: 웬디고가 그녀의 머리를 붙잡고, 비명을 지르는 입안에 갈고리 발톱이 달린 손가락을 억지로 밀어 넣어 아래턱을 뜯어낸다. 이어서 그녀는 아래턱이 없는 채로 불빛 속에 꼼짝 않고 누워 있고, 그 위로 이빨이 가득한 웬디고의 머리가 휙 스쳐 지나간다.
film.death_act8_5_jessica_leftbehind_ja=거의 새까만 화면: 카메라가 땅바닥에 꼼짝 않고 누운 몸을 따라 천천히 지나간다. 이어서 앙상한 웬디고가 어둠 속을 네 발로 기어간다.
film.death_act8_5_jessica_timeout2=클로즈업: 등을 대고 누운 그녀가 비명을 지른다. 웬디고가 갈고리 발톱이 달린 한 손으로 그녀의 정수리를 붙잡고, 다른 손의 손가락을 입안에 억지로 밀어 넣는다.
film.death_act8_5_jessica_timeout2_ja=거의 새까만 화면: 카메라가 땅바닥에 꼼짝 않고 누운 몸을 따라 천천히 지나간다.
film.death_act8_5_matt_gate=눈이 내리는 가운데, 나무 벽에 난 불 켜진 출입구 위에 웬디고가 웅크리고 있다가 그를 향해 뛰어내린다. 그의 위에 웅크린 웬디고가 두 팔을 치켜들며 몸을 세우고 그의 얼굴을 짓뭉갠다. 클로즈업: 짓뭉개진 피투성이 얼굴이 눈 위에 놓여 있다.
film.death_act8_5_matt_gate_ja=눈이 내리는 가운데, 나무 벽에 난 불 켜진 출입구 위에 웬디고가 웅크리고 있다가 그를 향해 뛰어내린다. 등을 대고 쓰러진 그의 얼굴로 발톱이 뻗어 온다. 이어서 카메라가 재킷에 M 글자가 있는 그의 가슴에 머문다. 그는 꼼짝 않고 누워 있다.
film.death_act8_5_matt_keepstill_timeout1=나무 버팀목을 댄 터널에서 그가 랜턴을 들고 있다. 웬디고가 그에게 달려들어 쓰러뜨린다. 그의 위에 웅크린 웬디고가 두 팔을 치켜들며 몸을 세우고 그의 얼굴을 짓뭉갠다. 클로즈업: 짓뭉개진 피투성이 얼굴.
film.death_act8_5_matt_keepstill_timeout1_ja=나무 버팀목을 댄 터널에서 그가 랜턴을 들고 있다. 웬디고가 그에게 달려들어 쓰러뜨린다. 웬디고가 그의 위에 웅크리고, 발톱을 그의 얼굴로 뻗는다. 이어서 카메라가 재킷에 M 글자가 있는 그의 가슴에 머문다. 그는 꼼짝 않고 누워 있다.
film.death_act8_5_matt_keepstill_timeout2=눈이 내리는 가운데, 두 손을 드는 그의 위로 웬디고가 웅크리고 있다. 웬디고가 몸을 세우고 그의 얼굴을 짓뭉갠다. 클로즈업: 짓뭉개진 피투성이 얼굴.
film.death_act8_5_matt_keepstill_timeout2_ja=눈이 내리는 가운데, 한 손을 드는 그의 위로 웬디고가 기어서 넘어간다. 이어서 카메라가 재킷에 M 글자가 있는 그의 가슴에 머문다. 그는 꼼짝 않고 누워 있다.
film.death_act8_5_matt_timeout1=웬디고가 나무 들보를 타고 내려와 그에게 달려들어 바닥에 쓰러뜨린다. 한 손을 드는 그의 위에 웅크린 웬디고가 몸을 세우고 그의 얼굴을 짓뭉갠다. 클로즈업: 짓뭉개진 피투성이 얼굴.
film.death_act8_5_matt_timeout1_ja=웬디고가 나무 들보를 타고 내려와 그에게 달려들어 바닥에 쓰러뜨린다. 웬디고가 이를 드러내며 그의 위에 웅크린다. 이어서 카메라가 재킷에 M 글자가 있는 그의 가슴에 머문다. 그는 꼼짝 않고 누워 있다.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=산장 안, 천을 씌운 가구들 사이에서 웬디고가 바닥에서 벽으로 뛰어오르고, 방 안에 누르스름한 연무가 가득 찬다. 화염 폭발이 그녀를 엎드린 채로 바닥 위로 날려 보낸다. 그녀 뒤로 불길이 맹렬히 타오르는 가운데, 그녀는 꼼짝 않고 누워 있다.
film.death_act8_6_ashley_eyegauge=어깨에 나비 문신이 있는 웬디고가 그녀에게 달려들어 머리를 붙잡는다. 두 엄지를 그녀의 눈에 쑤셔 넣자 얼굴로 피가 흘러내리고, 이어서 나무 바닥에 누운 그녀의 피투성이 눈구멍에서 엄지를 뽑아낸다.
film.death_act8_6_emily_explosion=터져 나오는 불길 속, 나무 기둥들 뒤에서 웬디고가 으르렁거린다. 폭발이 그녀를 나무 바닥 위로 날려 보낸다. 그녀는 엎드려 누워 있고, 얼굴은 심하게 불에 타 있다.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=산장에서 웬디고가 포효하며 화면으로 달려들고, 이어서 벽에 붙어 선 그의 얼굴에 대고 비명을 지른다. 웬디고는 그의 머리를 붙잡고, 배를 발톱으로 그어 가른 뒤 방 건너편으로 내던진다. 그는 나무 기둥 밑동에 떨어진다.
film.death_act8_6_mike_lightbulb_ja=산장에서 웬디고가 비명을 지르며 화면으로 달려든다. 그가 웬디고의 가슴을 밀어내는 사이 웬디고는 그의 머리를 붙잡고, 얼굴에 대고 비명을 지른 뒤 그를 옆으로 내던진다. 이어서 뒷모습의 웬디고가 긴 두 팔을 활짝 벌린다.
film.death_act8_6_mike_explosion_unijured=산장에서 불덩이가 천을 씌운 가구가 놓인 방을 뚫고 터져 나와 홀을 휩쓸며 꽃병을 산산조각 낸다. 이어서 그는 불길 한가운데 바닥에 누워 있고, 얼굴은 심하게 불에 타 있다.
film.death_act8_6_sam_wendigo1=산장에서 웬디고의 갈고리 발톱이 달린 손이 그녀의 목을 잡아 들어 올리고 있다. 그녀는 숨을 헐떡이고, 입에서 피가 흐르며, 이마의 램프가 켜져 있다. 웬디고는 다른 팔로 그녀의 배를 두 번 꿰뚫고 놓아 버린다. 그녀는 바닥에 떨어져 움직이지 않는다.
film.death_act8_6_sam_wendigo1_ja=산장에서 웬디고가 그녀를 붙잡는다. 아래에서 올려다본 시점으로, 웬디고가 팔을 쭉 뻗어 그녀를 들어 올리고 있다. 그녀는 화면 가장자리의 어둡고 흐릿한 형체로 보인다. 웬디고는 고개를 뒤로 젖히며 비명을 지르고, 이어서 화면으로 달려든 뒤 네 발로 재빨리 달아난다.
film.4_3_being_watched_emilymatt_cctv_footage=모니터 화면: 고정된 카메라가 밤의 눈 덮인 돌담에 난 철문을 위에서 내려다본다. 에밀리가 그 문을 지나오고, 이어서 매트가 지나와 뒤로 문을 당겨 닫는다. 두 사람이 떠나가고, 내리는 눈 속에 철문만 텅 빈 채 서 있다.
film.act20_6_cctv_footage=모니터에 여섯 개의 카메라 화면: 매달린 톱날들 아래 작은 테이블에 크리스와 애슐리가 마주 앉아 있다. 크리스가 권총으로 위를 향해 두 번 쏜 뒤, 테이블 너머의 애슐리를 겨누었다가 총을 내린다. 다른 화면에는 촛불이 켜진 욕조 옆에 있는 타월 차림의 여자, 두 손이 머리 위로 묶인 채 벽 앞에 선 두 사람, 그리고 붉은색이 튄 테이블이 보인다.
film.smg_sting.1=영화실 스크린에 아무것도 찍히지 않은, 긁힌 필름 리더가 깜박이며 뒤죽박죽된 글자와 숫자가 번쩍인다.
film.smg_sting.2=촛불이 켜진 욕조 속 샘을 찍은 영상: 그녀가 어깨 너머로 힐끗 돌아보고, 욕조에서 나와 타월을 두른 채 서서 주위를 둘러본다.
film.smg_sting.3=거대한 회전 톱날이 두 팔을 머리 위로 올린 채 테이블에 누운 조쉬를 파고든다. 피가 뿜어져 나오고, 조쉬는 얼굴을 일그러뜨리며, 입에서 피가 터져 나오고, 테이블 아래로 피와 살점이 쏟아진다.
film.smg_sting.4=빈 필름 리더가 다시 깜박인다.
film.projectorghost_movie=벽에 깜박이는 오래된 영상: 벽난로 옆의 에밀리가 카메라에 대고 말하다가 애슐리를 출입구 안으로 떠민다. 안경 쓴 해나가 수줍게 미소 짓는다. 두 여자가, 이어서 애슐리가 어둠 속에서 히죽 웃는다. 해나가 블라우스 단추를 풀기 시작하다가 고개를 홱 돌린다.
film.projectorghost_scare=붉은 조명 속 안경 쓴 해나의 클로즈업. 미소 지으며 말하고 있다. 갑자기 시커먼 눈구멍에 피투성이 입을 쩍 벌린 소름 끼치는 하얀 얼굴이 번쩍 나타나고, 화면이 꺼진다.
film.projector_wendigo=벽에 오래된 흑백 영화: 간호사가 의자에 앉은 환자를 두고 떠난다. 환자는 몸부림쳐 풀려나 벽을 기어오르고, 천장을 기어 어둠 속으로 사라진다. 간호사가 빈 의자로 돌아오자 위에서 팔 하나가 그녀를 향해 내려오고, 섬광이 번쩍인 뒤 간호사는 사라지고 없다. 창백한 형체가 카메라로 달려들고, 화면이 옆으로 넘어간다.
film.hannah_wendigo_reveal=세피아 톤의 번쩍임: 검은 나비 문신이 있는 팔, 이어서 안경 쓴 해나가 두 손을 가슴께에 모은 채 카메라를 향해 희미하게 미소 짓는다.
film.newghosty_up=TV 화면에서 창백하고 섬뜩한 얼굴이 입을 크게 벌리고 비명을 지른다. 한순간, 그 얼굴이 눈가가 거뭇한 창백한 여자의 얼굴로 깜박이며 바뀐다.
film.sam_end_credits.1=창문 너머로, 밤의 어두운 침실. 휴대폰이 알람으로 켜진다: 06:00 AM, Work Alarm. 배경 화면은 개를 끌어안은 샘이다. 옆에는 약병들과 책 한 권, CREATURE MYTHS OF THE GREAT PLAINS. 샘은 돌아가는 천장 선풍기 아래 침대에 누워 있다. 그녀의 눈이 크게 뜨인다.
film.sam_end_credits.2=약병 하나가 떨어져 다른 책, THE WENDIGO LOG 옆으로 굴러간다. 샘은 침대 가장자리에 일어나 앉아 화면을 밀어 알람을 끈다. 엄지가 화면에 피를 묻히고, 팔뚝을 따라 피가 흘러내린다.
film.sam_end_credits.3=그녀가 팔뚝의 들쭉날쭉한 상처에 휴지를 대고 누르지만, 다시 피가 난다. 붉은 빛이 점점 그녀를 뒤덮는다. 그녀는 눈을 크게 뜨고 돌아본다.
film.sam_end_credits.4=어둠, 그리고 제목: UNTIL DAWN.
film.totem_events_of_the_past.1=긴 코트를 입고 목에 스카프를 두른 남자의 오래된 세피아 사진, 그 옆에 메모: NO ESCAPE. 털이 덥수룩하고 송곳니가 난 괴물과 갈고리 발톱이 달린 손의 스케치. 신문 헤드라인: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, 그리고 LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=MIRACLE MINERAL DISCOVERED라는 헤드라인 아래 광부들의 사진. RADIUM. 이어서 MINING DISASTER와 DEATH TOLL RISES, 그리고 검게 덧칠된 광부들의 사진.
film.totem_events_of_the_past.3=끔찍한 장면들이 번쩍인다: 피투성이 이와 잇몸, 금이 간 두개골, 핏발 선 눈의 피범벅이 된 얼굴, 날고기 위의 구더기. 벽에 휘갈겨 쓴 HUNGER CRAVING. HUMAN?이라고 적힌 엑스레이 사진.
film.totem_events_of_the_past.4=손으로 쓴 목록: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. 빨간 동그라미가 쳐진, 구부정하고 창백한 형체를 찍은 어두운 사진: CREATURE REPORTED. 송곳니가 난 괴물의 스케치와 TEETH GROW & SHARPEN WITH AGE, 그리고 깡마르고 팔다리가 긴 형체의 스케치. THE ONLY WAY에서 동그라미 친 FIRE로 이어지는 화살표. 종이가 불타오른다.
film.totem_events_of_the_past.5=밤: 눈 덮인 소나무 숲속에 불 켜진 나무 집. 회색 비니에 스웨터 차림의 베스와 안경을 쓰고 분홍색 패딩 재킷을 입은 해나가 손을 맞잡고 겁에 질려 숲을 달려, 안개 낀 벼랑 위로 나온다.
film.totem_events_of_the_past.6=부서진 표지판 CLIFF 옆 밧줄 울타리에서 두 사람이 겁에 질려 뒤를 돌아본다. 주황색 열화상 화면에는 두 사람이 나무들 사이에서 하얗게 빛나는 형체로 보인다. 벼랑 끝에서 손을 맞잡은 채 해나가 미끄러지고, 베스가 그녀를 붙잡지만 둘 다 떨어진다.
film.totem_events_of_the_past.7=등에 탱크를 멘 남자가 벼랑 끝으로 달려가고, 깡마르고 팔다리가 긴 괴물이 그를 향해 기어 온다. 그의 고글과, 송곳니가 난 괴물의 쩍 벌린 입을 클로즈업. 남자가 화염방사기로 괴물에게 불을 퍼붓는다. 괴물은 눈 위에서 몸부림치며 불타고, 불덩이가 부풀어 올라 화면을 가득 채운다.
film.causaleffect_act1_3_samattackedbycrow=철망 울타리 옆에서 까마귀가 샘을 향해 급강하한다. 샘은 몸을 숙이며 두 손으로 얼굴을 감싼다.
film.causaleffect_act2_1_mattlooksthroughtelescope=망원경 너머로: 눈 덮인 언덕 비탈에서 마이크가 모피로 테를 두른 코트를 입은 누군가를 꼭 껴안고 있다.
film.causaleffect_act2_2_minetunnel=어둠 속, 교차한 나무 들보 사이로 마이크가 몸을 기울이며 화면 안으로 들어와 주위를 둘러본다. 그의 뒤에는 흐릿한 누군가가 있다.
film.causaleffect_act2_4_samfindsbaseballbat=어두운 방에서 샘이 미소 지으며 야구 방망이를 휘두른다. 이어서 손전등 불빛을 받은 조쉬가 방망이를 들고 씩 웃는다.
film.causaleffect_act2_5_jessthroughwindow_pants=어둠 속 창가에서, 길고 앙상한 손이 비명을 지르는 제시카의 머리를 움켜쥐고 화면 밖으로 홱 끌어낸다.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=망원경 너머로: 암벽 아래 눈 덮인 바위들. 이어서 거의 캄캄한 가운데, 눈을 번득이는 수척하고 주름진 얼굴이 화면을 가득 채운다.
film.causaleffect_act3_2_bridgefail=밤, 마이크가 눈 덮인 작은 밧줄 다리 위로 달려 나간다. 발밑의 판자가 부러지고, 그는 아래로 떨어져 시야에서 사라진다.
film.causaleffect_act3_2_clifffail=눈 덮인 비탈에서 랜턴을 치켜든 마이크가 미끄러져 바위 아래로 곤두박질치며 굴러떨어진다.
film.causaleffect_act3_2_cliffsafe=바위투성이 비탈에서 랜턴을 손에 든 마이크가 조심스럽게 바위를 타고 내려간다.
film.causaleffect_act3_2_grabfencefail=위에서 내려다본 모습: 눈 덮인 비탈에서 마이크가 철망 울타리에 손을 뻗다가 미끄러져 아래쪽 눈밭에 등부터 떨어진다.
film.causaleffect_act3_2_grabrootfail=위에서 내려다본 모습: 눈 덮인 비탈에서 마이크가 굵은 나무뿌리에 매달리다가 미끄러져 아래쪽 눈밭에 등부터 떨어진다.
film.causaleffect_act3_2_jumpclifffail=밤, 랜턴을 손에 든 마이크가 바위 골짜기로 뛰어내려 세게 착지하고는 계속 기어오른다.
film.causaleffect_act3_2_mikefallsover=랜턴을 손에 든 마이크가 눈 덮인 숲 비탈을 달려 내려가다가 발이 걸려 앞으로 철퍼덕 엎어진다.
film.causaleffect_act3_2_mikeisfast=랜턴을 손에 든 마이크가 바위 사이의 눈 덮인 골짜기를 따라 이쪽을 향해 곧장 전력 질주한다.
film.causaleffect_act3_2_pipefail=랜턴을 높이 치켜든 마이크가 눈 덮인 굵은 파이프 위를 균형을 잡으며 걸어가다가, 미끄러져 거센 물살 속으로 떨어진다.
film.causaleffect_act3_2_shimmy=위에서 내려다본 모습: 마이크가 어두운 바위 사이로 내려간다. 이어서 한 손으로 바위를 붙잡은 채 가파른 암벽을 따라 옆으로 조금씩 이동한다.
film.causaleffect_act3_2_takestairs=랜턴을 손에 든 마이크가 나무 오두막으로 달려가, 눈 덮인 계단을 서둘러 올라 문 앞으로 간다.
film.causaleffect_act3_2_wendigointower_fast=조준경 너머로: 눈 속에 교차한 나무 들보. 십자선 옆으로 작고 회색인 무언가가 솟아오르며 화면에 들어온다.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=어둠 속에서 라이터 불꽃이 거친 판자를 비춘다. 판자 사이의 틈으로 크게 뜬 유리알 같은 두 눈이 밖을 응시한다.
film.causaleffect_act4_1_chrissavesash=철망 너머로, 매달린 전등 아래 누군가가 앉아 있다. 이어서 거대한 톱니 모양의 톱날, 그리고 그 옆 그늘 속에 체크무늬 셔츠를 입은 남자.
film.causaleffect_act4_2_mikebefriendswolf=마이크가 털이 덥수룩한 늑대 옆에 쪼그려 앉아 그 털을 쓰다듬는다.
film.causaleffect_act4_2_mikekickswolf=출입구에서 마이크가 늑대를 향해 발길질을 한다. 이어서 온통 더러워진 그가 랜턴을 치켜든 채 다른 손을 들어 올리며 얼굴을 찡그린다.
film.causaleffect_act4_2_mikelooksatswolf=마이크가 늑대를 향해 편 손바닥을 들어 보인다. 늑대는 고개를 숙이고 돌아서더니, 그의 바로 앞을 가까이 지나간다.
film.causaleffect_act4_2_mikestillhasmachete=금속 덫의 아가리에 닿아 있는 두 손. 마이크가 고통에 고개를 뒤로 젖힌다. 이어서 타일 깔린 방에서 그가 마체테를 집어 든다.
film.causaleffect_act4_2_wendigoheadinajar=커다란 유리병 속, 작은 눈이 번득이는 창백하고 얼룩덜룩한 머리.
film.causaleffect_act5_2_emgivesflaretomatt=나무 판잣집에서 에밀리가 매트에게 신호탄 총을 건넨다. 매트는 그것을 받아 내려다본다.
film.causaleffect_act5_3_chrisshotashley=작은 나무 테이블에서, 안경을 쓴 크리스가 울고 있는 애슐리에게 권총을 겨눈다.
film.causaleffect_act7_3_ashley_trapdoor=위에서 내려다본 모습: 반지를 끼고 니트 손목 워머를 한 손이 나무 바닥문의 빗장을 당겨 열고 손잡이를 붙잡는다.
film.intro_busride.1=어둠, 그리고 제목: UNTIL DAWN.
film.intro_busride.2=언뜻 얼굴이 비치는 사물들의 어두운 클로즈업 위로 오프닝 크레디트: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=흔들목마와 낡은 무전기 위로: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=해 질 녘, 위에서 내려다본 모습: 버스 한 대가 소나무 숲 사이로 눈 덮인 산길을 굽이굽이 올라간다.
film.intro_busride.5=버스 안, 샘이 창가에 앉아 있다. 그녀의 휴대폰 화면: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=휴대폰에서 영상이 재생된다: 체크무늬 셔츠를 입은 조쉬가 어두운 방에서 카메라에 대고 말한다.
