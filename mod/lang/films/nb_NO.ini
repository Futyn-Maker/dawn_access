; Dawn Access film descriptions — Norwegian. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Natt, ved en klippekant: Hannah, med briller og rosa jakke, holder fast i Beth, i grå lue og genser. Hannah snubler baklengs utfor kanten og drar Beth etter seg; nedenfor smeller Beth ned på en kampestein med ryggen først, og blod spruter.
film.death_act1_1_sisters_cliff.1=Nede i bunnen ligger Hannah med blodig ansikt og åpne øyne, Beths blodige kropp bak henne.
film.death_act1_1_sisters_cliff_alone=Natt, i en klippevegg: Hannahs hånd glipper ut av Beths grep, og hun ramler nedover steinene. Beth strekker seg opp etter en hånd i hanske som en mørk skikkelse ovenfor rekker ned, men faller og smeller ned på snødekte kampesteiner; nede i bunnen ligger Hannah blodig, med åpne øyne, mens Beth lander bak henne.
film.death_act3_2_jessica_liftshaft=Mike holder opp en lanterne og ser opp i en sjakt; kroppen hennes faller ned på gittergulvet i et heisbur foran ham, med underkjeven revet av. Han stirrer, strekker seg etter henne, og buret styrter ned i en gnistregn.
film.death_act5_2_matt_climb=Mens han rygger unna en flokk hjorter med gevir i en tåkete skog, trår han utfor en fjellkant og faller ned i mørket. Han ligger med ansiktet ned på en stein, med en blodpøl under munnen; i nærbilde glinser det åpne øyet hans av tårer.
film.death_act5_2_matt_wendigo=Nærbilde av de redde øynene hans i mørket. En wendigo griper ham bakfra og tvinger ham på en krok som henger blant kjettinger; kroken borer seg opp gjennom kjeven hans og ut av munnen, og han henger der med ansiktet dekket av blod.
film.death_act6_3_emily_eyegauge=En wendigo griper henne om hodet og presser tomlene inn i øynene hennes; hun skriker mens blodet strømmer nedover ansiktet, og henger så slapp i grepet dens.
film.death_act6_3_emily_oregrinder=Hun sklir nedover en snødekt renne ned i trakten på en kvern og klamrer seg til kanten; fingrene glipper, og hun faller ned mellom piggete valser, skrikende, mens blodet fosser fra munnen, til hodet faller bakover.
film.death_act6_4_chris_lodgedoor=Inne ser Ashley opp og tar et skritt fram. Ute i mørket griper en wendigo ham bakfra, med klørne over ansiktet hans, og river av ham hodet; hodet ligger i snøen ved siden av kroppen hans.
film.death_act6_4_chris_lodgedoor_ja=Ashley, sett gjennom glassrutene i en dør, ser ut og tar et skritt fram. Ute griper en wendigo ham bakfra, med klørne over ansiktet hans, og drar ham ned og ut av bildet; den snerrer mot kameraet og går sin vei, og igjen er bare den mørke skogen.
film.death_act6_4_chris_runtolodge_ashimpassive=I den mørke snøen holder en wendigo ham nede og river av ham hodet; hodet lander på den snødekte verandaen for føttene til Ashley. Ashley, nedsprutet med blod, står og ser ned og grimaserer.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Fra bakken i en mørk skog: en wendigo sitter på huk over ham, løfter hodet, med glinsende øyne, og går sin vei. Nærbilde av Ashley, nedsprutet med blod og på gråten, med en grimase; så står hun og ser ned.
film.death_act6_4_chris_runtolodge_ashscreams=I den mørke snøen holder en wendigo ham nede og river av ham hodet; hodet flyr gjennom luften og ruller i snøen til det blir liggende foran en dør med glassruter. Bak glasset presser Ashley hendene mot munnen og synker gråtende ned på kne.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Fra bakken i en mørk skog: en wendigo sitter på huk over ham, løfter hodet, med glinsende øyne, og går sin vei. Bak glassrutene i en dør kommer Ashley fram, presser hendene mot munnen og synker gråtende ned på kne, mens en mann dukker opp bak henne.
film.death_act7_1_emily_shotbymike=I et mørkt rom opplyst av overvåkingsskjermer snur Mike seg og kommer mot henne med et våpen mens Ashley ser på, løfter det med begge hender og skyter; blod spruter på veggen, og i nærbilde er hennes venstre øye et blodig hull, hodet kastet bakover, munnen på vidt gap.
film.death_act7_1_emily_shotbymike_ja=I et mørkt rom opplyst av overvåkingsskjermer snur Mike seg og kommer mot henne med et våpen mens Ashley ser på, og løfter det med begge hender. Ved skuddet skifter bildet til et kart på en korktavle (BLACKWOOD PINES MOUNTAINS), som blir nedsprutet med blod; så, i mørket, glir beina hennes i støvler ned på gulvet.
film.death_act7_3_ashley_trapdoor_opened=Hun åpner en fallem i gulvet; en wendigo hopper ut, reiser seg over henne mens hun står på kne, og klemmer de lange hendene sine rundt hodet hennes. Så faller den slappe hånden hennes inn i bildet på et tomt jordgulv, og det avrevne hodet hennes faller og ruller til det blir liggende, med åpne øyne og åpen munn.
film.death_act7_3_ashley_trapdoor_opened_ja=Hun åpner en fallem i gulvet; en wendigo hopper ut, reiser seg over henne mens hun står på kne, og klemmer de lange hendene sine rundt hodet hennes. Så ses bare en tom, mørk hulegang.
film.death_act7_3_ashley_trapdoor_unbolted=Hun står noen skritt fra en åpen fallem; en wendigo klatrer ut og tvinger henne ned med et grep om hodet mens hun skriker. Så faller den slappe hånden hennes inn i bildet på et tomt jordgulv, og det avrevne hodet hennes faller og ruller til det blir liggende, med åpne øyne og åpen munn.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Hun står noen skritt fra en åpen fallem; en wendigo klatrer ut og tvinger henne ned med et grep om hodet mens hun skriker. Så ses bare en tom, dunkel gruvegang.
film.death_act7_3_chris_trapdoor1=Han åpner en fallem; en wendigo hopper ut, reiser seg over ham mens han står på kne, og vrir hodet hans rundt i de lange hendene sine. Så faller det avrevne hodet hans ned på gulvet og blir stående oppreist, vendt mot betrakteren: brillene skjeve og sprukne, munnen åpen.
film.death_act7_3_chris_trapdoor1_ja=Han åpner en fallem; en wendigo hopper ut, reiser seg over ham mens han står på kne, og griper ham om hodet. Så ses bare mørke taksperrer av tre ovenfor.
film.death_act7_3_chris_trapdoor2=Mens han ser ned på en lukket fallem, slipper en wendigo seg ned foran ham, kaster seg over ham og holder ham nede på ryggen. Den flenger opp strupen hans med klørne; blodet fosser, og den løfter det avrevne hodet hans så det vender mot betrakteren, med åpen munn.
film.death_act7_3_chris_trapdoor2_ja=Mens han ser ned på en lukket fallem, slipper en wendigo seg ned foran ham, kaster seg over ham og holder ham nede på ryggen. Så ses bare mørke trebjelker ovenfor.
film.death_act7_3_chris_tunnel1=I en tømmeravstivet gruvetunnel sparker beina hans i løse luften, resten av ham utenfor bildet ovenfor, mens blodstråler renner ned. Så faller den hodeløse kroppen hans i bakken foran blodstenkte planker.
film.death_act7_3_chris_tunnel1_ja=I en tømmeravstivet gruvetunnel sparker beina hans i løse luften, resten av ham utenfor bildet ovenfor, mens blodstråler renner ned. Så faller kroppen hans i bakken foran blodstenkte planker; bare beina og ryggen hans ses, og en hånd rykker til.
film.death_act8_4_josh_wendigo=En wendigo farer opp av mørkt vann og klemmer begge de lange hendene sine om hodet hans. Han skriker mens fingrene dens presser seg inn i kraniet hans; den klemmer til blodet spruter ut og sprøyter over bildet.
film.death_act8_4_josh_wendigo_ja=En wendigo farer opp av mørkt vann og klemmer begge de lange hendene sine om hodet hans. Han skriker mens fingrene dens presser seg inn i kraniet hans; mens den klemmer, løfter bildet seg bort fra dem, og mørke dråper stenker over det.
film.death_act8_5_jessica_keepstill_timeout1=Nærbilde: hun ligger på ryggen og skriker mens en wendigo griper henne om hodet og tvinger fingrene sine med klør inn i munnen hennes; den river av henne underkjeven, gapet dens med hoggtenner ved siden av det stivnede ansiktet hennes. Så ligger hun urørlig i ildskjæret, underkjeven borte.
film.death_act8_5_jessica_keepstill_timeout1_ja=Nesten svart: kameraet glir sakte langs en kropp som ligger stille på bakken; så trer en wendigos ribbein og hode fram av mørket like ved.
film.death_act8_5_jessica_keepstill_timeout2=Nærbilde, i snøfall: hun ligger på ryggen og skriker mens en wendigo griper henne om hodet og tvinger fingrene sine med klør inn i munnen hennes; den river av henne underkjeven og fører det blodige ansiktet sitt, fullt av tenner, tett inntil hennes. Så ligger hun urørlig i snøen i ildskjæret, underkjeven borte.
film.death_act8_5_jessica_keepstill_timeout2_ja=Natt, blant snødekte steiner: i nærbilde beveger en wendigos lange lemmer med klør seg forbi over noens mørke silhuett; så glir kameraet sakte over tomme, snødekte steiner.
film.death_act8_5_jessica_leftbehind=I en tømmeravstivet tunnel løper hun med en lanterne; en wendigo hopper opp på ryggen hennes og feller henne. I nærbilde griper den henne om hodet, tvinger fingrene sine med klør inn i den skrikende munnen hennes og river av henne underkjeven; så ligger hun urørlig i ildskjæret, underkjeven borte, mens hodet dens, fullt av tenner, farer forbi over henne.
film.death_act8_5_jessica_leftbehind_ja=Nesten svart: kameraet glir sakte langs en kropp som ligger stille på bakken; så kryper en knoklete wendigo på alle fire gjennom mørket.
film.death_act8_5_jessica_timeout2=Nærbilde: hun ligger på ryggen og skriker; en wendigo griper henne om issen med den ene hånden med klør og tvinger fingrene på den andre inn i munnen hennes.
film.death_act8_5_jessica_timeout2_ja=Nesten svart: kameraet glir sakte langs en kropp som ligger stille på bakken.
film.death_act8_5_matt_gate=Mens det snør, sitter en wendigo på huk over en opplyst døråpning i en trevegg og hopper så ned mot ham. På huk over ham reiser den seg med armene hevet og knuser ansiktet hans; i nærbilde ligger ansiktet hans knust og blodig i snøen.
film.death_act8_5_matt_gate_ja=Mens det snør, sitter en wendigo på huk over en opplyst døråpning i en trevegg og hopper så ned mot ham. Der han ligger på ryggen, strekker klørne dens seg mot ansiktet hans; så dveler kameraet ved brystet hans, med bokstaven M på jakken, mens han ligger stille.
film.death_act8_5_matt_keepstill_timeout1=I en tømmeravstivet tunnel holder han en lanterne; en wendigo hopper på ham og slår ham over ende. På huk over ham reiser den seg med armene hevet og knuser ansiktet hans; i nærbilde ligger ansiktet hans knust og blodig.
film.death_act8_5_matt_keepstill_timeout1_ja=I en tømmeravstivet tunnel holder han en lanterne; en wendigo hopper på ham og slår ham over ende. Den sitter på huk over ham, med klørne strakt ut mot ansiktet hans; så dveler kameraet ved brystet hans, med bokstaven M på jakken, mens han ligger stille.
film.death_act8_5_matt_keepstill_timeout2=I snøfall sitter en wendigo på huk over ham mens han løfter hendene; den reiser seg og knuser ansiktet hans. I nærbilde ligger ansiktet hans knust og blodig.
film.death_act8_5_matt_keepstill_timeout2_ja=I snøfall kryper en wendigo over ham idet han løfter en hånd; så dveler kameraet ved brystet hans, med bokstaven M på jakken, mens han ligger stille.
film.death_act8_5_matt_timeout1=En wendigo klatrer ned langs tømmerbjelker, kaster seg mot ham og slår ham i bakken. På huk over ham, mens han løfter en hånd, reiser den seg og knuser ansiktet hans; i nærbilde ligger ansiktet hans knust og blodig.
film.death_act8_5_matt_timeout1_ja=En wendigo klatrer ned langs tømmerbjelker, kaster seg mot ham og slår ham i bakken. Den sitter på huk over ham med blottede tenner; så dveler kameraet ved brystet hans, med bokstaven M på jakken, mens han ligger stille.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=I hytta, blant møbler dekket av lakener, hopper en wendigo fra gulvet opp på veggen mens en gulaktig dis fyller rommet. En eksplosjon av ild slynger henne med ansiktet ned bortover gulvet; hun ligger stille mens flammene raser bak henne.
film.death_act8_6_ashley_eyegauge=En wendigo med en sommerfugltatovering på skulderen kaster seg mot henne og griper henne om hodet. Den presser tomlene inn i øynene hennes, og blodet strømmer nedover ansiktet hennes; så trekker den tomlene ut av de blodige øyehulene mens hun ligger på et tregulv.
film.death_act8_6_emily_explosion=Midt i oppblussende ild snerrer en wendigo bak trestolper. Eksplosjonen slynger henne bortover et tregulv; hun ligger på magen med ansiktet stygt forbrent.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=I hytta brøler en wendigo rett mot betrakteren og skriker ham så i ansiktet mens han står inntil en vegg. Den griper ham om hodet, flenger ham over magen og slenger ham tvers over rommet; han faller om ved foten av en tresøyle.
film.death_act8_6_mike_lightbulb_ja=I hytta skriker en wendigo rett mot betrakteren. Den griper ham om hodet mens han presser mot brystet dens, skriker ham i ansiktet og slenger ham til side; så, sett bakfra, brer den de lange armene sine vidt ut.
film.death_act8_6_mike_explosion_unijured=I hytta farer en ildkule gjennom et rom med møbler dekket av lakener, feier gjennom hallen og knuser en vase. Så ligger han på gulvet midt i flammene, med ansiktet stygt forbrent.
film.death_act8_6_sam_wendigo1=I hytta holder en wendigos hånd med klør henne oppe etter strupen; hun gisper, blod renner fra munnen, og hodelykten hennes er tent. Den driver den andre armen sin gjennom magen hennes to ganger og slipper taket; hun faller ned på gulvet og blir liggende stille.
film.death_act8_6_sam_wendigo1_ja=I hytta griper en wendigo henne. Sett nedenfra holder den henne opp i strak arm, en mørk, uskarp flekk i kanten av bildet, og skriker med hodet kastet bakover; så kaster den seg mot betrakteren og piler av gårde på alle fire.
film.4_3_being_watched_emilymatt_cctv_footage=På en skjerm ser et fast kamera ned på en jernport i en snødekt steinmur om natten: Emily kommer gjennom den, så Matt, som drar porten igjen etter seg; begge går sin vei, og porten står tom i snøfallet.
film.act20_6_cctv_footage=På skjermene, seks kamerabilder: Chris og Ashley sitter overfor hverandre ved et lite bord under hengende sagblader; Chris skyter to ganger oppover med et våpen, sikter så over bordet mot Ashley og senker det. Andre bilder viser en kvinne i håndkle ved et badekar i levende lys, og to mennesker med hendene bundet over hodet mot en vegg, deretter et bord nedsprutet med rødt.
film.smg_sting.1=På lerretet i kinorommet flimrer en tom, ripete filmremse med glimt av bokstaver og tall om hverandre.
film.smg_sting.2=Opptak av Sam i badekaret i levende lys: hun kaster et blikk over skulderen, stiger opp og står svøpt i et håndkle mens hun ser seg omkring.
film.smg_sting.3=Et enormt roterende sagblad skjærer inn i Josh, som ligger på et bord med armene over hodet; blodet spruter, han grimaserer, blod fosser ut av munnen hans, og blod og kjøttfiller renner ned under bordet.
film.smg_sting.4=Den tomme filmremsen flimrer igjen.
film.projectorghost_movie=På veggen, gamle flimrende opptak: Emily, ved en peis, snakker til kameraet og dytter så Ashley gjennom en døråpning; Hannah, med briller, smiler sjenert; to jenter, og så Ashley, gliser ut fra mørket; Hannah begynner å kneppe opp blusen og vender så hodet brått bort.
film.projectorghost_scare=Et rødt opplyst nærbilde av Hannah, med briller, som smiler og snakker; plutselig blinker et grufullt hvitt ansikt med mørke øyehuler og en blodig, gapende munn opp, og skjermen blir svart.
film.projector_wendigo=På veggen, en gammel svart-hvitt-film: en sykepleier forlater en pasient som sitter i en stol; han kjemper seg løs, klatrer opp veggen og kryper bortover taket inn i mørket. Hun kommer tilbake til den tomme stolen, en arm strekker seg ned mot henne ovenfra, og etter et glimt er hun borte; en blek skikkelse kaster seg mot kameraet, og bildet velter over på siden.
film.hannah_wendigo_reveal=Et glimt i sepia: en arm med en svart sommerfugltatovering, så Hannah, med briller og hendene ved brystet, som smiler svakt til kameraet.
film.newghosty_up=På TV-skjermen skriker et blekt, likaktig ansikt med munnen sperret vidt opp; et øyeblikk flimrer det over til en blek kvinnes ansikt med mørke ringer rundt øynene.
film.sam_end_credits.1=Gjennom et vindu, et mørkt soverom om natten. En telefon lyser opp med en alarm, 06:00 AM, Work Alarm, med et bakgrunnsbilde av Sam som klemmer en hund, ved siden av pilleglass og en bok, CREATURE MYTHS OF THE GREAT PLAINS. Sam ligger på sengen under en roterende takvifte; hun sperrer øynene opp.
film.sam_end_credits.2=Et pilleglass faller og ruller ved siden av en annen bok, THE WENDIGO LOG. Sam setter seg opp på sengekanten og sveiper bort alarmen; tommelen hennes smører blod utover skjermen, og blod renner nedover underarmen hennes.
film.sam_end_credits.3=Hun presser et papirlommetørkle mot et taggete kutt på underarmen, men det blør igjen. Rødt lys stiger opp over henne; hun snur seg med oppsperrede øyne.
film.sam_end_credits.4=Mørke, så tittelen: UNTIL DAWN.
film.totem_events_of_the_past.1=Et gammelt sepiabilde av en mann i lang frakk og halstørkle, ved siden av en lapp: NO ESCAPE. Skisser av en lodden skapning med hoggtenner og av en hånd med klør; overskrifter: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, og LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Et bilde av gruvearbeidere under overskriften MIRACLE MINERAL DISCOVERED; RADIUM; så MINING DISASTER og DEATH TOLL RISES, og et bilde av gruvearbeidere rablet over med svart.
film.totem_events_of_the_past.3=Blodige glimt: blodige tenner og tannkjøtt, en sprukken hodeskalle, et blodtilsølt ansikt med et blodskutt øye, fluelarver på rått kjøtt. HUNGER CRAVING rablet på en vegg; et røntgenbilde merket HUMAN?
film.totem_events_of_the_past.4=En håndskrevet liste: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Et mørkt bilde av en krumbøyd, blek skikkelse, ringet inn med rødt: CREATURE REPORTED. Skisser av en skapning med hoggtenner, TEETH GROW & SHARPEN WITH AGE, og av en utmagret skikkelse med lange lemmer. THE ONLY WAY, en pil til FIRE, ringet inn; siden brenner.
film.totem_events_of_the_past.5=Natt: et opplyst trehus blant snødekte furuer. Beth, i grå lue og genser, og Hannah, med briller og en rosa vattert jakke, løper i redsel gjennom skogen, hånd i hånd, ut på en tåkete klippetopp.
film.totem_events_of_the_past.6=Ved et taugjerde ved siden av et knekt skilt, CLIFF, ser de seg tilbake i redsel; et oransje varmebilde viser dem som lysende hvite skikkelser mellom trærne. Hånd i hånd ved kanten glir Hannah utfor; Beth griper henne, og begge faller.
film.totem_events_of_the_past.7=En mann med tanker på ryggen løper til klippekanten mens en utmagret skapning med lange lemmer kryper mot ham; nærbilder av vernebrillene hans og av den gapende kjeften dens med hoggtenner. Han overøser den med ild fra flammekasteren sin; den brenner og kaster seg rundt på snøen, og en ildkule sveller ut til den fyller skjermen.
film.causaleffect_act1_3_samattackedbycrow=Ved et nettinggjerde stuper en kråke mot Sam; hun dukker seg med hendene opp mot ansiktet.
film.causaleffect_act2_1_mattlooksthroughtelescope=Gjennom et teleskop: i en snødekt li klemmer Mike noen i en pelskantet frakk tett inntil seg.
film.causaleffect_act2_2_minetunnel=I mørket, mellom kryssende tømmerbjelker, lener Mike seg inn i bildet og ser seg rundt, med en uskarp skikkelse bak seg.
film.causaleffect_act2_4_samfindsbaseballbat=I et mørkt rom svinger Sam smilende en baseballkølle; så holder Josh, opplyst av en lommelykt, en kølle og gliser.
film.causaleffect_act2_5_jessthroughwindow_pants=Ved et vindu i mørket griper en lang, knoklete hånd den skrikende Jessica om hodet og rykker henne ut av bildet.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Gjennom et teleskop: snødekte steiner under en fjellvegg; så, i nesten mørke, fyller et utmagret, rynkete ansikt med glinsende øyne bildet.
film.causaleffect_act3_2_bridgefail=Om natten løper Mike ut på en liten snødekt taubro; en planke knekker under ham, og han faller ut av syne.
film.causaleffect_act3_2_clifffail=I en snødekt skråning sklir Mike, med lanternen løftet, og slår kollbøtte nedover steinene.
film.causaleffect_act3_2_cliffsafe=I en steinete skråning klatrer Mike, med en lanterne i hånden, forsiktig ned over steinene.
film.causaleffect_act3_2_grabfencefail=Sett ovenfra: Mike strekker seg etter et nettinggjerde i en snødekt skråning, sklir og faller på ryggen i snøen nedenfor.
film.causaleffect_act3_2_grabrootfail=Sett ovenfra: Mike klamrer seg til en tykk rot i en snødekt skråning, sklir og faller på ryggen i snøen nedenfor.
film.causaleffect_act3_2_jumpclifffail=Om natten hopper Mike, med en lanterne i hånden, ned i en steinete kløft, lander hardt og klyver videre.
film.causaleffect_act3_2_mikefallsover=Mike løper, med en lanterne i hånden, ned en snødekt, skogkledd skråning, snubler og faller flatt på ansiktet.
film.causaleffect_act3_2_mikeisfast=Mike spurter, med en lanterne i hånden, gjennom en snødekt kløft mellom steiner, rett mot betrakteren.
film.causaleffect_act3_2_pipefail=Mike balanserer, med lanternen høyt hevet, bortover et tykt, snødekt rør, sklir av og stuper ned i fossende vann.
film.causaleffect_act3_2_shimmy=Sett ovenfra: Mike klatrer ned mellom mørke steiner; så karer han seg sidelengs langs en bratt fjellvegg mens han holder seg fast med én hånd.
film.causaleffect_act3_2_takestairs=Mike løper, med en lanterne i hånden, bort til en liten trebu og skynder seg opp de snødekte trappetrinnene til døren.
film.causaleffect_act3_2_wendigointower_fast=Gjennom et kikkertsikte: kryssende trebjelker i snøen; ved siden av trådkorset stiger noe lite og grått inn i bildet.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=I mørket lyser flammen fra en lighter opp grove planker; gjennom en sprekk mellom dem stirrer et par store, glassaktige øyne ut.
film.causaleffect_act4_1_chrissavesash=Gjennom netting ses noen som sitter under en hengelampe; så et enormt tannet sagblad, og ved siden av det, i skyggen, en mann i rutete skjorte.
film.causaleffect_act4_2_mikebefriendswolf=Mike setter seg på huk ved siden av en lodden ulv og stryker den over pelsen.
film.causaleffect_act4_2_mikekickswolf=I en døråpning sparker Mike etter en ulv; så, skitten og med lanternen løftet, holder han opp den andre hånden og grimaserer.
film.causaleffect_act4_2_mikelooksatswolf=Mike holder en åpen hånd fram mot en ulv; den senker hodet, vender seg bort og går så tett forbi rett foran ham.
film.causaleffect_act4_2_mikestillhasmachete=Hender ved kjevene på en metallfelle; Mike kaster hodet bakover av smerte. I et flislagt rom plukker han så opp en machete.
film.causaleffect_act4_2_wendigoheadinajar=Et blekt, flekkete hode med bittesmå glinsende øyne i en stor glasskrukke.
film.causaleffect_act5_2_emgivesflaretomatt=I et treskur rekker Emily en signalpistol til Matt; han tar den og ser ned på den.
film.causaleffect_act5_3_chrisshotashley=Ved et lite trebord sikter Chris, med briller, med en pistol mot Ashley, som gråter.
film.causaleffect_act7_3_ashley_trapdoor=Sett ovenfra: en hånd med en ring og en strikket pulsvarmer trekker slåen fra på en fallem av tre og griper om håndtaket.
film.intro_busride.1=Mørke, så tittelen: UNTIL DAWN.
film.intro_busride.2=Åpningstekster over dunkle nærbilder av gjenstander der man skimter ansikter: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Over en gyngehest og et gammelt radioapparat: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=I solnedgangen, sett ovenfra: en buss snor seg oppover en snødekt fjellvei mellom furutrærne.
film.intro_busride.5=På bussen sitter Sam ved vinduet; på telefonen hennes: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Telefonen hennes spiller av en video: Josh, i rutete skjorte, snakker til kameraet i et mørkt rom.
