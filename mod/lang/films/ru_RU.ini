; Dawn Access film descriptions — Russian. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Ночь, край обрыва: Ханна в очках и розовой куртке держится за Бет в серой вязаной шапке и свитере. Ханна оступается и падает спиной с обрыва, увлекая за собой Бет; внизу Бет с размаху бьётся спиной о валун, брызжет кровь.
film.death_act1_1_sisters_cliff.1=Внизу лежит Ханна, лицо в крови, глаза открыты; позади неё окровавленная Бет.
film.death_act1_1_sisters_cliff_alone=Ночь, отвесная скала: рука Ханны выскальзывает из руки Бет, и Ханна катится вниз по камням. Бет тянется к руке в перчатке, которую протягивает сверху тёмная фигура, но срывается и с размаху падает на заснеженные валуны; внизу лежит окровавленная Ханна с открытыми глазами, а позади неё падает Бет.
film.death_act3_2_jessica_liftshaft=Майк с поднятым фонарём смотрит вверх по шахте; её тело падает перед ним на решётчатый пол клети лифта, нижняя челюсть оторвана. Он в ужасе смотрит, тянется к ней — и клеть с дождём искр срывается вниз.
film.death_act5_2_matt_climb=Пятясь от стада рогатых оленей в туманном лесу, он оступается с края скалы и падает в темноту. Он лежит лицом вниз на камне, под ртом лужа крови; крупно — его открытый глаз, полный слёз.
film.death_act5_2_matt_wendigo=Крупно — его испуганные глаза в темноте. Вендиго хватает его сзади и насаживает на крюк, висящий среди цепей: крюк пробивает челюсть снизу и выходит изо рта; он висит, лицо залито кровью.
film.death_act6_3_emily_eyegauge=Вендиго хватает её за голову и вдавливает большие пальцы ей в глаза; она кричит, по лицу льётся кровь, затем она безвольно обвисает у него в руках.
film.death_act6_3_emily_oregrinder=Она съезжает по заснеженному жёлобу в бункер дробилки и цепляется за край; пальцы соскальзывают, и она падает между шипастыми валами — кричит, изо рта льётся кровь, пока её голова не запрокидывается.
film.death_act6_4_chris_lodgedoor=В доме Эшли поднимает глаза и шагает вперёд. Снаружи, в темноте, вендиго хватает его сзади, накрыв лицо когтистой лапой, и отрывает ему голову; голова лежит на снегу рядом с телом.
film.death_act6_4_chris_lodgedoor_ja=Эшли видна сквозь стёкла двери: она смотрит наружу и шагает вперёд. Снаружи вендиго хватает его сзади, накрыв лицо когтистой лапой, и утягивает вниз, из кадра; рычит в камеру и уходит — остаётся тёмный лес.
film.death_act6_4_chris_runtolodge_ashimpassive=В темноте на снегу вендиго прижимает его к земле и отрывает ему голову; голова падает на заснеженное крыльцо к ногам Эшли. Эшли, забрызганная кровью, стоит и смотрит вниз, скривившись.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=С земли, в тёмном лесу: вендиго склонился над ним, поднимает голову с блестящими глазами и уходит. Крупно — Эшли, забрызганная кровью, со слезами на глазах, морщится; затем она стоит и смотрит вниз.
film.death_act6_4_chris_runtolodge_ashscreams=В темноте на снегу вендиго прижимает его к земле и отрывает ему голову; голова пролетает по воздуху и, прокатившись по снегу, замирает перед застеклённой дверью. За стеклом Эшли прижимает ладони ко рту и, плача, опускается на колени.
film.death_act6_4_chris_runtolodge_ashscreams_ja=С земли, в тёмном лесу: вендиго склонился над ним, поднимает голову с блестящими глазами и уходит. За стёклами двери Эшли подходит, прижимает ладони ко рту и, плача, опускается на колени; позади неё появляется мужчина.
film.death_act7_1_emily_shotbymike=Тёмная комната, светятся мониторы наблюдения: Майк оборачивается и идёт к ней с пистолетом, Эшли смотрит; он поднимает оружие обеими руками и стреляет — кровь брызгает на стену, и крупно: на месте её левого глаза кровавая рана, голова запрокинута, рот широко открыт.
film.death_act7_1_emily_shotbymike_ja=Тёмная комната, светятся мониторы наблюдения: Майк оборачивается и идёт к ней с пистолетом, Эшли смотрит; он поднимает оружие обеими руками. В момент выстрела в кадре — карта на пробковой стене (BLACKWOOD PINES MOUNTAINS), на неё брызжет кровь; затем в темноте на пол сползают ноги в ботинках.
film.death_act7_3_ashley_trapdoor_opened=Она открывает люк в полу; оттуда выпрыгивает вендиго и, нависнув над ней, стоящей на коленях, обхватывает её голову длинными руками. Затем на пустой земляной пол безвольно падает её рука, а следом её оторванная голова; прокатившись, она замирает с открытыми глазами и ртом.
film.death_act7_3_ashley_trapdoor_opened_ja=Она открывает люк в полу; оттуда выпрыгивает вендиго и, нависнув над ней, стоящей на коленях, обхватывает её голову длинными руками. Затем видно лишь пустой тёмный проход в пещере.
film.death_act7_3_ashley_trapdoor_unbolted=Она стоит в нескольких шагах от открытого люка; оттуда вылезает вендиго и за голову пригибает её к земле, она кричит. Затем на пустой земляной пол безвольно падает её рука, а следом её оторванная голова; прокатившись, она замирает с открытыми глазами и ртом.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Она стоит в нескольких шагах от открытого люка; оттуда вылезает вендиго и за голову пригибает её к земле, она кричит. Затем видно лишь пустой полутёмный проход шахты.
film.death_act7_3_chris_trapdoor1=Он открывает люк; оттуда выпрыгивает вендиго и, нависнув над ним, стоящим на коленях, выворачивает ему голову длинными руками. Затем его оторванная голова падает на пол и остаётся стоять лицом к зрителю: очки перекошены и треснули, рот открыт.
film.death_act7_3_chris_trapdoor1_ja=Он открывает люк; оттуда выпрыгивает вендиго и, нависнув над ним, стоящим на коленях, хватает его за голову. Затем видны лишь тёмные деревянные балки наверху.
film.death_act7_3_chris_trapdoor2=Он смотрит на закрытый люк; перед ним сверху спрыгивает вендиго, бросается на него и валит на спину. Вендиго когтями разрывает ему горло, хлещет кровь; затем поднимает его оторванную голову лицом к зрителю, рот открыт.
film.death_act7_3_chris_trapdoor2_ja=Он смотрит на закрытый люк; перед ним сверху спрыгивает вендиго, бросается на него и валит на спину. Затем видны лишь тёмные деревянные балки наверху.
film.death_act7_3_chris_tunnel1=В туннеле шахты с деревянной крепью его ноги дёргаются в воздухе — остальное скрыто вверху, — и сверху льются струи крови. Затем перед забрызганными кровью досками на землю падает его тело без головы.
film.death_act7_3_chris_tunnel1_ja=В туннеле шахты с деревянной крепью его ноги дёргаются в воздухе — остальное скрыто вверху, — и сверху льются струи крови. Затем перед забрызганными кровью досками на землю падает его тело; видны только ноги и спина, рука вздрагивает.
film.death_act8_4_josh_wendigo=Из тёмной воды вырывается вендиго и обхватывает его голову длинными руками. Пальцы впиваются ему в череп, он кричит; вендиго сжимает голову, пока не брызжет кровь, заливая изображение.
film.death_act8_4_josh_wendigo_ja=Из тёмной воды вырывается вендиго и обхватывает его голову длинными руками. Пальцы впиваются ему в череп, он кричит; вендиго сжимает голову, изображение уходит вверх, и по нему разлетаются тёмные брызги.
film.death_act8_5_jessica_keepstill_timeout1=Крупный план: она лежит на спине и кричит, а вендиго держит её за голову и засовывает когтистые пальцы ей в рот; он отрывает ей нижнюю челюсть, и его клыкастая пасть нависает у её застывшего лица. Затем она неподвижно лежит в отсветах огня, без нижней челюсти.
film.death_act8_5_jessica_keepstill_timeout1_ja=Почти полная темнота: камера медленно скользит вдоль неподвижно лежащего на земле тела; затем совсем рядом из темноты проступают рёбра и голова вендиго.
film.death_act8_5_jessica_keepstill_timeout2=Крупный план, идёт снег: она лежит на спине и кричит, а вендиго держит её за голову и засовывает когтистые пальцы ей в рот; он отрывает ей нижнюю челюсть и склоняется к ней окровавленной зубастой мордой. Затем она неподвижно лежит в снегу в отсветах огня, без нижней челюсти.
film.death_act8_5_jessica_keepstill_timeout2_ja=Ночь, заснеженные камни: совсем близко над чьим-то тёмным силуэтом проходят длинные когтистые конечности вендиго; затем камера медленно плывёт над пустыми заснеженными камнями.
film.death_act8_5_jessica_leftbehind=В туннеле с деревянными подпорками она бежит с фонарём; вендиго прыгает ей на спину и валит её. Крупный план: он держит её за голову, засовывает когтистые пальцы ей в кричащий рот и отрывает ей нижнюю челюсть; затем она неподвижно лежит в отсветах огня, без нижней челюсти, а над ней мелькает его зубастая голова.
film.death_act8_5_jessica_leftbehind_ja=Почти полная темнота: камера медленно скользит вдоль неподвижно лежащего на земле тела; затем во тьме на четвереньках ползёт костлявый вендиго.
film.death_act8_5_jessica_timeout2=Крупный план: она лежит на спине и кричит; вендиго одной когтистой рукой держит её за макушку, а пальцы другой засовывает ей в рот.
film.death_act8_5_jessica_timeout2_ja=Почти полная темнота: камера медленно скользит вдоль неподвижно лежащего на земле тела.
film.death_act8_5_matt_gate=Идёт снег; вендиго сидит на корточках над освещённым дверным проёмом в деревянной стене и прыгает на него сверху. Вендиго нависает над ним, выпрямляется, вскинув руки, и разбивает ему лицо всмятку; крупным планом — его размозжённое, окровавленное лицо на снегу.
film.death_act8_5_matt_gate_ja=Идёт снег; вендиго сидит на корточках над освещённым дверным проёмом в деревянной стене и прыгает на него сверху. Он лежит на спине, когти тянутся к его лицу; затем камера задерживается на его груди с буквой M на куртке — он лежит неподвижно.
film.death_act8_5_matt_keepstill_timeout1=В туннеле с деревянными подпорками он держит фонарь; вендиго бросается на него и сбивает с ног. Вендиго нависает над ним, выпрямляется, вскинув руки, и разбивает ему лицо всмятку; крупным планом — его размозжённое, окровавленное лицо.
film.death_act8_5_matt_keepstill_timeout1_ja=В туннеле с деревянными подпорками он держит фонарь; вендиго бросается на него и сбивает с ног. Вендиго нависает над ним, когти тянутся к его лицу; затем камера задерживается на его груди с буквой M на куртке — он лежит неподвижно.
film.death_act8_5_matt_keepstill_timeout2=Идёт снег; вендиго нависает над ним, он поднимает руки; вендиго выпрямляется и разбивает ему лицо всмятку. Крупным планом — его размозжённое, окровавленное лицо.
film.death_act8_5_matt_keepstill_timeout2_ja=Идёт снег; вендиго переползает через него, он поднимает руку; затем камера задерживается на его груди с буквой M на куртке — он лежит неподвижно.
film.death_act8_5_matt_timeout1=Вендиго спускается по деревянным балкам, бросается на него и сбивает с ног. Он поднимает руку, вендиго нависает над ним, выпрямляется и разбивает ему лицо всмятку; крупным планом — его размозжённое, окровавленное лицо.
film.death_act8_5_matt_timeout1_ja=Вендиго спускается по деревянным балкам, бросается на него и сбивает с ног. Вендиго нависает над ним, оскалив зубы; затем камера задерживается на его груди с буквой M на куртке — он лежит неподвижно.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=В доме, среди мебели под чехлами, вендиго прыгает с пола на стену, а комнату заполняет желтоватая дымка. Взрыв швыряет её ничком по полу; она лежит неподвижно, позади бушует огонь.
film.death_act8_6_ashley_eyegauge=Вендиго с татуировкой бабочки на плече бросается на неё и хватает за голову. Он вдавливает ей в глаза большие пальцы, по лицу течёт кровь; затем вынимает их из окровавленных глазниц — она лежит на деревянном полу.
film.death_act8_6_emily_explosion=Среди вспыхнувшего огня за деревянными столбиками скалится вендиго. Взрыв швыряет её по деревянному полу; она лежит на животе, лицо сильно обожжено.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=В доме вендиго ревёт прямо на зрителя, затем кричит ему в лицо — он стоит у стены. Вендиго хватает его за голову, полосует когтями по животу и швыряет через комнату; он падает у подножия деревянной колонны.
film.death_act8_6_mike_lightbulb_ja=В доме вендиго кричит прямо на зрителя. Вендиго хватает его за голову — он упирается руками ему в грудь, — кричит ему в лицо и отшвыривает в сторону; затем, видный со спины, широко раскидывает длинные руки.
film.death_act8_6_mike_explosion_unijured=В доме огненный шар вспыхивает среди мебели под чехлами и проносится через зал, разбивая вазу. Затем он лежит на полу среди пламени, лицо сильно обожжено.
film.death_act8_6_sam_wendigo1=В доме когтистая рука вендиго держит её на весу за горло; она хватает ртом воздух, изо рта течёт кровь, на лбу горит фонарь. Вендиго дважды пронзает ей живот другой рукой и отпускает; она падает на пол и замирает.
film.death_act8_6_sam_wendigo1_ja=В доме вендиго хватает её. Снизу видно, как он держит её на вытянутой руке — тёмное размытое пятно у края изображения — и кричит, запрокинув голову; затем бросается прямо на зрителя и убегает на четвереньках.
film.4_3_being_watched_emilymatt_cctv_footage=На мониторе — неподвижная камера сверху смотрит на железные ворота в заснеженной каменной стене ночью: через них проходит Эмили, затем Мэтт, который закрывает за собой ворота; оба уходят, и ворота остаются пустыми под падающим снегом.
film.act20_6_cctv_footage=На мониторах — шесть камер: Крис и Эшли сидят друг напротив друга за маленьким столом под подвешенными пилами; Крис дважды стреляет из пистолета вверх, затем целится через стол в Эшли и опускает оружие. На других экранах — женщина в полотенце у ванны при свечах и двое людей у стены с руками, связанными над головой, а потом стол, забрызганный красным.
film.smg_sting.1=На экране кинозала мерцает пустая исцарапанная плёнка, вперемешку мелькают буквы и цифры.
film.smg_sting.2=Запись: Сэм в ванне при свечах. Она оглядывается через плечо, выходит из ванны и стоит, завернувшись в полотенце, озираясь.
film.smg_sting.3=Огромная вращающаяся пила врезается в Джоша, лежащего на столе с поднятыми над головой руками; брызжет кровь, он корчится, изо рта хлещет кровь, под стол льются кровь и ошмётки плоти.
film.smg_sting.4=Снова мерцает пустая плёнка.
film.projectorghost_movie=На стене — старая мерцающая плёнка: Эмили у камина говорит в камеру, затем подталкивает Эшли в дверной проём; Ханна в очках смущённо улыбается; две девушки, а потом Эшли ухмыляются из темноты; Ханна начинает расстёгивать блузку и вдруг резко отворачивается.
film.projectorghost_scare=Крупный план Ханны в очках в красном свете: она улыбается и что-то говорит; вдруг вспыхивает жуткое белое лицо с тёмными глазницами и окровавленным разинутым ртом, и экран гаснет.
film.projector_wendigo=На стене — старый чёрно-белый фильм: медсестра оставляет пациента, сидящего в кресле; он вырывается, карабкается по стене и уползает по потолку в темноту. Она возвращается к пустому креслу, сверху к ней тянется рука, после вспышки медсестры уже нет; бледная фигура бросается на камеру, и изображение заваливается набок.
film.hannah_wendigo_reveal=Вспышка в тонах сепии: рука с чёрной татуировкой-бабочкой, затем Ханна в очках, руки у груди, едва заметно улыбается в камеру.
film.newghosty_up=На экране телевизора бледное жуткое лицо кричит, широко разинув рот; на миг оно сменяется бледным женским лицом с тёмными кругами вокруг глаз.
film.sam_end_credits.1=Сквозь окно — тёмная спальня ночью. Загорается телефон с будильником: 06:00 AM, Work Alarm, на заставке Сэм обнимает собаку; рядом пузырьки с таблетками и книга CREATURE MYTHS OF THE GREAT PLAINS. Сэм лежит на кровати под вращающимся потолочным вентилятором; её глаза широко раскрываются.
film.sam_end_credits.2=Пузырёк с таблетками падает и катится к другой книге — THE WENDIGO LOG. Сэм садится на край кровати и проводит пальцем по экрану, выключая будильник; палец оставляет кровавый след, по предплечью стекает кровь.
film.sam_end_credits.3=Она прижимает салфетку к рваной ране на предплечье, но кровь выступает снова. Её заливает красный свет; она оборачивается, широко раскрыв глаза.
film.sam_end_credits.4=Темнота, затем название: UNTIL DAWN.
film.totem_events_of_the_past.1=Старая фотография в тонах сепии: мужчина в длинном пальто и шейном платке, рядом записка: NO ESCAPE. Наброски косматого клыкастого существа и когтистой руки; газетные заголовки: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED и LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Фотография шахтёров под заголовком MIRACLE MINERAL DISCOVERED; RADIUM; затем MINING DISASTER и DEATH TOLL RISES и фотография шахтёров, исчёрканная чёрным.
film.totem_events_of_the_past.3=Вспышки кровавых кадров: окровавленные зубы и дёсны, треснувший череп, залитое кровью лицо с налитым кровью глазом, опарыши на сыром мясе. Надпись на стене: HUNGER CRAVING; рентгеновский снимок с пометкой HUMAN?
film.totem_events_of_the_past.4=Рукописный список: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Тёмная фотография сгорбленной бледной фигуры, обведённой красным: CREATURE REPORTED. Наброски клыкастого существа — TEETH GROW & SHARPEN WITH AGE — и тощей длиннорукой фигуры. THE ONLY WAY, стрелка к обведённому слову FIRE; страница сгорает.
film.totem_events_of_the_past.5=Ночь: освещённый деревянный дом среди заснеженных сосен. Бет в серой шапке и свитере и Ханна в очках и розовой дутой куртке в ужасе бегут через лес, держась за руки, и выбегают на окутанный туманом обрыв.
film.totem_events_of_the_past.6=У верёвочного ограждения со сломанной табличкой CLIFF они в ужасе оглядываются; в оранжевом тепловом изображении они светятся белыми силуэтами среди деревьев. На самом краю, держась за руки, Ханна срывается, Бет хватает её, и обе падают.
film.totem_events_of_the_past.7=Мужчина с баллонами за спиной подбегает к краю обрыва, а к нему ползёт тощее длиннорукое существо; крупно — его защитные очки и разинутая клыкастая пасть существа. Он поливает существо огнём из огнемёта; оно горит и бьётся на снегу, и огненный шар разрастается на весь экран.
