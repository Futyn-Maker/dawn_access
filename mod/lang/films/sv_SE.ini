; Dawn Access film descriptions — Swedish. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Natt, vid en klippkant: Hannah, i glasögon och en rosa jacka, håller fast i Beth, i grå mössa och tröja. Hannah snubblar baklänges ut över kanten och drar Beth efter sig; nedanför slår Beth med ryggen före ner mot ett stenblock, och blod sprutar.
film.death_act1_1_sisters_cliff.1=Längst ner ligger Hannah med blodigt ansikte och öppna ögon, med Beths blodiga kropp bakom sig.
film.death_act1_1_sisters_cliff_alone=Natt, på en klippvägg: Hannahs hand glider ur Beths grepp och hon tumlar nerför klipporna. Beth sträcker sig upp efter en hand i handske som en mörk gestalt ovanför räcker ner, men faller och slår ner mot snötäckta stenblock; längst ner ligger Hannah blodig, med öppna ögon, när Beth landar bakom henne.
film.death_act3_2_jessica_liftshaft=Mike håller upp en lykta och tittar upp i ett schakt; hennes kropp faller ner på gallergolvet i en hisskorg framför honom, med underkäken avsliten. Han stirrar, sträcker sig efter henne, och korgen rasar ner i ett gnistregn.
film.death_act5_2_matt_climb=Medan han backar undan för en flock hornprydda rådjur i en dimmig skog kliver han ut över en klippkant och faller ner i mörkret. Han ligger med ansiktet nedåt på en sten, med en blodpöl under munnen; i närbild glänser hans öppna öga av tårar.
film.death_act5_2_matt_wendigo=Närbild av hans rädda ögon i mörkret. En wendigo griper tag i honom bakifrån och tvingar upp honom på en krok som hänger bland kedjor; kroken tränger upp genom hans käke och ut ur munnen, och han hänger där med ansiktet täckt av blod.
film.death_act6_3_emily_eyegauge=En wendigo griper tag i hennes huvud och borrar in tummarna i hennes ögon; hon skriker medan blodet strömmar nerför hennes ansikte och hänger sedan slapp i dess grepp.
film.death_act6_3_emily_oregrinder=Hon glider längs en snötäckt ränna ner i tratten på en kvarn och klamrar sig fast vid kanten; fingrarna slinter, och hon faller skrikande ner mellan valsar med piggar medan blod forsar ur hennes mun, tills huvudet sjunker bakåt.
film.death_act6_4_chris_lodgedoor=Inomhus tittar Ashley upp och kliver fram. Ute i mörkret griper en wendigo tag i honom bakifrån, med klorna över hans ansikte, och sliter av honom huvudet; huvudet ligger i snön bredvid hans kropp.
film.death_act6_4_chris_lodgedoor_ja=Ashley, sedd genom en dörrs glasrutor, tittar ut och kliver fram. Utanför griper en wendigo tag i honom bakifrån, med klorna över hans ansikte, och drar ner honom ur bild; den morrar mot kameran och går därifrån, och kvar är den mörka skogen.
film.death_act6_4_chris_runtolodge_ashimpassive=I den mörka snön håller en wendigo fast honom och sliter av honom huvudet; huvudet landar på den snötäckta verandan vid Ashleys fötter. Ashley, nerstänkt av blod, står och tittar ner och grimaserar.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Från marken i en mörk skog: en wendigo sitter hukad över honom, lyfter huvudet med glimmande ögon och går därifrån. Närbild av Ashley, blodstänkt och nära gråten, grimaserande; sedan står hon och tittar ner.
film.death_act6_4_chris_runtolodge_ashscreams=I den mörka snön håller en wendigo fast honom och sliter av honom huvudet; huvudet flyger genom luften och rullar i snön tills det stannar framför en dörr med glasrutor. Bakom glaset trycker Ashley händerna mot munnen och sjunker gråtande ner på knä.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Från marken i en mörk skog: en wendigo sitter hukad över honom, lyfter huvudet med glimmande ögon och går därifrån. Bakom en dörrs glasrutor kommer Ashley fram, trycker händerna mot munnen och sjunker gråtande ner på knä medan en man dyker upp bakom henne.
film.death_act7_1_emily_shotbymike=I ett mörkt rum upplyst av övervakningsskärmar vänder sig Mike om och går mot henne med ett vapen medan Ashley ser på, höjer det med båda händerna och skjuter; blod stänker på väggen, och i närbild är hennes vänstra öga ett blodigt hål, huvudet bakåtkastat och munnen gapande.
film.death_act7_1_emily_shotbymike_ja=I ett mörkt rum upplyst av övervakningsskärmar vänder sig Mike om och går mot henne med ett vapen medan Ashley ser på, och höjer det med båda händerna. Vid skottet klipper bilden till en karta på en korktavla (BLACKWOOD PINES MOUNTAINS), som blir nerstänkt av blod; sedan, i mörkret, glider hennes ben i stövlar ner på golvet.
film.death_act7_3_ashley_trapdoor_opened=Hon öppnar en fallucka i golvet; en wendigo hoppar ut, reser sig över henne där hon står på knä och sluter sina långa händer om hennes huvud. Sedan, på ett tomt jordgolv, faller hennes slappa hand ner i bilden, och hennes avslitna huvud faller och rullar tills det stannar, med öppna ögon och öppen mun.
film.death_act7_3_ashley_trapdoor_opened_ja=Hon öppnar en fallucka i golvet; en wendigo hoppar ut, reser sig över henne där hon står på knä och sluter sina långa händer om hennes huvud. Sedan syns bara en tom, mörk grottgång.
film.death_act7_3_ashley_trapdoor_unbolted=Hon står några steg från en öppen fallucka; en wendigo klättrar ut och tvingar ner henne med ett grepp om huvudet medan hon skriker. Sedan, på ett tomt jordgolv, faller hennes slappa hand ner i bilden, och hennes avslitna huvud faller och rullar tills det stannar, med öppna ögon och öppen mun.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Hon står några steg från en öppen fallucka; en wendigo klättrar ut och tvingar ner henne med ett grepp om huvudet medan hon skriker. Sedan syns bara en tom, dunkel gruvgång.
film.death_act7_3_chris_trapdoor1=Han öppnar en fallucka; en wendigo hoppar ut, reser sig över honom där han står på knä och vrider runt hans huvud med sina långa händer. Sedan faller hans avslitna huvud ner på golvet och blir stående upprätt, vänt mot betraktaren: glasögonen på sned och spruckna, munnen öppen.
film.death_act7_3_chris_trapdoor1_ja=Han öppnar en fallucka; en wendigo hoppar ut, reser sig över honom där han står på knä och griper tag i hans huvud. Sedan syns bara mörka takbjälkar av trä ovanför.
film.death_act7_3_chris_trapdoor2=Medan han tittar ner på en stängd fallucka hoppar en wendigo ner framför honom, kastar sig över honom och håller ner honom på rygg. Den river upp hans strupe med klorna; blodet forsar, och den lyfter hans avslitna huvud, vänt mot betraktaren, med öppen mun.
film.death_act7_3_chris_trapdoor2_ja=Medan han tittar ner på en stängd fallucka hoppar en wendigo ner framför honom, kastar sig över honom och håller ner honom på rygg. Sedan syns bara mörka träbjälkar ovanför.
film.death_act7_3_chris_tunnel1=I en timmerförstärkt gruvgång sprattlar hans ben i luften, resten av honom utom synhåll ovanför, medan strömmar av blod rinner ner. Sedan, framför blodstänkta brädor, faller hans huvudlösa kropp till marken.
film.death_act7_3_chris_tunnel1_ja=I en timmerförstärkt gruvgång sprattlar hans ben i luften, resten av honom utom synhåll ovanför, medan strömmar av blod rinner ner. Sedan, framför blodstänkta brädor, faller hans kropp till marken; bara hans ben och rygg syns, och en hand rycker till.
film.death_act8_4_josh_wendigo=En wendigo skjuter upp ur mörkt vatten och sluter båda sina långa händer om hans huvud. Han skriker när dess fingrar pressar sig in i hans skalle; den klämmer åt tills blodet sprutar ut och stänker över bilden.
film.death_act8_4_josh_wendigo_ja=En wendigo skjuter upp ur mörkt vatten och sluter båda sina långa händer om hans huvud. Han skriker när dess fingrar pressar sig in i hans skalle; medan den klämmer åt lyfter bilden bort från dem, och mörka droppar stänker över den.
film.death_act8_5_jessica_keepstill_timeout1=Närbild: hon ligger på rygg och skriker medan en wendigo griper om hennes huvud och tvingar in sina kloförsedda fingrar i hennes mun; den sliter av henne underkäken, med sitt huggtandsförsedda gap intill hennes stilla ansikte. Sedan ligger hon orörlig i eldskenet, med underkäken borta.
film.death_act8_5_jessica_keepstill_timeout1_ja=Nästan svart: kameran glider långsamt längs en kropp som ligger stilla på marken; sedan, alldeles nära, träder en wendigos revben och huvud fram ur mörkret.
film.death_act8_5_jessica_keepstill_timeout2=Närbild, i fallande snö: hon ligger på rygg och skriker medan en wendigo griper om hennes huvud och tvingar in sina kloförsedda fingrar i hennes mun; den sliter av henne underkäken och för sitt blodiga ansikte, fullt av tänder, nära hennes. Sedan ligger hon orörlig i snön i eldskenet, med underkäken borta.
film.death_act8_5_jessica_keepstill_timeout2_ja=Natt, bland snöiga klippor: i närbild rör sig en wendigos långa lemmar med klor förbi ovanför någons mörka silhuett; sedan driver kameran långsamt över tomma, snötäckta klippor.
film.death_act8_5_jessica_leftbehind=I en timmerförstärkt tunnel springer hon med en lykta; en wendigo hoppar upp på hennes rygg och fäller henne till marken. I närbild griper den om hennes huvud, tvingar in sina kloförsedda fingrar i hennes skrikande mun och sliter av henne underkäken; sedan ligger hon orörlig i eldskenet, med underkäken borta, medan dess huvud, fullt av tänder, far förbi ovanför henne.
film.death_act8_5_jessica_leftbehind_ja=Nästan svart: kameran glider långsamt längs en kropp som ligger stilla på marken; sedan kryper en benig wendigo på alla fyra genom mörkret.
film.death_act8_5_jessica_timeout2=Närbild: hon ligger på rygg och skriker; en wendigo griper om hennes hjässa med den ena kloförsedda handen och tvingar in fingrarna på den andra i hennes mun.
film.death_act8_5_jessica_timeout2_ja=Nästan svart: kameran glider långsamt längs en kropp som ligger stilla på marken.
film.death_act8_5_matt_gate=I fallande snö sitter en wendigo på huk ovanför en upplyst dörröppning i en trävägg och hoppar sedan ner mot honom. Hukad över honom reser den sig med armarna höjda och krossar hans ansikte; i närbild ligger hans ansikte sönderslaget och blodigt i snön.
film.death_act8_5_matt_gate_ja=I fallande snö sitter en wendigo på huk ovanför en upplyst dörröppning i en trävägg och hoppar sedan ner mot honom. Medan han ligger på rygg sträcker sig dess klor mot hans ansikte; sedan stannar kameran på hans bröst, med bokstaven M på jackan, medan han ligger stilla.
film.death_act8_5_matt_keepstill_timeout1=I en timmerförstärkt tunnel håller han en lykta; en wendigo hoppar på honom och slår omkull honom. Hukad över honom reser den sig med armarna höjda och krossar hans ansikte; i närbild ligger hans ansikte sönderslaget och blodigt.
film.death_act8_5_matt_keepstill_timeout1_ja=I en timmerförstärkt tunnel håller han en lykta; en wendigo hoppar på honom och slår omkull honom. Den sitter hukad över honom med klorna sträckta mot hans ansikte; sedan stannar kameran på hans bröst, med bokstaven M på jackan, medan han ligger stilla.
film.death_act8_5_matt_keepstill_timeout2=I fallande snö sitter en wendigo hukad över honom medan han lyfter händerna; den reser sig och krossar hans ansikte. I närbild ligger hans ansikte sönderslaget och blodigt.
film.death_act8_5_matt_keepstill_timeout2_ja=I fallande snö kryper en wendigo över honom medan han lyfter en hand; sedan stannar kameran på hans bröst, med bokstaven M på jackan, medan han ligger stilla.
film.death_act8_5_matt_timeout1=En wendigo klättrar ner längs timmerbjälkar, kastar sig mot honom och fäller honom till marken. Hukad över honom, medan han lyfter en hand, reser den sig och krossar hans ansikte; i närbild ligger hans ansikte sönderslaget och blodigt.
film.death_act8_5_matt_timeout1_ja=En wendigo klättrar ner längs timmerbjälkar, kastar sig mot honom och fäller honom till marken. Den sitter hukad över honom och blottar tänderna; sedan stannar kameran på hans bröst, med bokstaven M på jackan, medan han ligger stilla.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=I stugan, bland möbler täckta med lakan, hoppar en wendigo från golvet upp på väggen medan ett gulaktigt dis fyller rummet. En explosion av eld slungar henne med ansiktet nedåt över golvet; hon ligger stilla medan lågorna rasar bakom henne.
film.death_act8_6_ashley_eyegauge=En wendigo med en fjärilstatuering på axeln kastar sig mot henne och griper tag i hennes huvud. Den borrar in tummarna i hennes ögon medan blodet strömmar nerför hennes ansikte, och drar sedan ut dem ur de blodiga ögonhålorna där hon ligger på ett trägolv.
film.death_act8_6_emily_explosion=Mitt i uppflammande eld morrar en wendigo bakom trästolpar. Explosionen slungar henne över ett trägolv; hon ligger på mage med ansiktet svårt brännskadat.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=I stugan vrålar en wendigo rakt in i bilden och skriker sedan i ansiktet på honom där han står mot en vägg. Den griper tag i hans huvud, river honom över magen och slänger honom tvärs genom rummet; han faller ihop vid foten av en träpelare.
film.death_act8_6_mike_lightbulb_ja=I stugan skriker en wendigo rakt in i bilden. Den griper tag i hans huvud medan han trycker emot dess bröst, skriker honom i ansiktet och slänger honom åt sidan; sedan, sedd bakifrån, breder den ut sina långa armar vitt.
film.death_act8_6_mike_explosion_unijured=I stugan bryter ett eldklot fram genom ett rum med möbler täckta med lakan och sveper genom hallen så att en vas splittras. Sedan ligger han på golvet mitt i lågorna med ansiktet svårt brännskadat.
film.death_act8_6_sam_wendigo1=I stugan håller en wendigos kloförsedda hand henne uppe i strupen; hon kippar efter andan, blod rinner ur hennes mun och pannlampan är tänd. Den driver sin andra arm genom hennes mage två gånger och släpper taget; hon faller ner på golvet och ligger stilla.
film.death_act8_6_sam_wendigo1_ja=I stugan griper en wendigo tag i henne. Sedd underifrån håller den henne uppe på rak arm, en mörk suddig fläck i kanten av bilden, och skriker med huvudet bakåtkastat; sedan kastar den sig mot bilden och kilar iväg på alla fyra.
film.4_3_being_watched_emilymatt_cctv_footage=På en skärm ser en fast kamera ner på en järngrind i en snötäckt stenmur om natten: Emily kommer genom den, sedan Matt, som drar igen grinden efter sig; båda går därifrån, och grinden står öde i den fallande snön.
film.act20_6_cctv_footage=På skärmarna, sex kamerabilder: Chris och Ashley sitter mitt emot varandra vid ett litet bord under hängande sågklingor; Chris skjuter två gånger uppåt med ett vapen, siktar sedan tvärs över bordet mot Ashley och sänker det. Andra bilder visar en kvinna i handduk vid ett badkar i levande ljus, och två personer med händerna bundna ovanför huvudet mot en vägg, sedan ett bord nerstänkt med rött.
film.smg_sting.1=På duken i biografrummet flimrar en tom, repig filmremsa där bokstäver och siffror blixtrar fram huller om buller.
film.smg_sting.2=En inspelning av Sam i ett bad i levande ljus: hon kastar en blick över axeln, kliver upp ur badet och står insvept i en handduk och ser sig omkring.
film.smg_sting.3=En väldig roterande sågklinga skär in i Josh, som ligger på ett bord med armarna ovanför huvudet; blod stänker, han grimaserar, blod väller ur hans mun, och blod och köttslamsor forsar ner under bordet.
film.smg_sting.4=Den tomma filmremsan flimrar igen.
film.projectorghost_movie=På väggen, gamla flimrande inspelningar: Emily, vid en öppen spis, pratar in i kameran och knuffar sedan Ashley genom en dörröppning; Hannah, i glasögon, ler blygt; två tjejer, sedan Ashley, flinar ur mörkret; Hannah börjar knäppa upp sin blus och vänder sedan tvärt bort huvudet.
film.projectorghost_scare=En rödbelyst närbild av Hannah, i glasögon, som ler och pratar; plötsligt blixtrar ett fasansfullt vitt ansikte med mörka ögonhålor och en blodig, gapande mun fram, och skärmen blir svart.
film.projector_wendigo=På väggen, en gammal svartvit film: en sjuksköterska lämnar en patient sittande i en stol; han kämpar sig loss, klättrar uppför väggen och kryper över taket in i mörkret. Hon kommer tillbaka till den tomma stolen, en arm sträcker sig ner mot henne ovanifrån, och efter en blixt är hon borta; en blek gestalt kastar sig mot kameran, och bilden tippar över åt sidan.
film.hannah_wendigo_reveal=En blixt i sepia: en arm med en svart fjärilstatuering, sedan Hannah, i glasögon, med händerna vid bröstet, som ler svagt mot kameran.
film.newghosty_up=På tv-skärmen skriker ett blekt, likliknande ansikte med munnen vitt uppspärrad; för ett ögonblick flimrar det över till en blek kvinnas ansikte med mörka ringar kring ögonen.
film.sam_end_credits.1=Genom ett fönster, ett mörkt sovrum på natten. En telefon lyser upp med ett alarm, 06:00 AM, Work Alarm, med en bakgrundsbild där Sam kramar en hund, bredvid pillerburkar och en bok, CREATURE MYTHS OF THE GREAT PLAINS. Sam ligger på sängen under en snurrande takfläkt; hon spärrar upp ögonen.
film.sam_end_credits.2=En pillerburk faller och rullar fram bredvid en annan bok, THE WENDIGO LOG. Sam sätter sig upp på sängkanten och sveper bort alarmet; hennes tumme smetar ut blod över skärmen, och blod rinner nerför hennes underarm.
film.sam_end_credits.3=Hon trycker en pappersnäsduk mot ett ojämnt skärsår på underarmen, men det blöder igen. Rött ljus stiger upp över henne; hon vänder sig om med uppspärrade ögon.
film.sam_end_credits.4=Mörker, sedan titeln: UNTIL DAWN.
film.totem_events_of_the_past.1=Ett gammalt sepiafoto av en man i lång rock och halsduk, bredvid en lapp: NO ESCAPE. Skisser av en lurvig varelse med huggtänder och av en hand med klor; rubriker: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, och LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Ett foto av gruvarbetare under rubriken MIRACLE MINERAL DISCOVERED; RADIUM; sedan MINING DISASTER och DEATH TOLL RISES, och ett foto av gruvarbetare överklottrat med svart.
film.totem_events_of_the_past.3=Blodiga glimtar: blodiga tänder och tandkött, en sprucken skalle, ett blodtäckt ansikte med ett blodsprängt öga, fluglarver på rått kött. HUNGER CRAVING klottrat på en vägg; en röntgenbild märkt HUMAN?
film.totem_events_of_the_past.4=En handskriven lista: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Ett mörkt foto av en krumböjd, blek gestalt, inringad med rött: CREATURE REPORTED. Skisser av en varelse med huggtänder, TEETH GROW & SHARPEN WITH AGE, och av en utmärglad gestalt med långa lemmar. THE ONLY WAY, en pil till ett inringat FIRE; sidan brinner.
film.totem_events_of_the_past.5=Natt: ett upplyst trähus bland snötäckta tallar. Beth, i grå mössa och tröja, och Hannah, i glasögon och en rosa täckjacka, springer skräckslagna genom skogen, hand i hand, ut på ett dimmigt klippkrön.
film.totem_events_of_the_past.6=Vid ett repstängsel bredvid en trasig skylt, CLIFF, ser de sig skräckslagna tillbaka; en orange värmebild visar dem som glödande vita gestalter bland träden. Hand i hand vid kanten halkar Hannah över; Beth griper tag i henne, och båda faller.
film.totem_events_of_the_past.7=En man med tankar på ryggen springer fram till klippkanten medan en utmärglad varelse med långa lemmar kryper mot honom; närbilder av hans skyddsglasögon och av dess vidöppna gap med huggtänder. Han överöser den med eld från sin eldkastare; den brinner och slår omkring sig på snön, och ett eldklot sväller tills det fyller skärmen.
