; Dawn Access film descriptions — Danish. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Nat, ved en klippekant: Hannah, med briller og en lyserød jakke, holder fast i Beth, i en grå hue og sweater. Hannah snubler baglæns ud over kanten og trækker Beth med sig; nedenfor braser Beth med ryggen ned på en kampesten, og blodet sprøjter.
film.death_act1_1_sisters_cliff.1=Nede i bunden ligger Hannah med blodigt ansigt og åbne øjne, med Beths blodige krop bag sig.
film.death_act1_1_sisters_cliff_alone=Nat, på en klippevæg: Hannahs hånd glider ud af Beths greb, og hun tumler ned ad klipperne. Beth strækker sig op efter en hånd i handske, som en mørk skikkelse ovenover rækker ned, men falder og braser ned på snedækkede kampesten; nede i bunden ligger Hannah blodig med åbne øjne, mens Beth lander bag hende.
film.death_act3_2_jessica_liftshaft=Mike løfter en lygte og kigger op gennem en skakt; hendes krop falder ned på gitterbunden i et elevatorbur foran ham, underkæben revet af. Han stirrer, rækker ud efter hende, og buret styrter ned i en regn af gnister.
film.death_act5_2_matt_climb=Mens han bakker væk fra en flok hjorte med gevirer i en tåget skov, træder han ud over en klippekant og falder ned i mørket. Han ligger med ansigtet nedad på en sten med en blodpøl under munden; i nærbillede glinser hans åbne øje af tårer.
film.death_act5_2_matt_wendigo=Nærbillede af hans skræmte øjne i mørket. En wendigo griber ham bagfra og tvinger ham op på en krog, der hænger mellem kæder; krogen borer sig op gennem hans kæbe og ud af munden, og han hænger der med ansigtet dækket af blod.
film.death_act6_3_emily_eyegauge=En wendigo griber om hendes hoved og trykker tommelfingrene ind i hendes øjne; hun skriger, mens blodet strømmer ned over hendes ansigt, og hænger så slap i dens greb.
film.death_act6_3_emily_oregrinder=Hun glider ned ad en snedækket rende ned i tragten på en stenkværn og klamrer sig til kanten; fingrene smutter, og hun falder ned mellem piggede valser, skrigende, mens blodet vælter ud af hendes mund, indtil hovedet synker bagover.
film.death_act6_4_chris_lodgedoor=Indenfor ser Ashley op og træder frem. Udenfor i mørket griber en wendigo ham bagfra, med kløerne over hans ansigt, og river hovedet af ham; hovedet ligger i sneen ved siden af hans krop.
film.death_act6_4_chris_lodgedoor_ja=Ashley, set gennem en dørs glasruder, kigger ud og træder frem. Udenfor griber en wendigo ham bagfra, med kløerne over hans ansigt, og trækker ham ned ud af billedet; den snerrer mod kameraet og går sin vej, og tilbage er kun den mørke skov.
film.death_act6_4_chris_runtolodge_ashimpassive=I den mørke sne holder en wendigo ham nede og river hovedet af ham; hovedet lander på den snedækkede veranda for Ashleys fødder. Ashley, oversprøjtet med blod, står og ser ned og fortrækker ansigtet.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Fra jorden i en mørk skov: en wendigo sidder på hug over ham, løfter hovedet med glinsende øjne og går sin vej. Nærbillede af Ashley, oversprøjtet med blod og tæt på at græde, med fortrukket ansigt; så står hun og ser ned.
film.death_act6_4_chris_runtolodge_ashscreams=I den mørke sne holder en wendigo ham nede og river hovedet af ham; hovedet flyver gennem luften og triller i sneen, til det ligger stille foran en dør med glasruder. Bag glasset presser Ashley hænderne mod munden og synker grædende ned på knæ.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Fra jorden i en mørk skov: en wendigo sidder på hug over ham, løfter hovedet med glinsende øjne og går sin vej. Bag en dørs glasruder kommer Ashley hen, presser hænderne mod munden og synker grædende ned på knæ, mens en mand dukker op bag hende.
film.death_act7_1_emily_shotbymike=I et mørkt rum oplyst af overvågningsskærme vender Mike sig om og går hen mod hende med et våben, mens Ashley ser på, løfter det med begge hænder og skyder; blodet sprøjter på væggen, og i nærbillede er hendes venstre øje et blodigt hul, hovedet kastet bagover, munden gabende.
film.death_act7_1_emily_shotbymike_ja=I et mørkt rum oplyst af overvågningsskærme vender Mike sig om og går hen mod hende med et våben, mens Ashley ser på, og løfter det med begge hænder. Ved skuddet skifter billedet til et kort på en opslagstavle af kork (BLACKWOOD PINES MOUNTAINS), som bliver oversprøjtet med blod; så glider hendes ben i støvler i mørket ned på gulvet.
film.death_act7_3_ashley_trapdoor_opened=Hun åbner en lem i gulvet; en wendigo springer ud, rejser sig over hende, mens hun knæler, og klemmer sine lange hænder om hendes hoved. Så falder hendes slappe hånd ind i billedet på et tomt jordgulv, og hendes afrevne hoved falder og triller, til det ligger stille, med åbne øjne og åben mund.
film.death_act7_3_ashley_trapdoor_opened_ja=Hun åbner en lem i gulvet; en wendigo springer ud, rejser sig over hende, mens hun knæler, og klemmer sine lange hænder om hendes hoved. Så ses kun en tom, mørk hulegang.
film.death_act7_3_ashley_trapdoor_unbolted=Hun står et par skridt fra en åben lem; en wendigo kravler op, tager hende om hovedet og tvinger hende ned, mens hun skriger. Så falder hendes slappe hånd ind i billedet på et tomt jordgulv, og hendes afrevne hoved falder og triller, til det ligger stille, med åbne øjne og åben mund.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Hun står et par skridt fra en åben lem; en wendigo kravler op, tager hende om hovedet og tvinger hende ned, mens hun skriger. Så ses kun en tom, dunkel minegang.
film.death_act7_3_chris_trapdoor1=Han åbner en lem; en wendigo springer ud, rejser sig over ham, mens han knæler, og vrider hans hoved rundt med sine lange hænder. Så falder hans afrevne hoved ned på gulvet og bliver stående oprejst, vendt mod beskueren: brillerne skæve og revnede, munden åben.
film.death_act7_3_chris_trapdoor1_ja=Han åbner en lem; en wendigo springer ud, rejser sig over ham, mens han knæler, og griber hans hoved. Så ses kun mørke træspær ovenover.
film.death_act7_3_chris_trapdoor2=Mens han kigger ned på en lukket lem, springer en wendigo ned foran ham, kaster sig over ham og holder ham nede på ryggen. Den flænser hans strube op med kløerne; blodet fosser, og den løfter hans afrevne hoved op, vendt mod beskueren, munden åben.
film.death_act7_3_chris_trapdoor2_ja=Mens han kigger ned på en lukket lem, springer en wendigo ned foran ham, kaster sig over ham og holder ham nede på ryggen. Så ses kun mørke træbjælker ovenover.
film.death_act7_3_chris_tunnel1=I en træafstivet minegang sparker hans ben i luften, resten af ham uden for billedet foroven, mens strømme af blod løber ned. Så falder hans hovedløse krop ned på jorden foran blodstænkte brædder.
film.death_act7_3_chris_tunnel1_ja=I en træafstivet minegang sparker hans ben i luften, resten af ham uden for billedet foroven, mens strømme af blod løber ned. Så falder hans krop ned på jorden foran blodstænkte brædder; kun hans ben og ryg ses, og en hånd rykker.
film.death_act8_4_josh_wendigo=En wendigo bryder op af mørkt vand og klemmer begge sine lange hænder om hans hoved. Han skriger, mens dens fingre presser sig ind i hans kranium; den klemmer, til blodet springer ud og sprøjter hen over billedet.
film.death_act8_4_josh_wendigo_ja=En wendigo bryder op af mørkt vand og klemmer begge sine lange hænder om hans hoved. Han skriger, mens dens fingre presser sig ind i hans kranium; mens den klemmer, løfter billedet sig væk fra dem, og mørke dråber sprøjter hen over det.
film.death_act8_5_jessica_keepstill_timeout1=Nærbillede: hun ligger på ryggen og skriger, mens en wendigo griber om hendes hoved og tvinger sine fingre med kløer ind i hendes mund; den river hendes underkæbe af, dens gab med hugtænder ved siden af hendes stivnede ansigt. Så ligger hun ubevægelig i ildskæret, underkæben væk.
film.death_act8_5_jessica_keepstill_timeout1_ja=Næsten sort: kameraet glider langsomt hen langs en krop, der ligger stille på jorden; så dukker en wendigos ribben og hoved frem af mørket tæt på.
film.death_act8_5_jessica_keepstill_timeout2=Nærbillede, i faldende sne: hun ligger på ryggen og skriger, mens en wendigo griber om hendes hoved og tvinger sine fingre med kløer ind i hendes mund; den river hendes underkæbe af og bringer sit blodige ansigt, fuldt af tænder, tæt på hendes. Så ligger hun ubevægelig i sneen i ildskæret, underkæben væk.
film.death_act8_5_jessica_keepstill_timeout2_ja=Nat, mellem snedækkede klipper: tæt på bevæger en wendigos lange lemmer med kløer sig forbi hen over nogens mørke silhuet; så glider kameraet langsomt hen over tomme, snedækkede klipper.
film.death_act8_5_jessica_leftbehind=I en træafstivet gang løber hun med en lygte; en wendigo springer op på hendes ryg og vælter hende omkuld. I nærbillede griber den om hendes hoved, tvinger sine fingre med kløer ind i hendes skrigende mund og river underkæben af; så ligger hun ubevægelig i ildskæret, underkæben væk, mens dens hoved, fuldt af tænder, farer forbi over hende.
film.death_act8_5_jessica_leftbehind_ja=Næsten sort: kameraet glider langsomt hen langs en krop, der ligger stille på jorden; så kravler en knoklet wendigo på alle fire gennem mørket.
film.death_act8_5_jessica_timeout2=Nærbillede: hun ligger på ryggen og skriger; en wendigo griber om hendes isse med den ene hånd med kløer og tvinger fingrene på den anden ind i hendes mund.
film.death_act8_5_jessica_timeout2_ja=Næsten sort: kameraet glider langsomt hen langs en krop, der ligger stille på jorden.
film.death_act8_5_matt_gate=I faldende sne sidder en wendigo på hug over en oplyst døråbning i en trævæg og springer så ned mod ham. På hug over ham rejser den sig med løftede arme og smadrer hans ansigt; i nærbillede ligger hans ansigt knust og blodigt i sneen.
film.death_act8_5_matt_gate_ja=I faldende sne sidder en wendigo på hug over en oplyst døråbning i en trævæg og springer så ned mod ham. Mens han ligger på ryggen, rækker dens kløer efter hans ansigt; så dvæler kameraet ved hans bryst med bogstavet M på jakken, mens han ligger stille.
film.death_act8_5_matt_keepstill_timeout1=I en træafstivet gang holder han en lygte; en wendigo springer på ham og vælter ham omkuld. På hug over ham rejser den sig med løftede arme og smadrer hans ansigt; i nærbillede ligger hans ansigt knust og blodigt.
film.death_act8_5_matt_keepstill_timeout1_ja=I en træafstivet gang holder han en lygte; en wendigo springer på ham og vælter ham omkuld. Den sidder på hug over ham med kløerne rakt ud efter hans ansigt; så dvæler kameraet ved hans bryst med bogstavet M på jakken, mens han ligger stille.
film.death_act8_5_matt_keepstill_timeout2=I faldende sne sidder en wendigo på hug over ham, mens han løfter hænderne; den rejser sig og smadrer hans ansigt. I nærbillede ligger hans ansigt knust og blodigt.
film.death_act8_5_matt_keepstill_timeout2_ja=I faldende sne kravler en wendigo hen over ham, mens han løfter en hånd; så dvæler kameraet ved hans bryst med bogstavet M på jakken, mens han ligger stille.
film.death_act8_5_matt_timeout1=En wendigo klatrer ned ad træbjælker, kaster sig mod ham og slår ham omkuld. På hug over ham, mens han løfter en hånd, rejser den sig og smadrer hans ansigt; i nærbillede ligger hans ansigt knust og blodigt.
film.death_act8_5_matt_timeout1_ja=En wendigo klatrer ned ad træbjælker, kaster sig mod ham og slår ham omkuld. Den sidder på hug over ham og blotter tænderne; så dvæler kameraet ved hans bryst med bogstavet M på jakken, mens han ligger stille.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=I huset, mellem møbler dækket af lagner, springer en wendigo fra gulvet op på væggen, mens en gullig dis fylder rummet. En eksplosion af ild slynger hende med ansigtet nedad hen over gulvet; hun ligger stille, mens flammerne raser bag hende.
film.death_act8_6_ashley_eyegauge=En wendigo med en sommerfugletatovering på skulderen kaster sig mod hende og griber om hendes hoved. Den trykker tommelfingrene ind i hendes øjne, mens blodet strømmer ned over hendes ansigt, og trækker så tommelfingrene ud af de blodige øjenhuler, mens hun ligger på et trægulv.
film.death_act8_6_emily_explosion=Midt i opblussende ild snerrer en wendigo bag træstolper. Eksplosionen slynger hende hen over et trægulv; hun ligger på maven med svært forbrændt ansigt.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=I huset brøler en wendigo lige mod beskueren og skriger ham så ind i ansigtet, mens han står op ad en væg. Den griber hans hoved, flænser ham over maven og slynger ham tværs gennem rummet; han falder om ved foden af en træsøjle.
film.death_act8_6_mike_lightbulb_ja=I huset skriger en wendigo lige mod beskueren. Den griber hans hoved, mens han skubber til dens bryst, skriger ham ind i ansigtet og slynger ham til side; så, set bagfra, spreder den sine lange arme vidt ud.
film.death_act8_6_mike_explosion_unijured=I huset brager en ildkugle gennem et rum med møbler dækket af lagner og fejer hen gennem hallen, så en vase splintres. Så ligger han på gulvet midt i flammerne med svært forbrændt ansigt.
film.death_act8_6_sam_wendigo1=I huset holder en wendigos hånd med kløer hende oppe ved struben; hun gisper, blodet løber fra hendes mund, og lampen i hendes pande er tændt. Den borer sin anden arm gennem hendes mave to gange og slipper; hun falder ned på gulvet og ligger stille.
film.death_act8_6_sam_wendigo1_ja=I huset griber en wendigo hende. Set nedefra holder den hende oppe i strakt arm, en mørk, sløret plet i kanten af billedet, og skriger med hovedet kastet bagover; så kaster den sig mod beskueren og piler af sted på alle fire.
film.4_3_being_watched_emilymatt_cctv_footage=På en skærm ser et fast kamera ned på en jernlåge i en snedækket stenmur om natten: Emily kommer igennem, så Matt, der trækker lågen i efter sig; de går begge deres vej, og lågen står tom i den faldende sne.
film.act20_6_cctv_footage=På skærmene, seks kamerabilleder: Chris og Ashley sidder over for hinanden ved et lille bord under hængende savklinger; Chris skyder to gange opad med et våben, sigter så over bordet mod Ashley og sænker det. Andre billeder viser en kvinde i håndklæde ved et badekar i levende lys og to mennesker med hænderne bundet over hovedet op ad en væg, derefter et bord oversprøjtet med rødt.
film.smg_sting.1=På lærredet i biografrummet flimrer en tom, ridset filmstrimmel med glimt af sammenrodede bogstaver og tal.
film.smg_sting.2=Optagelser af Sam i et bad i levende lys: hun kigger over skulderen, stiger op af karret og står svøbt i et håndklæde og ser sig omkring.
film.smg_sting.3=En enorm roterende savklinge skærer ind i Josh, der ligger på et bord med armene over hovedet; blodet sprøjter, han fortrækker ansigtet, blod vælter ud af hans mund, og blod og kødstumper strømmer ned under bordet.
film.smg_sting.4=Den tomme filmstrimmel flimrer igen.
film.projectorghost_movie=På væggen, gamle flimrende optagelser: Emily, ved en pejs, taler til kameraet og skubber så Ashley gennem en døråbning; Hannah, med briller, smiler genert; to piger, og så Ashley, smiler bredt ud fra mørket; Hannah begynder at knappe sin bluse op og drejer så brat hovedet væk.
film.projectorghost_scare=Et rødt oplyst nærbillede af Hannah, med briller, der smiler og taler; pludselig glimter et rædselsvækkende hvidt ansigt med mørke øjenhuler og en blodig, gabende mund frem, og skærmen bliver sort.
film.projector_wendigo=På væggen, en gammel sort-hvid film: en sygeplejerske efterlader en patient siddende i en stol; han kæmper sig fri, klatrer op ad væggen og kravler hen over loftet ind i mørket. Hun vender tilbage til den tomme stol, en arm rækker ned mod hende ovenfra, og efter et glimt er hun væk; en bleg skikkelse kaster sig mod kameraet, og billedet vælter om på siden.
film.hannah_wendigo_reveal=Et glimt i sepia: en arm med en sort sommerfugletatovering, derefter Hannah, med briller, hænderne ved brystet, der smiler svagt til kameraet.
film.newghosty_up=På tv-skærmen skriger et blegt, ligagtigt ansigt med munden spærret vidt op; et øjeblik flimrer det over i en bleg kvindes ansigt med mørke rande om øjnene.
film.sam_end_credits.1=Gennem et vindue, et mørkt soveværelse om natten. En telefon lyser op med en alarm, 06:00 AM, Work Alarm, med et baggrundsbillede af Sam, der krammer en hund, ved siden af pilleglas og en bog, CREATURE MYTHS OF THE GREAT PLAINS. Sam ligger på sengen under en roterende loftsventilator; hun spærrer øjnene op.
film.sam_end_credits.2=Et pilleglas falder og triller hen ved siden af en anden bog, THE WENDIGO LOG. Sam sætter sig op på sengekanten og stryger alarmen væk; hendes tommelfinger tværer blod ud over skærmen, og blodet løber ned ad hendes underarm.
film.sam_end_credits.3=Hun trykker et papirlommetørklæde mod et takket sår på underarmen, men det bløder igen. Rødt lys stiger op over hende; hun vender sig med opspilede øjne.
film.sam_end_credits.4=Mørke, så titlen: UNTIL DAWN.
film.totem_events_of_the_past.1=Et gammelt sepiafoto af en mand i lang frakke og halstørklæde ved siden af en seddel: NO ESCAPE. Skitser af et lodent væsen med hugtænder og af en hånd med kløer; overskrifter: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, og LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Et foto af minearbejdere under overskriften MIRACLE MINERAL DISCOVERED; RADIUM; så MINING DISASTER og DEATH TOLL RISES og et foto af minearbejdere, overkradset med sort.
film.totem_events_of_the_past.3=Glimt af blod og gru: blodige tænder og gummer, et revnet kranium, et blodindsmurt ansigt med et blodskudt øje, maddiker på råt kød. HUNGER CRAVING kradset på en væg; et røntgenbillede mærket HUMAN?
film.totem_events_of_the_past.4=En håndskrevet liste: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Et mørkt foto af en foroverbøjet, bleg skikkelse, indkredset med rødt: CREATURE REPORTED. Skitser af et væsen med hugtænder, TEETH GROW & SHARPEN WITH AGE, og af en udtæret skikkelse med lange lemmer. THE ONLY WAY, en pil hen til FIRE, indkredset; siden brænder.
film.totem_events_of_the_past.5=Nat: et oplyst træhus mellem snedækkede fyrretræer. Beth, i en grå hue og sweater, og Hannah, med briller og en lyserød vatteret jakke, løber rædselsslagne gennem skoven, hånd i hånd, ud på en tåget klippetop.
film.totem_events_of_the_past.6=Ved et rebhegn ved siden af et knækket skilt, CLIFF, ser de sig rædselsslagne tilbage; et orange varmebillede viser dem som lysende hvide skikkelser mellem træerne. Hånd i hånd ved kanten glider Hannah ud over; Beth griber hende, og de falder begge.
film.totem_events_of_the_past.7=En mand med tanke på ryggen løber hen til klippekanten, mens et udtæret væsen med lange lemmer kravler hen mod ham; nærbilleder af hans beskyttelsesbriller og af væsenets vidt åbne gab med hugtænder. Han overøser det med ild fra sin flammekaster; det brænder og vrider sig på sneen, og en ildkugle vokser, til den fylder skærmen.
