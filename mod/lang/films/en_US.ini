; Dawn Access film descriptions — English (master table). Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Night, at a cliff edge: Hannah, in glasses and a pink jacket, holds on to Beth, in a grey beanie and sweater. Hannah stumbles backwards over the edge, dragging Beth after her; below, Beth slams back-first onto a boulder, blood spurting.
film.death_act1_1_sisters_cliff.1=At the bottom, Hannah lies with her face bloodied and her eyes open, Beth's bloodied body behind her.
film.death_act1_1_sisters_cliff_alone=Night, on a cliff face: Hannah's hand slips from Beth's grip and she tumbles down the rocks. Beth reaches up for a gloved hand held down by a dark figure above, but falls and slams onto snowy boulders; at the bottom Hannah lies bloodied, eyes open, as Beth lands behind her.
film.death_act3_2_jessica_liftshaft=Mike, holding up a lantern, looks up a shaft; her body falls onto the grated floor of a lift cage in front of him, her lower jaw torn away. He stares, reaches for her, and the cage drops away in a shower of sparks.
film.death_act5_2_matt_climb=Backing away from a herd of antlered deer in a misty forest, he steps off a rocky edge and falls into the dark. He lies face down on a rock, blood pooled under his mouth; close up, his open eye glistens with tears.
film.death_act5_2_matt_wendigo=Close on his frightened eyes in the dark. A wendigo grabs him from behind and forces him onto a hook hanging among chains; it pierces up through his jaw and out of his mouth, and he hangs there, his face covered in blood.
film.death_act6_3_emily_eyegauge=A wendigo seizes her head and drives its thumbs into her eyes; she screams as blood streams down her face, then hangs limp in its grip.
film.death_act6_3_emily_oregrinder=She slides down a snowy chute into a grinder's hopper and clings to its rim; her fingers slip and she drops between spiked rollers, screaming, blood pouring from her mouth, until her head falls back.
film.death_act6_4_chris_lodgedoor=Indoors, Ashley looks up and steps forward. Outside in the dark, a wendigo grabs him from behind, claws over his face, and tears off his head; the head lies in the snow beside his body.
film.death_act6_4_chris_lodgedoor_ja=Ashley, seen through a door's glass panes, looks out and steps forward. Outside, a wendigo grabs him from behind, claws over his face, and pulls him down out of view; it snarls at the camera and moves off, leaving the dark forest.
film.death_act6_4_chris_runtolodge_ashimpassive=In the dark snow, a wendigo pins him and tears off his head; the head lands on the snowy porch at Ashley's feet. Ashley, spattered with blood, stands looking down, grimacing.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=From the ground in dark woods: a wendigo crouches over him, lifts its head, eyes glinting, and moves off. Close on Ashley, blood-spattered and near tears, grimacing; then she stands looking down.
film.death_act6_4_chris_runtolodge_ashscreams=In the dark snow, a wendigo pins him and tears off his head; the head flies through the air and rolls to a stop in the snow before a glass-paned door. Behind the glass, Ashley presses her hands to her mouth and sinks to her knees, crying.
film.death_act6_4_chris_runtolodge_ashscreams_ja=From the ground in dark woods: a wendigo crouches over him, lifts its head, eyes glinting, and moves off. Behind a door's glass panes, Ashley comes up, presses her hands to her mouth and sinks to her knees, crying, as a man appears behind her.
film.death_act7_1_emily_shotbymike=In a dark room lit by security monitors, Mike turns and comes toward her with a gun as Ashley watches, raises it in both hands and fires; blood spatters the wall, and close up her left eye is a bloody hole, her head thrown back, mouth gaping.
film.death_act7_1_emily_shotbymike_ja=In a dark room lit by security monitors, Mike turns and comes toward her with a gun as Ashley watches, and raises it in both hands. At the shot the view cuts to a map on a corkboard (BLACKWOOD PINES MOUNTAINS), which is spattered with blood; then, in the dark, her legs in boots slide to the floor.
film.death_act7_3_ashley_trapdoor_opened=She opens a trapdoor in the floor; a wendigo leaps out, rears over her as she kneels and clamps its long hands around her head. Then, on an empty dirt floor, her limp hand drops into view, and her severed head falls and rolls to a stop, eyes and mouth open.
film.death_act7_3_ashley_trapdoor_opened_ja=She opens a trapdoor in the floor; a wendigo leaps out, rears over her as she kneels and clamps its long hands around her head. Then only an empty, dark cave passage is seen.
film.death_act7_3_ashley_trapdoor_unbolted=She stands a few steps from an open trapdoor; a wendigo climbs out and forces her down by the head as she screams. Then, on an empty dirt floor, her limp hand drops into view, and her severed head falls and rolls to a stop, eyes and mouth open.
film.death_act7_3_ashley_trapdoor_unbolted_ja=She stands a few steps from an open trapdoor; a wendigo climbs out and forces her down by the head as she screams. Then only an empty, dim mine passage is seen.
film.death_act7_3_chris_trapdoor1=He opens a trapdoor; a wendigo leaps out, rears over him as he kneels and wrenches his head round in its long hands. Then his severed head drops onto the floor and stays upright, facing the viewer: glasses askew and cracked, mouth open.
film.death_act7_3_chris_trapdoor1_ja=He opens a trapdoor; a wendigo leaps out, rears over him as he kneels and grabs his head. Then only dark wooden rafters overhead are seen.
film.death_act7_3_chris_trapdoor2=As he looks down at a closed trapdoor, a wendigo drops down in front of him, pounces and pins him on his back. It slashes his throat open with its claws; blood gushes, and it lifts his severed head to face the viewer, mouth open.
film.death_act7_3_chris_trapdoor2_ja=As he looks down at a closed trapdoor, a wendigo drops down in front of him, pounces and pins him on his back. Then only dark wooden beams overhead are seen.
film.death_act7_3_chris_tunnel1=In a timbered mine tunnel, his legs kick in mid-air, the rest of him out of view above, as streams of blood pour down. Then, before blood-spattered boards, his headless body drops to the ground.
film.death_act7_3_chris_tunnel1_ja=In a timbered mine tunnel, his legs kick in mid-air, the rest of him out of view above, as streams of blood pour down. Then, before blood-spattered boards, his body drops to the ground; only his legs and back are seen, and a hand twitches.
film.death_act8_4_josh_wendigo=A wendigo bursts up out of dark water and clamps both long hands on his head. He screams as its fingers press into his skull; it squeezes until blood bursts out and sprays across the view.
film.death_act8_4_josh_wendigo_ja=A wendigo bursts up out of dark water and clamps both long hands on his head. He screams as its fingers press into his skull; as it squeezes, the view lifts away from them and dark drops spatter across it.
film.death_act8_5_jessica_keepstill_timeout1=Close up: she lies on her back, screaming, as a wendigo grips her head and forces its clawed fingers into her mouth; it tears off her lower jaw, its fanged mouth beside her still face. Then she lies motionless by firelight, her lower jaw gone.
film.death_act8_5_jessica_keepstill_timeout1_ja=Almost black: the camera slowly passes along a body lying still on the ground; then, close by, a wendigo's ribs and head emerge from the dark.
film.death_act8_5_jessica_keepstill_timeout2=Close up, in falling snow: she lies on her back, screaming, as a wendigo grips her head and forces its clawed fingers into her mouth; it tears off her lower jaw and brings its bloodied, toothy face close to hers. Then she lies motionless in the snow by firelight, her lower jaw gone.
film.death_act8_5_jessica_keepstill_timeout2_ja=Night, among snowy rocks: close up, a wendigo's long clawed limbs move past over someone's dark silhouette; then the camera drifts slowly over empty, snow-covered rocks.
film.death_act8_5_jessica_leftbehind=In a timbered tunnel she runs with a lantern; a wendigo leaps onto her back and brings her down. Close up, it grips her head, forces its clawed fingers into her screaming mouth and tears off her lower jaw; then she lies motionless by firelight, her lower jaw gone, as its toothy head flashes past above her.
film.death_act8_5_jessica_leftbehind_ja=Almost black: the camera slowly passes along a body lying still on the ground; then a bony wendigo crawls on all fours through the dark.
film.death_act8_5_jessica_timeout2=Close up: she lies on her back, screaming; a wendigo grips the top of her head with one clawed hand and forces the fingers of the other into her mouth.
film.death_act8_5_jessica_timeout2_ja=Almost black: the camera slowly passes along a body lying still on the ground.
film.death_act8_5_matt_gate=In falling snow, a wendigo crouches above a lit doorway in a wooden wall, then leaps down at him. Crouched over him, it rears up with its arms raised and smashes his face in; close up, his face lies crushed and bloody in the snow.
film.death_act8_5_matt_gate_ja=In falling snow, a wendigo crouches above a lit doorway in a wooden wall, then leaps down at him. As he lies on his back its claws reach for his face; then the camera rests on his chest, with the letter M on his jacket, as he lies still.
film.death_act8_5_matt_keepstill_timeout1=In a timbered tunnel he holds a lantern; a wendigo leaps at him and knocks him down. Crouched over him, it rears up with its arms raised and smashes his face in; close up, his face lies crushed and bloody.
film.death_act8_5_matt_keepstill_timeout1_ja=In a timbered tunnel he holds a lantern; a wendigo leaps at him and knocks him down. It crouches over him, its claws reaching for his face; then the camera rests on his chest, with the letter M on his jacket, as he lies still.
film.death_act8_5_matt_keepstill_timeout2=In falling snow, a wendigo crouches over him as he raises his hands; it rears up and smashes his face in. Close up, his face lies crushed and bloody.
film.death_act8_5_matt_keepstill_timeout2_ja=In falling snow, a wendigo crawls over him as he raises a hand; then the camera rests on his chest, with the letter M on his jacket, as he lies still.
film.death_act8_5_matt_timeout1=A wendigo climbs down timber beams, lunges at him and knocks him to the ground. Crouched over him as he raises a hand, it rears up and smashes his face in; close up, his face lies crushed and bloody.
film.death_act8_5_matt_timeout1_ja=A wendigo climbs down timber beams, lunges at him and knocks him to the ground. It crouches over him, baring its teeth; then the camera rests on his chest, with the letter M on his jacket, as he lies still.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=In the lodge, among sheet-draped furniture, a wendigo leaps from the floor onto the wall as a yellowish haze fills the room. A blast of fire hurls her face down across the floor; she lies still as flames rage behind her.
film.death_act8_6_ashley_eyegauge=A wendigo with a butterfly tattoo on its shoulder lunges at her and seizes her head. It drives its thumbs into her eyes, blood streaming down her face, then pulls them out of the bloody sockets as she lies on a wooden floor.
film.death_act8_6_emily_explosion=Amid bursting fire, a wendigo snarls behind wooden posts. The blast hurls her across a wooden floor; she lies on her front, her face badly burnt.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=In the lodge, a wendigo roars into the view, then screams in his face as he stands against a wall. It grabs his head, slashes him across the stomach and hurls him across the room; he drops at the foot of a wooden pillar.
film.death_act8_6_mike_lightbulb_ja=In the lodge, a wendigo screams into the view. It grabs his head as he pushes at its chest, screams in his face and flings him aside; then, seen from behind, it spreads its long arms wide.
film.death_act8_6_mike_explosion_unijured=In the lodge, a fireball bursts through a room of sheet-draped furniture and sweeps across the hall, shattering a vase. Then he lies on the floor amid the flames, his face badly burnt.
film.death_act8_6_sam_wendigo1=In the lodge, a wendigo's clawed hand holds her up by the throat; she gasps, blood running from her mouth, her headlamp lit. It drives its other arm through her stomach twice and lets go; she drops to the floor and lies still.
film.death_act8_6_sam_wendigo1_ja=In the lodge, a wendigo grabs her. Seen from below, it holds her up at arm's length, a dark blur at the edge of the view, and screams with its head thrown back; then it lunges at the view and scuttles away on all fours.
film.4_3_being_watched_emilymatt_cctv_footage=On a monitor, a fixed camera looks down on an iron gate in a snowy stone wall at night: Emily comes through it, then Matt, who pulls the gate shut behind him; both walk off, and the gate stands empty in the falling snow.
film.act20_6_cctv_footage=On the monitors, six camera feeds: Chris and Ashley sit facing each other at a small table under hanging saw blades; Chris fires a gun upward twice, then aims it across the table at Ashley and lowers it. Other feeds show a woman in a towel by a candlelit bathtub, and two people with their hands bound above their heads against a wall, then a table splashed with red.
film.smg_sting.1=On the cinema screen, a blank, scratched film leader flickers, flashing jumbled letters and numbers.
film.smg_sting.2=Footage of Sam in a candlelit bath: she glances over her shoulder, climbs out and stands wrapped in a towel, looking around.
film.smg_sting.3=A huge spinning saw blade cuts into Josh, lying on a table with his arms above his head; blood sprays, he grimaces, blood bursts from his mouth, and blood and gore pour down beneath the table.
film.smg_sting.4=The blank leader flickers again.
film.projectorghost_movie=On the wall, old flickering footage: Emily, by a fireplace, talks to the camera, then pushes Ashley through a doorway; Hannah, in glasses, smiles shyly; two girls, then Ashley, grin from the dark; Hannah starts to unbutton her blouse, then turns her head sharply away.
film.projectorghost_scare=A red-lit close-up of Hannah, in glasses, smiling and talking; suddenly a ghastly white face with dark eye sockets and a bloody, gaping mouth flashes up, and the screen goes black.
film.projector_wendigo=On the wall, an old black-and-white film: a nurse leaves a patient sitting in a chair; he struggles free, climbs the wall and crawls across the ceiling into the dark. She returns to the empty chair, an arm reaches down at her from above, and after a flash she is gone; a pale figure lunges at the camera, and the picture topples sideways.
film.hannah_wendigo_reveal=A flash in sepia: an arm with a black butterfly tattoo, then Hannah, in glasses, her hands at her chest, smiling faintly at the camera.
film.newghosty_up=On the television, a pale, ghoulish face screams, its mouth stretched wide; for an instant it flickers into a pale woman's face with dark-ringed eyes.
film.sam_end_credits.1=Through a window, a dark bedroom at night. A phone lights up with an alarm, 06:00 AM, Work Alarm, its wallpaper Sam hugging a dog, beside pill bottles and a book, CREATURE MYTHS OF THE GREAT PLAINS. Sam lies on the bed under a turning ceiling fan; her eyes open wide.
film.sam_end_credits.2=A pill bottle drops and rolls beside another book, THE WENDIGO LOG. Sam sits up on the edge of the bed and swipes the alarm off; her thumb smears blood across the screen, and blood runs down her forearm.
film.sam_end_credits.3=She presses a tissue to a jagged cut on her forearm, but it bleeds again. Red light rises over her; she turns, wide-eyed.
film.sam_end_credits.4=Darkness, then the title: UNTIL DAWN.
film.totem_events_of_the_past.1=An old sepia photo of a man in a long coat and neckerchief, beside a note: NO ESCAPE. Sketches of a shaggy, fanged creature and of a clawed hand; headlines: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, and LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=A photo of miners under the headline MIRACLE MINERAL DISCOVERED; RADIUM; then MINING DISASTER and DEATH TOLL RISES, and a photo of miners scribbled over in black.
film.totem_events_of_the_past.3=Flashes of gore: bloody teeth and gums, a cracked skull, a blood-covered face with a bloodshot eye, maggots on raw flesh. HUNGER CRAVING scrawled on a wall; an X-ray marked HUMAN?
film.totem_events_of_the_past.4=A handwritten list: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. A dark photo of a hunched, pale figure, circled in red: CREATURE REPORTED. Sketches of a fanged creature, TEETH GROW & SHARPEN WITH AGE, and of a gaunt, long-limbed figure. THE ONLY WAY, an arrow to FIRE, circled; the page burns.
film.totem_events_of_the_past.5=Night: a lit wooden house among snowy pines. Beth, in a grey beanie and sweater, and Hannah, in glasses and a pink padded jacket, run in terror through the woods, hand in hand, out onto a misty clifftop.
film.totem_events_of_the_past.6=At a rope fence by a broken sign, CLIFF, they look back in terror; an orange heat-vision view shows them as glowing white shapes among the trees. Holding hands at the edge, Hannah slips over; Beth grabs her, and both fall.
film.totem_events_of_the_past.7=A man with tanks on his back runs to the cliff edge as a gaunt, long-limbed creature crawls toward him; close-ups of his goggles and of its gaping, fanged mouth. He bathes it in fire from his flamethrower; it burns, thrashing on the snow, and a ball of fire swells to fill the screen.
film.causaleffect_act1_3_samattackedbycrow=By a wire fence, a crow swoops at Sam; she ducks, hands to her face.
film.causaleffect_act2_1_mattlooksthroughtelescope=Through a telescope: on a snowy hillside, Mike holds someone in a fur-trimmed coat in a tight embrace.
film.causaleffect_act2_2_minetunnel=In the dark, between crossed timber beams, Mike leans into view and looks around, someone blurred behind him.
film.causaleffect_act2_4_samfindsbaseballbat=In a dark room, Sam swings a baseball bat, smiling; then Josh, lit by a torch, holds a bat and grins.
film.causaleffect_act2_5_jessthroughwindow_pants=By a window in the dark, a long, bony hand grabs screaming Jessica by the head and jerks her out of view.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Through a telescope: snowy rocks under a rock face; then, in near darkness, a gaunt, wrinkled face with glinting eyes fills the view.
film.causaleffect_act3_2_bridgefail=At night, Mike runs onto a small snowy rope bridge; a plank snaps under him and he drops out of sight.
film.causaleffect_act3_2_clifffail=On a snowy slope, Mike, holding up a lantern, slips and tumbles head over heels down the rocks.
film.causaleffect_act3_2_cliffsafe=On a rocky slope, Mike, lantern in hand, climbs carefully down the rocks.
film.causaleffect_act3_2_grabfencefail=Seen from above, Mike reaches for a wire fence on a snowy slope, slips and falls on his back in the snow below.
film.causaleffect_act3_2_grabrootfail=Seen from above, Mike clings to a thick root on a snowy slope, slips and falls on his back in the snow below.
film.causaleffect_act3_2_jumpclifffail=At night, Mike, lantern in hand, jumps down into a rocky gully, lands hard and clambers on.
film.causaleffect_act3_2_mikefallsover=Mike, lantern in hand, runs down a snowy wooded slope, trips and falls flat on his face.
film.causaleffect_act3_2_mikeisfast=Mike, lantern in hand, sprints along a snowy gully between rocks, straight toward the viewer.
film.causaleffect_act3_2_pipefail=Mike, a lantern held high, balances along a thick, snow-covered pipe, slips off and plunges into rushing water.
film.causaleffect_act3_2_shimmy=Seen from above, Mike climbs down between dark rocks; then he edges along a steep rock face, gripping it with one hand.
film.causaleffect_act3_2_takestairs=Mike, lantern in hand, runs up to a wooden hut and hurries up its snowy steps to the door.
film.causaleffect_act3_2_wendigointower_fast=Through a telescopic sight: crossed wooden beams in the snow; something small and grey rises into view beside the crosshairs.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=In the dark, a lighter's flame lights rough boards; through a gap between them, a pair of wide, glassy eyes stares out.
film.causaleffect_act4_1_chrissavesash=Through a wire mesh, someone sits under a hanging lamp; then a huge toothed saw blade, a man in a checked shirt in shadow beside it.
film.causaleffect_act4_2_mikebefriendswolf=Mike crouches beside a shaggy wolf and strokes its fur.
film.causaleffect_act4_2_mikekickswolf=In a doorway, Mike kicks out at a wolf; then, grimy, lantern raised, he holds up his other hand, grimacing.
film.causaleffect_act4_2_mikelooksatswolf=Mike holds up an open hand to a wolf; it lowers its head and turns away, then passes close in front of him.
film.causaleffect_act4_2_mikestillhasmachete=Hands at the jaws of a metal trap; Mike throws his head back in pain. Then, in a tiled room, he picks up a machete.
film.causaleffect_act4_2_wendigoheadinajar=A pale, mottled head with tiny glinting eyes, in a large glass jar.
film.causaleffect_act5_2_emgivesflaretomatt=In a wooden shack, Emily hands a flare gun to Matt; he takes it and looks down at it.
film.causaleffect_act5_3_chrisshotashley=At a small wooden table, Chris, in glasses, levels a pistol at Ashley, who cries.
film.causaleffect_act7_3_ashley_trapdoor=Seen from above, a hand with a ring and a knit wrist-warmer draws back the bolt of a wooden trapdoor and grips its handle.
film.intro_busride.1=Darkness, then the title: UNTIL DAWN.
film.intro_busride.2=Opening credits over dim close-ups of objects, faces glimpsed in them: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Over a rocking horse and an old radio set: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=At sunset, seen from above, a bus winds up a snowy mountain road through the pines.
film.intro_busride.5=On the bus, Sam sits by the window; on her phone: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Her phone plays a video: Josh, in a plaid shirt, talks to the camera in a dark room.
