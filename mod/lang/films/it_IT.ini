; Dawn Access film descriptions — Italian. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Notte, sul bordo di un dirupo: Hannah, con gli occhiali e una giacca rosa, si aggrappa a Beth, con berretto e maglione grigi. Hannah inciampa all'indietro oltre il bordo, trascinando Beth con sé; sotto, Beth si schianta di schiena su un masso, il sangue schizza.
film.death_act1_1_sisters_cliff.1=In fondo, Hannah giace con il volto insanguinato e gli occhi aperti, dietro di lei il corpo insanguinato di Beth.
film.death_act1_1_sisters_cliff_alone=Notte, su una parete rocciosa: la mano di Hannah scivola dalla presa di Beth e Hannah rotola giù per le rocce. Beth si protende verso una mano guantata che una figura scura le porge dall'alto, ma cade e si schianta su massi innevati; in fondo, Hannah giace insanguinata, con gli occhi aperti, mentre Beth atterra dietro di lei.
film.death_act3_2_jessica_liftshaft=Mike, sollevando una lanterna, guarda su per un pozzo; il corpo di lei cade davanti a lui sul pavimento a grata di una gabbia d'ascensore, con la mascella inferiore strappata via. Lui la fissa, tende la mano verso di lei, e la gabbia precipita in una pioggia di scintille.
film.death_act5_2_matt_climb=Indietreggiando davanti a un branco di cervi con le corna in una foresta nebbiosa, mette un piede nel vuoto da un bordo roccioso e precipita nel buio. Giace a faccia in giù su una roccia, una pozza di sangue sotto la bocca; in primo piano, il suo occhio aperto luccica di lacrime.
film.death_act5_2_matt_wendigo=Primo piano dei suoi occhi spaventati nel buio. Un Wendigo lo afferra da dietro e lo spinge su un gancio che pende tra le catene; il gancio gli trapassa la mascella dal basso e gli esce dalla bocca, e lui resta appeso lì, il volto coperto di sangue.
film.death_act6_3_emily_eyegauge=Un Wendigo le afferra la testa e le affonda i pollici negli occhi; lei urla mentre il sangue le scorre sul viso, poi pende inerte nella sua stretta.
film.death_act6_3_emily_oregrinder=Scivola lungo una canaletta innevata fin dentro la tramoggia di un trituratore e si aggrappa al bordo; le dita perdono la presa e lei cade tra rulli chiodati, urlando, il sangue che le sgorga dalla bocca, finché la testa non le ricade all'indietro.
film.death_act6_4_chris_lodgedoor=All'interno, Ashley alza lo sguardo e fa un passo avanti. Fuori, nel buio, un Wendigo lo afferra da dietro, gli artigli sul volto, e gli stacca la testa; la testa giace nella neve accanto al corpo.
film.death_act6_4_chris_lodgedoor_ja=Ashley, vista attraverso i vetri di una porta, guarda fuori e fa un passo avanti. Fuori, un Wendigo lo afferra da dietro, gli artigli sul volto, e lo trascina giù, fuori dall'inquadratura; ringhia verso l'obiettivo e se ne va, e resta solo il bosco buio.
film.death_act6_4_chris_runtolodge_ashimpassive=Nel buio, sulla neve, un Wendigo lo inchioda a terra e gli stacca la testa; la testa atterra sulla veranda innevata ai piedi di Ashley. Ashley, schizzata di sangue, sta in piedi a guardare in basso, con una smorfia.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Da terra, in un bosco buio: un Wendigo è accovacciato su di lui, alza la testa, con gli occhi che brillano, e si allontana. Primo piano di Ashley, schizzata di sangue e sull'orlo delle lacrime, con una smorfia; poi sta in piedi a guardare in basso.
film.death_act6_4_chris_runtolodge_ashscreams=Nel buio, sulla neve, un Wendigo lo inchioda a terra e gli stacca la testa; la testa vola in aria e rotola fino a fermarsi nella neve davanti a una porta a vetri. Dietro il vetro, Ashley si preme le mani sulla bocca e cade in ginocchio, piangendo.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Da terra, in un bosco buio: un Wendigo è accovacciato su di lui, alza la testa, con gli occhi che brillano, e si allontana. Dietro i vetri di una porta, Ashley si avvicina, si preme le mani sulla bocca e cade in ginocchio, piangendo, mentre alle sue spalle compare un uomo.
film.death_act7_1_emily_shotbymike=In una stanza buia illuminata dai monitor di sorveglianza, Mike si volta e avanza verso di lei con una pistola mentre Ashley guarda, la solleva con entrambe le mani e spara; il sangue schizza sulla parete, e in primo piano l'occhio sinistro di lei è un foro insanguinato, la testa rovesciata all'indietro, la bocca spalancata.
film.death_act7_1_emily_shotbymike_ja=In una stanza buia illuminata dai monitor di sorveglianza, Mike si volta e avanza verso di lei con una pistola mentre Ashley guarda, e la solleva con entrambe le mani. Allo sparo l'inquadratura passa a una mappa su una bacheca di sughero (BLACKWOOD PINES MOUNTAINS), che viene schizzata di sangue; poi, nel buio, le gambe di lei, con gli stivali, scivolano a terra.
film.death_act7_3_ashley_trapdoor_opened=Apre una botola nel pavimento; ne balza fuori un Wendigo, che si erge su di lei, inginocchiata, e le serra la testa tra le lunghe mani. Poi, su un pavimento di terra vuoto, la sua mano inerte ricade nell'inquadratura, e la testa staccata cade e rotola fino a fermarsi, con gli occhi e la bocca aperti.
film.death_act7_3_ashley_trapdoor_opened_ja=Apre una botola nel pavimento; ne balza fuori un Wendigo, che si erge su di lei, inginocchiata, e le serra la testa tra le lunghe mani. Poi si vede soltanto un passaggio di grotta, vuoto e buio.
film.death_act7_3_ashley_trapdoor_unbolted=Sta a qualche passo da una botola aperta; un Wendigo ne esce e le spinge giù la testa mentre lei urla. Poi, su un pavimento di terra vuoto, la sua mano inerte ricade nell'inquadratura, e la testa staccata cade e rotola fino a fermarsi, con gli occhi e la bocca aperti.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Sta a qualche passo da una botola aperta; un Wendigo ne esce e le spinge giù la testa mentre lei urla. Poi si vede soltanto una galleria di miniera, vuota e in penombra.
film.death_act7_3_chris_trapdoor1=Apre una botola; ne balza fuori un Wendigo, che si erge su di lui, inginocchiato, e gli torce la testa con le lunghe mani. Poi la sua testa staccata cade sul pavimento e resta dritta, rivolta verso lo spettatore: gli occhiali storti e incrinati, la bocca aperta.
film.death_act7_3_chris_trapdoor1_ja=Apre una botola; ne balza fuori un Wendigo, che si erge su di lui, inginocchiato, e gli afferra la testa. Poi si vedono soltanto delle travi di legno scure in alto.
film.death_act7_3_chris_trapdoor2=Mentre guarda in basso verso una botola chiusa, un Wendigo si lascia cadere davanti a lui, gli balza addosso e lo inchioda a terra sulla schiena. Gli squarcia la gola con gli artigli; il sangue sgorga, e il Wendigo solleva la testa staccata rivolgendola verso lo spettatore, la bocca aperta.
film.death_act7_3_chris_trapdoor2_ja=Mentre guarda in basso verso una botola chiusa, un Wendigo si lascia cadere davanti a lui, gli balza addosso e lo inchioda a terra sulla schiena. Poi si vedono soltanto delle travi di legno scure in alto.
film.death_act7_3_chris_tunnel1=In una galleria di miniera puntellata di legno, le sue gambe scalciano a mezz'aria, il resto del corpo fuori dall'inquadratura, in alto, mentre colano fiotti di sangue. Poi, davanti ad assi schizzate di sangue, il suo corpo senza testa cade a terra.
film.death_act7_3_chris_tunnel1_ja=In una galleria di miniera puntellata di legno, le sue gambe scalciano a mezz'aria, il resto del corpo fuori dall'inquadratura, in alto, mentre colano fiotti di sangue. Poi, davanti ad assi schizzate di sangue, il suo corpo cade a terra; si vedono solo le gambe e la schiena, e una mano si contrae.
film.death_act8_4_josh_wendigo=Un Wendigo emerge di scatto dall'acqua scura e gli serra la testa con entrambe le lunghe mani. Lui urla mentre le dita gli affondano nel cranio; il Wendigo stringe finché il sangue non sprizza fuori, schizzando sull'inquadratura.
film.death_act8_4_josh_wendigo_ja=Un Wendigo emerge di scatto dall'acqua scura e gli serra la testa con entrambe le lunghe mani. Lui urla mentre le dita gli affondano nel cranio; quando il Wendigo stringe, l'inquadratura si solleva allontanandosi da loro e gocce scure la schizzano.
film.death_act8_5_jessica_keepstill_timeout1=Primo piano: lei è distesa sulla schiena e urla, mentre un Wendigo le afferra la testa e le infila in bocca le dita artigliate; le strappa la mascella inferiore, con le fauci zannute accanto al volto immobile di lei. Poi giace inerte alla luce del fuoco, senza più la mascella inferiore.
film.death_act8_5_jessica_keepstill_timeout1_ja=Buio quasi totale: l'inquadratura scorre lentamente lungo un corpo disteso immobile a terra; poi, vicinissime, le costole e la testa di un Wendigo emergono dal buio.
film.death_act8_5_jessica_keepstill_timeout2=Primo piano, sotto la neve che cade: lei è distesa sulla schiena e urla, mentre un Wendigo le afferra la testa e le infila in bocca le dita artigliate; le strappa la mascella inferiore e avvicina al viso di lei il suo muso insanguinato e irto di denti. Poi giace inerte nella neve alla luce del fuoco, senza più la mascella inferiore.
film.death_act8_5_jessica_keepstill_timeout2_ja=Notte, tra rocce innevate: in primo piano, i lunghi arti artigliati di un Wendigo passano sopra la sagoma scura di qualcuno; poi l'inquadratura scivola lentamente su rocce deserte coperte di neve.
film.death_act8_5_jessica_leftbehind=In una galleria puntellata di legno lei corre con una lanterna; un Wendigo le salta sulla schiena e la atterra. In primo piano, le afferra la testa, le infila le dita artigliate nella bocca che urla e le strappa la mascella inferiore; poi giace inerte alla luce del fuoco, senza più la mascella inferiore, mentre la testa irta di denti del Wendigo le passa sopra in un lampo.
film.death_act8_5_jessica_leftbehind_ja=Buio quasi totale: l'inquadratura scorre lentamente lungo un corpo disteso immobile a terra; poi un Wendigo ossuto avanza carponi nel buio.
film.death_act8_5_jessica_timeout2=Primo piano: lei è distesa sulla schiena e urla; un Wendigo le afferra la sommità del capo con una mano artigliata e le infila in bocca le dita dell'altra.
film.death_act8_5_jessica_timeout2_ja=Buio quasi totale: l'inquadratura scorre lentamente lungo un corpo disteso immobile a terra.
film.death_act8_5_matt_gate=Sotto la neve che cade, un Wendigo è accovacciato sopra il vano illuminato di una porta in una parete di legno, poi gli balza addosso dall'alto. Accovacciato su di lui, si erge con le braccia alzate e gli fracassa il volto; in primo piano, il suo volto sfracellato e insanguinato nella neve.
film.death_act8_5_matt_gate_ja=Sotto la neve che cade, un Wendigo è accovacciato sopra il vano illuminato di una porta in una parete di legno, poi gli balza addosso dall'alto. Lui è disteso sulla schiena e gli artigli si protendono verso il suo volto; poi l'inquadratura indugia sul suo petto, con la lettera M sulla giacca, mentre giace immobile.
film.death_act8_5_matt_keepstill_timeout1=In una galleria puntellata di legno lui tiene una lanterna; un Wendigo gli salta addosso e lo butta a terra. Accovacciato su di lui, si erge con le braccia alzate e gli fracassa il volto; in primo piano, il suo volto sfracellato e insanguinato.
film.death_act8_5_matt_keepstill_timeout1_ja=In una galleria puntellata di legno lui tiene una lanterna; un Wendigo gli salta addosso e lo butta a terra. Il Wendigo è accovacciato su di lui, gli artigli protesi verso il suo volto; poi l'inquadratura indugia sul suo petto, con la lettera M sulla giacca, mentre giace immobile.
film.death_act8_5_matt_keepstill_timeout2=Sotto la neve che cade, un Wendigo è accovacciato su di lui mentre lui alza le mani; il Wendigo si erge e gli fracassa il volto. In primo piano, il suo volto sfracellato e insanguinato.
film.death_act8_5_matt_keepstill_timeout2_ja=Sotto la neve che cade, un Wendigo striscia sopra di lui mentre lui alza una mano; poi l'inquadratura indugia sul suo petto, con la lettera M sulla giacca, e lui giace immobile.
film.death_act8_5_matt_timeout1=Un Wendigo scende lungo travi di legno, si lancia su di lui e lo butta a terra. Accovacciato su di lui mentre lui alza una mano, si erge e gli fracassa il volto; in primo piano, il suo volto sfracellato e insanguinato.
film.death_act8_5_matt_timeout1_ja=Un Wendigo scende lungo travi di legno, si lancia su di lui e lo butta a terra. Il Wendigo è accovacciato su di lui e mostra i denti; poi l'inquadratura indugia sul suo petto, con la lettera M sulla giacca, mentre giace immobile.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=Nella baita, tra mobili coperti da teli, un Wendigo balza dal pavimento sulla parete mentre una foschia giallastra riempie la stanza. Un'esplosione di fuoco la scaraventa a faccia in giù sul pavimento; lei giace immobile mentre le fiamme divampano alle sue spalle.
film.death_act8_6_ashley_eyegauge=Un Wendigo con il tatuaggio di una farfalla sulla spalla le si avventa contro e le afferra la testa. Le affonda i pollici negli occhi, il sangue che le scorre sul viso, poi li estrae dalle orbite insanguinate mentre lei giace su un pavimento di legno.
film.death_act8_6_emily_explosion=Tra le fiamme che divampano, un Wendigo ringhia dietro dei paletti di legno. L'esplosione la scaraventa su un pavimento di legno; giace a pancia in giù, il volto gravemente ustionato.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=Nella baita, un Wendigo ruggisce dritto verso lo spettatore, poi gli urla in faccia mentre lui è addossato a una parete. Gli afferra la testa, gli squarcia il ventre e lo scaraventa dall'altra parte della stanza; lui crolla ai piedi di un pilastro di legno.
film.death_act8_6_mike_lightbulb_ja=Nella baita, un Wendigo urla dritto verso lo spettatore. Gli afferra la testa mentre lui gli preme le mani sul petto, gli urla in faccia e lo getta da parte; poi, visto da dietro, spalanca le lunghe braccia.
film.death_act8_6_mike_explosion_unijured=Nella baita, una palla di fuoco irrompe in una stanza piena di mobili coperti da teli e attraversa l'atrio, mandando in frantumi un vaso. Poi lui giace sul pavimento tra le fiamme, il volto gravemente ustionato.
film.death_act8_6_sam_wendigo1=Nella baita, la mano artigliata di un Wendigo la tiene sollevata per la gola; lei boccheggia, il sangue che le cola dalla bocca, la lampada frontale accesa. Il Wendigo le trapassa due volte il ventre con l'altro braccio e la lascia andare; lei cade a terra e resta immobile.
film.death_act8_6_sam_wendigo1_ja=Nella baita, un Wendigo la afferra. Visto dal basso, la tiene sollevata a braccio teso, una macchia scura e sfocata ai margini dell'inquadratura, e urla con la testa rovesciata all'indietro; poi si avventa verso lo spettatore e fugge via carponi.
film.4_3_being_watched_emilymatt_cctv_footage=Su un monitor, una telecamera fissa inquadra dall'alto un cancello di ferro in un muro di pietra innevato, di notte: Emily lo attraversa, poi Matt, che si richiude il cancello alle spalle; entrambi si allontanano, e il cancello resta deserto sotto la neve che cade.
film.act20_6_cctv_footage=Sui monitor, le immagini di sei telecamere: Chris e Ashley siedono uno di fronte all'altra a un tavolino sotto lame di sega appese; Chris spara due volte in aria con una pistola, poi la punta attraverso il tavolo contro Ashley e la abbassa. Altre immagini mostrano una donna in asciugamano accanto a una vasca illuminata da candele, e due persone con le mani legate sopra la testa contro una parete, poi un tavolo schizzato di rosso.
film.smg_sting.1=Sullo schermo della sala cinema tremola una pellicola vuota e graffiata, con lettere e numeri che balenano alla rinfusa.
film.smg_sting.2=Riprese di Sam in una vasca da bagno illuminata da candele: si guarda alle spalle, esce dalla vasca e resta in piedi avvolta in un asciugamano, guardandosi intorno.
film.smg_sting.3=Un'enorme lama di sega rotante affonda in Josh, disteso su un tavolo con le braccia sopra la testa; il sangue schizza, lui fa una smorfia, il sangue gli esplode dalla bocca, e sangue e brandelli di carne colano sotto il tavolo.
film.smg_sting.4=La pellicola vuota tremola di nuovo.
film.projectorghost_movie=Sulla parete, vecchie riprese tremolanti: Emily, accanto a un camino, parla alla telecamera, poi spinge Ashley oltre una porta; Hannah, con gli occhiali, sorride timida; due ragazze, poi Ashley, sogghignano dal buio; Hannah comincia a sbottonarsi la camicetta, poi gira di scatto la testa dall'altra parte.
film.projectorghost_scare=Un primo piano in luce rossa di Hannah, con gli occhiali, che sorride e parla; all'improvviso balena un orrendo volto bianco con orbite scure e una bocca spalancata e insanguinata, e lo schermo diventa nero.
film.projector_wendigo=Sulla parete, un vecchio film in bianco e nero: un'infermiera lascia un paziente seduto su una sedia; lui si divincola, si arrampica sulla parete e striscia sul soffitto fin dentro il buio. Lei torna alla sedia vuota, un braccio si protende verso di lei dall'alto e, dopo un lampo, lei è sparita; una figura pallida si scaglia contro la cinepresa, e l'immagine si rovescia di lato.
film.hannah_wendigo_reveal=Un lampo in seppia: un braccio con il tatuaggio di una farfalla nera, poi Hannah, con gli occhiali, le mani al petto, che accenna un sorriso verso l'obiettivo.
film.newghosty_up=Sul televisore, un volto pallido e orripilante urla, la bocca spalancata; per un istante, tremolando, si trasforma nel volto pallido di una donna con gli occhi cerchiati di scuro.
film.sam_end_credits.1=Attraverso una finestra, una camera da letto buia, di notte. Un telefono si illumina con una sveglia, 06:00 AM, Work Alarm, con lo sfondo di Sam che abbraccia un cane, accanto a flaconi di pillole e a un libro, CREATURE MYTHS OF THE GREAT PLAINS. Sam è distesa sul letto sotto un ventilatore da soffitto che gira; spalanca gli occhi.
film.sam_end_credits.2=Un flacone di pillole cade e rotola accanto a un altro libro, THE WENDIGO LOG. Sam si mette a sedere sul bordo del letto e spegne la sveglia scorrendo il dito; il pollice spalma sangue sullo schermo, e il sangue le cola lungo l'avambraccio.
film.sam_end_credits.3=Preme un fazzoletto su un taglio frastagliato sull'avambraccio, ma la ferita sanguina di nuovo. Una luce rossa si alza su di lei; si volta, con gli occhi sbarrati.
film.sam_end_credits.4=Buio, poi il titolo: UNTIL DAWN.
film.totem_events_of_the_past.1=Una vecchia foto color seppia di un uomo con un lungo cappotto e un fazzoletto al collo, accanto a un biglietto: NO ESCAPE. Schizzi di una creatura irsuta con le zanne e di una mano artigliata; titoli di giornale: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED e LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Una foto di minatori sotto il titolo MIRACLE MINERAL DISCOVERED; RADIUM; poi MINING DISASTER e DEATH TOLL RISES, e una foto di minatori scarabocchiata di nero.
film.totem_events_of_the_past.3=Lampi di immagini cruente: denti e gengive insanguinati, un cranio incrinato, un volto coperto di sangue con un occhio iniettato di sangue, vermi su carne cruda. HUNGER CRAVING scarabocchiato su una parete; una radiografia con la scritta HUMAN?
film.totem_events_of_the_past.4=Una lista scritta a mano: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Una foto scura di una figura pallida e curva, cerchiata di rosso: CREATURE REPORTED. Schizzi di una creatura con le zanne, TEETH GROW & SHARPEN WITH AGE, e di una figura scarna dagli arti lunghi. THE ONLY WAY, una freccia verso FIRE, cerchiato; la pagina brucia.
film.totem_events_of_the_past.5=Notte: una casa di legno illuminata tra pini innevati. Beth, con berretto e maglione grigi, e Hannah, con gli occhiali e un piumino rosa, corrono terrorizzate nel bosco, mano nella mano, fin sulla cima nebbiosa di un dirupo.
film.totem_events_of_the_past.6=Presso una recinzione di corda accanto a un cartello rotto, CLIFF, si voltano terrorizzate; una visione termica arancione le mostra come sagome di un bianco luminoso tra gli alberi. Mano nella mano sul bordo, Hannah scivola giù; Beth la afferra, e cadono entrambe.
film.totem_events_of_the_past.7=Un uomo con delle bombole sulla schiena corre verso il bordo del dirupo mentre una creatura scarna dagli arti lunghi striscia verso di lui; primi piani dei suoi occhiali protettivi e delle fauci spalancate e zannute della creatura. La investe di fuoco con il lanciafiamme; la creatura brucia, dibattendosi sulla neve, e una palla di fuoco si gonfia fino a riempire lo schermo.
film.causaleffect_act1_3_samattackedbycrow=Accanto a una recinzione di rete metallica, un corvo piomba su Sam; lei si abbassa, portandosi le mani al viso.
film.causaleffect_act2_1_mattlooksthroughtelescope=Attraverso un telescopio: su un pendio innevato, Mike stringe in un forte abbraccio qualcuno con un cappotto bordato di pelliccia.
film.causaleffect_act2_2_minetunnel=Nel buio, tra travi di legno incrociate, Mike si sporge nell'inquadratura e si guarda intorno, con qualcuno sfocato alle spalle.
film.causaleffect_act2_4_samfindsbaseballbat=In una stanza buia, Sam brandisce una mazza da baseball, sorridendo; poi Josh, illuminato da una torcia, tiene in mano una mazza e sogghigna.
film.causaleffect_act2_5_jessthroughwindow_pants=Accanto a una finestra, nel buio, una mano lunga e ossuta afferra per la testa Jessica, che urla, e la strattona fuori dall'inquadratura.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Attraverso un telescopio: rocce innevate sotto una parete rocciosa; poi, quasi al buio, un volto scarno e rugoso dagli occhi luccicanti riempie l'inquadratura.
film.causaleffect_act3_2_bridgefail=Di notte, Mike corre su un piccolo ponte di corda innevato; un'asse si spezza sotto di lui e lui precipita, sparendo alla vista.
film.causaleffect_act3_2_clifffail=Su un pendio innevato, Mike, sollevando una lanterna, scivola e ruzzola giù per le rocce a gambe all'aria.
film.causaleffect_act3_2_cliffsafe=Su un pendio roccioso, Mike, con una lanterna in mano, scende con cautela tra le rocce.
film.causaleffect_act3_2_grabfencefail=Vista dall'alto: Mike allunga la mano verso una recinzione di rete metallica su un pendio innevato, scivola e cade di schiena nella neve sottostante.
film.causaleffect_act3_2_grabrootfail=Vista dall'alto: Mike si aggrappa a una grossa radice su un pendio innevato, scivola e cade di schiena nella neve sottostante.
film.causaleffect_act3_2_jumpclifffail=Di notte, Mike, con una lanterna in mano, salta giù in un canalone roccioso, atterra pesantemente e prosegue arrampicandosi.
film.causaleffect_act3_2_mikefallsover=Mike, con una lanterna in mano, corre giù per un pendio boscoso e innevato, inciampa e cade faccia a terra.
film.causaleffect_act3_2_mikeisfast=Mike, con una lanterna in mano, sfreccia lungo un canalone innevato tra le rocce, dritto verso lo spettatore.
film.causaleffect_act3_2_pipefail=Mike, tenendo alta una lanterna, avanza in equilibrio su un grosso tubo coperto di neve, scivola e precipita nell'acqua impetuosa.
film.causaleffect_act3_2_shimmy=Vista dall'alto: Mike scende tra rocce scure; poi avanza di lato lungo una parete rocciosa ripida, aggrappandosi con una mano.
film.causaleffect_act3_2_takestairs=Mike, con una lanterna in mano, corre fino a una capanna di legno e sale di corsa i gradini innevati fino alla porta.
film.causaleffect_act3_2_wendigointower_fast=Attraverso un mirino telescopico: travi di legno incrociate nella neve; qualcosa di piccolo e grigio si alza nell'inquadratura accanto al reticolo.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=Nel buio, la fiamma di un accendino illumina assi grezze; da una fessura tra di esse, due occhi spalancati e vitrei guardano fuori, fissi.
film.causaleffect_act4_1_chrissavesash=Attraverso una rete metallica si vede qualcuno seduto sotto una lampada appesa; poi un'enorme lama di sega dentata e, accanto, nell'ombra, un uomo in camicia a quadri.
film.causaleffect_act4_2_mikebefriendswolf=Mike si accovaccia accanto a un lupo irsuto e gli accarezza il pelo.
film.causaleffect_act4_2_mikekickswolf=Sulla soglia di una porta, Mike sferra un calcio a un lupo; poi, sudicio, con la lanterna alzata, solleva l'altra mano facendo una smorfia.
film.causaleffect_act4_2_mikelooksatswolf=Mike tende una mano aperta verso un lupo; il lupo abbassa la testa e si volta, poi gli passa vicinissimo davanti.
film.causaleffect_act4_2_mikestillhasmachete=Mani sulle ganasce di una tagliola di metallo; Mike getta la testa all'indietro per il dolore. Poi, in una stanza piastrellata, raccoglie un machete.
film.causaleffect_act4_2_wendigoheadinajar=Una testa pallida e chiazzata, con minuscoli occhi luccicanti, in un grande barattolo di vetro.
film.causaleffect_act5_2_emgivesflaretomatt=In una baracca di legno, Emily porge una pistola lanciarazzi a Matt; lui la prende e la guarda.
film.causaleffect_act5_3_chrisshotashley=A un tavolino di legno, Chris, con gli occhiali, punta una pistola contro Ashley, che piange.
film.causaleffect_act7_3_ashley_trapdoor=Vista dall'alto: una mano con un anello e uno scaldapolsi di maglia tira indietro il chiavistello di una botola di legno e ne afferra la maniglia.
film.intro_busride.1=Buio, poi il titolo: UNTIL DAWN.
film.intro_busride.2=Titoli di testa su cupi primi piani di oggetti, in cui si intravedono dei volti: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Su un cavallo a dondolo e una vecchia radio: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=Al tramonto, vista dall'alto: un pullman sale serpeggiando lungo una strada di montagna innevata, tra i pini.
film.intro_busride.5=Sul pullman, Sam è seduta accanto al finestrino; sul suo telefono: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Il suo telefono riproduce un video: Josh, in camicia a quadri, parla alla telecamera in una stanza buia.
