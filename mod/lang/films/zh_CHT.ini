; Dawn Access film descriptions — Chinese (Traditional). Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=夜晚，懸崖邊：戴著眼鏡、穿粉紅色外套的漢娜抓著戴灰色毛帽、穿灰色毛衣的貝絲。漢娜一個踉蹌，仰面跌下懸崖，把貝絲也拽了下去；在下方，貝絲背部朝下重重砸在一塊巨石上，鮮血四濺。
film.death_act1_1_sisters_cliff.1=在崖底，漢娜躺著，滿臉是血，雙眼睜著，她身後是貝絲鮮血淋漓的身體。
film.death_act1_1_sisters_cliff_alone=夜晚，陡峭的崖壁上：漢娜的手從貝絲手中滑脫，她順著岩石滾落下去。貝絲伸手去搆上方一個黑影遞下來的戴手套的手，卻墜落下去，重重砸在積雪的巨石上；在崖底，漢娜渾身是血地躺著，雙眼睜著，貝絲落在她身後。
film.death_act3_2_jessica_liftshaft=麥可舉著提燈，抬頭望向井道；她的屍體落在他面前電梯廂的格柵地板上，下巴已被扯掉。麥可盯著她，向她伸出手，電梯廂隨即在一片火花中墜落下去。
film.death_act5_2_matt_climb=在霧氣瀰漫的森林裡，他從一群長著角的鹿面前步步後退，一腳踩空，從岩石邊緣墜入黑暗。他臉朝下趴在一塊岩石上，嘴下積著一灘血；特寫中，他睜著的眼睛閃著淚光。
film.death_act5_2_matt_wendigo=黑暗中，他驚恐雙眼的特寫。一隻溫迪戈從背後抓住他，把他按到一個掛在鐵鍊間的鉤子上；鉤子由下往上刺穿他的下巴，從嘴裡穿出，他就那樣掛著，滿臉是血。
film.death_act6_3_emily_eyegauge=一隻溫迪戈抓住她的頭，把拇指戳進她的雙眼；她尖叫著，鮮血順著臉流下，接著癱軟地垂在牠手中。
film.death_act6_3_emily_oregrinder=她順著積雪的滑槽滑進碾磨機的料斗，緊緊抓住料斗邊緣；手指一滑，她掉進布滿尖刺的滾輪之間，尖叫著，鮮血從嘴裡湧出，直到她的頭往後垂下。
film.death_act6_4_chris_lodgedoor=屋內，艾希莉抬起頭，向前跨了一步。屋外的黑暗中，一隻溫迪戈從背後抓住他，用利爪罩住他的臉，扯下了他的頭；頭落在他身體旁的雪地上。
film.death_act6_4_chris_lodgedoor_ja=透過門上的玻璃可以看到艾希莉，她往外望去，向前跨了一步。屋外，一隻溫迪戈從背後抓住他，用利爪罩住他的臉，把他往下拖出畫面；牠衝著鏡頭咆哮，然後離開，只留下黑暗的樹林。
film.death_act6_4_chris_runtolodge_ashimpassive=黑暗的雪地上，一隻溫迪戈把他壓倒，扯下了他的頭；頭落在積雪的門廊上，就在艾希莉腳邊。濺了一身血的艾希莉站著，皺著臉往下看。
film.death_act6_4_chris_runtolodge_ashimpassive_ja=從黑暗樹林的地面看去：一隻溫迪戈俯在他身上，抬起頭，雙眼閃著光，接著離開。艾希莉的特寫：她濺了一身血，幾乎要哭出來，臉皺成一團；接著她站著往下看。
film.death_act6_4_chris_runtolodge_ashscreams=黑暗的雪地上，一隻溫迪戈把他壓倒，扯下了他的頭；頭飛過半空，在雪地上滾動，停在一扇玻璃門前。玻璃後，艾希莉雙手摀住嘴，哭著跪倒在地。
film.death_act6_4_chris_runtolodge_ashscreams_ja=從黑暗樹林的地面看去：一隻溫迪戈俯在他身上，抬起頭，雙眼閃著光，接著離開。門上的玻璃後，艾希莉走過來，雙手摀住嘴，哭著跪倒在地，一個男人出現在她身後。
film.death_act7_1_emily_shotbymike=在一間被監視器螢幕照亮的昏暗房間裡，麥可轉過身，拿著槍朝她走去，艾希莉在一旁看著；他雙手舉槍開火：鮮血濺上牆壁，特寫中，她的左眼成了一個血洞，頭往後仰著，嘴巴大張。
film.death_act7_1_emily_shotbymike_ja=在一間被監視器螢幕照亮的昏暗房間裡，麥可轉過身，拿著槍朝她走去，艾希莉在一旁看著；他雙手舉起槍。槍響的一刻，畫面切到軟木板上的一張地圖（BLACKWOOD PINES MOUNTAINS），地圖上濺滿了血；接著，黑暗中，她穿著靴子的雙腿滑落到地上。
film.death_act7_3_ashley_trapdoor_opened=她打開地上的一扇暗門；一隻溫迪戈跳了出來，在跪著的她上方直起身子，用長長的雙手箍住她的頭。接著，在空無一物的泥地上，她無力的手落進畫面，然後她被扯下的頭掉下來，滾了幾下停住，眼睛和嘴巴都張著。
film.death_act7_3_ashley_trapdoor_opened_ja=她打開地上的一扇暗門；一隻溫迪戈跳了出來，在跪著的她上方直起身子，用長長的雙手箍住她的頭。接著只能看到一條空蕩蕩的黑暗洞穴通道。
film.death_act7_3_ashley_trapdoor_unbolted=她站在一扇敞開的暗門幾步之外；一隻溫迪戈爬了出來，按住她的頭把她壓低，她尖叫起來。接著，在空無一物的泥地上，她無力的手落進畫面，然後她被扯下的頭掉下來，滾了幾下停住，眼睛和嘴巴都張著。
film.death_act7_3_ashley_trapdoor_unbolted_ja=她站在一扇敞開的暗門幾步之外；一隻溫迪戈爬了出來，按住她的頭把她壓低，她尖叫起來。接著只能看到一條空蕩蕩的昏暗礦坑通道。
film.death_act7_3_chris_trapdoor1=他打開一扇暗門；一隻溫迪戈跳了出來，在跪著的他上方直起身子，用長長的雙手猛地扭轉他的頭。接著他被扯下的頭掉到地上，豎立著，面朝鏡頭：眼鏡歪斜碎裂，嘴巴張著。
film.death_act7_3_chris_trapdoor1_ja=他打開一扇暗門；一隻溫迪戈跳了出來，在跪著的他上方直起身子，抓住他的頭。接著只能看到頭頂上黑暗的木椽。
film.death_act7_3_chris_trapdoor2=他低頭看著一扇關著的暗門，一隻溫迪戈從上方跳到他面前，猛撲上去，把他仰面壓倒在地。牠用利爪劃開他的喉嚨；鮮血噴湧而出，牠舉起他被扯下的頭，讓臉朝向鏡頭，嘴巴張著。
film.death_act7_3_chris_trapdoor2_ja=他低頭看著一扇關著的暗門，一隻溫迪戈從上方跳到他面前，猛撲上去，把他仰面壓倒在地。接著只能看到頭頂上黑暗的木樑。
film.death_act7_3_chris_tunnel1=在一條木架支撐的礦坑隧道裡，他的雙腿在半空中亂蹬，身體其餘部分在上方畫面之外，一股股鮮血傾瀉而下。接著，在濺滿鮮血的木板前，他無頭的身體掉落在地上。
film.death_act7_3_chris_tunnel1_ja=在一條木架支撐的礦坑隧道裡，他的雙腿在半空中亂蹬，身體其餘部分在上方畫面之外，一股股鮮血傾瀉而下。接著，在濺滿鮮血的木板前，他的身體掉落在地上；只能看到他的雙腿和背部，一隻手抽搐著。
film.death_act8_4_josh_wendigo=一隻溫迪戈從黑暗的水中猛地衝出，用長長的雙手箍住他的頭。牠的手指壓進他的頭骨，他放聲尖叫；牠不斷擠壓，直到鮮血迸出，噴滿整個畫面。
film.death_act8_4_josh_wendigo_ja=一隻溫迪戈從黑暗的水中猛地衝出，用長長的雙手箍住他的頭。牠的手指壓進他的頭骨，他放聲尖叫；牠擠壓時，畫面從他們身上往上移開，深色的點滴濺到畫面上。
film.death_act8_5_jessica_keepstill_timeout1=特寫：她仰面躺著尖叫，一隻溫迪戈抓住她的頭，把長著利爪的手指塞進她嘴裡；牠扯掉她的下巴，長著獠牙的嘴就在她一動也不動的臉旁。接著她一動也不動地躺在火光中，下巴沒了。
film.death_act8_5_jessica_keepstill_timeout1_ja=幾乎一片漆黑：鏡頭緩緩掠過一具一動也不動地躺在地上的身體；接著，就在近處，一隻溫迪戈的肋骨和頭從黑暗中顯現出來。
film.death_act8_5_jessica_keepstill_timeout2=特寫，大雪紛飛：她仰面躺著尖叫，一隻溫迪戈抓住她的頭，把長著利爪的手指塞進她嘴裡；牠扯掉她的下巴，把沾滿鮮血、滿是利齒的臉湊近她的臉。接著她一動也不動地躺在火光映照的雪地裡，下巴沒了。
film.death_act8_5_jessica_keepstill_timeout2_ja=夜晚，積雪的岩石間：近處，一隻溫迪戈長著利爪的細長四肢從某人黑暗的身影上方掠過；接著鏡頭緩緩飄過空蕩蕩、覆滿積雪的岩石。
film.death_act8_5_jessica_leftbehind=在一條木架支撐的隧道裡，她提著提燈奔跑；一隻溫迪戈跳到她背上，把她撲倒。特寫中，牠抓住她的頭，把長著利爪的手指塞進她尖叫的嘴裡，扯掉了她的下巴；接著她一動也不動地躺在火光中，下巴沒了，牠那滿是利齒的頭從她上方一閃而過。
film.death_act8_5_jessica_leftbehind_ja=幾乎一片漆黑：鏡頭緩緩掠過一具一動也不動地躺在地上的身體；接著，一隻瘦骨嶙峋的溫迪戈四肢著地，在黑暗中爬行。
film.death_act8_5_jessica_timeout2=特寫：她仰面躺著尖叫；一隻溫迪戈用一隻長著利爪的手按住她的頭頂，把另一隻手的手指塞進她嘴裡。
film.death_act8_5_jessica_timeout2_ja=幾乎一片漆黑：鏡頭緩緩掠過一具一動也不動地躺在地上的身體。
film.death_act8_5_matt_gate=大雪紛飛中，一隻溫迪戈蹲在一面木牆上一個亮著燈的門口上方，接著朝他撲了下來。牠蹲伏在他身上，舉起雙臂直起身子，砸爛了他的臉；特寫中，他被砸爛的臉血肉模糊，躺在雪地裡。
film.death_act8_5_matt_gate_ja=大雪紛飛中，一隻溫迪戈蹲在一面木牆上一個亮著燈的門口上方，接著朝他撲了下來。他仰面躺著，溫迪戈的利爪伸向他的臉；接著鏡頭停在他的胸口，外套上有字母M，他一動也不動地躺著。
film.death_act8_5_matt_keepstill_timeout1=在一條木架支撐的隧道裡，他提著一盞提燈；一隻溫迪戈朝他撲來，把他撞倒。牠蹲伏在他身上，舉起雙臂直起身子，砸爛了他的臉；特寫中，他被砸爛的臉血肉模糊。
film.death_act8_5_matt_keepstill_timeout1_ja=在一條木架支撐的隧道裡，他提著一盞提燈；一隻溫迪戈朝他撲來，把他撞倒。牠蹲伏在他身上，利爪伸向他的臉；接著鏡頭停在他的胸口，外套上有字母M，他一動也不動地躺著。
film.death_act8_5_matt_keepstill_timeout2=大雪紛飛中，一隻溫迪戈蹲伏在他身上，他舉起雙手；溫迪戈直起身子，砸爛了他的臉。特寫中，他被砸爛的臉血肉模糊。
film.death_act8_5_matt_keepstill_timeout2_ja=大雪紛飛中，一隻溫迪戈從他身上爬過，他舉起一隻手；接著鏡頭停在他的胸口，外套上有字母M，他一動也不動地躺著。
film.death_act8_5_matt_timeout1=一隻溫迪戈順著木樑爬下來，朝他撲去，把他撞倒在地。他舉起一隻手，溫迪戈蹲伏在他身上，直起身子，砸爛了他的臉；特寫中，他被砸爛的臉血肉模糊。
film.death_act8_5_matt_timeout1_ja=一隻溫迪戈順著木樑爬下來，朝他撲去，把他撞倒在地。牠蹲伏在他身上，齜著牙；接著鏡頭停在他的胸口，外套上有字母M，他一動也不動地躺著。
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=在山莊裡，蓋著罩布的家具之間，一隻溫迪戈從地上跳到牆上，房間裡瀰漫著淡黃色的霧氣。一陣火焰爆炸把她掀飛，她臉朝下摔滑過地板；她一動也不動地躺著，身後烈火熊熊。
film.death_act8_6_ashley_eyegauge=一隻肩上有蝴蝶刺青的溫迪戈朝她撲來，抓住她的頭。牠把拇指戳進她的雙眼，鮮血順著她的臉流下，接著牠把拇指從血淋淋的眼窩裡拔出來；她躺在木地板上。
film.death_act8_6_emily_explosion=在驟然爆開的火焰中，一隻溫迪戈在木柱後咆哮。爆炸把她掀飛，摔過木地板；她趴在地上，臉被嚴重燒傷。
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=在山莊裡，一隻溫迪戈咆哮著衝進畫面，接著衝著靠牆站著的他的臉尖叫。牠抓住他的頭，用爪子在他腹部劃了一道，把他甩到房間另一頭；他摔落在一根木柱底下。
film.death_act8_6_mike_lightbulb_ja=在山莊裡，一隻溫迪戈尖叫著衝進畫面。他用手抵住牠的胸口，牠卻抓住他的頭，衝著他的臉尖叫，把他甩到一邊；接著，從背後看去，牠張開長長的雙臂。
film.death_act8_6_mike_explosion_unijured=在山莊裡，一團火球衝過一個擺滿蓋著罩布的家具的房間，橫掃大廳，把一個花瓶震得粉碎。接著他躺在火焰中的地板上，臉被嚴重燒傷。
film.death_act8_6_sam_wendigo1=在山莊裡，一隻溫迪戈長著利爪的手掐住她的喉嚨，把她舉在半空；她艱難地喘著氣，鮮血從嘴裡流出，額頭上的燈亮著。牠用另一隻手臂兩次刺穿她的腹部，然後鬆手；她跌落在地，一動也不動。
film.death_act8_6_sam_wendigo1_ja=在山莊裡，一隻溫迪戈抓住了她。從下方看去，牠伸直手臂把她舉在半空，她在畫面邊緣只是一團模糊的黑影；牠仰頭尖叫，接著朝鏡頭猛撲過來，又四肢著地迅速竄走。
film.4_3_being_watched_emilymatt_cctv_footage=監視器上，一台固定的攝影機俯拍著夜裡積雪石牆上的一道鐵門：艾蜜莉從門裡走過，接著是馬修，他順手把門拉上；兩人走遠，大雪中只剩空蕩蕩的鐵門。
film.act20_6_cctv_footage=監視器上是六台攝影機的畫面：克里斯多福和艾希莉在懸掛的鋸片下方的一張小桌旁相對而坐；克里斯多福朝上開了兩槍，然後隔著桌子把槍對準艾希莉，又放下了槍。其他畫面中，一個圍著浴巾的女人站在點著蠟燭的浴缸旁，兩個人雙手被綁在頭頂，靠牆站著，接著是一張濺滿紅色的桌子。
film.smg_sting.1=影音室的螢幕上，一段空白、滿是刮痕的膠片片頭閃爍著，雜亂的字母和數字一閃而過。
film.smg_sting.2=薩曼莎在點著蠟燭的浴缸裡的影片：她回頭瞥了一眼，從浴缸裡出來，裹著浴巾站著，四處張望。
film.smg_sting.3=一把巨大的旋轉鋸片切入約書亞的身體，他躺在桌上，雙臂舉過頭頂；鮮血噴濺，他面容扭曲，鮮血從嘴裡湧出，血和碎肉傾瀉到桌子下面。
film.smg_sting.4=空白的膠片片頭再次閃爍。
film.projectorghost_movie=牆上播放著閃爍的老錄影：艾蜜莉在壁爐邊對著鏡頭說話，然後把艾希莉推進一個門口；戴眼鏡的漢娜害羞地微笑；兩個女孩，然後是艾希莉，在黑暗中咧嘴笑著；漢娜開始解襯衫的釦子，接著猛地把頭扭開。
film.projectorghost_scare=紅光下戴眼鏡的漢娜的特寫，她微笑著說話；突然，一張眼窩漆黑、血口大張的慘白恐怖面孔閃現出來，螢幕隨即變黑。
film.projector_wendigo=牆上播放著一部黑白老電影：一名護士離開坐在椅子上的病人；病人掙脫束縛，爬上牆壁，又沿著天花板爬進黑暗中。護士回到空椅子旁，一隻手臂從上方朝她伸下來，一道閃光之後，她不見了；一個蒼白的身影撲向鏡頭，畫面往一側倒下。
film.hannah_wendigo_reveal=棕褐色調的畫面一閃：一隻有黑色蝴蝶刺青的手臂，然後是戴眼鏡的漢娜，雙手放在胸前，對著鏡頭淡淡地微笑。
film.newghosty_up=電視上，一張蒼白、食屍鬼般的臉張大嘴巴尖叫；一瞬間，那張臉閃變成一張眼圈發黑的蒼白女人的臉。
film.sam_end_credits.1=透過窗戶，夜晚一間昏暗的臥室。一支手機亮起鬧鐘：06:00 AM，Work Alarm，桌布是薩曼莎抱著一隻狗；旁邊是藥瓶和一本書，CREATURE MYTHS OF THE GREAT PLAINS。薩曼莎躺在床上，頭頂的吊扇在轉；她的眼睛猛然睜大。
film.sam_end_credits.2=一個藥瓶掉下來，滾到另一本書THE WENDIGO LOG旁邊。薩曼莎在床邊坐起身，滑動螢幕關掉鬧鐘；她的拇指在螢幕上抹下一道血跡，鮮血順著她的前臂流下。
film.sam_end_credits.3=她用面紙按住前臂上一道參差不齊的傷口，但傷口又流血了。紅光漸漸籠罩了她；她轉過身，雙眼圓睜。
film.sam_end_credits.4=一片黑暗，然後是標題：UNTIL DAWN。
film.totem_events_of_the_past.1=一張陳舊的棕褐色照片：一個穿長大衣、繫著領巾的男人，旁邊一張字條：NO ESCAPE。一隻毛髮蓬亂、長著獠牙的怪物和一隻長著利爪的手的素描；報紙標題：LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED和LOCAL MAN FOUND DEAD。
film.totem_events_of_the_past.2=標題MIRACLE MINERAL DISCOVERED下方是一張礦工的照片；RADIUM；然後是MINING DISASTER和DEATH TOLL RISES，以及一張被黑筆塗得亂七八糟的礦工照片。
film.totem_events_of_the_past.3=血腥畫面一閃而過：血淋淋的牙齒和牙齦、一顆裂開的頭骨、一張滿是血的臉上一隻布滿血絲的眼睛、生肉上的蛆蟲。牆上潦草地寫著HUNGER CRAVING；一張標著HUMAN?的X光片。
film.totem_events_of_the_past.4=一份手寫清單：HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER。一張昏暗的照片，上面一個佝僂的蒼白身影被紅圈圈了起來：CREATURE REPORTED。一隻長著獠牙的怪物的素描，寫著TEETH GROW & SHARPEN WITH AGE，還有一個枯瘦、四肢修長的身影的素描。THE ONLY WAY，一個箭頭指向被圈起的FIRE；紙頁燃燒起來。
film.totem_events_of_the_past.5=夜晚：積雪的松林間，一棟亮著燈的木屋。戴灰色毛帽、穿灰色毛衣的貝絲，和戴眼鏡、穿粉紅色羽絨外套的漢娜手牽著手，驚恐地穿過樹林奔跑，跑上一片霧氣籠罩的崖頂。
film.totem_events_of_the_past.6=在一塊折斷的告示牌CLIFF旁的繩欄邊，她們驚恐地回頭張望；在橘色的熱成像畫面中，她們是樹林間發著白光的身影。在懸崖邊，兩人手牽著手，漢娜滑了下去；貝絲抓住她，兩人一起墜落。
film.totem_events_of_the_past.7=一個背著氣罐的男人跑向懸崖邊，一隻枯瘦、四肢修長的怪物朝他爬去；他的護目鏡和怪物張開的獠牙大嘴的特寫。他用噴火器向怪物噴射火焰；怪物在雪地上翻滾著燃燒，一團火球膨脹開來，佔滿了整個螢幕。
film.causaleffect_act1_3_samattackedbycrow=在一道鐵絲網圍籬旁，一隻烏鴉朝薩曼莎俯衝過來；她彎下身子，雙手摀著臉。
film.causaleffect_act2_1_mattlooksthroughtelescope=透過望遠鏡：在積雪的山坡上，麥可緊緊擁抱著一個穿著鑲毛邊外套的人。
film.causaleffect_act2_2_minetunnel=黑暗中，在交叉的木樑之間，麥可探身進入畫面，四下張望，身後有一個模糊的人影。
film.causaleffect_act2_4_samfindsbaseballbat=在一間昏暗的房間裡，薩曼莎笑著揮動一根棒球棍；接著，被手電筒照亮的約書亞拿著一根球棍，咧嘴笑著。
film.causaleffect_act2_5_jessthroughwindow_pants=黑暗中，在一扇窗戶旁，一隻長長的、瘦骨嶙峋的手抓住尖叫的潔西卡的頭，猛地把她拖出畫面。
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=透過望遠鏡：一面岩壁下積雪的岩石；接著，在幾近漆黑之中，一張枯瘦、滿是皺紋、雙眼閃著光的臉佔滿了整個畫面。
film.causaleffect_act3_2_bridgefail=夜晚，麥可跑上一座積雪的小繩橋；一塊木板在他腳下斷裂，他掉了下去，消失在視野中。
film.causaleffect_act3_2_clifffail=在積雪的山坡上，舉著提燈的麥可腳下一滑，順著岩石翻著跟斗滾了下去。
film.causaleffect_act3_2_cliffsafe=在多岩石的山坡上，提著提燈的麥可小心翼翼地順著岩石往下爬。
film.causaleffect_act3_2_grabfencefail=俯視角度：在積雪的山坡上，麥可伸手去搆一道鐵絲網圍籬，腳下一滑，仰面摔進下方的雪裡。
film.causaleffect_act3_2_grabrootfail=俯視角度：在積雪的山坡上，麥可緊緊抓住一條粗大的樹根，腳下一滑，仰面摔進下方的雪裡。
film.causaleffect_act3_2_jumpclifffail=夜晚，提著提燈的麥可跳進一條岩石嶙峋的溝壑，重重落地，又繼續往前攀爬。
film.causaleffect_act3_2_mikefallsover=提著提燈的麥可沿著積雪的林間山坡往下跑，被絆了一下，臉朝下撲倒在地。
film.causaleffect_act3_2_mikeisfast=提著提燈的麥可沿著岩石間一條積雪的溝壑飛奔，直直衝向鏡頭。
film.causaleffect_act3_2_pipefail=麥可高高舉著提燈，在一根積雪的粗管子上保持平衡往前走，腳下一滑，跌進湍急的水流中。
film.causaleffect_act3_2_shimmy=俯視角度：麥可在黑暗的岩石之間往下爬；接著，他一隻手扒住陡峭的岩壁，貼著岩壁橫向挪動。
film.causaleffect_act3_2_takestairs=提著提燈的麥可跑到一間木屋前，快步登上積雪的台階，來到門口。
film.causaleffect_act3_2_wendigointower_fast=透過瞄準鏡：雪地裡交叉的木樑；十字準星旁，一個灰色的小東西升起，進入畫面。
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=黑暗中，打火機的火焰照亮粗糙的木板；從木板間的縫隙裡，一雙睜得大大的、玻璃般的眼睛向外瞪著。
film.causaleffect_act4_1_chrissavesash=透過鐵絲網，可以看到有人坐在一盞吊燈下；接著是一片巨大的帶齒鋸片，旁邊的陰影裡是一個穿格子襯衫的男人。
film.causaleffect_act4_2_mikebefriendswolf=麥可蹲在一隻毛髮蓬亂的狼旁邊，撫摸牠的毛。
film.causaleffect_act4_2_mikekickswolf=在一個門口，麥可朝一隻狼踢去；接著，渾身髒污的他舉著提燈，抬起另一隻手，皺著臉。
film.causaleffect_act4_2_mikelooksatswolf=麥可朝一隻狼舉起攤開的手掌；狼低下頭，轉過身去，接著從他面前很近的地方走過。
film.causaleffect_act4_2_mikestillhasmachete=雙手放在一個金屬捕獸夾的夾口處；麥可痛得仰起頭。接著，在一間貼著磁磚的房間裡，他撿起一把開山刀。
film.causaleffect_act4_2_wendigoheadinajar=一個大玻璃罐裡，裝著一顆蒼白、布滿斑點、長著閃光小眼睛的頭。
film.causaleffect_act5_2_emgivesflaretomatt=在一間木棚裡，艾蜜莉把一把信號槍遞給馬修；他接過來，低頭看著它。
film.causaleffect_act5_3_chrisshotashley=在一張小木桌旁，戴著眼鏡的克里斯多福用手槍指著正在哭泣的艾希莉。
film.causaleffect_act7_3_ashley_trapdoor=俯視角度：一隻戴著戒指和針織護腕的手拉開一扇木製暗門的門閂，握住門上的把手。
film.intro_busride.1=一片黑暗，然後是標題：UNTIL DAWN。
film.intro_busride.2=片頭字幕疊在一組昏暗的物件特寫上，物件中隱約閃過人臉：HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE。
film.intro_busride.3=背景是一隻搖搖木馬和一台老式無線電台：ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS。
film.intro_busride.4=日落時分，俯視角度：一輛巴士沿著積雪的山路在松林間蜿蜒而上。
film.intro_busride.5=巴士上，薩曼莎坐在窗邊；她的手機螢幕上：LIVE STREAMING NEWS, RADIO FROM THE PINES。
film.intro_busride.6=她的手機正在播放一段影片：穿格子襯衫的約書亞在一間昏暗的房間裡對著鏡頭說話。
