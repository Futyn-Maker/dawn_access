; Dawn Access film descriptions — Dutch. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Nacht, aan de rand van een klif: Hannah, met een bril en een roze jas, houdt zich vast aan Beth, in een grijze muts en trui. Hannah struikelt achterover over de rand en sleurt Beth met zich mee; beneden smakt Beth met haar rug op een rotsblok, en er spuit bloed op.
film.death_act1_1_sisters_cliff.1=Beneden ligt Hannah met een bebloed gezicht en open ogen, met het bebloede lichaam van Beth achter haar.
film.death_act1_1_sisters_cliff_alone=Nacht, op een rotswand: Hannahs hand glipt uit Beths greep en ze tuimelt over de rotsen omlaag. Beth reikt omhoog naar een hand met een handschoen die een donkere gestalte van bovenaf naar beneden steekt, maar valt en smakt op besneeuwde rotsblokken; beneden ligt Hannah bebloed, met open ogen, terwijl Beth achter haar neerkomt.
film.death_act3_2_jessica_liftshaft=Mike, met een geheven lantaarn, kijkt omhoog in een schacht; haar lichaam valt vlak voor hem op de roostervloer van een liftkooi, haar onderkaak afgerukt. Hij staart, reikt naar haar, en de kooi stort omlaag in een regen van vonken.
film.death_act5_2_matt_climb=Terwijl hij in een mistig bos achteruitwijkt voor een roedel herten met geweien, stapt hij van een rotsrand af en valt het donker in. Hij ligt voorover op een rots, een plas bloed onder zijn mond; in close-up glinstert zijn open oog van de tranen.
film.death_act5_2_matt_wendigo=Close-up van zijn angstige ogen in het donker. Een Wendigo grijpt hem van achteren en duwt hem met kracht op een haak die tussen kettingen hangt; de haak gaat van onderen door zijn kaak en komt uit zijn mond naar buiten, en hij hangt daar, zijn gezicht onder het bloed.
film.death_act6_3_emily_eyegauge=Een Wendigo grijpt haar hoofd en drukt zijn duimen in haar ogen; ze schreeuwt terwijl het bloed over haar gezicht stroomt, en hangt dan slap in zijn greep.
film.death_act6_3_emily_oregrinder=Ze glijdt via een besneeuwde goot in de trechter van een ertsmolen en klampt zich vast aan de rand; haar vingers glippen weg en ze valt tussen met pinnen bezette walsen, schreeuwend, met bloed dat uit haar mond gutst, tot haar hoofd achteroverzakt.
film.death_act6_4_chris_lodgedoor=Binnen kijkt Ashley op en stapt naar voren. Buiten in het donker grijpt een Wendigo hem van achteren, de klauwen over zijn gezicht, en rukt zijn hoofd eraf; het hoofd ligt in de sneeuw naast zijn lichaam.
film.death_act6_4_chris_lodgedoor_ja=Ashley, gezien door de ruitjes van een deur, kijkt naar buiten en stapt naar voren. Buiten grijpt een Wendigo hem van achteren, de klauwen over zijn gezicht, en trekt hem omlaag uit beeld; de Wendigo gromt naar de camera en loopt weg, en het donkere bos blijft achter.
film.death_act6_4_chris_runtolodge_ashimpassive=In de donkere sneeuw drukt een Wendigo hem tegen de grond en rukt zijn hoofd eraf; het hoofd belandt op de besneeuwde veranda aan Ashleys voeten. Ashley, met bloed bespat, staat omlaag te kijken met een vertrokken gezicht.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Vanaf de grond in een donker bos: een Wendigo zit gehurkt over hem heen, heft zijn kop, met glinsterende ogen, en gaat weg. Close-up van Ashley, met bloed bespat en den tranen nabij, met een vertrokken gezicht; dan staat ze omlaag te kijken.
film.death_act6_4_chris_runtolodge_ashscreams=In de donkere sneeuw drukt een Wendigo hem tegen de grond en rukt zijn hoofd eraf; het hoofd vliegt door de lucht en rolt in de sneeuw tot stilstand voor een deur met ruitjes. Achter het glas drukt Ashley haar handen tegen haar mond en zakt huilend op haar knieën.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Vanaf de grond in een donker bos: een Wendigo zit gehurkt over hem heen, heft zijn kop, met glinsterende ogen, en gaat weg. Achter de ruitjes van een deur komt Ashley aanlopen, drukt haar handen tegen haar mond en zakt huilend op haar knieën, terwijl er achter haar een man verschijnt.
film.death_act7_1_emily_shotbymike=In een donkere kamer, verlicht door bewakingsmonitoren, draait Mike zich om en komt met een wapen op haar af terwijl Ashley toekijkt, heft het met beide handen en schiet; er spat bloed op de muur, en in close-up is haar linkeroog een bloedig gat, haar hoofd achterovergeslagen, haar mond wijd open.
film.death_act7_1_emily_shotbymike_ja=In een donkere kamer, verlicht door bewakingsmonitoren, draait Mike zich om en komt met een wapen op haar af terwijl Ashley toekijkt, en heft het met beide handen. Bij het schot springt het beeld naar een kaart op een kurken prikbord (BLACKWOOD PINES MOUNTAINS), waarop bloed spat; dan glijden in het donker haar benen in laarzen naar de vloer.
film.death_act7_3_ashley_trapdoor_opened=Ze opent een valluik in de vloer; een Wendigo springt eruit, rijst boven haar uit terwijl ze knielt en klemt zijn lange handen om haar hoofd. Dan valt op een lege aarden vloer haar slappe hand in beeld, en haar afgerukte hoofd tuimelt neer en rolt tot stilstand, ogen en mond open.
film.death_act7_3_ashley_trapdoor_opened_ja=Ze opent een valluik in de vloer; een Wendigo springt eruit, rijst boven haar uit terwijl ze knielt en klemt zijn lange handen om haar hoofd. Dan is alleen nog een lege, donkere grotgang te zien.
film.death_act7_3_ashley_trapdoor_unbolted=Ze staat een paar passen van een open valluik; een Wendigo klimt eruit en drukt haar aan haar hoofd omlaag terwijl ze schreeuwt. Dan valt op een lege aarden vloer haar slappe hand in beeld, en haar afgerukte hoofd tuimelt neer en rolt tot stilstand, ogen en mond open.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Ze staat een paar passen van een open valluik; een Wendigo klimt eruit en drukt haar aan haar hoofd omlaag terwijl ze schreeuwt. Dan is alleen nog een lege, schemerige mijngang te zien.
film.death_act7_3_chris_trapdoor1=Hij opent een valluik; een Wendigo springt eruit, rijst boven hem uit terwijl hij knielt en draait met zijn lange handen zijn hoofd om. Dan valt zijn afgerukte hoofd op de vloer en blijft rechtop staan, met het gezicht naar de kijker: de bril scheef en gebarsten, de mond open.
film.death_act7_3_chris_trapdoor1_ja=Hij opent een valluik; een Wendigo springt eruit, rijst boven hem uit terwijl hij knielt en grijpt zijn hoofd. Dan zijn alleen nog donkere houten spanten in de hoogte te zien.
film.death_act7_3_chris_trapdoor2=Terwijl hij omlaag kijkt naar een gesloten valluik, springt een Wendigo vlak voor hem naar beneden, bespringt hem en drukt hem op zijn rug tegen de grond. De Wendigo rijt zijn keel open met zijn klauwen; het bloed gutst eruit, en hij tilt het afgerukte hoofd op, met het gezicht naar de kijker, de mond open.
film.death_act7_3_chris_trapdoor2_ja=Terwijl hij omlaag kijkt naar een gesloten valluik, springt een Wendigo vlak voor hem naar beneden, bespringt hem en drukt hem op zijn rug tegen de grond. Dan zijn alleen nog donkere houten balken in de hoogte te zien.
film.death_act7_3_chris_tunnel1=In een met hout gestutte mijngang trappen zijn benen in de lucht, de rest van hem buiten beeld daarboven, terwijl er stromen bloed omlaag gutsen. Dan valt zijn onthoofde lichaam voor met bloed bespatte planken op de grond.
film.death_act7_3_chris_tunnel1_ja=In een met hout gestutte mijngang trappen zijn benen in de lucht, de rest van hem buiten beeld daarboven, terwijl er stromen bloed omlaag gutsen. Dan valt zijn lichaam voor met bloed bespatte planken op de grond; alleen zijn benen en rug zijn te zien, en een hand schokt.
film.death_act8_4_josh_wendigo=Een Wendigo schiet omhoog uit donker water en klemt beide lange handen om zijn hoofd. Hij schreeuwt terwijl de vingers in zijn schedel drukken; de Wendigo knijpt tot het bloed eruit spat en over het beeld sproeit.
film.death_act8_4_josh_wendigo_ja=Een Wendigo schiet omhoog uit donker water en klemt beide lange handen om zijn hoofd. Hij schreeuwt terwijl de vingers in zijn schedel drukken; terwijl de Wendigo knijpt, beweegt het beeld omhoog van hen weg en spatten er donkere druppels overheen.
film.death_act8_5_jessica_keepstill_timeout1=Close-up: ze ligt op haar rug te schreeuwen terwijl een Wendigo haar hoofd vastgrijpt en zijn vingers met klauwen in haar mond wringt; hij rukt haar onderkaak eraf, zijn bek met slagtanden naast haar verstarde gezicht. Dan ligt ze roerloos in het licht van het vuur, haar onderkaak weg.
film.death_act8_5_jessica_keepstill_timeout1_ja=Bijna zwart: de camera glijdt langzaam langs een lichaam dat roerloos op de grond ligt; dan doemen vlakbij de ribben en de kop van een Wendigo op uit het donker.
film.death_act8_5_jessica_keepstill_timeout2=Close-up, in vallende sneeuw: ze ligt op haar rug te schreeuwen terwijl een Wendigo haar hoofd vastgrijpt en zijn vingers met klauwen in haar mond wringt; hij rukt haar onderkaak eraf en brengt zijn bebloede kop vol tanden vlak bij haar gezicht. Dan ligt ze roerloos in de sneeuw, in het licht van het vuur, haar onderkaak weg.
film.death_act8_5_jessica_keepstill_timeout2_ja=Nacht, tussen besneeuwde rotsen: van dichtbij bewegen de lange ledematen met klauwen van een Wendigo voorbij over iemands donkere silhouet; dan zweeft de camera langzaam over lege, besneeuwde rotsen.
film.death_act8_5_jessica_leftbehind=In een met hout gestutte gang rent ze met een lantaarn; een Wendigo springt op haar rug en werkt haar tegen de grond. In close-up grijpt hij haar hoofd, wringt zijn vingers met klauwen in haar schreeuwende mond en rukt haar onderkaak eraf; dan ligt ze roerloos in het licht van het vuur, haar onderkaak weg, terwijl zijn kop vol tanden boven haar voorbijflitst.
film.death_act8_5_jessica_leftbehind_ja=Bijna zwart: de camera glijdt langzaam langs een lichaam dat roerloos op de grond ligt; dan kruipt een knokige Wendigo op handen en voeten door het donker.
film.death_act8_5_jessica_timeout2=Close-up: ze ligt op haar rug te schreeuwen; een Wendigo grijpt met één hand met klauwen haar kruin vast en wringt de vingers van de andere in haar mond.
film.death_act8_5_jessica_timeout2_ja=Bijna zwart: de camera glijdt langzaam langs een lichaam dat roerloos op de grond ligt.
film.death_act8_5_matt_gate=In vallende sneeuw zit een Wendigo gehurkt boven een verlichte deuropening in een houten muur en springt dan omlaag op hem af. Over hem heen gehurkt richt de Wendigo zich met geheven armen op en verbrijzelt zijn gezicht; in close-up ligt zijn gezicht verbrijzeld en bebloed in de sneeuw.
film.death_act8_5_matt_gate_ja=In vallende sneeuw zit een Wendigo gehurkt boven een verlichte deuropening in een houten muur en springt dan omlaag op hem af. Terwijl hij op zijn rug ligt, reiken de klauwen naar zijn gezicht; dan blijft de camera rusten op zijn borst, met de letter M op zijn jas, terwijl hij roerloos ligt.
film.death_act8_5_matt_keepstill_timeout1=In een met hout gestutte gang houdt hij een lantaarn vast; een Wendigo springt op hem af en werkt hem tegen de grond. Over hem heen gehurkt richt de Wendigo zich met geheven armen op en verbrijzelt zijn gezicht; in close-up ligt zijn gezicht verbrijzeld en bebloed.
film.death_act8_5_matt_keepstill_timeout1_ja=In een met hout gestutte gang houdt hij een lantaarn vast; een Wendigo springt op hem af en werkt hem tegen de grond. De Wendigo hurkt over hem heen, de klauwen naar zijn gezicht uitgestrekt; dan blijft de camera rusten op zijn borst, met de letter M op zijn jas, terwijl hij roerloos ligt.
film.death_act8_5_matt_keepstill_timeout2=In vallende sneeuw zit een Wendigo over hem heen gehurkt terwijl hij zijn handen opheft; de Wendigo richt zich op en verbrijzelt zijn gezicht. In close-up ligt zijn gezicht verbrijzeld en bebloed.
film.death_act8_5_matt_keepstill_timeout2_ja=In vallende sneeuw kruipt een Wendigo over hem heen terwijl hij een hand opheft; dan blijft de camera rusten op zijn borst, met de letter M op zijn jas, terwijl hij roerloos ligt.
film.death_act8_5_matt_timeout1=Een Wendigo klimt langs houten balken omlaag, springt op hem af en werkt hem tegen de grond. Over hem heen gehurkt, terwijl hij een hand opheft, richt de Wendigo zich op en verbrijzelt zijn gezicht; in close-up ligt zijn gezicht verbrijzeld en bebloed.
film.death_act8_5_matt_timeout1_ja=Een Wendigo klimt langs houten balken omlaag, springt op hem af en werkt hem tegen de grond. De Wendigo hurkt over hem heen en ontbloot zijn tanden; dan blijft de camera rusten op zijn borst, met de letter M op zijn jas, terwijl hij roerloos ligt.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=In het huis, tussen met lakens afgedekte meubels, springt een Wendigo van de vloer op de muur terwijl een gelige nevel de kamer vult. Een vuurexplosie smijt haar voorover over de vloer; ze ligt roerloos terwijl achter haar de vlammen woeden.
film.death_act8_6_ashley_eyegauge=Een Wendigo met een vlindertatoeage op zijn schouder springt op haar af en grijpt haar hoofd. Hij drukt zijn duimen in haar ogen, terwijl het bloed over haar gezicht stroomt, en trekt zijn duimen dan uit de bloedige oogkassen terwijl ze op een houten vloer ligt.
film.death_act8_6_emily_explosion=Te midden van oplaaiend vuur gromt een Wendigo achter houten palen. De explosie slingert haar over een houten vloer; ze ligt op haar buik, haar gezicht zwaar verbrand.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=In het huis brult een Wendigo recht naar de kijker en krijst hem dan in het gezicht, terwijl hij tegen een muur staat. De Wendigo grijpt zijn hoofd, haalt uit over zijn buik en smijt hem door de kamer; hij valt neer aan de voet van een houten pilaar.
film.death_act8_6_mike_lightbulb_ja=In het huis krijst een Wendigo recht naar de kijker. De Wendigo grijpt zijn hoofd terwijl hij hem tegen de borst duwt, krijst hem in het gezicht en smijt hem opzij; dan, van achteren gezien, spreidt de Wendigo zijn lange armen wijd uit.
film.death_act8_6_mike_explosion_unijured=In het huis slaat een vuurbal door een kamer vol met lakens afgedekte meubels en raast door de hal, waarbij een vaas aan scherven gaat. Dan ligt hij op de vloer tussen de vlammen, zijn gezicht zwaar verbrand.
film.death_act8_6_sam_wendigo1=In het huis houdt de hand met klauwen van een Wendigo haar bij de keel omhoog; ze hapt naar adem, er loopt bloed uit haar mond, de lamp op haar voorhoofd brandt. Met zijn andere arm doorboort hij twee keer haar buik en laat haar los; ze valt op de vloer en blijft roerloos liggen.
film.death_act8_6_sam_wendigo1_ja=In het huis grijpt een Wendigo haar. Van onderaf gezien houdt hij haar met gestrekte arm omhoog, een donkere, wazige vlek aan de rand van het beeld, en krijst met zijn kop achterover; dan springt hij recht op de kijker af en rent op handen en voeten weg.
film.4_3_being_watched_emilymatt_cctv_footage=Op een monitor kijkt een vaste camera 's nachts neer op een ijzeren hek in een besneeuwde stenen muur: Emily komt erdoor, dan Matt, die het hek achter zich dichttrekt; ze lopen allebei weg, en het hek staat verlaten in de vallende sneeuw.
film.act20_6_cctv_footage=Op de monitoren, zes camerabeelden: Chris en Ashley zitten tegenover elkaar aan een klein tafeltje onder hangende zaagbladen; Chris schiet twee keer met een wapen omhoog, richt het dan over de tafel op Ashley en laat het zakken. Andere beelden tonen een vrouw in een handdoek bij een door kaarsen verlicht bad, en twee mensen met hun handen boven hun hoofd vastgebonden tegen een muur, daarna een tafel vol rode spetters.
film.smg_sting.1=Op het scherm in de bioscoopzaal flikkert een blanco, bekraste aanloopfilm, met flitsen van door elkaar gehusselde letters en cijfers.
film.smg_sting.2=Beelden van Sam in een bad bij kaarslicht: ze kijkt over haar schouder, stapt eruit en staat in een handdoek gewikkeld rond te kijken.
film.smg_sting.3=Een enorm draaiend zaagblad snijdt in Josh, die op een tafel ligt met zijn armen boven zijn hoofd; bloed spuit, hij vertrekt zijn gezicht, bloed gutst uit zijn mond, en bloed en stukken vlees stromen onder de tafel omlaag.
film.smg_sting.4=De blanco aanloopfilm flikkert opnieuw.
film.projectorghost_movie=Op de muur, oude flikkerende beelden: Emily, bij een open haard, praat in de camera en duwt dan Ashley door een deuropening; Hannah, met bril, glimlacht verlegen; twee meisjes, en dan Ashley, grijnzen vanuit het donker; Hannah begint haar blouse los te knopen en draait dan met een ruk haar hoofd weg.
film.projectorghost_scare=Een rood verlichte close-up van Hannah, met bril, glimlachend en pratend; plotseling flitst er een afschuwelijk wit gezicht op met donkere oogkassen en een bebloede, gapende mond, en het scherm wordt zwart.
film.projector_wendigo=Op de muur, een oude zwart-witfilm: een verpleegster laat een patiënt achter die in een stoel zit; hij worstelt zich los, klimt tegen de muur op en kruipt over het plafond het donker in. Ze komt terug bij de lege stoel, van boven reikt een arm naar haar omlaag, en na een flits is ze weg; een bleke gestalte springt op de camera af, en het beeld kantelt opzij.
film.hannah_wendigo_reveal=Een flits in sepia: een arm met een zwarte vlindertatoeage, dan Hannah, met bril, haar handen bij haar borst, flauwtjes glimlachend naar de camera.
film.newghosty_up=Op het tv-scherm krijst een bleek, lijkachtig gezicht met de mond wijd opengesperd; heel even flikkert het over in het bleke gezicht van een vrouw met donkere kringen rond haar ogen.
film.sam_end_credits.1=Door een raam, een donkere slaapkamer 's nachts. Een telefoon licht op met een wekker, 06:00 AM, Work Alarm, met als achtergrond Sam die een hond knuffelt, naast pillenpotjes en een boek, CREATURE MYTHS OF THE GREAT PLAINS. Sam ligt op het bed onder een draaiende plafondventilator; haar ogen gaan wijd open.
film.sam_end_credits.2=Een pillenpotje valt en rolt tot naast een ander boek, THE WENDIGO LOG. Sam gaat rechtop op de rand van het bed zitten en zet de wekker met een veeg uit; haar duim smeert bloed over het scherm, en er loopt bloed langs haar onderarm.
film.sam_end_credits.3=Ze drukt een tissue op een rafelige snee in haar onderarm, maar die bloedt opnieuw. Rood licht kruipt over haar omhoog; ze draait zich om, met grote ogen.
film.sam_end_credits.4=Duisternis, dan de titel: UNTIL DAWN.
film.totem_events_of_the_past.1=Een oude sepiafoto van een man in een lange jas met een halsdoek, naast een briefje: NO ESCAPE. Schetsen van een ruigharig wezen met slagtanden en van een hand met klauwen; krantenkoppen: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, en LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Een foto van mijnwerkers onder de kop MIRACLE MINERAL DISCOVERED; RADIUM; dan MINING DISASTER en DEATH TOLL RISES, en een foto van mijnwerkers, zwart overgekrabbeld.
film.totem_events_of_the_past.3=Flitsen van bloederige beelden: bebloede tanden en tandvlees, een gebarsten schedel, een met bloed bedekt gezicht met een bloeddoorlopen oog, maden op rauw vlees. HUNGER CRAVING op een muur gekrabbeld; een röntgenfoto met het opschrift HUMAN?
film.totem_events_of_the_past.4=Een handgeschreven lijst: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Een donkere foto van een gebogen, bleke gestalte, rood omcirkeld: CREATURE REPORTED. Schetsen van een wezen met slagtanden, TEETH GROW & SHARPEN WITH AGE, en van een uitgemergelde gestalte met lange ledematen. THE ONLY WAY, een pijl naar FIRE, omcirkeld; de pagina brandt.
film.totem_events_of_the_past.5=Nacht: een verlicht houten huis tussen besneeuwde dennen. Beth, in een grijze muts en trui, en Hannah, met een bril en een roze gewatteerde jas, rennen doodsbang hand in hand door het bos en komen uit op een mistige kliftop.
film.totem_events_of_the_past.6=Bij een touwafzetting naast een kapot bord, CLIFF, kijken ze doodsbang om; een oranje warmtebeeld toont hen als gloeiend witte vormen tussen de bomen. Hand in hand aan de rand glijdt Hannah eroverheen; Beth grijpt haar vast, en ze vallen allebei.
film.totem_events_of_the_past.7=Een man met tanks op zijn rug rent naar de rand van het klif terwijl een uitgemergeld wezen met lange ledematen naar hem toe kruipt; close-ups van zijn veiligheidsbril en van de gapende bek met slagtanden van het wezen. Hij hult het in vuur uit zijn vlammenwerper; het brandt, spartelend op de sneeuw, en een vuurbal zwelt aan tot hij het hele scherm vult.
film.causaleffect_act1_3_samattackedbycrow=Bij een gaashek duikt een kraai op Sam af; ze bukt, haar handen voor haar gezicht.
film.causaleffect_act2_1_mattlooksthroughtelescope=Door een telescoop: op een besneeuwde helling houdt Mike iemand in een jas met bontrand stevig omhelsd.
film.causaleffect_act2_2_minetunnel=In het donker, tussen gekruiste houten balken, buigt Mike zich in beeld en kijkt om zich heen, met achter zich een wazige gestalte.
film.causaleffect_act2_4_samfindsbaseballbat=In een donkere kamer zwaait Sam glimlachend met een honkbalknuppel; dan houdt Josh, verlicht door een zaklamp, een knuppel vast en grijnst.
film.causaleffect_act2_5_jessthroughwindow_pants=Bij een raam in het donker grijpt een lange, benige hand de schreeuwende Jessica bij haar hoofd en trekt haar met een ruk uit beeld.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Door een telescoop: besneeuwde rotsen onder een rotswand; dan, in bijna-duisternis, vult een uitgemergeld, gerimpeld gezicht met glinsterende ogen het beeld.
film.causaleffect_act3_2_bridgefail='s Nachts rent Mike een kleine besneeuwde touwbrug op; een plank breekt onder hem en hij valt uit het zicht.
film.causaleffect_act3_2_clifffail=Op een besneeuwde helling glijdt Mike, met een geheven lantaarn, uit en slaat over de kop langs de rotsen omlaag.
film.causaleffect_act3_2_cliffsafe=Op een rotsachtige helling klimt Mike, met een lantaarn in zijn hand, voorzichtig langs de rotsen omlaag.
film.causaleffect_act3_2_grabfencefail=Van bovenaf gezien: Mike reikt op een besneeuwde helling naar een gaashek, glijdt uit en valt beneden op zijn rug in de sneeuw.
film.causaleffect_act3_2_grabrootfail=Van bovenaf gezien: Mike klampt zich op een besneeuwde helling vast aan een dikke wortel, glijdt uit en valt beneden op zijn rug in de sneeuw.
film.causaleffect_act3_2_jumpclifffail='s Nachts springt Mike, met een lantaarn in zijn hand, omlaag in een rotsachtige geul, landt hard en klautert verder.
film.causaleffect_act3_2_mikefallsover=Mike rent met een lantaarn in zijn hand een besneeuwde, beboste helling af, struikelt en valt languit op zijn gezicht.
film.causaleffect_act3_2_mikeisfast=Mike sprint met een lantaarn in zijn hand door een besneeuwde geul tussen rotsen, recht op de kijker af.
film.causaleffect_act3_2_pipefail=Mike balanceert, met een hoog geheven lantaarn, over een dikke, besneeuwde buis, glijdt eraf en stort in kolkend water.
film.causaleffect_act3_2_shimmy=Van bovenaf gezien: Mike klimt omlaag tussen donkere rotsen; dan schuifelt hij zijwaarts langs een steile rotswand, zich met één hand vasthoudend.
film.causaleffect_act3_2_takestairs=Mike rent met een lantaarn in zijn hand naar een houten hut en haast zich de besneeuwde treden op naar de deur.
film.causaleffect_act3_2_wendigointower_fast=Door een richtkijker: gekruiste houten balken in de sneeuw; naast het dradenkruis rijst iets kleins en grijs in beeld op.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=In het donker verlicht de vlam van een aansteker ruwe planken; door een kier ertussen staren twee wijd opengesperde, glazige ogen naar buiten.
film.causaleffect_act4_1_chrissavesash=Door metaalgaas is iemand te zien die onder een hanglamp zit; dan een enorm getand zaagblad, met ernaast in de schaduw een man in een geruit overhemd.
film.causaleffect_act4_2_mikebefriendswolf=Mike hurkt naast een ruigharige wolf en aait over zijn vacht.
film.causaleffect_act4_2_mikekickswolf=In een deuropening schopt Mike naar een wolf; dan steekt hij, smerig, met geheven lantaarn, zijn andere hand op en vertrekt zijn gezicht.
film.causaleffect_act4_2_mikelooksatswolf=Mike houdt een wolf een open hand voor; de wolf laat zijn kop zakken, wendt zich af en loopt dan vlak voor hem langs.
film.causaleffect_act4_2_mikestillhasmachete=Handen bij de kaken van een metalen val; Mike gooit zijn hoofd achterover van de pijn. Dan raapt hij in een betegelde ruimte een machete op.
film.causaleffect_act4_2_wendigoheadinajar=Een bleek, gevlekt hoofd met piepkleine glinsterende oogjes in een grote glazen pot.
film.causaleffect_act5_2_emgivesflaretomatt=In een houten keet geeft Emily een lichtpistool aan Matt; hij pakt het aan en kijkt ernaar.
film.causaleffect_act5_3_chrisshotashley=Aan een klein houten tafeltje richt Chris, met bril, een pistool op de huilende Ashley.
film.causaleffect_act7_3_ashley_trapdoor=Van bovenaf gezien: een hand met een ring en een gebreide polswarmer schuift de grendel van een houten valluik terug en grijpt de handgreep vast.
film.intro_busride.1=Duisternis, dan de titel: UNTIL DAWN.
film.intro_busride.2=Begintitels over donkere close-ups van voorwerpen, waarin vaag gezichten te zien zijn: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Over een hobbelpaard en een oud radiotoestel: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=Bij zonsondergang, van bovenaf gezien: een bus slingert tussen de dennen een besneeuwde bergweg op.
film.intro_busride.5=In de bus zit Sam bij het raam; op haar telefoon: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Op haar telefoon speelt een video: Josh, in een geruit overhemd, praat in een donkere kamer in de camera.
