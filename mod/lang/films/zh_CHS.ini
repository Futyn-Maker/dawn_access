; Dawn Access film descriptions — Chinese (Simplified). Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=夜晚，悬崖边：戴着眼镜、穿粉色外套的汉娜抓着戴灰色毛线帽、穿灰色毛衣的贝丝。汉娜一个踉跄，仰面跌下悬崖，把贝丝也拽了下去；在下方，贝丝背部朝下重重砸在一块巨石上，鲜血四溅。
film.death_act1_1_sisters_cliff.1=在崖底，汉娜躺着，满脸是血，双眼睁着，她身后是贝丝鲜血淋漓的身体。
film.death_act1_1_sisters_cliff_alone=夜晚，陡峭的崖壁上：汉娜的手从贝丝手中滑脱，她顺着岩石滚落下去。贝丝伸手去够上方一个黑影递下来的戴手套的手，却坠落下去，重重砸在积雪的巨石上；在崖底，汉娜浑身是血地躺着，双眼睁着，贝丝落在她身后。
film.death_act3_2_jessica_liftshaft=迈克举着提灯，抬头望向井道；她的尸体落在他面前电梯厢的格栅地板上，下巴已被撕掉。迈克盯着她，向她伸出手，电梯厢随即在一片火花中坠落下去。
film.death_act5_2_matt_climb=在雾气弥漫的森林里，他从一群长着角的鹿面前步步后退，一脚踩空，从岩石边缘坠入黑暗。他脸朝下趴在一块岩石上，嘴下积着一摊血；特写中，他睁着的眼睛闪着泪光。
film.death_act5_2_matt_wendigo=黑暗中，他惊恐双眼的特写。一只雪怪从背后抓住他，把他按到一个挂在铁链间的钩子上；钩子从下往上刺穿他的下巴，从嘴里穿出，他就那样挂着，满脸是血。
film.death_act6_3_emily_eyegauge=一只雪怪抓住她的头，把拇指戳进她的双眼；她尖叫着，鲜血顺着脸流下，随后瘫软地垂在它手中。
film.death_act6_3_emily_oregrinder=她顺着积雪的滑槽滑进磨床的料斗，紧紧抓住料斗边缘；手指一滑，她掉进布满尖刺的滚轴之间，尖叫着，鲜血从嘴里涌出，直到她的头向后垂下。
film.death_act6_4_chris_lodgedoor=屋内，阿什莉抬起头，向前迈了一步。屋外的黑暗中，一只雪怪从背后抓住他，用利爪罩住他的脸，扯下了他的头；头落在他身体旁的雪地上。
film.death_act6_4_chris_lodgedoor_ja=透过门上的玻璃可以看到阿什莉，她向外望去，向前迈了一步。屋外，一只雪怪从背后抓住他，用利爪罩住他的脸，把他向下拖出画面；它冲着镜头咆哮，然后离开，只留下黑暗的树林。
film.death_act6_4_chris_runtolodge_ashimpassive=黑暗的雪地上，一只雪怪把他按倒，扯下了他的头；头落在积雪的门廊上，就在阿什莉脚边。溅了一身血的阿什莉站着，皱着脸往下看。
film.death_act6_4_chris_runtolodge_ashimpassive_ja=从黑暗树林的地面看去：一只雪怪俯在他身上，抬起头，双眼闪着光，随后离开。阿什莉的特写：她溅了一身血，几乎要哭出来，脸皱成一团；随后她站着往下看。
film.death_act6_4_chris_runtolodge_ashscreams=黑暗的雪地上，一只雪怪把他按倒，扯下了他的头；头飞过半空，在雪地上滚动，停在一扇玻璃门前。玻璃后，阿什莉双手捂住嘴，哭着跪倒在地。
film.death_act6_4_chris_runtolodge_ashscreams_ja=从黑暗树林的地面看去：一只雪怪俯在他身上，抬起头，双眼闪着光，随后离开。门上的玻璃后，阿什莉走过来，双手捂住嘴，哭着跪倒在地，一个男人出现在她身后。
film.death_act7_1_emily_shotbymike=在一间被监视器屏幕照亮的昏暗房间里，迈克转过身，拿着枪朝她走去，阿什莉在一旁看着；他双手举枪开火：鲜血溅上墙壁，特写中，她的左眼成了一个血洞，头向后仰着，嘴巴大张。
film.death_act7_1_emily_shotbymike_ja=在一间被监视器屏幕照亮的昏暗房间里，迈克转过身，拿着枪朝她走去，阿什莉在一旁看着；他双手举起枪。枪响的一刻，画面切到软木板上的一张地图（BLACKWOOD PINES MOUNTAINS），地图上溅满了血；随后，黑暗中，她穿着靴子的双腿滑落到地上。
film.death_act7_3_ashley_trapdoor_opened=她打开地上的一扇暗门；一只雪怪跳了出来，在跪着的她上方直起身子，用长长的双手箍住她的头。随后，在空无一物的泥地上，她无力的手落进画面，接着她被扯下的头掉下来，滚了几下停住，眼睛和嘴巴都张着。
film.death_act7_3_ashley_trapdoor_opened_ja=她打开地上的一扇暗门；一只雪怪跳了出来，在跪着的她上方直起身子，用长长的双手箍住她的头。随后只能看到一条空荡荡的黑暗洞穴通道。
film.death_act7_3_ashley_trapdoor_unbolted=她站在一扇敞开的暗门几步之外；一只雪怪爬了出来，按住她的头把她压低，她尖叫起来。随后，在空无一物的泥地上，她无力的手落进画面，接着她被扯下的头掉下来，滚了几下停住，眼睛和嘴巴都张着。
film.death_act7_3_ashley_trapdoor_unbolted_ja=她站在一扇敞开的暗门几步之外；一只雪怪爬了出来，按住她的头把她压低，她尖叫起来。随后只能看到一条空荡荡的昏暗矿井通道。
film.death_act7_3_chris_trapdoor1=他打开一扇暗门；一只雪怪跳了出来，在跪着的他上方直起身子，用长长的双手猛地拧转他的头。随后他被扯下的头掉到地上，竖立着，面朝镜头：眼镜歪斜碎裂，嘴巴张着。
film.death_act7_3_chris_trapdoor1_ja=他打开一扇暗门；一只雪怪跳了出来，在跪着的他上方直起身子，抓住他的头。随后只能看到头顶上黑暗的木椽。
film.death_act7_3_chris_trapdoor2=他低头看着一扇关着的暗门，一只雪怪从上方跳到他面前，猛扑上去，把他仰面按倒在地。它用利爪划开他的喉咙；鲜血喷涌而出，它举起他被扯下的头，让脸朝向镜头，嘴巴张着。
film.death_act7_3_chris_trapdoor2_ja=他低头看着一扇关着的暗门，一只雪怪从上方跳到他面前，猛扑上去，把他仰面按倒在地。随后只能看到头顶上黑暗的木梁。
film.death_act7_3_chris_tunnel1=在一条木架支撑的矿井隧道里，他的双腿在半空中乱蹬，身体其余部分在上方画面之外，一股股鲜血倾泻而下。随后，在溅满鲜血的木板前，他无头的身体掉落在地上。
film.death_act7_3_chris_tunnel1_ja=在一条木架支撑的矿井隧道里，他的双腿在半空中乱蹬，身体其余部分在上方画面之外，一股股鲜血倾泻而下。随后，在溅满鲜血的木板前，他的身体掉落在地上；只能看到他的双腿和背部，一只手抽搐着。
film.death_act8_4_josh_wendigo=一只雪怪从黑暗的水中猛地冲出，用长长的双手箍住他的头。它的手指压进他的头骨，他放声尖叫；它不断挤压，直到鲜血迸出，喷满整个画面。
film.death_act8_4_josh_wendigo_ja=一只雪怪从黑暗的水中猛地冲出，用长长的双手箍住他的头。它的手指压进他的头骨，他放声尖叫；它挤压时，画面从他们身上向上移开，深色的点滴溅到画面上。
film.death_act8_5_jessica_keepstill_timeout1=特写：她仰面躺着尖叫，一只雪怪抓住她的头，把长着利爪的手指塞进她嘴里；它撕掉她的下巴，长着獠牙的嘴就在她一动不动的脸旁。随后她一动不动地躺在火光中，下巴没了。
film.death_act8_5_jessica_keepstill_timeout1_ja=几乎一片漆黑：镜头缓缓掠过一具一动不动地躺在地上的身体；随后，就在近处，一只雪怪的肋骨和头从黑暗中显现出来。
film.death_act8_5_jessica_keepstill_timeout2=特写，大雪纷飞：她仰面躺着尖叫，一只雪怪抓住她的头，把长着利爪的手指塞进她嘴里；它撕掉她的下巴，把沾满鲜血、满是利齿的脸凑近她的脸。随后她一动不动地躺在火光映照的雪地里，下巴没了。
film.death_act8_5_jessica_keepstill_timeout2_ja=夜晚，积雪的岩石间：近处，一只雪怪长着利爪的细长四肢从某人黑暗的身影上方掠过；随后镜头缓缓飘过空荡荡、覆满积雪的岩石。
film.death_act8_5_jessica_leftbehind=在一条木架支撑的隧道里，她提着提灯奔跑；一只雪怪跳到她背上，把她扑倒。特写中，它抓住她的头，把长着利爪的手指塞进她尖叫的嘴里，撕掉了她的下巴；随后她一动不动地躺在火光中，下巴没了，它那满是利齿的头从她上方一闪而过。
film.death_act8_5_jessica_leftbehind_ja=几乎一片漆黑：镜头缓缓掠过一具一动不动地躺在地上的身体；随后，一只瘦骨嶙峋的雪怪四肢着地，在黑暗中爬行。
film.death_act8_5_jessica_timeout2=特写：她仰面躺着尖叫；一只雪怪用一只长着利爪的手按住她的头顶，把另一只手的手指塞进她嘴里。
film.death_act8_5_jessica_timeout2_ja=几乎一片漆黑：镜头缓缓掠过一具一动不动地躺在地上的身体。
film.death_act8_5_matt_gate=大雪纷飞中，一只雪怪蹲在一面木墙上一个亮着灯的门口上方，随后朝他扑了下来。它蹲伏在他身上，举起双臂直起身子，砸烂了他的脸；特写中，他被砸烂的脸血肉模糊，躺在雪地里。
film.death_act8_5_matt_gate_ja=大雪纷飞中，一只雪怪蹲在一面木墙上一个亮着灯的门口上方，随后朝他扑了下来。他仰面躺着，雪怪的利爪伸向他的脸；随后镜头停在他的胸口，外套上有字母M，他一动不动地躺着。
film.death_act8_5_matt_keepstill_timeout1=在一条木架支撑的隧道里，他提着一盏提灯；一只雪怪朝他扑来，把他撞倒。它蹲伏在他身上，举起双臂直起身子，砸烂了他的脸；特写中，他被砸烂的脸血肉模糊。
film.death_act8_5_matt_keepstill_timeout1_ja=在一条木架支撑的隧道里，他提着一盏提灯；一只雪怪朝他扑来，把他撞倒。它蹲伏在他身上，利爪伸向他的脸；随后镜头停在他的胸口，外套上有字母M，他一动不动地躺着。
film.death_act8_5_matt_keepstill_timeout2=大雪纷飞中，一只雪怪蹲伏在他身上，他举起双手；雪怪直起身子，砸烂了他的脸。特写中，他被砸烂的脸血肉模糊。
film.death_act8_5_matt_keepstill_timeout2_ja=大雪纷飞中，一只雪怪从他身上爬过，他举起一只手；随后镜头停在他的胸口，外套上有字母M，他一动不动地躺着。
film.death_act8_5_matt_timeout1=一只雪怪顺着木梁爬下来，朝他扑去，把他撞倒在地。他举起一只手，雪怪蹲伏在他身上，直起身子，砸烂了他的脸；特写中，他被砸烂的脸血肉模糊。
film.death_act8_5_matt_timeout1_ja=一只雪怪顺着木梁爬下来，朝他扑去，把他撞倒在地。它蹲伏在他身上，龇着牙；随后镜头停在他的胸口，外套上有字母M，他一动不动地躺着。
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=在山庄里，盖着罩布的家具之间，一只雪怪从地上跳到墙上，房间里弥漫着淡黄色的雾气。一阵火焰爆炸把她掀飞，她脸朝下摔滑过地板；她一动不动地躺着，身后烈火熊熊。
film.death_act8_6_ashley_eyegauge=一只肩上有蝴蝶纹身的雪怪朝她扑来，抓住她的头。它把拇指戳进她的双眼，鲜血顺着她的脸流下，随后它把拇指从血淋淋的眼窝里拔出来；她躺在木地板上。
film.death_act8_6_emily_explosion=在骤然爆开的火焰中，一只雪怪在木柱后咆哮。爆炸把她掀飞，摔过木地板；她趴在地上，脸被严重烧伤。
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=在山庄里，一只雪怪咆哮着冲进画面，随后冲着靠墙站着的他的脸尖叫。它抓住他的头，用爪子在他腹部划了一道，把他甩到房间另一头；他摔落在一根木柱底下。
film.death_act8_6_mike_lightbulb_ja=在山庄里，一只雪怪尖叫着冲进画面。他用手抵住它的胸口，它却抓住他的头，冲着他的脸尖叫，把他甩到一边；随后，从背后看去，它张开长长的双臂。
film.death_act8_6_mike_explosion_unijured=在山庄里，一团火球冲过一个摆满盖着罩布的家具的房间，横扫大厅，把一只花瓶震得粉碎。随后他躺在火焰中的地板上，脸被严重烧伤。
film.death_act8_6_sam_wendigo1=在山庄里，一只雪怪长着利爪的手掐住她的喉咙，把她举在半空；她艰难地喘着气，鲜血从嘴里流出，额头上的灯亮着。它用另一只手臂两次刺穿她的腹部，然后松手；她跌落在地，一动不动。
film.death_act8_6_sam_wendigo1_ja=在山庄里，一只雪怪抓住了她。从下方看去，它伸直手臂把她举在半空，她在画面边缘只是一团模糊的黑影；它仰头尖叫，随后朝镜头猛扑过来，又四肢着地迅速窜走。
film.4_3_being_watched_emilymatt_cctv_footage=监视器上，一台固定摄像头俯拍着夜里积雪石墙上的一道铁门：艾米丽从门里走过，接着是马修，他随手把门拉上；两人走远，大雪中只剩空荡荡的铁门。
film.act20_6_cctv_footage=监视器上是六个摄像头的画面：克里斯多夫和阿什莉在悬挂的锯片下方的一张小桌旁相对而坐；克里斯多夫朝上开了两枪，然后隔着桌子把枪对准阿什莉，又放下了枪。其他画面中，一个围着浴巾的女人站在点着蜡烛的浴缸旁，两个人双手被绑在头顶，靠墙站着，随后是一张溅满红色的桌子。
film.smg_sting.1=影音室的屏幕上，一段空白、满是划痕的胶片片头闪烁着，杂乱的字母和数字一闪而过。
film.smg_sting.2=萨曼莎在点着蜡烛的浴缸里的录像：她回头瞥了一眼，从浴缸里出来，裹着浴巾站着，四处张望。
film.smg_sting.3=一把巨大的旋转锯片切入约书亚的身体，他躺在桌上，双臂举过头顶；鲜血喷溅，他面容扭曲，鲜血从嘴里涌出，血和碎肉倾泻到桌子下面。
film.smg_sting.4=空白的胶片片头再次闪烁。
film.projectorghost_movie=墙上播放着闪烁的老录像：艾米丽在壁炉边对着镜头说话，然后把阿什莉推进一个门口；戴眼镜的汉娜害羞地微笑；两个女孩，然后是阿什莉，在黑暗中咧嘴笑着；汉娜开始解衬衫的扣子，随后猛地把头扭开。
film.projectorghost_scare=红光下戴眼镜的汉娜的特写，她微笑着说话；突然，一张眼窝漆黑、血口大张的惨白恐怖面孔闪现出来，屏幕随即变黑。
film.projector_wendigo=墙上播放着一部黑白老电影：一名护士离开坐在椅子上的病人；病人挣脱束缚，爬上墙壁，又沿着天花板爬进黑暗中。护士回到空椅子旁，一只手臂从上方朝她伸下来，一道闪光之后，她不见了；一个苍白的身影扑向镜头，画面向一侧倒下。
film.hannah_wendigo_reveal=棕褐色调的画面一闪：一只有黑色蝴蝶纹身的手臂，然后是戴眼镜的汉娜，双手放在胸前，对着镜头淡淡地微笑。
film.newghosty_up=电视上，一张苍白、食尸鬼般的脸张大嘴巴尖叫；一瞬间，它闪变成一张眼圈发黑的苍白女人的脸。
film.sam_end_credits.1=透过窗户，夜晚一间昏暗的卧室。一部手机亮起闹钟：06:00 AM，Work Alarm，壁纸是萨曼莎抱着一只狗；旁边是药瓶和一本书，CREATURE MYTHS OF THE GREAT PLAINS。萨曼莎躺在床上，头顶的吊扇在转；她的眼睛猛然睁大。
film.sam_end_credits.2=一个药瓶掉下来，滚到另一本书THE WENDIGO LOG旁边。萨曼莎在床边坐起身，滑动屏幕关掉闹钟；她的拇指在屏幕上抹下一道血迹，鲜血顺着她的前臂流下。
film.sam_end_credits.3=她用纸巾按住前臂上一道参差不齐的伤口，但伤口又流血了。红光渐渐笼罩了她；她转过身，双眼圆睁。
film.sam_end_credits.4=一片黑暗，然后是标题：UNTIL DAWN。
film.totem_events_of_the_past.1=一张陈旧的棕褐色照片：一个穿长外套、系着领巾的男人，旁边一张字条：NO ESCAPE。一只毛发蓬乱、长着獠牙的怪物和一只长着利爪的手的素描；报纸标题：LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED和LOCAL MAN FOUND DEAD。
film.totem_events_of_the_past.2=标题MIRACLE MINERAL DISCOVERED下方是一张矿工的照片；RADIUM；然后是MINING DISASTER和DEATH TOLL RISES，以及一张被黑笔涂得乱七八糟的矿工照片。
film.totem_events_of_the_past.3=血腥画面一闪而过：血淋淋的牙齿和牙龈、一颗开裂的头骨、一张满是血的脸上一只布满血丝的眼睛、生肉上的蛆虫。墙上潦草地写着HUNGER CRAVING；一张标着HUMAN?的X光片。
film.totem_events_of_the_past.4=一份手写清单：HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER。一张昏暗的照片，上面一个佝偻的苍白身影被红圈圈了起来：CREATURE REPORTED。一只长着獠牙的怪物的素描，写着TEETH GROW & SHARPEN WITH AGE，还有一个枯瘦、四肢修长的身影的素描。THE ONLY WAY，一个箭头指向被圈起的FIRE；纸页燃烧起来。
film.totem_events_of_the_past.5=夜晚：积雪的松林间，一栋亮着灯的木屋。戴灰色毛线帽、穿灰色毛衣的贝丝，和戴眼镜、穿粉色羽绒外套的汉娜手牵着手，惊恐地穿过树林奔跑，跑上一片雾气笼罩的崖顶。
film.totem_events_of_the_past.6=在一块折断的指示牌CLIFF旁的绳栏边，她们惊恐地回头张望；在橙色的热成像画面中，她们是树林间发着白光的身影。在悬崖边，两人手牵着手，汉娜滑了下去；贝丝抓住她，两人一起坠落。
film.totem_events_of_the_past.7=一个背着气罐的男人跑向悬崖边，一只枯瘦、四肢修长的怪物朝他爬去；他的护目镜和怪物张开的獠牙大嘴的特写。他用喷火器向怪物喷射火焰；怪物在雪地上翻滚着燃烧，一团火球膨胀开来，占满了整个屏幕。
film.causaleffect_act1_3_samattackedbycrow=在一道铁丝网围栏旁，一只乌鸦朝萨曼莎俯冲过来；她弯下身子，双手捂着脸。
film.causaleffect_act2_1_mattlooksthroughtelescope=透过望远镜：在积雪的山坡上，迈克紧紧拥抱着一个穿着镶毛边外套的人。
film.causaleffect_act2_2_minetunnel=黑暗中，在交叉的木梁之间，迈克探身进入画面，四下张望，身后有一个模糊的人影。
film.causaleffect_act2_4_samfindsbaseballbat=在一间昏暗的房间里，萨曼莎笑着挥动一根棒球棍；随后，被手电筒照亮的约书亚拿着一根球棍，咧嘴笑着。
film.causaleffect_act2_5_jessthroughwindow_pants=黑暗中，在一扇窗户旁，一只长长的、瘦骨嶙峋的手抓住尖叫的杰西卡的头，猛地把她拖出画面。
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=透过望远镜：一面岩壁下积雪的岩石；随后，在几近漆黑之中，一张枯瘦、满是皱纹、双眼闪着光的脸占满了整个画面。
film.causaleffect_act3_2_bridgefail=夜晚，迈克跑上一座积雪的小绳桥；一块木板在他脚下断裂，他掉了下去，消失在视野中。
film.causaleffect_act3_2_clifffail=在积雪的山坡上，举着提灯的迈克脚下一滑，顺着岩石翻着跟头滚了下去。
film.causaleffect_act3_2_cliffsafe=在多岩石的山坡上，提着提灯的迈克小心翼翼地顺着岩石往下爬。
film.causaleffect_act3_2_grabfencefail=俯视角度：在积雪的山坡上，迈克伸手去够一道铁丝网围栏，脚下一滑，仰面摔进下方的雪里。
film.causaleffect_act3_2_grabrootfail=俯视角度：在积雪的山坡上，迈克紧紧抓住一条粗大的树根，脚下一滑，仰面摔进下方的雪里。
film.causaleffect_act3_2_jumpclifffail=夜晚，提着提灯的迈克跳进一条岩石嶙峋的沟壑，重重落地，又继续往前攀爬。
film.causaleffect_act3_2_mikefallsover=提着提灯的迈克沿着积雪的林间山坡往下跑，被绊了一下，脸朝下扑倒在地。
film.causaleffect_act3_2_mikeisfast=提着提灯的迈克沿着岩石间一条积雪的沟壑飞奔，径直冲向镜头。
film.causaleffect_act3_2_pipefail=迈克高高举着提灯，在一根积雪的粗管道上保持平衡往前走，脚下一滑，跌进湍急的水流中。
film.causaleffect_act3_2_shimmy=俯视角度：迈克在黑暗的岩石之间往下爬；随后，他一只手扒住陡峭的岩壁，贴着岩壁横向挪动。
film.causaleffect_act3_2_takestairs=提着提灯的迈克跑到一座木屋前，快步登上积雪的台阶，来到门口。
film.causaleffect_act3_2_wendigointower_fast=透过瞄准镜：雪地里交叉的木梁；十字准星旁，一个灰色的小东西升起，进入画面。
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=黑暗中，打火机的火焰照亮粗糙的木板；从木板间的缝隙里，一双睁得大大的、玻璃般的眼睛向外瞪着。
film.causaleffect_act4_1_chrissavesash=透过铁丝网，可以看到有人坐在一盏吊灯下；随后是一片巨大的带齿锯片，旁边的阴影里是一个穿格子衬衫的男人。
film.causaleffect_act4_2_mikebefriendswolf=迈克蹲在一只毛发蓬乱的狼旁边，抚摸它的毛。
film.causaleffect_act4_2_mikekickswolf=在一个门口，迈克朝一只狼踢去；随后，浑身脏污的他举着提灯，抬起另一只手，皱着脸。
film.causaleffect_act4_2_mikelooksatswolf=迈克朝一只狼举起摊开的手掌；狼低下头，转过身去，随后从他面前很近的地方走过。
film.causaleffect_act4_2_mikestillhasmachete=双手放在一个金属捕兽夹的夹口处；迈克痛得仰起头。随后，在一间贴着瓷砖的房间里，他捡起一把砍刀。
film.causaleffect_act4_2_wendigoheadinajar=一个大玻璃罐里，装着一颗苍白、布满斑点、长着闪光小眼睛的头。
film.causaleffect_act5_2_emgivesflaretomatt=在一间木棚里，艾米丽把一把信号枪递给马修；他接过来，低头看着它。
film.causaleffect_act5_3_chrisshotashley=在一张小木桌旁，戴着眼镜的克里斯多夫用手枪指着正在哭泣的阿什莉。
film.causaleffect_act7_3_ashley_trapdoor=俯视角度：一只戴着戒指和针织护腕的手拉开一扇木制暗门的门闩，握住门上的把手。
film.intro_busride.1=一片黑暗，然后是标题：UNTIL DAWN。
film.intro_busride.2=片头字幕叠在一组昏暗的物件特写上，物件中隐约闪过人脸：HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE。
film.intro_busride.3=背景是一只摇摇木马和一台老式无线电台：ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS。
film.intro_busride.4=日落时分，俯视角度：一辆大巴沿着积雪的山路在松林间蜿蜒而上。
film.intro_busride.5=大巴上，萨曼莎坐在窗边；她的手机屏幕上：LIVE STREAMING NEWS, RADIO FROM THE PINES。
film.intro_busride.6=她的手机正在播放一段视频：穿格子衬衫的约书亚在一间昏暗的房间里对着镜头说话。
