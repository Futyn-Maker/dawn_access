; Dawn Access film descriptions — Polish. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Noc, na krawędzi klifu: Hannah w okularach i różowej kurtce trzyma się Beth w szarej czapce i swetrze. Hannah potyka się i spada tyłem z krawędzi, pociągając za sobą Beth; w dole Beth z impetem uderza plecami o głaz, tryska krew.
film.death_act1_1_sisters_cliff.1=Na dole leży Hannah z zakrwawioną twarzą i otwartymi oczami, a za nią zakrwawione ciało Beth.
film.death_act1_1_sisters_cliff_alone=Noc, na skalnej ścianie: ręka Hannah wyślizguje się z dłoni Beth i Hannah stacza się po skałach. Beth sięga w górę do dłoni w rękawiczce, którą wyciąga ku niej z góry ciemna postać, ale spada i z impetem uderza o zaśnieżone głazy; na dole leży zakrwawiona Hannah z otwartymi oczami, a za nią spada Beth.
film.death_act3_2_jessica_liftshaft=Mike, unosząc latarnię, patrzy w górę szybu; przed nim na kratową podłogę klatki windy spada jej ciało z oderwaną żuchwą. Mike wpatruje się w nią, sięga ku niej, a klatka w deszczu iskier leci w dół.
film.death_act5_2_matt_climb=Cofając się przed stadem jeleni z porożem we mglistym lesie, robi krok poza skalną krawędź i spada w ciemność. Leży twarzą w dół na skale, pod ustami kałuża krwi; w zbliżeniu jego otwarte oko lśni od łez.
film.death_act5_2_matt_wendigo=Zbliżenie jego przerażonych oczu w ciemności. Wendigo chwyta go od tyłu i nabija na hak wiszący wśród łańcuchów; hak przebija od dołu jego żuchwę i wychodzi ustami, a on wisi z twarzą zalaną krwią.
film.death_act6_3_emily_eyegauge=Wendigo chwyta ją za głowę i wbija jej kciuki w oczy; ona krzyczy, po twarzy spływa jej krew, a potem bezwładnie zwisa w jego uścisku.
film.death_act6_3_emily_oregrinder=Zsuwa się zaśnieżoną rynną do leja zasypowego obrabiarki i czepia się jego krawędzi; palce jej się ześlizgują i wpada między kolczaste walce, krzycząc, z ust leje się jej krew, aż jej głowa opada do tyłu.
film.death_act6_4_chris_lodgedoor=W środku Ashley podnosi wzrok i robi krok naprzód. Na zewnątrz, w ciemności, wendigo chwyta go od tyłu, zakrywając mu twarz szponiastą łapą, i odrywa mu głowę; głowa leży na śniegu obok ciała.
film.death_act6_4_chris_lodgedoor_ja=Ashley, widoczna przez szyby w drzwiach, wygląda na zewnątrz i robi krok naprzód. Na zewnątrz wendigo chwyta go od tyłu, zakrywając mu twarz szponiastą łapą, i ściąga go w dół, poza kadr; warczy w stronę kamery i odchodzi, zostaje ciemny las.
film.death_act6_4_chris_runtolodge_ashimpassive=W ciemności, na śniegu, wendigo przygważdża go do ziemi i odrywa mu głowę; głowa ląduje na zaśnieżonym ganku u stóp Ashley. Ashley, opryskana krwią, stoi i patrzy w dół, krzywiąc się.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Z ziemi, w ciemnym lesie: wendigo kuca nad nim, unosi łeb z błyszczącymi oczami i odchodzi. Zbliżenie: Ashley, opryskana krwią i bliska łez, krzywi się; potem stoi i patrzy w dół.
film.death_act6_4_chris_runtolodge_ashscreams=W ciemności, na śniegu, wendigo przygważdża go do ziemi i odrywa mu głowę; głowa leci w powietrzu i toczy się po śniegu, aż zatrzymuje się przed oszklonymi drzwiami. Za szybą Ashley przyciska dłonie do ust i z płaczem osuwa się na kolana.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Z ziemi, w ciemnym lesie: wendigo kuca nad nim, unosi łeb z błyszczącymi oczami i odchodzi. Za szybami drzwi Ashley podchodzi, przyciska dłonie do ust i z płaczem osuwa się na kolana, a za nią pojawia się mężczyzna.
film.death_act7_1_emily_shotbymike=W ciemnym pokoju oświetlonym ekranami monitoringu Mike odwraca się i na oczach Ashley idzie ku niej z pistoletem, unosi go w obu dłoniach i strzela; krew bryzga na ścianę, a w zbliżeniu w miejscu jej lewego oka widać krwawą dziurę, głowa odrzucona do tyłu, usta szeroko otwarte.
film.death_act7_1_emily_shotbymike_ja=W ciemnym pokoju oświetlonym ekranami monitoringu Mike odwraca się i na oczach Ashley idzie ku niej z pistoletem, po czym unosi go w obu dłoniach. W chwili strzału obraz przeskakuje na mapę na korkowej tablicy (BLACKWOOD PINES MOUNTAINS), którą obryzguje krew; potem, w ciemności, jej nogi w butach osuwają się na podłogę.
film.death_act7_3_ashley_trapdoor_opened=Otwiera zapadnię w podłodze; wyskakuje z niej wendigo, wznosi się nad nią, gdy klęczy, i zaciska długie dłonie na jej głowie. Potem na pustym klepisku w kadr bezwładnie opada jej dłoń, a jej oderwana głowa spada i toczy się, aż nieruchomieje, z otwartymi oczami i ustami.
film.death_act7_3_ashley_trapdoor_opened_ja=Otwiera zapadnię w podłodze; wyskakuje z niej wendigo, wznosi się nad nią, gdy klęczy, i zaciska długie dłonie na jej głowie. Potem widać już tylko pusty, ciemny korytarz jaskini.
film.death_act7_3_ashley_trapdoor_unbolted=Stoi kilka kroków od otwartej zapadni; wyłazi z niej wendigo i za głowę przygina ją do ziemi, a ona krzyczy. Potem na pustym klepisku w kadr bezwładnie opada jej dłoń, a jej oderwana głowa spada i toczy się, aż nieruchomieje, z otwartymi oczami i ustami.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Stoi kilka kroków od otwartej zapadni; wyłazi z niej wendigo i za głowę przygina ją do ziemi, a ona krzyczy. Potem widać już tylko pusty, słabo oświetlony chodnik kopalni.
film.death_act7_3_chris_trapdoor1=Otwiera zapadnię; wyskakuje z niej wendigo, wznosi się nad nim, gdy klęczy, i długimi dłońmi skręca mu głowę. Potem jego oderwana głowa spada na podłogę i stoi prosto, zwrócona twarzą do widza: okulary przekrzywione i pęknięte, usta otwarte.
film.death_act7_3_chris_trapdoor1_ja=Otwiera zapadnię; wyskakuje z niej wendigo, wznosi się nad nim, gdy klęczy, i chwyta go za głowę. Potem widać już tylko ciemne drewniane krokwie w górze.
film.death_act7_3_chris_trapdoor2=Gdy patrzy w dół na zamkniętą zapadnię, z góry zeskakuje przed nim wendigo, rzuca się na niego i przygważdża go na plecach. Rozcina mu szponami gardło; tryska krew, a wendigo unosi jego oderwaną głowę twarzą do widza, z otwartymi ustami.
film.death_act7_3_chris_trapdoor2_ja=Gdy patrzy w dół na zamkniętą zapadnię, z góry zeskakuje przed nim wendigo, rzuca się na niego i przygważdża go na plecach. Potem widać już tylko ciemne drewniane belki w górze.
film.death_act7_3_chris_tunnel1=W tunelu kopalni obudowanym drewnem jego nogi wierzgają w powietrzu, reszta ciała jest w górze, poza kadrem, a w dół leją się strugi krwi. Potem przed zbryzganymi krwią deskami na ziemię spada jego ciało bez głowy.
film.death_act7_3_chris_tunnel1_ja=W tunelu kopalni obudowanym drewnem jego nogi wierzgają w powietrzu, reszta ciała jest w górze, poza kadrem, a w dół leją się strugi krwi. Potem przed zbryzganymi krwią deskami na ziemię spada jego ciało; widać tylko nogi i plecy, a dłoń drga.
film.death_act8_4_josh_wendigo=Z ciemnej wody wyrywa się wendigo i zaciska obie długie dłonie na jego głowie. Krzyczy, a palce wendigo wbijają mu się w czaszkę; wendigo ściska, aż tryska krew i bryzga na cały obraz.
film.death_act8_4_josh_wendigo_ja=Z ciemnej wody wyrywa się wendigo i zaciska obie długie dłonie na jego głowie. Krzyczy, a palce wendigo wbijają mu się w czaszkę; gdy wendigo ściska, obraz odpływa od nich w górę i bryzgają na niego ciemne krople.
film.death_act8_5_jessica_keepstill_timeout1=Zbliżenie: leży na plecach i krzyczy, a wendigo trzyma ją za głowę i wpycha jej szponiaste palce do ust; odrywa jej żuchwę, a jego paszcza z kłami jest tuż przy jej znieruchomiałej twarzy. Potem leży bez ruchu w blasku ognia, bez żuchwy.
film.death_act8_5_jessica_keepstill_timeout1_ja=Prawie zupełna ciemność: kamera powoli przesuwa się wzdłuż ciała leżącego nieruchomo na ziemi; potem tuż obok z ciemności wyłaniają się żebra i łeb wendigo.
film.death_act8_5_jessica_keepstill_timeout2=Zbliżenie, pada śnieg: leży na plecach i krzyczy, a wendigo trzyma ją za głowę i wpycha jej szponiaste palce do ust; odrywa jej żuchwę i zbliża do jej twarzy swój zakrwawiony, zębaty pysk. Potem leży bez ruchu na śniegu w blasku ognia, bez żuchwy.
film.death_act8_5_jessica_keepstill_timeout2_ja=Noc, wśród zaśnieżonych skał: z bliska długie, szponiaste kończyny wendigo przesuwają się nad czyjąś ciemną sylwetką; potem kamera powoli sunie nad pustymi, pokrytymi śniegiem skałami.
film.death_act8_5_jessica_leftbehind=W tunelu obudowanym drewnem biegnie z latarnią; wendigo skacze jej na plecy i powala ją. W zbliżeniu trzyma ją za głowę, wpycha jej szponiaste palce do krzyczących ust i odrywa jej żuchwę; potem ona leży bez ruchu w blasku ognia, bez żuchwy, a nad nią przemyka jego zębaty łeb.
film.death_act8_5_jessica_leftbehind_ja=Prawie zupełna ciemność: kamera powoli przesuwa się wzdłuż ciała leżącego nieruchomo na ziemi; potem w ciemności pełznie na czworakach kościste wendigo.
film.death_act8_5_jessica_timeout2=Zbliżenie: leży na plecach i krzyczy; wendigo jedną szponiastą dłonią trzyma ją za czubek głowy, a palce drugiej wpycha jej do ust.
film.death_act8_5_jessica_timeout2_ja=Prawie zupełna ciemność: kamera powoli przesuwa się wzdłuż ciała leżącego nieruchomo na ziemi.
film.death_act8_5_matt_gate=W padającym śniegu wendigo kuca nad oświetlonym wejściem w drewnianej ścianie, po czym skacze na niego z góry. Kucając nad nim, prostuje się z uniesionymi ramionami i roztrzaskuje mu twarz; w zbliżeniu widać na śniegu jego zmiażdżoną, zakrwawioną twarz.
film.death_act8_5_matt_gate_ja=W padającym śniegu wendigo kuca nad oświetlonym wejściem w drewnianej ścianie, po czym skacze na niego z góry. Gdy on leży na plecach, szpony sięgają ku jego twarzy; potem kamera zatrzymuje się na jego piersi z literą M na kurtce, a on leży nieruchomo.
film.death_act8_5_matt_keepstill_timeout1=W tunelu obudowanym drewnem trzyma latarnię; wendigo rzuca się na niego i powala go. Kucając nad nim, prostuje się z uniesionymi ramionami i roztrzaskuje mu twarz; w zbliżeniu widać jego zmiażdżoną, zakrwawioną twarz.
film.death_act8_5_matt_keepstill_timeout1_ja=W tunelu obudowanym drewnem trzyma latarnię; wendigo rzuca się na niego i powala go. Kuca nad nim, sięgając szponami ku jego twarzy; potem kamera zatrzymuje się na jego piersi z literą M na kurtce, a on leży nieruchomo.
film.death_act8_5_matt_keepstill_timeout2=W padającym śniegu wendigo kuca nad nim, a on unosi ręce; wendigo prostuje się i roztrzaskuje mu twarz. W zbliżeniu widać jego zmiażdżoną, zakrwawioną twarz.
film.death_act8_5_matt_keepstill_timeout2_ja=W padającym śniegu wendigo przepełza nad nim, a on unosi rękę; potem kamera zatrzymuje się na jego piersi z literą M na kurtce, a on leży nieruchomo.
film.death_act8_5_matt_timeout1=Wendigo schodzi po drewnianych belkach, rzuca się na niego i powala go na ziemię. Kucając nad nim, gdy on unosi rękę, prostuje się i roztrzaskuje mu twarz; w zbliżeniu widać jego zmiażdżoną, zakrwawioną twarz.
film.death_act8_5_matt_timeout1_ja=Wendigo schodzi po drewnianych belkach, rzuca się na niego i powala go na ziemię. Kuca nad nim, szczerząc zęby; potem kamera zatrzymuje się na jego piersi z literą M na kurtce, a on leży nieruchomo.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=W schronisku, wśród mebli przykrytych prześcieradłami, wendigo skacze z podłogi na ścianę, a pokój wypełnia żółtawa mgiełka. Ognisty wybuch ciska nią po podłodze, twarzą w dół; ona leży nieruchomo, a za nią szaleją płomienie.
film.death_act8_6_ashley_eyegauge=Wendigo z tatuażem motyla na ramieniu rzuca się na nią i chwyta ją za głowę. Wbija jej kciuki w oczy, po jej twarzy spływa krew, a potem wyciąga je z zakrwawionych oczodołów; ona leży na drewnianej podłodze.
film.death_act8_6_emily_explosion=Wśród buchającego ognia za drewnianymi słupkami warczy wendigo. Wybuch ciska nią po drewnianej podłodze; ona leży na brzuchu, z mocno poparzoną twarzą.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=W schronisku wendigo ryczy prosto na widza, a potem wrzeszczy mu w twarz, gdy on stoi pod ścianą. Chwyta go za głowę, tnie go szponami przez brzuch i ciska nim przez pokój; on pada u stóp drewnianego filaru.
film.death_act8_6_mike_lightbulb_ja=W schronisku wendigo wrzeszczy prosto na widza. Chwyta go za głowę, gdy on zapiera się dłońmi o jego pierś, wrzeszczy mu w twarz i odrzuca go na bok; potem, widoczne od tyłu, szeroko rozkłada długie ramiona.
film.death_act8_6_mike_explosion_unijured=W schronisku kula ognia przebija się przez pokój pełen mebli przykrytych prześcieradłami i przetacza się przez hol, roztrzaskując wazon. Potem on leży na podłodze wśród płomieni, z mocno poparzoną twarzą.
film.death_act8_6_sam_wendigo1=W schronisku szponiasta dłoń wendigo trzyma ją w górze za gardło; ona łapie powietrze, z ust cieknie jej krew, lampa na jej czole świeci. Wendigo dwukrotnie przebija jej brzuch drugą ręką i puszcza ją; ona spada na podłogę i nieruchomieje.
film.death_act8_6_sam_wendigo1_ja=W schronisku wendigo chwyta ją. Widać od dołu, jak trzyma ją w górze na wyciągniętej ręce, ciemną, rozmytą plamę na skraju obrazu, i wrzeszczy z łbem odrzuconym do tyłu; potem rzuca się prosto na widza i umyka na czworakach.
film.4_3_being_watched_emilymatt_cctv_footage=Na monitorze nieruchoma kamera nocą patrzy z góry na żelazną bramę w zaśnieżonym kamiennym murze: przechodzi przez nią Emily, potem Matt, który zamyka za sobą bramę; oboje odchodzą, a brama stoi pusta w padającym śniegu.
film.act20_6_cctv_footage=Na monitorach obraz z sześciu kamer: Chris i Ashley siedzą naprzeciw siebie przy małym stoliku pod zawieszonymi tarczami pił; Chris dwukrotnie strzela z pistoletu w górę, potem celuje przez stół w Ashley i opuszcza broń. Inne kamery pokazują kobietę w ręczniku przy wannie oświetlonej świecami oraz dwie osoby pod ścianą z rękami związanymi nad głową, a potem stół zbryzgany czerwienią.
film.smg_sting.1=Na ekranie kinowym migocze pusta, porysowana taśma rozbiegowa, błyskają pomieszane litery i cyfry.
film.smg_sting.2=Nagranie Sam w wannie przy świecach: zerka przez ramię, wychodzi z wanny i stoi owinięta ręcznikiem, rozglądając się.
film.smg_sting.3=Ogromna wirująca tarcza piły wcina się w Josha, który leży na stole z rękami nad głową; tryska krew, Josh krzywi się, z ust bucha mu krew, a pod stół leje się krew i strzępy ciała.
film.smg_sting.4=Znów migocze pusta taśma rozbiegowa.
film.projectorghost_movie=Na ścianie stare, migoczące nagranie: Emily przy kominku mówi do kamery, potem wpycha Ashley w drzwi; Hannah w okularach nieśmiało się uśmiecha; dwie dziewczyny, a potem Ashley szczerzą się z ciemności; Hannah zaczyna rozpinać bluzkę, a potem gwałtownie odwraca głowę.
film.projectorghost_scare=Zbliżenie Hannah w okularach w czerwonym świetle: uśmiecha się i mówi; nagle błyska upiorna biała twarz z ciemnymi oczodołami i zakrwawionymi, rozdziawionymi ustami, a ekran gaśnie.
film.projector_wendigo=Na ścianie stary czarno-biały film: pielęgniarka zostawia pacjenta siedzącego na krześle; on się wyswobadza, wspina się po ścianie i pełznie po suficie w ciemność. Pielęgniarka wraca do pustego krzesła, z góry sięga ku niej ręka, a po błysku już jej nie ma; blada postać rzuca się na kamerę, a obraz przewraca się na bok.
film.hannah_wendigo_reveal=Błysk w sepii: ręka z czarnym tatuażem motyla, potem Hannah w okularach, z dłońmi przy piersi, lekko uśmiecha się do obiektywu.
film.newghosty_up=Na ekranie telewizora krzyczy blada, upiorna twarz z szeroko rozwartymi ustami; na mgnienie oka zmienia się w bladą twarz kobiety z ciemnymi kręgami wokół oczu.
film.sam_end_credits.1=Przez okno: ciemna sypialnia nocą. Telefon rozświetla się budzikiem: 06:00 AM, Work Alarm, na tapecie Sam przytulająca psa; obok buteleczki z tabletkami i książka CREATURE MYTHS OF THE GREAT PLAINS. Sam leży na łóżku pod obracającym się wentylatorem sufitowym; jej oczy szeroko się otwierają.
film.sam_end_credits.2=Buteleczka z tabletkami spada i toczy się obok innej książki, THE WENDIGO LOG. Sam siada na brzegu łóżka i przesunięciem palca wyłącza budzik; jej kciuk rozmazuje krew na ekranie, a po przedramieniu spływa jej krew.
film.sam_end_credits.3=Przyciska chusteczkę do poszarpanej rany na przedramieniu, ale rana znów krwawi. Zalewa ją czerwone światło; odwraca się z szeroko otwartymi oczami.
film.sam_end_credits.4=Ciemność, potem tytuł: UNTIL DAWN.
film.totem_events_of_the_past.1=Stare zdjęcie w sepii: mężczyzna w długim płaszczu i chustce na szyi, a obok notatka: NO ESCAPE. Szkice kudłatego stwora z kłami i szponiastej dłoni; nagłówki: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED oraz LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Zdjęcie górników pod nagłówkiem MIRACLE MINERAL DISCOVERED; RADIUM; potem MINING DISASTER i DEATH TOLL RISES oraz zdjęcie górników pokreślone na czarno.
film.totem_events_of_the_past.3=Błyski krwawych obrazów: zakrwawione zęby i dziąsła, pęknięta czaszka, zalana krwią twarz z przekrwionym okiem, czerwie na surowym mięsie. HUNGER CRAVING nabazgrane na ścianie; zdjęcie rentgenowskie z napisem HUMAN?
film.totem_events_of_the_past.4=Odręczna lista: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Ciemne zdjęcie zgarbionej, bladej postaci, zakreślonej czerwonym kółkiem: CREATURE REPORTED. Szkice stwora z kłami, TEETH GROW & SHARPEN WITH AGE, oraz wychudzonej postaci o długich kończynach. THE ONLY WAY, strzałka do słowa FIRE, zakreślonego kółkiem; kartka płonie.
film.totem_events_of_the_past.5=Noc: oświetlony drewniany dom wśród zaśnieżonych sosen. Beth w szarej czapce i swetrze oraz Hannah w okularach i różowej puchowej kurtce biegną w przerażeniu przez las, trzymając się za ręce, i wybiegają na zamglony szczyt urwiska.
film.totem_events_of_the_past.6=Przy ogrodzeniu z liny, obok złamanej tabliczki CLIFF, oglądają się w przerażeniu; w pomarańczowym obrazie termowizji widać je jako świecące białe kształty wśród drzew. Na krawędzi, gdy trzymają się za ręce, Hannah się ześlizguje; Beth ją chwyta i obie spadają.
film.totem_events_of_the_past.7=Mężczyzna z butlami na plecach biegnie na krawędź urwiska, a ku niemu pełznie wychudzony stwór o długich kończynach; zbliżenia jego gogli i rozwartej paszczy stwora z kłami. Zalewa stwora ogniem z miotacza ognia; stwór płonie, miotając się na śniegu, a kula ognia rośnie, aż wypełnia cały ekran.
film.causaleffect_act1_3_samattackedbycrow=Przy ogrodzeniu z siatki wrona pikuje na Sam; ta się uchyla, przykładając dłonie do twarzy.
film.causaleffect_act2_1_mattlooksthroughtelescope=Przez teleskop: na zaśnieżonym zboczu Mike mocno obejmuje kogoś w płaszczu obszytym futrem.
film.causaleffect_act2_2_minetunnel=W ciemności, między skrzyżowanymi drewnianymi belkami, Mike wychyla się w kadr i rozgląda, a za nim ktoś rozmyty.
film.causaleffect_act2_4_samfindsbaseballbat=W ciemnym pokoju Sam z uśmiechem wymachuje kijem bejsbolowym; potem Josh, oświetlony latarką, trzyma kij i szczerzy się.
film.causaleffect_act2_5_jessthroughwindow_pants=Przy oknie w ciemności długa, koścista dłoń chwyta krzyczącą Jessicę za głowę i szarpnięciem wyciąga ją z kadru.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Przez teleskop: zaśnieżone kamienie pod skalną ścianą; potem, niemal w ciemności, cały obraz wypełnia wychudzona, pomarszczona twarz o błyszczących oczach.
film.causaleffect_act3_2_bridgefail=Nocą Mike wbiega na mały, zaśnieżony most linowy; deska pęka pod nim, a on spada i znika z pola widzenia.
film.causaleffect_act3_2_clifffail=Na zaśnieżonym zboczu Mike, unosząc latarnię, poślizguje się i koziołkuje w dół po skałach.
film.causaleffect_act3_2_cliffsafe=Na skalistym zboczu Mike z latarnią w ręku ostrożnie schodzi po skałach.
film.causaleffect_act3_2_grabfencefail=Widok z góry: Mike sięga do siatki ogrodzeniowej na zaśnieżonym zboczu, ześlizguje się i spada na plecy w śnieg poniżej.
film.causaleffect_act3_2_grabrootfail=Widok z góry: Mike czepia się grubego korzenia na zaśnieżonym zboczu, ześlizguje się i spada na plecy w śnieg poniżej.
film.causaleffect_act3_2_jumpclifffail=Nocą Mike z latarnią w ręku zeskakuje do skalistego żlebu, ciężko ląduje i gramoli się dalej.
film.causaleffect_act3_2_mikefallsover=Mike z latarnią w ręku zbiega po zaśnieżonym, zalesionym zboczu, potyka się i pada jak długi na twarz.
film.causaleffect_act3_2_mikeisfast=Mike z latarnią w ręku pędzi zaśnieżonym żlebem między skałami prosto na widza.
film.causaleffect_act3_2_pipefail=Mike, trzymając wysoko latarnię, balansuje na grubej, zaśnieżonej rurze, ześlizguje się i wpada do rwącej wody.
film.causaleffect_act3_2_shimmy=Widok z góry: Mike schodzi między ciemnymi skałami; potem przesuwa się bokiem wzdłuż stromej skalnej ściany, trzymając się jej jedną ręką.
film.causaleffect_act3_2_takestairs=Mike z latarnią w ręku podbiega do drewnianej chaty i pospiesznie wbiega po zaśnieżonych schodkach do drzwi.
film.causaleffect_act3_2_wendigointower_fast=Przez celownik optyczny: skrzyżowane drewniane belki w śniegu; obok krzyżyka celownika w kadr wznosi się coś małego i szarego.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=W ciemności płomień zapalniczki oświetla surowe deski; przez szparę między nimi wyziera para szeroko otwartych, szklistych oczu.
film.causaleffect_act4_1_chrissavesash=Przez siatkę widać kogoś siedzącego pod wiszącą lampą; potem ogromna zębata tarcza piły, a obok niej w cieniu mężczyzna w koszuli w kratę.
film.causaleffect_act4_2_mikebefriendswolf=Mike kuca obok kudłatego wilka i gładzi go po sierści.
film.causaleffect_act4_2_mikekickswolf=W drzwiach Mike wymierza wilkowi kopniaka; potem, cały brudny, z uniesioną latarnią, podnosi drugą rękę i krzywi się.
film.causaleffect_act4_2_mikelooksatswolf=Mike wyciąga otwartą dłoń w stronę wilka; ten spuszcza łeb i odwraca się, a potem przechodzi tuż przed nim.
film.causaleffect_act4_2_mikestillhasmachete=Dłonie przy szczękach metalowej pułapki; Mike z bólu odrzuca głowę do tyłu. Potem w wykafelkowanym pomieszczeniu podnosi maczetę.
film.causaleffect_act4_2_wendigoheadinajar=Blada, cętkowana głowa z maleńkimi, błyszczącymi oczkami w dużym szklanym słoju.
film.causaleffect_act5_2_emgivesflaretomatt=W drewnianej szopie Emily podaje Mattowi rakietnicę; ten bierze ją i patrzy na nią.
film.causaleffect_act5_3_chrisshotashley=Przy małym drewnianym stoliku Chris w okularach celuje z pistoletu w płaczącą Ashley.
film.causaleffect_act7_3_ashley_trapdoor=Widok z góry: dłoń z pierścionkiem, w dzierganej mitence, odsuwa zasuwę drewnianej zapadni i chwyta za jej uchwyt.
film.intro_busride.1=Ciemność, potem tytuł: UNTIL DAWN.
film.intro_busride.2=Napisy początkowe na tle mrocznych zbliżeń przedmiotów, w których migają twarze: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Na tle konia na biegunach i starej radiostacji: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=O zachodzie słońca, widok z góry: autobus wije się pod górę zaśnieżoną górską drogą wśród sosen.
film.intro_busride.5=W autobusie Sam siedzi przy oknie; na jej telefonie: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Jej telefon odtwarza nagranie: Josh w koszuli w kratę mówi do kamery w ciemnym pokoju.
