; Dawn Access film descriptions — Japanese. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=夜、崖の縁：眼鏡をかけてピンクのジャケットを着たハンナが、灰色のニット帽とセーター姿のベスにつかまっている。ハンナがよろめいて後ろ向きに崖から落ち、ベスも一緒に引きずり落とす。下で、ベスが背中から大きな岩に激しく叩きつけられ、血が噴き出す。
film.death_act1_1_sisters_cliff.1=崖の下で、ハンナが顔を血まみれにし、目を開けたまま横たわっている。その後ろには、血まみれのベスの体。
film.death_act1_1_sisters_cliff_alone=夜、切り立った岩壁：ベスがつかんでいたハンナの手が滑り抜け、ハンナは岩を転げ落ちていく。ベスは、上にいる黒い人影が差し伸べる手袋の手へと手を伸ばすが、落下して雪の積もった岩に激しく叩きつけられる。崖の下では血まみれのハンナが目を開けたまま横たわり、その後ろにベスが落ちてくる。
film.death_act3_2_jessica_liftshaft=ランタンを掲げたマイクが、シャフトを見上げる。目の前のエレベーターのかごの格子状の床に、彼女の体が落ちてくる。下あごはもぎ取られている。マイクはじっと見つめ、彼女に手を伸ばす。そしてかごは火花を散らしながら落下していく。
film.death_act5_2_matt_climb=霧の立ち込める森で、角のあるシカの群れから後ずさりするうちに、岩の縁から足を踏み外し、暗闇へと落ちていく。岩の上にうつぶせに倒れ、口の下には血だまり。クローズアップで、開いた目が涙で光っている。
film.death_act5_2_matt_wendigo=暗闇の中、おびえた目のクローズアップ。ウェンディゴが背後からつかみかかり、鎖の間に吊るされた鉤に彼を押しつける。鉤があごを下から突き抜けて口から飛び出し、彼は顔を血まみれにして吊り下がる。
film.death_act6_3_emily_eyegauge=ウェンディゴが彼女の頭をつかみ、両目に親指を突き入れる。顔に血が流れ落ちる中、彼女は悲鳴を上げ、やがてウェンディゴの手の中でぐったりと垂れ下がる。
film.death_act6_3_emily_oregrinder=雪の積もったシュートを滑り落ちて粉砕機の投入口に入り、その縁にしがみつく。指が滑り、とげのついたローラーの間へ落ちていく。悲鳴を上げ、口から血があふれ、やがて頭ががくりと後ろへ倒れる。
film.death_act6_4_chris_lodgedoor=屋内で、アシュリーが顔を上げ、一歩前に出る。外の暗闇では、ウェンディゴが背後から彼をつかみ、鉤爪で顔を覆って頭を引きちぎる。頭は体のそばの雪の上に転がっている。
film.death_act6_4_chris_lodgedoor_ja=ドアのガラス越しに見えるアシュリーが、外を見て一歩前に出る。外では、ウェンディゴが背後から彼をつかみ、鉤爪で顔を覆って画面の外の下方へ引きずり込む。ウェンディゴはカメラに向かってうなり、去っていく。あとには暗い森が残る。
film.death_act6_4_chris_runtolodge_ashimpassive=暗い雪の上で、ウェンディゴが彼を押さえつけ、頭を引きちぎる。頭は雪の積もったポーチの、アシュリーの足元に落ちる。血しぶきを浴びたアシュリーは、顔をしかめて足元を見下ろしている。
film.death_act6_4_chris_runtolodge_ashimpassive_ja=暗い森の地面から見上げた視界：ウェンディゴが彼の上にかがみ込み、目を光らせて顔を上げ、去っていく。血しぶきを浴び、今にも泣きそうなアシュリーのクローズアップ。顔をしかめている。続いて、彼女は立ったまま足元を見下ろす。
film.death_act6_4_chris_runtolodge_ashscreams=暗い雪の上で、ウェンディゴが彼を押さえつけ、頭を引きちぎる。頭は宙を飛び、雪の上を転がって、ガラス張りのドアの前で止まる。ガラスの向こうで、アシュリーが両手で口を押さえ、泣きながらひざから崩れ落ちる。
film.death_act6_4_chris_runtolodge_ashscreams_ja=暗い森の地面から見上げた視界：ウェンディゴが彼の上にかがみ込み、目を光らせて顔を上げ、去っていく。ドアのガラス越しに、アシュリーが近づいてきて両手で口を押さえ、泣きながらひざから崩れ落ちる。その後ろに男が現れる。
film.death_act7_1_emily_shotbymike=監視モニターの明かりだけが灯る暗い部屋で、マイクが振り向き、銃を手に彼女へ近づく。アシュリーがそれを見ている。マイクは両手で銃を構えて撃つ。壁に血が飛び散り、クローズアップで、彼女の左目は血まみれの穴になっている。頭は後ろにのけぞり、口は大きく開いている。
film.death_act7_1_emily_shotbymike_ja=監視モニターの明かりだけが灯る暗い部屋で、マイクが振り向き、銃を手に彼女へ近づく。アシュリーがそれを見ている。マイクは両手で銃を構える。発砲の瞬間、画面はコルクボードの地図（BLACKWOOD PINES MOUNTAINS）に切り替わり、地図に血が飛び散る。続いて暗闇の中、ブーツを履いた彼女の脚が床へずり落ちる。
film.death_act7_3_ashley_trapdoor_opened=床の落とし戸を開けると、ウェンディゴが飛び出し、ひざをついた彼女の上に立ちはだかって、長い両手で頭をつかむ。続いて、何もない土の床に、ぐったりした彼女の手が落ちてくる。そしてもぎ取られた頭が落ちて転がり、目と口を開けたまま止まる。
film.death_act7_3_ashley_trapdoor_opened_ja=床の落とし戸を開けると、ウェンディゴが飛び出し、ひざをついた彼女の上に立ちはだかって、長い両手で頭をつかむ。続いて、誰もいない暗い洞窟の通路だけが映る。
film.death_act7_3_ashley_trapdoor_unbolted=開いた落とし戸から数歩離れた所に立っている。ウェンディゴが這い出してきて、悲鳴を上げる彼女の頭をつかんで押し伏せる。続いて、何もない土の床に、ぐったりした彼女の手が落ちてくる。そしてもぎ取られた頭が落ちて転がり、目と口を開けたまま止まる。
film.death_act7_3_ashley_trapdoor_unbolted_ja=開いた落とし戸から数歩離れた所に立っている。ウェンディゴが這い出してきて、悲鳴を上げる彼女の頭をつかんで押し伏せる。続いて、誰もいない薄暗い炭坑の通路だけが映る。
film.death_act7_3_chris_trapdoor1=落とし戸を開けると、ウェンディゴが飛び出し、ひざをついた彼の上に立ちはだかって、長い両手で頭をねじる。続いて、もぎ取られた頭が床に落ち、こちらを向いて立ったまま止まる。眼鏡はずれてひびが入り、口は開いている。
film.death_act7_3_chris_trapdoor1_ja=落とし戸を開けると、ウェンディゴが飛び出し、ひざをついた彼の上に立ちはだかって、頭をつかむ。続いて、頭上の暗い木の垂木だけが映る。
film.death_act7_3_chris_trapdoor2=閉じた落とし戸を見下ろしていると、目の前にウェンディゴが飛び降りてきて襲いかかり、彼をあおむけに押さえつける。鉤爪で喉を切り裂くと血が噴き出し、ウェンディゴはもぎ取った頭をこちらに向けて持ち上げる。口は開いている。
film.death_act7_3_chris_trapdoor2_ja=閉じた落とし戸を見下ろしていると、目の前にウェンディゴが飛び降りてきて襲いかかり、彼をあおむけに押さえつける。続いて、頭上の暗い木の梁だけが映る。
film.death_act7_3_chris_tunnel1=木組みの炭坑トンネルで、彼の脚が宙でばたつく。体の残りは上の画面外にあり、血が筋になって流れ落ちる。続いて、血の飛び散った板の前で、頭のない体が地面に落ちる。
film.death_act7_3_chris_tunnel1_ja=木組みの炭坑トンネルで、彼の脚が宙でばたつく。体の残りは上の画面外にあり、血が筋になって流れ落ちる。続いて、血の飛び散った板の前で、体が地面に落ちる。脚と背中だけが見え、手がぴくりと動く。
film.death_act8_4_josh_wendigo=暗い水の中からウェンディゴが飛び出し、長い両手で彼の頭をつかむ。指が頭蓋骨に食い込み、彼は悲鳴を上げる。ウェンディゴが締めつけ続け、ついに血が噴き出して画面一面に飛び散る。
film.death_act8_4_josh_wendigo_ja=暗い水の中からウェンディゴが飛び出し、長い両手で彼の頭をつかむ。指が頭蓋骨に食い込み、彼は悲鳴を上げる。ウェンディゴが締めつけると、カメラは二人から離れて上へ向かい、黒っぽいしぶきが画面に飛び散る。
film.death_act8_5_jessica_keepstill_timeout1=クローズアップ：あおむけに倒れた彼女が悲鳴を上げる。ウェンディゴが頭をつかみ、鉤爪のある指を口にねじ込む。下あごを引きちぎり、その牙の生えた口が、動かない彼女の顔のすぐそばにある。続いて、下あごを失った彼女が、炎の明かりの中で動かずに横たわっている。
film.death_act8_5_jessica_keepstill_timeout1_ja=ほとんど真っ暗：地面に動かずに横たわる体に沿って、カメラがゆっくりと移動する。続いてすぐそばで、ウェンディゴのあばら骨と頭が暗闇から浮かび上がる。
film.death_act8_5_jessica_keepstill_timeout2=雪の降る中のクローズアップ：あおむけに倒れた彼女が悲鳴を上げる。ウェンディゴが頭をつかみ、鉤爪のある指を口にねじ込む。下あごを引きちぎり、血まみれで歯の並んだ顔を彼女の顔に近づける。続いて、下あごを失った彼女が、炎の明かりの中、雪の上で動かずに横たわっている。
film.death_act8_5_jessica_keepstill_timeout2_ja=夜、雪の積もった岩の間：間近で、ウェンディゴの鉤爪のある長い手足が、誰かの黒い人影の上を通り過ぎる。続いてカメラは、誰もいない雪に覆われた岩の上をゆっくりと漂う。
film.death_act8_5_jessica_leftbehind=木組みのトンネルを、彼女がランタンを手に走る。ウェンディゴが背中に飛びかかり、彼女を引き倒す。クローズアップで、ウェンディゴが頭をつかみ、悲鳴を上げる口に鉤爪のある指をねじ込んで、下あごを引きちぎる。続いて、下あごを失った彼女が炎の明かりの中で動かずに横たわり、その上をウェンディゴの歯の並んだ頭がさっとよぎる。
film.death_act8_5_jessica_leftbehind_ja=ほとんど真っ暗：地面に動かずに横たわる体に沿って、カメラがゆっくりと移動する。続いて、骨ばったウェンディゴが暗闇の中を四つんばいで這っていく。
film.death_act8_5_jessica_timeout2=クローズアップ：あおむけに倒れた彼女が悲鳴を上げる。ウェンディゴが鉤爪のある片手で彼女の頭頂部をつかみ、もう片方の手の指を口にねじ込む。
film.death_act8_5_jessica_timeout2_ja=ほとんど真っ暗：地面に動かずに横たわる体に沿って、カメラがゆっくりと移動する。
film.death_act8_5_matt_gate=雪の降る中、木の壁にある明るい戸口の上にウェンディゴがうずくまり、彼めがけて飛び降りる。彼の上にかがみ込んだウェンディゴは、両腕を振り上げて伸び上がり、彼の顔を叩き潰す。クローズアップで、潰れて血まみれになった彼の顔が雪の上にある。
film.death_act8_5_matt_gate_ja=雪の降る中、木の壁にある明るい戸口の上にウェンディゴがうずくまり、彼めがけて飛び降りる。あおむけに倒れた彼の顔へ鉤爪が伸びる。続いてカメラは、上着にMの文字がある彼の胸元にとどまる。彼は動かずに横たわっている。
film.death_act8_5_matt_keepstill_timeout1=木組みのトンネルで、彼がランタンを手にしている。ウェンディゴが飛びかかり、彼を押し倒す。彼の上にかがみ込んだウェンディゴは、両腕を振り上げて伸び上がり、彼の顔を叩き潰す。クローズアップで、潰れて血まみれになった彼の顔。
film.death_act8_5_matt_keepstill_timeout1_ja=木組みのトンネルで、彼がランタンを手にしている。ウェンディゴが飛びかかり、彼を押し倒す。ウェンディゴは彼の上にかがみ込み、鉤爪をその顔へ伸ばす。続いてカメラは、上着にMの文字がある彼の胸元にとどまる。彼は動かずに横たわっている。
film.death_act8_5_matt_keepstill_timeout2=雪の降る中、両手を上げる彼の上にウェンディゴがかがみ込む。ウェンディゴは伸び上がり、彼の顔を叩き潰す。クローズアップで、潰れて血まみれになった彼の顔。
film.death_act8_5_matt_keepstill_timeout2_ja=雪の降る中、片手を上げる彼の上をウェンディゴが這って越えていく。続いてカメラは、上着にMの文字がある彼の胸元にとどまる。彼は動かずに横たわっている。
film.death_act8_5_matt_timeout1=ウェンディゴが木の梁を伝って降りてきて、彼に襲いかかり、地面に押し倒す。片手を上げる彼の上にかがみ込んだウェンディゴは、伸び上がって彼の顔を叩き潰す。クローズアップで、潰れて血まみれになった彼の顔。
film.death_act8_5_matt_timeout1_ja=ウェンディゴが木の梁を伝って降りてきて、彼に襲いかかり、地面に押し倒す。ウェンディゴは歯をむき出しにして彼の上にかがみ込む。続いてカメラは、上着にMの文字がある彼の胸元にとどまる。彼は動かずに横たわっている。
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=ロッジの中、シーツをかぶせた家具の間で、ウェンディゴが床から壁へ跳び移り、部屋に黄色っぽいもやが立ち込める。炎の爆発が彼女をうつぶせのまま床の上に吹き飛ばす。背後で炎が荒れ狂う中、彼女は動かずに横たわっている。
film.death_act8_6_ashley_eyegauge=肩に蝶のタトゥーがあるウェンディゴが彼女に襲いかかり、頭をつかむ。両目に親指を突き入れ、顔に血が流れ落ちる。続いて、木の床に横たわる彼女の血まみれの眼窩から親指を引き抜く。
film.death_act8_6_emily_explosion=噴き上がる炎の中、木の柱の向こうでウェンディゴがうなる。爆風が彼女を木の床の上に吹き飛ばす。彼女はうつぶせに横たわり、顔はひどく焼けただれている。
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=ロッジの中で、ウェンディゴが吠えながら画面に飛び込み、続いて壁際に立つ彼の顔に向かって叫ぶ。ウェンディゴは彼の頭をつかみ、腹を爪で切り裂いて、部屋の向こうへ放り投げる。彼は木の柱の根元に落ちる。
film.death_act8_6_mike_lightbulb_ja=ロッジの中で、ウェンディゴが叫びながら画面に迫る。彼がその胸を押し返す中、ウェンディゴは彼の頭をつかみ、顔に向かって叫び、彼を脇へ投げ飛ばす。続いて、後ろ姿のウェンディゴが長い両腕を大きく広げる。
film.death_act8_6_mike_explosion_unijured=ロッジの中で、火の玉がシーツをかぶせた家具の並ぶ部屋を突き抜け、ホールを駆け抜けて花瓶を粉々にする。続いて、炎の中で彼が床に横たわっている。顔はひどく焼けただれている。
film.death_act8_6_sam_wendigo1=ロッジの中で、ウェンディゴの鉤爪のある手が彼女の喉をつかんで宙に持ち上げている。彼女はあえぎ、口から血が流れ、額のランプが灯っている。ウェンディゴはもう片方の腕で彼女の腹を二度貫き、手を放す。彼女は床に落ち、動かなくなる。
film.death_act8_6_sam_wendigo1_ja=ロッジの中で、ウェンディゴが彼女をつかむ。下から見上げた視界で、ウェンディゴは彼女を腕いっぱいに伸ばして持ち上げている。彼女は画面の端の黒いぼやけた影になっている。ウェンディゴは頭をのけぞらせて叫び、続いて画面へ飛びかかり、四つんばいで素早く走り去る。
film.4_3_being_watched_emilymatt_cctv_footage=モニターに、夜の雪の積もった石塀の鉄の門を上から映す固定カメラの映像：エミリーが門を通り、続いてマットが通って後ろ手に門を閉める。二人は立ち去り、降りしきる雪の中、門だけが残る。
film.act20_6_cctv_footage=モニターに六つのカメラの映像：吊るされた丸のこの刃の下で、クリスとアシュリーが小さなテーブルをはさんで向かい合って座っている。クリスは拳銃を上に向けて二度撃ち、続いてテーブル越しにアシュリーに銃口を向けてから下ろす。ほかの映像には、ろうそくの灯ったバスタブのそばにいるタオル姿の女性、両手を頭の上で縛られて壁際に立つ二人、そして赤く染まったテーブルが映っている。
film.smg_sting.1=シアタールームのスクリーンに、何も映っていない、傷だらけのフィルムのリーダーがちらつき、ごちゃまぜの文字や数字が点滅する。
film.smg_sting.2=ろうそくの灯る浴槽に入ったサムの映像：肩越しに振り返り、浴槽から出て、タオルを巻いて立ち、あたりを見回す。
film.smg_sting.3=回転する巨大な丸のこの刃が、両腕を頭の上に上げてテーブルに横たわるジョッシュに食い込む。血が噴き出し、ジョッシュは顔をゆがめ、口から血があふれ、テーブルの下へ血と肉片が流れ落ちる。
film.smg_sting.4=再び、何も映っていないリーダーがちらつく。
film.projectorghost_movie=壁に、ちらつく古い映像：暖炉のそばのエミリーがカメラに向かって話し、続いてアシュリーを戸口の向こうへ押し出す。眼鏡のハンナが恥ずかしそうにほほえむ。二人の女の子が、続いてアシュリーが、暗がりからにやりと笑う。ハンナがブラウスのボタンを外し始め、そこで急に顔を背ける。
film.projectorghost_scare=赤い光に照らされた、眼鏡のハンナのクローズアップ。ほほえみながら話している。突然、黒い眼窩と血まみれの大きく開いた口を持つ、おぞましい白い顔がぱっと現れ、画面が真っ暗になる。
film.projector_wendigo=壁に古い白黒映画：看護師が、椅子に座った患者を残して立ち去る。患者はもがいて拘束を解き、壁をよじ登り、天井を這って暗闇へ消える。看護師が空の椅子に戻ってくると、上から腕が伸びてきて、閃光の後には看護師の姿はない。青白い人影がカメラに飛びかかり、映像が横倒しになる。
film.hannah_wendigo_reveal=セピア色のフラッシュ：黒い蝶のタトゥーが入った腕、続いて眼鏡をかけたハンナ。両手を胸に当て、カメラに向かってかすかにほほえんでいる。
film.newghosty_up=テレビの画面で、青白い化け物のような顔が、口を大きく開けて叫ぶ。一瞬、目の周りに黒いくまのある、青白い女性の顔に切り替わる。
film.sam_end_credits.1=窓越しに、夜の暗い寝室。携帯電話がアラームで光る：06:00 AM、Work Alarm。待ち受け画面は犬を抱きしめるサム。そばには薬の瓶と本、CREATURE MYTHS OF THE GREAT PLAINS。回る天井のファンの下で、サムがベッドに横たわっている。その目が大きく見開かれる。
film.sam_end_credits.2=薬の瓶が落ちて、別の本、THE WENDIGO LOGのそばへ転がる。サムはベッドの端に起き上がって座り、画面をスワイプしてアラームを止める。親指が画面に血をなすりつけ、前腕を血が伝い落ちる。
film.sam_end_credits.3=前腕のぎざぎざの切り傷にティッシュを押し当てるが、また血がにじむ。赤い光が次第に彼女を照らし出す。彼女は目を見開いて振り向く。
film.sam_end_credits.4=暗闇、そしてタイトル：UNTIL DAWN。
film.totem_events_of_the_past.1=長いコートを着て首にネッカチーフを巻いた男の古いセピア色の写真。そばにメモ：NO ESCAPE。毛むくじゃらで牙のある怪物と、鉤爪のある手のスケッチ。見出し：LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED、そしてLOCAL MAN FOUND DEAD。
film.totem_events_of_the_past.2=MIRACLE MINERAL DISCOVEREDという見出しの下に炭坑作業員たちの写真。RADIUM。続いてMINING DISASTERとDEATH TOLL RISES、そして黒く塗りつぶされた炭坑作業員たちの写真。
film.totem_events_of_the_past.3=血なまぐさい映像が次々に閃く：血まみれの歯と歯茎、ひび割れた頭蓋骨、血走った目をした血まみれの顔、生肉にたかるウジ。壁に殴り書きされたHUNGER CRAVING。HUMAN?と書かれたレントゲン写真。
film.totem_events_of_the_past.4=手書きのリスト：HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER。背を丸めた青白い人影を写した暗い写真が赤い丸で囲まれている：CREATURE REPORTED。牙のある怪物のスケッチにTEETH GROW & SHARPEN WITH AGE、そしてやせこけて手足の長い姿のスケッチ。THE ONLY WAYから、丸で囲まれたFIREへ矢印。ページが燃える。
film.totem_events_of_the_past.5=夜：雪の積もった松林の中に、明かりのともった木造の家。灰色のニット帽とセーター姿のベスと、眼鏡をかけてピンクのダウンジャケットを着たハンナが、手をつないでおびえながら森を走り抜け、霧のかかった崖の上へ出る。
film.totem_events_of_the_past.6=壊れた標識CLIFFのそばのロープの柵で、二人はおびえて振り返る。オレンジ色の熱探知の映像では、二人は木々の間で白く光る影として映っている。崖の縁で手をつないだまま、ハンナが足を滑らせて落ちかけ、ベスが彼女をつかむが、二人とも落ちていく。
film.totem_events_of_the_past.7=背中にタンクを背負った男が崖の縁へ走り、やせこけて手足の長い怪物が男へ這い寄る。男のゴーグルと、怪物の牙の生えた大きく開いた口のクローズアップ。男は火炎放射器で怪物に炎を浴びせる。怪物は雪の上でのたうちながら燃え、火の玉が膨れ上がって画面いっぱいに広がる。
