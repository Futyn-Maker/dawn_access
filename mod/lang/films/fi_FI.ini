; Dawn Access film descriptions — Finnish. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Yö, jyrkänteen reunalla: silmälasipäinen, vaaleanpunaiseen takkiin pukeutunut Hannah pitää kiinni Bethistä, jolla on harmaa pipo ja villapaita. Hannah horjahtaa takaperin reunan yli ja vetää Bethin perässään; alhaalla Beth iskeytyy selkä edellä lohkareeseen, ja verta suihkuaa.
film.death_act1_1_sisters_cliff.1=Pohjalla Hannah makaa kasvot verisinä ja silmät auki, Bethin verinen ruumis hänen takanaan.
film.death_act1_1_sisters_cliff_alone=Yö, kallioseinämällä: Hannahin käsi lipeää Bethin otteesta, ja Hannah vierii alas kivikkoa. Beth kurottaa ylöspäin kohti hansikoitua kättä, jota tumma hahmo ojentaa ylhäältä, mutta putoaa ja iskeytyy lumisiin lohkareisiin; pohjalla Hannah makaa verisenä, silmät auki, kun Beth rojahtaa hänen taakseen.
film.death_act3_2_jessica_liftshaft=Lyhtyä koholla pitävä Mike katsoo ylös kuiluun; Jessican ruumis putoaa hänen eteensä hissikorin ritilälattialle, alaleuka irti revittynä. Mike tuijottaa, kurottaa häntä kohti, ja kori syöksyy alas kipinöiden sinkoillessa.
film.death_act5_2_matt_climb=Perääntyessään sumuisessa metsässä sarvipäisten peurojen lauman edestä hän astuu kallionreunan yli ja putoaa pimeyteen. Hän makaa kasvot alaspäin kivellä, suun alla verilammikko; lähikuvassa hänen avoin silmänsä kimaltaa kyynelistä.
film.death_act5_2_matt_wendigo=Lähikuva hänen pelokkaista silmistään pimeässä. Takaapäin häneen tarttuu wendigo ja painaa hänet ketjujen seassa riippuvaan koukkuun; koukku työntyy alhaalta hänen leukansa läpi ja ulos suusta, ja hän roikkuu siinä kasvot veren peitossa.
film.death_act6_3_emily_eyegauge=Hänen päähänsä tarttuu wendigo ja työntää peukalonsa hänen silmiinsä; hän huutaa, kun veri virtaa pitkin hänen kasvojaan, ja roikkuu sitten velttona sen otteessa.
film.death_act6_3_emily_oregrinder=Hän liukuu lumista kourua alas murskaajan syöttösuppiloon ja takertuu sen reunaan; hänen sormensa lipeävät, ja hän putoaa piikkitelojen väliin huutaen, veren tulviessa hänen suustaan, kunnes hänen päänsä retkahtaa taaksepäin.
film.death_act6_4_chris_lodgedoor=Sisällä Ashley katsoo ylös ja astuu eteenpäin. Ulkona pimeässä wendigo tarttuu Chrisiin takaapäin, kynnet hänen kasvoillaan, ja repii hänen päänsä irti; pää makaa lumessa hänen ruumiinsa vieressä.
film.death_act6_4_chris_lodgedoor_ja=Oven lasiruutujen läpi näkyvä Ashley katsoo ulos ja astuu eteenpäin. Ulkona wendigo tarttuu Chrisiin takaapäin, kynnet hänen kasvoillaan, ja vetää hänet alas pois näkyvistä; se murisee kameralle ja poistuu, ja näkyviin jää pimeä metsä.
film.death_act6_4_chris_runtolodge_ashimpassive=Pimeässä lumessa wendigo painaa hänet maahan ja repii hänen päänsä irti; pää putoaa lumiselle kuistille Ashleyn jalkoihin. Veren roiskima Ashley seisoo katse alaspäin, kasvot irvessä.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Maan tasalta pimeässä metsässä: wendigo kyyristyy hänen ylleen, nostaa päätään silmät kiiluen ja poistuu. Lähikuva veren roiskimasta Ashleystä, joka on itkun partaalla ja irvistää; sitten hän seisoo katse alaspäin.
film.death_act6_4_chris_runtolodge_ashscreams=Pimeässä lumessa wendigo painaa hänet maahan ja repii hänen päänsä irti; pää lentää ilmassa, vierii lumessa ja pysähtyy lasiruutuisen oven eteen. Lasin takana Ashley painaa kädet suulleen ja vajoaa itkien polvilleen.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Maan tasalta pimeässä metsässä: wendigo kyyristyy hänen ylleen, nostaa päätään silmät kiiluen ja poistuu. Oven lasiruutujen takana Ashley tulee lähemmäs, painaa kädet suulleen ja vajoaa itkien polvilleen, kun hänen taakseen ilmestyy mies.
film.death_act7_1_emily_shotbymike=Valvontanäyttöjen valaisemassa pimeässä huoneessa Mike kääntyy ja tulee häntä kohti ase kädessään Ashleyn katsoessa, nostaa aseen molemmin käsin ja ampuu; verta roiskuu seinälle, ja lähikuvassa Emilyn vasemman silmän paikalla on verinen reikä, pää taaksepäin retkahtaneena, suu ammollaan.
film.death_act7_1_emily_shotbymike_ja=Valvontanäyttöjen valaisemassa pimeässä huoneessa Mike kääntyy ja tulee häntä kohti ase kädessään Ashleyn katsoessa ja nostaa aseen molemmin käsin. Laukauksen hetkellä kuva vaihtuu korkkitaululla olevaan karttaan (BLACKWOOD PINES MOUNTAINS), johon roiskuu verta; sitten pimeässä Emilyn saappaissa olevat jalat valahtavat lattialle.
film.death_act7_3_ashley_trapdoor_opened=Hän avaa lattialuukun; wendigo loikkaa ulos, kohoaa hänen ylleen, kun hän on polvillaan, ja puristaa pitkät kätensä hänen päänsä ympärille. Sitten tyhjälle maalattialle retkahtaa näkyviin hänen veltto kätensä, ja hänen irti revitty päänsä putoaa, vierii ja pysähtyy, silmät ja suu auki.
film.death_act7_3_ashley_trapdoor_opened_ja=Hän avaa lattialuukun; wendigo loikkaa ulos, kohoaa hänen ylleen, kun hän on polvillaan, ja puristaa pitkät kätensä hänen päänsä ympärille. Sitten näkyy vain tyhjä, pimeä luolakäytävä.
film.death_act7_3_ashley_trapdoor_unbolted=Hän seisoo muutaman askeleen päässä avoimesta lattialuukusta; wendigo kiipeää ulos ja painaa hänet päästä alas, kun hän huutaa. Sitten tyhjälle maalattialle retkahtaa näkyviin hänen veltto kätensä, ja hänen irti revitty päänsä putoaa, vierii ja pysähtyy, silmät ja suu auki.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Hän seisoo muutaman askeleen päässä avoimesta lattialuukusta; wendigo kiipeää ulos ja painaa hänet päästä alas, kun hän huutaa. Sitten näkyy vain tyhjä, hämärä kaivoskäytävä.
film.death_act7_3_chris_trapdoor1=Hän avaa lattialuukun; wendigo loikkaa ulos, kohoaa hänen ylleen, kun hän on polvillaan, ja vääntää hänen päänsä ympäri pitkillä käsillään. Sitten hänen irti revitty päänsä putoaa lattialle ja jää pystyyn kasvot katsojaan päin: silmälasit vinossa ja säröillä, suu auki.
film.death_act7_3_chris_trapdoor1_ja=Hän avaa lattialuukun; wendigo loikkaa ulos, kohoaa hänen ylleen, kun hän on polvillaan, ja tarttuu hänen päähänsä. Sitten näkyy vain tummia puisia kattoparruja yläpuolella.
film.death_act7_3_chris_trapdoor2=Kun hän katsoo alas suljettuun lattialuukkuun, hänen eteensä pudottautuu wendigo, loikkaa hänen kimppuunsa ja painaa hänet selälleen. Se viiltää kynsillään hänen kurkkunsa auki; verta purskahtaa, ja se nostaa hänen irti revityn päänsä kasvot katsojaan päin, suu auki.
film.death_act7_3_chris_trapdoor2_ja=Kun hän katsoo alas suljettuun lattialuukkuun, hänen eteensä pudottautuu wendigo, loikkaa hänen kimppuunsa ja painaa hänet selälleen. Sitten näkyy vain tummia puisia palkkeja yläpuolella.
film.death_act7_3_chris_tunnel1=Puulla tuetussa kaivostunnelissa hänen jalkansa potkivat ilmassa, muu ruumis ylhäällä poissa näkyvistä, kun verta valuu alas virtoina. Sitten veren roiskimien lautojen edessä hänen päätön ruumiinsa putoaa maahan.
film.death_act7_3_chris_tunnel1_ja=Puulla tuetussa kaivostunnelissa hänen jalkansa potkivat ilmassa, muu ruumis ylhäällä poissa näkyvistä, kun verta valuu alas virtoina. Sitten veren roiskimien lautojen edessä hänen ruumiinsa putoaa maahan; näkyvissä ovat vain hänen jalkansa ja selkänsä, ja käsi nytkähtää.
film.death_act8_4_josh_wendigo=Tummasta vedestä syöksyy esiin wendigo ja puristaa molemmat pitkät kätensä hänen päänsä ympärille. Hän huutaa, kun sen sormet painuvat hänen kalloonsa; se puristaa, kunnes veri purskahtaa esiin ja roiskuu kuvan yli.
film.death_act8_4_josh_wendigo_ja=Tummasta vedestä syöksyy esiin wendigo ja puristaa molemmat pitkät kätensä hänen päänsä ympärille. Hän huutaa, kun sen sormet painuvat hänen kalloonsa; kun se puristaa, kuva kohoaa pois heidän luotaan, ja tummia pisaroita roiskuu kuvan päälle.
film.death_act8_5_jessica_keepstill_timeout1=Lähikuva: hän makaa selällään huutaen, kun wendigo puristaa hänen päätään ja tunkee kynsikkäät sormensa hänen suuhunsa; se repii hänen alaleukansa irti, sen torahampainen kita hänen liikkumattomien kasvojensa vieressä. Sitten hän makaa liikkumatta tulen kajossa, alaleuka poissa.
film.death_act8_5_jessica_keepstill_timeout1_ja=Lähes mustaa: kamera liukuu hitaasti maassa liikkumatta makaavan ruumiin viertä; sitten aivan läheltä pimeydestä erottuvat wendigon kylkiluut ja pää.
film.death_act8_5_jessica_keepstill_timeout2=Lähikuva lumisateessa: hän makaa selällään huutaen, kun wendigo puristaa hänen päätään ja tunkee kynsikkäät sormensa hänen suuhunsa; se repii hänen alaleukansa irti ja tuo verisen, hampaikkaan naamansa lähelle hänen kasvojaan. Sitten hän makaa liikkumatta lumessa tulen kajossa, alaleuka poissa.
film.death_act8_5_jessica_keepstill_timeout2_ja=Yö, lumisten kivien keskellä: lähikuvassa wendigon pitkät, kynsikkäät raajat liikkuvat ohi jonkun tumman siluetin yläpuolella; sitten kamera lipuu hitaasti tyhjien, lumen peittämien kivien yllä.
film.death_act8_5_jessica_leftbehind=Puulla tuetussa tunnelissa hän juoksee lyhty kädessään; wendigo loikkaa hänen selkäänsä ja kaataa hänet maahan. Lähikuvassa se puristaa hänen päätään, tunkee kynsikkäät sormensa hänen huutavaan suuhunsa ja repii hänen alaleukansa irti; sitten hän makaa liikkumatta tulen kajossa, alaleuka poissa, kun sen hampaikas pää vilahtaa hänen yllään.
film.death_act8_5_jessica_leftbehind_ja=Lähes mustaa: kamera liukuu hitaasti maassa liikkumatta makaavan ruumiin viertä; sitten luiseva wendigo ryömii nelinkontin pimeyden halki.
film.death_act8_5_jessica_timeout2=Lähikuva: hän makaa selällään huutaen; wendigo puristaa toisella kynsikkäällä kädellään hänen päälakeaan ja tunkee toisen käden sormet hänen suuhunsa.
film.death_act8_5_jessica_timeout2_ja=Lähes mustaa: kamera liukuu hitaasti maassa liikkumatta makaavan ruumiin viertä.
film.death_act8_5_matt_gate=Lumisateessa wendigo kyyköttää puuseinän valaistun oviaukon yläpuolella ja loikkaa sitten alas hänen kimppuunsa. Hänen ylleen kyyristyneenä se kohottautuu pystyyn kädet koholla ja murskaa hänen kasvonsa; lähikuvassa hän makaa lumessa kasvot murskattuina ja verisinä.
film.death_act8_5_matt_gate_ja=Lumisateessa wendigo kyyköttää puuseinän valaistun oviaukon yläpuolella ja loikkaa sitten alas hänen kimppuunsa. Hänen maatessaan selällään sen kynnet kurottavat kohti hänen kasvojaan; sitten kamera viipyy hänen rintakehänsä kohdalla, takissa kirjain M, kun hän makaa liikkumatta.
film.death_act8_5_matt_keepstill_timeout1=Puulla tuetussa tunnelissa hän pitelee lyhtyä; wendigo loikkaa hänen kimppuunsa ja kaataa hänet maahan. Hänen ylleen kyyristyneenä se kohottautuu pystyyn kädet koholla ja murskaa hänen kasvonsa; lähikuvassa hän makaa kasvot murskattuina ja verisinä.
film.death_act8_5_matt_keepstill_timeout1_ja=Puulla tuetussa tunnelissa hän pitelee lyhtyä; wendigo loikkaa hänen kimppuunsa ja kaataa hänet maahan. Se kyyristyy hänen ylleen kynnet kurottaen kohti hänen kasvojaan; sitten kamera viipyy hänen rintakehänsä kohdalla, takissa kirjain M, kun hän makaa liikkumatta.
film.death_act8_5_matt_keepstill_timeout2=Lumisateessa wendigo kyyristyy hänen ylleen, kun hän nostaa kätensä; se kohottautuu pystyyn ja murskaa hänen kasvonsa. Lähikuvassa hän makaa kasvot murskattuina ja verisinä.
film.death_act8_5_matt_keepstill_timeout2_ja=Lumisateessa wendigo ryömii hänen ylitseen, kun hän nostaa kättään; sitten kamera viipyy hänen rintakehänsä kohdalla, takissa kirjain M, kun hän makaa liikkumatta.
film.death_act8_5_matt_timeout1=Puupalkkeja pitkin kiipeää alas wendigo, syöksähtää hänen kimppuunsa ja kaataa hänet maahan. Hänen ylleen kyyristyneenä, kun hän nostaa kättään, se kohottautuu pystyyn ja murskaa hänen kasvonsa; lähikuvassa hän makaa kasvot murskattuina ja verisinä.
film.death_act8_5_matt_timeout1_ja=Puupalkkeja pitkin kiipeää alas wendigo, syöksähtää hänen kimppuunsa ja kaataa hänet maahan. Se kyyristyy hänen ylleen hampaat irvessä; sitten kamera viipyy hänen rintakehänsä kohdalla, takissa kirjain M, kun hän makaa liikkumatta.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=Mökissä, lakanoilla peitettyjen huonekalujen keskellä, wendigo loikkaa lattialta seinälle, kun kellertävä usva täyttää huoneen. Tuliräjähdys paiskaa hänet kasvot alaspäin lattian poikki; hän makaa liikkumatta, kun liekit riehuvat hänen takanaan.
film.death_act8_6_ashley_eyegauge=Hänen kimppuunsa syöksyy wendigo, jonka olkapäässä on perhostatuointi, ja tarttuu hänen päähänsä. Se työntää peukalonsa hänen silmiinsä veren virratessa pitkin hänen kasvojaan ja vetää sitten peukalot ulos verisistä silmäkuopista, kun hän makaa puulattialla.
film.death_act8_6_emily_explosion=Roihahtavan tulen keskellä wendigo murisee puupylväiden takana. Räjähdys sinkoaa hänet puulattian poikki; hän makaa vatsallaan, kasvot pahoin palaneina.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=Mökissä wendigo karjuu suoraan kuvaan ja kirkuu sitten hänen kasvoilleen, kun hän seisoo seinää vasten. Se tarttuu hänen päähänsä, viiltää häntä vatsan poikki ja paiskaa hänet huoneen halki; hän rojahtaa puupilarin juurelle.
film.death_act8_6_mike_lightbulb_ja=Mökissä wendigo kirkuu suoraan kuvaan. Se tarttuu hänen päähänsä hänen työntäessään sitä rinnasta, kirkuu hänen kasvoilleen ja heittää hänet sivuun; sitten, takaapäin nähtynä, se levittää pitkät käsivartensa levälleen.
film.death_act8_6_mike_explosion_unijured=Mökissä tulipallo ryöpsähtää huoneen läpi, jossa huonekalut on peitetty lakanoilla, ja pyyhkäisee aulan halki särkien maljakon. Sitten hän makaa lattialla liekkien keskellä, kasvot pahoin palaneina.
film.death_act8_6_sam_wendigo1=Mökissä wendigon kynsikäs käsi pitää häntä kurkusta ilmassa; hän haukkoo henkeä, verta valuu hänen suustaan, otsalamppu palaa. Se työntää toisen käsivartensa kahdesti hänen vatsansa läpi ja päästää irti; hän putoaa lattialle ja jää makaamaan liikkumatta.
film.death_act8_6_sam_wendigo1_ja=Mökissä wendigo tarttuu häneen. Alhaalta nähtynä se pitää häntä ilmassa ojennetulla kädellään, tummana sumeana läiskänä kuvan reunassa, ja kirkuu pää taaksepäin heitettynä; sitten se syöksähtää kohti kuvaa ja kipittää pois nelinkontin.
film.4_3_being_watched_emilymatt_cctv_footage=Näytöllä kiinteä kamera katsoo yöllä ylhäältä rautaporttia lumisessa kivimuurissa: Emily tulee portista, sitten Matt, joka vetää portin kiinni perässään; molemmat kävelevät pois, ja portti seisoo autiona lumisateessa.
film.act20_6_cctv_footage=Näytöillä kuusi kamerakuvaa: Chris ja Ashley istuvat vastakkain pienen pöydän ääressä riippuvien sahanterien alla; Chris ampuu aseella kahdesti ylöspäin, tähtää sitten sillä pöydän yli Ashleyhin ja laskee sen. Muissa kuvissa näkyy pyyhkeeseen kietoutunut nainen kynttilöin valaistun kylpyammeen vieressä ja kaksi ihmistä seinää vasten kädet sidottuina päänsä yläpuolelle, sitten punaisella roiskittu pöytä.
film.smg_sting.1=Kotiteatterin valkokankaalla välkkyy tyhjä, naarmuinen filmin alkunauha, ja siinä vilahtelee sekaisin kirjaimia ja numeroita.
film.smg_sting.2=Kuvamateriaalia Samista kynttilöin valaistussa kylvyssä: hän vilkaisee olkansa yli, nousee ammeesta ja seisoo pyyhkeeseen kietoutuneena katsellen ympärilleen.
film.smg_sting.3=Valtava pyörivä sahanterä leikkautuu Joshiin, joka makaa pöydällä kädet päänsä yläpuolella; verta roiskuu, hän irvistää, verta purskahtaa hänen suustaan, ja verta ja lihanriekaleita valuu pöydän alle.
film.smg_sting.4=Tyhjä alkunauha välkkyy jälleen.
film.projectorghost_movie=Seinällä vanhaa, välkkyvää kuvamateriaalia: Emily puhuu takan ääressä kameralle ja työntää sitten Ashleyn oviaukosta; silmälasipäinen Hannah hymyilee ujosti; kaksi tyttöä ja sitten Ashley virnistävät pimeästä; Hannah alkaa avata puseronsa nappeja ja kääntää sitten päänsä äkisti pois.
film.projectorghost_scare=Punaisessa valossa lähikuva silmälasipäisestä Hannahista, joka hymyilee ja puhuu; yhtäkkiä esiin välähtävät kammottavat valkoiset kasvot, joissa on tummat silmäkuopat ja verinen, ammottava suu, ja kuva pimenee.
film.projector_wendigo=Seinällä vanha mustavalkoinen filmi: hoitaja jättää potilaan istumaan tuoliin; potilas riuhtaisee itsensä irti, kiipeää seinää ylös ja ryömii katon poikki pimeyteen. Hoitaja palaa tyhjän tuolin luo, ylhäältä kurottaa käsivarsi häntä kohti, ja välähdyksen jälkeen hän on poissa; kalpea hahmo syöksyy kameraa kohti, ja kuva kaatuu kyljelleen.
film.hannah_wendigo_reveal=Välähdys seepiansävyissä: käsivarsi, jossa on musta perhostatuointi, ja sitten silmälasipäinen Hannah, kädet rintaa vasten, hymyilee hennosti kameralle.
film.newghosty_up=Televisioruudulla kalpeat, irvokkaat kasvot kirkuvat suu ammolleen venyneenä; hetkeksi ne muuttuvat välkähtäen kalpean naisen kasvoiksi, joiden silmien ympärillä on tummat renkaat.
film.sam_end_credits.1=Ikkunan läpi nähtynä pimeä makuuhuone yöllä. Puhelin syttyy herätykseen, 06:00 AM, Work Alarm, taustakuvanaan koiraa halaava Sam, pilleripurkkien ja kirjan CREATURE MYTHS OF THE GREAT PLAINS vieressä. Sam makaa sängyllä pyörivän kattotuulettimen alla; hänen silmänsä aukeavat levälleen.
film.sam_end_credits.2=Pilleripurkki putoaa ja vierii toisen kirjan, THE WENDIGO LOG, viereen. Sam nousee istumaan sängyn reunalle ja sammuttaa herätyksen pyyhkäisyllä; hänen peukalonsa tahrii näytön verellä, ja verta valuu pitkin hänen kyynärvarttaan.
film.sam_end_credits.3=Hän painaa nenäliinaa kyynärvartensa rosoreunaista viiltoa vasten, mutta se vuotaa taas verta. Punainen valo nousee hänen ylleen; hän kääntyy silmät suurina.
film.sam_end_credits.4=Pimeyttä, sitten nimi: UNTIL DAWN.
film.totem_events_of_the_past.1=Vanha seepiansävyinen valokuva pitkään takkiin ja kaulahuiviin pukeutuneesta miehestä ja sen vieressä lappu: NO ESCAPE. Luonnoksia takkuisesta, torahampaisesta olennosta ja kynsikkäästä kädestä; otsikoita: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED ja LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Valokuva kaivosmiehistä otsikon MIRACLE MINERAL DISCOVERED alla; RADIUM; sitten MINING DISASTER ja DEATH TOLL RISES sekä mustalla töhritty valokuva kaivosmiehistä.
film.totem_events_of_the_past.3=Verisiä välähdyksiä: veriset hampaat ja ikenet, haljennut kallo, veren peittämät kasvot ja verestävä silmä, toukkia raa'an lihan päällä. HUNGER CRAVING töherrettynä seinään; röntgenkuva, merkintänä HUMAN?
film.totem_events_of_the_past.4=Käsin kirjoitettu luettelo: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Tumma valokuva kumarasta, kalpeasta hahmosta, punaisella ympyröitynä: CREATURE REPORTED. Luonnoksia torahampaisesta olennosta, TEETH GROW & SHARPEN WITH AGE, ja riutuneesta, pitkäraajaisesta hahmosta. THE ONLY WAY, nuoli ympyröityyn sanaan FIRE; sivu palaa.
film.totem_events_of_the_past.5=Yö: valaistu puutalo lumisten mäntyjen keskellä. Harmaaseen pipoon ja villapaitaan pukeutunut Beth ja silmälasipäinen, vaaleanpunaiseen toppatakkiin pukeutunut Hannah juoksevat kauhuissaan käsi kädessä metsän halki ja ulos sumuiselle jyrkänteen laelle.
film.totem_events_of_the_past.6=Köysiaidalla, rikkinäisen kyltin vieressä, jossa lukee CLIFF, he katsovat kauhuissaan taakseen; oranssi lämpökuva näyttää heidät hehkuvan valkoisina hahmoina puiden keskellä. Reunalla, käsi kädessä, Hannah lipsahtaa yli; Beth tarttuu häneen, ja molemmat putoavat.
film.totem_events_of_the_past.7=Mies, jolla on säiliöt selässään, juoksee jyrkänteen reunalle, kun riutunut, pitkäraajainen olento ryömii häntä kohti; lähikuvia hänen suojalaseistaan ja olennon ammottavasta, torahampaisesta kidasta. Hän kietoo sen liekkeihin liekinheittimellään; se palaa sätkien lumella, ja tulipallo paisuu täyttämään koko kuvan.
