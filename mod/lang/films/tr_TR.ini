; Dawn Access film descriptions — Turkish. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Gece, bir uçurumun kenarında: gözlüklü, pembe montlu Hannah, gri bereli ve kazaklı Beth'e tutunuyor. Hannah geriye doğru sendeleyip kenardan düşüyor ve Beth'i de peşinden sürüklüyor; aşağıda Beth sırtüstü iri bir kayaya sertçe çarpıyor, kan fışkırıyor.
film.death_act1_1_sisters_cliff.1=Aşağıda Hannah yatıyor, yüzü kanlı, gözleri açık; arkasında Beth'in kanlı bedeni.
film.death_act1_1_sisters_cliff_alone=Gece, sarp bir kaya yüzünde: Hannah'nın eli Beth'in elinden kayıyor ve Hannah kayalardan aşağı yuvarlanıyor. Beth, yukarıdaki karanlık bir figürün aşağı uzattığı eldivenli bir ele uzanıyor ama düşüp karlı kayalara sertçe çarpıyor; aşağıda Hannah kanlar içinde, gözleri açık yatıyor, Beth de onun arkasına düşüyor.
film.death_act3_2_jessica_liftshaft=Elinde bir feneri havaya kaldırmış Mike bir kuyunun içinden yukarı bakıyor; Jessica'nın bedeni, önündeki asansör kafesinin ızgaralı zeminine düşüyor, alt çenesi kopmuş. Mike donup bakıyor, ona uzanıyor ve kafes kıvılcımlar saçarak aşağı çöküyor.
film.death_act5_2_matt_climb=Sisli bir ormanda boynuzlu geyiklerden oluşan bir sürüden geri geri uzaklaşırken kayalık bir kenardan boşluğa adım atıyor ve karanlığa düşüyor. Bir kayanın üstünde yüzüstü yatıyor, ağzının altında kan birikmiş; yakın planda açık gözü yaşlarla parlıyor.
film.death_act5_2_matt_wendigo=Karanlıkta korku dolu gözlerine yakın plan. Bir Vendigo onu arkadan yakalayıp zincirlerin arasında asılı bir kancaya geçiriyor; kanca çenesini alttan delip ağzından çıkıyor ve o, yüzü kan içinde, orada asılı kalıyor.
film.death_act6_3_emily_eyegauge=Bir Vendigo başını kavrayıp başparmaklarını gözlerine gömüyor; yüzünden kan akarken çığlık atıyor, ardından Vendigonun elinde gevşekçe sarkıyor.
film.death_act6_3_emily_oregrinder=Karlı bir oluktan kayarak bir öğütücünün haznesine düşüyor ve kenarına tutunuyor; parmakları kayıyor ve dikenli silindirlerin arasına düşüyor; çığlık atıyor, ağzından kan boşanıyor, sonunda başı geriye düşüyor.
film.death_act6_4_chris_lodgedoor=İçeride Ashley başını kaldırıp bir adım öne atıyor. Dışarıda, karanlıkta bir Vendigo onu arkadan yakalıyor, pençesiyle yüzünü kavrayıp kafasını koparıyor; kafa, gövdesinin yanında karda yatıyor.
film.death_act6_4_chris_lodgedoor_ja=Kapının camlarının ardından görünen Ashley dışarı bakıp bir adım öne atıyor. Dışarıda bir Vendigo onu arkadan yakalıyor, pençesiyle yüzünü kavrayıp aşağıya, görüntünün dışına çekiyor; kameraya hırlıyor ve uzaklaşıyor, geriye karanlık orman kalıyor.
film.death_act6_4_chris_runtolodge_ashimpassive=Karanlıkta, karda bir Vendigo onu yere bastırıp kafasını koparıyor; kafa karlı verandaya, Ashley'nin ayaklarının dibine düşüyor. Üstüne kan sıçramış Ashley ayakta durmuş, yüzünü buruşturarak aşağı bakıyor.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Yerden, karanlık ormanda: bir Vendigo onun üzerine çömelmiş; gözleri parıldayarak başını kaldırıyor ve uzaklaşıyor. Yakın planda Ashley: üstüne kan sıçramış, ağlamak üzere, yüzünü buruşturuyor; ardından ayakta durmuş aşağı bakıyor.
film.death_act6_4_chris_runtolodge_ashscreams=Karanlıkta, karda bir Vendigo onu yere bastırıp kafasını koparıyor; kafa havada uçuyor ve karda yuvarlanıp camlı bir kapının önünde duruyor. Camın ardında Ashley ellerini ağzına bastırıyor ve ağlayarak dizlerinin üstüne çöküyor.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Yerden, karanlık ormanda: bir Vendigo onun üzerine çömelmiş; gözleri parıldayarak başını kaldırıyor ve uzaklaşıyor. Bir kapının camlarının ardında Ashley yaklaşıyor, ellerini ağzına bastırıyor ve ağlayarak dizlerinin üstüne çöküyor; arkasında bir adam beliriyor.
film.death_act7_1_emily_shotbymike=Güvenlik monitörlerinin aydınlattığı karanlık bir odada Mike dönüp elinde bir silahla ona doğru geliyor, Ashley ise izliyor; Mike silahı iki eliyle kaldırıp ateş ediyor: duvara kan sıçrıyor ve yakın planda sol gözünün yerinde kanlı bir delik, başı geriye düşmüş, ağzı ardına kadar açık.
film.death_act7_1_emily_shotbymike_ja=Güvenlik monitörlerinin aydınlattığı karanlık bir odada Mike dönüp elinde bir silahla ona doğru geliyor, Ashley ise izliyor; Mike silahı iki eliyle kaldırıyor. Ateş edildiği anda görüntü mantar bir panodaki bir haritaya (BLACKWOOD PINES MOUNTAINS) geçiyor ve haritaya kan sıçrıyor; ardından karanlıkta botlu bacakları yere kayıyor.
film.death_act7_3_ashley_trapdoor_opened=Yerdeki bir döşeme kapağını açıyor; içinden bir Vendigo fırlıyor, o diz çökmüşken üzerine dikiliyor ve uzun elleriyle başını kavrıyor. Ardından boş, toprak bir zeminde görüntüye cansız eli düşüyor; kopmuş kafası da düşüp yuvarlanıyor ve gözleri ve ağzı açık halde duruyor.
film.death_act7_3_ashley_trapdoor_opened_ja=Yerdeki bir döşeme kapağını açıyor; içinden bir Vendigo fırlıyor, o diz çökmüşken üzerine dikiliyor ve uzun elleriyle başını kavrıyor. Ardından yalnızca boş, karanlık bir mağara geçidi görünüyor.
film.death_act7_3_ashley_trapdoor_unbolted=Açık bir döşeme kapağından birkaç adım ötede duruyor; içinden bir Vendigo tırmanıp çıkıyor ve onu başından tutup yere bastırıyor; o çığlık atıyor. Ardından boş, toprak bir zeminde görüntüye cansız eli düşüyor; kopmuş kafası da düşüp yuvarlanıyor ve gözleri ve ağzı açık halde duruyor.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Açık bir döşeme kapağından birkaç adım ötede duruyor; içinden bir Vendigo tırmanıp çıkıyor ve onu başından tutup yere bastırıyor; o çığlık atıyor. Ardından yalnızca boş, loş bir maden geçidi görünüyor.
film.death_act7_3_chris_trapdoor1=Bir döşeme kapağını açıyor; içinden bir Vendigo fırlıyor, o diz çökmüşken üzerine dikiliyor ve uzun elleriyle başını sertçe burup çeviriyor. Ardından kopmuş kafası yere düşüyor ve dik duruyor, yüzü izleyiciye dönük: gözlüğü yamulmuş ve çatlamış, ağzı açık.
film.death_act7_3_chris_trapdoor1_ja=Bir döşeme kapağını açıyor; içinden bir Vendigo fırlıyor, o diz çökmüşken üzerine dikiliyor ve başını kavrıyor. Ardından yalnızca yukarıdaki karanlık ahşap çatı kirişleri görünüyor.
film.death_act7_3_chris_trapdoor2=Aşağıda kapalı bir döşeme kapağına bakarken önüne yukarıdan bir Vendigo atlıyor, üzerine saldırıp onu sırtüstü yere yapıştırıyor. Pençeleriyle boğazını yarıyor; kan fışkırıyor ve Vendigo kopmuş kafasını, yüzü izleyiciye dönük şekilde kaldırıyor, ağzı açık.
film.death_act7_3_chris_trapdoor2_ja=Aşağıda kapalı bir döşeme kapağına bakarken önüne yukarıdan bir Vendigo atlıyor, üzerine saldırıp onu sırtüstü yere yapıştırıyor. Ardından yalnızca yukarıdaki karanlık ahşap kirişler görünüyor.
film.death_act7_3_chris_tunnel1=Ahşap destekli bir maden tünelinde bacakları havada çırpınıyor, bedeninin geri kalanı yukarıda, görüntünün dışında; aşağı kan oluk oluk akıyor. Ardından kan sıçramış tahtaların önünde başsız bedeni yere düşüyor.
film.death_act7_3_chris_tunnel1_ja=Ahşap destekli bir maden tünelinde bacakları havada çırpınıyor, bedeninin geri kalanı yukarıda, görüntünün dışında; aşağı kan oluk oluk akıyor. Ardından kan sıçramış tahtaların önünde bedeni yere düşüyor; yalnızca bacakları ve sırtı görünüyor, bir eli seğiriyor.
film.death_act8_4_josh_wendigo=Karanlık suyun içinden bir Vendigo fırlıyor ve iki uzun eliyle başını kavrıyor. Vendigonun parmakları kafatasına gömülürken çığlık atıyor; Vendigo, kan fışkırıp bütün görüntüye sıçrayana dek sıkıyor.
film.death_act8_4_josh_wendigo_ja=Karanlık suyun içinden bir Vendigo fırlıyor ve iki uzun eliyle başını kavrıyor. Vendigonun parmakları kafatasına gömülürken çığlık atıyor; Vendigo sıktıkça görüntü onlardan yukarı doğru uzaklaşıyor ve üzerine koyu damlalar sıçrıyor.
film.death_act8_5_jessica_keepstill_timeout1=Yakın plan: sırtüstü yatmış çığlık atıyor; bir Vendigo başını kavrıyor ve pençeli parmaklarını ağzına sokuyor; alt çenesini koparıyor, sivri dişli ağzı onun hareketsiz yüzünün hemen yanında. Ardından ateşin ışığında hareketsiz yatıyor, alt çenesi yok.
film.death_act8_5_jessica_keepstill_timeout1_ja=Neredeyse kapkaranlık: kamera, yerde hareketsiz yatan bir bedenin yanından yavaşça geçiyor; ardından hemen yakında, karanlığın içinden bir Vendigonun kaburgaları ve kafası beliriyor.
film.death_act8_5_jessica_keepstill_timeout2=Yakın plan, kar yağıyor: sırtüstü yatmış çığlık atıyor; bir Vendigo başını kavrıyor ve pençeli parmaklarını ağzına sokuyor; alt çenesini koparıyor ve kanlı, sivri dişli yüzünü onun yüzüne yaklaştırıyor. Ardından ateşin ışığında, karda hareketsiz yatıyor, alt çenesi yok.
film.death_act8_5_jessica_keepstill_timeout2_ja=Gece, karlı kayaların arasında: yakın planda bir Vendigonun uzun, pençeli uzuvları birinin karanlık silüetinin üzerinden geçiyor; ardından kamera boş, karla kaplı kayaların üzerinde yavaşça süzülüyor.
film.death_act8_5_jessica_leftbehind=Ahşap destekli bir tünelde elinde bir fenerle koşuyor; bir Vendigo sırtına atlayıp onu yere yıkıyor. Yakın planda Vendigo başını kavrıyor, pençeli parmaklarını çığlık atan ağzına sokuyor ve alt çenesini koparıyor; ardından ateşin ışığında hareketsiz yatıyor, alt çenesi yok, Vendigonun sivri dişli kafası da üzerinden bir anlığına geçiyor.
film.death_act8_5_jessica_leftbehind_ja=Neredeyse kapkaranlık: kamera, yerde hareketsiz yatan bir bedenin yanından yavaşça geçiyor; ardından kemikli bir Vendigo karanlığın içinde dört ayak üstünde sürünüyor.
film.death_act8_5_jessica_timeout2=Yakın plan: sırtüstü yatmış çığlık atıyor; bir Vendigo pençeli bir eliyle başının tepesini kavrıyor, öbür elinin parmaklarını ağzına sokuyor.
film.death_act8_5_jessica_timeout2_ja=Neredeyse kapkaranlık: kamera, yerde hareketsiz yatan bir bedenin yanından yavaşça geçiyor.
film.death_act8_5_matt_gate=Kar yağarken bir Vendigo, ahşap bir duvardaki aydınlık bir kapı boşluğunun üstüne çömelmiş; ardından aşağıya, onun üzerine atlıyor. Üzerine çömelmiş halde kollarını kaldırarak doğruluyor ve yüzünü ezip parçalıyor; yakın planda ezilmiş, kanlı yüzü karda yatıyor.
film.death_act8_5_matt_gate_ja=Kar yağarken bir Vendigo, ahşap bir duvardaki aydınlık bir kapı boşluğunun üstüne çömelmiş; ardından aşağıya, onun üzerine atlıyor. O sırtüstü yatarken Vendigonun pençeleri yüzüne uzanıyor; ardından kamera, ceketinde M harfi olan göğsünün üzerinde duruyor; o hareketsiz yatıyor.
film.death_act8_5_matt_keepstill_timeout1=Ahşap destekli bir tünelde elinde bir fener tutuyor; bir Vendigo üstüne atılıp onu yere yıkıyor. Üzerine çömelmiş halde kollarını kaldırarak doğruluyor ve yüzünü ezip parçalıyor; yakın planda ezilmiş, kanlı yüzü.
film.death_act8_5_matt_keepstill_timeout1_ja=Ahşap destekli bir tünelde elinde bir fener tutuyor; bir Vendigo üstüne atılıp onu yere yıkıyor. Vendigo üzerine çömeliyor, pençeleri yüzüne uzanıyor; ardından kamera, ceketinde M harfi olan göğsünün üzerinde duruyor; o hareketsiz yatıyor.
film.death_act8_5_matt_keepstill_timeout2=Kar yağarken bir Vendigo onun üzerine çömelmiş, o da ellerini kaldırıyor; Vendigo doğrulup yüzünü ezip parçalıyor. Yakın planda ezilmiş, kanlı yüzü.
film.death_act8_5_matt_keepstill_timeout2_ja=Kar yağarken bir Vendigo onun üzerinden sürünerek geçiyor, o da bir elini kaldırıyor; ardından kamera, ceketinde M harfi olan göğsünün üzerinde duruyor; o hareketsiz yatıyor.
film.death_act8_5_matt_timeout1=Bir Vendigo ahşap kirişlerden aşağı iniyor, üstüne atılıp onu yere yıkıyor. O bir elini kaldırırken Vendigo üzerine çömelmiş halde doğruluyor ve yüzünü ezip parçalıyor; yakın planda ezilmiş, kanlı yüzü.
film.death_act8_5_matt_timeout1_ja=Bir Vendigo ahşap kirişlerden aşağı iniyor, üstüne atılıp onu yere yıkıyor. Dişlerini göstererek üzerine çömeliyor; ardından kamera, ceketinde M harfi olan göğsünün üzerinde duruyor; o hareketsiz yatıyor.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=Dağ evinde, üzerleri çarşaflarla örtülü mobilyaların arasında bir Vendigo yerden duvara atlıyor, odayı sarımsı bir pus dolduruyor. Bir alev patlaması onu yüzüstü zeminin üzerinde savuruyor; arkasında alevler kükrerken hareketsiz yatıyor.
film.death_act8_6_ashley_eyegauge=Omzunda kelebek dövmesi olan bir Vendigo üstüne atılıp başını kavrıyor. Başparmaklarını gözlerine gömüyor, yüzünden kan akıyor; ardından onları kanlı göz çukurlarından çekip çıkarıyor; o ahşap bir zeminde yatıyor.
film.death_act8_6_emily_explosion=Patlayan alevlerin arasında, ahşap dikmelerin ardında bir Vendigo hırlıyor. Patlama onu ahşap bir zeminin üzerinde savuruyor; yüzüstü yatıyor, yüzü kötü yanmış.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=Dağ evinde bir Vendigo kükreyerek görüntüye dalıyor, ardından o duvarın önünde dururken yüzüne çığlık atıyor. Başını kavrıyor, pençeleriyle karnını yarıp onu odanın öbür ucuna fırlatıyor; o, ahşap bir sütunun dibine düşüyor.
film.death_act8_6_mike_lightbulb_ja=Dağ evinde bir Vendigo çığlık atarak görüntüye dalıyor. O, Vendigonun göğsünü iterken Vendigo başını kavrıyor, yüzüne çığlık atıyor ve onu bir kenara fırlatıyor; ardından, arkadan görünen Vendigo uzun kollarını iki yana açıyor.
film.death_act8_6_mike_explosion_unijured=Dağ evinde bir ateş topu, üzerleri çarşaflarla örtülü mobilyalarla dolu bir odayı yarıp geçiyor ve holü süpürerek bir vazoyu paramparça ediyor. Ardından alevlerin ortasında yerde yatıyor, yüzü kötü yanmış.
film.death_act8_6_sam_wendigo1=Dağ evinde bir Vendigonun pençeli eli onu boğazından tutup havada tutuyor; nefes almaya çalışıyor, ağzından kan akıyor, alnındaki lamba yanıyor. Vendigo öbür kolunu iki kez karnından geçiriyor ve onu bırakıyor; yere düşüp hareketsiz kalıyor.
film.death_act8_6_sam_wendigo1_ja=Dağ evinde bir Vendigo onu yakalıyor. Aşağıdan bakıldığında, onu uzattığı kolunun ucunda havada tutuyor; o, görüntünün kenarında karanlık, bulanık bir leke halinde. Vendigo başını geriye atarak çığlık atıyor; ardından görüntüye doğru atılıyor ve dört ayak üstünde hızla uzaklaşıyor.
film.4_3_being_watched_emilymatt_cctv_footage=Bir monitörde, sabit bir kamera gece karlı bir taş duvardaki demir bir kapıya yukarıdan bakıyor: kapıdan önce Emily, ardından kapıyı arkasından çekip kapatan Matt geçiyor; ikisi de uzaklaşıyor ve kapı, yağan karın altında boş kalıyor.
film.act20_6_cctv_footage=Monitörlerde altı kameranın görüntüsü: Chris ve Ashley, asılı testere bıçaklarının altında küçük bir masada karşılıklı oturuyor; Chris silahla iki kez havaya ateş ediyor, ardından masanın öbür ucundaki Ashley'ye nişan alıp silahı indiriyor. Öbür görüntülerde mumlarla aydınlatılmış bir küvetin yanında havlulu bir kadın ve elleri başlarının üstünde bağlı halde bir duvarın önünde duran iki kişi, ardından kırmızıya bulanmış bir masa görünüyor.
film.smg_sting.1=Sinema perdesinde boş, çizik bir film başlangıç şeridi titreşiyor, karmakarışık harfler ve rakamlar yanıp sönüyor.
film.smg_sting.2=Mumlarla aydınlatılmış bir küvetteki Sam'in görüntüleri: omzunun üzerinden bakıyor, küvetten çıkıyor ve havluya sarınmış halde etrafına bakınarak duruyor.
film.smg_sting.3=Dev, dönen bir testere bıçağı, kolları başının üstünde bir masada yatan Josh'u kesiyor; kan fışkırıyor, Josh yüzünü buruşturuyor, ağzından kan boşanıyor ve masanın altına kan ve parçalanmış et dökülüyor.
film.smg_sting.4=Boş başlangıç şeridi yeniden titreşiyor.
film.projectorghost_movie=Duvarda eski, titreşen bir görüntü: şöminenin yanındaki Emily kameraya konuşuyor, ardından Ashley'yi bir kapıdan içeri itiyor; gözlüklü Hannah utangaç bir şekilde gülümsüyor; iki kız, ardından Ashley karanlıktan sırıtıyor; Hannah bluzunun düğmelerini açmaya başlıyor, sonra başını aniden başka yana çeviriyor.
film.projectorghost_scare=Kırmızı ışıkta, gözlüklü Hannah'nın yakın planı: gülümseyip konuşuyor; birden koyu göz çukurları ve kanlı, ardına kadar açık bir ağzı olan dehşet verici beyaz bir yüz beliriyor ve ekran kararıyor.
film.projector_wendigo=Duvarda eski, siyah beyaz bir film: bir hemşire, sandalyede oturan bir hastayı bırakıp gidiyor; hasta çırpınarak kurtuluyor, duvara tırmanıyor ve tavanda sürünerek karanlığa geçiyor. Hemşire boş sandalyeye dönüyor, yukarıdan ona bir kol uzanıyor ve bir parlamanın ardından hemşire yok oluyor; solgun bir figür kameraya atılıyor ve görüntü yana devriliyor.
film.hannah_wendigo_reveal=Sepya tonlarında bir parlama: siyah kelebek dövmeli bir kol, ardından gözlüklü Hannah, elleri göğsünde, kameraya belli belirsiz gülümsüyor.
film.newghosty_up=Televizyonda solgun, hortlak gibi bir yüz ağzını ardına kadar açarak çığlık atıyor; bir anlığına titreşip gözlerinin çevresi kararmış, solgun bir kadın yüzüne dönüşüyor.
film.sam_end_credits.1=Bir pencereden, gece karanlık bir yatak odası. Bir telefon alarmla aydınlanıyor: 06:00 AM, Work Alarm; duvar kâğıdında Sam bir köpeğe sarılıyor; yanında ilaç şişeleri ve bir kitap, CREATURE MYTHS OF THE GREAT PLAINS. Sam, dönen bir tavan vantilatörünün altında yatakta yatıyor; gözleri iri iri açılıyor.
film.sam_end_credits.2=Bir ilaç şişesi düşüp başka bir kitabın yanına yuvarlanıyor: THE WENDIGO LOG. Sam yatağın kenarında doğrulup oturuyor ve parmağını kaydırarak alarmı kapatıyor; başparmağı ekrana kan bulaştırıyor, ön kolundan aşağı kan süzülüyor.
film.sam_end_credits.3=Ön kolundaki yırtık bir yaraya bir mendil bastırıyor ama yara yeniden kanıyor. Kırmızı bir ışık giderek onu sarıyor; gözleri iri iri açılmış halde dönüyor.
film.sam_end_credits.4=Karanlık, ardından başlık: UNTIL DAWN.
film.totem_events_of_the_past.1=Uzun paltolu, boynu fularlı bir adamın eski bir sepya fotoğrafı, yanında bir not: NO ESCAPE. Tüylü, sivri dişli bir yaratığın ve pençeli bir elin çizimleri; manşetler: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED ve LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=MIRACLE MINERAL DISCOVERED manşetinin altında madencilerin bir fotoğrafı; RADIUM; ardından MINING DISASTER ve DEATH TOLL RISES ve siyahla karalanmış bir madenci fotoğrafı.
film.totem_events_of_the_past.3=Kanlı görüntüler çakıp sönüyor: kanlı dişler ve diş etleri, çatlak bir kafatası, kanlanmış bir gözü olan kan içinde bir yüz, çiğ etin üzerinde kurtçuklar. Bir duvara karalanmış HUNGER CRAVING; üzerinde HUMAN? yazan bir röntgen.
film.totem_events_of_the_past.4=El yazısıyla bir liste: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Kambur, solgun bir figürün kırmızıyla daire içine alınmış karanlık bir fotoğrafı: CREATURE REPORTED. Sivri dişli bir yaratığın çizimi, TEETH GROW & SHARPEN WITH AGE, ve sıska, uzun uzuvlu bir figürün çizimi. THE ONLY WAY, daire içine alınmış FIRE kelimesine giden bir ok; sayfa yanıyor.
film.totem_events_of_the_past.5=Gece: karlı çamların arasında ışıkları yanan ahşap bir ev. Gri bereli ve kazaklı Beth ile gözlüklü, pembe şişme montlu Hannah, el ele, dehşet içinde ormanda koşuyor ve sisli bir uçurumun tepesine çıkıyor.
film.totem_events_of_the_past.6=CLIFF yazan kırık bir tabelanın yanındaki halat çitin önünde dehşet içinde arkalarına bakıyorlar; turuncu bir termal görüntüde ağaçların arasında parlayan beyaz şekiller olarak görünüyorlar. Uçurumun kenarında el ele tutuşurken Hannah kenardan kayıyor; Beth onu yakalıyor ve ikisi de düşüyor.
film.totem_events_of_the_past.7=Sırtında tüpler olan bir adam uçurumun kenarına koşuyor, sıska, uzun uzuvlu bir yaratık da ona doğru sürünüyor; adamın koruyucu gözlüğüne ve yaratığın ardına kadar açık, sivri dişli ağzına yakın planlar. Adam alev silahıyla yaratığı alevlere boğuyor; yaratık karın üstünde çırpınarak yanıyor ve bir ateş topu büyüyerek bütün ekranı kaplıyor.
film.causaleffect_act1_3_samattackedbycrow=Tel örgü bir çitin yanında bir karga Sam'in üzerine pike yapıyor; Sam ellerini yüzüne götürerek eğiliyor.
film.causaleffect_act2_1_mattlooksthroughtelescope=Bir teleskoptan: karlı bir yamaçta Mike, kenarı kürklü bir palto giymiş birine sıkıca sarılıyor.
film.causaleffect_act2_2_minetunnel=Karanlıkta, çapraz ahşap kirişlerin arasında Mike eğilerek görüntüye giriyor ve etrafına bakınıyor; arkasında bulanık biri var.
film.causaleffect_act2_4_samfindsbaseballbat=Karanlık bir odada Sam gülümseyerek bir beyzbol sopası savuruyor; ardından bir el fenerinin ışığındaki Josh elinde bir sopayla sırıtıyor.
film.causaleffect_act2_5_jessthroughwindow_pants=Karanlıkta, bir pencerenin yanında, uzun, kemikli bir el çığlık atan Jessica'yı başından yakalıyor ve bir hamlede görüntünün dışına çekiyor.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Bir teleskoptan: bir kaya duvarının altında karlı kayalar; ardından, neredeyse karanlıkta, gözleri parıldayan sıska, buruşuk bir yüz bütün görüntüyü kaplıyor.
film.causaleffect_act3_2_bridgefail=Gece Mike, küçük, karlı bir halat köprünün üzerine koşuyor; altındaki bir tahta kırılıyor ve Mike aşağı düşüp gözden kayboluyor.
film.causaleffect_act3_2_clifffail=Karlı bir yamaçta, feneri havaya kaldırmış Mike kayıyor ve kayaların üzerinden takla atarak aşağı yuvarlanıyor.
film.causaleffect_act3_2_cliffsafe=Kayalık bir yamaçta, elinde bir fenerle Mike kayalardan dikkatlice aşağı iniyor.
film.causaleffect_act3_2_grabfencefail=Yukarıdan bakış: Mike karlı bir yamaçta tel örgü bir çite uzanıyor, kayıyor ve aşağıdaki karın üzerine sırtüstü düşüyor.
film.causaleffect_act3_2_grabrootfail=Yukarıdan bakış: Mike karlı bir yamaçta kalın bir köke tutunuyor, kayıyor ve aşağıdaki karın üzerine sırtüstü düşüyor.
film.causaleffect_act3_2_jumpclifffail=Gece, elinde bir fenerle Mike kayalık bir yarığa atlıyor, sert bir şekilde yere iniyor ve tırmanarak ilerliyor.
film.causaleffect_act3_2_mikefallsover=Elinde bir fenerle Mike karlı, ağaçlık bir yamaçtan aşağı koşuyor, tökezliyor ve yüzüstü yere kapaklanıyor.
film.causaleffect_act3_2_mikeisfast=Elinde bir fenerle Mike, kayaların arasındaki karlı bir yarık boyunca doğruca izleyiciye doğru var gücüyle koşuyor.
film.causaleffect_act3_2_pipefail=Feneri yukarıda tutan Mike, karla kaplı kalın bir borunun üzerinde dengesini koruyarak ilerliyor, kayıyor ve azgın sulara düşüyor.
film.causaleffect_act3_2_shimmy=Yukarıdan bakış: Mike karanlık kayaların arasından aşağı iniyor; ardından tek eliyle tutunarak dik bir kaya duvarı boyunca yan yan ilerliyor.
film.causaleffect_act3_2_takestairs=Elinde bir fenerle Mike ahşap bir kulübeye koşuyor ve karlı basamaklarından aceleyle kapıya çıkıyor.
film.causaleffect_act3_2_wendigointower_fast=Bir nişan dürbününden: karda çapraz ahşap kirişler; nişangâhın yanında küçük, gri bir şey yükselerek görüntüye giriyor.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=Karanlıkta bir çakmağın alevi kaba tahtaları aydınlatıyor; tahtaların arasındaki bir aralıktan iri açılmış, cam gibi bir çift göz dışarı bakıyor.
film.causaleffect_act4_1_chrissavesash=Tel örgünün ardında, asılı bir lambanın altında oturan biri görünüyor; ardından dev, dişli bir testere bıçağı ve yanında, gölgede, ekose gömlekli bir adam.
film.causaleffect_act4_2_mikebefriendswolf=Mike tüylü bir kurdun yanına çömelip onun kürkünü okşuyor.
film.causaleffect_act4_2_mikekickswolf=Bir kapı boşluğunda Mike bir kurda tekme savuruyor; ardından, üstü başı kir içinde, feneri havada, öbür elini kaldırıp yüzünü buruşturuyor.
film.causaleffect_act4_2_mikelooksatswolf=Mike açık elini bir kurda doğru kaldırıyor; kurt başını eğip arkasını dönüyor, ardından Mike'ın hemen önünden geçiyor.
film.causaleffect_act4_2_mikestillhasmachete=Eller metal bir kapanın çenelerinde; Mike acıyla başını geriye atıyor. Ardından fayanslı bir odada yerden bir pala alıyor.
film.causaleffect_act4_2_wendigoheadinajar=Büyük bir cam kavanozun içinde, küçücük gözleri parıldayan solgun, benekli bir kafa.
film.causaleffect_act5_2_emgivesflaretomatt=Ahşap bir barakada Emily, Matt'e bir işaret fişeği tabancası uzatıyor; Matt tabancayı alıp ona bakıyor.
film.causaleffect_act5_3_chrisshotashley=Küçük, ahşap bir masada gözlüklü Chris, ağlayan Ashley'ye bir tabanca doğrultuyor.
film.causaleffect_act7_3_ashley_trapdoor=Yukarıdan bakış: yüzüklü, örgü bilek ısıtıcılı bir el, ahşap bir döşeme kapağının sürgüsünü çekiyor ve kulpunu kavrıyor.
film.intro_busride.1=Karanlık, ardından başlık: UNTIL DAWN.
film.intro_busride.2=Açılış jeneriği, içlerinde bir anlığına yüzler beliren nesnelerin loş yakın planları üzerinde: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Sallanan bir oyuncak at ile eski bir telsiz cihazının üzerinde: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=Gün batımında, yukarıdan bakış: bir otobüs çamların arasından, karlı bir dağ yolunda kıvrıla kıvrıla tırmanıyor.
film.intro_busride.5=Otobüste Sam cam kenarında oturuyor; telefonunda: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Sam'in telefonunda bir video oynuyor: ekose gömlekli Josh, karanlık bir odada kameraya konuşuyor.
