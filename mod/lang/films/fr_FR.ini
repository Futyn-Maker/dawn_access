; Dawn Access film descriptions — French. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Nuit, au bord d'une falaise : Hannah, en lunettes et veste rose, s'accroche à Beth, en bonnet et pull gris. Hannah trébuche en arrière par-dessus le bord et entraîne Beth avec elle ; en bas, Beth s'écrase de dos sur un bloc rocheux, le sang gicle.
film.death_act1_1_sisters_cliff.1=En bas, Hannah gît, le visage ensanglanté et les yeux ouverts, le corps ensanglanté de Beth derrière elle.
film.death_act1_1_sisters_cliff_alone=Nuit, sur une paroi rocheuse : la main d'Hannah glisse de celle de Beth, et Hannah dévale les rochers. Beth cherche à saisir une main gantée qu'une silhouette sombre lui tend d'en haut, mais elle tombe et s'écrase sur des rochers enneigés ; en bas, Hannah gît, ensanglantée, les yeux ouverts, tandis que Beth s'abat derrière elle.
film.death_act3_2_jessica_liftshaft=Mike, une lanterne levée, regarde vers le haut d'un puits ; le corps de Jessica tombe devant lui sur le plancher grillagé d'une cabine d'ascenseur, la mâchoire inférieure arrachée. Il la fixe, tend la main vers elle, et la cabine chute dans une gerbe d'étincelles.
film.death_act5_2_matt_climb=Reculant devant un troupeau de cerfs aux bois dans une forêt brumeuse, il fait un pas dans le vide depuis un rebord rocheux et tombe dans l'obscurité. Il gît face contre un rocher, une flaque de sang sous la bouche ; en gros plan, son œil ouvert brille de larmes.
film.death_act5_2_matt_wendigo=Gros plan sur ses yeux effrayés dans l'obscurité. Un wendigo le saisit par-derrière et l'enfonce sur un crochet suspendu parmi des chaînes ; le crochet lui transperce la mâchoire par en dessous et ressort par la bouche, et il reste suspendu là, le visage couvert de sang.
film.death_act6_3_emily_eyegauge=Un wendigo lui saisit la tête et lui enfonce les pouces dans les yeux ; elle hurle, le sang ruisselant sur son visage, puis pend, inerte, dans sa poigne.
film.death_act6_3_emily_oregrinder=Elle glisse le long d'une goulotte enneigée jusque dans la trémie d'un broyeur et s'agrippe à son bord ; ses doigts lâchent et elle tombe entre des rouleaux hérissés de pointes, hurlant, le sang coulant à flots de sa bouche, jusqu'à ce que sa tête retombe en arrière.
film.death_act6_4_chris_lodgedoor=À l'intérieur, Ashley lève les yeux et fait un pas en avant. Dehors, dans l'obscurité, un wendigo le saisit par-derrière, les griffes sur son visage, et lui arrache la tête ; la tête gît dans la neige à côté de son corps.
film.death_act6_4_chris_lodgedoor_ja=Ashley, vue à travers les vitres d'une porte, regarde dehors et fait un pas en avant. Dehors, un wendigo le saisit par-derrière, les griffes sur son visage, et l'entraîne vers le bas, hors du champ ; le wendigo gronde face à la caméra et s'éloigne, ne laissant que la forêt obscure.
film.death_act6_4_chris_runtolodge_ashimpassive=Dans la pénombre, sur la neige, un wendigo le plaque au sol et lui arrache la tête ; la tête atterrit sur le perron enneigé, aux pieds d'Ashley. Ashley, éclaboussée de sang, se tient là, les yeux baissés, grimaçante.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Depuis le sol, dans des bois sombres : un wendigo est accroupi au-dessus de lui, lève la tête, les yeux luisants, et s'éloigne. Gros plan sur Ashley, éclaboussée de sang et au bord des larmes, grimaçante ; puis elle se tient là, les yeux baissés.
film.death_act6_4_chris_runtolodge_ashscreams=Dans la pénombre, sur la neige, un wendigo le plaque au sol et lui arrache la tête ; la tête vole dans les airs, roule et s'immobilise dans la neige devant une porte vitrée. Derrière la vitre, Ashley plaque ses mains sur sa bouche et tombe à genoux en pleurant.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Depuis le sol, dans des bois sombres : un wendigo est accroupi au-dessus de lui, lève la tête, les yeux luisants, et s'éloigne. Derrière les vitres d'une porte, Ashley s'approche, plaque ses mains sur sa bouche et tombe à genoux en pleurant, tandis qu'un homme apparaît derrière elle.
film.death_act7_1_emily_shotbymike=Dans une pièce sombre éclairée par des écrans de surveillance, Mike se retourne et s'avance vers elle, une arme à la main, sous le regard d'Ashley, la lève à deux mains et tire ; le sang éclabousse le mur, et en gros plan son œil gauche n'est plus qu'un trou sanglant, la tête rejetée en arrière, la bouche béante.
film.death_act7_1_emily_shotbymike_ja=Dans une pièce sombre éclairée par des écrans de surveillance, Mike se retourne et s'avance vers elle, une arme à la main, sous le regard d'Ashley, et la lève à deux mains. Au moment du coup de feu, l'image passe à une carte sur un tableau en liège (BLACKWOOD PINES MOUNTAINS), éclaboussée de sang ; puis, dans l'obscurité, ses jambes chaussées de bottes glissent jusqu'au sol.
film.death_act7_3_ashley_trapdoor_opened=Elle ouvre une trappe dans le sol ; un wendigo en jaillit, se dresse au-dessus d'elle, agenouillée, et lui enserre la tête de ses longues mains. Puis, sur un sol de terre vide, sa main inerte retombe dans le champ, et sa tête arrachée tombe et roule avant de s'immobiliser, les yeux et la bouche ouverts.
film.death_act7_3_ashley_trapdoor_opened_ja=Elle ouvre une trappe dans le sol ; un wendigo en jaillit, se dresse au-dessus d'elle, agenouillée, et lui enserre la tête de ses longues mains. Puis on ne voit plus qu'un passage de grotte vide et sombre.
film.death_act7_3_ashley_trapdoor_unbolted=Elle se tient à quelques pas d'une trappe ouverte ; un wendigo en sort et lui pousse la tête vers le sol tandis qu'elle hurle. Puis, sur un sol de terre vide, sa main inerte retombe dans le champ, et sa tête arrachée tombe et roule avant de s'immobiliser, les yeux et la bouche ouverts.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Elle se tient à quelques pas d'une trappe ouverte ; un wendigo en sort et lui pousse la tête vers le sol tandis qu'elle hurle. Puis on ne voit plus qu'une galerie de mine vide, plongée dans la pénombre.
film.death_act7_3_chris_trapdoor1=Il ouvre une trappe ; un wendigo en jaillit, se dresse au-dessus de lui, agenouillé, et lui tord la tête de ses longues mains. Puis sa tête arrachée tombe sur le sol et reste droite, face au spectateur : lunettes de travers et fêlées, bouche ouverte.
film.death_act7_3_chris_trapdoor1_ja=Il ouvre une trappe ; un wendigo en jaillit, se dresse au-dessus de lui, agenouillé, et lui saisit la tête. Puis on ne voit plus, en haut, que des poutres de bois sombres.
film.death_act7_3_chris_trapdoor2=Alors qu'il baisse les yeux vers une trappe fermée, un wendigo se laisse tomber devant lui, bondit et le plaque sur le dos. Le wendigo lui ouvre la gorge de ses griffes ; le sang jaillit, et il soulève la tête arrachée face au spectateur, bouche ouverte.
film.death_act7_3_chris_trapdoor2_ja=Alors qu'il baisse les yeux vers une trappe fermée, un wendigo se laisse tomber devant lui, bondit et le plaque sur le dos. Puis on ne voit plus, en haut, que des poutres de bois sombres.
film.death_act7_3_chris_tunnel1=Dans un tunnel de mine étayé de bois, ses jambes battent l'air, le reste de son corps hors du champ, en haut, tandis que des flots de sang ruissellent. Puis, devant des planches éclaboussées de sang, son corps sans tête tombe au sol.
film.death_act7_3_chris_tunnel1_ja=Dans un tunnel de mine étayé de bois, ses jambes battent l'air, le reste de son corps hors du champ, en haut, tandis que des flots de sang ruissellent. Puis, devant des planches éclaboussées de sang, son corps tombe au sol ; on ne voit que ses jambes et son dos, et une main tressaille.
film.death_act8_4_josh_wendigo=Un wendigo jaillit d'une eau sombre et lui enserre la tête de ses deux longues mains. Il hurle tandis que les doigts s'enfoncent dans son crâne ; le wendigo serre jusqu'à ce que le sang gicle et éclabousse l'image.
film.death_act8_4_josh_wendigo_ja=Un wendigo jaillit d'une eau sombre et lui enserre la tête de ses deux longues mains. Il hurle tandis que les doigts s'enfoncent dans son crâne ; pendant que le wendigo serre, la vue s'élève loin d'eux et des gouttes sombres l'éclaboussent.
film.death_act8_5_jessica_keepstill_timeout1=En gros plan : elle est étendue sur le dos et hurle, tandis qu'un wendigo lui saisit la tête et lui enfonce ses doigts griffus dans la bouche ; il lui arrache la mâchoire inférieure, sa gueule garnie de crocs tout près de son visage figé. Puis elle gît, immobile, à la lueur du feu, sans mâchoire inférieure.
film.death_act8_5_jessica_keepstill_timeout1_ja=Presque noir : la caméra longe lentement un corps étendu immobile sur le sol ; puis, tout près, les côtes et la tête d'un wendigo émergent de l'obscurité.
film.death_act8_5_jessica_keepstill_timeout2=En gros plan, sous la neige qui tombe : elle est étendue sur le dos et hurle, tandis qu'un wendigo lui saisit la tête et lui enfonce ses doigts griffus dans la bouche ; il lui arrache la mâchoire inférieure et approche sa face ensanglantée, hérissée de dents, tout près de son visage. Puis elle gît, immobile, dans la neige, à la lueur du feu, sans mâchoire inférieure.
film.death_act8_5_jessica_keepstill_timeout2_ja=Nuit, parmi des rochers enneigés : en gros plan, les longs membres griffus d'un wendigo passent au-dessus de la silhouette sombre de quelqu'un ; puis la caméra dérive lentement au-dessus de rochers déserts couverts de neige.
film.death_act8_5_jessica_leftbehind=Dans un tunnel étayé de bois, elle court avec une lanterne ; un wendigo lui saute sur le dos et la jette à terre. En gros plan, il lui saisit la tête, enfonce ses doigts griffus dans sa bouche hurlante et lui arrache la mâchoire inférieure ; puis elle gît, immobile, à la lueur du feu, sans mâchoire inférieure, tandis que la tête hérissée de dents du wendigo passe en un éclair au-dessus d'elle.
film.death_act8_5_jessica_leftbehind_ja=Presque noir : la caméra longe lentement un corps étendu immobile sur le sol ; puis un wendigo osseux rampe à quatre pattes dans l'obscurité.
film.death_act8_5_jessica_timeout2=En gros plan : elle est étendue sur le dos et hurle ; un wendigo lui saisit le sommet du crâne d'une main griffue et lui enfonce les doigts de l'autre dans la bouche.
film.death_act8_5_jessica_timeout2_ja=Presque noir : la caméra longe lentement un corps étendu immobile sur le sol.
film.death_act8_5_matt_gate=Sous la neige qui tombe, un wendigo est accroupi au-dessus de l'embrasure éclairée d'une porte, dans un mur en bois, puis bondit sur lui. Accroupi au-dessus de lui, il se redresse, les bras levés, et lui défonce le visage ; en gros plan, son visage écrasé et ensanglanté dans la neige.
film.death_act8_5_matt_gate_ja=Sous la neige qui tombe, un wendigo est accroupi au-dessus de l'embrasure éclairée d'une porte, dans un mur en bois, puis bondit sur lui. Alors qu'il est étendu sur le dos, les griffes se tendent vers son visage ; puis la caméra s'attarde sur sa poitrine, avec la lettre M sur sa veste, tandis qu'il gît immobile.
film.death_act8_5_matt_keepstill_timeout1=Dans un tunnel étayé de bois, il tient une lanterne ; un wendigo bondit sur lui et le renverse. Accroupi au-dessus de lui, il se redresse, les bras levés, et lui défonce le visage ; en gros plan, son visage écrasé et ensanglanté.
film.death_act8_5_matt_keepstill_timeout1_ja=Dans un tunnel étayé de bois, il tient une lanterne ; un wendigo bondit sur lui et le renverse. Le wendigo est accroupi au-dessus de lui, les griffes tendues vers son visage ; puis la caméra s'attarde sur sa poitrine, avec la lettre M sur sa veste, tandis qu'il gît immobile.
film.death_act8_5_matt_keepstill_timeout2=Sous la neige qui tombe, un wendigo est accroupi au-dessus de lui tandis qu'il lève les mains ; le wendigo se redresse et lui défonce le visage. En gros plan, son visage écrasé et ensanglanté.
film.death_act8_5_matt_keepstill_timeout2_ja=Sous la neige qui tombe, un wendigo rampe sur lui alors qu'il lève une main ; puis la caméra s'attarde sur sa poitrine, avec la lettre M sur sa veste, tandis qu'il gît immobile.
film.death_act8_5_matt_timeout1=Un wendigo descend le long de poutres en bois, se jette sur lui et le renverse au sol. Accroupi au-dessus de lui tandis qu'il lève une main, le wendigo se redresse et lui défonce le visage ; en gros plan, son visage écrasé et ensanglanté.
film.death_act8_5_matt_timeout1_ja=Un wendigo descend le long de poutres en bois, se jette sur lui et le renverse au sol. Le wendigo est accroupi au-dessus de lui, montrant les dents ; puis la caméra s'attarde sur sa poitrine, avec la lettre M sur sa veste, tandis qu'il gît immobile.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=Dans le chalet, parmi des meubles couverts de draps, un wendigo bondit du sol jusqu'au mur tandis qu'une brume jaunâtre envahit la pièce. Un souffle de feu la projette à plat ventre sur le plancher ; elle gît immobile tandis que les flammes font rage derrière elle.
film.death_act8_6_ashley_eyegauge=Un wendigo portant un tatouage de papillon sur l'épaule se jette sur elle et lui saisit la tête. Il lui enfonce les pouces dans les yeux, le sang ruisselant sur son visage, puis les retire des orbites ensanglantées, tandis qu'elle gît sur un plancher de bois.
film.death_act8_6_emily_explosion=Au milieu des flammes qui jaillissent, un wendigo gronde derrière des poteaux en bois. L'explosion la projette sur un plancher de bois ; elle gît à plat ventre, le visage gravement brûlé.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=Dans le chalet, un wendigo rugit face au spectateur, puis lui hurle au visage tandis qu'il se tient contre un mur. Le wendigo lui saisit la tête, lui lacère le ventre et le projette à travers la pièce ; il s'effondre au pied d'un pilier en bois.
film.death_act8_6_mike_lightbulb_ja=Dans le chalet, un wendigo hurle face au spectateur. Le wendigo lui saisit la tête tandis que Mike pousse contre son torse, lui hurle au visage et le jette de côté ; puis, vu de dos, il écarte largement ses longs bras.
film.death_act8_6_mike_explosion_unijured=Dans le chalet, une boule de feu jaillit dans une pièce aux meubles couverts de draps et balaie le hall, brisant un vase. Puis il gît sur le sol au milieu des flammes, le visage gravement brûlé.
film.death_act8_6_sam_wendigo1=Dans le chalet, la main griffue d'un wendigo la tient soulevée par la gorge ; elle suffoque, du sang coulant de sa bouche, la lampe allumée sur son front. Il lui transperce deux fois le ventre de son autre bras et la lâche ; elle tombe au sol et ne bouge plus.
film.death_act8_6_sam_wendigo1_ja=Dans le chalet, un wendigo la saisit. Vu d'en bas, il la tient à bout de bras, tache sombre et floue au bord de l'image, et hurle, la tête rejetée en arrière ; puis il se jette vers le spectateur et détale à quatre pattes.
film.4_3_being_watched_emilymatt_cctv_footage=Sur un écran, une caméra fixe filme en plongée, la nuit, un portail en fer dans un mur de pierre enneigé : Emily le franchit, puis Matt, qui referme le portail derrière lui ; tous deux s'éloignent, et le portail reste désert sous la neige qui tombe.
film.act20_6_cctv_footage=Sur les écrans, six flux de caméras : Chris et Ashley sont assis face à face à une petite table, sous des lames de scie suspendues ; Chris tire deux fois en l'air avec un pistolet, puis le braque sur Ashley par-dessus la table et l'abaisse. D'autres images montrent une femme en serviette près d'une baignoire éclairée aux bougies, et deux personnes contre un mur, les mains liées au-dessus de la tête, puis une table éclaboussée de rouge.
film.smg_sting.1=Sur l'écran de la salle de cinéma, une amorce de film vierge et rayée vacille, où clignotent pêle-mêle des lettres et des chiffres.
film.smg_sting.2=Des images de Sam dans un bain éclairé aux bougies : elle jette un regard par-dessus son épaule, sort de la baignoire et se tient debout, enroulée dans une serviette, regardant autour d'elle.
film.smg_sting.3=Une énorme lame de scie en rotation entaille Josh, allongé sur une table, les bras au-dessus de la tête ; le sang gicle, il grimace, le sang jaillit de sa bouche, et du sang et des lambeaux de chair se déversent sous la table.
film.smg_sting.4=L'amorce vierge vacille de nouveau.
film.projectorghost_movie=Sur le mur, de vieilles images tremblotantes : Emily, près d'une cheminée, parle à la caméra, puis pousse Ashley par une porte ; Hannah, à lunettes, sourit timidement ; deux filles, puis Ashley, sourient de toutes leurs dents dans l'ombre ; Hannah commence à déboutonner son chemisier, puis détourne brusquement la tête.
film.projectorghost_scare=Un gros plan d'Hannah, à lunettes, sous une lumière rouge, qui sourit et parle ; soudain, un visage blanc effroyable aux orbites sombres et à la bouche béante et ensanglantée surgit en un éclair, et l'écran devient noir.
film.projector_wendigo=Sur le mur, un vieux film en noir et blanc : une infirmière laisse un patient assis sur une chaise ; il se libère en se débattant, escalade le mur et rampe au plafond jusque dans l'obscurité. Elle revient vers la chaise vide, un bras descend vers elle d'en haut, et après un éclair elle a disparu ; une silhouette pâle se jette sur la caméra, et l'image bascule sur le côté.
film.hannah_wendigo_reveal=Un flash en sépia : un bras portant un tatouage de papillon noir, puis Hannah, à lunettes, les mains sur la poitrine, qui sourit faiblement à la caméra.
film.newghosty_up=Sur la télévision, un visage blême et macabre hurle, la bouche grande ouverte ; un instant, il se change en tremblotant en un visage pâle de femme aux yeux cernés de noir.
film.sam_end_credits.1=Par une fenêtre, une chambre plongée dans le noir, la nuit. Un téléphone s'allume sur une alarme, 06:00 AM, Work Alarm, avec en fond d'écran Sam serrant un chien dans ses bras, à côté de flacons de comprimés et d'un livre, CREATURE MYTHS OF THE GREAT PLAINS. Sam est allongée sur le lit sous un ventilateur de plafond qui tourne ; ses yeux s'ouvrent grand.
film.sam_end_credits.2=Un flacon de comprimés tombe et roule près d'un autre livre, THE WENDIGO LOG. Sam s'assoit au bord du lit et coupe l'alarme d'un glissement du doigt ; son pouce étale du sang sur l'écran, et du sang coule le long de son avant-bras.
film.sam_end_credits.3=Elle presse un mouchoir contre une entaille irrégulière sur son avant-bras, mais la plaie saigne de nouveau. Une lumière rouge s'étend sur elle ; elle se retourne, les yeux écarquillés.
film.sam_end_credits.4=Le noir, puis le titre : UNTIL DAWN.
film.totem_events_of_the_past.1=Une vieille photo sépia d'un homme en long manteau, un foulard au cou, à côté d'une note : NO ESCAPE. Des croquis d'une créature hirsute à crocs et d'une main griffue ; des titres : LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, et LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Une photo de mineurs sous le titre MIRACLE MINERAL DISCOVERED ; RADIUM ; puis MINING DISASTER et DEATH TOLL RISES, et une photo de mineurs gribouillée de noir.
film.totem_events_of_the_past.3=Des images sanglantes en éclairs : dents et gencives ensanglantées, un crâne fêlé, un visage couvert de sang à l'œil injecté de sang, des asticots sur de la chair crue. HUNGER CRAVING griffonné sur un mur ; une radiographie marquée HUMAN?
film.totem_events_of_the_past.4=Une liste manuscrite : HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Une photo sombre d'une silhouette pâle et voûtée, entourée de rouge : CREATURE REPORTED. Des croquis d'une créature à crocs, TEETH GROW & SHARPEN WITH AGE, et d'une silhouette décharnée aux longs membres. THE ONLY WAY, une flèche vers FIRE, entouré ; la page brûle.
film.totem_events_of_the_past.5=Nuit : une maison en bois éclairée parmi des pins enneigés. Beth, en bonnet et pull gris, et Hannah, en lunettes et doudoune rose, courent, terrifiées, à travers les bois, main dans la main, jusqu'au sommet d'une falaise noyé de brume.
film.totem_events_of_the_past.6=Près d'une clôture de corde, à côté d'un panneau cassé, CLIFF, elles se retournent, terrifiées ; une vue thermique orange les montre comme des formes d'un blanc lumineux parmi les arbres. Main dans la main au bord du vide, Hannah glisse ; Beth l'agrippe, et toutes deux tombent.
film.totem_events_of_the_past.7=Un homme portant des réservoirs sur le dos court jusqu'au bord de la falaise tandis qu'une créature décharnée aux longs membres rampe vers lui ; gros plans sur ses lunettes de protection et sur la gueule béante de la créature, hérissée de crocs. Il l'inonde de feu avec son lance-flammes ; elle brûle en se débattant sur la neige, et une boule de feu enfle jusqu'à remplir l'écran.
film.causaleffect_act1_3_samattackedbycrow=Près d'un grillage, un corbeau fond sur Sam ; elle se baisse, les mains sur le visage.
film.causaleffect_act2_1_mattlooksthroughtelescope=Vu au télescope : sur un flanc de colline enneigé, Mike serre étroitement dans ses bras quelqu'un en manteau bordé de fourrure.
film.causaleffect_act2_2_minetunnel=Dans l'obscurité, entre des poutres en bois entrecroisées, Mike entre dans le champ en se penchant et regarde autour de lui, avec derrière lui quelqu'un de flou.
film.causaleffect_act2_4_samfindsbaseballbat=Dans une pièce sombre, Sam brandit une batte de baseball en souriant ; puis Josh, éclairé par une lampe torche, tient une batte et sourit de toutes ses dents.
film.causaleffect_act2_5_jessthroughwindow_pants=Près d'une fenêtre, dans l'obscurité, une longue main osseuse saisit par la tête Jessica, qui hurle, et la tire d'un coup sec hors du champ.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Vu au télescope : des rochers enneigés au pied d'une paroi rocheuse ; puis, dans une quasi-obscurité, un visage décharné et ridé aux yeux luisants emplit l'image.
film.causaleffect_act3_2_bridgefail=La nuit, Mike s'élance sur un petit pont de corde enneigé ; une planche se brise sous lui et il tombe hors de vue.
film.causaleffect_act3_2_clifffail=Sur une pente enneigée, Mike, une lanterne levée, glisse et dévale les rochers en faisant des culbutes.
film.causaleffect_act3_2_cliffsafe=Sur une pente rocheuse, Mike, une lanterne à la main, descend prudemment les rochers.
film.causaleffect_act3_2_grabfencefail=Vu d'en haut : Mike tend la main vers un grillage sur une pente enneigée, glisse et tombe sur le dos dans la neige en contrebas.
film.causaleffect_act3_2_grabrootfail=Vu d'en haut : Mike s'agrippe à une grosse racine sur une pente enneigée, glisse et tombe sur le dos dans la neige en contrebas.
film.causaleffect_act3_2_jumpclifffail=La nuit, Mike, une lanterne à la main, saute dans une ravine rocheuse, atterrit lourdement et continue à grimper.
film.causaleffect_act3_2_mikefallsover=Mike, une lanterne à la main, dévale une pente boisée et enneigée, trébuche et s'étale face contre terre.
film.causaleffect_act3_2_mikeisfast=Mike, une lanterne à la main, file à toute allure dans une ravine enneigée entre les rochers, droit vers le spectateur.
film.causaleffect_act3_2_pipefail=Mike, une lanterne brandie bien haut, avance en équilibre sur un gros tuyau couvert de neige, glisse et plonge dans des eaux tumultueuses.
film.causaleffect_act3_2_shimmy=Vu d'en haut : Mike descend entre des rochers sombres ; puis il progresse de côté le long d'une paroi abrupte, en s'y agrippant d'une main.
film.causaleffect_act3_2_takestairs=Mike, une lanterne à la main, court jusqu'à une cabane en bois et monte en hâte ses marches enneigées jusqu'à la porte.
film.causaleffect_act3_2_wendigointower_fast=Vu dans une lunette de visée : des poutres en bois croisées dans la neige ; quelque chose de petit et de gris s'élève dans le champ, à côté du réticule.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=Dans l'obscurité, la flamme d'un briquet éclaire des planches grossières ; par un interstice entre elles, deux yeux écarquillés et vitreux regardent au-dehors.
film.causaleffect_act4_1_chrissavesash=À travers un grillage, on voit quelqu'un assis sous une lampe suspendue ; puis une énorme lame de scie dentée et, à côté, dans l'ombre, un homme en chemise à carreaux.
film.causaleffect_act4_2_mikebefriendswolf=Mike s'accroupit près d'un loup hirsute et caresse sa fourrure.
film.causaleffect_act4_2_mikekickswolf=Dans l'embrasure d'une porte, Mike lance un coup de pied à un loup ; puis, crasseux, sa lanterne brandie, il lève l'autre main en grimaçant.
film.causaleffect_act4_2_mikelooksatswolf=Mike tend une main ouverte vers un loup ; le loup baisse la tête et se détourne, puis passe tout près devant lui.
film.causaleffect_act4_2_mikestillhasmachete=Des mains sur les mâchoires d'un piège en métal ; Mike rejette la tête en arrière de douleur. Puis, dans une pièce carrelée, il ramasse une machette.
film.causaleffect_act4_2_wendigoheadinajar=Une tête pâle et marbrée aux minuscules yeux luisants, dans un grand bocal en verre.
film.causaleffect_act5_2_emgivesflaretomatt=Dans une baraque en bois, Emily tend un pistolet lance-fusées à Matt ; il le prend et le regarde.
film.causaleffect_act5_3_chrisshotashley=À une petite table en bois, Chris, à lunettes, braque un pistolet sur Ashley, qui pleure.
film.causaleffect_act7_3_ashley_trapdoor=Vu d'en haut : une main portant une bague et un chauffe-poignet en tricot tire le verrou d'une trappe en bois et en saisit la poignée.
film.intro_busride.1=Le noir, puis le titre : UNTIL DAWN.
film.intro_busride.2=Générique de début sur de sombres gros plans d'objets, où l'on entrevoit des visages : HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Sur un cheval à bascule et un vieux poste de radio : ORIGINAL SCORE by MARK KORVEN ; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK ; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=Au coucher du soleil, vu d'en haut : un autocar monte en serpentant une route de montagne enneigée, parmi les pins.
film.intro_busride.5=Dans le car, Sam est assise près de la fenêtre ; sur son téléphone : LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=Son téléphone diffuse une vidéo : Josh, en chemise à carreaux, parle à la caméra dans une pièce sombre.
