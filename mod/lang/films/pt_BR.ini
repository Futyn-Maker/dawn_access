; Dawn Access film descriptions — Portuguese (Brazil). Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Noite, à beira de um penhasco: Hannah, de óculos e jaqueta rosa, se segura em Beth, de gorro e suéter cinza. Hannah tropeça para trás e cai pela borda, arrastando Beth consigo; lá embaixo, Beth se choca de costas contra um rochedo, e o sangue espirra.
film.death_act1_1_sisters_cliff.1=Lá embaixo, Hannah jaz com o rosto ensanguentado e os olhos abertos, o corpo ensanguentado de Beth atrás dela.
film.death_act1_1_sisters_cliff_alone=Noite, em um paredão rochoso: a mão de Hannah escapa da de Beth, e Hannah rola pelas pedras. Beth estica o braço para uma mão enluvada que uma figura escura lhe estende lá de cima, mas cai e se choca contra rochedos nevados; lá embaixo, Hannah jaz ensanguentada, de olhos abertos, enquanto Beth cai atrás dela.
film.death_act3_2_jessica_liftshaft=Mike, erguendo um lampião, olha para cima por um poço; o corpo dela cai diante dele no piso gradeado de uma gaiola de elevador, com a mandíbula inferior arrancada. Ele fica olhando, estende a mão para ela, e a gaiola despenca em uma chuva de faíscas.
film.death_act5_2_matt_climb=Recuando diante de uma manada de cervos com galhada em uma floresta enevoada, ele pisa em falso na beira de uma rocha e cai na escuridão. Jaz de bruços sobre uma rocha, uma poça de sangue sob a boca; em primeiro plano, seu olho aberto brilha, cheio de lágrimas.
film.death_act5_2_matt_wendigo=Primeiro plano de seus olhos assustados no escuro. Um wendigo o agarra por trás e o enfia em um gancho pendurado entre correntes; o gancho atravessa sua mandíbula de baixo para cima e sai pela boca, e ele fica pendurado ali, com o rosto coberto de sangue.
film.death_act6_3_emily_eyegauge=Um wendigo agarra a cabeça dela e enfia os polegares em seus olhos; ela grita enquanto o sangue escorre pelo rosto, e depois fica pendendo, inerte, nas garras dele.
film.death_act6_3_emily_oregrinder=Ela escorrega por uma calha nevada até a tremonha de um triturador e se agarra à borda; os dedos escorregam e ela cai entre rolos cheios de pontas, gritando, com sangue jorrando da boca, até que a cabeça tomba para trás.
film.death_act6_4_chris_lodgedoor=Lá dentro, Ashley ergue os olhos e dá um passo à frente. Lá fora, no escuro, um wendigo o agarra por trás, com as garras sobre o rosto dele, e lhe arranca a cabeça; a cabeça fica na neve ao lado do corpo.
film.death_act6_4_chris_lodgedoor_ja=Ashley, vista pelos vidros de uma porta, olha para fora e dá um passo à frente. Lá fora, um wendigo o agarra por trás, com as garras sobre o rosto dele, e o puxa para baixo, para fora da imagem; rosna para a câmera e se afasta, deixando só a floresta escura.
film.death_act6_4_chris_runtolodge_ashimpassive=No escuro, na neve, um wendigo o prende no chão e lhe arranca a cabeça; a cabeça cai na varanda nevada, aos pés de Ashley. Ashley, respingada de sangue, está de pé olhando para baixo, com uma careta.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Do chão, em uma floresta escura: um wendigo está agachado sobre ele, ergue a cabeça, com os olhos brilhando, e se afasta. Primeiro plano de Ashley, respingada de sangue e à beira das lágrimas, com uma careta; depois ela está de pé olhando para baixo.
film.death_act6_4_chris_runtolodge_ashscreams=No escuro, na neve, um wendigo o prende no chão e lhe arranca a cabeça; a cabeça voa pelo ar e rola até parar na neve diante de uma porta envidraçada. Atrás do vidro, Ashley leva as mãos à boca e cai de joelhos, chorando.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Do chão, em uma floresta escura: um wendigo está agachado sobre ele, ergue a cabeça, com os olhos brilhando, e se afasta. Atrás dos vidros de uma porta, Ashley se aproxima, leva as mãos à boca e cai de joelhos, chorando, enquanto um homem aparece atrás dela.
film.death_act7_1_emily_shotbymike=Em uma sala escura iluminada por monitores de segurança, Mike se vira e vem em direção a ela com uma arma enquanto Ashley observa, levanta a arma com as duas mãos e atira; o sangue respinga na parede e, em primeiro plano, o olho esquerdo dela é um buraco ensanguentado, a cabeça jogada para trás, a boca escancarada.
film.death_act7_1_emily_shotbymike_ja=Em uma sala escura iluminada por monitores de segurança, Mike se vira e vem em direção a ela com uma arma enquanto Ashley observa, e levanta a arma com as duas mãos. No momento do tiro, a imagem corta para um mapa em um quadro de cortiça (BLACKWOOD PINES MOUNTAINS), que é respingado de sangue; depois, no escuro, as pernas dela, de botas, deslizam até o chão.
film.death_act7_3_ashley_trapdoor_opened=Ela abre um alçapão no chão; um wendigo salta para fora, se ergue sobre ela, que está ajoelhada, e prende a cabeça dela entre as mãos compridas. Depois, em um chão de terra vazio, a mão inerte dela entra em cena caindo, e a cabeça decepada tomba e rola até parar, com os olhos e a boca abertos.
film.death_act7_3_ashley_trapdoor_opened_ja=Ela abre um alçapão no chão; um wendigo salta para fora, se ergue sobre ela, que está ajoelhada, e prende a cabeça dela entre as mãos compridas. Depois só se vê uma passagem de caverna vazia e escura.
film.death_act7_3_ashley_trapdoor_unbolted=Ela está a poucos passos de um alçapão aberto; um wendigo sai de dentro e força a cabeça dela para baixo enquanto ela grita. Depois, em um chão de terra vazio, a mão inerte dela entra em cena caindo, e a cabeça decepada tomba e rola até parar, com os olhos e a boca abertos.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Ela está a poucos passos de um alçapão aberto; um wendigo sai de dentro e força a cabeça dela para baixo enquanto ela grita. Depois só se vê uma galeria de mina vazia e na penumbra.
film.death_act7_3_chris_trapdoor1=Ele abre um alçapão; um wendigo salta para fora, se ergue sobre ele, que está ajoelhado, e torce a cabeça dele com as mãos compridas. Depois a cabeça decepada cai no chão e fica em pé, virada para o espectador: os óculos tortos e trincados, a boca aberta.
film.death_act7_3_chris_trapdoor1_ja=Ele abre um alçapão; um wendigo salta para fora, se ergue sobre ele, que está ajoelhado, e agarra a cabeça dele. Depois só se veem vigas de madeira escuras lá no alto.
film.death_act7_3_chris_trapdoor2=Enquanto ele olha para baixo, para um alçapão fechado, um wendigo cai na frente dele, salta sobre ele e o prende de costas no chão. Com as garras, rasga a garganta dele; o sangue jorra, e o wendigo ergue a cabeça decepada virada para o espectador, de boca aberta.
film.death_act7_3_chris_trapdoor2_ja=Enquanto ele olha para baixo, para um alçapão fechado, um wendigo cai na frente dele, salta sobre ele e o prende de costas no chão. Depois só se veem vigas de madeira escuras lá no alto.
film.death_act7_3_chris_tunnel1=Em um túnel de mina escorado com madeira, as pernas dele chutam o ar, o resto do corpo fora de cena, no alto, enquanto jorros de sangue escorrem. Depois, diante de tábuas respingadas de sangue, o corpo sem cabeça dele cai no chão.
film.death_act7_3_chris_tunnel1_ja=Em um túnel de mina escorado com madeira, as pernas dele chutam o ar, o resto do corpo fora de cena, no alto, enquanto jorros de sangue escorrem. Depois, diante de tábuas respingadas de sangue, o corpo dele cai no chão; só se veem as pernas e as costas, e uma mão se contrai.
film.death_act8_4_josh_wendigo=Um wendigo irrompe da água escura e prende a cabeça dele com as duas mãos compridas. Ele grita enquanto os dedos afundam em seu crânio; o wendigo aperta até o sangue esguichar e respingar por toda a imagem.
film.death_act8_4_josh_wendigo_ja=Um wendigo irrompe da água escura e prende a cabeça dele com as duas mãos compridas. Ele grita enquanto os dedos afundam em seu crânio; quando o wendigo aperta, a imagem se ergue, afastando-se deles, e gotas escuras respingam sobre ela.
film.death_act8_5_jessica_keepstill_timeout1=Em primeiro plano: ela está deitada de costas, gritando, enquanto um wendigo segura a cabeça dela e enfia os dedos com garras em sua boca; ele arranca a mandíbula inferior dela, com a bocarra cheia de presas rente ao rosto imóvel dela. Depois ela jaz inerte à luz do fogo, sem a mandíbula inferior.
film.death_act8_5_jessica_keepstill_timeout1_ja=Imagem quase preta: a câmera passa lentamente ao longo de um corpo caído imóvel no chão; depois, bem perto, as costelas e a cabeça de um wendigo surgem da escuridão.
film.death_act8_5_jessica_keepstill_timeout2=Em primeiro plano, sob a neve que cai: ela está deitada de costas, gritando, enquanto um wendigo segura a cabeça dela e enfia os dedos com garras em sua boca; ele arranca a mandíbula inferior dela e aproxima do rosto dela a cara ensanguentada e cheia de dentes. Depois ela jaz inerte na neve à luz do fogo, sem a mandíbula inferior.
film.death_act8_5_jessica_keepstill_timeout2_ja=Noite, entre rochas nevadas: em primeiro plano, os membros longos e com garras de um wendigo passam por cima da silhueta escura de alguém; depois a câmera desliza lentamente sobre rochas vazias, cobertas de neve.
film.death_act8_5_jessica_leftbehind=Em um túnel escorado com madeira, ela corre com um lampião; um wendigo salta nas costas dela e a derruba. Em primeiro plano, ele segura a cabeça dela, enfia os dedos com garras em sua boca aberta num grito e arranca a mandíbula inferior dela; depois ela jaz inerte à luz do fogo, sem a mandíbula inferior, enquanto a cabeça cheia de dentes do wendigo passa num relance acima dela.
film.death_act8_5_jessica_leftbehind_ja=Imagem quase preta: a câmera passa lentamente ao longo de um corpo caído imóvel no chão; depois um wendigo ossudo rasteja de quatro na escuridão.
film.death_act8_5_jessica_timeout2=Em primeiro plano: ela está deitada de costas, gritando; um wendigo segura o alto da cabeça dela com uma das garras e enfia os dedos da outra mão em sua boca.
film.death_act8_5_jessica_timeout2_ja=Imagem quase preta: a câmera passa lentamente ao longo de um corpo caído imóvel no chão.
film.death_act8_5_matt_gate=Sob a neve que cai, um wendigo está agachado acima do vão iluminado de uma porta em uma parede de madeira e então salta sobre ele. Agachado sobre ele, se ergue com os braços levantados e esmaga o rosto dele; em primeiro plano, o rosto dele, esmagado e ensanguentado, na neve.
film.death_act8_5_matt_gate_ja=Sob a neve que cai, um wendigo está agachado acima do vão iluminado de uma porta em uma parede de madeira e então salta sobre ele. Ele está deitado de costas e as garras se estendem para o rosto dele; depois a câmera se detém no peito dele, com a letra M na jaqueta, enquanto ele jaz imóvel.
film.death_act8_5_matt_keepstill_timeout1=Em um túnel escorado com madeira, ele segura um lampião; um wendigo salta sobre ele e o derruba. Agachado sobre ele, se ergue com os braços levantados e esmaga o rosto dele; em primeiro plano, o rosto dele, esmagado e ensanguentado.
film.death_act8_5_matt_keepstill_timeout1_ja=Em um túnel escorado com madeira, ele segura um lampião; um wendigo salta sobre ele e o derruba. O wendigo está agachado sobre ele, com as garras estendidas para o rosto dele; depois a câmera se detém no peito dele, com a letra M na jaqueta, enquanto ele jaz imóvel.
film.death_act8_5_matt_keepstill_timeout2=Sob a neve que cai, um wendigo está agachado sobre ele enquanto ele levanta as mãos; o wendigo se ergue e esmaga o rosto dele. Em primeiro plano, o rosto dele, esmagado e ensanguentado.
film.death_act8_5_matt_keepstill_timeout2_ja=Sob a neve que cai, um wendigo rasteja por cima dele enquanto ele levanta uma das mãos; depois a câmera se detém no peito dele, com a letra M na jaqueta, e ele jaz imóvel.
film.death_act8_5_matt_timeout1=Um wendigo desce por vigas de madeira, se lança sobre ele e o derruba no chão. Agachado sobre ele enquanto ele levanta uma das mãos, o wendigo se ergue e esmaga o rosto dele; em primeiro plano, o rosto dele, esmagado e ensanguentado.
film.death_act8_5_matt_timeout1_ja=Um wendigo desce por vigas de madeira, se lança sobre ele e o derruba no chão. O wendigo está agachado sobre ele, mostrando os dentes; depois a câmera se detém no peito dele, com a letra M na jaqueta, enquanto ele jaz imóvel.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=No chalé, entre móveis cobertos com lençóis, um wendigo salta do chão para a parede enquanto uma névoa amarelada enche o cômodo. Uma explosão de fogo a arremessa de bruços pelo chão; ela jaz imóvel enquanto as chamas ardem com fúria atrás dela.
film.death_act8_6_ashley_eyegauge=Um wendigo com uma tatuagem de borboleta no ombro avança sobre ela e agarra a cabeça dela. Enfia os polegares em seus olhos, com o sangue escorrendo pelo rosto dela, e depois os tira das órbitas ensanguentadas enquanto ela jaz em um piso de madeira.
film.death_act8_6_emily_explosion=Em meio a labaredas que explodem, um wendigo rosna atrás de postes de madeira. A explosão a arremessa por um piso de madeira; ela jaz de bruços, com o rosto gravemente queimado.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=No chalé, um wendigo ruge em direção ao espectador e depois grita na cara dele, que está encostado em uma parede. Agarra a cabeça dele, rasga a barriga dele com as garras e o arremessa para o outro lado do cômodo; ele desaba ao pé de um pilar de madeira.
film.death_act8_6_mike_lightbulb_ja=No chalé, um wendigo grita em direção ao espectador. Agarra a cabeça dele enquanto ele empurra o peito do wendigo, grita na cara dele e o joga para o lado; depois, visto de costas, abre bem os braços compridos.
film.death_act8_6_mike_explosion_unijured=No chalé, uma bola de fogo irrompe por um cômodo de móveis cobertos com lençóis e varre o saguão, despedaçando um vaso. Depois ele jaz no chão em meio às chamas, com o rosto gravemente queimado.
film.death_act8_6_sam_wendigo1=No chalé, a mão com garras de um wendigo a mantém erguida pela garganta; ela arqueja, com sangue escorrendo da boca, a lanterna na testa acesa. O wendigo atravessa a barriga dela duas vezes com o outro braço e a solta; ela cai no chão e fica imóvel.
film.death_act8_6_sam_wendigo1_ja=No chalé, um wendigo a agarra. Visto de baixo, ele a mantém erguida com o braço estendido, uma mancha escura e borrada na borda da imagem, e grita com a cabeça jogada para trás; depois avança em direção ao espectador e foge de quatro.
film.4_3_being_watched_emilymatt_cctv_footage=Em um monitor, uma câmera fixa filma do alto, à noite, um portão de ferro em um muro de pedra coberto de neve: Emily passa por ele, depois Matt, que fecha o portão atrás de si; os dois se afastam, e o portão fica vazio sob a neve que cai.
film.act20_6_cctv_footage=Nos monitores, seis imagens de câmeras: Chris e Ashley estão sentados frente a frente a uma mesinha, sob lâminas de serra penduradas; Chris dispara duas vezes para cima com uma pistola, depois aponta para Ashley por cima da mesa e abaixa a arma. Outras imagens mostram uma mulher de toalha junto a uma banheira iluminada por velas, e duas pessoas com as mãos amarradas acima da cabeça contra uma parede, e depois uma mesa respingada de vermelho.
film.smg_sting.1=Na tela da sala de cinema tremeluz um filme em branco, arranhado, com letras e números embaralhados piscando.
film.smg_sting.2=Imagens de Sam em uma banheira iluminada por velas: ela olha por cima do ombro, sai da banheira e fica de pé enrolada em uma toalha, olhando ao redor.
film.smg_sting.3=Uma enorme lâmina de serra giratória corta Josh, deitado em uma mesa com os braços acima da cabeça; o sangue espirra, ele faz uma careta, o sangue jorra da boca dele, e sangue e pedaços de carne escorrem por baixo da mesa.
film.smg_sting.4=O filme em branco tremeluz de novo.
film.projectorghost_movie=Na parede, imagens antigas e tremeluzentes: Emily, junto a uma lareira, fala para a câmera e depois empurra Ashley por uma porta; Hannah, de óculos, sorri timidamente; duas garotas, depois Ashley, sorriem de orelha a orelha no escuro; Hannah começa a desabotoar a blusa e depois vira a cabeça bruscamente.
film.projectorghost_scare=Um primeiro plano de Hannah, de óculos, sob luz vermelha, sorrindo e falando; de repente, um rosto branco medonho, com órbitas escuras e uma boca escancarada e ensanguentada, surge num lampejo, e a tela fica preta.
film.projector_wendigo=Na parede, um antigo filme em preto e branco: uma enfermeira deixa um paciente sentado em uma cadeira; ele se debate até se soltar, escala a parede e rasteja pelo teto até a escuridão. Ela volta para a cadeira vazia, um braço desce do alto em direção a ela e, depois de um clarão, ela some; uma figura pálida avança contra a câmera, e a imagem tomba para o lado.
film.hannah_wendigo_reveal=Um clarão em sépia: um braço com uma tatuagem de borboleta preta e, depois, Hannah, de óculos, com as mãos no peito, sorrindo levemente para a câmera.
film.newghosty_up=Na televisão, um rosto pálido e macabro grita, com a boca escancarada; por um instante, ele tremeluz e vira o rosto pálido de uma mulher com olheiras escuras.
film.sam_end_credits.1=Através de uma janela, um quarto escuro, à noite. Um celular acende com um alarme, 06:00 AM, Work Alarm, com um papel de parede de Sam abraçando um cachorro, ao lado de frascos de comprimidos e de um livro, CREATURE MYTHS OF THE GREAT PLAINS. Sam está deitada na cama sob um ventilador de teto girando; seus olhos se arregalam.
film.sam_end_credits.2=Um frasco de comprimidos cai e rola para perto de outro livro, THE WENDIGO LOG. Sam se senta na beira da cama e desliga o alarme deslizando o dedo; o polegar dela borra a tela de sangue, e o sangue escorre pelo antebraço.
film.sam_end_credits.3=Ela pressiona um lenço de papel sobre um corte irregular no antebraço, mas ele volta a sangrar. Uma luz vermelha se espalha sobre ela; ela se vira, de olhos arregalados.
film.sam_end_credits.4=Escuridão e, depois, o título: UNTIL DAWN.
film.totem_events_of_the_past.1=Uma velha foto em sépia de um homem de casaco comprido e lenço no pescoço, ao lado de um bilhete: NO ESCAPE. Esboços de uma criatura peluda com presas e de uma mão com garras; manchetes: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED e LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Uma foto de mineiros sob a manchete MIRACLE MINERAL DISCOVERED; RADIUM; depois MINING DISASTER e DEATH TOLL RISES, e uma foto de mineiros rabiscada de preto.
film.totem_events_of_the_past.3=Lampejos de imagens sangrentas: dentes e gengivas ensanguentados, um crânio rachado, um rosto coberto de sangue com um olho injetado, larvas sobre carne crua. HUNGER CRAVING rabiscado em uma parede; uma radiografia com a inscrição HUMAN?
film.totem_events_of_the_past.4=Uma lista escrita à mão: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Uma foto escura de uma figura pálida e curvada, circulada em vermelho: CREATURE REPORTED. Esboços de uma criatura com presas, TEETH GROW & SHARPEN WITH AGE, e de uma figura esquálida, de membros compridos. THE ONLY WAY, uma seta para FIRE, circulado; a página queima.
film.totem_events_of_the_past.5=Noite: uma casa de madeira iluminada entre pinheiros nevados. Beth, de gorro e suéter cinza, e Hannah, de óculos e jaqueta acolchoada rosa, correm aterrorizadas pela floresta, de mãos dadas, até o alto de um penhasco envolto em névoa.
film.totem_events_of_the_past.6=Junto a uma cerca de corda, ao lado de uma placa quebrada, CLIFF, elas olham para trás aterrorizadas; uma visão térmica laranja as mostra como formas de um branco luminoso entre as árvores. De mãos dadas na beira, Hannah escorrega; Beth a agarra, e as duas caem.
film.totem_events_of_the_past.7=Um homem com tanques nas costas corre até a beira do penhasco enquanto uma criatura esquálida, de membros compridos, rasteja em sua direção; primeiros planos de seus óculos de proteção e da boca escancarada e cheia de presas da criatura. Ele a cobre de fogo com o lança-chamas; ela queima, debatendo-se na neve, e uma bola de fogo cresce até tomar a tela.
film.causaleffect_act1_3_samattackedbycrow=Junto a uma cerca de arame, um corvo dá um rasante sobre Sam; ela se abaixa, levando as mãos ao rosto.
film.causaleffect_act2_1_mattlooksthroughtelescope=Através de um telescópio: em uma encosta nevada, Mike abraça com força alguém de casaco com borda de pele.
film.causaleffect_act2_2_minetunnel=No escuro, entre vigas de madeira cruzadas, Mike entra em cena inclinando-se e olha ao redor, com alguém borrado atrás dele.
film.causaleffect_act2_4_samfindsbaseballbat=Em um cômodo escuro, Sam brande um taco de beisebol, sorrindo; depois Josh, iluminado por uma lanterna, segura um taco e sorri de orelha a orelha.
film.causaleffect_act2_5_jessthroughwindow_pants=Junto a uma janela, no escuro, uma mão comprida e ossuda agarra pela cabeça Jessica, que grita, e a puxa com um tranco para fora de cena.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Através de um telescópio: rochas nevadas sob um paredão rochoso; depois, quase no escuro, um rosto esquálido e enrugado, de olhos brilhantes, ocupa toda a imagem.
film.causaleffect_act3_2_bridgefail=À noite, Mike corre para uma pequena ponte de corda coberta de neve; uma tábua se parte sob seus pés e ele despenca, sumindo de vista.
film.causaleffect_act3_2_clifffail=Em uma encosta nevada, Mike, erguendo um lampião, escorrega e rola pelas pedras abaixo, dando cambalhotas.
film.causaleffect_act3_2_cliffsafe=Em uma encosta rochosa, Mike, com um lampião na mão, desce com cuidado pelas pedras.
film.causaleffect_act3_2_grabfencefail=Vista de cima: Mike estende a mão para uma cerca de arame em uma encosta nevada, escorrega e cai de costas na neve lá embaixo.
film.causaleffect_act3_2_grabrootfail=Vista de cima: Mike se agarra a uma raiz grossa em uma encosta nevada, escorrega e cai de costas na neve lá embaixo.
film.causaleffect_act3_2_jumpclifffail=À noite, Mike, com um lampião na mão, pula para dentro de uma ravina rochosa, cai pesadamente e segue escalando.
film.causaleffect_act3_2_mikefallsover=Mike, com um lampião na mão, desce correndo uma encosta nevada e arborizada, tropeça e cai de cara no chão.
film.causaleffect_act3_2_mikeisfast=Mike, com um lampião na mão, corre a toda velocidade por uma ravina nevada entre rochas, direto na direção do espectador.
film.causaleffect_act3_2_pipefail=Mike, com um lampião erguido bem alto, avança equilibrando-se sobre um cano grosso coberto de neve, escorrega e despenca na correnteza.
film.causaleffect_act3_2_shimmy=Vista de cima: Mike desce entre rochas escuras; depois avança de lado por um paredão íngreme, segurando-se nele com uma das mãos.
film.causaleffect_act3_2_takestairs=Mike, com um lampião na mão, chega correndo a uma cabana de madeira e sobe às pressas os degraus nevados até a porta.
film.causaleffect_act3_2_wendigointower_fast=Através de uma mira telescópica: vigas de madeira cruzadas na neve; algo pequeno e cinza se ergue e entra em cena ao lado da cruz da mira.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=No escuro, a chama de um isqueiro ilumina tábuas toscas; por uma fresta entre elas, um par de olhos arregalados e vidrados olha fixamente para fora.
film.causaleffect_act4_1_chrissavesash=Através de uma tela de arame, alguém está sentado sob uma lâmpada pendurada; depois, uma enorme lâmina de serra dentada e, ao lado dela, na sombra, um homem de camisa xadrez.
film.causaleffect_act4_2_mikebefriendswolf=Mike se agacha ao lado de um lobo peludo e acaricia seu pelo.
film.causaleffect_act4_2_mikekickswolf=No vão de uma porta, Mike dá um chute em um lobo; depois, todo sujo, com o lampião erguido, levanta a outra mão, fazendo uma careta.
film.causaleffect_act4_2_mikelooksatswolf=Mike ergue a mão aberta diante de um lobo; o lobo abaixa a cabeça e se vira, depois passa bem perto, na frente dele.
film.causaleffect_act4_2_mikestillhasmachete=Mãos junto às mandíbulas de uma armadilha de metal; Mike joga a cabeça para trás de dor. Depois, em uma sala azulejada, ele pega um facão.
film.causaleffect_act4_2_wendigoheadinajar=Uma cabeça pálida e manchada, de olhos minúsculos e brilhantes, em um grande pote de vidro.
film.causaleffect_act5_2_emgivesflaretomatt=Em uma cabana de madeira, Emily entrega uma pistola sinalizadora a Matt; ele a pega e olha para ela.
film.causaleffect_act5_3_chrisshotashley=Em uma mesinha de madeira, Chris, de óculos, aponta uma pistola para Ashley, que chora.
film.causaleffect_act7_3_ashley_trapdoor=Vista de cima: uma mão com um anel e uma munhequeira de tricô puxa o ferrolho de um alçapão de madeira e agarra a alça.
film.intro_busride.1=Escuridão e, depois, o título: UNTIL DAWN.
film.intro_busride.2=Créditos iniciais sobre primeiros planos sombrios de objetos, nos quais se vislumbram rostos: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Sobre um cavalinho de balanço e um rádio antigo: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=Ao pôr do sol, vista de cima: um ônibus sobe serpenteando uma estrada de montanha coberta de neve, entre os pinheiros.
film.intro_busride.5=No ônibus, Sam está sentada junto à janela; no celular dela: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=O celular dela exibe um vídeo: Josh, de camisa xadrez, fala para a câmera em um cômodo escuro.
