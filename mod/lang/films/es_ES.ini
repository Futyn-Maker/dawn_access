; Dawn Access film descriptions — Spanish. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Noche, al borde de un precipicio: Hannah, con gafas y chaqueta rosa, se agarra a Beth, con gorro y jersey grises. Hannah tropieza hacia atrás y cae por el borde, arrastrando a Beth consigo; abajo, Beth se estrella de espaldas contra un peñasco y la sangre salpica.
film.death_act1_1_sisters_cliff.1=Abajo yace Hannah, con la cara ensangrentada y los ojos abiertos, y detrás de ella el cuerpo ensangrentado de Beth.
film.death_act1_1_sisters_cliff_alone=Noche, en una pared rocosa: la mano de Hannah se escapa de la de Beth y Hannah cae rodando por las rocas. Beth intenta alcanzar una mano enguantada que una figura oscura le tiende desde arriba, pero cae y se estrella contra unos peñascos nevados; abajo, Hannah yace ensangrentada, con los ojos abiertos, mientras Beth cae detrás de ella.
film.death_act3_2_jessica_liftshaft=Mike, con un farol en alto, mira hacia arriba por un pozo; el cuerpo de ella cae ante él sobre el suelo enrejado de la jaula de un ascensor, con la mandíbula inferior arrancada. Él se queda mirándola, alarga la mano hacia ella y la jaula se precipita entre una lluvia de chispas.
film.death_act5_2_matt_climb=Retrocediendo ante una manada de ciervos con cornamenta en un bosque neblinoso, da un paso en el vacío desde un borde rocoso y cae a la oscuridad. Yace boca abajo sobre una roca, con un charco de sangre bajo la boca; en primer plano, su ojo abierto brilla bañado en lágrimas.
film.death_act5_2_matt_wendigo=Primer plano de sus ojos asustados en la oscuridad. Un Wendigo lo agarra por detrás y lo clava en un gancho que cuelga entre cadenas; el gancho le atraviesa la mandíbula de abajo arriba y le sale por la boca, y él queda colgado, con la cara cubierta de sangre.
film.death_act6_3_emily_eyegauge=Un Wendigo le agarra la cabeza y le hunde los pulgares en los ojos; ella grita mientras la sangre le corre por la cara, y luego cuelga inerte entre sus garras.
film.death_act6_3_emily_oregrinder=Se desliza por un canal nevado hasta la tolva de una trituradora y se aferra al borde; los dedos le resbalan y cae entre rodillos con púas, gritando, con la sangre saliéndole a borbotones de la boca, hasta que la cabeza se le desploma hacia atrás.
film.death_act6_4_chris_lodgedoor=Dentro, Ashley levanta la vista y da un paso al frente. Fuera, en la oscuridad, un Wendigo lo agarra por detrás, con las garras sobre su cara, y le arranca la cabeza; la cabeza queda en la nieve junto a su cuerpo.
film.death_act6_4_chris_lodgedoor_ja=Ashley, vista a través de los cristales de una puerta, mira hacia fuera y da un paso al frente. Fuera, un Wendigo lo agarra por detrás, con las garras sobre su cara, y lo arrastra hacia abajo, fuera del encuadre; gruñe a la cámara y se aleja, y solo queda el bosque oscuro.
film.death_act6_4_chris_runtolodge_ashimpassive=En la oscuridad, sobre la nieve, un Wendigo lo inmoviliza y le arranca la cabeza; la cabeza cae en el porche nevado, a los pies de Ashley. Ashley, salpicada de sangre, está de pie mirando hacia abajo, con una mueca.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Desde el suelo, en un bosque oscuro: un Wendigo está agazapado sobre él, levanta la cabeza, con un destello en los ojos, y se aleja. Primer plano de Ashley, salpicada de sangre y a punto de llorar, con una mueca; luego está de pie mirando hacia abajo.
film.death_act6_4_chris_runtolodge_ashscreams=En la oscuridad, sobre la nieve, un Wendigo lo inmoviliza y le arranca la cabeza; la cabeza sale volando y rueda por la nieve hasta detenerse ante una puerta acristalada. Tras el cristal, Ashley se lleva las manos a la boca y cae de rodillas, llorando.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Desde el suelo, en un bosque oscuro: un Wendigo está agazapado sobre él, levanta la cabeza, con un destello en los ojos, y se aleja. Tras los cristales de una puerta, Ashley se acerca, se lleva las manos a la boca y cae de rodillas, llorando, mientras detrás de ella aparece un hombre.
film.death_act7_1_emily_shotbymike=En una sala oscura iluminada por monitores de vigilancia, Mike se da la vuelta y va hacia ella con una pistola mientras Ashley mira, la levanta con ambas manos y dispara; la sangre salpica la pared y, en primer plano, el ojo izquierdo de ella es un agujero ensangrentado, con la cabeza echada hacia atrás y la boca abierta de par en par.
film.death_act7_1_emily_shotbymike_ja=En una sala oscura iluminada por monitores de vigilancia, Mike se da la vuelta y va hacia ella con una pistola mientras Ashley mira, y la levanta con ambas manos. En el momento del disparo, la imagen pasa a un mapa en un tablero de corcho (BLACKWOOD PINES MOUNTAINS), que queda salpicado de sangre; luego, en la oscuridad, las piernas de ella, con botas, se deslizan hasta el suelo.
film.death_act7_3_ashley_trapdoor_opened=Abre una trampilla en el suelo; un Wendigo sale de un salto, se alza sobre ella, que está arrodillada, y le atenaza la cabeza con sus largas manos. Luego, sobre un suelo de tierra vacío, su mano inerte entra en el encuadre al caer, y su cabeza arrancada cae y rueda hasta detenerse, con los ojos y la boca abiertos.
film.death_act7_3_ashley_trapdoor_opened_ja=Abre una trampilla en el suelo; un Wendigo sale de un salto, se alza sobre ella, que está arrodillada, y le atenaza la cabeza con sus largas manos. Luego solo se ve un pasadizo de cueva vacío y oscuro.
film.death_act7_3_ashley_trapdoor_unbolted=Está a unos pasos de una trampilla abierta; un Wendigo sale trepando y le empuja la cabeza hacia el suelo mientras ella grita. Luego, sobre un suelo de tierra vacío, su mano inerte entra en el encuadre al caer, y su cabeza arrancada cae y rueda hasta detenerse, con los ojos y la boca abiertos.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Está a unos pasos de una trampilla abierta; un Wendigo sale trepando y le empuja la cabeza hacia el suelo mientras ella grita. Luego solo se ve una galería de mina vacía y en penumbra.
film.death_act7_3_chris_trapdoor1=Abre una trampilla; un Wendigo sale de un salto, se alza sobre él, que está arrodillado, y le retuerce la cabeza con sus largas manos. Luego su cabeza arrancada cae al suelo y se queda derecha, de cara al espectador: las gafas torcidas y rajadas, la boca abierta.
film.death_act7_3_chris_trapdoor1_ja=Abre una trampilla; un Wendigo sale de un salto, se alza sobre él, que está arrodillado, y le agarra la cabeza. Luego solo se ven unas oscuras vigas de madera en lo alto.
film.death_act7_3_chris_trapdoor2=Mientras baja la vista hacia una trampilla cerrada, un Wendigo se deja caer delante de él, se abalanza y lo inmoviliza boca arriba. Le abre la garganta con las garras; la sangre brota a chorros y el Wendigo levanta la cabeza arrancada de cara al espectador, con la boca abierta.
film.death_act7_3_chris_trapdoor2_ja=Mientras baja la vista hacia una trampilla cerrada, un Wendigo se deja caer delante de él, se abalanza y lo inmoviliza boca arriba. Luego solo se ven unas oscuras vigas de madera en lo alto.
film.death_act7_3_chris_tunnel1=En un túnel de mina apuntalado con madera, sus piernas patalean en el aire, con el resto del cuerpo fuera del encuadre, arriba, mientras caen chorros de sangre. Luego, ante unas tablas salpicadas de sangre, su cuerpo sin cabeza cae al suelo.
film.death_act7_3_chris_tunnel1_ja=En un túnel de mina apuntalado con madera, sus piernas patalean en el aire, con el resto del cuerpo fuera del encuadre, arriba, mientras caen chorros de sangre. Luego, ante unas tablas salpicadas de sangre, su cuerpo cae al suelo; solo se ven sus piernas y su espalda, y una mano se contrae.
film.death_act8_4_josh_wendigo=Un Wendigo surge de golpe del agua oscura y le atenaza la cabeza con sus dos largas manos. Él grita mientras los dedos se le hunden en el cráneo; el Wendigo aprieta hasta que la sangre revienta y salpica la imagen.
film.death_act8_4_josh_wendigo_ja=Un Wendigo surge de golpe del agua oscura y le atenaza la cabeza con sus dos largas manos. Él grita mientras los dedos se le hunden en el cráneo; cuando el Wendigo aprieta, la imagen se eleva alejándose de ellos y unas gotas oscuras la salpican.
film.death_act8_5_jessica_keepstill_timeout1=Primer plano: ella yace boca arriba, gritando, mientras un Wendigo le sujeta la cabeza y le mete a la fuerza en la boca sus dedos con garras; le arranca la mandíbula inferior, con sus fauces llenas de colmillos junto a la cara inmóvil de ella. Luego yace inerte a la luz del fuego, sin la mandíbula inferior.
film.death_act8_5_jessica_keepstill_timeout1_ja=Imagen casi negra: la cámara recorre lentamente un cuerpo tendido inmóvil en el suelo; luego, muy cerca, las costillas y la cabeza de un Wendigo surgen de la oscuridad.
film.death_act8_5_jessica_keepstill_timeout2=Primer plano, bajo la nieve que cae: ella yace boca arriba, gritando, mientras un Wendigo le sujeta la cabeza y le mete a la fuerza en la boca sus dedos con garras; le arranca la mandíbula inferior y acerca su cara ensangrentada y llena de dientes a la de ella. Luego yace inerte en la nieve a la luz del fuego, sin la mandíbula inferior.
film.death_act8_5_jessica_keepstill_timeout2_ja=Noche, entre rocas nevadas: en primer plano, las largas extremidades con garras de un Wendigo pasan por encima de la silueta oscura de alguien; luego la cámara se desliza lentamente sobre rocas vacías cubiertas de nieve.
film.death_act8_5_jessica_leftbehind=En un túnel apuntalado con madera, ella corre con un farol; un Wendigo le salta a la espalda y la derriba. En primer plano, le sujeta la cabeza, le mete a la fuerza sus dedos con garras en la boca abierta en un grito y le arranca la mandíbula inferior; luego yace inerte a la luz del fuego, sin la mandíbula inferior, mientras la cabeza llena de dientes del Wendigo pasa como un rayo sobre ella.
film.death_act8_5_jessica_leftbehind_ja=Imagen casi negra: la cámara recorre lentamente un cuerpo tendido inmóvil en el suelo; luego un Wendigo huesudo avanza a cuatro patas por la oscuridad.
film.death_act8_5_jessica_timeout2=Primer plano: ella yace boca arriba, gritando; un Wendigo le sujeta la coronilla con una zarpa y le mete a la fuerza en la boca los dedos de la otra.
film.death_act8_5_jessica_timeout2_ja=Imagen casi negra: la cámara recorre lentamente un cuerpo tendido inmóvil en el suelo.
film.death_act8_5_matt_gate=Bajo la nieve que cae, un Wendigo está agazapado sobre el vano iluminado de una puerta en una pared de madera y luego salta sobre él. Agazapado encima de él, se yergue con los brazos en alto y le destroza la cara; en primer plano, su cara aplastada y ensangrentada sobre la nieve.
film.death_act8_5_matt_gate_ja=Bajo la nieve que cae, un Wendigo está agazapado sobre el vano iluminado de una puerta en una pared de madera y luego salta sobre él. Él yace boca arriba y las garras se acercan a su cara; luego la cámara se detiene en su pecho, con la letra M en la chaqueta, mientras yace inmóvil.
film.death_act8_5_matt_keepstill_timeout1=En un túnel apuntalado con madera, él sostiene un farol; un Wendigo se abalanza sobre él y lo derriba. Agazapado encima de él, se yergue con los brazos en alto y le destroza la cara; en primer plano, su cara aplastada y ensangrentada.
film.death_act8_5_matt_keepstill_timeout1_ja=En un túnel apuntalado con madera, él sostiene un farol; un Wendigo se abalanza sobre él y lo derriba. El Wendigo está agazapado encima de él, con las garras tendidas hacia su cara; luego la cámara se detiene en su pecho, con la letra M en la chaqueta, mientras yace inmóvil.
film.death_act8_5_matt_keepstill_timeout2=Bajo la nieve que cae, un Wendigo está agazapado encima de él mientras él levanta las manos; el Wendigo se yergue y le destroza la cara. En primer plano, su cara aplastada y ensangrentada.
film.death_act8_5_matt_keepstill_timeout2_ja=Bajo la nieve que cae, un Wendigo se arrastra sobre él mientras él levanta una mano; luego la cámara se detiene en su pecho, con la letra M en la chaqueta, y él yace inmóvil.
film.death_act8_5_matt_timeout1=Un Wendigo baja por unas vigas de madera, se lanza sobre él y lo derriba al suelo. Agazapado encima de él mientras él levanta una mano, se yergue y le destroza la cara; en primer plano, su cara aplastada y ensangrentada.
film.death_act8_5_matt_timeout1_ja=Un Wendigo baja por unas vigas de madera, se lanza sobre él y lo derriba al suelo. El Wendigo está agazapado encima de él, enseñando los dientes; luego la cámara se detiene en su pecho, con la letra M en la chaqueta, mientras yace inmóvil.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=En el refugio, entre muebles cubiertos con sábanas, un Wendigo salta del suelo a la pared mientras una neblina amarillenta llena la habitación. Una explosión de fuego la lanza boca abajo por el suelo; ella yace inmóvil mientras las llamas arden con furia detrás de ella.
film.death_act8_6_ashley_eyegauge=Un Wendigo con un tatuaje de mariposa en el hombro se abalanza sobre ella y le agarra la cabeza. Le hunde los pulgares en los ojos, con la sangre corriéndole por la cara, y luego los saca de las cuencas ensangrentadas mientras ella yace sobre un suelo de madera.
film.death_act8_6_emily_explosion=En medio de un estallido de llamas, un Wendigo gruñe detrás de unos postes de madera. La explosión la lanza por un suelo de madera; ella yace boca abajo, con la cara gravemente quemada.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=En el refugio, un Wendigo ruge hacia el espectador y luego le grita a la cara mientras él está contra una pared. Lo agarra por la cabeza, le raja el vientre de un zarpazo y lo lanza al otro lado de la habitación; él cae al pie de una columna de madera.
film.death_act8_6_mike_lightbulb_ja=En el refugio, un Wendigo grita hacia el espectador. Lo agarra por la cabeza mientras él le empuja el pecho, le grita a la cara y lo arroja a un lado; luego, visto de espaldas, abre de par en par sus largos brazos.
film.death_act8_6_mike_explosion_unijured=En el refugio, una bola de fuego irrumpe en una habitación de muebles cubiertos con sábanas y barre el vestíbulo, haciendo añicos un jarrón. Luego él yace en el suelo entre las llamas, con la cara gravemente quemada.
film.death_act8_6_sam_wendigo1=En el refugio, la mano con garras de un Wendigo la sostiene en alto por la garganta; ella boquea, con sangre cayéndole de la boca y la linterna de la frente encendida. El Wendigo le atraviesa dos veces el vientre con el otro brazo y la suelta; ella cae al suelo y queda inmóvil.
film.death_act8_6_sam_wendigo1_ja=En el refugio, un Wendigo la agarra. Visto desde abajo, la sostiene en alto con el brazo extendido, una mancha oscura y borrosa en el borde de la imagen, y grita con la cabeza echada hacia atrás; luego se lanza hacia el espectador y se escabulle a cuatro patas.
film.4_3_being_watched_emilymatt_cctv_footage=En un monitor, una cámara fija enfoca desde arriba una verja de hierro en un muro de piedra nevado, de noche: Emily la cruza, y luego Matt, que cierra la verja tras de sí; ambos se alejan, y la verja queda vacía bajo la nieve que cae.
film.act20_6_cctv_footage=En los monitores, seis imágenes de cámaras: Chris y Ashley están sentados frente a frente en una mesita bajo hojas de sierra colgantes; Chris dispara dos veces hacia arriba con una pistola, luego apunta a Ashley por encima de la mesa y la baja. Otras imágenes muestran a una mujer en toalla junto a una bañera iluminada con velas, y a dos personas con las manos atadas por encima de la cabeza contra una pared, y después una mesa salpicada de rojo.
film.smg_sting.1=En la pantalla de la sala de cine parpadea una película en blanco, rayada, en la que destellan letras y números revueltos.
film.smg_sting.2=Imágenes de Sam en una bañera iluminada con velas: mira por encima del hombro, sale y se queda de pie envuelta en una toalla, mirando a su alrededor.
film.smg_sting.3=Una enorme hoja de sierra giratoria se hunde en Josh, tendido en una mesa con los brazos por encima de la cabeza; salpica la sangre, él hace una mueca, le brota sangre de la boca, y la sangre y los restos de carne se derraman bajo la mesa.
film.smg_sting.4=La película en blanco vuelve a parpadear.
film.projectorghost_movie=En la pared, viejas imágenes parpadeantes: Emily, junto a una chimenea, habla a la cámara y luego empuja a Ashley por una puerta; Hannah, con gafas, sonríe con timidez; dos chicas, y luego Ashley, sonríen de oreja a oreja desde la oscuridad; Hannah empieza a desabrocharse la blusa y luego aparta bruscamente la cabeza.
film.projectorghost_scare=Un primer plano de Hannah, con gafas, bajo una luz roja, sonriendo y hablando; de pronto aparece en un destello una espantosa cara blanca con cuencas oscuras y una boca abierta y ensangrentada, y la pantalla se queda en negro.
film.projector_wendigo=En la pared, una vieja película en blanco y negro: una enfermera deja a un paciente sentado en una silla; él forcejea hasta soltarse, trepa por la pared y se arrastra por el techo hasta la oscuridad. Ella vuelve a la silla vacía, un brazo baja hacia ella desde arriba y, tras un destello, ella ha desaparecido; una figura pálida se abalanza sobre la cámara y la imagen cae de lado.
film.hannah_wendigo_reveal=Un destello en sepia: un brazo con un tatuaje de una mariposa negra y luego Hannah, con gafas y las manos en el pecho, sonriendo levemente a la cámara.
film.newghosty_up=En el televisor, una cara pálida y espeluznante grita con la boca muy abierta; por un instante, parpadea y se convierte en la cara pálida de una mujer con ojeras oscuras.
film.sam_end_credits.1=A través de una ventana, un dormitorio a oscuras, de noche. Un móvil se ilumina con una alarma, 06:00 AM, Work Alarm, con un fondo de pantalla de Sam abrazando a un perro, junto a frascos de pastillas y un libro, CREATURE MYTHS OF THE GREAT PLAINS. Sam está tumbada en la cama bajo un ventilador de techo que gira; abre los ojos de par en par.
film.sam_end_credits.2=Un frasco de pastillas cae y rueda junto a otro libro, THE WENDIGO LOG. Sam se sienta en el borde de la cama y apaga la alarma deslizando el dedo; el pulgar le deja un rastro de sangre en la pantalla, y la sangre le corre por el antebrazo.
film.sam_end_credits.3=Aprieta un pañuelo de papel contra un corte irregular en el antebrazo, pero vuelve a sangrar. Una luz roja se alza sobre ella; se da la vuelta con los ojos muy abiertos.
film.sam_end_credits.4=Oscuridad y luego el título: UNTIL DAWN.
film.totem_events_of_the_past.1=Una vieja foto en sepia de un hombre con abrigo largo y pañuelo al cuello, junto a una nota: NO ESCAPE. Bocetos de una criatura peluda y con colmillos y de una mano con garras; titulares: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED y LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Una foto de mineros bajo el titular MIRACLE MINERAL DISCOVERED; RADIUM; luego MINING DISASTER y DEATH TOLL RISES, y una foto de mineros tachada con garabatos negros.
film.totem_events_of_the_past.3=Destellos de imágenes sangrientas: dientes y encías ensangrentados, un cráneo agrietado, una cara cubierta de sangre con un ojo inyectado en sangre, gusanos sobre carne cruda. HUNGER CRAVING garabateado en una pared; una radiografía con la inscripción HUMAN?
film.totem_events_of_the_past.4=Una lista manuscrita: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Una foto oscura de una figura pálida y encorvada, encerrada en un círculo rojo: CREATURE REPORTED. Bocetos de una criatura con colmillos, TEETH GROW & SHARPEN WITH AGE, y de una figura demacrada de miembros largos. THE ONLY WAY, una flecha hacia FIRE, encerrado en un círculo; la página arde.
film.totem_events_of_the_past.5=Noche: una casa de madera iluminada entre pinos nevados. Beth, con gorro y jersey grises, y Hannah, con gafas y una chaqueta acolchada rosa, corren aterrorizadas por el bosque, cogidas de la mano, hasta salir a lo alto de un precipicio envuelto en niebla.
film.totem_events_of_the_past.6=Junto a una valla de cuerda, al lado de un letrero roto, CLIFF, miran atrás aterrorizadas; una vista térmica naranja las muestra como formas de un blanco luminoso entre los árboles. Cogidas de la mano al borde, Hannah resbala; Beth la agarra, y las dos caen.
film.totem_events_of_the_past.7=Un hombre con bombonas a la espalda corre hacia el borde del precipicio mientras una criatura demacrada de miembros largos se arrastra hacia él; primeros planos de sus gafas protectoras y de las fauces abiertas y llenas de colmillos de la criatura. La baña en fuego con su lanzallamas; la criatura arde, retorciéndose sobre la nieve, y una bola de fuego crece hasta llenar la pantalla.
