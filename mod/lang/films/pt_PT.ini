; Dawn Access film descriptions — Portuguese. Keyed by the film's name (picture::FilmKeys): the films of the
; dead, said after the character's name in the credits (a cut differing only by clothes or Mike's hand
; falls back to the film's own entry, a censored <film>_ja cut too), and the films played in the world or over the screen; a long
; film is said in parts as it plays (film.<name>.<n>, picture::PartsOf). A value "=key" takes another
; entry's words. Every language file must contain the same keys.
[strings]
film.death_act1_1_sisters_cliff=Noite, à beira de uma falésia: a Hannah, de óculos e casaco cor-de-rosa, agarra-se à Beth, de gorro e camisola cinzentos. A Hannah tropeça para trás e cai da falésia, arrastando a Beth atrás de si; lá em baixo, a Beth embate de costas com força num pedregulho e o sangue espirra.
film.death_act1_1_sisters_cliff.1=Lá em baixo, a Hannah jaz com o rosto ensanguentado e os olhos abertos, com o corpo ensanguentado da Beth atrás dela.
film.death_act1_1_sisters_cliff_alone=Noite, numa parede rochosa: a mão da Hannah escorrega da mão da Beth e ela cai a rebolar pelas rochas abaixo. A Beth estica o braço para uma mão enluvada que uma figura escura lhe estende lá de cima, mas cai e embate com força em pedregulhos cobertos de neve; lá em baixo, a Hannah jaz ensanguentada, de olhos abertos, enquanto a Beth cai atrás dela.
film.death_act3_2_jessica_liftshaft=O Mike, de lampião erguido, olha poço acima; o corpo dela cai à frente dele, no chão gradeado da cabina de um elevador, com o maxilar inferior arrancado. Ele fica a olhar, estende a mão para ela, e a cabina despenha-se numa chuva de faíscas.
film.death_act5_2_matt_climb=A recuar perante uma manada de veados com hastes, numa floresta enevoada, dá um passo em falso numa borda rochosa e cai na escuridão. Jaz de bruços sobre uma rocha, com uma poça de sangue debaixo da boca; em grande plano, o olho aberto brilha de lágrimas.
film.death_act5_2_matt_wendigo=Grande plano dos olhos assustados dele, no escuro. Um Wendigo agarra-o por trás e espeta-o à força num gancho pendurado entre correntes; o gancho atravessa-lhe o maxilar de baixo para cima e sai-lhe pela boca, e ele fica ali pendurado, com o rosto coberto de sangue.
film.death_act6_3_emily_eyegauge=Um Wendigo agarra-lhe a cabeça e enterra-lhe os polegares nos olhos; ela grita enquanto o sangue lhe escorre pela cara e depois fica suspensa, inerte, nas mãos dele.
film.death_act6_3_emily_oregrinder=Desliza por uma calha coberta de neve para dentro da tremonha de um triturador e agarra-se à borda; os dedos escorregam e ela cai entre rolos com espigões, aos gritos, com sangue a jorrar-lhe da boca, até a cabeça lhe tombar para trás.
film.death_act6_4_chris_lodgedoor=Lá dentro, a Ashley levanta os olhos e dá um passo em frente. Lá fora, no escuro, um Wendigo agarra-o por trás, com as garras sobre a cara dele, e arranca-lhe a cabeça; a cabeça fica na neve, ao lado do corpo.
film.death_act6_4_chris_lodgedoor_ja=A Ashley, vista através dos vidros de uma porta, olha para fora e dá um passo em frente. Lá fora, um Wendigo agarra-o por trás, com as garras sobre a cara dele, e puxa-o para baixo, para fora do enquadramento; rosna para a câmara e afasta-se, deixando à vista a floresta escura.
film.death_act6_4_chris_runtolodge_ashimpassive=Na neve, no escuro, um Wendigo prende-o ao chão e arranca-lhe a cabeça; a cabeça cai no alpendre coberto de neve, aos pés da Ashley. A Ashley, salpicada de sangue, está de pé a olhar para baixo, com uma careta.
film.death_act6_4_chris_runtolodge_ashimpassive_ja=Do chão, num bosque escuro: um Wendigo está agachado sobre ele, ergue a cabeça, de olhos a brilhar, e afasta-se. Grande plano da Ashley, salpicada de sangue e à beira das lágrimas, com uma careta; depois, está de pé a olhar para baixo.
film.death_act6_4_chris_runtolodge_ashscreams=Na neve, no escuro, um Wendigo prende-o ao chão e arranca-lhe a cabeça; a cabeça voa pelo ar e rola na neve até parar diante de uma porta envidraçada. Por trás do vidro, a Ashley leva as mãos à boca e deixa-se cair de joelhos, a chorar.
film.death_act6_4_chris_runtolodge_ashscreams_ja=Do chão, num bosque escuro: um Wendigo está agachado sobre ele, ergue a cabeça, de olhos a brilhar, e afasta-se. Por trás dos vidros de uma porta, a Ashley aproxima-se, leva as mãos à boca e deixa-se cair de joelhos, a chorar, enquanto um homem aparece atrás dela.
film.death_act7_1_emily_shotbymike=Numa sala escura iluminada por monitores de vigilância, o Mike vira-se e avança para ela com uma arma, sob o olhar da Ashley, ergue-a com as duas mãos e dispara; o sangue salpica a parede e, em grande plano, o olho esquerdo dela é um buraco ensanguentado, com a cabeça atirada para trás e a boca escancarada.
film.death_act7_1_emily_shotbymike_ja=Numa sala escura iluminada por monitores de vigilância, o Mike vira-se e avança para ela com uma arma, sob o olhar da Ashley, e ergue-a com as duas mãos. No momento do disparo, a imagem passa para um mapa num quadro de cortiça (BLACKWOOD PINES MOUNTAINS), que fica salpicado de sangue; depois, no escuro, as pernas dela, de botas, deslizam até ao chão.
film.death_act7_3_ashley_trapdoor_opened=Abre um alçapão no chão; um Wendigo salta lá de dentro, ergue-se sobre ela, que está de joelhos, e aperta-lhe a cabeça entre as mãos compridas. Depois, num chão de terra vazio, a mão inerte dela tomba no enquadramento, e a cabeça decepada cai e rola até parar, de olhos e boca abertos.
film.death_act7_3_ashley_trapdoor_opened_ja=Abre um alçapão no chão; um Wendigo salta lá de dentro, ergue-se sobre ela, que está de joelhos, e aperta-lhe a cabeça entre as mãos compridas. Depois, vê-se apenas uma passagem de gruta vazia e escura.
film.death_act7_3_ashley_trapdoor_unbolted=Está de pé, a poucos passos de um alçapão aberto; um Wendigo sai de lá, agarra-a pela cabeça e força-a a baixar-se, enquanto ela grita. Depois, num chão de terra vazio, a mão inerte dela tomba no enquadramento, e a cabeça decepada cai e rola até parar, de olhos e boca abertos.
film.death_act7_3_ashley_trapdoor_unbolted_ja=Está de pé, a poucos passos de um alçapão aberto; um Wendigo sai de lá, agarra-a pela cabeça e força-a a baixar-se, enquanto ela grita. Depois, vê-se apenas uma galeria de mina vazia e mal iluminada.
film.death_act7_3_chris_trapdoor1=Abre um alçapão; um Wendigo salta lá de dentro, ergue-se sobre ele, que está de joelhos, e torce-lhe a cabeça com as mãos compridas. Depois, a cabeça decepada dele cai no chão e fica direita, virada para o espectador: os óculos tortos e rachados, a boca aberta.
film.death_act7_3_chris_trapdoor1_ja=Abre um alçapão; um Wendigo salta lá de dentro, ergue-se sobre ele, que está de joelhos, e agarra-lhe a cabeça. Depois, veem-se apenas traves de madeira escuras lá em cima.
film.death_act7_3_chris_trapdoor2=Enquanto olha para baixo, para um alçapão fechado, um Wendigo salta lá de cima para a frente dele, lança-se sobre ele e prende-o de costas no chão. Rasga-lhe a garganta com as garras; o sangue jorra, e o Wendigo ergue a cabeça decepada dele, virada para o espectador, de boca aberta.
film.death_act7_3_chris_trapdoor2_ja=Enquanto olha para baixo, para um alçapão fechado, um Wendigo salta lá de cima para a frente dele, lança-se sobre ele e prende-o de costas no chão. Depois, veem-se apenas vigas de madeira escuras lá em cima.
film.death_act7_3_chris_tunnel1=Num túnel de mina escorado com madeira, as pernas dele esperneiam no ar, com o resto do corpo fora do enquadramento, lá em cima, enquanto o sangue escorre em jorros. Depois, diante de tábuas salpicadas de sangue, o corpo decapitado cai no chão.
film.death_act7_3_chris_tunnel1_ja=Num túnel de mina escorado com madeira, as pernas dele esperneiam no ar, com o resto do corpo fora do enquadramento, lá em cima, enquanto o sangue escorre em jorros. Depois, diante de tábuas salpicadas de sangue, o corpo dele cai no chão; veem-se apenas as pernas e as costas, e uma mão estremece.
film.death_act8_4_josh_wendigo=Um Wendigo irrompe da água escura e prende-lhe a cabeça com as duas mãos compridas. Ele grita enquanto os dedos se lhe cravam no crânio; o Wendigo aperta até o sangue rebentar e espirrar por toda a imagem.
film.death_act8_4_josh_wendigo_ja=Um Wendigo irrompe da água escura e prende-lhe a cabeça com as duas mãos compridas. Ele grita enquanto os dedos se lhe cravam no crânio; à medida que o Wendigo aperta, a imagem sobe, afastando-se deles, e gotas escuras salpicam-na.
film.death_act8_5_jessica_keepstill_timeout1=Em grande plano: ela está deitada de costas, aos gritos, enquanto um Wendigo lhe agarra a cabeça e lhe enfia à força os dedos com garras na boca; arranca-lhe o maxilar inferior, com a boca cheia de presas junto ao rosto inerte dela. Depois, ela jaz imóvel à luz do fogo, sem o maxilar inferior.
film.death_act8_5_jessica_keepstill_timeout1_ja=Quase tudo negro: a câmara passa lentamente ao longo de um corpo deitado imóvel no chão; depois, muito perto, as costelas e a cabeça de um Wendigo surgem da escuridão.
film.death_act8_5_jessica_keepstill_timeout2=Em grande plano, com neve a cair: ela está deitada de costas, aos gritos, enquanto um Wendigo lhe agarra a cabeça e lhe enfia à força os dedos com garras na boca; arranca-lhe o maxilar inferior e aproxima do rosto dela a cara ensanguentada e cheia de dentes. Depois, ela jaz imóvel na neve, à luz do fogo, sem o maxilar inferior.
film.death_act8_5_jessica_keepstill_timeout2_ja=Noite, entre rochas cobertas de neve: em grande plano, os membros compridos e com garras de um Wendigo passam por cima da silhueta escura de alguém; depois, a câmara desliza lentamente sobre rochas vazias, cobertas de neve.
film.death_act8_5_jessica_leftbehind=Num túnel escorado com madeira, ela corre com um lampião; um Wendigo salta-lhe para as costas e derruba-a. Em grande plano, agarra-lhe a cabeça e, enquanto ela grita, enfia-lhe à força os dedos com garras na boca e arranca-lhe o maxilar inferior; depois, ela jaz imóvel à luz do fogo, sem o maxilar inferior, e a cabeça cheia de dentes do Wendigo passa num relance por cima dela.
film.death_act8_5_jessica_leftbehind_ja=Quase tudo negro: a câmara passa lentamente ao longo de um corpo deitado imóvel no chão; depois, um Wendigo ossudo avança de gatas pela escuridão.
film.death_act8_5_jessica_timeout2=Em grande plano: ela está deitada de costas, aos gritos; um Wendigo agarra-lhe o alto da cabeça com uma mão com garras e enfia-lhe à força os dedos da outra na boca.
film.death_act8_5_jessica_timeout2_ja=Quase tudo negro: a câmara passa lentamente ao longo de um corpo deitado imóvel no chão.
film.death_act8_5_matt_gate=Com neve a cair, um Wendigo está agachado por cima de um vão de porta iluminado numa parede de madeira e depois salta lá de cima sobre ele. Agachado sobre ele, ergue-se de braços levantados e esmaga-lhe a cara; em grande plano, o rosto dele, esmagado e ensanguentado, na neve.
film.death_act8_5_matt_gate_ja=Com neve a cair, um Wendigo está agachado por cima de um vão de porta iluminado numa parede de madeira e depois salta lá de cima sobre ele. Ele está deitado de costas e as garras estendem-se para a cara dele; depois, a câmara detém-se no peito dele, com a letra M no casaco, enquanto ele jaz imóvel.
film.death_act8_5_matt_keepstill_timeout1=Num túnel escorado com madeira, ele segura um lampião; um Wendigo salta sobre ele e derruba-o. Agachado sobre ele, ergue-se de braços levantados e esmaga-lhe a cara; em grande plano, o rosto dele, esmagado e ensanguentado.
film.death_act8_5_matt_keepstill_timeout1_ja=Num túnel escorado com madeira, ele segura um lampião; um Wendigo salta sobre ele e derruba-o. Agacha-se sobre ele, com as garras estendidas para a cara dele; depois, a câmara detém-se no peito dele, com a letra M no casaco, enquanto ele jaz imóvel.
film.death_act8_5_matt_keepstill_timeout2=Com neve a cair, um Wendigo está agachado sobre ele, que levanta as mãos; ergue-se e esmaga-lhe a cara. Em grande plano, o rosto dele, esmagado e ensanguentado.
film.death_act8_5_matt_keepstill_timeout2_ja=Com neve a cair, um Wendigo rasteja por cima dele, que levanta uma mão; depois, a câmara detém-se no peito dele, com a letra M no casaco, enquanto ele jaz imóvel.
film.death_act8_5_matt_timeout1=Um Wendigo desce por traves de madeira, lança-se sobre ele e atira-o ao chão. Agachado sobre ele, que levanta uma mão, ergue-se e esmaga-lhe a cara; em grande plano, o rosto dele, esmagado e ensanguentado.
film.death_act8_5_matt_timeout1_ja=Um Wendigo desce por traves de madeira, lança-se sobre ele e atira-o ao chão. Agacha-se sobre ele, de dentes arreganhados; depois, a câmara detém-se no peito dele, com a letra M no casaco, enquanto ele jaz imóvel.
film.death_act8_5_matt_timeout2==film.death_act8_5_matt_keepstill_timeout1
film.death_act8_5_matt_timeout2_ja==film.death_act8_5_matt_keepstill_timeout1_ja
film.death_act8_6_ashley_explosion=Na cabana, entre móveis cobertos com lençóis, um Wendigo salta do chão para a parede, enquanto uma névoa amarelada enche a sala. Uma explosão de fogo projeta-a de bruços pelo chão; ela jaz imóvel, com as chamas a lavrar atrás dela.
film.death_act8_6_ashley_eyegauge=Um Wendigo com uma tatuagem de borboleta no ombro lança-se sobre ela e agarra-lhe a cabeça. Enterra-lhe os polegares nos olhos, com o sangue a escorrer-lhe pela cara, e depois retira os polegares das órbitas ensanguentadas, enquanto ela jaz num chão de madeira.
film.death_act8_6_emily_explosion=Entre labaredas que irrompem, um Wendigo rosna por trás de postes de madeira. A explosão projeta-a por um chão de madeira; ela jaz de bruços, com o rosto muito queimado.
film.death_act8_6_emily_eyegauge==film.death_act8_6_ashley_eyegauge
film.death_act8_6_mike_lightbulb=Na cabana, um Wendigo ruge para o espectador e depois grita-lhe na cara, enquanto ele está encostado a uma parede. Agarra-lhe a cabeça, golpeia-o na barriga e atira-o para o outro lado da sala; ele cai ao pé de um pilar de madeira.
film.death_act8_6_mike_lightbulb_ja=Na cabana, um Wendigo grita para o espectador. Agarra-lhe a cabeça, enquanto ele o empurra pelo peito, grita-lhe na cara e atira-o para o lado; depois, visto de costas, abre bem os braços compridos.
film.death_act8_6_mike_explosion_unijured=Na cabana, uma bola de fogo irrompe por uma sala de móveis cobertos com lençóis e varre o salão, estilhaçando uma jarra. Depois, ele jaz no chão no meio das chamas, com o rosto muito queimado.
film.death_act8_6_sam_wendigo1=Na cabana, a mão com garras de um Wendigo segura-a no ar pela garganta; ela arqueja, com sangue a escorrer-lhe da boca e a lanterna da testa acesa. Trespassa-lhe a barriga duas vezes com o outro braço e larga-a; ela cai no chão e fica imóvel.
film.death_act8_6_sam_wendigo1_ja=Na cabana, um Wendigo agarra-a. Visto de baixo, segura-a no ar com o braço estendido, uma mancha escura e desfocada na margem da imagem, e grita de cabeça atirada para trás; depois, lança-se sobre o espectador e foge de gatas.
film.4_3_being_watched_emilymatt_cctv_footage=Num monitor, uma câmara fixa filma de cima um portão de ferro num muro de pedra coberto de neve, de noite: a Emily passa por ele, depois o Matt, que fecha o portão atrás de si; os dois afastam-se e o portão fica deserto sob a neve que cai.
film.act20_6_cctv_footage=Nos monitores, as imagens de seis câmaras: o Chris e a Ashley estão sentados frente a frente a uma mesa pequena, sob lâminas de serra suspensas; o Chris dispara duas vezes uma arma para cima, depois aponta-a à Ashley, por cima da mesa, e baixa-a. Outras imagens mostram uma mulher de toalha junto a uma banheira iluminada por velas e duas pessoas encostadas a uma parede, com as mãos atadas acima da cabeça, e depois uma mesa salpicada de vermelho.
film.smg_sting.1=No ecrã da sala de cinema, uma ponta de película em branco e riscada tremeluz, com letras e números baralhados a piscar.
film.smg_sting.2=Imagens da Sam a tomar banho à luz de velas: ela olha por cima do ombro, sai da banheira e fica de pé, enrolada numa toalha, a olhar em volta.
film.smg_sting.3=Uma enorme lâmina de serra a girar corta o Josh, deitado numa mesa com os braços acima da cabeça; o sangue esguicha, ele faz uma careta, o sangue jorra-lhe da boca, e sangue e pedaços de carne escorrem para debaixo da mesa.
film.smg_sting.4=A ponta de película em branco volta a tremeluzir.
film.projectorghost_movie=Na parede, imagens antigas e tremeluzentes: a Emily, junto a uma lareira, fala para a câmara e depois empurra a Ashley por uma porta; a Hannah, de óculos, sorri timidamente; duas raparigas, e depois a Ashley, sorriem de orelha a orelha na escuridão; a Hannah começa a desabotoar a blusa e depois vira bruscamente a cabeça para o lado.
film.projectorghost_scare=Um grande plano da Hannah, de óculos, sob luz vermelha, a sorrir e a falar; de repente, surge num relance um rosto branco e medonho, com órbitas escuras e uma boca ensanguentada e escancarada, e o ecrã fica negro.
film.projector_wendigo=Na parede, um velho filme a preto e branco: uma enfermeira deixa um paciente sentado numa cadeira; ele debate-se até se soltar, trepa pela parede e rasteja pelo teto até à escuridão. Ela volta à cadeira vazia, um braço estende-se para ela lá de cima e, depois de um clarão, ela já lá não está; uma figura pálida lança-se contra a câmara e a imagem tomba para o lado.
film.hannah_wendigo_reveal=Um clarão em sépia: um braço com uma tatuagem de borboleta preta e depois a Hannah, de óculos, com as mãos junto ao peito, a sorrir levemente para a câmara.
film.newghosty_up=No ecrã do televisor, um rosto pálido e cadavérico grita, de boca escancarada; por um instante, tremeluz e transforma-se no rosto pálido de uma mulher com olheiras escuras.
film.sam_end_credits.1=Através de uma janela, um quarto às escuras, de noite. Um telemóvel acende-se com um alarme, 06:00 AM, Work Alarm, com a Sam a abraçar um cão como imagem de fundo, junto a frascos de comprimidos e a um livro, CREATURE MYTHS OF THE GREAT PLAINS. A Sam está deitada na cama, debaixo de uma ventoinha de teto a girar; ela abre muito os olhos.
film.sam_end_credits.2=Um frasco de comprimidos cai e rola para junto de outro livro, THE WENDIGO LOG. A Sam senta-se na beira da cama e desliza o dedo para desligar o alarme; o polegar deixa um rasto de sangue no ecrã, e o sangue escorre-lhe pelo antebraço.
film.sam_end_credits.3=Pressiona um lenço de papel contra um corte irregular no antebraço, mas volta a sangrar. Uma luz vermelha vai-se erguendo sobre ela; ela vira-se, de olhos arregalados.
film.sam_end_credits.4=Escuridão e depois o título: UNTIL DAWN.
film.totem_events_of_the_past.1=Uma velha fotografia em sépia de um homem de casaco comprido e lenço ao pescoço, ao lado de um bilhete: NO ESCAPE. Esboços de uma criatura hirsuta e com presas e de uma mão com garras; títulos de jornal: LIVESTOCK MUTILATED: MYSTERIOUS CREATURE SIGHTED, e LOCAL MAN FOUND DEAD.
film.totem_events_of_the_past.2=Uma fotografia de mineiros sob o título MIRACLE MINERAL DISCOVERED; RADIUM; depois MINING DISASTER e DEATH TOLL RISES, e uma fotografia de mineiros rabiscada a preto.
film.totem_events_of_the_past.3=Relances de imagens sangrentas: dentes e gengivas ensanguentados, um crânio rachado, um rosto coberto de sangue, com um olho injetado, larvas sobre carne crua. HUNGER CRAVING rabiscado numa parede; uma radiografia com a inscrição HUMAN?
film.totem_events_of_the_past.4=Uma lista manuscrita: HUNGER, STARVATION, CRAVINGS, CONSUME, TRANSFORM, INSATIABLE HUNGER. Uma fotografia escura de uma figura pálida e curvada, assinalada com um círculo vermelho: CREATURE REPORTED. Esboços de uma criatura com presas, TEETH GROW & SHARPEN WITH AGE, e de uma figura esquelética de membros compridos. THE ONLY WAY, uma seta para FIRE, num círculo; a página arde.
film.totem_events_of_the_past.5=Noite: uma casa de madeira iluminada entre pinheiros cobertos de neve. A Beth, de gorro e camisola cinzentos, e a Hannah, de óculos e casaco acolchoado cor-de-rosa, correm aterrorizadas pelo bosque, de mãos dadas, até ao alto enevoado de uma falésia.
film.totem_events_of_the_past.6=Junto a uma vedação de corda, ao lado de uma placa partida, CLIFF, olham para trás aterrorizadas; uma imagem térmica cor de laranja mostra-as como formas brancas e luminosas entre as árvores. De mãos dadas à beira, a Hannah escorrega pela borda; a Beth agarra-a, e caem as duas.
film.totem_events_of_the_past.7=Um homem com botijas às costas corre para a beira da falésia, enquanto uma criatura esquelética de membros compridos rasteja na direção dele; grandes planos dos óculos de proteção dele e da boca escancarada e cheia de presas da criatura. Ele envolve-a em fogo com o lança-chamas; a criatura arde, a debater-se na neve, e uma bola de fogo cresce até encher o ecrã.
film.causaleffect_act1_3_samattackedbycrow=Junto a uma vedação de arame, um corvo lança-se em voo picado sobre a Sam; ela baixa-se, levando as mãos à cara.
film.causaleffect_act2_1_mattlooksthroughtelescope=Através de um telescópio: numa encosta coberta de neve, o Mike abraça com força alguém de casaco debruado a pele.
film.causaleffect_act2_2_minetunnel=No escuro, entre traves de madeira cruzadas, o Mike inclina-se para dentro do enquadramento e olha em redor, com alguém desfocado atrás dele.
film.causaleffect_act2_4_samfindsbaseballbat=Numa sala às escuras, a Sam brande um taco de basebol, a sorrir; depois, o Josh, iluminado por uma lanterna, segura um taco e sorri de orelha a orelha.
film.causaleffect_act2_5_jessthroughwindow_pants=Junto a uma janela, no escuro, uma mão comprida e ossuda agarra pela cabeça a Jessica, aos gritos, e puxa-a com um safanão para fora do enquadramento.
film.causaleffect_act2_5_jessthroughwindow_coat==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_jessthroughwindow_vest==film.causaleffect_act2_5_jessthroughwindow_pants
film.causaleffect_act2_5_telescope=Através de um telescópio: rochas cobertas de neve sob uma parede rochosa; depois, quase às escuras, um rosto esquelético e enrugado, de olhos a brilhar, enche a imagem.
film.causaleffect_act3_2_bridgefail=À noite, o Mike corre para uma pequena ponte de corda coberta de neve; uma tábua parte-se debaixo dele e ele cai, desaparecendo de vista.
film.causaleffect_act3_2_clifffail=Numa encosta coberta de neve, o Mike, de lampião erguido, escorrega e rebola pelas rochas abaixo, aos trambolhões.
film.causaleffect_act3_2_cliffsafe=Numa encosta rochosa, o Mike, de lampião na mão, desce as rochas com cuidado.
film.causaleffect_act3_2_grabfencefail=Vista de cima: o Mike estende a mão para uma vedação de arame numa encosta coberta de neve, escorrega e cai de costas na neve, lá em baixo.
film.causaleffect_act3_2_grabrootfail=Vista de cima: o Mike agarra-se a uma raiz grossa numa encosta coberta de neve, escorrega e cai de costas na neve, lá em baixo.
film.causaleffect_act3_2_jumpclifffail=À noite, o Mike, de lampião na mão, salta para dentro de uma ravina rochosa, aterra com força e continua a trepar.
film.causaleffect_act3_2_mikefallsover=O Mike, de lampião na mão, desce a correr uma encosta arborizada coberta de neve, tropeça e cai de cara no chão.
film.causaleffect_act3_2_mikeisfast=O Mike, de lampião na mão, corre a toda a velocidade por uma ravina coberta de neve entre rochas, direito ao espectador.
film.causaleffect_act3_2_pipefail=O Mike, de lampião bem erguido, avança em equilíbrio por um cano grosso coberto de neve, escorrega e cai nas águas revoltas.
film.causaleffect_act3_2_shimmy=Vista de cima: o Mike desce por entre rochas escuras; depois, avança de lado ao longo de uma parede rochosa íngreme, agarrado a ela com uma mão.
film.causaleffect_act3_2_takestairs=O Mike, de lampião na mão, chega a correr a uma casinha de madeira e sobe à pressa os degraus cobertos de neve até à porta.
film.causaleffect_act3_2_wendigointower_fast=Através de uma mira telescópica: traves de madeira cruzadas na neve; algo pequeno e cinzento ergue-se e entra no enquadramento junto à cruz da mira.
film.causaleffect_act3_2_wendigointower_slow==film.causaleffect_act3_2_wendigointower_fast
film.causaleffect_act3_4_lighterbehindboards=No escuro, a chama de um isqueiro ilumina tábuas toscas; por uma fresta entre elas, um par de olhos muito abertos e vítreos olha fixamente para fora.
film.causaleffect_act4_1_chrissavesash=Através de uma rede de arame, alguém está sentado sob um candeeiro suspenso; depois, uma enorme lâmina de serra dentada e, ao lado, na sombra, um homem de camisa aos quadrados.
film.causaleffect_act4_2_mikebefriendswolf=O Mike agacha-se ao lado de um lobo hirsuto e afaga-lhe o pelo.
film.causaleffect_act4_2_mikekickswolf=Num vão de porta, o Mike dá um pontapé a um lobo; depois, todo sujo, de lampião erguido, levanta a outra mão, com uma careta.
film.causaleffect_act4_2_mikelooksatswolf=O Mike ergue a mão aberta diante de um lobo; o lobo baixa a cabeça e vira-se, e depois passa mesmo à frente dele, muito perto.
film.causaleffect_act4_2_mikestillhasmachete=Mãos junto às mandíbulas de uma armadilha de metal; o Mike atira a cabeça para trás, com dores. Depois, numa sala com azulejos, apanha uma catana.
film.causaleffect_act4_2_wendigoheadinajar=Uma cabeça pálida e manchada, de olhos minúsculos a brilhar, num grande frasco de vidro.
film.causaleffect_act5_2_emgivesflaretomatt=Num casebre de madeira, a Emily entrega uma pistola de sinalização ao Matt; ele pega nela e baixa o olhar para ela.
film.causaleffect_act5_3_chrisshotashley=Junto a uma pequena mesa de madeira, o Chris, de óculos, aponta uma pistola à Ashley, que chora.
film.causaleffect_act7_3_ashley_trapdoor=Vista de cima: uma mão com um anel e um aquecedor de pulso de malha corre o ferrolho de um alçapão de madeira e agarra o puxador.
film.intro_busride.1=Escuridão e depois o título: UNTIL DAWN.
film.intro_busride.2=Genérico de abertura sobre grandes planos sombrios de objetos, nos quais se entreveem rostos: HAYDEN PANETTIERE, ELLA LENTINI, RAMI MALEK, NOAH FLEISS, GALADRIEL STINEMAN, JORDAN FISHER, NICHOLE SAKURA, BRETT DALTON, MEAGHAN MARTIN, LARRY FESSENDEN, PETER STORMARE.
film.intro_busride.3=Sobre um cavalo de baloiço e um velho aparelho de rádio: ORIGINAL SCORE by MARK KORVEN; SCREENPLAY by LARRY FESSENDEN, GRAHAM REZNICK; OUT OF THE SHADOWS, words and music by ANNA MAE KELLY, ROO WALKER, performed by MAE STEPHENS.
film.intro_busride.4=Ao pôr do sol, vista de cima: um autocarro sobe a serpentear uma estrada de montanha coberta de neve, entre os pinheiros.
film.intro_busride.5=No autocarro, a Sam está sentada à janela; no telemóvel dela: LIVE STREAMING NEWS, RADIO FROM THE PINES.
film.intro_busride.6=O telemóvel dela reproduz um vídeo: o Josh, de camisa aos quadrados, fala para a câmara numa sala às escuras.
