dontmove.passive=Hold kontrolleren stille.
help.dontmove.active=Tell tonene. Det doble pipet hvert halve sekund betyr at markøren er inne og ingenting kreves. To like toner i ett øre betyr: trykk kort på {0} mot den siden, nå. Tre stigende toner betyr opp, tre fallende ned. Et dumpt dunk før signalet betyr at markøren allerede er utenfor kanten; signalet peker da tilbake mot midten. Svar med ett kort trykk, som et klikk, så snart du hører signalet, og lytt så: det doble pipet betyr at markøren er tilbake; det samme dunket med signal igjen betyr ett trykk til; et signal fra motsatt side betyr at du skjøt over, ett trykk tilbake. Et holdt trykk krysser hele sonen på et tidels sekund. Spillet drar markøren i rykk, én retning om gangen, noen sekunder imellom; et rykk besvart innen omtrent tre kvart sekund koster ingenting, etterpå tærer hvert øyeblikk utenfor kanten på et forråd som aldri fylles opp, og klokkesignalet høres når halvparten og tre fjerdedeler er borte. Spillets egne innstillinger for tast- og stikkefølsomhet i Ikke rør deg gjør trykkene mykere.
help.dontmove.passive=Hold kontrolleren stille. Det doble pipet hvert halve sekund betyr at markøren er i midten. Et pip høres der markøren har drevet, på dens side og høyere når den er oppe, raskere jo lenger; et dumpt dunk før pipet betyr at den er utenfor kanten og klokken kan gå.
