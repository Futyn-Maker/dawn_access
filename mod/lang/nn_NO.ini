help.totem=Pipa følgjer varselet på totemet: på den sida det ligg frå midten av synsfeltet, høgare eller lågare. Skyv venstre stikke mot det. Det doble pinget tyder at blikket er på det: hald stille til synet kjem.
help.swipe=Telefonen blir låst opp etter fleire raske sveip etter kvarandre: gjenta {0} om att og om att, raskt. Kvart sveip flyttar glidebrytaren litt fram, og ei lita stund etter det siste glir han tilbake. Pipa stig medan han fyllest, og søkk når han glir tilbake.
