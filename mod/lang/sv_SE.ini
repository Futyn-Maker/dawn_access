dontmove.steer=Besvara varje signal med ett kort tryck på {0}; det dubbla pipet säger att markören är tillbaka.
dontmove.passive=Håll handkontrollen stilla.
help.dontmove.active=Räkna tonerna. Det dubbla pipet varje halvsekund betyder att markören är inne och inget begärs. Två lika toner i ett öra betyder: tryck kort på {0} åt den sidan, nu. Tre stigande toner betyder uppåt, tre fallande nedåt. En dov duns före signalen betyder att markören redan är utanför kanten; signalen pekar då tillbaka mot mitten. Svara med ett kort tryck, som ett klick, så fort du hör signalen, och lyssna sedan: det dubbla pipet betyder att markören är tillbaka; samma duns med signal igen betyder ett tryck till; en signal från motsatt sida betyder att du sköt över, ett tryck tillbaka. Ett hållet tryck korsar hela zonen på en tiondels sekund. Spelet drar markören i ryck, en riktning i taget, några sekunder emellan; ett ryck som besvaras inom ungefär tre fjärdedels sekund kostar inget, därefter tär varje ögonblick utanför kanten på ett förråd som aldrig fylls på, och klocksignalen hörs när hälften och tre fjärdedelar är borta. Spelets egna inställningar för tangent- och spakkänslighet i Rör dig inte gör trycken mjukare.
help.dontmove.passive=Håll handkontrollen stilla. Det dubbla pipet varje halvsekund betyder att markören är i mitten. Ett pip hörs där markören har drivit, på dess sida och högre när den är uppe, snabbare ju längre; en dov duns före pipet betyder att den är utanför kanten och att klockan kan gå.
