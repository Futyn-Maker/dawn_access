help.totem=Pipen följer varslet på totemen: på den sida det ligger från synfältets mitt, högre eller lägre. För vänster spak mot det. Det dubbla pinget betyder att blicken ligger på det: håll stilla tills synen kommer. {0} stänger av och sätter på blickledtonen.
help.swipe=Telefonen låses upp efter flera snabba svep i rad: upprepa {0} om och om igen, snabbt. Varje svep flyttar reglaget en bit framåt, och en stund efter det sista glider det tillbaka. Pipen stiger medan det fylls och sjunker när det glider tillbaka.
