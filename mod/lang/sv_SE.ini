help.shoot=Sikta med musen eller rörelsetangenterna. Pipen hörs i örat på målets sida, ljusare när det är ovanför siktet och mörkare när det är under, och kommer tätare ju närmare siktet kommer; ett snabbt dubbelpip betyder att spelet skulle räkna ett skott mot målet nu. {0} skjuter. {1} och {2} växlar mellan målen, {3} säger var målet är, {4} stänger av och sätter på siktljudet.
help.shoot.pad=Sikta med höger spak. Pipen hörs i örat på målets sida, ljusare när det är ovanför siktet och mörkare när det är under, och kommer tätare ju närmare siktet kommer; ett snabbt dubbelpip betyder att spelet skulle räkna ett skott mot målet nu. {0} skjuter. {1} och {2} växlar mellan målen, {3} säger var målet är, {4} stänger av och sätter på siktljudet. På en DualSense med adaptiva avtryckare påslagna räknas skottet först när avtryckaren trycks förbi motståndet.
help.gesture=En halvcirkel med vänster spak: medurs skjuter du spaken ända upp, sedan åt höger, sedan ner; moturs upp, sedan åt vänster, sedan ner; varje steg inom en halv sekund efter det förra. På tangentbordet gör tangenten i uppmaningen det genast.
help.walk={0} går med gestalten till målet; tryck igen för att stoppa.
help.looksound=Medan målet väntar på en blick slår {0} på och av blickledtonen i stället för ledtonen.
help.lookturn.pad=För att vända gestalten mot målet på stället, tryck rörelsespaken ({0}) lätt mot ljudet, mindre än halvvägs, och släpp inom en sekund; tryckt längre och kvarhållen börjar gestalten gå. När kameran ska titta på målet, vrid den mot ljudet ({1}).
help.lookturn=För att vända gestalten mot målet på stället, tryck kort på en rörelsetangent mot ljudet; hålls den nere börjar gestalten gå.
help.where={0} säger målet igen med avståndet längs vägen och riktningen.
