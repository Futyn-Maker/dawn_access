help.qte=Prime a tecla anunciada antes de o tempo acabar. O som vem com ela e é mais rápido de seguir quando o tempo é curto: três notas a subir pedem cima, W, três a descer baixo, S, duas notas no ouvido esquerdo esquerda, A, no ouvido direito direita, D, a não ser que as tenhas reatribuído.
help.qte.pad=Prime o botão ou empurra o manípulo na direção anunciada antes de o tempo acabar. O som vem com as palavras e é mais rápido de seguir quando o tempo é curto: três notas a subir significam cima, três a descer baixo, duas notas no ouvido esquerdo esquerda, no ouvido direito direita; a direção de um botão é o seu lugar entre os quatro: cima é triângulo ou Y, baixo xis ou A, esquerda quadrado ou X, direita círculo ou B.
dontmove.steer=Responde a cada sinal com um toque breve de {0}; o bipe duplo diz que o marcador voltou.
dontmove.passive=Mantém o comando imóvel.
dontmove.clock.half=O tempo está a acabar.
dontmove.clock.most=O tempo está quase a esgotar-se.
dontmove.active.start=Mantém a calma!
help.dontmove.dynamic=A definição do jogo «{0}» está em {1}: a versão segue o dispositivo que usaste por último antes do início; o comando PlayStation dá a passiva, e o teclado ou outro comando, a ativa. Numa versão ativa, qualquer uso do comando PlayStation faz o jogo ignorar o manípulo e as teclas. Escolhe aí {2} ou {3} para manter uma só versão.
help.dontmove.active=Conta as notas. O bipe duplo a cada meio segundo significa que o marcador está dentro e nada é pedido. Duas notas iguais num ouvido significam: dá um toque breve de {0} para esse lado, já. Três notas a subir, para cima; três a descer, para baixo. Uma pancada grave antes do sinal significa que o marcador já passou da borda; o sinal aponta então o caminho de volta ao centro. Responde com um único toque breve, como um clique, assim que ouvires o sinal, e escuta: o bipe duplo significa que o marcador voltou; a mesma pancada com sinal outra vez, mais um toque; um sinal do lado oposto, passaste do ponto, um toque de volta. Uma pressão mantida atravessa toda a zona num décimo de segundo. O jogo puxa o marcador aos solavancos, uma direção de cada vez, com alguns segundos entre eles; um solavanco respondido em cerca de três quartos de segundo não custa nada, depois cada instante além da borda gasta uma reserva que nunca volta a encher, e o sinal do relógio soa quando metade e três quartos se foram. As definições do próprio jogo de sensibilidade das teclas e do analógico para Não te mexas tornam os toques mais suaves.
help.dontmove.passive=Mantém o comando imóvel. Nesta versão o jogo vigia apenas se o comando se mexe, não onde está o marcador: uma pancada grave cinco vezes por segundo significa que vê o comando mexer-se, e depois de uma breve tolerância no início cada instante de movimento gasta uma reserva que nunca se recupera; o sinal duplo a cada meio segundo significa que está imóvel. O sinal do relógio soa quando metade e três quartos da reserva se gastaram.
