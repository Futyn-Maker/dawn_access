help.walk={0} leva a personagem até ao alvo; carregue outra vez para parar.
help.looksound=Enquanto o alvo espera um olhar, {0} liga e desliga o sinal sonoro do olhar em vez do sinal sonoro.
help.beam=Sobre uma viga, o manípulo só move a personagem para onde ela olha; empurrá-lo para trás fá-la virar-se. O sinal sonoro guia o manípulo ao longo da viga, e {0} anda por ela.
help.lookturn.pad=Para virar a personagem para o alvo sem sair do sítio, empurre o {0} ligeiramente na direção do som, menos de metade, e largue dentro de um segundo; se o empurrar mais e o mantiver, a personagem começa a andar. Quando a câmara tiver de olhar para o alvo, rode-a na direção do som com o {1}.
help.lookturn=Para virar a personagem para o alvo sem sair do sítio, prima brevemente uma tecla de movimento na direção do som; se a mantiver, a personagem começa a andar.
help.where={0} repete o alvo com a distância pelo caminho e a direção.
