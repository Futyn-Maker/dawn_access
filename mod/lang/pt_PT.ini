help.nudge=Os sinais levam o olhar ao enquadramento que a cena espera: do lado dele, mais agudos ou mais graves. Rode o olhar com o rato ou as setas; o sinal duplo significa que o olhar está nele. {0} diz onde está o enquadramento, {1} desliga e liga o sinal sonoro do olhar.
help.nudge.pad=Os sinais levam o olhar ao enquadramento que a cena espera: do lado dele, mais agudos ou mais graves. Rode o olhar com o manípulo direito; o sinal duplo significa que o olhar está nele. {0} diz onde está o enquadramento, {1} desliga e liga o sinal sonoro do olhar.
help.turn=Os sinais guiam a rotação do objeto nas mãos até ao ponto em que ele se revela: à direita ou à esquerda, ou mais agudos ou mais graves para uma rotação para cima ou para baixo, e mais rápidos quanto mais perto. O sinal duplo significa que ele se revelou. {0} diz para onde rodar e quanto falta, {1} desliga e liga o sinal sonoro do olhar.
help.boiler=Quando a lâmpada de pressão acende, soa o sinal duplo: prima {0} de imediato, enquanto está acesa, durante cerca de dois segundos; premir com a lâmpada apagada falha e tudo recomeça. Depois de rodar, solte {0}: um botão ainda premido desde o agarrar conta de imediato, antes de a lâmpada acender.
help.shake=O globo de neve pode ser abanado: prima W ou S. O jogo não mostra nenhuma indicação para isso.
help.shake.pad=O globo de neve pode ser abanado: empurre o manípulo esquerdo para cima ou para baixo. O jogo não mostra nenhuma indicação para isso.
help.shake.ps=O globo de neve pode ser abanado: abane o próprio comando; o jogo deteta-o com o sensor de movimento. O jogo não mostra nenhuma indicação para isso.
help.shake.ps.off=O globo de neve pode ser abanado, mas não com este comando enquanto a opção “{0}” estiver desativada nos controlos do jogo: prima W ou S no teclado ou ative essa opção. O jogo não mostra nenhuma indicação para isso.
help.gesture=Um semicírculo com o manípulo esquerdo: no sentido dos ponteiros do relógio, empurre-o até ao fim para cima, depois para a direita, depois para baixo; no sentido contrário, para cima, depois para a esquerda, depois para baixo; cada passo até meio segundo após o anterior. No teclado, a tecla do aviso fá-lo de imediato.
help.gesture.held=Aqui o semicírculo faz-se com {0} premido: se o largar, deixa cair o que segura.
help.swipe.held=Aqui o movimento faz-se com {0} premido: prima primeiro {0} e mantenha-o, depois faça o movimento uma vez; conta no momento em que é feito, e mantê-lo não faz mais nada.
