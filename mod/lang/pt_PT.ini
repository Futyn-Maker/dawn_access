help.explore={0} e {1} escolhem para onde ir, {2} liga ou desliga o sinal sonoro. O sinal soa do lado do alvo e sobe à medida que se aproxima; desce uma oitava quando o alvo está atrás de si. Caminhe em direção ao som com as teclas de movimento.
help.explore.pad=No comando não é preciso combinação enquanto anda: {0} alvo seguinte, {1} anterior, {2} onde está, {3} sinal, {4} ir até ele.
