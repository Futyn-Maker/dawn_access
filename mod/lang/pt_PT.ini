help.totem=Os sinais seguem a premonição no totem: do lado em que ela fica em relação ao centro da vista, mais acima ou mais abaixo. Empurre o manípulo esquerdo na direção dela. O sinal duplo significa que a vista está sobre ela: fique quieto até à visão. {0} desliga e liga o sinal sonoro do olhar.
help.swipe=O telemóvel desbloqueia depois de vários deslizes rápidos seguidos: repita {0} vezes sem conta, depressa. Cada deslize faz avançar um pouco o controlo, e um instante depois do último ele recua. Os sinais sobem enquanto enche e descem quando recua.
hud.objective=Objetivo: {0}
