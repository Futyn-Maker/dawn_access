help.dilemma.pad=Rode a mira com o manípulo direito: à esquerda está {0}, à direita {1}. O som da mira vem do lado para onde aponta; um sinal duplo significa que esse lado foi escolhido. Depois, {2} dispara. Se não fizer nada, o tempo esgota-se, e isso também é uma escolha.
help.dilemma=Rode a mira com o rato ou as teclas de movimento: à esquerda está {0}, à direita {1}. O som da mira vem do lado para onde aponta; um sinal duplo significa que esse lado foi escolhido. Depois, {2} dispara. Se não fizer nada, o tempo esgota-se, e isso também é uma escolha.
shoot.unnamed=Alvo
shoot.sound.on=Som de mira ligado.
shoot.sound.off=Som de mira desligado.
help.shoot=Aponte com o rato ou com as teclas de movimento. Os sinais soam no ouvido do lado do alvo, mais agudos quando ele está acima da mira e mais graves quando está abaixo, e ficam mais rápidos à medida que a mira se aproxima; um sinal duplo rápido significa que o jogo contaria agora um tiro no alvo. {0} dispara. {1} e {2} trocam de alvo, {3} diz onde está o alvo, {4} desliga e liga o som de mira.
help.shoot.pad=Aponte com o manípulo direito. Os sinais soam no ouvido do lado do alvo, mais agudos quando ele está acima da mira e mais graves quando está abaixo, e ficam mais rápidos à medida que a mira se aproxima; um sinal duplo rápido significa que o jogo contaria agora um tiro no alvo. {0} dispara. {1} e {2} trocam de alvo, {3} diz onde está o alvo, {4} desliga e liga o som de mira. Num DualSense com os gatilhos adaptáveis ligados, o tiro só conta quando o gatilho é premido para além da resistência.
help.shoot.snap={0} põe a mira no alvo e mantém-na lá, também num alvo que se mexa, até apontares tu; não dispara: {1} dispara.
shoot.snap.release=Solta primeiro {0}.
