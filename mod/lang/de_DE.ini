help.dilemma.pad=Drehe das Ziel mit dem rechten Stick: links ist {0}, rechts ist {1}. Der Klang des Ziels kommt von der Seite, auf die es zeigt; ein doppelter Ton bedeutet, dass diese Seite gewählt ist. Dann schießt {2}. Tust du nichts, läuft die Zeit ab, und auch das ist eine Wahl.
help.dilemma=Drehe das Ziel mit der Maus oder den Bewegungstasten: links ist {0}, rechts ist {1}. Der Klang des Ziels kommt von der Seite, auf die es zeigt; ein doppelter Ton bedeutet, dass diese Seite gewählt ist. Dann schießt {2}. Tust du nichts, läuft die Zeit ab, und auch das ist eine Wahl.
shoot.unnamed=Ziel
shoot.sound.on=Zielton an.
shoot.sound.off=Zielton aus.
help.shoot=Ziele mit der Maus oder den Bewegungstasten. Die Signale erklingen im Ohr auf der Seite des Ziels, höher, wenn es über dem Visier liegt, tiefer, wenn darunter, und kommen schneller, je näher das Visier ihm kommt; ein schnelles doppeltes Ping bedeutet, dass das Spiel jetzt einen Schuss auf das Ziel werten würde. {0} schießt. {1} und {2} wechseln zwischen den Zielen, {3} sagt, wo das Ziel ist, {4} schaltet den Zielton aus und ein.
help.shoot.pad=Ziele mit dem rechten Stick. Die Signale erklingen im Ohr auf der Seite des Ziels, höher, wenn es über dem Visier liegt, tiefer, wenn darunter, und kommen schneller, je näher das Visier ihm kommt; ein schnelles doppeltes Ping bedeutet, dass das Spiel jetzt einen Schuss auf das Ziel werten würde. {0} schießt. {1} und {2} wechseln zwischen den Zielen, {3} sagt, wo das Ziel ist, {4} schaltet den Zielton aus und ein. Auf einem DualSense mit eingeschalteten adaptiven Triggern zählt der Schuss erst, wenn der Trigger über den Widerstand hinaus gedrückt wird.
help.shoot.snap={0} richtet das Visier auf das Ziel und hält es dort, auch auf einem Ziel, das sich bewegt, bis du selbst zielst; es schießt nicht: {1} schießt.
shoot.snap.release=Lass zuerst {0} los.
nudge.on=Im Bild.
