help.qte=Drücke die angesagte Taste, bevor die Zeit abläuft. Der Ton kommt mit ihr und ist schneller zu erfassen, wenn die Zeit knapp ist: drei steigende Töne verlangen oben, W, drei fallende unten, S, zwei Töne im linken Ohr links, A, im rechten Ohr rechts, D, sofern du sie nicht anders belegt hast.
help.qte.pad=Drücke die angesagte Taste oder bewege den Stick in die angesagte Richtung, bevor die Zeit abläuft. Der Ton kommt mit den Worten und ist schneller zu erfassen, wenn die Zeit knapp ist: drei steigende Töne bedeuten oben, drei fallende unten, zwei Töne im linken Ohr links, im rechten Ohr rechts; die Richtung einer Taste ist ihr Platz unter den vieren: oben ist Dreieck oder Y, unten Kreuz oder A, links Quadrat oder X, rechts Kreis oder B.
dontmove.steer=Beantworten Sie jedes Signal mit einem kurzen Tipper von {0}; der Doppelton sagt, dass die Markierung zurück ist.
dontmove.passive=Halten Sie den Controller still.
dontmove.clock.half=Die Zeit wird knapp.
dontmove.clock.most=Die Zeit ist fast um.
dontmove.active.start=Ruhig bleiben!
help.dontmove.dynamic=Die Spieleinstellung „{0}“ steht auf {1}: Die Variante richtet sich nach dem Gerät, das du vor dem Beginn zuletzt benutzt hast; der PlayStation-Controller ergibt die passive, die Tastatur oder ein anderer Controller die aktive. In einer aktiven Runde lässt jede Benutzung des PlayStation-Controllers das Spiel Stick und Tasten übergehen. Wähle dort {2} oder {3}, damit die Variante bleibt.
help.dontmove.active=Zählen Sie die Töne. Der Doppelton alle halbe Sekunde heißt, die Markierung ist drinnen und nichts ist verlangt. Zwei gleiche Töne in einem Ohr heißen: {0} jetzt kurz zu dieser Seite tippen. Drei steigende Töne heißen nach oben, drei fallende nach unten. Ein dumpfer Schlag vor dem Signal heißt, die Markierung ist schon über dem Rand; das Signal zeigt dann zurück zur Mitte. Antworten Sie mit einem kurzen Tipper, wie einem Klick, sobald Sie das Signal hören, und hören Sie dann hin: Der Doppelton heißt, die Markierung ist zurück; derselbe Schlag mit Signal noch einmal heißt, noch einmal tippen; ein Signal von der Gegenseite heißt, Sie sind darüber hinausgeschossen, einmal zurücktippen. Ein gehaltener Druck durchquert die ganze Zone in einer Zehntelsekunde. Das Spiel zieht die Markierung in Stößen, eine Richtung auf einmal, einige Sekunden auseinander; ein innerhalb von etwa drei Viertelsekunden beantworteter Stoß kostet nichts, danach zehrt jeder Moment über dem Rand an einem Vorrat, der sich nie auffüllt, und das Uhrzeichen erklingt, wenn die Hälfte und drei Viertel davon verbraucht sind. Die eigenen Einstellungen des Spiels zur Tasten- und Stick-Empfindlichkeit für Nicht bewegen machen die Tipper sanfter.
help.dontmove.passive=Halte den Controller ganz still. In dieser Version achtet das Spiel nur darauf, ob sich der Controller bewegt, nicht darauf, wo die Markierung ist: ein tiefes Pochen fünfmal pro Sekunde heißt, dass es den Controller sich bewegen sieht, und nach einer kurzen Schonfrist am Anfang zehrt jeder Moment davon an einem Vorrat, der sich nie wieder füllt; das doppelte Ping jede halbe Sekunde heißt, dass er still ist. Das Uhrsignal ertönt, wenn die Hälfte und drei Viertel des Vorrats verbraucht sind.
