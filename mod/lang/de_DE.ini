help.walk={0} führt die Figur zum Ziel; noch einmal drücken hält an.
help.looksound=Solange das Ziel auf einen Blick wartet, schaltet {0} den Blick-Leitton statt des Leittons.
help.beam=Auf einem Balken bewegt der Stick die Figur nur in ihre Blickrichtung; nach hinten gedrückt dreht sie sich um. Der Leitton führt den Stick am Balken entlang, und {0} geht darauf weiter.
help.lookturn.pad=Um die Figur auf der Stelle zum Ziel zu drehen, drück den Bewegungsstick ({0}) leicht, weniger als halb, in Richtung des Tons und lass innerhalb einer Sekunde los; weiter gedrückt und gehalten, läuft die Figur los. Wenn die Kamera auf das Ziel schauen muss, dreh sie in Richtung des Tons ({1}).
help.lookturn=Um die Figur auf der Stelle zum Ziel zu drehen, tippe kurz eine Bewegungstaste in Richtung des Tons; gehalten, läuft die Figur los.
help.where={0} sagt das Ziel noch einmal mit der Entfernung auf dem Weg und der Richtung.
