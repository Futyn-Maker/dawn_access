explore.noglint=Das Spiel zeigt hier kein Glitzern.
totem.vision=Eine Vision.
totem.found=Schon gefunden.
help.totem=Die Pieptöne folgen der Vorahnung auf dem Totem: auf der Seite, auf der sie von der Bildmitte aus liegt, höher oder tiefer. Drücke den linken Stick dorthin. Der Doppelton heißt, der Blick liegt darauf: still halten, bis die Vision kommt. {0} schaltet den Blick-Leitton aus und ein.
help.swipe=Das Telefon entsperrt sich nach mehreren schnellen Wischbewegungen hintereinander: Wiederhole {0} immer wieder, schnell. Jede Wischbewegung schiebt den Regler ein Stück weiter, und einen Moment nach der letzten gleitet er zurück. Die Pieptöne steigen, während er sich füllt, und fallen, wenn er zurückgleitet.
hud.objective=Ziel: {0}
