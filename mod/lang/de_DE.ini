turn.down=Nach unten drehen, noch {0} %.
help.nudge=Die Signale führen den Blick zu dem Bildausschnitt, auf den die Szene wartet: auf seiner Seite, höher oder tiefer. Drehe den Blick mit der Maus oder den Pfeiltasten; das doppelte Ping bedeutet, dass der Blick darauf ruht. {0} sagt, wo der Ausschnitt ist, {1} schaltet den Blick-Leitton aus und ein.
help.nudge.pad=Die Signale führen den Blick zu dem Bildausschnitt, auf den die Szene wartet: auf seiner Seite, höher oder tiefer. Drehe den Blick mit dem rechten Stick; das doppelte Ping bedeutet, dass der Blick darauf ruht. {0} sagt, wo der Ausschnitt ist, {1} schaltet den Blick-Leitton aus und ein.
help.turn=Die Signale führen das Drehen des Gegenstands in der Hand bis zu der Stelle, an der er sich enthüllt: rechts oder links, bei einer Drehung nach oben oder unten höher oder tiefer, und je näher, desto schneller. Das doppelte Ping bedeutet, dass er enthüllt ist. {0} sagt, wohin zu drehen ist und wie viel noch fehlt, {1} schaltet den Blick-Leitton aus und ein.
help.boiler=Wenn die Drucklampe aufleuchtet, ertönt das doppelte Ping: Drücke sofort {0}, solange sie leuchtet, etwa zwei Sekunden lang; ein Druck bei dunkler Lampe misslingt, und alles beginnt von vorn. Lass {0} nach dem Drehen los: Eine vom Greifen noch gehaltene Taste zählt sofort, bevor die Lampe leuchtet.
help.shake=Die Schneekugel lässt sich schütteln: drücke W oder S. Das Spiel zeigt dafür keinen Hinweis.
help.shake.pad=Die Schneekugel lässt sich schütteln: drücke den linken Stick nach oben oder unten. Das Spiel zeigt dafür keinen Hinweis.
help.shake.ps=Die Schneekugel lässt sich schütteln: schüttle den Controller selbst; das Spiel erkennt es mit dem Bewegungssensor. Das Spiel zeigt dafür keinen Hinweis.
help.shake.ps.off=Die Schneekugel lässt sich schütteln, aber nicht mit diesem Controller, solange die Einstellung „{0}“ in der Steuerung des Spiels ausgeschaltet ist: drücke W oder S auf der Tastatur oder schalte die Einstellung ein. Das Spiel zeigt dafür keinen Hinweis.
help.gesture=Ein Halbkreis mit dem linken Stick: im Uhrzeigersinn den Stick ganz nach oben, dann nach rechts, dann nach unten drücken; gegen den Uhrzeigersinn nach oben, dann nach links, dann nach unten; jeder Schritt innerhalb einer halben Sekunde nach dem vorigen. Auf der Tastatur erledigt es die Taste aus dem Hinweis sofort.
help.gesture.held=Hier wird der Halbkreis mit gehaltener {0} gemacht: Lässt du sie los, fällt herunter, was du hältst.
help.swipe.held=Hier wird die Bewegung mit gehaltener {0} gemacht: Drücke zuerst {0} und halte sie, dann mach die Bewegung einmal; sie zählt in dem Moment, in dem du sie machst, sie zu halten bringt nichts weiter.
