dontmove.steer=Beantworten Sie jedes Signal mit einem kurzen Tipper von {0}; der Doppelton sagt, dass die Markierung zurück ist.
dontmove.passive=Halten Sie den Controller still.
help.dontmove.active=Zählen Sie die Töne. Der Doppelton alle halbe Sekunde heißt, die Markierung ist drinnen und nichts ist verlangt. Zwei gleiche Töne in einem Ohr heißen: {0} jetzt kurz zu dieser Seite tippen. Drei steigende Töne heißen nach oben, drei fallende nach unten. Ein dumpfer Schlag vor dem Signal heißt, die Markierung ist schon über dem Rand; das Signal zeigt dann zurück zur Mitte. Antworten Sie mit einem kurzen Tipper, wie einem Klick, sobald Sie das Signal hören, und hören Sie dann hin: Der Doppelton heißt, die Markierung ist zurück; derselbe Schlag mit Signal noch einmal heißt, noch einmal tippen; ein Signal von der Gegenseite heißt, Sie sind darüber hinausgeschossen, einmal zurücktippen. Ein gehaltener Druck durchquert die ganze Zone in einer Zehntelsekunde. Das Spiel zieht die Markierung in Stößen, eine Richtung auf einmal, einige Sekunden auseinander; ein innerhalb von etwa drei Viertelsekunden beantworteter Stoß kostet nichts, danach zehrt jeder Moment über dem Rand an einem Vorrat, der sich nie auffüllt, und das Uhrzeichen erklingt, wenn die Hälfte und drei Viertel davon verbraucht sind. Die eigenen Einstellungen des Spiels zur Tasten- und Stick-Empfindlichkeit für Nicht bewegen machen die Tipper sanfter.
help.dontmove.passive=Halten Sie den Controller still. Der Doppelton alle halbe Sekunde heißt, die Markierung sitzt in der Mitte. Ein Piepen erklingt dort, wohin die Markierung gewandert ist, auf ihrer Seite und höher, wenn sie oben ist, schneller, je weiter; ein dumpfer Schlag vor dem Piepen heißt, sie ist über dem Rand und die Zeit kann laufen.
