help.beam=Kirişin üzerinde çubuk karakteri yalnızca baktığı yöne hareket ettirir; geriye itmek onu döndürür. İşaret sesi çubuğu kiriş boyunca yönlendirir, {0} kiriş boyunca yürütür.
help.lookturn.pad=Karakteri olduğu yerde hedefe döndürmek için hareket çubuğunu ({0}) sesin yönüne yarıdan az, hafifçe itip bir saniye içinde bırakın; daha fazla itilip tutulursa karakter yürür. Kameranın hedefe bakması gerektiğinde kamerayı sesin yönüne çevirin ({1}).
