help.dilemma.pad=Nişangâhı sağ çubukla çevirin: solda {0}, sağda {1}. Nişangâhın sesi döndüğü taraftan gelir; çift sinyal o tarafın seçildiği anlamına gelir. Ardından {2} ateş eder. Hiçbir şey yapmazsanız süre dolar ve bu da bir seçimdir.
help.dilemma=Nişangâhı fare veya hareket tuşlarıyla çevirin: solda {0}, sağda {1}. Nişangâhın sesi döndüğü taraftan gelir; çift sinyal o tarafın seçildiği anlamına gelir. Ardından {2} ateş eder. Hiçbir şey yapmazsanız süre dolar ve bu da bir seçimdir.
