help.nudge=Sinyaller, bakışı sahnenin beklediği kadraja götürür: kadrajın bulunduğu taraftan, daha ince ya da daha kalın sesle. Bakışı fareyle veya ok tuşlarıyla çevirin; çift sinyal, bakışın kadrajda olduğu anlamına gelir. {0}: kadrajın yeri. {1}: bakış işaret sesini kapatma ve açma.
help.nudge.pad=Sinyaller, bakışı sahnenin beklediği kadraja götürür: kadrajın bulunduğu taraftan, daha ince ya da daha kalın sesle. Bakışı sağ çubukla çevirin; çift sinyal, bakışın kadrajda olduğu anlamına gelir. {0}: kadrajın yeri. {1}: bakış işaret sesini kapatma ve açma.
help.turn=Sinyaller, eldeki nesnenin dönüşünü açığa çıktığı noktaya kadar yönlendirir: sağdan ya da soldan, yukarı ya da aşağı dönüşte daha ince ya da daha kalın sesle, yaklaştıkça daha sık. Çift sinyal, nesnenin açığa çıktığı anlamına gelir. {0}: hangi yöne çevrileceği ve ne kadar kaldığı. {1}: bakış işaret sesini kapatma ve açma.
help.boiler=Basınç lambası yandığında çift sinyal duyulur: lamba yanarken, yaklaşık iki saniye içinde hemen {0} tuşuna basın; lamba sönükken basmak başarısız olur ve her şey baştan başlar. Çevirdikten sonra {0} tuşunu bırakın: tutmadan beri basılı kalan düğme, lamba yanmadan hemen sayılır.
help.shake=Kar küresi sallanabilir: W veya S tuşuna basın. Oyun bunun için bir uyarı göstermez.
help.shake.pad=Kar küresi sallanabilir: sol çubuğu yukarı veya aşağı itin. Oyun bunun için bir uyarı göstermez.
help.shake.ps=Kar küresi sallanabilir: kumandanın kendisini sallayın; ayarlarda açıksa oyun bunu hareket sensörüyle algılar. Oyun bunun için bir uyarı göstermez.
help.gesture=Sol çubukla yarım daire: saat yönünde çubuğu sonuna kadar yukarı, sonra sağa, sonra aşağı itin; saatin tersi yönünde yukarı, sonra sola, sonra aşağı; her adım bir öncekinden en geç yarım saniye sonra. Klavyede, istemdeki tuş bunu hemen yapar.
help.gesture.held=Burada yarım daire {0} basılı tutularak yapılır: bırakırsan tuttuğun şeyi düşürürsün.
