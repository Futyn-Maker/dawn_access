help.totem=Bip sesleri totemdeki kehaneti izler: görüşün merkezine göre hangi yandaysa o yanda, daha yüksek ya da daha alçak. Sol çubuğu ona doğru itin. Çift bip, bakışın onun üzerinde olduğu anlamına gelir: görü gelene kadar kıpırdamayın. {0}: bakış işaret sesini kapatma ve açma.
help.swipe=Telefon art arda birkaç hızlı kaydırmadan sonra açılır: {0} hareketini tekrar tekrar, hızlıca yineleyin. Her kaydırma sürgüyü biraz ilerletir, son kaydırmadan bir an sonra da sürgü geri kayar. Bip sesleri sürgü doldukça yükselir, geri kaydıkça alçalır.
hud.objective=Hedef: {0}
