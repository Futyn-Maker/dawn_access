help.shoot=Fareyle veya hareket tuşlarıyla nişan alın. Sinyaller hedefin bulunduğu taraftaki kulakta duyulur; hedef nişangâhın üstündeyse daha ince, altındaysa daha kalın çıkar ve nişangâh yaklaştıkça hızlanır; hızlı bir çift sinyal, oyunun şimdi hedefe yapılan atışı sayacağı anlamına gelir. {0}: ateş. {1} ve {2}: hedef değiştirme. {3}: hedefin yeri. {4}: nişan sesini kapatma ve açma.
help.shoot.pad=Sağ çubukla nişan alın. Sinyaller hedefin bulunduğu taraftaki kulakta duyulur; hedef nişangâhın üstündeyse daha ince, altındaysa daha kalın çıkar ve nişangâh yaklaştıkça hızlanır; hızlı bir çift sinyal, oyunun şimdi hedefe yapılan atışı sayacağı anlamına gelir. {0}: ateş. {1} ve {2}: hedef değiştirme. {3}: hedefin yeri. {4}: nişan sesini kapatma ve açma. Uyarlanabilir tetikleri açık bir DualSense'te atış, ancak tetik direnç noktasının ötesine çekildiğinde sayılır.
