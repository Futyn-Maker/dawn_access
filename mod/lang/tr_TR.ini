dontmove.passive=Kumandayı sabit tutun.
help.dontmove.active=Notaları sayın. Yarım saniyede bir gelen çift bip, işaretin içeride olduğu ve bir şey istenmediği anlamına gelir. Bir kulaktan gelen iki eşit nota: hemen {0} ile o yana kısa bir dokunuş demektir. Yükselen üç nota yukarı, alçalan üç nota aşağı demektir. Sinyalden önceki boğuk vuruş işaretin çoktan kenarı aştığını belirtir; sinyal o zaman merkeze dönüş yolunu gösterir. Sinyali duyar duymaz tık gibi tek bir kısa dokunuşla karşılık verin, sonra dinleyin: çift bip işaretin geri döndüğünü, aynı vuruş ve sinyalin yinelenmesi bir dokunuş daha gerektiğini, karşı taraftan gelen sinyal ise fazla kaçırdığınızı ve bir kez geri dokunmanız gerektiğini söyler. Basılı tutmak tüm bölgeyi saniyenin onda birinde geçer. Oyun işareti birkaç saniye arayla, her seferinde tek yöne doğru çekişlerle sürükler; yaklaşık dörtte üç saniye içinde karşılık verilen bir çekişin bedeli yoktur, sonrasında kenarın ötesindeki her an hiç dolmayan bir havuzu tüketir ve saat sesi yarısı ile dörtte üçü gittiğinde çalar. Oyunun Kıpırdama için kendi tuş ve çubuk hassasiyeti ayarları dokunuşları yumuşatır.
help.dontmove.passive=Kumandayı sabit tutun. Yarım saniyede bir gelen çift bip işaretin merkezde olduğunu belirtir. İşaretin kaydığı yerden bir bip gelir, onun tarafından ve yukarıdaysa daha tiz, uzaklaştıkça daha sık; bipten önceki boğuk vuruş kenarı aştığını ve sürenin işliyor olabileceğini belirtir.
