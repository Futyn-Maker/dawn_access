help.shoot=Richt met de muis of de bewegingstoetsen. De piepjes klinken in het oor aan de kant van het doel, hoger als het boven het vizier ligt en lager als het eronder ligt, en komen sneller naarmate het vizier dichterbij komt; een snelle dubbele ping betekent dat het spel een schot op het doel nu zou meetellen. {0} schiet. {1} en {2} wisselen tussen de doelen, {3} zegt waar het doel is, {4} zet het richtgeluid uit en aan.
help.shoot.pad=Richt met de rechter stick. De piepjes klinken in het oor aan de kant van het doel, hoger als het boven het vizier ligt en lager als het eronder ligt, en komen sneller naarmate het vizier dichterbij komt; een snelle dubbele ping betekent dat het spel een schot op het doel nu zou meetellen. {0} schiet. {1} en {2} wisselen tussen de doelen, {3} zegt waar het doel is, {4} zet het richtgeluid uit en aan. Op een DualSense met adaptieve triggers aan telt het schot pas als de trigger voorbij de weerstand wordt ingedrukt.
help.shoot.snap={0} richt het vizier op het doel en houdt het daar, ook op een doel dat beweegt, tot je zelf richt; het schiet niet: {1} schiet.
