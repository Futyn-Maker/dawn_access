help.nudge=De piepjes leiden de blik naar het kader waarop de scène wacht: aan zijn kant, hoger of lager. Draai de blik met de muis of de pijltoetsen; de dubbele ping betekent dat de blik erop rust. {0} zegt waar het kader is, {1} zet het kijkbaken uit en aan.
help.nudge.pad=De piepjes leiden de blik naar het kader waarop de scène wacht: aan zijn kant, hoger of lager. Draai de blik met de rechter stick; de dubbele ping betekent dat de blik erop rust. {0} zegt waar het kader is, {1} zet het kijkbaken uit en aan.
help.turn=De piepjes leiden het draaien van het voorwerp in je handen naar het punt waar het zich onthult: rechts of links, of hoger of lager bij draaien omhoog of omlaag, en sneller naarmate het dichterbij is. De dubbele ping betekent dat het onthuld is. {0} zegt welke kant je op moet draaien en hoeveel er nog over is, {1} zet het kijkbaken uit en aan.
help.boiler=Als de druklamp aangaat, klinkt de dubbele ping: druk meteen op {0}, zolang hij brandt, ongeveer twee seconden; drukken terwijl hij uit is mislukt en alles begint opnieuw. Laat {0} na het draaien los: een knop die nog vastgehouden wordt van het vastpakken telt meteen, voordat de lamp brandt.
help.shake=De sneeuwbol kan geschud worden: druk op W of S. Het spel toont hier geen aanwijzing voor.
help.shake.pad=De sneeuwbol kan geschud worden: duw de linkerstick omhoog of omlaag. Het spel toont hier geen aanwijzing voor.
help.shake.ps=De sneeuwbol kan geschud worden: schud de controller zelf; het spel merkt dat met de bewegingssensor. Het spel toont hier geen aanwijzing voor.
help.shake.ps.off=De sneeuwbol kan geschud worden, maar niet met deze controller zolang de instelling ‘{0}’ uit staat in de besturing van het spel: druk op W of S op het toetsenbord of zet die instelling aan. Het spel toont hier geen aanwijzing voor.
help.gesture=Een halve cirkel met de linkerstick: met de klok mee duw je hem helemaal omhoog, dan naar rechts, dan omlaag; tegen de klok in omhoog, dan naar links, dan omlaag; elke stap binnen een halve seconde na de vorige. Op het toetsenbord doet de toets uit de prompt het meteen.
help.gesture.held=Hier maak je de halve cirkel met {0} ingedrukt: laat je los, dan valt wat je vasthoudt.
help.swipe.held=Hier maak je de beweging met {0} ingedrukt: druk eerst op {0} en houd die vast, maak dan de beweging één keer; die telt op het moment dat je hem maakt, en vasthouden doet niets meer.
