help.qte=Druk op de genoemde toets voordat de tijd om is. Het geluid komt tegelijk en is sneller te volgen als de tijd kort is: drie stijgende tonen vragen om omhoog, W, drie dalende om omlaag, S, twee tonen in het linkeroor om links, A, in het rechteroor om rechts, D, tenzij je ze anders hebt ingesteld.
help.qte.pad=Druk op de genoemde knop of duw de stick in de genoemde richting voordat de tijd om is. Het geluid komt tegelijk met de woorden en is sneller te volgen als de tijd kort is: drie stijgende tonen betekenen omhoog, drie dalende omlaag, twee tonen in het linkeroor links, in het rechteroor rechts; de richting van een knop is zijn plaats tussen de vier: omhoog is driehoek of Y, omlaag kruis of A, links vierkant of X, rechts rondje of B.
dontmove.steer=Beantwoord elk signaal met één kort tikje van {0}; de dubbele piep zegt dat de markering terug is.
dontmove.passive=Houd de controller stil.
dontmove.clock.half=De tijd raakt op.
dontmove.clock.most=De tijd is bijna om.
dontmove.active.start=Blijf kalm!
help.dontmove.dynamic=De spelinstelling ‘{0}’ staat op {1}: de versie volgt het apparaat dat je vóór het begin het laatst gebruikte; de PlayStation-controller geeft de passieve, het toetsenbord of een andere controller de actieve. In een actieve versie laat elk gebruik van de PlayStation-controller het spel de stick en de toetsen negeren. Kies daar {2} of {3} om één versie te houden.
help.dontmove.active=Tel de tonen. De dubbele piep om de halve seconde betekent dat de markering binnen is en er niets wordt gevraagd. Twee gelijke tonen in één oor betekenen: tik {0} nu kort die kant op. Drie stijgende tonen betekenen omhoog, drie dalende omlaag. Een doffe tik vóór het signaal betekent dat de markering al over de rand is; het signaal wijst dan terug naar het midden. Antwoord met één kort tikje, als een klik, zodra je het signaal hoort, en luister dan: de dubbele piep betekent dat de markering terug is; dezelfde doffe tik met signaal opnieuw betekent nog een tikje; een signaal van de andere kant betekent dat je te ver bent, één tikje terug. Een vastgehouden druk steekt de hele zone in een tiende seconde over. Het spel trekt de markering in rukken, één richting tegelijk, enkele seconden uit elkaar; een ruk die je binnen ongeveer driekwart seconde beantwoordt kost niets, daarna teert elk ogenblik over de rand in op een voorraad die nooit bijvult, en het kloksignaal klinkt wanneer de helft en driekwart ervan op zijn. De eigen instellingen van het spel voor toets- en stickgevoeligheid bij Niet bewegen maken de tikjes zachter.
help.dontmove.passive=Houd de controller stil. In deze versie let het spel alleen op of de controller beweegt, niet op waar de markering is: een lage dreun vijf keer per seconde betekent dat het de controller ziet bewegen, en na een korte genadetijd aan het begin teert elk moment daarvan in op een voorraad die nooit wordt aangevuld; de dubbele ping elke halve seconde betekent dat hij stil is. Het kloksignaal klinkt als de helft en driekwart van de voorraad op zijn.
