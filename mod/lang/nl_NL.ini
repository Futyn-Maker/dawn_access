help.dilemma.pad=Draai het vizier met de rechterstick: links is {0}, rechts is {1}. Het geluid van het vizier klinkt van de kant waar het naartoe wijst; een dubbele piep betekent dat die kant gekozen is. Daarna schiet {2}. Doe je niets, dan loopt de tijd af, en ook dat is een keuze.
help.dilemma=Draai het vizier met de muis of de bewegingstoetsen: links is {0}, rechts is {1}. Het geluid van het vizier klinkt van de kant waar het naartoe wijst; een dubbele piep betekent dat die kant gekozen is. Daarna schiet {2}. Doe je niets, dan loopt de tijd af, en ook dat is een keuze.
