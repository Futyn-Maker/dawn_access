help.swipe=De telefoon ontgrendelt na meerdere snelle veegbewegingen achter elkaar: herhaal {0} steeds opnieuw, snel. Elke veegbeweging schuift de schuifregelaar een stukje op, en een moment na de laatste glijdt hij terug. De piepjes stijgen terwijl hij vol loopt en dalen als hij terugglijdt.
