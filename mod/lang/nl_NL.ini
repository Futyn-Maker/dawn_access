help.looksound=Zolang het doel op een blik wacht, zet {0} het kijkbaken aan en uit in plaats van het baken.
help.beam=Op een balk beweegt de stick het personage alleen de kant op waar het naar kijkt; naar achteren duwen draait het om. Het baken leidt de stick langs de balk, en {0} loopt eroverheen.
help.lookturn.pad=Om het personage ter plekke naar het doel te draaien, duw je de {0} licht richting het geluid, minder dan halverwege, en laat je binnen een seconde los; verder geduwd en vastgehouden gaat het personage lopen. Als de camera naar het doel moet kijken, draai je die met de {1} richting het geluid.
help.lookturn=Om het personage ter plekke naar het doel te draaien, tik je kort op een bewegingstoets richting het geluid; ingedrukt gehouden gaat het personage lopen.
