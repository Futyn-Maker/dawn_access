help.nudge=Les bips mènent le regard vers le cadre qu'attend la scène : de son côté, plus haut ou plus bas. Tournez le regard avec la souris ou les flèches ; le double bip signifie que le regard est sur le cadre. {0} dit où est le cadre, {1} coupe et rétablit la balise du regard.
help.nudge.pad=Les bips mènent le regard vers le cadre qu'attend la scène : de son côté, plus haut ou plus bas. Tournez le regard avec le stick droit ; le double bip signifie que le regard est sur le cadre. {0} dit où est le cadre, {1} coupe et rétablit la balise du regard.
help.turn=Les bips guident la rotation de l'objet en main jusqu'au point où il se révèle : à droite ou à gauche, ou plus aigus ou plus graves pour une rotation vers le haut ou le bas, et plus rapides à mesure qu'il approche. Le double bip signifie qu'il est révélé. {0} dit dans quel sens tourner et ce qu'il reste, {1} coupe et rétablit la balise du regard.
help.boiler=Quand la lampe de pression s'allume, le double bip retentit : appuyez aussitôt sur {0}, tant qu'elle est allumée, environ deux secondes ; un appui lampe éteinte échoue et tout recommence. Après la rotation, relâchez {0} : un bouton encore maintenu depuis la saisie compte aussitôt, avant que la lampe s'allume.
help.shake=La boule à neige peut être secouée : appuyez sur W ou S. Le jeu n’affiche aucune indication pour cela.
help.shake.pad=La boule à neige peut être secouée : poussez le stick gauche vers le haut ou le bas. Le jeu n’affiche aucune indication pour cela.
help.shake.ps=La boule à neige peut être secouée : secouez la manette elle-même ; le jeu le détecte avec le capteur de mouvement. Le jeu n’affiche aucune indication pour cela.
help.shake.ps.off=La boule à neige peut être secouée, mais pas avec cette manette tant que le réglage « {0} » est désactivé dans les commandes du jeu : appuyez sur W ou S au clavier, ou activez ce réglage. Le jeu n’affiche aucune indication pour cela.
help.gesture=Un demi-cercle avec le stick gauche : dans le sens des aiguilles d'une montre, poussez-le à fond vers le haut, puis à droite, puis vers le bas ; dans le sens inverse, en haut, puis à gauche, puis en bas ; chaque étape moins d'une demi-seconde après la précédente. Au clavier, la touche de l'invite le fait aussitôt.
help.gesture.held=Ici, le demi-cercle se fait en maintenant {0} : si vous le relâchez, ce que vous tenez tombe.
help.swipe.held=Ici, le mouvement se fait en maintenant {0} : appuyez d’abord sur {0} et maintenez-le, puis faites le mouvement une fois ; il compte au moment où vous le faites, et le maintenir ne fait rien de plus.
