help.totem=Les bips suivent la prémonition sur le totem : du côté où elle se trouve par rapport au centre de la vue, plus haut ou plus bas. Poussez le stick gauche vers elle. Le double bip signifie que la vue est dessus : ne bougez plus jusqu'à la vision. {0} coupe et rétablit la balise du regard.
help.swipe=Le téléphone se déverrouille après plusieurs balayages rapides à la suite : répétez {0} encore et encore, rapidement. Chaque balayage fait avancer un peu le curseur, et un instant après le dernier il revient en arrière. Les bips montent quand il se remplit et descendent quand il recule.
