shoot.sound.off=Son de visée désactivé.
help.shoot=Visez avec la souris ou les touches de déplacement. Les bips sonnent dans l'oreille du côté de la cible, plus aigus quand elle est au-dessus de la visée et plus graves quand elle est en dessous, et s'accélèrent à mesure que la visée s'en approche ; un double bip rapide signifie que le jeu compterait maintenant un tir sur la cible. {0} tire. {1} et {2} changent de cible, {3} dit où est la cible, {4} coupe et rétablit le son de visée.
help.shoot.pad=Visez avec le stick droit. Les bips sonnent dans l'oreille du côté de la cible, plus aigus quand elle est au-dessus de la visée et plus graves quand elle est en dessous, et s'accélèrent à mesure que la visée s'en approche ; un double bip rapide signifie que le jeu compterait maintenant un tir sur la cible. {0} tire. {1} et {2} changent de cible, {3} dit où est la cible, {4} coupe et rétablit le son de visée. Sur une DualSense avec les gâchettes adaptatives activées, le tir ne compte qu'une fois la gâchette enfoncée au-delà de sa résistance.
