help.lookturn.pad=Pour tourner le personnage vers la cible sans qu'il bouge, poussez légèrement le {0} vers le son, à moins de mi-course, et relâchez dans la seconde ; poussé plus loin et maintenu, il fait marcher le personnage. Quand la caméra doit regarder la cible, tournez-la vers le son avec le {1}.
help.lookturn=Pour tourner le personnage vers la cible sans qu'il bouge, appuyez brièvement sur une touche de déplacement vers le son ; maintenue, elle fait marcher le personnage.
