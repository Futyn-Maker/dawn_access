help.gesture=Un demi-cercle avec le stick gauche : dans le sens des aiguilles d'une montre, poussez-le à fond vers le haut, puis à droite, puis vers le bas ; dans le sens inverse, en haut, puis à gauche, puis en bas ; chaque étape moins d'une demi-seconde après la précédente. Au clavier, la touche de l'invite le fait aussitôt.
help.walk={0} conduit le personnage jusqu'à la cible ; appuyez encore pour arrêter.
