help.dilemma.pad=Tournez la visée avec le stick droit : à gauche {0}, à droite {1}. Le son de la visée vient du côté vers lequel elle pointe ; un double bip signifie que ce côté est choisi. Ensuite, {2} tire. Ne rien faire laisse le temps s'écouler, et c'est aussi un choix.
help.dilemma=Tournez la visée avec la souris ou les touches de déplacement : à gauche {0}, à droite {1}. Le son de la visée vient du côté vers lequel elle pointe ; un double bip signifie que ce côté est choisi. Ensuite, {2} tire. Ne rien faire laisse le temps s'écouler, et c'est aussi un choix.
