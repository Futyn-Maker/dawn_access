help.dontmove.active=Comptez les notes. Le double bip toutes les demi-secondes signifie que le repère est à l'intérieur et que rien n'est demandé. Deux notes égales dans une oreille signifient : donnez une brève impulsion de {0} de ce côté, maintenant. Trois notes montantes, vers le haut ; trois descendantes, vers le bas. Un coup sourd avant le signal signifie que le repère a déjà passé le bord ; le signal indique alors le retour vers le centre. Répondez par une seule brève impulsion, comme un clic, dès que vous entendez le signal, puis écoutez : le double bip signifie que le repère est revenu ; le même coup sourd avec le signal signifie une impulsion de plus ; un signal du côté opposé signifie que vous êtes allé trop loin, une impulsion en arrière. Une pression maintenue traverse toute la zone en un dixième de seconde. Le jeu tire le repère par à-coups, une direction à la fois, à quelques secondes d'intervalle ; un à-coup traité en trois quarts de seconde environ ne coûte rien, ensuite chaque instant au-delà du bord entame une réserve qui ne se remplit jamais, et le signal d'horloge retentit à la moitié et aux trois quarts. Les réglages du jeu de sensibilité des touches et du stick pour Ne bougez pas rendent les impulsions plus douces.
help.dontmove.passive=Tenez la manette immobile. Le double bip toutes les demi-secondes signifie que le repère est au centre. Un bip retentit là où le repère a dérivé, de son côté et plus aigu s'il est en haut, plus rapide à mesure qu'il s'éloigne ; un coup sourd avant le bip signifie qu'il a passé le bord et que le temps peut courir.
