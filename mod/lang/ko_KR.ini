help.shoot=마우스나 이동 키로 조준하세요. 신호음은 표적이 있는 쪽 귀에서 울리며, 표적이 조준점보다 위에 있으면 높게, 아래에 있으면 낮게 들리고, 조준점이 가까워질수록 빨라집니다. 빠른 이중 신호음은 지금 쏘면 게임이 표적에 대한 사격으로 인정한다는 뜻입니다. {0}: 사격. {1}, {2}: 표적 전환. {3}: 표적 위치. {4}: 조준 소리 끄기와 켜기.
help.shoot.pad=오른쪽 스틱으로 조준하세요. 신호음은 표적이 있는 쪽 귀에서 울리며, 표적이 조준점보다 위에 있으면 높게, 아래에 있으면 낮게 들리고, 조준점이 가까워질수록 빨라집니다. 빠른 이중 신호음은 지금 쏘면 게임이 표적에 대한 사격으로 인정한다는 뜻입니다. {0}: 사격. {1}, {2}: 표적 전환. {3}: 표적 위치. {4}: 조준 소리 끄기와 켜기. 적응형 트리거가 켜진 DualSense에서는 트리거를 저항 지점 너머까지 당겨야 사격이 인정됩니다.
