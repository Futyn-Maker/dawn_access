dontmove.steer=신호가 날 때마다 {0}을(를) 한 번 짧게 누르세요. 두 번 울리는 소리는 표식이 돌아왔다는 뜻입니다.
dontmove.passive=컨트롤러를 가만히 들고 계세요.
help.dontmove.active=음의 개수를 세세요. 반초마다 두 번 울리는 소리는 표식이 안에 있고 할 일이 없다는 뜻입니다. 한쪽 귀에서 나는 같은 두 음은 지금 그쪽으로 {0}을(를) 짧게 누르라는 뜻입니다. 올라가는 세 음은 위로, 내려가는 세 음은 아래로입니다. 신호 앞의 낮은 둔탁한 음은 표식이 이미 가장자리를 넘었다는 뜻이며, 그때 신호는 중앙으로 돌아갈 방향을 가리킵니다. 신호가 들리는 즉시 클릭처럼 한 번만 짧게 누르고 들어 보세요. 두 번 울리는 소리는 표식이 돌아왔다는 뜻이고, 같은 둔탁한 음과 신호가 다시 나면 한 번 더 누르라는 뜻이며, 반대쪽에서 신호가 나면 너무 멀리 간 것이니 반대로 한 번 짧게 누르세요. 계속 누르면 10분의 1초 만에 영역 전체를 가로지릅니다. 게임은 몇 초 간격으로 한 번에 한 방향씩 표식을 잡아당깁니다. 약 4분의 3초 안에 응한 당김은 아무것도 잃지 않지만, 그 뒤로는 가장자리 밖에 있는 매 순간이 다시 차지 않는 저장량을 줄이며, 절반과 4분의 3이 사라졌을 때 시계 신호가 울립니다. 게임 자체의 '움직이지 마세요' 키 감도와 스틱 감도 설정으로 누름을 더 부드럽게 할 수 있습니다.
help.dontmove.passive=컨트롤러를 가만히 들고 계세요. 반초마다 두 번 울리는 소리는 표식이 중앙에 있다는 뜻입니다. 짧은 소리는 표식이 움직여 간 곳에서 나며, 그쪽에서 나고 위에 있을수록 높고 멀수록 빨라집니다. 소리 앞의 낮은 둔탁한 음은 가장자리를 넘어 시간이 가고 있을 수 있다는 뜻입니다.
