help.dilemma.pad=오른쪽 스틱으로 조준을 돌리세요. 왼쪽은 {0}, 오른쪽은 {1}입니다. 조준 소리는 조준이 향한 쪽에서 들리며, 이중 신호음은 그쪽이 선택되었다는 뜻입니다. 그다음 {2}(으)로 쏩니다. 아무것도 하지 않으면 시간이 다 되며, 그것도 하나의 선택입니다.
help.dilemma=마우스나 이동 키로 조준을 돌리세요. 왼쪽은 {0}, 오른쪽은 {1}입니다. 조준 소리는 조준이 향한 쪽에서 들리며, 이중 신호음은 그쪽이 선택되었다는 뜻입니다. 그다음 {2}(으)로 쏩니다. 아무것도 하지 않으면 시간이 다 되며, 그것도 하나의 선택입니다.
