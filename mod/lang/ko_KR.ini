turn.down=아래로 돌리세요. {0}% 남았습니다.
help.nudge=신호음이 장면이 기다리는 구도로 시선을 이끕니다. 구도가 있는 쪽에서 울리며, 음의 높낮이로 위아래를 알려 줍니다. 마우스나 화살표 키로 시선을 돌리세요. 이중 신호음은 시선이 구도에 맞았다는 뜻입니다. {0}: 구도 위치. {1}: 시선 신호음 끄기와 켜기.
help.nudge.pad=신호음이 장면이 기다리는 구도로 시선을 이끕니다. 구도가 있는 쪽에서 울리며, 음의 높낮이로 위아래를 알려 줍니다. 오른쪽 스틱으로 시선을 돌리세요. 이중 신호음은 시선이 구도에 맞았다는 뜻입니다. {0}: 구도 위치. {1}: 시선 신호음 끄기와 켜기.
help.turn=신호음이 손에 든 물건을 드러나는 지점까지 돌리도록 이끕니다. 오른쪽이나 왼쪽에서 울리고, 위아래로 돌릴 때는 음의 높낮이로 알려 주며, 가까워질수록 빨라집니다. 이중 신호음은 물건이 드러났다는 뜻입니다. {0}: 돌릴 방향과 남은 정도. {1}: 시선 신호음 끄기와 켜기.
help.boiler=압력 램프가 켜지면 이중 신호음이 울립니다. 켜져 있는 동안(약 2초) 바로 {0}을(를) 누르세요. 램프가 꺼져 있을 때 누르면 실패하고 처음부터 다시 시작합니다. 돌린 뒤에는 {0}을(를) 떼세요. 잡을 때부터 누르고 있던 버튼은 램프가 켜지기 전에 바로 판정됩니다.
help.shake=스노볼을 흔들 수 있습니다: W 또는 S를 누르세요. 게임은 이에 대한 안내를 표시하지 않습니다.
help.shake.pad=스노볼을 흔들 수 있습니다: 왼쪽 스틱을 위나 아래로 미세요. 게임은 이에 대한 안내를 표시하지 않습니다.
help.shake.ps=스노볼을 흔들 수 있습니다: 컨트롤러 자체를 흔드세요. 게임이 모션 센서로 이를 감지합니다. 게임은 이에 대한 안내를 표시하지 않습니다.
help.shake.ps.off=스노볼을 흔들 수 있지만, 게임의 조작 설정에서 ‘{0}’ 설정이 꺼져 있는 동안에는 이 컨트롤러로 흔들 수 없습니다. 키보드의 W나 S를 누르거나 그 설정을 켜세요. 게임은 이에 대한 안내를 표시하지 않습니다.
help.gesture=왼쪽 스틱으로 반원: 시계 방향은 스틱을 끝까지 위로, 그다음 오른쪽, 그다음 아래로. 시계 반대 방향은 위, 그다음 왼쪽, 그다음 아래로. 각 단계는 앞 단계 후 0.5초 이내에 합니다. 키보드에서는 안내에 표시된 키로 바로 됩니다.
help.gesture.held=여기서는 {0}을(를) 누른 채로 반원을 그립니다. 손을 떼면 들고 있는 물건을 떨어뜨립니다.
interact.nomatches=성냥이 없습니다.
interact.lamp=램프가 켜졌습니다.
interact.now=지금.
interact.linear.forward=앞으로: {0}.
interact.dial.position=위치 {0}.
help.walk={0}을(를) 누르면 캐릭터가 목표까지 걸어갑니다. 다시 누르면 멈춥니다.
help.looksound=대상이 시선을 기다리는 동안 {0}은(는) 신호음 대신 시선 신호음을 켜고 끕니다.
help.beam=들보 위에서는 스틱이 캐릭터를 바라보는 방향으로만 움직입니다. 뒤로 밀면 돌아섭니다. 신호음이 스틱을 들보를 따라 안내하고, {0}을(를) 누르면 들보를 따라 걸어갑니다.
help.lookturn.pad=제자리에서 캐릭터를 목표 쪽으로 돌리려면 {0}을(를) 소리 나는 쪽으로 절반이 안 되게 살짝 밀었다가 1초 안에 놓으세요. 더 깊이 밀고 있으면 캐릭터가 걷기 시작합니다. 카메라가 목표를 봐야 할 때는 {1}(으)로 카메라를 소리 나는 쪽으로 돌리세요.
help.lookturn=제자리에서 캐릭터를 목표 쪽으로 돌리려면 소리 나는 쪽의 이동 키를 짧게 누르세요. 계속 누르고 있으면 캐릭터가 걷기 시작합니다.
help.where={0}(으)로 목표를 경로상의 거리와 방향과 함께 다시 말합니다.
explore.place=장소
explore.face=그쪽으로 몸을 돌리세요.
explore.look=그쪽을 바라보세요.
explore.noglint=여기에는 반짝임이 표시되지 않습니다.
totem.vision=환영.
totem.found=이미 찾은 토템입니다.
help.totem=신호음은 토템 위 예언의 위치를 따라갑니다. 시야 중심에서 그것이 있는 쪽에서, 더 높거나 낮게 울립니다. 왼쪽 스틱을 그쪽으로 미세요. 이중 신호음은 시선이 그 위에 있다는 뜻입니다. 환영이 나올 때까지 가만히 계세요. {0}: 시선 신호음 끄기와 켜기.
help.swipe=휴대폰은 빠른 스와이프를 여러 번 연달아 하면 잠금이 풀립니다. {0}을(를) 빠르게 계속 반복하세요. 스와이프할 때마다 슬라이더가 조금씩 나아가고, 마지막 스와이프 후 잠시 뒤에는 뒤로 미끄러집니다. 신호음은 차오를수록 높아지고, 뒤로 미끄러질수록 낮아집니다.
hud.objective=목표: {0}
