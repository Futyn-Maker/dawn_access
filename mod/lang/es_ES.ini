help.totem=Los pitidos siguen la premonición en el tótem: hacia el lado en que queda desde el centro de la vista, más arriba o más abajo. Empuja el stick izquierdo hacia ella. El doble pitido significa que la vista está sobre ella: quédate quieto hasta la visión. {0} desactiva y activa la baliza de mirada.
help.swipe=El teléfono se desbloquea tras varios deslizamientos rápidos seguidos: repite {0} una y otra vez, deprisa. Cada deslizamiento hace avanzar un poco el control, y un momento después del último retrocede. Los pitidos suben mientras se llena y bajan cuando retrocede.
hud.objective=Objetivo: {0}
