help.walk={0} lleva al personaje hasta el objetivo; púlselo otra vez para detenerlo.
help.looksound=Mientras el objetivo espera una mirada, {0} activa y desactiva la baliza de mirada en lugar de la baliza.
help.beam=Sobre una viga, el stick solo mueve al personaje hacia donde mira; empujarlo hacia atrás lo hace girar. La baliza guía el stick a lo largo de la viga y {0} avanza por ella.
help.lookturn.pad=Para girar al personaje hacia el objetivo sin moverlo del sitio, empuje el {0} suavemente hacia el sonido, menos de la mitad, y suéltelo antes de un segundo; si lo empuja más y lo mantiene, el personaje echa a andar. Cuando la cámara deba mirar al objetivo, gírela hacia el sonido con el {1}.
help.lookturn=Para girar al personaje hacia el objetivo sin moverlo del sitio, pulse brevemente una tecla de movimiento hacia el sonido; si la mantiene, el personaje echa a andar.
help.where={0} repite el objetivo con la distancia por el camino y la dirección.
