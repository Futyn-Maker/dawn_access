help.dilemma.pad=Gira la mira con el stick derecho: a la izquierda está {0}, a la derecha {1}. El sonido de la mira suena del lado al que apunta; un pitido doble significa que ese lado está elegido. Después, {2} dispara. Si no haces nada, se acaba el tiempo, y eso también es una elección.
help.dilemma=Gira la mira con el ratón o las teclas de movimiento: a la izquierda está {0}, a la derecha {1}. El sonido de la mira suena del lado al que apunta; un pitido doble significa que ese lado está elegido. Después, {2} dispara. Si no haces nada, se acaba el tiempo, y eso también es una elección.
shoot.unnamed=Objetivo
shoot.sound.on=Sonido de puntería activado.
shoot.sound.off=Sonido de puntería desactivado.
help.shoot=Apunte con el ratón o con las teclas de movimiento. Los pitidos suenan en el oído del lado del objetivo, más agudos cuando está por encima de la mira y más graves cuando está por debajo, y se aceleran a medida que la mira se acerca; un doble pitido rápido significa que el juego contaría ahora un disparo al objetivo. {0} dispara. {1} y {2} cambian de objetivo, {3} dice dónde está el objetivo, {4} desactiva y activa el sonido de puntería.
help.shoot.pad=Apunte con el stick derecho. Los pitidos suenan en el oído del lado del objetivo, más agudos cuando está por encima de la mira y más graves cuando está por debajo, y se aceleran a medida que la mira se acerca; un doble pitido rápido significa que el juego contaría ahora un disparo al objetivo. {0} dispara. {1} y {2} cambian de objetivo, {3} dice dónde está el objetivo, {4} desactiva y activa el sonido de puntería. En un DualSense con los gatillos adaptativos activados, el disparo solo cuenta cuando el gatillo se aprieta más allá de su resistencia.
help.shoot.snap={0} pone la mira sobre el objetivo y la mantiene ahí, también sobre uno que se mueve, hasta que apuntes tú; no dispara: {1} dispara.
shoot.snap.release=Suelta primero {0}.
