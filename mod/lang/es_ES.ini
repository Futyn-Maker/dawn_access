turn.up=Gira hacia arriba, falta un {0} %.
turn.down=Gira hacia abajo, falta un {0} %.
help.nudge=Los pitidos llevan la vista al encuadre que espera la escena: suenan de su lado, más agudos o más graves. Gire la vista con el ratón o las teclas de flecha; el doble pitido significa que la vista está en él. {0} dice dónde está el encuadre, {1} desactiva y activa la baliza de mirada.
help.nudge.pad=Los pitidos llevan la vista al encuadre que espera la escena: suenan de su lado, más agudos o más graves. Gire la vista con el stick derecho; el doble pitido significa que la vista está en él. {0} dice dónde está el encuadre, {1} desactiva y activa la baliza de mirada.
help.turn=Los pitidos guían el giro del objeto que tienes en las manos hasta el punto en que se revela: a la derecha o a la izquierda, o más agudos o más graves para un giro hacia arriba o hacia abajo, y más rápidos cuanto más cerca. El doble pitido significa que se ha revelado. {0} dice hacia dónde girar y cuánto falta, {1} desactiva y activa la baliza de mirada.
help.boiler=Cuando se enciende la lámpara de presión, suena el doble pitido: pulse {0} enseguida, mientras está encendida, unos dos segundos; pulsar con la lámpara apagada falla y todo vuelve a empezar. Después de girar, suelte {0}: un botón aún pulsado desde el agarre cuenta en el acto, antes de que la lámpara se encienda.
help.shake=La bola de nieve se puede agitar: pulsa W o S. El juego no muestra ningún aviso para ello.
help.shake.pad=La bola de nieve se puede agitar: empuja el stick izquierdo arriba o abajo. El juego no muestra ningún aviso para ello.
help.shake.ps=La bola de nieve se puede agitar: agita el propio mando; el juego lo detecta con el sensor de movimiento. El juego no muestra ningún aviso para ello.
help.shake.ps.off=La bola de nieve se puede agitar, pero no con este mando mientras el ajuste «{0}» esté desactivado en los controles del juego: pulsa W o S en el teclado o activa ese ajuste. El juego no muestra ningún aviso para ello.
help.gesture=Un semicírculo con el stick izquierdo: en el sentido de las agujas del reloj, empújelo a fondo hacia arriba, luego a la derecha, luego abajo; en sentido contrario, arriba, luego a la izquierda, luego abajo; cada paso a menos de medio segundo del anterior. En el teclado, la tecla del indicador lo hace de inmediato.
help.gesture.held=Aquí el semicírculo se hace manteniendo pulsado {0}: si lo sueltas, se cae lo que sostienes.
help.steprun=Mantén {0}: mientras se mantiene, un paso sigue a otro, y cada uno suena un tono más alto.
help.swipe.held=Aquí el movimiento se hace manteniendo pulsado {0}: pulsa primero {0} y mantenlo, y luego haz el movimiento una vez; cuenta en el momento en que lo haces, y mantenerlo no hace nada más.
