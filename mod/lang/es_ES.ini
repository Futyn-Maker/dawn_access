help.qte=Pulsa la tecla que se anuncia antes de que se acabe el tiempo. El sonido llega con ella y es más rápido de seguir cuando el tiempo es corto: tres notas ascendentes piden arriba, W, tres descendentes abajo, S, dos notas en el oído izquierdo izquierda, A, en el derecho derecha, D, salvo que las hayas reasignado.
help.qte.pad=Pulsa el botón o mueve el stick hacia donde se anuncia antes de que se acabe el tiempo. El sonido llega con las palabras y es más rápido de seguir cuando el tiempo es corto: tres notas ascendentes significan arriba, tres descendentes abajo, dos notas en el oído izquierdo izquierda, en el derecho derecha; la dirección de un botón es su lugar entre los cuatro: arriba es triángulo o Y, abajo equis o A, izquierda cuadrado o X, derecha círculo o B.
dontmove.steer=Responde a cada señal con un toque breve de {0}; el doble pitido dice que el marcador ha vuelto.
dontmove.passive=Mantén el mando quieto.
dontmove.clock.half=Se acaba el tiempo.
dontmove.clock.most=Casi no queda tiempo.
dontmove.active.start=¡Mantén la calma!
help.dontmove.dynamic=El ajuste del juego «{0}» está en {1}: la versión depende del dispositivo que usaste por última vez antes de que empiece; el mando de PlayStation da la pasiva, y el teclado u otro mando, la activa. En una partida activa, cualquier uso del mando de PlayStation hace que el juego ignore el stick y las teclas. Elige ahí {2} o {3} para mantener una sola versión.
help.dontmove.active=Cuenta las notas. El doble pitido cada medio segundo significa que el marcador está dentro y no se pide nada. Dos notas iguales en un oído significan: da un toque breve de {0} hacia ese lado, ya. Tres notas ascendentes, hacia arriba; tres descendentes, hacia abajo. Un golpe sordo antes de la señal significa que el marcador ya ha pasado el borde; la señal indica entonces el camino de vuelta al centro. Responde con un solo toque breve, como un clic, en cuanto oigas la señal, y escucha: el doble pitido significa que el marcador ha vuelto; el mismo golpe con señal otra vez, un toque más; una señal desde el lado opuesto, que te has pasado, un toque de vuelta. Una pulsación mantenida cruza toda la zona en una décima de segundo. El juego tira del marcador a tirones, una dirección cada vez, con unos segundos entre ellos; un tirón respondido en unos tres cuartos de segundo no cuesta nada, después cada instante más allá del borde gasta una reserva que nunca se rellena, y la señal del reloj suena al irse la mitad y tres cuartos. Los ajustes del propio juego de sensibilidad de teclas y de stick para No te muevas hacen los toques más suaves.
help.dontmove.passive=Mantén el mando quieto. En esta versión el juego solo vigila si el mando se mueve, no dónde está el marcador: un golpe grave cinco veces por segundo significa que ve moverse el mando, y tras un breve margen al principio cada instante de movimiento gasta una reserva que nunca se recupera; el doble pitido cada medio segundo significa que está quieto. La señal del reloj suena cuando se ha gastado la mitad y tres cuartas partes de la reserva.
