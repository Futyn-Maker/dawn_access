help.qte=時間切れになる前に、読み上げられたキーを押してください。音は同時に鳴り、時間が短いときは音のほうが早く分かります。上昇する3音は上（W）、下降する3音は下（S）、左耳の2音は左（A）、右耳の2音は右（D）です（割り当てを変えていない場合）。
help.qte.pad=時間切れになる前に、読み上げられたボタンを押すか、読み上げられた方向にスティックを倒してください。音は言葉と同時に鳴り、時間が短いときは音のほうが早く分かります。上昇する3音は上、下降する3音は下、左耳の2音は左、右耳の2音は右です。ボタンの方向は4つのボタンの中での位置です。上は△またはY、下は×またはA、左は□またはX、右は○またはBです。
dontmove.steer=合図のたびに{0}を一度だけ短く押してください。二重の音はマーカーが戻ったことを示します。
dontmove.passive=コントローラーを動かさずに持っていてください。
dontmove.clock.half=時間が減っています。
dontmove.clock.most=もうすぐ時間切れです。
dontmove.active.start=落ち着いて！
help.dontmove.dynamic=ゲームの設定「{0}」が「{1}」になっています。開始前に最後に使った機器で種類が決まり、PlayStationのコントローラーならパッシブ、キーボードや他のコントローラーならアクティブになります。アクティブの最中にPlayStationのコントローラーを使うと、ゲームはスティックもキーも受け付けなくなります。種類を固定するには、そこで「{2}」か「{3}」を選んでください。
help.dontmove.active=音の数を数えてください。半秒ごとの二重の音は、マーカーが枠の中にあり何もする必要がないことを示します。片耳から鳴る同じ2音は、今すぐその側へ{0}を短く押せという合図です。上行する3音は上へ、下行する3音は下へ。合図の前の低い打音は、マーカーがすでに端を越えたことを示し、そのとき合図は中心へ戻る方向を指します。合図を聞いたらすぐ、クリックのように一度だけ短く押し、そして聞いてください。二重の音ならマーカーは戻っています。同じ打音と合図がまた鳴ればもう一度短く押します。反対側から合図が鳴れば行き過ぎなので、一度だけ逆へ短く押します。押し続けると10分の1秒で枠全体を横切ってしまいます。ゲームは数秒おきに一方向ずつマーカーを引っ張ります。約4分の3秒以内に応じた引っ張りは何も失わせず、それを過ぎると端の外にいる間は回復しない蓄えが減り続け、半分と4分の3が減ったときに時計の合図が鳴ります。ゲーム自身の「動かないで」のキー感度とスティック感度の設定で、押す力を和らげられます。
help.dontmove.passive=コントローラーを動かさないでください。このバージョンでは、ゲームはマーカーの位置ではなく、コントローラーが動いているかどうかだけを見ています。低いドンという音が1秒に5回鳴るのは、ゲームがコントローラーの動きを捉えているという意味で、開始直後の短い猶予の後は、動いている間ずっと二度と回復しない余裕が減っていきます。半秒ごとのダブルピンは静止しているという意味です。余裕の半分と4分の3がなくなると時計の合図が鳴ります。
