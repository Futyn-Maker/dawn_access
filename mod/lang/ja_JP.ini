help.dilemma.pad=右スティックで照準を動かします。左は{0}、右は{1}です。照準の音は照準が向いている側から聞こえ、二重の音はその側が選ばれたことを示します。その後{2}で撃ちます。何もしなければ時間切れになり、それも一つの選択です。
help.dilemma=マウスまたは移動キーで照準を動かします。左は{0}、右は{1}です。照準の音は照準が向いている側から聞こえ、二重の音はその側が選ばれたことを示します。その後{2}で撃ちます。何もしなければ時間切れになり、それも一つの選択です。
shoot.unnamed=標的
shoot.sound.on=照準音オン。
shoot.sound.off=照準音オフ。
help.shoot=マウスまたは移動キーで狙ってください。ビープ音は標的のある側の耳で鳴り、標的が照準より上にあれば高く、下にあれば低くなり、照準が近づくほど速くなります。素早い二重の音は、今撃てばゲームが標的への射撃と認めることを示します。{0}：射撃。{1}と{2}：標的の切り替え。{3}：標的の位置。{4}：照準音のオフとオン。
help.shoot.pad=右スティックで狙ってください。ビープ音は標的のある側の耳で鳴り、標的が照準より上にあれば高く、下にあれば低くなり、照準が近づくほど速くなります。素早い二重の音は、今撃てばゲームが標的への射撃と認めることを示します。{0}：射撃。{1}と{2}：標的の切り替え。{3}：標的の位置。{4}：照準音のオフとオン。アダプティブトリガーがオンのDualSenseでは、トリガーを抵抗の先まで引き込んだときにだけ射撃が認められます。
help.shoot.snap={0}で照準を標的に合わせ、動く標的でも、自分で狙い始めるまで合わせ続けます。撃ちはしません。撃つのは{1}です。
shoot.snap.release=先に{0}を離してください。
nudge.on=フレームに入っています。
nudge.where=フレーム：{0}。
turn.right=右へ回してください。残り{0}%。
turn.left=左へ回してください。残り{0}%。
turn.up=上へ回してください。残り{0}%。
turn.down=下へ回してください。残り{0}%。
help.nudge=ビープ音は、シーンが待っているフレームへ視線を導きます。フレームのある側で鳴り、音の高さで上下を示します。マウスまたは矢印キーで視線を動かしてください。二重の音は視線がフレームに合っていることを示します。{0}：フレームの位置。{1}：視線ビーコンのオフとオン。
help.nudge.pad=ビープ音は、シーンが待っているフレームへ視線を導きます。フレームのある側で鳴り、音の高さで上下を示します。右スティックで視線を動かしてください。二重の音は視線がフレームに合っていることを示します。{0}：フレームの位置。{1}：視線ビーコンのオフとオン。
help.turn=ビープ音は、手に持った物の回転を、それが明らかになる位置まで導きます。右または左で鳴り、上下に回すときは音の高さで示し、近づくほど速くなります。二重の音は、明らかになったことを示します。{0}：回す方向と残り。{1}：視線ビーコンのオフとオン。
help.boiler=圧力ランプが点くと二重の音が鳴ります。点いている間（約2秒）にすぐ{0}を押してください。ランプが消えているときに押すと失敗し、最初からやり直しになります。回したあとは{0}を離してください。つかんだときから押したままのボタンは、ランプが点く前にすぐ判定されます。
help.shake=スノードームは振ることができます：WかSを押します。ゲームはこれを表示しません。
help.shake.pad=スノードームは振ることができます：左スティックを上か下に倒します。ゲームはこれを表示しません。
help.shake.ps=スノードームは振ることができます：コントローラー自体を振ります。ゲームはモーションセンサーでそれを感知します。ゲームはこれを表示しません。
help.shake.ps.off=スノードームは振ることができますが、ゲームの操作設定で「{0}」がオフの間は、このコントローラーでは振れません。キーボードのWかSを押すか、その設定をオンにしてください。ゲームはこれを表示しません。
help.gesture=左スティックで半円：時計回りはスティックをいっぱいに上、次に右、次に下へ。反時計回りは上、次に左、次に下へ。各操作は前の操作から0.5秒以内に行います。キーボードではプロンプトのキーですぐに行えます。
help.gesture.held=ここでは{0}を押したまま半円を描きます。離すと持っている物を落とします。
help.swipe.held=ここでは{0}を押したまま動かします。先に{0}を押し続け、それから一度だけ動かしてください。動かした瞬間に判定され、そのまま保持しても何も起きません。
interact.nomatches=マッチがありません。
interact.lamp=ランプが点灯しました。
interact.now=今です。
interact.linear.forward=進む方向：{0}。
interact.linear.back=戻る方向：{0}。
interact.dial.position=位置 {0}。
help.walk={0} でキャラクターが目標まで歩きます。もう一度押すと止まります。
help.looksound=対象が視線を待っている間、{0}はビーコンではなく視線ビーコンをオン・オフします。
help.beam=梁の上では、スティックはキャラクターを向いている方向にだけ動かします。後ろに倒すと向きを変えます。ビーコンがスティックを梁に沿って導き、{0} で梁の上を進みます。
help.lookturn.pad=キャラクターをその場で目標の方へ向けるには、{0}を音の方向へ半分未満まで軽く倒し、1秒以内に離してください。深く倒し続けると歩き出します。カメラが目標を見る必要があるときは、{1}でカメラを音の方向へ向けてください。
help.lookturn=キャラクターをその場で目標の方へ向けるには、音の方向の移動キーを短く押してください。押し続けると歩き出します。
help.where={0} で目標を、経路に沿った距離と方向とともにもう一度読み上げます。
