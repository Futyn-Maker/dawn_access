help.explore={0} と {1} で向かう先を選び、{2} でビーコンをオンまたはオフにします。ビーコンは目標のある側から聞こえ、近づくほど高くなります。目標が後ろにあるときは1オクターブ下がります。移動キーで音のほうへ歩いてください。
help.explore.pad=ゲームパッドでは歩行中、同時押しは不要です：{0} 次の目標、{1} 前の目標、{2} 目標の位置、{3} ビーコン、{4} 目標まで歩く。
