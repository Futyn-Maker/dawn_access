help.totem=ビープ音はトーテムの予兆の位置を示します。視界の中心から見てその側で、上または下に鳴ります。左スティックをその方へ倒してください。二重のピン音は視線がその上にあることを意味します。幻視が始まるまでそのままにしてください。{0}：視線ビーコンのオフとオン。
help.swipe=電話は素早いスワイプを何度か続けるとロック解除されます。{0}を素早く何度も繰り返してください。スワイプのたびにスライダーが少し進み、最後のスワイプから少しすると戻っていきます。ビープ音は満ちるにつれて高くなり、戻るにつれて低くなります。
