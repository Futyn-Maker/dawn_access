help.shoot=Apunte con el mouse o con las teclas de movimiento. Los pitidos suenan en el oído del lado del objetivo, más agudos cuando está por encima de la mira y más graves cuando está por debajo, y se aceleran a medida que la mira se acerca; un doble pitido rápido significa que el juego contaría ahora un disparo al objetivo. {0} dispara. {1} y {2} cambian de objetivo, {3} dice dónde está el objetivo, {4} desactiva y activa el sonido de puntería.
help.shoot.pad=Apunte con el stick derecho. Los pitidos suenan en el oído del lado del objetivo, más agudos cuando está por encima de la mira y más graves cuando está por debajo, y se aceleran a medida que la mira se acerca; un doble pitido rápido significa que el juego contaría ahora un disparo al objetivo. {0} dispara. {1} y {2} cambian de objetivo, {3} dice dónde está el objetivo, {4} desactiva y activa el sonido de puntería. En un DualSense con los gatillos adaptativos activados, el disparo solo cuenta cuando el gatillo se aprieta más allá de su resistencia.
help.gesture=Un semicírculo con el stick izquierdo: en el sentido de las manecillas del reloj, empújelo a fondo hacia arriba, luego a la derecha, luego abajo; en sentido contrario, arriba, luego a la izquierda, luego abajo; cada paso a menos de medio segundo del anterior. En el teclado, la tecla del indicador lo hace de inmediato.
help.walk={0} lleva al personaje hasta el objetivo; púlselo otra vez para detenerlo.
help.looksound=Mientras el objetivo espera una mirada, {0} activa y desactiva la baliza de mirada en lugar de la baliza.
help.lookturn.pad=Para girar al personaje hacia el objetivo sin moverlo de su lugar, empuje el {0} suavemente hacia el sonido, menos de la mitad, y suéltelo antes de un segundo; si lo empuja más y lo mantiene, el personaje comienza a caminar. Cuando la cámara deba mirar al objetivo, gírela hacia el sonido con el {1}.
help.lookturn=Para girar al personaje hacia el objetivo sin moverlo de su lugar, presione brevemente una tecla de movimiento hacia el sonido; si la mantiene, el personaje comienza a caminar.
help.where={0} repite el objetivo con la distancia por el camino y la dirección.
