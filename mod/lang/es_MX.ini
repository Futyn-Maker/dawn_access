dontmove.steer=Responde a cada señal con un toque breve de {0}; el doble pitido dice que el marcador volvió.
dontmove.passive=Mantén el control quieto.
help.dontmove.active=Cuenta las notas. El doble pitido cada medio segundo significa que el marcador está dentro y no se pide nada. Dos notas iguales en un oído significan: da un toque breve de {0} hacia ese lado, ya. Tres notas ascendentes, hacia arriba; tres descendentes, hacia abajo. Un golpe sordo antes de la señal significa que el marcador ya pasó el borde; la señal indica entonces el camino de vuelta al centro. Responde con un solo toque breve, como un clic, en cuanto oigas la señal, y escucha: el doble pitido significa que el marcador volvió; el mismo golpe con señal otra vez, un toque más; una señal desde el lado opuesto, que te pasaste, un toque de vuelta. Una pulsación sostenida cruza toda la zona en una décima de segundo. El juego jala el marcador a tirones, una dirección cada vez, con unos segundos entre ellos; un tirón respondido en unos tres cuartos de segundo no cuesta nada, después cada instante más allá del borde gasta una reserva que nunca se rellena, y la señal del reloj suena al irse la mitad y tres cuartos. Los ajustes del propio juego de sensibilidad de teclas y de stick para No te muevas hacen los toques más suaves.
help.dontmove.passive=Mantén el control quieto. El doble pitido cada medio segundo significa que el marcador está en el centro. Un pitido suena hacia donde se ha desviado el marcador, de su lado y más agudo si está arriba, más rápido cuanto más lejos; un golpe sordo antes del pitido significa que pasó el borde y el tiempo puede estar corriendo.
