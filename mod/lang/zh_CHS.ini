help.shoot=请用鼠标或移动键瞄准。提示音在目标所在一侧的耳朵中响起，目标高于准星时音调更高，低于准星时更低，准星越接近目标，提示音越快；快速的双响表示此时开枪，游戏会判定击中目标。{0}：射击。{1} 和 {2}：切换目标。{3}：目标位置。{4}：关闭和开启瞄准提示音。
help.shoot.pad=请用右摇杆瞄准。提示音在目标所在一侧的耳朵中响起，目标高于准星时音调更高，低于准星时更低，准星越接近目标，提示音越快；快速的双响表示此时开枪，游戏会判定击中目标。{0}：射击。{1} 和 {2}：切换目标。{3}：目标位置。{4}：关闭和开启瞄准提示音。在开启自适应扳机的DualSense上，只有把扳机扣过阻力点，射击才会生效。
