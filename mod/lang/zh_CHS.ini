help.nudge=提示音引导视线到场景等待的画面：从画面所在的一侧响起，音调高低表示上下。请用鼠标或方向键转动视线；双响表示视线已落在画面上。{0}：画面位置。{1}：关闭和开启视线导航音。
help.nudge.pad=提示音引导视线到场景等待的画面：从画面所在的一侧响起，音调高低表示上下。请用右摇杆转动视线；双响表示视线已落在画面上。{0}：画面位置。{1}：关闭和开启视线导航音。
help.turn=提示音引导你转动手中的物品，直到它显露出来的位置：在右侧或左侧响起，向上或向下转时用音调高低表示，越接近越快。双响表示已经显露。{0}：转动方向和剩余多少。{1}：关闭和开启视线导航音。
help.boiler=压力灯亮起时会响起双响：趁灯亮着（约两秒）立即按下{0}；灯灭时按下会失败，并且一切重新开始。转动之后请松开{0}：从抓握时一直按住的按钮会在灯亮之前立即被判定。
help.shake=可以摇晃雪花球：按 W 或 S。游戏不会为此显示提示。
help.shake.pad=可以摇晃雪花球：将左摇杆向上或向下推。游戏不会为此显示提示。
help.shake.ps=可以摇晃雪花球：摇晃手柄本身；游戏会通过动作感应器感知到。游戏不会为此显示提示。
help.shake.ps.off=可以摇晃雪花球，但在游戏的控制设置中关闭“{0}”时，无法用这个手柄摇晃：请按键盘上的 W 或 S，或开启该设置。游戏不会为此显示提示。
help.gesture=用左摇杆画半圆：顺时针时把摇杆推到底向上，然后向右，然后向下；逆时针时向上，然后向左，然后向下；每一步都要在上一步之后半秒内完成。使用键盘时，按提示中的键即可立即完成。
help.gesture.held=这里要按住{0}画半圆：松开它，手里的东西就会掉落。
help.swipe.held=这里要按住{0}做动作：先按住{0}不放，然后做一次动作；动作做出的那一刻就会生效，保持不动不会再有作用。
