help.walk={0} 让角色走向目标，再按一次停止。
help.looksound=目标等待注视时，{0}开关视线导航音，而不是导航音。
help.beam=在横梁上，摇杆只能让角色朝面对的方向移动；向后推会让角色转身。导航音引导摇杆沿横梁方向，{0} 沿横梁行走。
help.lookturn.pad=要让角色原地转向目标，请将{0}朝声音方向轻推不到一半，并在一秒内松开；推得更深并按住会让角色走动。需要镜头看向目标时，请用{1}把镜头转向声音方向。
help.lookturn=要让角色原地转向目标，请朝声音方向短按一下移动键；按住不放会让角色走动。
help.where={0} 再次报出目标，附带沿路线的距离和方向。
explore.place=地点
explore.face=转向它。
explore.look=看向它。
explore.noglint=游戏在这里没有显示闪光。
totem.vision=幻象。
