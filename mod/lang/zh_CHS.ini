help.dilemma.pad=用右摇杆转动准星：左边是{0}，右边是{1}。准星的声音从它所指的一侧传来；双响表示已选中那一侧。然后按{2}射击。什么都不做，时间就会耗尽，这也是一种选择。
help.dilemma=用鼠标或移动键转动准星：左边是{0}，右边是{1}。准星的声音从它所指的一侧传来；双响表示已选中那一侧。然后按{2}射击。什么都不做，时间就会耗尽，这也是一种选择。
