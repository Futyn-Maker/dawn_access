dontmove.steer=每次信号响起时用{0}短促地按一下；双响表示标记已经回来。
dontmove.passive=保持手柄静止。
help.dontmove.active=数音的个数。每半秒一次双响表示标记在区域内，无需操作。一只耳朵里的两个相同音表示：立即朝那一侧短按{0}。上行的三个音表示向上，下行的三个音表示向下。信号前的低沉一击表示标记已经越过边缘，此时信号指向回到中心的方向。一听到信号就像点击一样短按一次，然后听：双响表示标记已经回来；同样的一击和信号再次响起表示再短按一次；来自相反一侧的信号表示推过头了，朝回短按一次。按住不放会在十分之一秒内穿过整个区域。游戏每隔几秒把标记朝一个方向猛拉一次；在大约四分之三秒内应对的猛拉不会有任何损失，之后标记在边缘之外的每一刻都会消耗一个不会回满的储备，用掉一半和四分之三时会响起时钟信号。游戏自带的「别动」按键灵敏度和摇杆灵敏度设置可以让按压更柔和。
help.dontmove.passive=保持手柄静止。每半秒一次双响表示标记位于中心。短音在标记漂移到的位置响起，从它那一侧发出，它越靠上音越高，越远越急促；短音前的低沉一击表示它已越过边缘，计时可能正在进行。
