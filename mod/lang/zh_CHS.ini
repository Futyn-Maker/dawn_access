help.totem=提示音跟随图腾上的预兆：它在视野中心的哪一侧，就在哪一侧响起，偏高或偏低。把左摇杆推向它。双响表示视线正落在它上面：保持不动，直到幻象出现。{0}：关闭和开启视线导航音。
help.swipe=连续快速滑动几次后手机才会解锁：快速地反复执行{0}。每次滑动都会让滑块前进一点，最后一次滑动后片刻，它就会退回去。提示音随着滑块填满而升高，随着它退回而降低。
hud.objective=目标：{0}
