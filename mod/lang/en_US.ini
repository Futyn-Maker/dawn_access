help.shoot=Aim with the mouse or the movement keys. The blips sound in the ear on the side of the target, higher when it stands above the aim and lower when below, and come faster as the aim nears it; a quick double ping means the game would take a shot on the target now. {0} shoots. {1} and {2} switch between the targets, {3} says where the target is, {4} turns the aim sound off and on.
help.shoot.pad=Aim with the right stick. The blips sound in the ear on the side of the target, higher when it stands above the aim and lower when below, and come faster as the aim nears it; a quick double ping means the game would take a shot on the target now. {0} shoots. {1} and {2} switch between the targets, {3} says where the target is, {4} turns the aim sound off and on. On a DualSense with adaptive triggers on, the shot counts only once the trigger is pulled past its resistance.
