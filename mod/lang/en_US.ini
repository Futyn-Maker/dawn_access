turn.down=Turn down, {0}% to go.
help.nudge=The blips lead the view to the framing the scene waits for: on its side, higher or lower. Turn the view with the mouse or the arrow keys; the double ping means the view rests on it. {0} says where the framing is, {1} turns the look beacon off and on.
help.nudge.pad=The blips lead the view to the framing the scene waits for: on its side, higher or lower. Turn the view with the right stick; the double ping means the view rests on it. {0} says where the framing is, {1} turns the look beacon off and on.
help.turn=The blips lead the turn of the item in your hands to where it reveals: on the right or the left, or higher or lower for a turn up or down, quicker the nearer it is. The double ping means it is revealed. {0} says which way to turn and how much is left, {1} turns the look beacon off and on.
help.boiler=When the pressure lamp comes on, the double ping sounds: press {0} at once, while it is lit, for about two seconds; a press while it is dark fails and it all begins again. After the turn, let go of {0}: a button still held from the grab counts at once, before the lamp is lit.
help.gesture=A half circle with the left stick: clockwise, push it all the way up, then right, then down; anticlockwise, up, then left, then down; each step within half a second of the last. On the keyboard, the key in the prompt does it at once.
help.gesture.held=Here the half circle is made with {0} held: letting go of it drops what you hold.
