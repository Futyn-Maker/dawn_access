help.walk={0} walks the character to the target; press it again to stop.
help.looksound=While the target waits for a look, {0} switches the look beacon instead of the beacon.
help.beam=On a beam the stick moves the character only the way they face; pushing back turns them round. The beacon leads the stick along the beam, and {0} walks along it.
help.lookturn.pad=To turn the character toward the target on the spot, push the {0} lightly toward the sound, less than half way, and let go within a second; pushed further and held, it walks the character. When the camera must look at the target, turn it toward the sound with the {1}.
help.lookturn=To turn the character toward the target on the spot, tap a movement key toward the sound; held, the key walks the character.
