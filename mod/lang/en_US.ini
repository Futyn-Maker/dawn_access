; Dawn Access strings — English (master table). Placeholders {0}, {1} are filled by the mod.
; Every other language file must contain the same keys; scripts\check-lang.ps1 verifies this.
[strings]
greeting=Dawn Access {0} loaded. Screen reader: {1}. Language: {2}.
greeting.noreader=no screen reader, using SAPI
greeting.brief=Dawn Access loaded.
help.intro=Dawn Access help.
help.hotkeys={0} repeats the last message, {1} reads the current screen, {2} stops speech, {3} opens this help.
help.chords=On the gamepad, hold {0} and press {1} to repeat the last message, {2} to read the current screen, {3} to stop speech, {4} for this help.
read.focused=Focused: {0}.
read.nothing=Nothing to read.
read.last=Last message: {0}.
diag.dumped=Screen dump written.
diag.trace.on=Function trace on.
diag.trace.off=Function trace off.
diag.loglevel=Log level {0}.
verbosity.full=Verbosity: detailed.
verbosity.brief=Verbosity: brief.
speech.output=Speech: {0}.
speech.noreader=No screen reader is running; SAPI speaks.
help.speech={0} switches speech between the screen reader and SAPI.
help.speech.pad=With {0} held, {1} switches speech between the screen reader and SAPI.
help.verbosity={0} switches the verbosity level.
help.verbosity.pad=With {0} held, {1} switches the verbosity level.
onoff.off=Dawn Access off.
onoff.on=Dawn Access on.
help.onoff={0} turns the mod off and on.
help.onoff.pad=With {0} held, {1} turns the mod off and on.
help.diag={0} writes a dump of the screen for a problem report, {1} switches the log level.
help.diag.pad=With {0} held, {1} writes a dump of the screen for a problem report and {2} switches the log level.
