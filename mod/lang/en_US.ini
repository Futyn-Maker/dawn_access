help.totem=The blips follow the premonition on the totem: on the side it lies from the centre of the view, higher or lower. Push the left stick toward it. The double ping means the view is on it: hold still until the vision. {0} turns the look beacon off and on.
help.swipe=The phone unlocks after several swipes in quick succession: repeat {0} again and again, quickly. Each swipe moves the slider on a little, and it slides back a moment after the last one. The blips rise as it fills and fall as it slides back.
