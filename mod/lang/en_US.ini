help.dontmove.active=Count the notes. The double ping, every half second, means the marker is inside and nothing is asked. Two equal notes in one ear mean tap {0} to that side, now. Three notes rising mean tap up, three falling mean tap down. A low thud before the signal means the marker is already past the edge; the signal then points back to the middle. Answer with one brief tap, like a click, the moment you hear the signal, then listen: the double ping means the marker is back; the same thud and signal again mean tap once more; a signal from the opposite side means you overshot, tap back once. A held press crosses the whole zone in a tenth of a second. The game pulls the marker in bursts, one direction at a time, a few seconds apart; answered within about three quarters of a second a burst costs nothing, after that every moment past the edge drains a pool that never refills, and the clock cue sounds as half and three quarters of it are gone. The game's own Don't Move key and stick sensitivity settings make the taps gentler.
help.dontmove.passive=Hold the controller still. The double ping every half second means the marker sits in the middle. A blip sounds where the marker has drifted to, on its side and higher when it is up, quicker the further; a low thud before the blip means it is past the edge and the clock may be running.
