[Overrides]
; Path to the 'Mods' folder
; Default: <dll_directory>/Mods
; Only use this if you know what you're doing
ModsFolderPath =
; The path of a mods.txt that alone decides which mods are enabled; empty: none, and each mod's
; folder decides by its own enabled.txt, as the mod's does.
ControllingModsTxt =

[General]
; Whether the hot-reload system is enabled; it is of no use in the shipped mod.
EnableHotReloadSystem = 0
HotReloadKey = R
EnableAutoReloadingLuaMods = 0
; Whether to use the cache of scanned addresses; invalidated when the game's executable changes.
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
SecondsToScanBeforeGivingUp = 120
bUseUObjectArrayCache = true
bForceGUObjectArrayForIteration = false
DoEarlyScan = 0
bEnableSeachByMemoryAddress = false
DefaultExecuteInGameThreadMethod = EngineTick
DefaultFNameToStringMethod = Scan

[EngineVersionOverride]
MajorVersion =
MinorVersion =
DebugBuild =
Stats =

[ObjectDumper]
LoadAllAssetsBeforeDumpingObjects = 0
UseModuleOffsets = 0

[CXXHeaderGenerator]
DumpOffsetsAndSizes = 1
KeepMemoryLayout = 0
LoadAllAssetsBeforeGeneratingCXXHeaders = 0

[UHTHeaderGenerator]
IgnoreAllCoreEngineModules = 0
IgnoreEngineAndCoreUObject = 0
MakeAllFunctionsBlueprintCallable = 1
MakeAllPropertyBlueprintsReadWrite = 1
MakeEnumClassesBlueprintType = 1
MakeAllConfigsEngineConfig = 1

[SDKGenerator]
OutputPath =

[Debug]
; No console of UE4SS's own: a second window would take the focus from the game and the screen
; reader would read it.
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0
GuiConsoleFontScaling = 1
GuiConsoleMonospaceTextEditors = 0
GraphicsAPI = opengl
RenderMode = ExternalThread
ToggleGuiKey = O

[Threads]
SigScannerNumThreads = 8
SigScannerMultithreadingModuleSizeThreshold = 16777216

[Memory]
MaxMemoryUsageDuringAssetLoading = 85

[Hooks]
HookProcessInternal = 1
HookProcessLocalScriptFunction = 1
HookInitGameState = 1
HookLoadMap = 1
HookCallFunctionByNameWithArguments = 1
HookBeginPlay = 1
HookEndPlay = 1
HookLocalPlayerExec = 1
HookAActorTick = 1
HookEngineTick = 1
EngineTickResolveMethod = Scan
HookGameViewportClientTick = 1
HookUObjectProcessEvent = 1
HookProcessConsoleExec = 1
HookUStructLink = 1
FExecVTableOffsetInLocalPlayer = 0x28

[CrashDump]
; A fault on one of the mod's own threads or in UE4SS's event loop, which the engine's handler
; does not see, is written to crash_<date>.dmp beside UE4SS.dll.
EnableDumping = 1
FullMemoryDump = 0

[ExperimentalFeatures]
